.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }

tr.pick:hover td { background: var(--surface-2); }

.finding.sev-high { border-left-color: var(--bad); } .finding.sev-medium { border-left-color: var(--amber); } .finding.sev-low { border-left-color: var(--l0); } .finding.sev-info { border-left-color: var(--muted); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* fade: when something is selected, everything not connected to it steps back */
.fadeable { transition: opacity 0.18s ease; }
.focus .fadeable.dim { opacity: var(--fade, 0.22); }
.focus .medge.dim, .focus .e.dim { stroke-opacity: 0.05; }
.medge.bg { stroke: var(--muted); stroke-opacity: 0.10; stroke-width: 1; }
.focus .medge.bg { stroke-opacity: 0.03; }
.medge.hl, .e.hl { stroke-opacity: 1 !important; stroke-width: 2.4 !important; }
.fadebar { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.fadebar input[type=range] { width: 120px; accent-color: var(--accent); }
.todo { color: var(--amber); font-style: italic; }

the max-steps step; memory and the returned answer are correct.","evidence":"Read MultiStepAgent._run_stream and _handle_max_steps_reached in src/smolagents/agents.py: the finally block yields action_step, and the post-loop branch does `final_answer = self._handle_max_steps_reached(task)` followed by `yield action_step`; final_memory_step is local to _handle_max_steps_reached and not returned.","id":"max-steps-yields-stale-step","severity":"low","symbols":["smolagents.agents:MultiStepAgent._run_stream"],"title":"When max_steps runs out, the stream re-yields the previous ActionStep instead of the max-steps step"},{"_locs":[{"doc":"Stream agent responses for ChatInterface.","file":"src/smolagents/gradio_ui.py","line":378,"params":["self","message","history"],"symbol":"smolagents.gradio_ui:GradioUI._stream_response"},{"doc":"Process incoming message and extract text and files.","file":"src/smolagents/gradio_ui.py","line":362,"params":["self","message"],"symbol":"smolagents.gradio_ui:GradioUI._process_message"},{"doc":"","file":"src/smolagents/memory.py","line":191,"params":["self","summary_mode"],"symbol":"smolagents.memory:TaskStep.to_messages"},{"doc":"","file":"src/smolagents/utils.py","line":430,"params":["image"],"symbol":"smolagents.utils:encode_image_base64"}],"category":"risk","check":{"kind":"text_in","pattern":"images=task_files"},"detail":"True now: _stream_response calls agent.run(task, images=task_files) where task_files are path strings from _process_message. run stores them as TaskStep.task_images (and ActionStep.observations_images), and get_clean_message_list calls encode_image_base64(image), which does image.save(...) — a str has no save. Trigger: GradioUI with file_upload_folder set and a user attaching any file. Reach: the first model call of that turn raises, CodeAgent/ToolCallingAgent wrap it as AgentGenerationError and the run ends; with reset_agent_memory=False the bad TaskStep stays in memory and later turns fail too. Verified by reading, not executed (dependencies not installed in this clone).","evidence":"Read GradioUI._process_message/_stream_response (gradio_ui.py), MultiStepAgent.run/_run_stream (agents.py: images → TaskStep(task_images=images) and ActionStep(observations_images=images)), TaskStep.to_messages (memory.py: {'type': 'image', 'image': image}), get_clean_message_list (models.py) and encode_image_base64 (utils.py: image.save(buffered, format='PNG')).","id":"gradio-uploads-passed-as-images","severity":"medium","symbols":["smolagents.gradio_ui:GradioUI._stream_response","smolagents.gradio_ui:GradioUI._process_message","smolagents.memory:TaskStep.to_messages","smolagents.utils:encode_image_base64"],"title":"GradioUI passes uploaded file paths to agent.run as images, which cannot be encoded"},{"_locs":[{"doc":"Launch the Gradio app with the agent interface.","file":"src/smolagents/gradio_ui.py","line":422,"params":["self","share","**kwargs"],"symbol":"smolagents.gradio_ui:GradioUI.launch"}],"category":"risk","check":{"kind":"text_in","pattern":"share: bool = True"},"detail":"True now: launch(share=True) is the default, which asks Gradio for a public share link. Trigger: calling GradioUI(agent).launch() without share=False. Reach: anyone with the link can drive the agent — for a CodeAgent that means model-written code runs in LocalPythonExecutor on the host (documented as not a sandbox) with the agent's tools and API keys behind them, and every visitor shares one agent memory.","evidence":"Read GradioUI.launch (`def launch(self, share: bool = True, **kwargs)` → create_app().launch(debug=True, share=share)) and the LocalPythonExecutor docstring in local_python_executor.py.","id":"gradio-share-default","severity":"medium","symbols":["smolagents.gradio_ui:GradioUI.launch"],"title":"GradioUI.launch() shares the app publicly by default"},{"_locs":[{"doc":"Handle file upload with validation.","file":"src/smolagents/gradio_ui.py","line":335,"params":["self","file","file_uploads_log","allowed_file_type onOutput(output, is_final_answer)","stores":"ActionStep.model_input_messages, model_output_message, model_output, token_usage, code_action, tool_calls, observations, action_output","symbol":"smolagents.agents:CodeAgent._step_stream"},{"action":"Example provider behind self.model.generate (a virtual call — Model.generate is abstract): cleans the messages, applies rate limit and retry, calls chat.completions.create and wraps the reply in a ChatMessage. See the model-generate journey.","doc":"","file":"src/smolagents/models.py","line":1761,"params":["self","messages","stop_sequences","response_format","tools_to_call_from","**kwargs"],"payload":"\"Thought: convert speed, then divide.\\n<code>\\nspeed = 58 * 1000 / 3600\\nfinal_answer(155 / speed)\\n<\/code>\"\n\n","receives":"list[ChatMessage], stop_sequences, optional response_format (structured outputs)","returns":"ChatMessage(role='assistant', content=..., token_usage=...)","stores":"nothing","symbol":"smolagents.models:OpenAIModel.generate"},{"action":"Extracts the code: every match of the configured tag pair (default <code>…<\/code>) joined together, else markdown ```python blocks, else the whole text if it parses as Python; otherwise raises ValueError with a hint the model will see.","doc":"Extract code blocs from the LLM's output.","file":"src/smolagents/utils.py","line":198,"note":"With use_structured_outputs_internally the output is JSON instead and the code is read from its 'code' field.","params":["text","code_block_tags"],"receives":"model output text, code_block_tags","returns":"code string","stores":"nothing","symbol":"smolagents.utils:parse_code_blobs"},{"action":"If the code both calls final_answer( and assigns to a variable named final_answer, renames the variable to final_answer_variable so the tool is not shadowed.","doc":"Sometimes an LLM can try to assign a variable to final_answer, which would break the final_answer() tool. This function fixes this behaviour by replacing variable assignments to final_answer with final_answer_variable, while preserving function calls to final_answer().","file":"src/smolagents/local_python_executor.py","line":332,"params":["code"],"receives":"code string","returns":"code string (unchanged in the common case)","stores":"ActionStep.code_action","symbol":"smolagents.local_python_executor:fix_final_answer_code"},{"action":"Runs the code against the executor's persistent state, static tools and authorized imports, and packages output, print logs and the final-answer flag.","doc":"","file":"src/smolagents/local_python_executor.py","line":1747,"note":"Its docstring says plainly: 'It is not a security sandbox: for isolated execution of untrusted code, use a remote executor.'","params":["self","code_action"],"receives":"code_action: str","returns":"CodeOutput(output, logs, is_final_answer)","stores":"executor.state keeps every variable between steps (and between runs unless the agent is recreated)","symbol":"smolagents.local_python_executor:LocalPythonExecutor.__call__"},{"action":"ast.parse()s the code and walks each top-level node through evaluate_ast inside a thread with a 30 s timeout (MAX_EXECUTION_TIME_SECONDS); final_answer is wrapped to raise FinalAnswerException, a BaseException so generated 'except Exception' cannot swallow it.","doc":"Evaluate a python expression using the content of the variables stored in a state and only evaluating a given set of functions.","file":"src/smolagents/local_python_executor.py","line":1583,"note":"Limits enforced here and in evaluate_ast: MAX_OPERATIONS = 10,000,000 AST nodes, MAX_WHILE_ITERATIONS = 1,000,000, dunder attribute access refused, calls only to names in state, static tools, custom tools or ERRORS. On timeout the worker thread cannot be killed and keeps running in the background (stated in timeout's docstring).","params":["code","static_tools","custom_tools","state","authorized_imports","max_print_outputs_length","timeout_seconds"],"receives":"code, static_tools, custom_tools, state, authorized_imports, max_print_outputs_length","returns":"(result, is_final_answer)","stores":"state['_print_outputs'] (truncated to 50,000 chars by default), state['_operations_count']","symbol":"smolagents.local_python_executor:evaluate_python_code"},{"action":"The import allow-list: 'import x' / 'from x import y' succeed only if check_import_authorized finds x in BASE_BUILTIN_MODULES plus additional_authorized_imports ('*' allows anything); the module is copied via get_safe_module before it enters state.","doc":"","file":"src/smolagents/local_python_executor.py","line":1309,"note":"Results of evaluate_ast pass through check_safer_result (safer_eval), which also refuses unauthorized module objects and DANGEROUS_FUNCTIONS such as builtins.eval/exec and os.system.","params":["expression","state","authorized_imports"],"receives":"an ast.Import / ast.ImportFrom node, state, authorized_imports","returns":"None, or raises InterpreterError 'Import of os is not allowed…'","stores":"the imported module (or names) into state","symbol":"smolagents.local_python_executor:evaluate_import"},{"action":"After the loop, wraps the final answer in an AgentType (AgentText / AgentImage / AgentAudio) when its type is recognised, for the FinalAnswerStep.","doc":"","file":"src/smolagents/agent_types.py","line":263,"note":"If max_steps runs out, _handle_max_steps_reached first calls provide_final_answer, a tool-less model call over the memory, and records an ActionStep carrying AgentMaxStepsError.","params":["output","output_type"],"receives":"final answer value","returns":"AgentText('9.62…') or the raw value","stores":"FinalAnswerStep.output","symbol":"smolagents.agent_types:handle_agent_output_types"}],"summary":"run() rebuilds the system prompt, records the task in memory and hands tools and variables to the Python executor; _run_stream then loops over steps, each asking the model for a code blob, executing it in LocalPythonExecutor and storing the printed logs as the next observation. The loop ends when the executed code calls final_answer(), or when max_steps is reached and the model is asked for a final answer without tools.","title":"Run a CodeAgent: the model writes Python, the library executes it","trigger":"CodeAgent(tools, model).run(task)"},{"actor":"developer · Python code","id":"tool-calling-agent-run","steps":[{"action":"Records the task, resets memory, rebuilds the system prompt (as in code-agent-run); there is no python_executor, so nothing is sent to one.","actor":"developer code","doc":"Run the agent for the given task.","file":"src/smolagents/agents.py","line":436,"params":["self","task","stream","reset","images","additional_args","max_steps","return_full_result"],"payload":"agent.run(\"What is the population of Lyon divided by the population of Geneva?\")\n\n","receives":"task: str and run options","returns":"final answer or RunResult","stores":"memory.steps += TaskStep","symbol":"smolagents.agents:MultiStepAgent.run"},{"action":"Renders the toolcalling_agent.yaml system prompt with tools, managed agents and custom instructions.","doc":"","file":"src/smolagents/agents.py","line":1265,"params":["self"],"receives":"prompt_templates, tools, managed_agents","returns":"system prompt text","stores":"nothing","symbol":"smolagents.agents:ToolCallingAgent.initialize_system_prompt"},{"action":"Step loop with optional planning; calls the overridden ToolCallingAgent._step_stream (virtual call).","doc":"","file":"src/smolagents/agents.py","line":540,"params":["self","task","max_steps","images"],"receives":"task, max_steps","returns":"generator of steps and events","stores":"memory.steps += ActionStep per step","symbol":"smolagents.agents:MultiStepAgent._run_stream"},{"action":"Builds messages from memory and calls model.generate (or generate_stream) with tools_to_call_from = tools + managed agents; if the reply has no native tool_calls it asks the model class to parse them from the text, otherwise it JSON-decodes each call's arguments.","doc":"Perform one step in the ReAct framework: the agent thinks, acts, and observes the result. Yields ChatMessageStreamDelta during the run if streaming is enabled. At the end, yields either None if the step is not final, or the final answer.","file":"src/smolagents/agents.py","line":1276,"note":"A final_answer call mixed with other calls raises AgentExecutionError; two final answers raise AgentToolExecutionError. A string final answer that names a state key is replaced by that state value.","params":["self","memory_step"],"receives":"the current ActionStep","returns":"yields ToolCall / ToolOutput events, then ActionOutput(final_answer, is_final_answer)","stores":"ActionStep.model_output_message, model_output, token_usage","symbol":"smolagents.agents:ToolCallingAgent._step_stream"},{"action":"Provider call; tools are sent as JSON schemas (get_tool_json_schema) with tool_choice='required' by default.","doc":"","file":"src/smolagents/models.py","line":1761,"params":["self","messages","stop_sequences","response_format","tools_to_call_from","**kwargs"],"payload":"{\"tool_calls\": [{\"id\": \"call_7\", \"type\": \"function\", \"function\": {\"name\": \"web_search\", \"arguments\": \"{\\\"query\\\": \\\"Lyon population 2024\\\"}\"}}]}\n\n","receives":"messages, stop_sequences, tools_to_call_from","returns":"ChatMessage whose tool_calls hold the provider's tool-call objects","stores":"nothing","symbol":"smolagents.models:OpenAIModel.generate"},{"action":"Fallback for providers that return the call as text: sets role to assistant and builds one ChatMessageToolCall from the JSON blob in the content (keys tool_name_key / tool_arguments_key, default 'name' / 'arguments').","doc":"Sometimes APIs do not return the tool call as a specific object, so we need to parse it.","file":"src/smolagents/models.py","line":583,"note":"Failure here becomes AgentParsingError, which the loop feeds back to the model.","params":["self","message"],"receives":"ChatMessage without tool_calls","returns":"the same ChatMessage with tool_calls filled and arguments JSON-decoded","stores":"nothing","symbol":"smolagents.models:Model.parse_tool_calls"},{"action":"Turns each model tool call into a ToolCall event, then runs them: one call directly, several in a ThreadPoolExecutor(max_tool_threads) with copied contextvars, yielding results as they complete.","doc":"Process tool calls from the model output and update agent memory.","file":"src/smolagents/agents.py","line":1361,"params":["self","chat_message","memory_step"],"receives":"ChatMessage with tool_calls, the ActionStep","returns":"yields ToolCall, then ToolOutput per call","stores":"ActionStep.tool_calls (sorted by id) and observations (each result's observation joined by newlines)","symbol":"smolagents.agents:ToolCallingAgent.process_tool_calls"},{"action":"Executes one call and turns the result into an observation: AgentImage/AgentAudio results are stored in state as image.png / audio.mp3 and summarised, anything else becomes str(result).","doc":"","file":"src/smolagents/agents.py","line":1383,"params":["tool_call"],"payload":"ToolOutput(id=\"call_7\", output=\"## Search Results\\n\\n[Lyon - Wikipedia](https://en.wikipedia.org/wiki/Lyon)\\n...\", is_final_answer=False, observation=\"## Search Results ...\")\n\n","receives":"ToolCall(name, arguments, id)","returns":"ToolOutput(id, output, is_final_answer, observation, tool_call)","stores":"self.state['image.png'] or ['audio.mp3'] for media results","symbol":"smolagents.agents:ToolCallingAgent.process_tool_calls.process_single_tool_call"},{"action":"Refuses unknown tool names, replaces any string argument that equals a state key with the state value, validates the arguments, then calls the tool with sanitize_inputs_outputs=True (managed agents are called without it).","doc":"Execute a tool or managed agent with the provided arguments.","file":"src/smolagents/agents.py","line":1453,"note":"Validation failures become AgentToolCallError and execution failures AgentToolExecutionError, both with a 'Please try again' message the model reads on the next step.","params":["self","tool_name","arguments"],"receives":"tool_name, arguments (dict or single value)","returns":"the tool's output","stores":"nothing","symbol":"smolagents.agents:ToolCallingAgent.execute_tool_call"},{"action":"Checks each argument name is in tool.inputs, its JSON type matches (integer accepted for number, 'any' accepts all, null only when nullable), and every non-nullable input is present.","doc":"Validate tool arguments against tool's input schema.","file":"src/smolagents/tools.py","line":1361,"params":["tool","arguments"],"receives":"Tool, arguments","returns":"None, or raises ValueError / TypeError","stores":"nothing","symbol":"smolagents.tools:validate_tool_arguments"},{"action":"Runs the tool (see the tool-call journey): lazy setup, AgentType inputs unwrapped, forward(), output wrapped by output_type.","doc":"","file":"src/smolagents/tools.py","line":231,"params":["self","sanitize_inputs_outputs","*args","**kwargs"],"receives":"keyword arguments","returns":"AgentText / AgentImage / AgentAudio or raw value","stores":"nothing","symbol":"smolagents.tools:Tool.__call__"},{"action":"On the next step, write_memory_to_messages replays this step to the model: assistant output, a TOOL_CALL message listing the calls, a TOOL_RESPONSE 'Observation:' message, and any error with a retry hint.","doc":"","file":"src/smolagents/memory.py","line":92,"params":["self","summary_mode"],"receives":"the stored ActionStep","returns":"list[ChatMessage]","stores":"nothing","symbol":"smolagents.memory:ActionStep.to_messages"}],"summary":"Same run/_run_stream loop as CodeAgent, but each step sends the tools as JSON schemas and expects tool calls back (native API tool calls, or a JSON blob parsed from text). Each call is checked against the tool's input schema and executed — several in parallel threads — and the stringified results become the step's observation; calling the final_answer tool ends the run.","title":"Run a ToolCallingAgent: the model returns JSON tool calls","trigger":"ToolCallingAgent(tools, model).run(task)"},{"actor":"agent step","id":"model-generate","steps":[{"action":"Builds completion kwargs (model id, role conversions, images as data URLs), rate-limits, calls client.chat.completions.create through the retryer, strips text after stop sequences for models that ignore 'stop', and builds the ChatMessage.","actor":"CodeAgent._step_stream / ToolCallingAgent._step_stream","doc":"","file":"src/smolagents/models.py","line":1761,"note":"The agent calls the Model through generate (Model.__call__ is just an alias); the base Model.generate raises NotImplementedError, so the provider subclass decides everything below.","params":["self","messages","stop_sequences","response_format","tools_to_call_from","**kwargs"],"receives":"list[ChatMessage], stop_sequences, response_format, tools_to_call_from","returns":"ChatMessage(role, content, tool_calls, raw=response, token_usage)","stores":"nothing","symbol":"smolagents.models:OpenAIModel.generate"},{"action":"Assembles the request dict in priority order: cleaned messages, then stop / response_format / tools (+ tool_choice, default 'required'), then explicit kwargs, then the model's own self.kwargs (REMOVE_PARAMETER deletes a key).","doc":"Prepare parameters required for model invocation.","file":"src/smolagents/models.py","line":502,"note":"stop is sent only if supports_stop_parameter(model_id) is true (some reasoning models reject it).","params":["self","messages","stop_sequences","response_format","tools_to_call_from","custom_role_conversions","convert_images_to_image_urls","tool_choice","**kwargs"],"payload":"{\"model\": \"gpt-4.1-mini\", \"messages\": [{\"role\": \"system\", \"content\": [{\"type\": \"text\", \"text\": \"You are an expert assistant ...\"}]}, {\"role\": \"user\", \"content\": [{\"type\": \"text\", \"text\": \"New task:\\nHow many seconds ...\"}]}], \"stop\": [\"Observation:\", \"Calling tools:\", \"<\/code>\"]}\n\n","receives":"messages and the specific parameters","returns":"completion_kwargs dict","stores":"nothing","symbol":"smolagents.models:Model._prepare_completion_kwargs"},{"action":"Deep-copies the messages, maps roles (tool-call and tool-response roles become assistant / user via tool_role_conversions), base64-encodes images (as image_url data URLs when asked), and merges consecutive messages of the same role.","doc":"Creates a list of messages to give as input to the LLM. These messages are dictionaries and chat template compatible with transformers LLM chat template. Subsequent messages with the same role will be concatenated to a single message.","file":"src/smolagents/models.py","line":332,"note":"Images must be PIL images: encode_image_base64 calls image.save().","params":["message_list","role_conversions","convert_images_to_image_urls","flatten_messages_as_text"],"receives":"list[ChatMessage | dict], role_conversions, image flags","returns":"list of {'role', 'content'} dicts","stores":"nothing","symbol":"smolagents.models:get_clean_message_list"},{"action":"For tool-calling requests, converts each Tool's name, description and inputs into an OpenAI-style function schema; inputs not marked nullable are listed as required.","doc":"","file":"src/smolagents/models.py","line":288,"params":["tool"],"receives":"Tool","returns":"{'type': 'function', 'function': {'name', 'description', 'parameters'}}","stores":"nothing","symbol":"smolagents.models:get_tool_json_schema"},{"action":"Calls RateLimiter.throttle, which sleeps just long enough to respect requests_per_minute (no-op when unset).","doc":"Apply rate limiting before making API calls.","file":"src/smolagents/models.py","line":1189,"params":["self"],"receives":"nothing","returns":"nothing","stores":"the limiter's last-call timestamp","symbol":"smolagents.models:ApiModel._apply_rate_limit"},{"action":"Calls the client; on an exception that is_rate_limit_error recognises ('429', 'rate limit', 'too many requests' in the message) it sleeps with exponential backoff and jitter and tries again, up to RETRY_MAX_ATTEMPTS = 3; any other exception is re-raised at once.","doc":"","file":"src/smolagents/utils.py","line":551,"note":"The delay starts from RETRY_WAIT = 60 s and is multiplied before the first sleep, so the first wait is 120–240 s. retry=False on the model sets max_attempts to 1.","params":["self","fn","*args","**kwargs"],"receives":"client function and completion kwargs","returns":"the provider response","stores":"nothing (logs each retry through the module logger)","symbol":"smolagents.utils:Retrying.__call__"},{"action":"When the provider was not sent 'stop', cuts the reply at the first stop sequence locally.","doc":"Remove content after any stop sequence is encountered.","file":"src/smolagents/models.py","line":79,"params":["content","stop_sequences"],"receives":"content, stop_sequences","returns":"trimmed content","stores":"nothing","symbol":"smolagents.models:remove_content_after_stop_sequences"},{"action":"Called by ToolCallingAgent when the ChatMessage has no tool_calls: builds one from the text with get_tool_call_from_text and JSON-decodes arguments.","doc":"Sometimes APIs do not return the tool call as a specific object, so we need to parse it.","file":"src/smolagents/models.py","line":583,"params":["self","message"],"receives":"ChatMessage","returns":"ChatMessage with tool_calls","stores":"nothing","symbol":"smolagents.models:Model.parse_tool_calls"},{"action":"Reads the tool name and arguments keys from the parsed JSON blob and gives the call a fresh uuid4 id.","doc":"","file":"src/smolagents/models.py","line":400,"params":["text","tool_name_key","tool_arguments_key"],"payload":"'Action: {\"name\": \"final_answer\", \"arguments\": {\"answer\": \"about 2.2\"}}'  ->  ChatMessageToolCall(id=\"4f1c…\", function=ChatMessageToolCallFunction(name=\"final_answer\", arguments={\"answer\": \"about 2.2\"}))\n\n","receives":"text, tool_name_key, tool_arguments_key","returns":"ChatMessageToolCall","stores":"nothing","symbol":"smolagents.models:get_tool_call_from_text"},{"action":"Takes the text from the first '{' to the last '}' and json.loads it (strict=False); errors become ValueError messages written for the model, including a hint when it tried to send several calls.","doc":"Extracts the JSON blob from the input and returns the JSON data and the rest of the input.","file":"src/smolagents/utils.py","line":166,"params":["json_blob"],"receives":"text","returns":"(dict, text before the JSON)","stores":"nothing","symbol":"smolagents.utils:parse_json_blob"}],"summary":"An API model (OpenAIModel shown; LiteLLMModel and InferenceClientModel follow the same shape) flattens ChatMessages into provider dicts, adds stop sequences, tool schemas and the model's own kwargs, waits on its rate limiter and calls the client through a retryer that only retries rate-limit errors. The reply becomes a ChatMessage with content, tool_calls and token usage; if tool calls came back as text, parse_tool_calls extracts them from a JSON blob.","title":"Turn chat messages into a provider request and back","trigger":"self.model.generate(messages, stop_sequences=..., tools_to_call_from=...)"},{"actor":"user · terminal","id":"cli-run","steps":[{"action":"Parses arguments; with no positional prompt switches to interactive_mode, otherwise copies the parsed options; then calls run_smolagent.","actor":"terminal","doc":"","file":"src/smolagents/cli.py","line":262,"params":[],"payload":"smolagent \"Summarise today's top AI news\" --model-type InferenceClientModel --model-id Qwen/Qwen3-Next-80B-A3B-Thinking --tools web_search visit_webpage --imports numpy\n\n","receives":"sys.argv","returns":"None","stores":"nothing","symbol":"smolagents.cli:main"},{"action":"argparse definition: prompt (optional), --model-type (default InferenceClientModel), --action-type (code | tool_calling), --model-id, --imports, --tools (default web_search), --verbosity-level, --provider, --api-base, --api-key.","doc":"","file":"src/smolagents/cli.py","line":45,"note":"--verbosity-level is parsed but never passed to the agent.","params":[],"receives":"command line","returns":"argparse.Namespace","stores":"nothing","symbol":"smolagents.cli:parse_arguments"},{"action":"Rich prompts for action type, tools (showing TOOL_MAPPING descriptions), model type, model id, optional provider / API base / key / imports, and the task.","doc":"Run the CLI in interactive mode","file":"src/smolagents/cli.py","line":110,"note":"action_type is reset to 'code' after the question, and the offered model type 'OpenAIServerModel' is not a name load_model accepts — see findings.","params":[],"receives":"keyboard input","returns":"(prompt, tools, model_type, model_id, provider, api_base, api_key, imports, action_type)","stores":"nothing","symbol":"smolagents.cli:interactive_mode"},{"action":"load_dotenv(), load the model, resolve tool names (a name containing '/' becomes Tool.from_space, otherwise TOOL_MAPPING[name]()), build the agent with stream_outputs=True and run it.","doc":"","file":"src/smolagents/cli.py","line":219,"note":"An unknown tool name raises ValueError before any model call.","params":["prompt","tools","model_type","model_id","api_base","api_key","imports","provider","action_type"],"receives":"prompt, tool names, model options, imports, action_type","returns":"None (the run's answer is not returned or printed by the CLI itself)","stores":"environment variables from a .env file into os.environ","symbol":"smolagents.cli:run_smolagent"},{"action":"Maps model_type to a class: OpenAIModel (api_base defaults to the Fireworks endpoint, key from FIREWORKS_API_KEY), LiteLLMModel, TransformersModel (device_map='auto'), InferenceClientModel (token from HF_API_KEY); anything else raises ValueError.","doc":"","file":"src/smolagents/cli.py","line":188,"params":["model_type","model_id","api_base","api_key","provider"],"receives":"model_type, model_id, api_base, api_key, provider","returns":"a Model instance","stores":"nothing","symbol":"smolagents.cli:load_model"},{"action":"For a tool name like 'user/space', wraps a Hugging Face Space as a Tool via gradio_client, with the space name as tool name.","doc":"Creates a [`Tool`] from a Space given its id on the Hub.","file":"src/smolagents/tools.py","line":600,"params":["space_id","name","description","api_name","token"],"receives":"space_id, name, description","returns":"SpaceToolWrapper","stores":"nothing","symbol":"smolagents.tools:Tool.from_space"},{"action":"Loads the code_agent.yaml prompts, computes authorized_imports = BASE_BUILTIN_MODULES + --imports, picks code-block tags, runs MultiStepAgent setup (tools, final_answer tool, memory, logger, monitor) and creates the executor.","doc":"","file":"src/smolagents/agents.py","line":1527,"note":"stream_outputs=True requires the model to implement generate_stream, else ValueError.","params":["self","tools","model","prompt_templates","additional_authorized_imports","planning_interval","executor","executor_type","executor_kwargs","max_print_outputs_length","stream_outputs","use_structured_outputs_internally","code_block_tags","**kwargs"],"receives":"tools, model, additional_authorized_imports, stream_outputs=True","returns":"CodeAgent","stores":"agent.memory, agent.python_executor","symbol":"smolagents.agents:CodeAgent.__init__"},{"action":"executor_type 'local' (the CLI's only choice) gives LocalPythonExecutor, which checks that every authorized import is installed; remote types map to Blaxel/E2B/Docker/Modal executors.","doc":"","file":"src/smolagents/agents.py","line":1598,"params":["self"],"receives":"executor_type, additional_authorized_imports","returns":"PythonExecutor","stores":"nothing","symbol":"smolagents.agents:CodeAgent.create_python_executor"},{"action":"Runs the task as in code-agent-run; with stream_outputs the model's tokens are shown live in the terminal through rich.Live.","doc":"Run the agent for the gi cutors","owns":"Where a CodeAgent's snippet actually runs: LocalPythonExecutor (an AST interpreter in the host process with an import allow-list and operation caps) and the remote executors (E2B, Docker, Modal, Blaxel) that run it in a Jupyter kernel elsewhere, plus the JSON-first serializer that carries variables and final answers across that boundary."},{"id":"memory","name":"Memory & monitoring","owns":"The run's record, held in memory only (nothing is written to disk or a database unless the caller saves it): AgentMemory with SystemPromptStep / TaskStep / PlanningStep / ActionStep / FinalAnswerStep, each able to turn itself back into chat messages for the next model call; token and timing counters (TokenUsage, Timing, Monitor) and the rich console logger."},{"id":"utils","name":"Shared helpers & types","owns":"Leaf helpers every layer uses: the AgentError family, code-blob and JSON parsing out of model text, BASE_BUILTIN_MODULES, RateLimiter and Retrying, source extraction for saving tools; and the AgentText/AgentImage/AgentAudio wrappers that let tools return media."}],"lazyCycles":[],"meta":{"audience":"learning the code","lede":"smolagents runs a language model in a loop until a task is done: on each step the model writes either a Python snippet (CodeAgent) or JSON tool calls (ToolCallingAgent), the library runs that action, and the result goes back into the next prompt. The agent loop in agents.py sits in the middle: models.py turns its memory into provider requests, tools.py and default_tools.py supply the callable tools, and local_python_executor.py or remote_executors.py run the code, while memory.py, monitoring.py and the CLI and Gradio front ends record the run and show it.","title":"smolagents"},"modules":{"smolagents":{"call_sites":0,"cli":false,"doc":"","exports":[],"file":"src/smolagents/__init__.py","funcs":[],"imports":[],"layer":"interfaces","lazy_imports":[],"lines":32,"note":{"does":"Re-exports the public names of every submodule with star impo l._prepare_completion_kwargs"},{"doc":"","file":"src/smolagents/models.py","line":1161,"params":["self","model_id","custom_role_conversions","client","requests_per_minute","retry","**kwargs"],"symbol":"smolagents.models:ApiModel.__init__"},{"doc":"Sometimes APIs do not return the tool call as a specific object, so we need to parse it.","file":"src/smolagents/models.py","line":583,"params":["self","message"],"symbol":"smolagents.models:Model.parse_tool_calls"}],"config":"Chosen in code by the caller: the Model subclass and its constructor arguments (`model_id`, `api_key`/`token`, `api_base`, `client_kwargs`, `requests_per_minute`, `retry`, any extra kwarg forwarded to the provider). The CLI's `load_model` maps `--model-type/--model-id/--api-base/--api-key/--provider` onto these.","cost":"Not measured by the library: it reports input/output token counts per step, never money.","id":"model-gateway","input":"A list of ChatMessage built by the agent from memory (`write_memory_to_messages`), plus stop_sequences, an optional response_format and, for ToolCallingAgent, the tool list turned into JSON schemas by `get_tool_json_schema`.","kind":"model","logging":"Retries are logged through the module logger at INFO (before sleep / after attempt). Token counts come back on each ChatMessage and are summed by the agent (Monitor, RunResult).","message":["`_prepare_completion_kwargs` cleans the message list (`get_clean_message_list`: merges consecutive same-role messages, maps tool-call → assistant and tool-response → user, optionally flattens content to text, converts images to data URLs)","adds `stop` only when `supports_stop_parameter(model_id)` is true (o3/o4/gpt-5/grok are excluded), `response_format`, `tools` + `tool_choice`","then caller kwargs, then the Model's own constructor kwargs win last (REMOVE_PARAMETER deletes a key)"],"name":"Model gateway (Model base class)","output":"A ChatMessage (role, content, tool_calls, raw provider response, TokenUsage) — or a stream of ChatMessageStreamDelta that `agglomerate_stream_deltas` folds into one.","purpose":"Every model call an agent makes goes through `model.generate(...)` (or `generate_stream`), so the loop is written once and the provider is swapped by passing a different Model subclass.","result_use":"The agent stores the ChatMessage on the current memory step and parses code or tool calls out of it.","symbols":["smolagents.models:Model.generate","smolagents.models:Model._prepare_completion_kwargs","smolagents.models:ApiModel.__init__","smolagents.models:Model.parse_tool_calls"],"validation":"API models wrap the client call in `utils.Retrying`: up to RETRY_MAX_ATTEMPTS (3) attempts, base wait RETRY_WAIT (60 s) with exponential backoff and jitter, but only when `is_rate_limit_error` finds '429'/'rate limit'/'too many requests' in the exception text; every other error is re-raised. `RateLimiter.throttle` spaces calls when `requests_per_minute` is set. When the provider ignores `stop`, `remove_content_after_stop_sequences` trims the text afterwards. `parse_tool_calls` recovers a tool call from plain text when the provider returned none."},{"_locs":[{"doc":"","file":"src/smolagents/models.py","line":1553,"params":["self","messages","stop_sequences","response_format","tools_to_call_from","**kwargs"],"symbol":"smolagents.models:InferenceClientModel.generate"},{"doc":"","file":"src/smolagents/models.py","line":1591,"params":["self","messages","stop_sequences","response_format","tools_to_call_from","**kwargs"],"symbol":"smolagents.models:InferenceClientModel.generate_stream"},{"doc":"Create the Hugging Face client.","file":"src/smolagents/models.py","line":1547,"params":["self"],"symbol":"smolagents.models:InferenceClientModel.create_client"}],"config":"`model_id`, `provider`, `token`/`api_key` (falls back to the HF_TOKEN environment variable), `timeout`, `bill_to`, `base_url`, `client_kwargs`. The CLI passes `--api-key` or the HF_API_KEY environment variable.","cost":"Not measured; `bill_to` routes billing to an organisation.","id":"hf-inference","kind":"external","logging":"Module logger on retries.","message":["chat_completion(messages, stop, response_format, tools, tool_choice …) with model, provider, token, timeout, bill_to, base_url set on the client"],"name":"Hugging Face Inference (InferenceClient)","output":"OpenAI-shaped `choices[0].message` and usage, wrapped into a ChatMessage.","purpose":"The default hosted backend: calls `huggingface_hub.InferenceClient.chat_completion` on HF Inference Providers or a dedicated endpoint.","result_use":"Returned as the step's ChatMessage.","symbols":["smolagents.models:InferenceClientModel.generate","smolagents.models:InferenceClientModel.generate_stream","smolagents.models:InferenceClientModel.create_client"],"validation":"Rate-limit retries via ApiModel.retryer. `generate` raises ValueError when `response_format` is given for a provider outside STRUCTURED_GENERATION_PROVIDERS (cerebras, fireworks-ai) — and then does not forward it even for those (see findings); `generate_stream` forwards it without the check."},{"_locs":[{"doc":"","file":"src/smolagents/models.py","line":1052,"params":["self","messages","stop_sequences","response_format","tools_to_call_from","**kwargs"],"symbol":"smolagents.models:TransformersModel.generate"},{"doc":"","file":"src/smolagents/models.py","line":1093,"params":["self","messages","stop_sequences","response_format","tools_to_call_from","**kwargs"],"symbol":"smolagents.models:TransformersModel.generate_stream"},{"doc":"","file":"src/smolagents/models.py","line":687,"params":["self","messages","stop_sequences","response_format","tools_to_call_from","**kwargs"],"symbol":"smolagents.models:VLLMModel.generate"},{"doc":"","file":"src/smolagents/models.py","line":816,"params":["self","messages","stop_sequences","response_format","tools_to_call_from","**kwargs"],"symbol":"smolagents.models:MLXModel.generate"}],"config":"`model_id`, `device_map`, `torch_dtype`, `trust_remote_code`, `model_k   let hits = [], cur = 0;
  const pick = (i) => { const it = hits[i]; if (!it) return; box.hidden = true; it.go(); };
  const draw = () => fill(box, hits.map((it, i) => h("button", { type: "button", class: i === cur ? "on" : "", onclick: () => pick(i) }, h("span", { class: "k" }, K[it.kind]), h("span", {}, it.label, it.sub ? h("small", {}, truncate(it.sub, 110)) : null))));
  input.addEventListener("input", () => {
    const q = input.value.trim().toLowerCase();
    if (q.length < 2) { box.hidden = true; return; }
    const terms = q.split(/\s+/);
    hits = items.filter((it) => terms.every((t) => it.hay.includes(t) || it.label.toLowerCase().includes(t))).sort((a, b) => (RANK[a.kind] - RANK[b.kind]) || (a.label.length - b.label.length)).slice(0, 30);
    cur = 0; draw(); box.hidden = !hits.length;
  });
  input.addEventListener("keydown", (ev) => {
    if (box.hidden) return;
    if (ev.key === "ArrowDown") { cur = Math.min(hits.length - 1, cur + 1); draw(); ev.preventDefault(); }
    if (ev.key === "ArrowUp") { cur = Math.max(0, cur - 1); draw(); ev.preventDefault(); }
    if (ev.key === "Enter") { pick(cur); ev.preventDefault(); }
    if (ev.key === "Escape") box.hidden = true;
  });
  document.addEventListener("click", (ev) => { if (!ev.target.closest(".searchbar")) box.hidden = true; });
})();

// ---------------------------------------------------------------- footer
(function footer() {
  fill(document.getElementById("regen"), h("h3", {}, L.regen_h), h("pre", {}, D.regenCommand), h("p", {}, L.regen_cov(D.summary)), h("p", {}, L.regen_blind), h("p", {}, L.regen_gen));
})();
</script>
</body>
