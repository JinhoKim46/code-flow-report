purpose = "Each action step asks the model what to do next: CodeAgent wants a Thought plus one Python snippet between code tags; ToolCallingAgent wants one or more JSON tool calls."
input = "System prompt from `prompts/code_agent.yaml` (or `structured_code_agent.yaml` when `use_structured_outputs_internally`) or `prompts/toolcalling_agent.yaml`, rendered by `populate_template` with `tools`, `managed_agents`, `authorized_imports`, `custom_instructions`, code-block tags. Then the whole memory replayed by `write_memory_to_messages`."
message = ["system: the rendered system prompt (tool signatures, rules, few-shot examples)", "user: the task (and task images)", "for each earlier step: assistant = previous model output; tool-call → assistant; tool-response → user with 'Observation:' and execution logs, or the error text plus a retry hint", "planning steps add assistant (facts + plan) and user ('Now proceed…')"]
config = "The Model instance passed to the agent; stop sequences fixed in code ('Observation:', 'Calling tools:', and the closing code tag); `stream_outputs` switches to `generate_stream`; CodeAgent may send CODEAGENT_RESPONSE_FORMAT (JSON with `thought` and `code`)."
