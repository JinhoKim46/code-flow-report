  [[journeys.steps]]
  symbol = "smolagents.models:agglomerate_stream_deltas"
  action = "For ChatMessageStreamDelta events (only when the agent has stream_outputs), merges the deltas so far into one message whose Markdown replaces a single temporary bubble; '<' and '>' are escaped."
