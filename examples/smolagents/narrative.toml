logging = "AgentLogger prints the model output (DEBUG) and the parsed code (INFO); the step keeps model_input_messages, model_output_message and token_usage."
cost = "Not measured (token counts per step)."
result_use = "Code goes to the python executor; tool calls to `execute_tool_call` (in parallel threads when there are several); the result becomes the step's observation, or the final answer when final_answer was called."

