[[input_flows]]
id = "task-text"
source = "Task text from the developer, CLI prompt or Gradio chat message"
sink = "Model prompts (TaskStep, planning prompts) and, via additional_args, executor state"
  [[input_flows.steps]]
  symbol = "smolagents.agents:MultiStepAgent.run"
  guard = "None: the task is stored verbatim in a TaskStep; additional_args are merged into agent state and their repr is appended to the task text."
  [[input_flows.steps]]
  symbol = "smolagents.agents:MultiStepAgent._generate_planning_step"
  guard = "Inserted into the planning templates through populate_template (Jinja, StrictUndefined) as a variable, not as template source."
  [[input_flows.steps]]
  symbol = "smolagents.models:get_clean_message_list"
  guard = "Role check only (role must be a MessageRole); content is passed to the provider unchanged."

[[input_flows]]
id = "model-code"
source = "Model output text parsed as Python (CodeAgent) — the main trust boundary"
sink = "Execution in the host Python process (LocalPythonExecutor) with access to tools, authorized modules and agent state"
  [[input_flows.steps]]
  symbol = "smolagents.utils:parse_code_blobs"
  guard = "Only text between the code-block tags (or markdown python fences, or text that parses as Python) is taken; everything between all matching tag pairs is joined and run."
  [[input_flows.steps]]
  symbol = "smolagents.local_python_executor:fix_final_answer_code"
  guard = "Regex rename of a final_answer variable; not a safety check."
  [[input_flows.steps]]
  symbol = "smolagents.local_python_executor:evaluate_python_code"
  guard = "Parsed with ast.parse and interpreted node by node (never exec/eval); 30 s thread timeout, print output truncated, final_answer raises a BaseException."
  [[input_flows.steps]]
  symbol = "smolagents.local_python_executor:evaluate_ast"
  guard = "MAX_OPERATIONS = 10,000,000 node evaluations per execution; unsupported node types raise InterpreterError; results checked by check_safer_result (safer_eval)."
  [[input_flows.steps]]
  symbol = "smolagents.local_python_executor:evaluate_import"
  guard = "Import allow-list: BASE_BUILTIN_MODULES + additional_authorized_imports; '*' disables it."
  [[input_flows.steps]]
  symbol = "smolagents.local_python_executor:evaluate_attribute"
  guard = "Any __dunder__ attribute access is refused."
  [[input_flows.steps]]
  symbol = "smolagents.local_python_executor:check_safer_result"
  guard = "Rejects unauthorized module objects and DANGEROUS_FUNCTIONS (builtins.eval/exec/compile/globals/locals/__import__, os.system, os.popen, posix.system) as evaluation results."
  [[input_flows.steps]]
  symbol = "smolagents.local_python_executor:LocalPythonExecutor"
  guard = "Documented as 'not a security sandbox'; for untrusted code use executor_type e2b / docker / modal / blaxel (RemotePythonExecutor)."

[[input_flows]]
id = "tool-arguments"
source = "Tool-call arguments chosen by the model (JSON from ToolCallingAgent, Python values from CodeAgent code)"
sink = "Tool.forward — network requests, files, Spaces, sub-agents"
  [[input_flows.steps]]
  symbol = "smolagents.utils:parse_json_blob"
  guard = "Text tool calls: first '{' to last '}' decoded with json.loads(strict=False); failure is reported back to the model."
  [[input_flows.steps]]
  symbol = "smolagents.agents:ToolCallingAgent.execute_tool_call"
