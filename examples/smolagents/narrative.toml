  symbol = "smolagents.gradio_ui:GradioUI._stream_response"
  actor = "Gradio ChatInterface"
  action = "Per message: gets task text and files, then iterates agent.run(task, images=files, stream=True, reset=self.reset_agent_memory) and yields the growing list of chat messages after every event."
  receives = "message: str or {'text', 'files'}, history (ignored)"
