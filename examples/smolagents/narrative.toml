[[roles]]
id = "local-python-executor"
name = "LocalPythonExecutor (in-process interpreter)"
kind = "external"
symbols = ["smolagents.local_python_executor:LocalPythonExecutor.__call__", "smolagents.local_python_executor:evaluate_python_code", "smolagents.local_python_executor:evaluate_ast", "smolagents.local_python_executor:check_import_authorized"]
purpose = "The default place a CodeAgent's snippet runs: a hand-written AST interpreter inside your Python process, so no setup is needed — at the price of no real isolation."
message = ["code string parsed by `ast.parse`, then each node evaluated by `evaluate_ast` against a state dict that persists across steps", "tools and BASE_PYTHON_TOOLS are the only callables; variables from `run(additional_args=…)` are injected via `send_variables`"]
config = "`additional_authorized_imports` on CodeAgent (merged with BASE_BUILTIN_MODULES; '*' allows everything), `executor_kwargs` (`max_print_outputs_length`, `additional_functions`, `timeout_seconds`, default 30). Constants MAX_OPERATIONS (10,000,000) and MAX_WHILE_ITERATIONS (1,000,000)."
output = "CodeOutput(output = value of the last expression or the final_answer argument, logs = captured print output, is_final_answer)."
validation = "Imports outside the allow-list raise InterpreterError; dunder attributes are refused; functions listed in DANGEROUS_FUNCTIONS and non-authorized modules are refused when an expression evaluates to them; unknown builtins are refused; operations and while-iterations are counted; a thread-based timeout wraps the run. Isolation it does NOT give: same process, same filesystem, network and memory as the caller."
logging = "Print output goes to `state['_print_outputs']`, which the agent copies into the step's observation."
cost = "Free; CPU in your process."
result_use = "The agent stores output and logs as the step's observation, or ends the run if is_final_answer."

[[roles]]
id = "remote-executors"
name = "Remote executors (E2B, Docker, Modal, Blaxel)"
kind = "external"
symbols = ["smolagents.remote_executors:RemotePythonExecutor.send_tools", "smolagents.remote_executors:E2BExecutor.run_code_raise_errors", "smolagents.remote_executors:DockerExecutor.run_code_raise_errors", "smolagents.remote_executors:ModalExecutor.run_code_raise_errors", "smolagents.remote_executors:BlaxelExecutor.run_code_raise_errors", "smolagents.remote_executors:_websocket_run_code_raise_errors"]
purpose = "Run the model's code in a real Python kernel outside your process. E2B: a managed cloud micro-VM sandbox via the e2b SDK. Docker: a local container running Jupyter Kernel Gateway, reached over HTTP + websocket on a host port. Modal: a Modal cloud sandbox with an encrypted tunnel to the kernel gateway. Blaxel: a Blaxel cloud sandbox with a Jupyter image."
message = ["at start: create sandbox/container, open a kernel, `!pip install` the additional imports", "send_tools: pip install each tool's requirements, then send the tools' source code (`get_tools_definition_code`) and a patched final_answer that raises an exception carrying the serialized answer", "send_variables: variables serialized by SafeSerializer (JSON; pickle only when allow_pickle=True) plus deserializer code", "each step: the raw code string as one execute request"]
config = "`executor_type` ('e2b' | 'docker' | 'modal' | 'blaxel') and `executor_kwargs` on CodeAgent: E2B passes kwargs to `Sandbox.create` (the e2b SDK reads its own API key); Docker `host`, `port`, `image_name`, `build_new_image`, `container_run_kwargs`, `dockerfile_content`; Modal `app_name`, `port`, `create_kwargs`; Blaxel `sandbox_name`, `image`, `memory`, `ttl`, `region`. Docker and Modal protect the kernel gateway with a random KG_AUTH_TOKEN."
output = "CodeOutput built from the kernel's stdout/results; a final answer arrives as the patched exception and is decoded by `_deserialize_final_answer`."
validation = "Kernel errors are raised as AgentError. Pickle payloads are refused unless allow_pickle=True. No import allow-list is enforced remotely: the sandbox boundary is the protection. Managed agents are refused with remote executors."
logging = "AgentLogger logs startup, pip output and kernel logs."
cost = "Billed by the sandbox provider (E2B, Modal, Blaxel); not measured here."
result_use = "Same as the local executor: observation or final answer."

