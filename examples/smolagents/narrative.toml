[[findings]]
id = "max-steps-yields-stale-step"
severity = "low"
category = "risk"
title = "When max_steps runs out, the stream re-yields the previous ActionStep instead of the max-steps step"
detail = "True now: after the loop, _run_stream calls _handle_max_steps_reached (which appends a new ActionStep carrying AgentMaxStepsError and the forced answer to memory) and then yields `action_step` — the last loop step, already yielded once in the finally block. Trigger: any run that hits max_steps with stream=True. Reach: stream consumers such as GradioUI show the last step twice and never show the max-steps step; memory and the returned answer are correct."
symbols = ["smolagents.agents:MultiStepAgent._run_stream"]
evidence = "Read MultiStepAgent._run_stream and _handle_max_steps_reached in src/smolagents/agents.py: the finally block yields action_step, and the post-loop branch does `final_answer = self._handle_max_steps_reached(task)` followed by `yield action_step`; final_memory_step is local to _handle_max_steps_reached and not returned."
check = {kind = "text_in", pattern = "_handle_max_steps_reached\\(task\\)\\s*\\n\\s*yield action_step"}

[[findings]]
id = "gradio-uploads-passed-as-images"
severity = "medium"
category = "risk"
title = "GradioUI passes uploaded file paths to agent.run as images, which cannot be encoded"
detail = "True now: _stream_response calls agent.run(task, images=task_files) where task_files are path strings from _process_message. run stores them as TaskStep.task_images (and ActionStep.observations_images), and get_clean_message_list calls encode_image_base64(image), which does image.save(...) — a str has no save. Trigger: GradioUI with file_upload_folder set and a user attaching any file. Reach: the first model call of that turn raises, CodeAgent/ToolCallingAgent wrap it as AgentGenerationError and the run ends; with reset_agent_memory=False the bad TaskStep stays in memory and later turns fail too. Verified by reading, not executed (dependencies not installed in this clone)."
symbols = ["smolagents.gradio_ui:GradioUI._stream_response", "smolagents.gradio_ui:GradioUI._process_message", "smolagents.memory:TaskStep.to_messages", "smolagents.utils:encode_image_base64"]
evidence = "Read GradioUI._process_message/_stream_response (gradio_ui.py), MultiStepAgent.run/_run_stream (agents.py: images → TaskStep(task_images=images) and ActionStep(observations_images=images)), TaskStep.to_messages (memory.py: {'type': 'image', 'image': image}), get_clean_message_list (models.py) and encode_image_base64 (utils.py: image.save(buffered, format='PNG'))."
check = {kind = "text_in", pattern = "images=task_files"}

[[findings]]
id = "gradio-share-default"
severity = "medium"
category = "risk"
title = "GradioUI.launch() shares the app publicly by default"
detail = "True now: launch(share=True) is the default, which asks Gradio for a public share link. Trigger: calling GradioUI(agent).launch() without share=False. Reach: anyone with the link can drive the agent — for a CodeAgent that means model-written code runs in LocalPythonExecutor on the host (documented as not a sandbox) with the agent's tools and API keys behind them, and every visitor shares one agent memory."
symbols = ["smolagents.gradio_ui:GradioUI.launch"]
evidence = "Read GradioUI.launch (`def launch(self, share: bool = True, **kwargs)` → create_app().launch(debug=True, share=share)) and the LocalPythonExecutor docstring in local_python_executor.py."
check = {kind = "text_in", pattern = "share: bool = True"}

[[findings]]
id = "gradio-upload-filter-unused"
severity = "low"
category = "dead code"
title = "GradioUI.upload_file's extension allow-list is never used by the chat"
detail = "True now: upload_file checks extensions against ['.pdf', '.docx', '.txt'], but create_app wires only _stream_response, whose _process_message saves every attached file without a type check. Trigger: a user attaches any file type in multimodal mode. Reach: the file is copied into file_upload_folder and its path is given to the agent; the allow-list gives a false impression of filtering."
symbols = ["smolagents.gradio_ui:GradioUI.upload_file"]
evidence = "grep for upload_file in src/ finds only its definition; read GradioUI.create_app and _process_message."
check = "no_callers"

[[findings]]
id = "visit-webpage-any-url"
severity = "medium"
category = "risk"
title = "visit_webpage fetches any URL the model picks, including internal addresses"
detail = "True now: VisitWebpageTool.forward calls requests.get(url, timeout=20) with no scheme, host or IP check and returns the page body to the model. Trigger: an agent with this tool (it is in TOOL_MAPPING, so `add_base_tools=True` adds it) running on a machine or cloud VM with internal HTTP services, and a model steered by injected page text to request e.g. a metadata endpoint or localhost admin port. Reach: any GET-readable resource reachable from the host, whose content then lands in the model's context (and in the provider's logs)."
symbols = ["smolagents.default_tools:VisitWebpageTool.forward"]
evidence = "Read VisitWebpageTool.forward and TOOL_MAPPING in default_tools.py; no URL validation anywhere on the path."
check = {kind = "text_in", pattern = "requests\\.get\\(url, timeout=20\\)"}

[[findings]]
id = "cli-interactive-action-type-ignored"
severity = "low"
category = "risk"
title = "Interactive CLI ignores the chosen action type"
detail = "True now: interactive_mode asks 'code' or 'tool_calling', then unconditionally sets action_type = \"code\" before returning. Trigger: running smolagent with no prompt and choosing tool_calling. Reach: a CodeAgent is built anyway; the non-interactive --action-type flag is unaffected."
symbols = ["smolagents.cli:interactive_mode"]
evidence = "Read interactive_mode in src/smolagents/cli.py: `action_type = Prompt.ask(...)` early, then `imports = []` / `action_type = \"code\"` before the advanced-options block."
check = {kind = "text_in", pattern = "imports = \\[\\]\\s*\\n\\s*action_type = \"code\""}

[[findings]]
id = "cli-interactive-openaiservermodel"
severity = "low"
category = "risk"
title = "Interactive CLI offers 'OpenAIServerModel', which load_model rejects"
detail = "True now: interactive_mode's model-type choices include OpenAIServerModel, but load_model only matches 'OpenAIModel' and raises ValueError('Unsupported model type') otherwise. Trigger: choosing OpenAIServerModel in interactive mode. Reach: the CLI exits with an error before any model call; it also skips the API-option questions' intended model."
symbols = ["smolagents.cli:interactive_mode", "smolagents.cli:load_model"]
evidence = "Read interactive_mode (choices=[\"InferenceClientModel\", \"OpenAIServerModel\", \"LiteLLMModel\", \"TransformersModel\"]) and load_model (branches OpenAIModel, LiteLLMModel, TransformersModel, InferenceClientModel, else ValueError) in src/smolagents/cli.py."
check = {kind = "text_in", pattern = "\"OpenAIServerModel\""}

[[findings]]
id = "inference-client-drops-response-format"
severity = "low"
category = "risk"
title = "InferenceClientModel.generate validates response_format but never sends it"
detail = "True now: generate raises if the provider does not support structured outputs, then calls _prepare_completion_kwargs with `# response_format=response_format` commented out; generate_stream does pass it. Trigger: CodeAgent(use_structured_outputs_internally=True) without stream_outputs on InferenceClientModel. Reach: the request carries no JSON schema, so the reply may not be JSON and CodeAgent._step_stream's json.loads(output_text)['code'] fails as AgentParsingError on that step."
symbols = ["smolagents.models:InferenceClientModel.generate"]
evidence = "Read InferenceClientModel.generate and generate_stream in src/smolagents/models.py, and the structured branch of CodeAgent._step_stream in agents.py."
check = {kind = "text_in", pattern = "# response_format=response_format"}

[[findings]]
id = "local-timeout-does-not-interrupt"
severity = "medium"
category = "risk"
title = "The local executor's 30-second timeout only reports late; it does not give control back early"
detail = "True now: `timeout` runs the snippet in a ThreadPoolExecutor inside a `with` block. When future.result times out it raises ExecutionTimeoutError — but leaving the `with` block calls executor.shutdown(wait=True), which waits for the snippet to finish first. Trigger: model-written code that blocks without counting AST operations, e.g. `time.sleep(600)` (time is in BASE_BUILTIN_MODULES) or a tool call that hangs on the network. Reach: the whole agent run stalls for as long as that code takes; the 30 s limit only changes the error message afterwards. The docstring says the caller 'will receive a TimeoutError and can continue execution', and the tests only assert that the error is raised, not when."
symbols = ["smolagents.local_python_executor:timeout"]
evidence = "Read local_python_executor:timeout and TestTimeout in tests/test_local_python_executor.py. Reproduced the exact pattern standalone (ThreadPoolExecutor in a with block, submit time.sleep(6), result(timeout=2)): the timeout error surfaced after 6.0 s, not 2 s."
check = {kind = "text_in", pattern = "with ThreadPoolExecutor\\(max_workers=1\\) as executor"}

[[findings]]
id = "local-executor-not-a-boundary"
severity = "medium"
category = "risk"
title = "LocalPythonExecutor limits imports and dunders, not the host: same process, files, network and memory"
detail = "True now: the default executor ('local') interprets model-written code in your process. It refuses imports outside the allow-list, dunder attributes, the functions in DANGEROUS_FUNCTIONS and unknown builtins, and caps operations. It cannot stop: memory exhaustion (no cap), disk or network use through any authorized module or any tool (tools run with full privileges), or anything once `additional_authorized_imports` contains '*'. DANGEROUS_MODULES is defined but never read — the only module gate is the allow-list. Trigger: an untrusted or prompt-injected model (e.g. via visit_webpage content) plus a permissive import list or a powerful tool. Reach: everything the Python process can touch. README and the class docstring say this plainly ('not a security sandbox'); the remote executors are the documented answer."
symbols = ["smolagents.local_python_executor:check_import_authorized", "smolagents.local_python_executor:check_safer_result", "smolagents.local_python_executor:LocalPythonExecutor.__call__"]
evidence = "Read check_import_authorized (returns True as soon as '*' is in the tree), check_safer_result, evaluate_import, LocalPythonExecutor; `grep -n DANGEROUS_MODULES src/smolagents/*.py` finds only its definition. README 'Security' section and LocalPythonExecutor docstring read."

[[findings]]
id = "remote-executors-ignore-allow-list"
severity = "info"
category = "risk"
title = "With a remote executor, additional_authorized_imports means 'pip install these', not an allow-list"
detail = "True now: RemotePythonExecutor runs the code string as-is in the kernel; `additional_imports` are only passed to `!pip install`. The system prompt still lists the authorized imports, but nothing enforces them remotely. Trigger: someone moving from local to e2b/docker expecting the same import restriction. Reach: only what the sandbox itself allows — which is the intended boundary."
symbols = ["smolagents.remote_executors:RemotePythonExecutor.install_packages"]
evidence = "Read RemotePythonExecutor.__call__, install_packages, E2BExecutor.__init__, DockerExecutor.__init__ and _websocket_run_code_raise_errors: no import check on the code."

[[findings]]
id = "search-tools-no-timeout"
severity = "low"
category = "risk"
title = "Most web-search calls have no HTTP timeout"
detail = "True now: GoogleSearchTool.forward, ApiWebSearchTool.forward, WebSearchTool.search_duckduckgo and search_bing call requests.get without `timeout`; only search_exa (30 s) and visit_webpage (20 s) set one. Trigger: a search endpoint that accepts the connection but never answers. Reach: the step hangs indefinitely; in a CodeAgent the local executor's timeout cannot cut it short either (see the timeout finding)."
symbols = ["smolagents.default_tools:GoogleSearchTool.forward", "smolagents.default_tools:ApiWebSearchTool.forward", "smolagents.default_tools:WebSearchTool.search_duckduckgo", "smolagents.default_tools:WebSearchTool.search_bing"]
evidence = "Read each forward/search function in default_tools.py and compared the requests.get calls."
check = {kind = "text_in", pattern = "requests\\.get\\(base_url, params=params\\)"}

[[findings]]
id = "bedrock-tool-calls-key"
severity = "low"
category = "risk"
title = "AmazonBedrockModel.generate reads a 'tool_calls' key the Converse response does not normally carry"
detail = "True now: generate builds the ChatMessage with `response['output']['message']['tool_calls']`. Bedrock's Converse API returns `output.message` with `role` and `content` (tool use appears as `toolUse` content blocks), so a real response without that key would raise KeyError after the text has already been extracted. Trigger: any AmazonBedrockModel.generate against the real service. Reach: every Bedrock call. Not verified against a live endpoint here, and the test suite only tests client creation for Bedrock (TestAmazonBedrockModel.test_client_for_bedrock), so it is unexercised either way."
symbols = ["smolagents.models:AmazonBedrockModel.generate"]
evidence = "Read AmazonBedrockModel.generate and _prepare_completion_kwargs; `grep -n -i bedrock tests/*.py` shows only the client test. Response shape per the public boto3 Converse documentation."
check = {kind = "text_in", pattern = "\\[\"message\"\\]\\[\"tool_calls\"\\]"}

[[findings]]
id = "final-answer-error-as-output"
severity = "low"
category = "risk"
title = "At max_steps, a failed final-answer call is returned as the answer text"
detail = "True now: provide_final_answer catches every exception from model.generate and returns a ChatMessage whose content is 'Error in generating final LLM output: …'; _handle_max_steps_reached returns that content as the run's output. Trigger: the model provider fails (outage, context too long — likely, since this call replays the whole memory) on the forced answer. Reach: `agent.run()` returns the error string as if it were the answer; only `return_full_result=True` shows state 'max_steps_error'."
symbols = ["smolagents.agents:MultiStepAgent.provide_final_answer"]
evidence = "Read MultiStepAgent.provide_final_answer, _handle_max_steps_reached and run."
check = {kind = "text_in", pattern = "Error in generating final LLM output"}

[[findings]]
id = "monitor-skips-planning-tokens"
severity = "info"
category = "duplicated logic"
title = "Two token totals: Monitor counts action steps only, RunResult also counts planning"
detail = "True now: _setup_step_callbacks registers monitor.update_metrics for ActionStep only, so `agent.monitor.get_total_token_counts()` excludes PlanningStep tokens, while `run(return_full_result=True)` sums both ActionStep and PlanningStep from memory. Trigger: planning_interval set. Reach: token/cost reporting only; the two numbers disagree by the planning calls."
symbols = ["smolagents.agents:MultiStepAgent._setup_step_callbacks"]
evidence = "Read MultiStepAgent._setup_step_callbacks, Monitor.update_metrics and the token loop in MultiStepAgent.run."
check = {kind = "text_in", pattern = "register\\(ActionStep, self\\.monitor\\.update_metrics\\)"}

[[findings]]
id = "mcp-structured-output-warning-stale"
severity = "low"
category = "doc vs code"
title = "MCP warning says the structured_output default changes 'in version 1.25'; at 1.27.0.dev0 it is still False"
detail = "True now: MCPClient.__init__ and ToolCollection.from_mcp warn 'Currently it defaults to False, but in version 1.25, the default will change to True', and still set False; `__version__` is 1.27.0.dev0. Trigger: any MCP use without structured_output. Reach: a misleading FutureWarning only."
symbols = ["smolagents.mcp_client:MCPClient.__init__", "smolagents.tools:ToolCollection.from_mcp"]
evidence = "Read both functions and src/smolagents/__init__.py (__version__)."
check = {kind = "text_in", pattern = "in version 1\\.25, the default will change to True"}

[[findings]]
id = "mcpclient-no-trust-gate"
severity = "info"
category = "risk"
title = "ToolCollection.from_mcp demands trust_remote_code; MCPClient connects without it"
detail = "True now: from_mcp raises unless trust_remote_code=True ('it will execute code on your local machine'), but MCPClient — the newer, documented entry point — launches a stdio server or connects over HTTP with no such flag. Trigger: a user relying on the flag as the safety prompt. Reach: whatever the MCP server or its subprocess can do; the two entry points disagree about whether consent is needed."
symbols = ["smolagents.mcp_client:MCPClient.__init__"]
evidence = "Read MCPClient.__init__/connect and ToolCollection.from_mcp."

[[findings]]
id = "readme-agents-line-count"
severity = "info"
category = "doc vs code"
title = "README says agents.py has under 1,000 lines; it has 1,813"
detail = "True now: README states 'the logic for agents fits in ~1,000 lines of code' and 'the main code in agents.py has <1,000 lines'. `wc -l src/smolagents/agents.py` prints 1813. Reach: expectation-setting for newcomers only."
symbols = ["smolagents.agents:MultiStepAgent"]
evidence = "Read README.md (Simplicity bullet and the abstractions paragraph); ran wc -l on src/smolagents/agents.py."

[[findings]]
id = "cli-openai-defaults-to-fireworks"
severity = "info"
category = "doc vs code"
title = "CLI `--model-type OpenAIModel` silently targets Fireworks"
detail = "True now: cli.load_model builds OpenAIModel with api_base defaulting to https://api.fireworks.ai/inference/v1 and api_key defaulting to FIREWORKS_API_KEY; InferenceClientModel reads HF_API_KEY (not HF_TOKEN, which the class itself falls back to). Neither default is mentioned in README's CLI section. Trigger: running `smolagent … --model-type OpenAIModel --model-id gpt-…` without --api-base. Reach: the request (and the prompt) goes to Fireworks and fails or bills there."
symbols = ["smolagents.cli:load_model"]
evidence = "Read cli.load_model; `grep -n 'FIREWORKS\\|HF_API_KEY' README.md docs/source/en -r` found nothing."
check = {kind = "text_in", pattern = "api\\.fireworks\\.ai"}

[[layer_rules]]
text = "The model gateway never imports the agent loop or any UI: models know messages and tools, not agents."
from_layers = ["models"]
forbid = ["smolagents.agents", "smolagents.gradio_ui", "smolagents.cli", "smolagents.vision_web_browser"]

[[layer_rules]]
text = "Tools never import agents, models or memory: a tool is usable on its own, outside any agent."
from_layers = ["tools"]
forbid = ["smolagents.agents", "smolagents.models", "smolagents.memory"]

[[layer_rules]]
text = "Executors never import agents, models or memory: they receive code, tools and variables and return a CodeOutput."
from_layers = ["executors"]
forbid = ["smolagents.agents", "smolagents.models", "smolagents.memory"]

[[layer_rules]]
text = "Provider SDKs (openai, litellm, boto3, vllm, mlx_lm) are imported only inside the model gateway, never by agents, memory or executors."
from_layers = ["agents", "memory", "executors"]
forbid = ["openai", "litellm", "boto3", "vllm", "mlx_lm"]

[[layer_rules]]
text = "Only the entry-point layer imports Gradio's UI module or the CLI; the agent loop does not depend on how it is displayed."
from_layers = ["agents", "models", "tools", "executors", "memory", "utils"]
forbid = ["smolagents.gradio_ui", "smolagents.cli", "smolagents.vision_web_browser"]

[[layer_rules]]
text = "Memory and monitoring never import the agent loop: steps are plain records the agent fills in."
from_layers = ["memory"]
forbid = ["smolagents.agents"]

[[decisions]]
decision = "What code runs (CodeAgent) or which tool is called with which arguments (ToolCallingAgent) at each step"
by = "model"
how = "The model writes a Python snippet or JSON tool calls from the system prompt and the replayed memory; the agent only parses it (parse_code_blobs / parse_tool_calls) and runs it."
symbol = "smolagents.agents:CodeAgent._step_stream"

[[decisions]]
decision = "Which modules model-written code may import in the local executor"
by = "code"
how = "check_import_authorized walks the import path against BASE_BUILTIN_MODULES plus the user's additional_authorized_imports ('numpy.*' allows submodules, '*' allows everything); get_safe_module strips unauthorized submodules from an allowed module."
symbol = "smolagents.local_python_executor:check_import_authorized"

[[decisions]]
decision = "How much work one snippet may do locally"
by = "code"
how = "evaluate_ast counts operations up to MAX_OPERATIONS, evaluate_while caps iterations at MAX_WHILE_ITERATIONS, evaluate_python_code wraps the run in a thread timeout (timeout_seconds, default 30, configurable or None)."
symbol = "smolagents.local_python_executor:evaluate_ast"

[[decisions]]
decision = "Where the model's code executes (in-process or a sandbox)"
by = "people"
how = "The user passes executor_type ('local' default, 'e2b', 'docker', 'modal', 'blaxel') or a ready executor to CodeAgent; create_python_executor builds it."
symbol = "smolagents.agents:CodeAgent.create_python_executor"

[[decisions]]
decision = "Which tools and model the agent has"
by = "people"
how = "The user passes `tools`, `model`, optional `managed_agents` and `add_base_tools` (adds TOOL_MAPPING: web_search and visit_webpage, plus python_interpreter for a ToolCallingAgent only) to the agent constructor; final_answer is always added."
symbol = "smolagents.agents:MultiStepAgent._setup_tools"

[[decisions]]
decision = "When the run stops"
by = "model"
how = "The model ends the run by calling final_answer; the code stops it anyway after max_steps (agent default 20, overridable per run) and asks for a forced answer via provide_final_answer, or when interrupt() is called."
symbol = "smolagents.agents:MultiStepAgent._run_stream"

[[decisions]]
decision = "Whether a final answer is accepted"
by = "code"
how = "Each function in the user's final_answer_checks is called with (answer, memory, agent); a falsy result or exception becomes an AgentError on the step and the loop continues."
symbol = "smolagents.agents:MultiStepAgent._validate_final_answer"

[[decisions]]
decision = "When to plan"
by = "people"
how = "planning_interval on the agent; _run_stream runs a planning step on step 1 and every planning_interval steps after."
symbol = "smolagents.agents:MultiStepAgent._run_stream"

[[decisions]]
decision = "Whether a failed model call is retried"
by = "code"
how = "ApiModel's Retrying retries only when is_rate_limit_error matches the exception text, up to 3 attempts with 60 s exponential backoff; retry=False disables it."
symbol = "smolagents.models:is_rate_limit_error"

[[decisions]]
decision = "Whether downloaded or remote code may run"
by = "people"
how = "Tool.from_hub, MultiStepAgent.from_hub and ToolCollection.from_mcp refuse unless the caller passes trust_remote_code=True; remote executors accept pickle only with allow_pickle=True."
symbol = "smolagents.tools:Tool.from_hub"
