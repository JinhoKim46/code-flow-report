cost = "Not measured."
result_use = "Becomes the FinalAnswerStep output returned by `run`."

[[roles]]
id = "model-gateway"
name = "Model gateway (Model base class)"
kind = "model"
symbols = ["smolagents.models:Model.generate", "smolagents.models:Model._prepare_completion_kwargs", "smolagents.models:ApiModel.__init__", "smolagents.models:Model.parse_tool_calls"]
purpose = "Every model call an agent makes goes through `model.generate(...)` (or `generate_stream`), so the loop is written once and the provider is swapped by passing a different Model subclass."
input = "A list of ChatMessage built by the agent from memory (`write_memory_to_messages`), plus stop_sequences, an optional response_format and, for ToolCallingAgent, the tool list turned into JSON schemas by `get_tool_json_schema`."
message = ["`_prepare_completion_kwargs` cleans the message list (`get_clean_message_list`: merges consecutive same-role messages, maps tool-call → assistant and tool-response → user, optionally flattens content to text, converts images to data URLs)", "adds `stop` only when `supports_stop_parameter(model_id)` is true (o3/o4/gpt-5/grok are excluded), `response_format`, `tools` + `tool_choice`", "then caller kwargs, then the Model's own constructor kwargs win last (REMOVE_PARAMETER deletes a key)"]
config = "Chosen in code by the caller: the Model subclass and its constructor arguments (`model_id`, `api_key`/`token`, `api_base`, `client_kwargs`, `requests_per_minute`, `retry`, any extra kwarg forwarded to the provider). The CLI's `load_model` maps `--model-type/--model-id/--api-base/--api-key/--provider` onto these."
output = "A ChatMessage (role, content, tool_calls, raw provider response, TokenUsage) — or a stream of ChatMessageStreamDelta that `agglomerate_stream_deltas` folds into one."
validation = "API models wrap the client call in `utils.Retrying`: up to RETRY_MAX_ATTEMPTS (3) attempts, base wait RETRY_WAIT (60 s) with exponential backoff and jitter, but only when `is_rate_limit_error` finds '429'/'rate limit'/'too many requests' in the exception text; every other error is re-raised. `RateLimiter.throttle` spaces calls when `requests_per_minute` is set. When the provider ignores `stop`, `remove_content_after_stop_sequences` trims the text afterwards. `parse_tool_calls` recovers a tool call from plain text when the provider returned none."
logging = "Retries are logged through the module logger at INFO (before sleep / after attempt). Token counts come back on each ChatMessage and are summed by the agent (Monitor, RunResult)."
cost = "Not measured by the library: it reports input/output token counts per step, never money."
result_use = "The agent stores the ChatMessage on the current memory step and parses code or tool calls out of it."

