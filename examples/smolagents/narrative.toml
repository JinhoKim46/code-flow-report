# Narrative for the code-flow report — the only hand-written input.
#
# Structure (modules, functions, call edges, routes, SQL access, boundaries) comes from code_map.json.
# This file adds the explanation around it. Every `symbol` / `module` / `table` named here is checked
# against the code on every build; a name that no longer exists fails the build and the staleness test.
# Never write line numbers — the builder adds file:line from the code map.
#
# Proposed by `codeflow.py draft`. Replace every "TODO: …" (the report shows how many are left).
# Severities: high | medium | low | info.  Stages: born | transform | update | store | archive | restore | read | delete.
# A finding with a `check` retires itself: once the code no longer shows it, it moves to the page's Fixed list.
# Layer `modules` may use "pkg.*" patterns. With [[layers]] present, every module must match one.
# [module_notes."pkg.mod"]: purpose / does / flow (+ optional note) per module — written from the code, never a copied docstring.


[meta]
title = "smolagents"
lede = "smolagents runs a language model in a loop until a task is done: on each step the model writes either a Python snippet (CodeAgent) or JSON tool calls (ToolCallingAgent), the library runs that action, and the result goes back into the next prompt. The agent loop in agents.py sits in the middle: models.py turns its memory into provider requests, tools.py and default_tools.py supply the callable tools, and local_python_executor.py or remote_executors.py run the code, while memory.py, monitoring.py and the CLI and Gradio front ends record the run and show it."
audience = "learning the code"

[module_notes.smolagents]
purpose = "Gives users one import: `from smolagents import CodeAgent, OpenAIModel, tool` works without knowing which file each name lives in."
does = "Re-exports the public names of every submodule with star imports; sets `__version__`."
flow = "Python import → agent_types first, then agents (the comment says this order avoids a circular import through cli), then the other submodules, cli last. It has no logic of its own."
note = "Import order matters: agents must load before cli, which imports agents."

[module_notes."smolagents._function_type_hints_utils"]
purpose = "Builds a tool's JSON input schema from an ordinary Python function, so a `@tool` function needs only type hints and a Google-style docstring."
does = "Parses a Google-style docstring into a description, per-argument descriptions and a return description; turns type hints (Optional, Union, list, dict, Literal …) into JSON-schema types; finds which third-party packages a piece of source code imports."
flow = "Called only by smolagents.tools: `tool()` calls get_json_schema to fill `inputs`/`output_type`; Tool.validate_arguments and validate_tool_arguments use _get_json_schema_type to map Python types to schema types; Tool.to_dict calls get_imports to write the tool's `requirements`, which remote executors later pip-install."
note = "Copied from the transformers repository; a missing argument description in the docstring raises DocstringParsingException when the tool is created."

[module_notes."smolagents.agent_types"]
purpose = "Lets a tool or agent return text, an image or audio that still behaves like the plain value while also printing as a file path in a prompt and displaying in a notebook."
does = "Wraps outputs as AgentText, AgentImage (a PIL image) or AgentAudio (a tensor plus sample rate); converts each to its raw value or to a string, saving images and audio to a temp file for the string form; unwraps AgentType inputs before a tool runs and wraps outputs by the tool's declared `output_type`."
flow = "tool-call journey: Tool.__call__ (with sanitize_inputs_outputs) → handle_agent_input_types → forward → handle_agent_output_types. The run loop (_run_stream) wraps the final answer the same way, and gradio_ui checks for AgentImage/AgentAudio to render media. AgentAudio fetches a URL path with requests."
note = "Every `to_string()` on a fresh object calls tempfile.mkdtemp and writes a file that nothing deletes."

[module_notes."smolagents.agents"]
purpose = "Holds the agent loop itself: everything else in the library is a part this loop calls."
does = "Runs a task as a ReAct loop of numbered steps — optional planning steps, then action steps — until a final answer or max_steps, as a stream or as one return value (optionally a RunResult with tokens, timing and steps). Provides two ways to act: CodeAgent asks for a Python snippet and runs it in a Python executor; ToolCallingAgent asks for JSON tool calls and runs them, several in parallel threads. Lets agents manage other agents: a managed agent is called like a tool and returns a report. Saves an agent to a folder (agent.json, prompts.yaml, tools/, app.py, requirements.txt), reloads it, and pushes or pulls it on the Hugging Face Hub."
flow = "Entry: code-agent-run and tool-calling-agent-run journeys (MultiStepAgent.run), also reached from cli.run_smolagent, gradio_ui.GradioUI._stream_response and vision_web_browser. run → initialize_system_prompt (Jinja templates) → memory.AgentMemory → _run_stream → _step_stream → models (Model.generate / generate_stream) → CodeAgent: utils.parse_code_blobs → local_python_executor or remote_executors; ToolCallingAgent: Model.parse_tool_calls → tools.validate_tool_arguments → Tool.__call__ → each step stored as memory.ActionStep, metrics to monitoring.Monitor through step callbacks."
note = "An AgentError raised during a step (bad code, wrong tool arguments, a tool failure) is stored on the step and the loop goes on, so the model sees it next turn; only AgentGenerationError (a failed model call) ends the run. final_answer_checks and step_callbacks are not saved by to_dict/save."

[module_notes."smolagents.cli"]
purpose = "Lets someone run an agent from the shell (`smolagent \"task\"`) without writing Python."
does = "Parses the model type, model id, tools, imports and action type from the command line, or asks for them in an interactive questionnaire when no prompt is given; builds one of four model classes (OpenAIModel, LiteLLMModel, TransformersModel, InferenceClientModel); builds tools from built-in names (TOOL_MAPPING) or Hugging Face Space ids."
flow = "cli-run journey: console entry point main → parse_arguments / interactive_mode → run_smolagent → load_dotenv → load_model → default_tools.TOOL_MAPPING or tools.Tool.from_space → agents.CodeAgent (or ToolCallingAgent) with stream_outputs=True → MultiStepAgent.run. The answer is only printed by the agent's logger. vision_web_browser reuses load_model."
note = "A tool name containing \"/\" is taken as a Space id; any other name not in TOOL_MAPPING (python_interpreter, web_search, visit_webpage) raises ValueError."

[module_notes."smolagents.default_tools"]
purpose = "Ships ready-made tools so an agent can search the web, read pages, run Python or answer without the user writing any."
does = "Searches the web through DuckDuckGo, Google (SerpAPI or Serper), Brave or Exa APIs, or by scraping DuckDuckGo/Bing HTML; fetches a URL and returns it as truncated Markdown, or looks up a Wikipedia article; runs Python through the safe interpreter (PythonInterpreterTool), asks the human for input, and transcribes speech with a Whisper pipeline; provides FinalAnswerTool, which every agent gets as `final_answer`."
flow = "tool-call journey: Tool.__call__ → VisitWebpageTool.forward (requests.get → markdownify → _truncate_content). Agents add FinalAnswerTool in _setup_tools; cli picks tools through TOOL_MAPPING; remote_executors patches FinalAnswerTool to raise an exception. Search tools reach outside services over HTTP; API keys come from env vars such as SERPAPI_API_KEY, SERPER_API_KEY, BRAVE_API_KEY and EXA_API_KEY."
note = "Network failures in VisitWebpageTool come back as a text message, not an exception, so the model reads the error as the page content."

[module_notes."smolagents.gradio_ui"]
purpose = "Gives any agent a browser chat window with live streaming and file upload, in a few lines of code."
does = "Builds a gr.ChatInterface around one agent and launches it; turns each streamed event — token deltas, planning steps, action steps with code and logs, errors, the final answer — into nested gr.ChatMessage bubbles with duration and token footnotes; saves uploaded files under a sanitised name and passes their paths to the agent; offers stream_to_gradio for use in custom Gradio apps."
flow = "gradio-chat journey: GradioUI.create_app → _stream_response per message → _process_message (+ _save_uploaded_file into file_upload_folder) → agents.MultiStepAgent.run(stream=True) → models.agglomerate_stream_deltas for the live bubble → pull_messages_from_step → _process_action_step / _process_planning_step / _process_final_answer_step."
note = "One agent object serves every browser session of the app, so concurrent users share the same memory. Uploads with the same file name overwrite each other."

[module_notes."smolagents.local_python_executor"]
purpose = "Runs model-written Python in the same process without plain `exec`, so the code can only import and call what the agent allows."
does = "Interprets the code by walking its AST node by node (assignments, loops, functions, classes, comprehensions, try/with, imports) against a `state` dict that persists between steps; blocks imports outside the authorised list, dunder attribute access and a list of dangerous modules and functions; limits work with an operation counter, a while-loop cap and a per-call timeout; turns a `final_answer(...)` call into an exception that ends execution and marks the result as final; captures `print` output and truncates it."
flow = "code-agent-run journey: CodeAgent.create_python_executor → LocalPythonExecutor; MultiStepAgent.run → send_variables / send_tools (agent tools + BASE_PYTHON_TOOLS); CodeAgent._step_stream → fix_final_answer_code → LocalPythonExecutor.__call__ → evaluate_python_code → evaluate_ast → evaluate_import / check_import_authorized → returns CodeOutput(output, logs, is_final_answer). Also used by default_tools.PythonInterpreterTool, and remote_executors reuses its CodeOutput and PythonExecutor types."
note = "The timeout wraps execution in a `with ThreadPoolExecutor(...)` block; leaving that block waits for the worker thread, so code stuck in a blocking call is not cut off at timeout_seconds. Authorising \"*\" allows every import. This is an interpreter with checks, not an OS-level sandbox."

[module_notes."smolagents.mcp_client"]
purpose = "Turns the tools of an MCP server into ordinary smolagents Tools so an agent can call them."
does = "Connects to one or several MCP servers (stdio or HTTP parameters) through the mcpadapt adapter; returns their tools as a list; disconnects; works as a context manager."
flow = "User code: `with MCPClient(server_parameters) as tools:` → connect → mcpadapt's SmolAgentsAdapter → tools passed to an agent → each call goes over MCP to the server. tools.ToolCollection.from_mcp is the older route to the same adapter."
note = "Without an explicit disconnect or the with-block, the server connection stays open."

[module_notes."smolagents.memory"]
purpose = "Keeps the record of a run in a form that can be both replayed to the model as chat messages and inspected by people."
does = "Stores the system prompt and each step as typed records — TaskStep, PlanningStep, ActionStep (model output, code or tool calls, observations, images, error, tokens, timing), FinalAnswerStep; turns each step back into ChatMessages, with a summary mode that drops model outputs; exports succinct or full step dicts, replays a run in the console and concatenates all code actions into one script; dispatches step callbacks by step class."
flow = "agents writes it on every step (_run_stream appends PlanningStep/ActionStep, run adds TaskStep) and reads it in write_memory_to_messages → ActionStep.to_messages before each model call; the CallbackRegistry calls monitoring.Monitor.update_metrics and user callbacks such as vision_web_browser.save_screenshot; gradio_ui reads steps to draw bubbles."
note = "A step's observations_images are re-sent to the model on every later step unless something clears them; vision_web_browser does this by hand for older screenshots."

[module_notes."smolagents.models"]
purpose = "Puts every LLM behind one `generate(messages) -> ChatMessage` interface, so the agent loop does not care which provider or local runtime answers."
does = "Defines the chat data types (ChatMessage, tool calls, stream deltas) and joins streamed deltas into one message; turns memory messages into provider format — merging same-role messages, converting roles, inlining images, adding stop sequences, tool JSON schemas and structured-output formats; calls API providers (OpenAI and Azure, LiteLLM and its router, Hugging Face InferenceClient, Amazon Bedrock) with a rate limiter and a retry on rate-limit errors, or local runtimes (Transformers, vLLM, MLX); extracts tool calls from plain text when the model did not use native tool calling; saves and rebuilds a model from a dict without its token or api_key."
flow = "model-generate journey: agents (_step_stream, _generate_planning_step, provide_final_answer) → OpenAIModel.generate (or another subclass) → Model._prepare_completion_kwargs → get_clean_message_list → get_tool_json_schema → ApiModel._apply_rate_limit → utils.Retrying → provider client → ChatMessage with token_usage (monitoring.TokenUsage) → Model.parse_tool_calls → get_tool_call_from_text for ToolCallingAgent. Outside services: OpenAI-compatible APIs, LiteLLM, Hugging Face Inference, AWS bedrock-runtime."
note = "Rate-limit detection is a string match (\"429\", \"rate limit\", \"too many requests\") on the exception text; any other error is not retried."

[module_notes."smolagents.monitoring"]
purpose = "Gives the agent loop one place to print what is happening and to add up time and tokens per run."
does = "Holds TokenUsage and Timing records; totals step durations and input/output tokens across a run (Monitor); prints rich panels, code blocks, rules, Markdown and errors filtered by LogLevel (OFF, ERROR, INFO, DEBUG), escaping arbitrary tool output so it cannot break Rich markup; draws an agent's tools and managed agents as a tree."
flow = "agents creates an AgentLogger and a Monitor per agent; Monitor.update_metrics is registered as an ActionStep callback through memory.CallbackRegistry; models attach TokenUsage to each ChatMessage; remote_executors and memory log through the same AgentLogger. Output goes only to the console."

[module_notes."smolagents.remote_executors"]
purpose = "Runs a CodeAgent's code outside the user's machine or process, in a real sandbox, when the in-process interpreter is not enough."
does = "Sends tools to the sandbox as source code and pip-installs their requirements; sends variables with SafeSerializer (pickle only when allow_pickle=True); runs each snippet on a Jupyter-style kernel in E2B, a local Docker container (Jupyter Kernel Gateway image built on demand), Modal or Blaxel, and detects the final answer by a patched FinalAnswerTool that raises a serialised exception; cleans up the sandbox on exit."
flow = "CodeAgent.create_python_executor with executor_type \"e2b\" / \"docker\" / \"modal\" / \"blaxel\" → RemotePythonExecutor.send_tools (tools.get_tools_definition_code, install_packages) and send_variables (serialization.SafeSerializer) → per step __call__ → run_code_raise_errors → kernel over the provider SDK or a websocket (_websocket_run_code_raise_errors) → CodeOutput (from local_python_executor). Outside services: E2B, Docker, Modal, Blaxel."
note = "create_python_executor refuses remote execution when the agent has managed agents."

[module_notes."smolagents.serialization"]
purpose = "Moves Python values between the agent process and a remote sandbox without pickle, which would let a hostile sandbox run code in the agent's process."
does = "Encodes values as JSON with type markers (tuple, set, bytes, complex, datetime, Decimal, Path, PIL image, numpy values, dataclasses, dicts with non-string keys) under a \"safe:\" prefix; decodes them and rejects \"pickle:\" data unless allow_pickle is set; generates the same serializer as source code to inject into the sandbox."
flow = "Used only by remote_executors: send_variables → SafeSerializer.dumps and get_deserializer_code (run inside the kernel). Final answers coming back are decoded by RemotePythonExecutor._deserialize_final_answer, a separate decoder in remote_executors."
note = "The patched FinalAnswerTool in remote_executors carries its own inlined copy of the encoder (its source is shipped to the sandbox) and _deserialize_final_answer has its own decoder, so a type added here must be added in both places too."

[module_notes."smolagents.tool_validation"]
purpose = "Checks that a Tool class can be saved as standalone source and rebuilt elsewhere (on the Hub or in a sandbox)."
does = "Walks a method's AST to make sure it uses only its own arguments, builtins, imported modules and names it defines; checks that `__init__` arguments have defaults and that class attributes are simple literals."
flow = "Called from tools.Tool.to_dict: MethodChecker on the forward of a `@tool` function, validate_tool_attributes on a Tool subclass. to_dict runs on Tool.save, push_to_hub, agent save and on remote_executors.send_tools."
note = "A tool whose forward reads a module-level variable fails here at save time, not at run time."

[module_notes."smolagents.tools"]
purpose = "Defines what a tool is — a name, a description, typed inputs, an output type and a `forward` — so agents, prompts, schemas and sandboxes all treat tools the same way."
does = "Validates a tool's attributes when it is created and turns it into a code-style or tool-calling prompt; makes a tool from a plain function with `@tool`, from a Hub repo or Python code, from a Gradio Space, from a Gradio or LangChain tool, from a Transformers pipeline (PipelineTool), or a whole collection from the Hub or an MCP server; calls a tool (lazy setup, dict-argument unpacking, optional AgentType wrapping) and validates JSON arguments against its input schema; saves a tool as source with requirements and an optional Gradio app, and pushes it to the Hub."
flow = "tool-call journey: Tool.__call__ → setup → forward. tool-calling-agent-run: ToolCallingAgent.execute_tool_call → validate_tool_arguments → Tool.__call__. cli-run: Tool.from_space. remote_executors uses get_tools_definition_code to rebuild tools inside the sandbox. Uses _function_type_hints_utils for schemas and tool_validation for save checks."
note = "Tool.from_hub, load_tool and ToolCollection.from_mcp run downloaded or server-defined code only with trust_remote_code=True; otherwise they raise."

[module_notes."smolagents.utils"]
purpose = "Collects the helpers the agent loop and models share, so error types, parsing and retry logic are defined once."
does = "Defines the AgentError family (parsing, execution, tool-call, tool-execution, max-steps, generation) that decides whether a step error is shown to the model or ends the run; pulls code blocks or a JSON blob out of model text, with readable error messages for the model; truncates long content, makes values JSON-safe and Rich-safe; recovers the source of classes and instances for saving, and renders the Gradio app template; supplies RateLimiter and Retrying for model calls."
flow = "agents (parse_code_blobs in CodeAgent._step_stream, AgentError handling in _run_stream, truncate_content in managed-agent reports) → models (Retrying.__call__, RateLimiter, parse_json_blob in get_tool_call_from_text) → tools (instance_to_source and get_source in Tool.to_dict). Writes nothing."
note = "parse_code_blobs falls back to markdown ```python fences and then to treating the whole reply as code if it parses, so prose that happens to be valid Python would be executed."

[module_notes."smolagents.vision_web_browser"]
purpose = "Shows the library driving a real browser: a CodeAgent that sees screenshots and controls Chrome through helium."
does = "Starts a Chrome driver with Selenium and helium; gives the agent browser tools (go back, close pop-ups, find text with Ctrl+F) plus web search; after each step, attaches a screenshot and the current URL to the step and drops screenshots older than two steps."
flow = "python -m entry point main → run_webagent → cli.load_model → initialize_driver → initialize_agent (CodeAgent with step_callbacks=[save_screenshot], helium authorised) → python_executor(\"from helium import *\") → MultiStepAgent.run(prompt + helium_instructions) → save_screenshot writes memory.ActionStep.observations_images, which the next model call receives."
note = "save_screenshot reads driver.current_url even when helium has no driver, which would raise AttributeError."

[[layers]]
id = "interfaces"
name = "Entry points & UI"
owns = "The ways a person starts an agent without writing the loop: the package facade (`import smolagents` re-exports every public class), the `smolagent` CLI, the Gradio chat UI, and the Selenium/helium web-browser demo. They build a model and tools from arguments, then call `agent.run` and display what it yields."
modules = ["smolagents", "smolagents.cli", "smolagents.gradio_ui", "smolagents.vision_web_browser"]

[[layers]]
id = "agents"
name = "Agents (the ReAct loop)"
owns = "MultiStepAgent and its two concrete loops: CodeAgent (the model writes a Python snippet, an executor runs it) and ToolCallingAgent (the model emits JSON tool calls, the agent dispatches them). Owns the step loop, planning schedule, max_steps cut-off, final-answer checks, prompt templates (`prompts/*.yaml`, rendered with Jinja), managed sub-agents, and save/load/push of an agent to the Hub."
modules = ["smolagents.agents"]

[[layers]]
id = "models"
name = "Model gateway"
owns = "One `Model.generate(messages, stop_sequences, response_format, tools_to_call_from)` interface over every provider: OpenAI-compatible servers and Azure, LiteLLM (and its Router), Hugging Face InferenceClient, Amazon Bedrock, and local Transformers / vLLM / MLX. Also the chat message types (ChatMessage, stream deltas, tool-call objects) that memory and the UI reuse, rate limiting and rate-limit retries."
modules = ["smolagents.models"]

[[layers]]
id = "tools"
name = "Tools & default tools"
owns = "The Tool contract (name, description, typed inputs, output_type, forward), its validation and JSON-schema generation from type hints, the `@tool` decorator, Hub/Space/LangChain/MCP loaders, the built-in tools (web search, visit webpage, Wikipedia, speech-to-text, final_answer, user_input, python_interpreter) and the MCP client."
modules = ["smolagents.tools", "smolagents.default_tools", "smolagents.tool_validation", "smolagents._function_type_hints_utils", "smolagents.mcp_client"]

[[layers]]
id = "executors"
name = "Code executors"
owns = "Where a CodeAgent's snippet actually runs: LocalPythonExecutor (an AST interpreter in the host process with an import allow-list and operation caps) and the remote executors (E2B, Docker, Modal, Blaxel) that run it in a Jupyter kernel elsewhere, plus the JSON-first serializer that carries variables and final answers across that boundary."
modules = ["smolagents.local_python_executor", "smolagents.remote_executors", "smolagents.serialization"]

[[layers]]
id = "memory"
name = "Memory & monitoring"
owns = "The run's record, held in memory only (nothing is written to disk or a database unless the caller saves it): AgentMemory with SystemPromptStep / TaskStep / PlanningStep / ActionStep / FinalAnswerStep, each able to turn itself back into chat messages for the next model call; token and timing counters (TokenUsage, Timing, Monitor) and the rich console logger."
modules = ["smolagents.memory", "smolagents.monitoring"]

[[layers]]
id = "utils"
name = "Shared helpers & types"
owns = "Leaf helpers every layer uses: the AgentError family, code-blob and JSON parsing out of model text, BASE_BUILTIN_MODULES, RateLimiter and Retrying, source extraction for saving tools; and the AgentText/AgentImage/AgentAudio wrappers that let tools return media."
modules = ["smolagents.utils", "smolagents.agent_types"]

[[journeys]]
id = "tool-call"
title = "Call one tool: VisitWebpageTool fetches a page"
actor = "agent · ToolCallingAgent or model-written code"
trigger = "tool(url=...) — from ToolCallingAgent.execute_tool_call, or visit_webpage(...) inside code run by the executor"
summary = "Tool.__call__ lazily runs setup(), unpacks a single dict argument into keywords, optionally unwraps AgentType inputs, calls forward() and optionally wraps the output in an AgentType. VisitWebpageTool.forward then GETs the URL, converts the HTML to Markdown and truncates it; errors are returned as text, not raised."
  [[journeys.steps]]
  symbol = "smolagents.tools:Tool.__call__"
  actor = "ToolCallingAgent.execute_tool_call / LocalPythonExecutor"
  action = "Entry point for every tool: runs setup() once, converts a lone dict whose keys are all inputs into kwargs, and — only when sanitize_inputs_outputs=True — converts AgentType inputs to raw values and outputs to AgentTypes."
  receives = "*args / **kwargs, sanitize_inputs_outputs flag"
  returns = "forward()'s result, possibly wrapped"
  stores = "nothing"
  payload = '''
visit_webpage(url="https://example.org/leopard-facts")

'''
  note = "'sanitize' here means type conversion, not content cleaning. ToolCallingAgent passes True after validate_tool_arguments; code run by LocalPythonExecutor calls the tool directly, so the default False applies and no schema validation runs."
  [[journeys.steps]]
  symbol = "smolagents.tools:Tool.setup"
  action = "Hook for expensive one-time initialisation (PipelineTool loads its model here); the base version only sets is_initialized."
  receives = "nothing"
  returns = "nothing"
  stores = "self.is_initialized = True"
  [[journeys.steps]]
  symbol = "smolagents.agent_types:handle_agent_input_types"
  action = "Replaces any AgentType argument with its raw value (to_raw()), e.g. an AgentImage with the PIL image."
  receives = "args, kwargs"
  returns = "(args, kwargs) with raw values"
  stores = "nothing"
  [[journeys.steps]]
  symbol = "smolagents.default_tools:VisitWebpageTool.forward"
  action = "requests.get(url, timeout=20), raise_for_status, markdownify the HTML, collapse runs of blank lines, then truncate."
  receives = "url: str chosen by the model"
  returns = "Markdown text, or an error sentence ('The request timed out…', 'Error fetching the webpage: …')"
  stores = "nothing"
  payload = '''
"# Leopard\n\nLeopards can reach about 58 km/h in short bursts ..."

'''
  note = "No scheme or host check is made on the URL; whatever the page says is returned to the model verbatim."
  [[journeys.steps]]
  symbol = "smolagents.default_tools:VisitWebpageTool._truncate_content"
  action = "Cuts the Markdown at max_output_length (default 40,000 chars) and appends a note saying it was truncated."
  receives = "content, max_length"
  returns = "possibly shortened text"
  stores = "nothing"
  [[journeys.steps]]
  symbol = "smolagents.agent_types:handle_agent_output_types"
  action = "With sanitize on: output_type 'string' wraps the text in AgentText (a str subclass), so the agent stores it as an observation unchanged."
  receives = "forward()'s output, tool.output_type"
  returns = "AgentText"
  stores = "nothing"

[[journeys]]
id = "code-agent-run"
title = "Run a CodeAgent: the model writes Python, the library executes it"
actor = "developer · Python code"
trigger = "CodeAgent(tools, model).run(task)"
summary = "run() rebuilds the system prompt, records the task in memory and hands tools and variables to the Python executor; _run_stream then loops over steps, each asking the model for a code blob, executing it in LocalPythonExecutor and storing the printed logs as the next observation. The loop ends when the executed code calls final_answer(), or when max_steps is reached and the model is asked for a final answer without tools."
  [[journeys.steps]]
  symbol = "smolagents.agents:MultiStepAgent.run"
  actor = "developer code"
  action = "Sets up the run: merges additional_args into agent state (and appends their repr to the task text), puts a fresh SystemPromptStep into memory, resets memory and the token monitor when reset=True, appends a TaskStep, and pushes state and tools into the executor."
  receives = "task: str, plus optional stream, reset, images, additional_args, max_steps, return_full_result"
  returns = "the final answer (stream=False), a RunResult when return_full_result is set, or the _run_stream generator itself when stream=True"
  stores = "self.memory.system_prompt, self.memory.steps += TaskStep, self.state updated with additional_args"
  payload = '''
agent.run("How many seconds would a leopard at 58 km/h need to cross a 155 m bridge?",
          additional_args={"bridge_length_m": 155})

'''
  note = "With stream=False the whole generator is drained into a list and only steps[-1] (asserted to be a FinalAnswerStep) is used; the run's token totals are summed from every ActionStep/PlanningStep and become None if any step lacks token_usage."
  [[journeys.steps]]
  symbol = "smolagents.agents:CodeAgent.initialize_system_prompt"
  action = "Renders the system prompt from the code_agent.yaml (or structured_code_agent.yaml) Jinja template: tool signatures, managed agents, the authorized import list, custom instructions and the code-block tags the model must use."
  receives = "self.prompt_templates['system_prompt'], self.tools, self.authorized_imports, self.code_block_tags"
  returns = "system prompt text"
  stores = "nothing (called through the system_prompt property, so it is rebuilt on every run)"
  note = "MultiStepAgent.system_prompt is a read-only property that calls this abstract method; each agent class supplies its own template."
  [[journeys.steps]]
  symbol = "smolagents.local_python_executor:LocalPythonExecutor.send_tools"
  action = "Makes tools callable from generated code: combines the agent's tools and managed agents with BASE_PYTHON_TOOLS (the allowed builtins) and any additional_functions into static_tools."
  receives = "{tool name: Tool} including final_answer and managed agents"
  returns = "nothing"
  stores = "executor.static_tools (send_variables has already copied agent state into executor.state)"
  note = "Static tools cannot be reassigned by the generated code; a remote executor (E2B, Docker, Modal, Blaxel) implements the same PythonExecutor interface instead."
  [[journeys.steps]]
  symbol = "smolagents.agents:MultiStepAgent._run_stream"
  action = "The step loop: while no final answer and step_number <= max_steps, optionally runs a planning step, creates an ActionStep, delegates to self._step_stream and yields every event; model-caused AgentErrors are stored on the step and the loop continues, AgentGenerationError is re-raised."
  receives = "task text, max_steps, images"
  returns = "a generator of ChatMessageStreamDelta, ToolCall, ActionOutput, ActionStep, PlanningStep and finally a FinalAnswerStep"
  stores = "memory.steps += PlanningStep / ActionStep (appended in a finally block, so failed steps are kept too); step callbacks run in _finalize_step"
  note = "self._step_stream is a virtual call: MultiStepAgent._step_stream only raises NotImplementedError and CodeAgent/ToolCallingAgent override it. Errors are deliberately fed back to the model (ActionStep.to_messages adds 'Error: ... Now let's retry') rather than ending the run."
  [[journeys.steps]]
  symbol = "smolagents.agents:MultiStepAgent._generate_planning_step"
  action = "Only when planning_interval is set (step 1, then every N steps): asks the model for a facts-and-plan text with stop sequence <end_plan>; the first plan uses the initial_plan template, later ones a summary of memory between update_plan_pre/post templates."
  receives = "task, is_first_step, step number"
  returns = "yields stream deltas (if stream_outputs) and then one PlanningStep"
  stores = "PlanningStep (plan text, input messages, token usage) — appended to memory by _run_stream"
  payload = '''
PlanningStep(plan="Here are the facts I know and the plan of action ...\n1. convert 58 km/h to m/s\n2. divide 155 by it", token_usage=TokenUsage(input_tokens=812, output_tokens=96))

'''
  [[journeys.steps]]
  symbol = "smolagents.agents:CodeAgent._step_stream"
  action = "One think-act-observe step: turns the whole memory into messages (write_memory_to_messages), calls the model with stop sequences 'Observation:', 'Calling tools:' and the closing code tag, then parses and executes the code."
  receives = "the current ActionStep"
  returns = "yields ToolCall(name='python_interpreter', arguments=code) and finally ActionOutput(output, is_final_answer)"
  stores = "ActionStep.model_input_messages, model_output_message, model_output, token_usage, code_action, tool_calls, observations, action_output"
  note = "Any exception from the model call becomes AgentGenerationError (ends the run); a parsing failure becomes AgentParsingError and an execution failure AgentExecutionError (both fed back to the model). If the model output does not already end with the closing tag, the tag is appended to the stored output to nudge later generations to stop there."
  [[journeys.steps]]
  symbol = "smolagents.models:OpenAIModel.generate"
  action = "Example provider behind self.model.generate (a virtual call — Model.generate is abstract): cleans the messages, applies rate limit and retry, calls chat.completions.create and wraps the reply in a ChatMessage. See the model-generate journey."
  receives = "list[ChatMessage], stop_sequences, optional response_format (structured outputs)"
  returns = "ChatMessage(role='assistant', content=..., token_usage=...)"
  stores = "nothing"
  payload = '''
"Thought: convert speed, then divide.\n<code>\nspeed = 58 * 1000 / 3600\nfinal_answer(155 / speed)\n</code>"

'''
  [[journeys.steps]]
  symbol = "smolagents.utils:parse_code_blobs"
  action = "Extracts the code: every match of the configured tag pair (default <code>…</code>) joined together, else markdown ```python blocks, else the whole text if it parses as Python; otherwise raises ValueError with a hint the model will see."
  receives = "model output text, code_block_tags"
  returns = "code string"
  stores = "nothing"
  note = "With use_structured_outputs_internally the output is JSON instead and the code is read from its 'code' field."
  [[journeys.steps]]
  symbol = "smolagents.local_python_executor:fix_final_answer_code"
  action = "If the code both calls final_answer( and assigns to a variable named final_answer, renames the variable to final_answer_variable so the tool is not shadowed."
  receives = "code string"
  returns = "code string (unchanged in the common case)"
  stores = "ActionStep.code_action"
  [[journeys.steps]]
  symbol = "smolagents.local_python_executor:LocalPythonExecutor.__call__"
  action = "Runs the code against the executor's persistent state, static tools and authorized imports, and packages output, print logs and the final-answer flag."
  receives = "code_action: str"
  returns = "CodeOutput(output, logs, is_final_answer)"
  stores = "executor.state keeps every variable between steps (and between runs unless the agent is recreated)"
  note = "Its docstring says plainly: 'It is not a security sandbox: for isolated execution of untrusted code, use a remote executor.'"
  [[journeys.steps]]
  symbol = "smolagents.local_python_executor:evaluate_python_code"
  action = "ast.parse()s the code and walks each top-level node through evaluate_ast inside a thread with a 30 s timeout (MAX_EXECUTION_TIME_SECONDS); final_answer is wrapped to raise FinalAnswerException, a BaseException so generated 'except Exception' cannot swallow it."
  receives = "code, static_tools, custom_tools, state, authorized_imports, max_print_outputs_length"
  returns = "(result, is_final_answer)"
  stores = "state['_print_outputs'] (truncated to 50,000 chars by default), state['_operations_count']"
  note = "Limits enforced here and in evaluate_ast: MAX_OPERATIONS = 10,000,000 AST nodes, MAX_WHILE_ITERATIONS = 1,000,000, dunder attribute access refused, calls only to names in state, static tools, custom tools or ERRORS. On timeout the worker thread cannot be killed and keeps running in the background (stated in timeout's docstring)."
  [[journeys.steps]]
  symbol = "smolagents.local_python_executor:evaluate_import"
  action = "The import allow-list: 'import x' / 'from x import y' succeed only if check_import_authorized finds x in BASE_BUILTIN_MODULES plus additional_authorized_imports ('*' allows anything); the module is copied via get_safe_module before it enters state."
  receives = "an ast.Import / ast.ImportFrom node, state, authorized_imports"
  returns = "None, or raises InterpreterError 'Import of os is not allowed…'"
  stores = "the imported module (or names) into state"
  note = "Results of evaluate_ast pass through check_safer_result (safer_eval), which also refuses unauthorized module objects and DANGEROUS_FUNCTIONS such as builtins.eval/exec and os.system."
  [[journeys.steps]]
  symbol = "smolagents.agent_types:handle_agent_output_types"
  action = "After the loop, wraps the final answer in an AgentType (AgentText / AgentImage / AgentAudio) when its type is recognised, for the FinalAnswerStep."
  receives = "final answer value"
  returns = "AgentText('9.62…') or the raw value"
  stores = "FinalAnswerStep.output"
  note = "If max_steps runs out, _handle_max_steps_reached first calls provide_final_answer, a tool-less model call over the memory, and records an ActionStep carrying AgentMaxStepsError."

[[journeys]]
id = "tool-calling-agent-run"
title = "Run a ToolCallingAgent: the model returns JSON tool calls"
actor = "developer · Python code"
trigger = "ToolCallingAgent(tools, model).run(task)"
summary = "Same run/_run_stream loop as CodeAgent, but each step sends the tools as JSON schemas and expects tool calls back (native API tool calls, or a JSON blob parsed from text). Each call is checked against the tool's input schema and executed — several in parallel threads — and the stringified results become the step's observation; calling the final_answer tool ends the run."
  [[journeys.steps]]
  symbol = "smolagents.agents:MultiStepAgent.run"
  actor = "developer code"
  action = "Records the task, resets memory, rebuilds the system prompt (as in code-agent-run); there is no python_executor, so nothing is sent to one."
  receives = "task: str and run options"
  returns = "final answer or RunResult"
  stores = "memory.steps += TaskStep"
  payload = '''
agent.run("What is the population of Lyon divided by the population of Geneva?")

'''
  [[journeys.steps]]
  symbol = "smolagents.agents:ToolCallingAgent.initialize_system_prompt"
  action = "Renders the toolcalling_agent.yaml system prompt with tools, managed agents and custom instructions."
  receives = "prompt_templates, tools, managed_agents"
  returns = "system prompt text"
  stores = "nothing"
  [[journeys.steps]]
  symbol = "smolagents.agents:MultiStepAgent._run_stream"
  action = "Step loop with optional planning; calls the overridden ToolCallingAgent._step_stream (virtual call)."
  receives = "task, max_steps"
  returns = "generator of steps and events"
  stores = "memory.steps += ActionStep per step"
  [[journeys.steps]]
  symbol = "smolagents.agents:ToolCallingAgent._step_stream"
  action = "Builds messages from memory and calls model.generate (or generate_stream) with tools_to_call_from = tools + managed agents; if the reply has no native tool_calls it asks the model class to parse them from the text, otherwise it JSON-decodes each call's arguments."
  receives = "the current ActionStep"
  returns = "yields ToolCall / ToolOutput events, then ActionOutput(final_answer, is_final_answer)"
  stores = "ActionStep.model_output_message, model_output, token_usage"
  note = "A final_answer call mixed with other calls raises AgentExecutionError; two final answers raise AgentToolExecutionError. A string final answer that names a state key is replaced by that state value."
  [[journeys.steps]]
  symbol = "smolagents.models:OpenAIModel.generate"
  action = "Provider call; tools are sent as JSON schemas (get_tool_json_schema) with tool_choice='required' by default."
  receives = "messages, stop_sequences, tools_to_call_from"
  returns = "ChatMessage whose tool_calls hold the provider's tool-call objects"
  stores = "nothing"
  payload = '''
{"tool_calls": [{"id": "call_7", "type": "function", "function": {"name": "web_search", "arguments": "{\"query\": \"Lyon population 2024\"}"}}]}

'''
  [[journeys.steps]]
  symbol = "smolagents.models:Model.parse_tool_calls"
  action = "Fallback for providers that return the call as text: sets role to assistant and builds one ChatMessageToolCall from the JSON blob in the content (keys tool_name_key / tool_arguments_key, default 'name' / 'arguments')."
  receives = "ChatMessage without tool_calls"
  returns = "the same ChatMessage with tool_calls filled and arguments JSON-decoded"
  stores = "nothing"
  note = "Failure here becomes AgentParsingError, which the loop feeds back to the model."
  [[journeys.steps]]
  symbol = "smolagents.agents:ToolCallingAgent.process_tool_calls"
  action = "Turns each model tool call into a ToolCall event, then runs them: one call directly, several in a ThreadPoolExecutor(max_tool_threads) with copied contextvars, yielding results as they complete."
  receives = "ChatMessage with tool_calls, the ActionStep"
  returns = "yields ToolCall, then ToolOutput per call"
  stores = "ActionStep.tool_calls (sorted by id) and observations (each result's observation joined by newlines)"
  [[journeys.steps]]
  symbol = "smolagents.agents:ToolCallingAgent.process_tool_calls.process_single_tool_call"
  action = "Executes one call and turns the result into an observation: AgentImage/AgentAudio results are stored in state as image.png / audio.mp3 and summarised, anything else becomes str(result)."
  receives = "ToolCall(name, arguments, id)"
  returns = "ToolOutput(id, output, is_final_answer, observation, tool_call)"
  stores = "self.state['image.png'] or ['audio.mp3'] for media results"
  payload = '''
ToolOutput(id="call_7", output="## Search Results\n\n[Lyon - Wikipedia](https://en.wikipedia.org/wiki/Lyon)\n...", is_final_answer=False, observation="## Search Results ...")

'''
  [[journeys.steps]]
  symbol = "smolagents.agents:ToolCallingAgent.execute_tool_call"
  action = "Refuses unknown tool names, replaces any string argument that equals a state key with the state value, validates the arguments, then calls the tool with sanitize_inputs_outputs=True (managed agents are called without it)."
  receives = "tool_name, arguments (dict or single value)"
  returns = "the tool's output"
  stores = "nothing"
  note = "Validation failures become AgentToolCallError and execution failures AgentToolExecutionError, both with a 'Please try again' message the model reads on the next step."
  [[journeys.steps]]
  symbol = "smolagents.tools:validate_tool_arguments"
  action = "Checks each argument name is in tool.inputs, its JSON type matches (integer accepted for number, 'any' accepts all, null only when nullable), and every non-nullable input is present."
  receives = "Tool, arguments"
  returns = "None, or raises ValueError / TypeError"
  stores = "nothing"
  [[journeys.steps]]
  symbol = "smolagents.tools:Tool.__call__"
  action = "Runs the tool (see the tool-call journey): lazy setup, AgentType inputs unwrapped, forward(), output wrapped by output_type."
  receives = "keyword arguments"
  returns = "AgentText / AgentImage / AgentAudio or raw value"
  stores = "nothing"
  [[journeys.steps]]
  symbol = "smolagents.memory:ActionStep.to_messages"
  action = "On the next step, write_memory_to_messages replays this step to the model: assistant output, a TOOL_CALL message listing the calls, a TOOL_RESPONSE 'Observation:' message, and any error with a retry hint."
  receives = "the stored ActionStep"
  returns = "list[ChatMessage]"
  stores = "nothing"

[[journeys]]
id = "model-generate"
title = "Turn chat messages into a provider request and back"
actor = "agent step"
trigger = "self.model.generate(messages, stop_sequences=..., tools_to_call_from=...)"
summary = "An API model (OpenAIModel shown; LiteLLMModel and InferenceClientModel follow the same shape) flattens ChatMessages into provider dicts, adds stop sequences, tool schemas and the model's own kwargs, waits on its rate limiter and calls the client through a retryer that only retries rate-limit errors. The reply becomes a ChatMessage with content, tool_calls and token usage; if tool calls came back as text, parse_tool_calls extracts them from a JSON blob."
  [[journeys.steps]]
  symbol = "smolagents.models:OpenAIModel.generate"
  actor = "CodeAgent._step_stream / ToolCallingAgent._step_stream"
  action = "Builds completion kwargs (model id, role conversions, images as data URLs), rate-limits, calls client.chat.completions.create through the retryer, strips text after stop sequences for models that ignore 'stop', and builds the ChatMessage."
  receives = "list[ChatMessage], stop_sequences, response_format, tools_to_call_from"
  returns = "ChatMessage(role, content, tool_calls, raw=response, token_usage)"
  stores = "nothing"
  note = "The agent calls the Model through generate (Model.__call__ is just an alias); the base Model.generate raises NotImplementedError, so the provider subclass decides everything below."
  [[journeys.steps]]
  symbol = "smolagents.models:Model._prepare_completion_kwargs"
  action = "Assembles the request dict in priority order: cleaned messages, then stop / response_format / tools (+ tool_choice, default 'required'), then explicit kwargs, then the model's own self.kwargs (REMOVE_PARAMETER deletes a key)."
  receives = "messages and the specific parameters"
  returns = "completion_kwargs dict"
  stores = "nothing"
  payload = '''
{"model": "gpt-4.1-mini", "messages": [{"role": "system", "content": [{"type": "text", "text": "You are an expert assistant ..."}]}, {"role": "user", "content": [{"type": "text", "text": "New task:\nHow many seconds ..."}]}], "stop": ["Observation:", "Calling tools:", "</code>"]}

'''
  note = "stop is sent only if supports_stop_parameter(model_id) is true (some reasoning models reject it)."
  [[journeys.steps]]
  symbol = "smolagents.models:get_clean_message_list"
  action = "Deep-copies the messages, maps roles (tool-call and tool-response roles become assistant / user via tool_role_conversions), base64-encodes images (as image_url data URLs when asked), and merges consecutive messages of the same role."
  receives = "list[ChatMessage | dict], role_conversions, image flags"
  returns = "list of {'role', 'content'} dicts"
  stores = "nothing"
  note = "Images must be PIL images: encode_image_base64 calls image.save()."
  [[journeys.steps]]
  symbol = "smolagents.models:get_tool_json_schema"
  action = "For tool-calling requests, converts each Tool's name, description and inputs into an OpenAI-style function schema; inputs not marked nullable are listed as required."
  receives = "Tool"
  returns = "{'type': 'function', 'function': {'name', 'description', 'parameters'}}"
  stores = "nothing"
  [[journeys.steps]]
  symbol = "smolagents.models:ApiModel._apply_rate_limit"
  action = "Calls RateLimiter.throttle, which sleeps just long enough to respect requests_per_minute (no-op when unset)."
  receives = "nothing"
  returns = "nothing"
  stores = "the limiter's last-call timestamp"
  [[journeys.steps]]
  symbol = "smolagents.utils:Retrying.__call__"
  action = "Calls the client; on an exception that is_rate_limit_error recognises ('429', 'rate limit', 'too many requests' in the message) it sleeps with exponential backoff and jitter and tries again, up to RETRY_MAX_ATTEMPTS = 3; any other exception is re-raised at once."
  receives = "client function and completion kwargs"
  returns = "the provider response"
  stores = "nothing (logs each retry through the module logger)"
  note = "The delay starts from RETRY_WAIT = 60 s and is multiplied before the first sleep, so the first wait is 120–240 s. retry=False on the model sets max_attempts to 1."
  [[journeys.steps]]
  symbol = "smolagents.models:remove_content_after_stop_sequences"
  action = "When the provider was not sent 'stop', cuts the reply at the first stop sequence locally."
  receives = "content, stop_sequences"
  returns = "trimmed content"
  stores = "nothing"
  [[journeys.steps]]
  symbol = "smolagents.models:Model.parse_tool_calls"
  action = "Called by ToolCallingAgent when the ChatMessage has no tool_calls: builds one from the text with get_tool_call_from_text and JSON-decodes arguments."
  receives = "ChatMessage"
  returns = "ChatMessage with tool_calls"
  stores = "nothing"
  [[journeys.steps]]
  symbol = "smolagents.models:get_tool_call_from_text"
  action = "Reads the tool name and arguments keys from the parsed JSON blob and gives the call a fresh uuid4 id."
  receives = "text, tool_name_key, tool_arguments_key"
  returns = "ChatMessageToolCall"
  stores = "nothing"
  payload = '''
'Action: {"name": "final_answer", "arguments": {"answer": "about 2.2"}}'  ->  ChatMessageToolCall(id="4f1c…", function=ChatMessageToolCallFunction(name="final_answer", arguments={"answer": "about 2.2"}))

'''
  [[journeys.steps]]
  symbol = "smolagents.utils:parse_json_blob"
  action = "Takes the text from the first '{' to the last '}' and json.loads it (strict=False); errors become ValueError messages written for the model, including a hint when it tried to send several calls."
  receives = "text"
  returns = "(dict, text before the JSON)"
  stores = "nothing"

[[journeys]]
id = "cli-run"
title = "Run an agent from the smolagent console command"
actor = "user · terminal"
trigger = "smolagent \"<task>\" --model-type ... --tools ... (entry point smolagents.cli:main)"
summary = "main parses arguments, or walks the user through an interactive questionnaire when no prompt is given, then run_smolagent loads .env, builds the model and the named tools, creates a CodeAgent (or ToolCallingAgent) with streaming output and calls run(prompt). The answer is printed by the agent's rich logger; main returns nothing."
  [[journeys.steps]]
  symbol = "smolagents.cli:main"
  actor = "terminal"
  action = "Parses arguments; with no positional prompt switches to interactive_mode, otherwise copies the parsed options; then calls run_smolagent."
  receives = "sys.argv"
  returns = "None"
  stores = "nothing"
  payload = '''
smolagent "Summarise today's top AI news" --model-type InferenceClientModel --model-id Qwen/Qwen3-Next-80B-A3B-Thinking --tools web_search visit_webpage --imports numpy

'''
  [[journeys.steps]]
  symbol = "smolagents.cli:parse_arguments"
  action = "argparse definition: prompt (optional), --model-type (default InferenceClientModel), --action-type (code | tool_calling), --model-id, --imports, --tools (default web_search), --verbosity-level, --provider, --api-base, --api-key."
  receives = "command line"
  returns = "argparse.Namespace"
  stores = "nothing"
  note = "--verbosity-level is parsed but never passed to the agent."
  [[journeys.steps]]
  symbol = "smolagents.cli:interactive_mode"
  action = "Rich prompts for action type, tools (showing TOOL_MAPPING descriptions), model type, model id, optional provider / API base / key / imports, and the task."
  receives = "keyboard input"
  returns = "(prompt, tools, model_type, model_id, provider, api_base, api_key, imports, action_type)"
  stores = "nothing"
  note = "action_type is reset to 'code' after the question, and the offered model type 'OpenAIServerModel' is not a name load_model accepts — see findings."
  [[journeys.steps]]
  symbol = "smolagents.cli:run_smolagent"
  action = "load_dotenv(), load the model, resolve tool names (a name containing '/' becomes Tool.from_space, otherwise TOOL_MAPPING[name]()), build the agent with stream_outputs=True and run it."
  receives = "prompt, tool names, model options, imports, action_type"
  returns = "None (the run's answer is not returned or printed by the CLI itself)"
  stores = "environment variables from a .env file into os.environ"
  note = "An unknown tool name raises ValueError before any model call."
  [[journeys.steps]]
  symbol = "smolagents.cli:load_model"
  action = "Maps model_type to a class: OpenAIModel (api_base defaults to the Fireworks endpoint, key from FIREWORKS_API_KEY), LiteLLMModel, TransformersModel (device_map='auto'), InferenceClientModel (token from HF_API_KEY); anything else raises ValueError."
  receives = "model_type, model_id, api_base, api_key, provider"
  returns = "a Model instance"
  stores = "nothing"
  [[journeys.steps]]
  symbol = "smolagents.tools:Tool.from_space"
  action = "For a tool name like 'user/space', wraps a Hugging Face Space as a Tool via gradio_client, with the space name as tool name."
  receives = "space_id, name, description"
  returns = "SpaceToolWrapper"
  stores = "nothing"
  [[journeys.steps]]
  symbol = "smolagents.agents:CodeAgent.__init__"
  action = "Loads the code_agent.yaml prompts, computes authorized_imports = BASE_BUILTIN_MODULES + --imports, picks code-block tags, runs MultiStepAgent setup (tools, final_answer tool, memory, logger, monitor) and creates the executor."
  receives = "tools, model, additional_authorized_imports, stream_outputs=True"
  returns = "CodeAgent"
  stores = "agent.memory, agent.python_executor"
  note = "stream_outputs=True requires the model to implement generate_stream, else ValueError."
  [[journeys.steps]]
  symbol = "smolagents.agents:CodeAgent.create_python_executor"
  action = "executor_type 'local' (the CLI's only choice) gives LocalPythonExecutor, which checks that every authorized import is installed; remote types map to Blaxel/E2B/Docker/Modal executors."
  receives = "executor_type, additional_authorized_imports"
  returns = "PythonExecutor"
  stores = "nothing"
  [[journeys.steps]]
  symbol = "smolagents.agents:MultiStepAgent.run"
  action = "Runs the task as in code-agent-run; with stream_outputs the model's tokens are shown live in the terminal through rich.Live."
  receives = "prompt"
  returns = "final answer (discarded by run_smolagent)"
  stores = "agent memory for this process only"

[[journeys]]
id = "gradio-chat"
title = "Chat with an agent in the Gradio UI"
actor = "user · browser"
