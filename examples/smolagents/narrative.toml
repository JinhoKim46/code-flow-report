config = "Environment variables SERPAPI_API_KEY or SERPER_API_KEY (GoogleSearchTool, chosen by `provider`), BRAVE_API_KEY (ApiWebSearchTool, name overridable by `api_key_name`, endpoint by `endpoint`), EXA_API_KEY (WebSearchTool engine='exa'); `max_results`, `rate_limit`, `engine` in the constructors."
