[[findings]]
id = "langchain-handler-bedrock-star"
severity = "medium"
category = "risk"
title = "The LangChain request handler may call every Bedrock API on every resource"
detail = "Now: lib/model-interfaces/langchain/index.ts adds a policy with actions bedrock:* on resources * to the RequestHandler role, on top of the narrower InvokeModel/ApplyGuardrail statement. This is the Lambda that processes users' prompts and model output. Trigger: a bug or a compromised dependency in that Lambda (it loads LangChain, OpenAI and provider SDKs). Reach: every Bedrock resource in the account and region — it could delete knowledge bases, agents or guardrails, or create provisioned throughput billed to the account. The code only needs invoke, retrieve, agent-invoke and guardrail calls."
