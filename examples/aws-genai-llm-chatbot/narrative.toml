symbols = ["lib.shared.file-import-batch-job.main:main"]
purpose = "Turns one uploaded file into indexed chunks: reads it from S3 (plain read for .txt, LangChain S3FileLoader otherwise), saves the text to the processing bucket, splits it with the workspace's chunking settings and calls add_chunks. Started by the FileImportStateMachine (Step Functions batch:submitJob.sync), which UploadHandler starts for every non-Kendra upload."
input = "Container env vars WORKSPACE_ID, DOCUMENT_ID, INPUT_BUCKET_NAME, INPUT_OBJECT_KEY, PROCESSING_BUCKET_NAME, PROCESSING_OBJECT_KEY passed by the state machine."
config = "Job definition in lib/rag-engines/data-import/file-import-batch-job.ts (timeout 30 minutes, retryAttempts 3); state machine timeout 12 hours."
validation = "Missing workspace or document raises before any work. Any error inside the processing block sets the document status to 'error' and re-raises, so Batch retries the job (up to 3 attempts); add_chunks is called with replace=True so a retry replaces earlier chunks. The state machine sets 'processing' before and 'processed' after; it has no catch, so a failure outside the try block leaves the status 'processing'."
logging = "print() to the Batch job's CloudWatch log; the state machine logs to /aws/vendedlogs/states/FileImportStateMachine-*."

