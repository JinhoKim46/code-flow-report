# Narrative for the code-flow report — the only hand-written input.
#
# Structure (modules, functions, call edges, routes, SQL access, boundaries) comes from code_map.json.
# This file adds the explanation around it. Every `symbol` / `module` / `table` named here is checked
# against the code on every build; a name that no longer exists fails the build and the staleness test.
# Never write line numbers — the builder adds file:line from the code map.
#
# Proposed by `codeflow.py draft`. Replace every "TODO: …" (the report shows how many are left).
# Severities: high | medium | low | info.  Stages: born | transform | update | store | archive | restore | read | delete.
# A finding with a `check` retires itself: once the code no longer shows it, it moves to the page's Fixed list.
# Layer `modules` may use "pkg.*" patterns. With [[layers]] present, every module must match one.
# [module_notes."pkg.mod"]: purpose / does / flow (+ optional note) per module — written from the code, never a copied docstring.


[meta]
title = "aws-genai-llm-chatbot"
lede = "A multi-model chatbot on AWS: users chat with Bedrock, SageMaker or third-party LLMs, optionally grounded in their own documents through retrieval-augmented generation (RAG) over Aurora pgvector, OpenSearch, Kendra or Bedrock Knowledge Bases. The React UI talks to an AppSync GraphQL API whose Lambdas either answer directly (workspaces, documents, sessions, applications) or publish chat requests to SNS → SQS for the model-interface handlers, which stream replies back through AppSync, while Step Functions workflows, Batch jobs and scheduled Lambdas build and maintain the RAG indexes — all deployed with CDK."
audience = "learning the code"

[module_notes.lib]
purpose = "Package marker for the `lib` tree, which mixes the TypeScript CDK constructs with the Python Lambda, Batch and SageMaker code they deploy."
does = "Holds nothing itself; every Python module in the report sits under it."
flow = "Never imported at runtime: each Lambda, Batch container and SageMaker endpoint is packaged from its own sub-folder, so `lib` only exists as a name for the analysis."

[module_notes."lib.authentication.lambda.addFederatedUserToUserGroup.index"]
purpose = "Keeps every user in exactly one Cognito group that matches their `custom:chatbot_role` attribute, because the API's role checks read that group from the token."
does = "Recognises the Cognito trigger from `triggerSource`; on pre-sign-up only records the resolved role (the federated user does not exist yet); on post-confirmation and pre-token-generation removes the user from every other group and adds them to the target group (default from `DEFAULT_USER_GROUP`, falling back to `user`); on pre-token-generation also overrides the `cognito:groups` claim so the very first token already carries the right group."
flow = "Cognito UserPool triggers PRE_SIGN_UP, POST_CONFIRMATION and PRE_TOKEN_GENERATION → Lambda addFederatedUserToUserGroup → handler → get_user_groups / remove_user_from_group / add_user_to_group (cognito-idp admin APIs) → override_token_groups edits the event returned to Cognito."
note = "The role comes from a user attribute, so whoever controls `custom:chatbot_role` (the identity provider mapping) controls admin access. A group that does not exist is silently skipped (ResourceNotFoundException is swallowed), leaving the user in no group at all."

[module_notes."lib.chatbot-api.functions.api-handler.common.constant"]
purpose = "One place for the input limits and allow-list regexes the API routes apply to every string they accept."
does = "Defines the reusable pydantic `Field` validators for ids and short strings, the safe-character regexes for ids, prompts, URLs and file names, the 1 MB text cap, and the `UserRole` enum (`admin`, `workspace_manager`)."
flow = "Imported by the GraphQLApiHandler route modules (applications, documents, sessions, embeddings, cross_encoders, semantic_search, user_feedback) and by common.validation; runs only at import time."
note = "`UserRole` duplicates the role names in genai_core.auth:UserPermissions; changing one without the other splits the inline role checks from the decorator ones."

[module_notes."lib.chatbot-api.functions.api-handler.common.validation"]
purpose = "Shared pydantic models for the one-id arguments many resolvers take, so an id is checked the same way everywhere."
does = "Validates a `workspaceId` or an `id` against the 1–100 character safe-string rule."
flow = "Called at the top of resolvers in routes.workspaces, routes.kendra, routes.sessions, routes.applications and routes.user_feedback before anything touches DynamoDB; a failure becomes a pydantic ValidationError that index.handler turns into \"Invalid request\"."
note = "routes.sessions reuses WorkspaceIdValidation to check a session id — same rule, misleading name."

[module_notes."lib.chatbot-api.functions.api-handler.index"]
purpose = "The single Lambda behind every non-streaming GraphQL field: it routes each AppSync call to the right resolver and decides what an error looks like to the user."
does = "Registers the fifteen route modules on one AppSyncResolver; logs the field name, arguments and caller identity; turns pydantic errors into a readable \"Invalid request\" message, passes CommonError through, and replaces any other exception with a generic \"Something went wrong\" so internals do not leak."
flow = "UI → AppSync ChatbotApi (proxyResolverFunction data source) → Lambda GraphQLApiHandler → handler → app.resolve picks the route function by `fieldName` → genai_core modules → DynamoDB (Sessions, Applications, Workspaces, Documents), S3, SSM config, Step Functions."
note = "Arguments are logged in full (`arguments=event[\"arguments\"]`), so prompts, feedback text and document text uploaded through addTextDocument end up in CloudWatch."

[module_notes."lib.chatbot-api.functions.api-handler.routes.agents"]
purpose = "Lets admins and workspace managers see which Bedrock agents can be chosen in the UI."
does = "Answers `listAgents` with the list from genai_core.agents."
flow = "AppSync `listAgents` → GraphQLApiHandler → agents (approved_roles admin/workspace_manager) → genai_core.agents.list_agents."

[module_notes."lib.chatbot-api.functions.api-handler.routes.applications"]
purpose = "CRUD for \"applications\" — pre-configured chatbots (model, workspace, prompts, limits) that admins publish to chosen Cognito roles."
does = "Lists applications: everything for admin/workspace_manager, otherwise only those shared with one of the caller's roles (deduplicated); returns the full configuration to admins and a trimmed public view (name, input options, streaming) to everyone else; lets only admins create, update and delete them, validating names, prompts (256 safe chars), token and sampling limits."
flow = "AppSync list/get/create/update/deleteApplication → GraphQLApiHandler → these resolvers → genai_core.applications → DynamoDB ApplicationsTable. The send-query resolver later reads the same table to turn an application id into model settings."
note = "list_applications returns the admin field as `condenseSstemPrompt` (typo), while get/create/update use `condenseSystemPrompt`, so the admin list never shows the condense prompt."

[module_notes."lib.chatbot-api.functions.api-handler.routes.bedrock_kb"]
purpose = "Lists the Bedrock Knowledge Bases a workspace can be attached to."
does = "Answers `listBedrockKnowledgeBases` for admins and workspace managers."
flow = "AppSync → GraphQLApiHandler → list_bedrock_kbs → genai_core.bedrock_kb.list_bedrock_kbs (Bedrock agent API in the configured KB region)."

[module_notes."lib.chatbot-api.functions.api-handler.routes.cross_encoders"]
purpose = "Exposes the configured re-ranking (cross-encoder) models for the RAG playground."
does = "Lists cross-encoder models; ranks a list of passages against a reference text with a chosen model and returns score/passage pairs."
flow = "AppSync listCrossEncoders / rankPassages → GraphQLApiHandler → models / cross_encoders (admin/workspace_manager) → genai_core.cross_encoder.rank_passages → SageMaker RAG models endpoint (inference.predict_fn, `cross-encoder` branch)."

[module_notes."lib.chatbot-api.functions.api-handler.routes.documents"]
purpose = "Everything a workspace manager does to put content into a RAG workspace, and the upload URLs users need to attach files to a chat."
does = "Issues presigned S3 POST URLs — into the UploadBucket for a workspace (admin/workspace_manager, document extensions only) or into the user's FilesBucket prefix for chat attachments (media extensions); creates text, Q&A, website and RSS-feed documents; lists, reads, deletes and pauses/resumes documents and RSS subscriptions; refuses website/RSS URLs that are IP literals or resolve to a private address."
flow = "AppSync → GraphQLApiHandler → file_upload / add_* / get_documents / delete_document … → genai_core.presign or genai_core.documents → DynamoDB Documents; create_document then starts the FileImport or WebsiteCrawling Step Functions workflow, and delete_document starts DeleteDocument. File uploads continue asynchronously: S3 UploadBucket → SQS IngestionQueue → upload-handler Lambda."
note = "The private-address check resolves the hostname once at submit time; the crawler fetches later, so a hostname that changes its DNS answer afterwards is not re-checked here."

[module_notes."lib.chatbot-api.functions.api-handler.routes.embeddings"]
purpose = "Lets admins try the configured embedding models directly from the UI."
does = "Lists embedding models; computes vectors for a list of passages with a chosen model and task (store or retrieve)."
flow = "AppSync listEmbeddingModels / calculateEmbeddings → GraphQLApiHandler → models / embeddings (admin/workspace_manager) → genai_core.embeddings.generate_embeddings → Bedrock, OpenAI or the SageMaker RAG models endpoint."

[module_notes."lib.chatbot-api.functions.api-handler.routes.health"]
purpose = "A no-dependency probe that proves AppSync can reach the API Lambda."
does = "Answers `checkHealth` with true for any signed-in caller."
flow = "AppSync checkHealth → GraphQLApiHandler → health; touches nothing else."

[module_notes."lib.chatbot-api.functions.api-handler.routes.kendra"]
purpose = "Admin controls for Kendra-backed workspaces."
does = "Lists the Kendra indexes the stack knows; starts a data-source sync for a workspace (returning false instead of failing when one is already running); reports whether a sync is in progress."
flow = "AppSync listKendraIndexes / startKendraDataSync / isKendraDataSynching → GraphQLApiHandler → these resolvers (admin/workspace_manager) → genai_core.kendra → Kendra index and its S3 KendraDataBucket data source."

[module_notes."lib.chatbot-api.functions.api-handler.routes.models"]
purpose = "Gives the UI the list of chat models it may offer to admins and workspace managers."
does = "Answers `listModels` from genai_core.models (Bedrock, SageMaker endpoints from the ModelsParameter, third-party keys)."
flow = "AppSync listModels → GraphQLApiHandler → models (admin/workspace_manager) → genai_core.models.list_models."

[module_notes."lib.chatbot-api.functions.api-handler.routes.rag"]
purpose = "Tells the UI which RAG engines this deployment switched on, so it only offers workspace types that exist."
does = "Reads the deployment config and returns Aurora, OpenSearch, Kendra and Bedrock KB with an `enabled` flag each."
flow = "AppSync listRagEngines → GraphQLApiHandler → engines (admin/workspace_manager) → genai_core.parameters.get_config (SSM parameter Config)."

[module_notes."lib.chatbot-api.functions.api-handler.routes.roles"]
purpose = "Lists the Cognito groups an admin can share an application with."
does = "Answers `listRoles` for admins only."
flow = "AppSync listRoles → GraphQLApiHandler → list_roles (admin) → genai_core.roles.list_roles (Cognito user pool groups)."

[module_notes."lib.chatbot-api.functions.api-handler.routes.semantic_search"]
purpose = "The RAG playground's search box: query one workspace and see what retrieval would feed the model."
does = "Validates the workspace id and a ≤256-character query; runs the engine's search with up to 25 results and the full response; renames every result field from snake_case to the GraphQL camelCase shape, keeping vector and keyword hits separate."
flow = "AppSync performSemanticSearch → GraphQLApiHandler → semantic_search (admin/workspace_manager) → genai_core.semantic_search.semantic_search → Aurora pgvector, OpenSearch, Kendra or Bedrock KB → _convert_semantic_search_result."

[module_notes."lib.chatbot-api.functions.api-handler.routes.sessions"]
purpose = "Each user's own chat history: list, open, delete, and download the files they attached."
does = "Scopes every call to the caller's Cognito `sub`; lists sessions with the first message as title; returns one session's history, adding each message's model metadata only for admin/workspace_manager; deletes one or all of the user's sessions; issues a 10-minute presigned GET for a file in the user's own prefix."
flow = "AppSync listSessions / getSession / deleteSession / deleteUserSessions / getFileURL → GraphQLApiHandler → these resolvers → genai_core.sessions (DynamoDB SessionsTable, keyed by session id and user id) or genai_core.presign (S3 FilesBucket)."

[module_notes."lib.chatbot-api.functions.api-handler.routes.user_feedback"]
purpose = "Records a thumbs-up/down on one answer so it can be exported for evaluation."
does = "Validates session id, message index, feedback and text sizes; when the chat came from an application, takes the model name from the application record instead of the client; stores the feedback with the caller's user id."
flow = "AppSync addUserFeedback → GraphQLApiHandler → user_feedback → genai_core.applications.get_application (ApplicationsTable, when applicationId is set) → genai_core.user_feedback.add_user_feedback → S3 UserFeedbackBucket."

[module_notes."lib.chatbot-api.functions.api-handler.routes.workspaces"]
purpose = "Creating, listing and deleting RAG workspaces — the containers that pair a RAG engine with an embedding model and chunking settings."
does = "Lists and reads workspaces in the UI's shape; validates a new workspace against the deployment config (embedding and cross-encoder model must exist, 1–3 languages, metric, chunk size 100–10000, overlap smaller than size); creates Aurora, OpenSearch, Kendra (index must be known) or Bedrock KB (KB id must exist) workspaces; deletes one."
flow = "AppSync create*Workspace / listWorkspaces / getWorkspace / deleteWorkspace → GraphQLApiHandler → these resolvers (admin/workspace_manager) → genai_core.workspaces → DynamoDB Workspaces, then Step Functions CreateAuroraWorkspace / CreateOpenSearchWorkspace / CreateKendraWorkspace to build the index, or DeleteWorkspace to tear it down."

[module_notes."lib.chatbot-api.functions.resolvers.send-query-lambda-resolver.applications"]
purpose = "A minimal ApplicationsTable reader for the send-query resolver, which ships without the genai_core layer."
does = "Fetches one application item by id from the table named in `APPLICATIONS_TABLE_NAME`."
flow = "Called by send-query-lambda-resolver.index:handler when a chat message carries an applicationId → DynamoDB ApplicationsTable get_item."

[module_notes."lib.chatbot-api.functions.resolvers.send-query-lambda-resolver.index"]
purpose = "The front door for every chat message: checks who may send it, fills in application settings, and hands it to the model interfaces asynchronously."
does = "Reads the caller's Cognito groups; for an application chat, allows the user only if they share a role with the application (admin/workspace_manager always) and replaces model, workspace, sampling settings and system prompts with the application's values, dropping images/videos/documents the application does not allow; for a free-form chat, allows only admin/workspace_manager; validates the final message with pydantic (safe strings, temperature/topP 0–1) and publishes it."
flow = "UI sendQuery mutation → AppSync ChatbotApi (realtimeResolverFunction) → Lambda lambda-resolver → handler → applications.get_application (ApplicationsTable) → InputValidation → SNS MessagesTopic → SQS LangChain / Idefics / Bedrock-agents ingestion queues → model-interface RequestHandler Lambdas, which reply over SNS → OutgoingMessagesQueue → outgoing-message-handler → AppSync subscription."
note = "The application branch appends the misspelled role `workspace_namager` to the allowed roles; harmless today because admin/workspace_manager are checked separately. The first `InputValidation(**message)` runs outside the try block, so a validation failure surfaces as a raw pydantic error rather than the cleaned \"Invalid request\" message."

[module_notes."lib.model-interfaces"]
purpose = "Groups the three model interfaces — the Lambdas that actually call a model after a chat message leaves the API."
does = "Holds one sub-package per interface: langchain (text and RAG chat for Bedrock, SageMaker, OpenAI, Azure OpenAI, GenAIEH and classic Bedrock Agents), idefics (multimodal: Claude 3 on Bedrock and IDEFICS on SageMaker) and bedrock-agents (Bedrock AgentCore runtimes)."
flow = "MessagesTopic (SNS) → subscription filter on the message body's modelInterface ('langchain' / 'multimodal' / 'agent') → that interface's SQS ingestion queue → its RequestHandler Lambda → reply published back to MessagesTopic with direction OUT."

[module_notes."lib.model-interfaces.bedrock-agents"]
purpose = "Package for the Bedrock AgentCore interface, deployed only when Bedrock is enabled in the config."
does = "Contains the request-handler Lambda code that forwards a chat turn to an AgentCore runtime."
flow = "Created by BedrockAgentsInterface in lib/aws-genai-llm-chatbot-stack.ts; MessagesTopic messages with modelInterface 'agent' reach its IngestionQueue."

[module_notes."lib.model-interfaces.bedrock-agents.functions"]
purpose = "Holds the Lambda function sources of the Bedrock AgentCore interface."
does = "Contains one function, request-handler."
flow = "Packaged by lib/model-interfaces/bedrock-agents/index.ts as the RequestHandler Lambda."

[module_notes."lib.model-interfaces.bedrock-agents.functions.request-handler"]
purpose = "Source folder of the AgentCore RequestHandler Lambda."
does = "Splits the code into a thin SQS entry point (index) and the testable logic (bedrock_agents_core)."
flow = "SQS IngestionQueue → index:handler → bedrock_agents_core:handle_run / handle_heartbeat."

[module_notes."lib.model-interfaces.bedrock-agents.functions.request-handler.bedrock_agents_core"]
purpose = "Forwards a chat turn to a Bedrock AgentCore runtime and relays its streamed thinking and answer to the user."
does = "Accepts only a full 'arn:aws:bedrock-agentcore:…:runtime/…' ARN as data.agentRuntimeArn; loads the last 20 messages of the session from SessionsTable and sends the whole record plus that history as the payload of invoke_agent_runtime; parses an event-stream reply line by line into THINKING_STEP and LLM_NEW_TOKEN messages, or reads a plain JSON reply's result.content; publishes FINAL_RESPONSE (metadata: runtime ARN, trace id, metrics) and then appends the user and AI messages to SessionsTable."
flow = "index:record_handler → handle_run → get_conversation_history (DynamoDB SessionsTable) → genai_core.clients.get_agentcore_client().invoke_agent_runtime → send_to_client per chunk (SNS MessagesTopic, direction OUT) → save_session_history (SessionsTable)."
note = "Every exception is caught and turned into a generic 'error' message to the user, so a record never fails and never reaches the IngestionDLQ. If saving history fails, it tries to store 'Error occurred: <exception text>' as an AI message in the session."

[module_notes."lib.model-interfaces.bedrock-agents.functions.request-handler.index"]
purpose = "SQS entry point of the AgentCore RequestHandler Lambda: unwraps the SNS envelope and dispatches by action."
does = "Runs each SQS record through a powertools BatchProcessor; parses the SNS Message JSON; sends 'run' to bedrock_agents_core.handle_run and 'heartbeat' to handle_heartbeat; returns batchItemFailures, which this queue's event source does honour (reportBatchItemFailures: true)."
flow = "MessagesTopic (modelInterface 'agent') → SQS IngestionQueue → Lambda RequestHandler → handler → record_handler → bedrock_agents_core."

[module_notes."lib.model-interfaces.idefics.functions.request-handler.adapters"]
purpose = "Package whose import registers the multimodal adapters in the shared regex registry."
does = "Imports Claude3 and Idefics so their registry.register calls run before the handler looks a model up."
flow = "idefics request-handler index imports it at cold start → genai_core.registry gets 'bedrock(.*).anthropic.claude-3.*' → Claude3 and 'sagemaker.*idefics*' → Idefics."

[module_notes."lib.model-interfaces.idefics.functions.request-handler.adapters.base"]
purpose = "Base class for the multimodal adapters: turns history and attached files into Bedrock Converse messages and calls Converse."
does = "Fetches each attached file from FilesBucket under private/<userId>/ and wraps it as an image/video content block; replays Human and AI history turns as user/assistant messages; calls converse or converse_stream on the Bedrock client created at import time, forwarding streamed text deltas to on_llm_new_token; blanks image/video bytes before the prompt is logged into history (clean_prompt); can upload generated bytes back to FilesBucket."
flow = "idefics index:handle_run → format_prompt (S3 FilesBucket reads) → subclass handle_run → converse (Bedrock Runtime) → result returned to index for SessionsTable and MessagesTopic."
note = "The Bedrock client is a dataclass default evaluated once at import, so every instance in a warm container shares it."

[module_notes."lib.model-interfaces.idefics.functions.request-handler.adapters.claude"]
purpose = "Routes Claude 3 on Bedrock through the multimodal Lambda."
does = "Adds nothing to the base class except handle_run = converse, so Claude 3 gets the base's image blocks and streaming; registers '^bedrock.anthropic.claude-3.*' and the cross-region '^bedrock.*.anthropic.claude-3.*'."
flow = "Chosen by registry.get_adapter in idefics index:handle_run when a multimodal request names a Claude 3 model → MultiModalModelBase.converse → Bedrock Runtime Converse."

[module_notes."lib.model-interfaces.idefics.functions.request-handler.adapters.idefics"]
purpose = "Talks to an IDEFICS vision-language model on a SageMaker endpoint, which takes one text prompt rather than Converse messages."
does = "Overrides format_prompt to write 'User:…![](<url>)' / 'Assistant:…' turns, where each image is a URL on the ChatbotFilesPrivateApi (CHATBOT_FILES_PRIVATE_API) so the endpoint fetches it itself; overrides handle_run to call a LangChain SagemakerEndpoint with IDEFICS defaults (top_p 0.2, temperature 0.4, 512 new tokens, stop at 'User:'); registers '^sagemaker.*idefics*'."
flow = "Chosen by registry.get_adapter in idefics index:handle_run → format_prompt → handle_run → SagemakerEndpoint.predict (content_handler.ContentHandler) → SageMaker endpoint named by the model id."
note = "Both overrides have signatures that idefics index:handle_run does not match (format_prompt needs user_id; handle_run takes prompt, not input/files) — see the finding idefics-adapter-signature-mismatch."

[module_notes."lib.model-interfaces.idefics.functions.request-handler.content_handler"]
purpose = "Request/response codec between LangChain's SagemakerEndpoint and the IDEFICS endpoint."
does = "Sends {inputs, parameters} as JSON; reads generated_text from the first result and keeps only what follows the last 'Assistant:'."
flow = "Instantiated by adapters.idefics:Idefics.handle_run and passed to SagemakerEndpoint."

[module_notes."lib.model-interfaces.idefics.functions.request-handler.index"]
purpose = "SQS entry point of the multimodal Lambda: builds a multimodal prompt from the session history and attached images, runs the model, saves both turns."
does = "Reads SessionsTable history and data.images; picks Claude3 or Idefics from genai_core.registry by 'provider.modelName' and wires its on_llm_new_token to publish LLM_NEW_TOKEN messages; stores the user and AI messages with metadata (prompt with image bytes blanked by clean_prompt, file keys); publishes FINAL_RESPONSE; turns failed records into a short user-facing message (Nova Reel size, model access, otherwise 'Something went wrong')."
flow = "MessagesTopic (direction IN, modelInterface 'multimodal') → SQS IdeficsIngestionQueue → Lambda MultiModalInterfaceRequestHandler → handler → record_handler → handle_run → adapter.format_prompt / handle_run (Bedrock Converse or SageMaker endpoint) → DynamoDBChatMessageHistory (SessionsTable) → send_to_client (SNS MessagesTopic)."
note = "The response metadata (model kwargs, prompts, file keys) goes to every user; is_admin_role is defined here but never called. The Lambda is deployed only if a model whose name contains 'idefics' is configured, even though it also serves Claude 3."

[module_notes."lib.model-interfaces.langchain"]
purpose = "Package for the LangChain interface, the main path for text and RAG chat."
does = "Contains the request-handler Lambda and its per-provider adapters."
flow = "Created by LangChainInterface in lib/aws-genai-llm-chatbot-stack.ts when a model uses the langchain interface or Bedrock / GenAIEH is enabled in the config; MessagesTopic messages with direction IN and modelInterface 'langchain' reach LangChainIngestionQueue."

[module_notes."lib.model-interfaces.langchain.functions"]
purpose = "Holds the Lambda function sources of the LangChain interface."
does = "Contains one function, request-handler."
flow = "Packaged by lib/model-interfaces/langchain/index.ts as the RequestHandler Lambda."

[module_notes."lib.model-interfaces.langchain.functions.request-handler"]
purpose = "Source folder of the LangChain RequestHandler Lambda."
does = "Holds the SQS entry point (index) and the adapters package that maps a 'provider.model' name to a class."
flow = "SQS LangChainIngestionQueue → index:handler → registry.get_adapter → an adapters.* class → model call."

[module_notes."lib.model-interfaces.langchain.functions.request-handler.adapters"]
purpose = "Importing this package is what fills the adapter registry; the handler has no other list of models."
does = "Imports every provider sub-package in a fixed order (openai, azureopenai, sagemaker, bedrock, bedrock_agent, shared, genaieh) so each module's registry.register call runs; re-exports Mode."
flow = "langchain request-handler index does `import adapters` at cold start → each sub-module registers regexes in genai_core.registry → registry.get_adapter tries them in this registration order and returns the first match."
note = "Order matters: the registry is a dict of regex → class and the first match wins, so a broad pattern registered early shadows a narrower one registered later."

[module_notes."lib.model-interfaces.langchain.functions.request-handler.adapters.azureopenai"]
purpose = "Package that registers the Azure OpenAI adapter."
does = "Re-exports AzureGptAdapter, whose module registers '^azure.openai*'."
flow = "Imported by adapters/__init__ → azuregpt registers itself in genai_core.registry."

[module_notes."lib.model-interfaces.langchain.functions.request-handler.adapters.azureopenai.azuregpt"]
purpose = "Chat with an Azure OpenAI deployment through LangChain's AzureChatOpenAI."
does = "Reads endpoint, deployment name, key, API type and version from AZURE_OPENAI_*__<modelId> variables, so several Azure deployments can coexist; passes streaming, temperature and max_tokens; adds no prompts of its own."
flow = "Picked by '^azure.openai*' → ModelAdapter.run → run_with_chain → Azure OpenAI endpoint (settings from ApiKeysSecret via index:handler) → SessionsTable."

[module_notes."lib.model-interfaces.langchain.functions.request-handler.adapters.base"]
purpose = "Package that exposes the common adapter base class."
does = "Re-exports ModelAdapter and Mode from base.base."
flow = "Imported by every provider adapter (from adapters.base import ModelAdapter)."

[module_notes."lib.model-interfaces.langchain.functions.request-handler.adapters.base.base"]
purpose = "The shared run logic every LangChain adapter inherits; subclasses mostly supply get_llm and prompts."
does = "Chooses the chain by mode and LLM type: ChatBedrockConverse gets the LCEL chain (history-aware retriever + stuff-documents for RAG, prompt | llm otherwise) with optional streaming, other LLMs get the legacy ConversationChain / ConversationalRetrievalChain; image and video modes go to generate_image / generate_video. Applies Bedrock Guardrails through ApplyGuardrail on input and, in chain mode, on output, replacing the stored answer when it intervenes. Keeps history in SessionsTable (DynamoDBChatMessageHistory) and stores prompts, retrieved documents and files as metadata only for 'admin' / 'workspace_manager' groups, who also get them in the response. Collects prompts and token usage through a LangChain callback and logs a 'token_usage' metric line for CloudWatch."
flow = "langchain index:handle_run → ModelAdapter.run → run_with_chain_v2 / run_with_chain / run_with_media_generation_chain → subclass get_llm (model call) and genai_core.langchain.WorkspaceRetriever (RAG over Aurora / OpenSearch / Kendra / Bedrock KB) → DynamoDBChatMessageHistory (SessionsTable) → response dict back to index."
note = "Guardrails turn streaming off (disable_streaming), because the output check needs the whole answer. Media generation is checked on input only. get_endpoint maps a model id to a SAGEMAKER_ENDPOINT_<NAME> env var, but only the Mistral adapter calls it."

[module_notes."lib.model-interfaces.langchain.functions.request-handler.adapters.bedrock"]
purpose = "Holds the Bedrock regex table: which Bedrock model id gets which flavour of the Converse adapter."
does = "Maps Claude, Llama, Nova, Mistral Large/Small, Jamba and Cohere Command R to BedrockChatAdapter; maps Titan Text, Mistral 7B, Mixtral and old Cohere Command to the no-system-prompt variant; maps AI21 J2 to no-streaming + no-system-prompt; maps Titan Image Generator, Nova Canvas and Nova Reel to BedrockChatMediaGeneration. Accepts both plain ids and cross-region inference ids ('bedrock.us.anthropic…')."
flow = "Imported by adapters/__init__ → registry.register(regex, class) for each family → chosen when the request's provider.modelName is 'bedrock.<id>'."
note = "'^bedrock.amazon.nova-canvas*' and 'nova-reel*' are registered before the catch-all '^bedrock.amazon.nova*'; moving them below it would route image and video models to the text adapter."

[module_notes."lib.model-interfaces.langchain.functions.request-handler.adapters.bedrock.base"]
purpose = "Bedrock chat through the Converse API (ChatBedrockConverse), with files, guardrails and localised prompts; most chat traffic goes through it."
does = "Builds ChatBedrockConverse with temperature/topP/maxTokens, sending only one of temperature and top_p for Claude 4 models, passing guardrails natively, and for Jamba and Command R (which lack Converse guardrail support) also checking through ApplyGuardrail; attaches uploaded images (png/jpeg), documents (pdf, csv, doc(x), xls(x), html, txt, md) and mp4 videos from FilesBucket as temporary history messages; supplies chat-style prompts from shared.prompts.system_prompts, or the request's custom system prompts; variants: NoStreaming, NoSystemPrompt (folds history into one text prompt via PromptTemplateWithHistory) and both together."
flow = "Picked by the adapters.bedrock regex table → ModelAdapter.run → run_with_chain_v2 (because the LLM is ChatBedrockConverse) → Bedrock Runtime Converse / ConverseStream (client from genai_core.clients.get_bedrock_client, or the GenAIEH gateway when configured) → SessionsTable history."
note = "Unsupported file extensions raise, which the index turns into the generic error message."

[module_notes."lib.model-interfaces.langchain.functions.request-handler.adapters.bedrock.media"]
purpose = "Image and video generation with Amazon Nova Canvas / Titan Image Generator and Nova Reel on Bedrock."
does = "Builds a Converse-style message list from history and attachments (videos referenced by S3 URI); generate_image calls invoke_model with a TEXT_IMAGE task (1280x768, first attached image as condition image), decodes the image and saves it to FilesBucket under private/<userId>/; generate_video calls start_async_invoke with a TEXT_VIDEO task (6 s, 1280x720) writing into private/<userId>/ and returns the expected '<invocationId>/output.mp4' key at once; always applies guardrails through ApplyGuardrail because invoke_model has none built in."
flow = "Picked for nova-canvas, nova-reel and titan-image-generator → ModelAdapter.run → run_with_media_generation_chain → generate_image / generate_video (Bedrock Runtime) → S3 FilesBucket → history and metadata in SessionsTable."
note = "The video is not ready when the answer is sent; the returned key points at a file Bedrock writes later."

[module_notes."lib.model-interfaces.langchain.functions.request-handler.adapters.bedrock_agent"]
purpose = "Package that registers the classic Bedrock Agents adapter (bedrock-agent-runtime, not AgentCore)."
does = "Imports BedrockAgentAdapter and the registry module that registers it."
flow = "Imported by adapters/__init__ → bedrock_agent.registry registers the agent pattern."

[module_notes."lib.model-interfaces.langchain.functions.request-handler.adapters.bedrock_agent.agent"]
purpose = "Chat with a classic Amazon Bedrock Agent (bedrock-agent-runtime InvokeAgent) inside the LangChain Lambda."
does = "Overrides run entirely (no LangChain chain, no guardrail step, no streaming); lists attached images and documents as S3 URIs in the prompt so the agent can fetch them through its own /get-file action; resolves the agent from the model name 'Agent_<name>_<ID>' (invoke_agent_by_id) or from BEDROCK_AGENT_ID / BEDROCK_AGENT_ALIAS_ID for 'bedrock_agent'; writes the AI reply and, for admins, the agent trace into SessionsTable with floats converted to Decimal."
flow = "Picked by the bedrock_agent.registry regex → langchain index:handle_run → BedrockAgentAdapter.run → genai_core.bedrock_agent.invoke_agent / invoke_agent_by_id (30 s timeout) → SessionsTable put_item → response to index."
note = "Separate from the bedrock-agents interface, which talks to AgentCore runtimes."

[module_notes."lib.model-interfaces.langchain.functions.request-handler.adapters.bedrock_agent.registry"]
purpose = "Registers the classic Bedrock Agent adapter under its model-name pattern."
does = "Maps \"^bedrock\\.(?:bedrock_agent|Agent_.+_.+)$\" to BedrockAgentAdapter, covering the generic default agent and named agents."
flow = "Imported by adapters.bedrock_agent → registry.register; matched after the bedrock model table because adapters.bedrock is imported first."

[module_notes."lib.model-interfaces.langchain.functions.request-handler.adapters.genaieh"]
purpose = "Registers the adapters that send chat through the GenAIEH gateway instead of calling Bedrock or OpenAI directly."
does = "Maps 'genaieh.bedrock*' to GenAIEHChatAdapter, 'genaieh.openai*' to GenAIEHOpenAIChatAdapter and any other 'genaieh.*' to GenAIEHChatAdapter."
flow = "Imported last by adapters/__init__ → registry.register → picked when the request's provider is 'genaieh'."

[module_notes."lib.model-interfaces.langchain.functions.request-handler.adapters.genaieh.base"]
purpose = "Shared request building for the GenAIEH gateway adapters, which call the gateway's HTTP API directly instead of through a LangChain LLM."
does = "Builds a Bedrock Converse body or an OpenAI chat body from the session history, prompt and system prompt; builds the inference config (dropping top_p for Claude 4 when temperature is set); extracts text and logs token usage from gateway replies; saves the turn to SessionsTable; formats the response, with prompts and model kwargs only for admin groups."
flow = "Subclassed by genaieh.bedrock_chat and genaieh.openai_chat → genaieh_client (genai_core.model_providers.genaieh, created lazily) → gateway → update_chat_history (SessionsTable)."
note = "handle_genaieh_error returns, rather than raises, a reply whose metadata.error holds the raw exception text, and it is sent to every user, not only admins — unlike the index's failed-record path, which hides error details on purpose."

[module_notes."lib.model-interfaces.langchain.functions.request-handler.adapters.genaieh.bedrock_chat"]
purpose = "Bedrock-model chat through the GenAIEH gateway."
does = "Refuses attachments and workspaces (no RAG) with a ValueError; calls invoke_bedrock_converse or, when streaming is on, invoke_bedrock_converse_stream and digs the contentBlockDelta texts out of the raw stream bytes, forwarding each to on_llm_new_token; returns gateway API errors as an 'error' reply."
flow = "Picked for 'genaieh.bedrock*' and any other 'genaieh.*' → langchain index:handle_run → GenAIEHChatAdapter.run → GenAIEH gateway → SessionsTable → reply to index."

[module_notes."lib.model-interfaces.langchain.functions.request-handler.adapters.genaieh.openai_chat"]
purpose = "OpenAI-model chat through the GenAIEH gateway."
does = "Forces streaming on in its constructor; refuses attachments and workspaces; calls invoke_openai_stream_chat (forwarding each returned chunk to on_llm_new_token) or invoke_openai_chat and reads choices[0].message.content."
flow = "Picked for 'genaieh.openai*' → langchain index:handle_run → GenAIEHOpenAIChatAdapter.run → GenAIEH gateway → SessionsTable → reply to index."

[module_notes."lib.model-interfaces.langchain.functions.request-handler.adapters.openai"]
purpose = "Package that registers the OpenAI adapter."
does = "Re-exports GPTAdapter, whose module registers '^openai*'."
flow = "Imported first by adapters/__init__ → gpt registers itself in genai_core.registry."

[module_notes."lib.model-interfaces.langchain.functions.request-handler.adapters.openai.gpt"]
purpose = "Chat with OpenAI models through LangChain's ChatOpenAI."
does = "Builds ChatOpenAI with the model id, streaming, temperature and max_tokens; refuses to start without OPENAI_API_KEY; adds no prompts, so the base class's plain-text prompts and the legacy ConversationChain path apply."
flow = "Picked by '^openai*' → ModelAdapter.run → run_with_chain → OpenAI API (key from ApiKeysSecret, copied into os.environ by index:handler) → SessionsTable."

[module_notes."lib.model-interfaces.langchain.functions.request-handler.adapters.sagemaker"]
purpose = "Package grouping the adapters for self-hosted models on SageMaker endpoints."
does = "Imports the meta (Llama 2 chat), amazon (FalconLite) and mistralai (Mistral, Mixtral) adapters so they register."
flow = "Imported by adapters/__init__ before bedrock → each sub-module registers a case-insensitive 'sagemaker.<name>' regex."

[module_notes."lib.model-interfaces.langchain.functions.request-handler.adapters.sagemaker.amazon"]
purpose = "Package for Amazon-published models hosted on SageMaker."
does = "Re-exports the FalconLite adapter."
flow = "Imported by adapters.sagemaker → falconlite registers itself."

[module_notes."lib.model-interfaces.langchain.functions.request-handler.adapters.sagemaker.amazon.falconlite"]
purpose = "Chat with a FalconLite model on a SageMaker endpoint."
does = "Encodes requests with FalconLite parameters (typical_p 0.2, fixed seed 1, return_full_text false) and reads generated_text; uses a '<|prompter|>…<|assistant|>' prompt; registers '(?i)sagemaker\\.amazon-FalconLite*'."
flow = "Picked by the registry → ModelAdapter.run → run_with_chain → LangChain SagemakerEndpoint (endpoint name = model id) → SessionsTable."
note = "The prompt ignores the custom system prompt from the request."

[module_notes."lib.model-interfaces.langchain.functions.request-handler.adapters.sagemaker.meta"]
purpose = "Package for Meta models hosted on SageMaker."
does = "Re-exports the Llama 2 chat adapter."
flow = "Imported by adapters.sagemaker → llama2_chat registers itself."

[module_notes."lib.model-interfaces.langchain.functions.request-handler.adapters.sagemaker.meta.llama2_chat"]
purpose = "Chat with a Llama 2 chat model on a SageMaker JumpStart endpoint."
does = "Sends role/content input with accept_eula=true, strips a trailing [/INST] and reads generation.content; uses the shared Llama 2 [INST]/<<SYS>> templates for chat, QA and condense-question; formats history with Llama2ConversationBufferMemory; registers '(?i)sagemaker\\.meta-LLama.*\\d+b.*chat.*'."
flow = "Picked by the registry → ModelAdapter.run → run_with_chain → SagemakerEndpoint (endpoint name = model id) → SessionsTable."

[module_notes."lib.model-interfaces.langchain.functions.request-handler.adapters.sagemaker.mistralai"]
purpose = "Package for Mistral AI models hosted on SageMaker."
does = "Re-exports the Mistral Instruct and Mixtral Instruct adapters."
flow = "Imported by adapters.sagemaker → both modules register themselves."

[module_notes."lib.model-interfaces.langchain.functions.request-handler.adapters.sagemaker.mistralai.mistral_instruct"]
purpose = "Chat with Mistral 7B Instruct on a SageMaker endpoint."
does = "Encodes requests with Mistral defaults (512 new tokens, top_p 0.9, stop '###' and '</s>') and reads generated_text; wraps chat, QA and condense prompts in <s>[INST]…[/INST]; resolves the endpoint through get_endpoint (SAGEMAKER_ENDPOINT_<NAME> env var, else the model id); registers both 'sagemaker.mistralai-Mistral' and 'sagemaker.mistralai/Mistral' spellings."
flow = "Picked by the registry → ModelAdapter.run → run_with_chain → SagemakerEndpoint → SessionsTable."

[module_notes."lib.model-interfaces.langchain.functions.request-handler.adapters.sagemaker.mistralai.mixtral_instruct"]
purpose = "Chat with Mixtral 8x7B Instruct on a SageMaker endpoint."
does = "Same [INST] prompts and codec as the Mistral adapter, but with a 32768 default new-token limit and the model id used directly as the endpoint name; registers '(?i)sagemaker\\.mistralai-Mixtral*'."
flow = "Picked by the registry → ModelAdapter.run → run_with_chain → SagemakerEndpoint → SessionsTable."

[module_notes."lib.model-interfaces.langchain.functions.request-handler.adapters.shared"]
purpose = "Package for prompt material shared by several adapters."
does = "Re-exports the Llama 2 prompt helpers and the multilingual system prompts."
flow = "Imported by adapters/__init__; its contents are read by the SageMaker Llama 2 adapter and the Bedrock adapters."

[module_notes."lib.model-interfaces.langchain.functions.request-handler.adapters.shared.meta"]
purpose = "Package for Meta Llama prompt formats."
does = "Re-exports the Llama 2 and Llama 3 prompt templates and memory classes."
flow = "Imported by adapters.shared; only the Llama 2 part has a caller (sagemaker.meta.llama2_chat)."

[module_notes."lib.model-interfaces.langchain.functions.request-handler.adapters.shared.meta.llama2_chat"]
purpose = "The Llama 2 chat prompt format, kept in one place for any adapter serving Llama 2."
does = "Provides chat, QA and condense-question templates in the [INST] <<SYS>> format with default system prompts, overridable by the request's custom prompt; provides a memory class that renders history as alternating '[INST] … [/INST]' / '… </s>' turns."
flow = "Imported by sagemaker.meta.llama2_chat (get_prompt, get_qa_prompt, get_condense_question_prompt, get_memory)."

[module_notes."lib.model-interfaces.langchain.functions.request-handler.adapters.shared.meta.llama3_instruct"]
purpose = "The Llama 3 instruct prompt format (header ids and <|eot_id|>), prepared for a SageMaker Llama 3 adapter."
does = "Defines chat, QA and condense-question templates with fixed system prompts and a memory class that renders history in Llama 3 headers."
flow = "Only re-exported by adapters.shared.meta; no adapter imports it. Bedrock Llama 3 models go through BedrockChatAdapter and the Converse API instead."

[module_notes."lib.model-interfaces.langchain.functions.request-handler.adapters.shared.prompts"]
purpose = "Package for the default system prompts."
does = "Re-exports prompts and locale from system_prompts."
flow = "Imported by adapters.shared and directly by adapters.bedrock.base."

[module_notes."lib.model-interfaces.langchain.functions.request-handler.adapters.shared.prompts.system_prompts"]
purpose = "Default system prompts and prompt labels in English and Canadian French."
does = "Holds the conversation, QA and condense-question prompts plus the words used when a prompt is flattened to text (Question, Assistant, Helpful Answer, Chat History, …); fixes the active language in the module-level locale."
flow = "Read by adapters.bedrock.base (prompts[locale]) when the request carries no custom system prompt."
note = "locale is hard-coded to 'en'; switching to French means editing this file and redeploying."

[module_notes."lib.model-interfaces.langchain.functions.request-handler.index"]
purpose = "SQS entry point of the LangChain Lambda: turns one chat request into one adapter run and publishes the answer."
does = "At every invocation copies all keys of the ApiKeysSecret into os.environ (OPENAI_API_KEY, AZURE_OPENAI_*__<model> …); for 'run' builds the adapter from registry.get_adapter('<provider>.<modelName>') and wires on_llm_new_token to publish LLM_NEW_TOKEN messages with a per-container sequence number; passes text, workspaceId, images, documents, videos and systemPrompts to adapter.run and publishes FINAL_RESPONSE; answers 'heartbeat'; turns failed records into a vague error message (with special texts for Nova image sizes and model-access errors) so internal details stay out of the chat."
flow = "MessagesTopic (direction IN, modelInterface 'langchain') → SQS LangChainIngestionQueue → Lambda RequestHandler → handler → record_handler → handle_run → adapters.* run (Bedrock / SageMaker / OpenAI / Azure / GenAIEH / Bedrock Agents; RAG via WorkspaceRetriever) → send_to_client (SNS MessagesTopic, direction OUT)."
note = "on_llm_new_token is assigned on the adapter class, not the instance; it works because records are processed one at a time per container."

[module_notes."lib.rag-engines.aurora-pgvector.functions.create-workflow.create.index"]
purpose = "The worker step that gives a new Aurora workspace its own pgvector table."
does = "Loads the workspace record and fails the workflow if it is missing; creates the table (and index, if requested) for it."
flow = "routes.workspaces create → Step Functions CreateAuroraWorkspace → task Create → Lambda CreateAuroraWorkspaceFunction → lambda_handler → genai_core.workspaces.get_workspace (DynamoDB Workspaces) → genai_core.aurora.create.create_workspace_table (Aurora PostgreSQL)."

[module_notes."lib.rag-engines.aurora-pgvector.functions.pg-setup.index"]
purpose = "One-time database bootstrap at deploy: Aurora is useless for RAG until pgvector and the IAM database users exist."
does = "On CloudFormation Create/Update, connects with the master secret, installs or upgrades the `vector` extension, and (only the first time) creates the IAM-auth users aurora_db_iam_admin / _read / _write with their read/write/create grants; always reports success back to CloudFormation."
flow = "CDK custom resource during deploy → Lambda DatabaseSetupFunction → lambda_handler → Secrets Manager (DB secret) → psycopg2 to Aurora AuroraDatabase → cfnresponse.send."
note = "There is no try/except around the database work, so an error never reaches cfnresponse.send and CloudFormation waits until the custom resource times out instead of failing fast."

[module_notes."lib.rag-engines.data-import.functions.batch-crawl-rss-posts.index"]
purpose = "Drains the queue of RSS posts waiting to be crawled, a few minutes at a time."
does = "Starts website-crawl runs for posts the RSS ingestor has queued."
flow = "EventBridge rule CrawlQueuedRssPostsScheduleRule (every 5 min) → Lambda crawlQueuedRssPostsFunction → lambda_handler → genai_core.documents.batch_crawl_websites → DynamoDB Documents + S3 ProcessingBucket → Step Functions WebsiteCrawling → Batch WebCrawlerJob."

[module_notes."lib.rag-engines.data-import.functions.rss-ingestor.index"]
purpose = "Polls one subscribed RSS feed and records the posts it has not seen yet."
does = "Takes a workspace id and document id from the invoking event and checks that feed for new posts, re-raising any error so the invocation fails visibly."
flow = "trigger-rss-ingestors Lambda invokes Lambda RssIngestor once per feed → lambda_handler → genai_core.documents.check_rss_feed_for_posts → the feed over HTTP → DynamoDB Documents (new posts queued for crawling)."

[module_notes."lib.rag-engines.data-import.functions.trigger-rss-ingestors.index"]
purpose = "The scheduler fan-out for RSS: finds every active feed and starts one poll per feed."
does = "Calls the feed sweep that invokes the RSS ingestor for each enabled subscription."
flow = "EventBridge rule triggerRssIngestorsFunctionSchedule (every 15 min) → Lambda triggerRssIngestorsFunction → lambda_handler → genai_core.documents.ingest_rss_feeds (reads DynamoDB Documents) → Lambda RssIngestor per feed."
note = "The log line says \"daily checks\" but the schedule in rss-subscription.ts is every 15 minutes."

[module_notes."lib.rag-engines.data-import.functions.upload-handler.index"]
purpose = "Turns a file landing in the upload bucket into a document record and starts the right ingestion path for its workspace's engine."
does = "Unwraps S3 event notifications from SQS and ignores anything but ObjectCreated; takes the workspace id from the first key segment; creates a `file` document; for Kendra copies the file and a metadata JSON into the Kendra data bucket and marks it processed; for every other engine starts the FileImport workflow with input and processing locations."
flow = "Browser POSTs to the presigned URL from routes.documents:file_upload → S3 UploadBucket → SQS IngestionQueue → Lambda UploadHandler → lambda_handler → process_record → genai_core.workspaces.get_workspace / genai_core.documents.create_document (DynamoDB Workspaces, Documents) → S3 KendraDataBucket, or Step Functions FileImportStateMachine → Batch FileImportJob."
note = "One SQS message can hold several S3 records; an exception on any of them fails the whole message, and its retry re-creates document records for the files that had already succeeded."

[module_notes."lib.rag-engines.opensearch-vector.functions.create-workflow.create.index"]
purpose = "The worker step that gives a new OpenSearch workspace its own vector index."
does = "Loads the workspace record and fails if missing; creates the k-NN index for it in the serverless collection."
flow = "routes.workspaces create → Step Functions CreateOpenSearchWorkspace → task Create → Lambda CreateOpenSearchWorkspaceFunction → lambda_handler → genai_core.workspaces.get_workspace (DynamoDB Workspaces) → genai_core.opensearch.create.create_workspace_index (OpenSearch Serverless collection)."

[module_notes."lib.rag-engines.sagemaker-rag-models.model.inference"]
purpose = "The inference script for the self-hosted embeddings and cross-encoder endpoint, used when RAG is configured with SageMaker models instead of Bedrock or OpenAI."
does = "Loads every configured embedding model (multilingual-e5-large, all-MiniLM-L6-v2) and the ms-marco cross-encoder onto GPU or CPU at startup; for `embeddings` requests tokenizes, mean-pools and L2-normalises (prefixing \"query: \" for e5); for `cross-encoder` requests scores each (input, passage) pair; picks the model by the last segment of its id."
flow = "Copied into the model archive by the hf-custom-script-model build (CodeBuild → build-script.script) → SageMaker endpoint (ml.g4dn.xlarge) calls model_fn once, predict_fn per request ← genai_core.embeddings and genai_core.cross_encoder invoke the endpoint from the API handler, the LangChain RequestHandler and the file-import/crawler jobs."
note = "The model list is hard-coded here and must match the SageMaker model ids in the deployment config; an id configured there but missing here loads nothing and fails at request time with \"Model … not found\"."

[module_notes."lib.rag-engines.workspaces.functions.delete-document-workflow.delete.index"]
purpose = "Removes one document's chunks from whichever engine holds them."
does = "Loads the workspace and document (failing if either is gone) and dispatches to the OpenSearch, Aurora or Kendra delete routine."
flow = "routes.documents:delete_document → genai_core.documents.delete_document → Step Functions DeleteDocument → task Delete → Lambda DeleteDocumentFunction → lambda_handler → genai_core.aurora.delete / opensearch.delete / kendra.delete (vector store + DynamoDB Documents)."
note = "There is no `bedrock_kb` branch, so deleting a document in a Bedrock KB workspace fails with \"Workspace engine not supported\"."

[module_notes."lib.rag-engines.workspaces.functions.delete-workspace-workflow.delete.index"]
purpose = "Tears down a workspace's storage in its engine before the records go."
does = "Loads the workspace and dispatches to the Aurora, OpenSearch, Kendra or Bedrock KB delete routine; unknown engines fail the workflow."
flow = "routes.workspaces:delete_workspace → genai_core.workspaces.delete_workspace → Step Functions DeleteWorkspace → task Delete → Lambda DeleteWorkspaceFunction → lambda_handler → genai_core.<engine>.delete.delete_workspace (drops the table/index or Kendra/KB documents, then DynamoDB Workspaces and Documents rows)."

[module_notes."lib.sagemaker-model.hf-custom-script-model.build-function.index"]
purpose = "Makes CloudFormation wait for the CodeBuild job that packages a Hugging Face model before the SageMaker endpoint is created."
does = "On Create starts the CodeBuild project and returns the build id as the resource id; on Delete does nothing; polls the build, finishing on SUCCEEDED and failing the deploy on FAILED/FAULT/STOPPED/TIMED_OUT."
flow = "CDK custom-resource provider during deploy → Lambda OnEventHandler (on_event) → CodeBuild CodeBuildProject (runs build-script.script) ← Lambda IsCompleteHandler (is_complete) polls batch_get_builds until done → SageMaker endpoint deploys from the archive."
note = "An Update request falls through to \"Invalid request type\" and fails the stack update, so changing the build resource's properties needs a replace, not an in-place update."

[module_notes."lib.sagemaker-model.hf-custom-script-model.build-script.script"]
purpose = "The CodeBuild step that assembles a SageMaker `model.tar.gz` from Hugging Face weights plus a custom inference script."
does = "Copies the code folder into `out/code`; downloads one or several model snapshots from Hugging Face (one model at the archive root, several in sub-folders named after the id); compresses with pigz; uploads to `out/model.tar.gz` in the build bucket."
flow = "build-function.index:on_event starts CodeBuild → buildspec runs `python3 build/script.py` with MODEL_ID, BUILD_BUCKET, LOCAL_MODEL_FOLDER → Hugging Face Hub → S3 build Bucket → SageMaker endpoint (e.g. the RAG models endpoint loading sagemaker-rag-models.model.inference)."
note = "A script, not a module: all work happens at import time, which is why the map shows no functions."

[module_notes."lib.sagemaker-model.hf-custom-script-model.samples.basic.inference"]
purpose = "Example inference script showing the smallest custom `model_fn` for a causal LLM on a SageMaker Hugging Face container."
does = "Loads tokenizer and model from the model directory and returns a bf16 `text-generation` pipeline."
flow = "Not wired by any CDK construct; a template for a `codeFolder` passed to the hf-custom-script-model build, whose script copies it into the archive's `code/` folder."
note = "Uses `trust_remote_code=True`, which runs Python shipped with the downloaded model."

[module_notes."lib.sagemaker-model.hf-custom-script-model.samples.pipeline.inference"]
purpose = "Example of a custom Hugging Face Pipeline when the default text-generation output is not what the caller needs."
does = "Sets generation defaults (50 new tokens, sampling, temperature 0.1, top-p 0.7, top-k 50); runs generate on the model's device; returns only the newly generated text plus a `stop` flag when the EOS token appeared; loads the model in 8-bit."
flow = "Not wired by any CDK construct; a template `codeFolder` for the hf-custom-script-model build → SageMaker endpoint calls model_fn, then the pipeline per request."

[module_notes."lib.shared.file-import-batch-job.main"]
purpose = "The container job that turns one uploaded file into searchable chunks — too slow and dependency-heavy for a Lambda."
does = "Reads its workspace, document and S3 locations from environment variables; extracts text (plain read for .txt, LangChain S3FileLoader otherwise); saves the text to the processing bucket; splits it by the workspace's chunking settings and writes the chunks with their embeddings, replacing any earlier ones; marks the document `error` if anything fails."
flow = "upload-handler Lambda → Step Functions FileImportStateMachine (batch:submitJob.sync) → Batch FileImportJob → main → genai_core.workspaces / documents (DynamoDB) → S3 UploadBucket → S3 ProcessingBucket → genai_core.chunks.add_chunks → embeddings model → Aurora pgvector or OpenSearch."
note = "The processing copy is skipped only when both bucket and key are the same, but the condition uses `and`, so it is also skipped whenever either the bucket names or the keys match."

[module_notes."lib.shared.layers.python-sdk.python.genai_core"]
purpose = "Root of the shared genai_core package that every Python Lambda and Batch job imports from the Lambda layer; importing it also switches on the project-wide boto3 User-Agent tag."
does = "Groups the shared data access (DynamoDB tables, S3 buckets, Aurora, OpenSearch, Kendra, Bedrock KB), model clients and auth helpers; imports boto_config on first import so every later boto3 call is tagged."
flow = "Loaded by the GraphQLApiHandler, the RequestHandler Lambdas, the RAG workflow Lambdas and the FileImportJob / WebCrawlerJob containers → the import side effect patches botocore once per process → no data written."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.agents"]
purpose = "Lets the admin UI list the Bedrock AgentCore runtimes that can back an agent-based chatbot."
does = "Calls the bedrock-agentcore-control ListAgentRuntimes API; turns datetime fields into ISO strings so AppSync can serialise them; returns an empty list on any AWS or data error instead of failing the request."
flow = "AppSync ChatbotApi → GraphQLApiHandler (routes.agents) → agents:list_agents → clients:get_agentcore_control_client → AgentCore control plane; reads only."
note = "Not the same as bedrock_agent.client:list_agents, which lists classic Bedrock Agents (bedrock-agent) for the bedrock_agent model adapter. Errors are swallowed, so a missing IAM permission shows up as an empty list, not an error."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.applications"]
purpose = "Stores the 'applications' — named chatbot presets (model, workspace, prompts, allowed roles, input types) that the chat UI and sendQuery resolver load."
does = "Lists applications (all, or only those whose Roles contain a Cognito group) by paginated scan; creates and replaces an application as a whole item; deletes one; validates the model ('provider::name'), every role and the workspace ('name::id') against what exists before writing."
flow = "AppSync → GraphQLApiHandler (routes.applications, routes.user_feedback) → applications → validate_request reads models.list_models, roles.list_roles and workspaces.get_workspace → put_item / delete_item on the DynamoDB ApplicationsTable (APPLICATIONS_TABLE_NAME). The send-query-lambda-resolver later reads the same item to build the chat request."
note = "update_application writes the condense prompt under the key 'ConsiseSystemPrompt' while create_application and every reader (routes.applications, send-query-lambda-resolver) use 'CondenseSystemPrompt'. Because put_item replaces the whole item, editing an application silently drops its condense prompt; the resolver then sends an empty one. Reach: every application that has been edited at least once."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.aurora"]
purpose = "Package for the Aurora PostgreSQL + pgvector RAG engine; its __init__ re-exports connection, create, query and chunks so callers can write genai_core.aurora.query_workspace_aurora."
does = "Groups per-workspace table creation, chunk insert/delete, vector + keyword search and workspace/document deletion for Aurora workspaces."
flow = "Imported by semantic_search, chunks and the Aurora create / delete workflow Lambdas → everything ends in the AuroraDatabase cluster, one table per workspace."
note = "delete is deliberately not re-exported: it needs PROCESSING_BUCKET_NAME / UPLOAD_BUCKET_NAME / WORKSPACES_TABLE_NAME at import time, so only the delete workflow Lambdas import it directly."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.aurora.chunks"]
purpose = "Writes a document's chunks and their embeddings into the workspace's pgvector table, and removes them again."
does = "Inserts one row per chunk (content, complement, embedding, document ids, path, title) in a single transaction; with replace=True first deletes the document's existing rows; reports removed and added vector counts; deletes all rows of one document."
flow = "chunks:add_chunks (called by the FileImportJob batch container, the website crawler and qna documents in documents:_process_document) → add_chunks_aurora → AuroraConnection(autocommit=False) → table named after workspace_id without dashes in AuroraDatabase."
note = "The table name is built with sql.Identifier, so the workspace id is quoted rather than interpolated."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.aurora.connection"]
purpose = "Opens a short-lived psycopg2 connection to Aurora using IAM database authentication, so no database password is stored anywhere."
does = "Generates an RDS IAM auth token and caches it at class level for 10 minutes (tokens live 15); opens a connection to the 'postgres' database with a 10 s connect timeout; registers UUID and pgvector adapters; hands back a cursor as a context manager and closes it on exit."
flow = "Used by aurora.create, aurora.chunks, aurora.query and aurora.delete inside the Lambdas and Batch jobs that touch Aurora → rds generate_db_auth_token → psycopg2 to AURORA_DB_HOST:AURORA_DB_PORT as AURORA_DB_USER."
note = "__exit__ only closes; with autocommit=False the caller must call cursor.connection.commit() itself or the work is rolled back (see the aurora-drop-table-never-committed finding)."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.aurora.create"]
purpose = "Creates the pgvector table that holds one Aurora workspace's chunks, shaped to that workspace's embedding size and search options."
does = "Creates the table with a vector(n) column sized to embeddings_model_dimensions; indexes document_id and document_sub_id; adds a GIN full-text index per configured language when hybrid search is on; adds an ivfflat index for the chosen metric (cosine, l2 or inner) when has_index is set."
flow = "Step Functions CreateAuroraWorkspace → CreateAuroraWorkspaceFunction (create-workflow.create.index:lambda_handler) → create_workspace_table → AuroraConnection → CREATE TABLE / CREATE INDEX in AuroraDatabase, committed once at the end."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.aurora.delete"]
purpose = "Tears down an Aurora workspace or one of its documents across S3, Aurora and DynamoDB."
does = "Workspace delete: empties the workspace prefix in UploadBucket and ProcessingBucket, drops the pgvector table, batch-deletes every Documents row of the workspace and deletes the Workspaces row. Document delete: removes the uploaded file and processed objects, deletes the document's rows from the table, deletes its Documents row and decrements size_in_bytes / documents / vectors on the workspace."
flow = "Step Functions DeleteWorkspace / DeleteDocument → DeleteWorkspaceFunction / DeleteDocumentFunction → delete_workspace / delete_aurora_document → S3 UploadBucket + ProcessingBucket, AuroraDatabase, DynamoDB Workspaces + Documents."
note = "Two known traps are recorded as findings: the DROP TABLE runs with autocommit=False and is never committed, and a failed chunk delete is only logged while the Documents row is still removed."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.aurora.query"]
purpose = "Answers a retrieval question against an Aurora workspace: vector search, optional keyword search, optional cross-encoder re-ranking, merged into one result list."
does = "Embeds the query with the workspace's embeddings model (Task.RETRIEVE); runs a 25-row nearest-neighbour search with the operator for the workspace metric; when hybrid search is on, detects the query language and runs a 25-row ts_rank_cd full-text search; merges duplicates by chunk_id keeping both scores; re-ranks with the cross-encoder and applies threshold / limit, topping up from the vector list when too few pass."
flow = "semantic_search:semantic_search (from the GraphQLApiHandler semantic-search route or WorkspaceRetriever inside the LangChain RequestHandler) → query_workspace_aurora → embeddings, utils.comprehend, AuroraConnection (read-only), cross_encoder → returns items (full_response adds the separate vector and keyword lists)."
note = "The top-up branch sorts cosine / l2 distances descending and keeps scores > 0.5, i.e. the farthest chunks — recorded as the aurora-fallback-distance-sort finding."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.aurora.utils"]
purpose = "Makes Aurora query results JSON-safe before they leave the Lambda."
does = "Walks dicts and lists recursively and turns uuid.UUID values (returned by psycopg2 for the UUID columns) into strings."
flow = "Called only by aurora.query:query_workspace_aurora on the items it returns; no I/O."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.auth"]
purpose = "Turns the Cognito identity that AppSync attaches to each request into a user id and a role, and gates GraphQL resolvers by role."
does = "Reads the caller's sub and cognito:groups from the router's current event; picks the highest of admin, workspace_manager, chatbot_user; provides approved_roles([...]) and admin_only decorators that return {'error': 'Unauthorized'} instead of running the route."
flow = "AppSync ChatbotApi (Cognito UserPool auth) → GraphQLApiHandler → every routes.* module decorates its handlers with UserPermissions and calls get_user_id for ownership → no storage."
note = "A user in none of the three groups gets role None and is refused everywhere. The docstrings name the roles 'chatbot_admin' / 'chatbot_workspace_manager' and an {'ok': False, ...} response, but the code checks 'admin' / 'workspace_manager' and returns only {'error': 'Unauthorized'} — trust the constants."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.bedrock_agent"]
purpose = "Package for invoking classic Amazon Bedrock Agents; its __init__ re-exports the client functions."
does = "Exposes invoke_agent, invoke_agent_by_id, list_agents, select_agent and the Bedrock client factories as one import."
flow = "Imported by the bedrock_agent adapter of the LangChain RequestHandler and by model_providers.direct.provider when listing agent models."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.bedrock_agent.client"]
purpose = "Calls a Bedrock Agent and flattens its streaming answer into one completion string plus trace metadata."
does = "Builds bedrock / bedrock-agent / bedrock-agent-runtime clients in BEDROCK_REGION, assuming BEDROCK_ROLE_ARN when set; lists agents with their aliases and versions and picks one by id, name or first; invokes an agent by id (finding the first alias when none is given) or the one configured by BEDROCK_AGENT_ID / VERSION / ALIAS_ID; parses the EventStream chunks and trace into completion, trace and sessionAttributes."
flow = "SNS MessagesTopic → SQS LangChainIngestionQueue → LangChain RequestHandler → adapters.bedrock_agent.agent → invoke_agent_by_id → Bedrock Agent runtime; the answer goes back through the adapter to the session history in DynamoDB SessionsTable. model_providers.direct.provider calls list_agents to show agents as models."
note = "Logs the full user prompt at INFO level on every invocation, so prompts land in CloudWatch Logs. Any error becomes a CommonError carrying the AWS message."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.bedrock_kb"]
purpose = "Package for workspaces backed by an external Amazon Bedrock Knowledge Base; re-exports the query and listing entry points."
does = "Exposes query_workspace_bedrock_kb for retrieval and list_bedrock_kbs for the workspace-creation form."
flow = "Imported by semantic_search and by GraphQLApiHandler routes (bedrock_kb, workspaces)."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.bedrock_kb.client"]
purpose = "Gets a bedrock-agent-runtime client that can reach a specific configured Knowledge Base, possibly in another region or account."
does = "Looks the knowledge base id up in the config's rag.engines.knowledgeBase.external list; uses its region; assumes its roleArn through STS when present; raises CommonError for an id that is not configured."
flow = "bedrock_kb.query → get_kb_runtime_client_for_id → parameters.get_config (SSM config parameter, cached 5 min) → STS AssumeRole → boto3 client."
note = "Assumes the role on every call; credentials are not cached."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.bedrock_kb.delete"]
purpose = "Removes a Bedrock KB workspace from the chatbot without touching the Knowledge Base itself."
does = "Deletes only the workspace's row in the DynamoDB Workspaces table; the external KB, its data and any S3 objects stay."
flow = "Step Functions DeleteWorkspace → DeleteWorkspaceFunction (delete-workspace-workflow.delete.index) → bedrock_kb.delete:delete_workspace → DynamoDB Workspaces (WORKSPACES_TABLE_NAME)."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.bedrock_kb.indexes"]
purpose = "Tells the UI which external Knowledge Bases an admin may attach a workspace to."
does = "Reads rag.engines.knowledgeBase.external from the config and returns id, name and external=true for each entry that has both an id and a name."
flow = "AppSync → GraphQLApiHandler (routes.bedrock_kb list, routes.workspaces create validation) → list_bedrock_kbs → parameters.get_config (SSM); reads only."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.bedrock_kb.query"]
purpose = "Runs retrieval for a Bedrock KB workspace and reshapes the answer to the common item format used by every engine."
does = "Calls Retrieve with HYBRID or SEMANTIC search depending on the workspace's hybrid_search flag, with the limit clamped to 1–100; maps each result to the shared item shape (content, S3 URI as path, KB score as vector_search_score, sequential chunk ids)."
flow = "semantic_search:semantic_search (GraphQL semantic-search route or WorkspaceRetriever in the LangChain RequestHandler) → query_workspace_bedrock_kb → bedrock_kb.client → bedrock-agent-runtime Retrieve; reads only."
note = "score stays None, so WorkspaceRetriever passes None as the document score for KB results; full_response is accepted but ignored."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.boto_config"]
purpose = "Tags every AWS API call the solution makes with a 'genai-chatbot-on-aws/<version>' User-Agent so usage of the sample can be attributed."
does = "Monkey-patches botocore's BaseClient._make_request once per process to append the app's User-Agent; leaves the request otherwise unchanged."
flow = "Imported for its side effect by genai_core/__init__.py, so it runs in every Lambda or Batch container that imports genai_core → affects all later boto3 clients; writes nothing."
note = "It patches a private botocore method; a botocore upgrade that renames _make_request breaks every import of genai_core."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.chunks"]
purpose = "The one place where text becomes stored vectors: split, embed, archive and write to the workspace's engine."
does = "Splits content with LangChain's RecursiveCharacterTextSplitter using the workspace's chunk_size / chunk_overlap (only 'recursive' is supported) and replaces NUL bytes; embeds the chunks with the workspace's embeddings model; writes each chunk as a .txt object to ProcessingBucket; inserts the vectors into Aurora or OpenSearch and records the vector count on the document."
flow = "FileImportJob batch container (Step Functions FileImportStateMachine), the website crawler (WebCrawlerJob) and qna documents in documents:_process_document → add_chunks → embeddings → S3 ProcessingBucket '<workspace>/<document>[/<sub>]/chunks/<id>.txt' → aurora.chunks or opensearch.chunks → documents:set_document_vectors on DynamoDB Documents."
note = "Kendra and Bedrock KB workspaces never pass through here; any other engine raises 'Engine not supported'."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.clients"]
purpose = "Central factory for the model-facing clients, so retry settings, region and the optional GenAIEH gateway are decided in one place."
does = "Returns bedrock-runtime pointed either at AWS (region from config.bedrock.region, adaptive retries) or, when config.genaieh is fully set, at the GenAIEH gateway with an OAuth bearer token added before each call and refreshed on a 401; returns other Bedrock clients, a SageMaker runtime client and cached AgentCore data / control clients; returns the openai module with the key from Secrets Manager, or None when no key is stored."
flow = "Called by embeddings, cross_encoder, agents, the model_providers, registry and every model adapter in the LangChain, Idefics and Bedrock-agents RequestHandlers → reads the SSM config parameter (parameters.get_config) and the API-keys secret → boto3 / openai clients; stores nothing."
note = "get_openai_client sets the key on the global openai module rather than returning a client instance."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.cross_encoder"]
purpose = "Re-ranks retrieved passages by relevance to the question using a cross-encoder model hosted on the shared SageMaker RAG endpoint."
does = "Lists configured cross-encoder models from config rag.crossEncoderModels, hiding SageMaker ones when SAGEMAKER_RAG_MODELS_ENDPOINT is unset; looks one up by provider and name; truncates the query and passages to 10,000 characters and 1,000 passages and scores them through the endpoint."
flow = "aurora.query and opensearch.query during retrieval, and GraphQLApiHandler routes.cross_encoders (listCrossEncoders, rankPassages) → rank_passages → clients:get_sagemaker_client → SageMaker invoke_endpoint; reads only."
note = "Only provider 'sagemaker' can rank; any other provider hits a typo (genai_core.typesCommonError) and raises AttributeError — the cross-encoder-typo-exception finding."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.documents"]
purpose = "Owns the life of a workspace document — text, Q&A, file, website, RSS feed or RSS post — from its DynamoDB record to the workflow that indexes it."
does = "Creates or re-submits a document (one record per path for file / website / rssfeed), keeps workspace size / document / vector counters in step, and stores text content in ProcessingBucket; starts the right processing — FileImportStateMachine for text, direct chunking for qna, a crawler job file plus WebsiteCrawling for websites and sitemaps, the RssIngestor Lambda for feeds, a copy into the Kendra data bucket for Kendra text; lists, reads, re-statuses and deletes documents (delete only when processed / error / enabled, via the DeleteDocument state machine); drives RSS: enable / disable subscriptions, poll feeds for new posts, and turn up to 10 pending posts per run into website documents."
flow = "Called by GraphQLApiHandler (routes.documents), UploadHandler (S3 upload events), FileImportJob, the crawler, RssIngestor, triggerRssIngestorsFunction and crawlQueuedRssPostsFunction (both on EventBridge schedules) and DeleteDocumentFunction → DynamoDB Documents (with the compound-key and status GSIs) and Workspaces, S3 ProcessingBucket and Kendra data bucket, Step Functions, Lambda invoke."
note = "Reads table names and workflow ARNs from environment variables at import; a Lambda missing one of them fails only when the corresponding call is made. ingest_rss_feeds and _get_batch_pending_posts read a single query page (findings rss-feed-query-single-page and the RSS SSRF findings cover the RSS path)."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.embeddings"]
purpose = "Turns text into embedding vectors with whichever embeddings model a workspace was created with — Bedrock (Titan, Cohere), OpenAI or the SageMaker RAG endpoint."
does = "Splits texts longer than the provider's character budget (token limit × 4, max 10,000) and averages the pieces' vectors back into one; sends batches of 50; normalises Titan vectors to unit length and asks Cohere for search_query or search_document depending on the task; retries SageMaker 5 times on 5xx with random back-off; lists and looks up embeddings models through the active model provider (direct or GenAIEH)."
flow = "chunks:add_chunks (store path), aurora.query and opensearch.query (retrieve path), workspaces (validation) and GraphQLApiHandler routes.embeddings → generate_embeddings → clients (bedrock-runtime / openai / sagemaker-runtime); reads only."
note = "Every failure is re-raised as CommonError('Failed to generate embeddings: …'). After five failed SageMaker attempts the helper returns None, which surfaces as that same generic error."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.kendra"]
purpose = "Package for Kendra-backed workspaces; its __init__ re-exports index listing, query, client and data-sync functions."
does = "Groups listing the default and external Kendra indexes, retrieval, client creation per index and S3 data-source sync."
flow = "Imported by semantic_search and GraphQLApiHandler routes (kendra, workspaces); kendra.delete is imported directly by the delete workflow Lambdas."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.kendra.client"]
purpose = "Returns a Kendra client that can reach a given index — the stack's own one or an external index in another region or account."
does = "Uses the default client for DEFAULT_KENDRA_INDEX_ID; otherwise finds the index in config rag.engines.kendra.external, applies its region and assumes its roleArn via STS; raises CommonError for an unknown index."
flow = "kendra.query and kendra.data_sync → get_kendra_client_for_index → parameters.get_config (SSM) → STS AssumeRole → boto3 kendra client."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.kendra.data_sync"]
purpose = "Lets an admin push newly added text documents into the stack's own Kendra index, which only picks up S3 changes during a data-source sync."
does = "Starts a sync job on the default S3 data source after checking the workspace exists, is a Kendra workspace and is not external; reports whether one of the last five sync jobs is still SYNCING or SYNCING_INDEXING (always false for external indexes)."
flow = "AppSync → GraphQLApiHandler (routes.kendra startKendraDataSync / isKendraDataSynching) → workspaces.get_workspace (DynamoDB Workspaces) → kendra.client → Kendra StartDataSourceSyncJob / ListDataSourceSyncJobs on DEFAULT_KENDRA_S3_DATA_SOURCE_ID."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.kendra.delete"]
purpose = "Removes a Kendra workspace or document from the chatbot's buckets and tables."
does = "Workspace delete: empties the workspace prefix in UploadBucket, ProcessingBucket and the documents/ and metadata/ prefixes of the Kendra data bucket, batch-deletes its Documents rows and deletes its Workspaces row. Document delete: removes the uploaded file and processed objects, the Kendra data and metadata objects for text documents, the Documents row, and decrements the workspace counters."
flow = "Step Functions DeleteWorkspace / DeleteDocument → DeleteWorkspaceFunction / DeleteDocumentFunction → kendra.delete → S3 UploadBucket, ProcessingBucket, KendraDataBucket; DynamoDB Workspaces + Documents."
note = "It deletes only the S3 source objects and never starts a data-source sync, so deleted text stays searchable in the Kendra index until someone runs a sync. It calls genai_core.utils.delete_files_with_object_key without importing it; this works only because the delete-document Lambda imports aurora.delete first."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.kendra.indexes"]
purpose = "Lists the Kendra indexes a workspace can be created on."
does = "Returns the stack's own index (from DEFAULT_KENDRA_INDEX_ID / DEFAULT_KENDRA_INDEX_NAME, external=false) followed by every external index in config rag.engines.kendra.external that has both an id and a name."
flow = "AppSync → GraphQLApiHandler (routes.kendra listKendraIndexes, routes.workspaces create validation) → get_kendra_indexes → parameters.get_config (SSM); reads only."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.kendra.query"]
purpose = "Runs retrieval for a Kendra workspace and maps the passages to the common item shape."
does = "Calls Kendra Retrieve with the limit clamped to 1–100; filters on the workspace_id document attribute unless the index is external or kendra_use_all_data is set; derives path (file name for S3 URIs, URL otherwise) and document_type (from the attribute, else file / website)."
flow = "semantic_search:semantic_search (GraphQL semantic-search route or WorkspaceRetriever in the LangChain RequestHandler) → query_workspace_kendra → kendra.client → Kendra Retrieve; reads only."
note = "Kendra results carry no score (score stays None) and full_response is ignored."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.langchain"]
purpose = "Package of LangChain integrations; its __init__ re-exports WorkspaceRetriever and DynamoDBChatMessageHistory."
does = "Groups the RAG retriever and the DynamoDB-backed chat memory used by the model adapters."
flow = "Imported by the LangChain, Idefics and Bedrock-agents RequestHandlers."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.langchain.chat_message_history"]
purpose = "Gives LangChain chains a chat memory that persists each session's conversation in DynamoDB."
does = "Loads the History list of one (SessionId, UserId) item and converts it to LangChain messages; appends a message by rewriting the whole item, flattening a streamed AIMessageChunk into plain text; keeps image / document turns as temporary, unsaved messages; writes metadata (sources, tokens) onto the last message; deletes the session."
flow = "SNS MessagesTopic → SQS → LangChain / Idefics / Bedrock-agents RequestHandler → model adapter builds DynamoDBChatMessageHistory(SESSIONS_TABLE_NAME, session_id, user_id) → get_item / put_item / delete_item on DynamoDB SessionsTable."
note = "Each write is a read-modify-write of the full item with no condition, and add_message resets StartTime. Findings guardrail-replace-is-noop, session-history-single-item and session-starttime-overwritten cover the details."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.langchain.workspace_retriever"]
purpose = "Plugs any RAG workspace, whatever its engine, into LangChain retrieval chains."
does = "Runs semantic_search for the workspace with a fixed limit of 3; turns each item into a LangChain Document, using content_complement (for Q&A, the answer) as page text when present, and ids, path, title and score as metadata; keeps the last result so the adapter can attach sources to the reply."
flow = "LangChain RequestHandler → adapters.base.base:ModelAdapter builds WorkspaceRetriever(workspace_id) for RAG chats → semantic_search → aurora / opensearch / kendra / bedrock_kb query; reads only."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.model_providers"]
purpose = "Chooses where model and embeddings-model lists come from: directly from AWS / configured providers, or from the GenAIEH gateway."
does = "Returns a GenAIEHModelProvider when config.genaieh.enabled is true, otherwise a DirectModelProvider; imports both lazily to avoid an import cycle."
flow = "models (model listing for the UI and application validation) and embeddings (embeddings model lookup) → get_model_provider → parameters.get_config (SSM) → model_providers.direct.provider or model_providers.genaieh.genaieh."
note = "This only checks 'enabled', while clients:is_genaieh_configured also requires gateway URL and credentials — with enabled=true but incomplete credentials the model list comes from GenAIEH while bedrock-runtime calls still go to AWS directly."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.model_providers.direct"]
purpose = "Package for the default model provider that lists models straight from Bedrock, SageMaker, OpenAI and the other configured sources."
does = "Groups the direct provider class, its model listing and its embeddings listing; the __init__ itself is empty."
flow = "Reached through model_providers:get_model_provider when GenAIEH is not enabled."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.model_providers.direct.embeddings"]
purpose = "An older, provider-local copy of genai_core.embeddings that production code no longer imports; only the unit tests still load it."
does = "Splits long inputs into character windows sized from a per-provider token limit and averages the window vectors back into one; batches inputs (50 per call) and dispatches to OpenAI, Bedrock (Titan / Cohere bodies) or the SageMaker RAG endpoint; reads the embeddings model list straight from the rag.embeddingsModels section of the Config SSM parameter."
flow = "No Lambda reaches it: the live path is genai_core.embeddings:generate_embeddings, which differs only in delegating model lookup to model_providers.get_model_provider. tests/shared/layers/python-sdk/genai_core/generate_embeddings_test.py imports generate_embeddings from here."
note = "Because the tests target this copy, a change to genai_core.embeddings:generate_embeddings is not covered by them (see finding direct-embeddings-tested-copy)."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.model_providers.direct.models"]
purpose = "A stale copy of the model-listing helpers that DirectModelProvider now carries itself; nothing imports it."
does = "Lists OpenAI gpt* models, Azure OpenAI names from the API keys secret, Bedrock foundation, cross-region-inference and fine-tuned models, and SageMaker endpoints from the models SSM parameter, each as the dict shape the UI expects."
flow = "Unreachable: model_providers.get_model_provider imports direct.provider only. It has already drifted — no Bedrock agent models, and cross-region profiles are keyed by base model id so regional variants overwrite each other."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.model_providers.direct.provider"]
purpose = "The default model catalogue: it answers 'which models can this deployment use' by asking each model service directly when the GenAIEH gateway is off."
does = "Builds the model list from Bedrock (foundation models, cross-region inference profiles with all regional variants, fine-tuned models, and Bedrock agents when enabled in config), SageMaker endpoints, OpenAI and Azure OpenAI; returns the RAG embeddings models from the Config SSM parameter, hiding SageMaker ones when no SAGEMAKER_RAG_MODELS_ENDPOINT is set; resolves a 'provider::name' model id to its output modalities."
flow = "genai_core.models (listModels in GraphQLApiHandler, application create/update, the adapter registry in the LangChain RequestHandler) and genai_core.embeddings (workspace creation, file import, retrieval) → model_providers.get_model_provider → DirectModelProvider → genai_core.clients (Bedrock / OpenAI clients) and genai_core.parameters (Config and models SSM parameters, ApiKeysSecret). Read-only; writes nothing."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.model_providers.genaieh"]
purpose = "Package for the GenAIEH gateway provider: the alternative to direct model access, used when the config's genaieh.enabled flag is set."
does = "Re-exports GenAIEHModelProvider, the gateway client, its config dataclass and the response types under one import."
flow = "Imported by model_providers.get_model_provider (provider choice) and by the LangChain RequestHandler's genaieh adapters."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.model_providers.genaieh.genaieh"]
purpose = "Lets the chatbot use whatever models an external GenAIEH gateway grants this application, instead of discovering them in Bedrock/SageMaker."
does = "Fetches the application's model list from the gateway through one cached client and maps each entry to the app's model dict (provider 'genaieh.<provider>', providerModelName, streaming for chat/completion, RAG off); treats text-in/no-output entries as embeddings models; turns every gateway error into an empty list."
flow = "model_providers.get_model_provider returns it when Config SSM genaieh.enabled is true → genaieh_client:get_genaieh_gateway_client → GET application/models on the gateway. Callers are the same as for DirectModelProvider: genai_core.models, genai_core.embeddings, and AdapterRegistry's provider-name lookup."
note = "get_model_modalities compares the full model id with each model's name and returns input modalities, so application OutputModalities come out empty under GenAIEH (finding genaieh-modalities-mismatch)."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.model_providers.genaieh.genaieh_client"]
purpose = "The only HTTP client for the GenAIEH gateway; it hides the OAuth client-credentials dance so callers just invoke models."
does = "Obtains and caches an access token from the configured token URL (refreshed 60 s before expiry); calls the gateway's application/models, bedrock/model/{id}/converse and converse-stream, and openai-proxy chat completions (sync with requests, streaming with aiohttp); converts non-2xx responses into ApiError with a user-readable message."
flow = "Built once per Lambda container by get_genaieh_gateway_client from the genaieh section of the Config SSM parameter (gateway_url, token_url, client_id, client_secret). Used by genaieh.GenAIEHModelProvider for listing, by genai_core.clients when routing bedrock-runtime through the gateway, and by the LangChain RequestHandler's genaieh adapters for chat."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.model_providers.genaieh.types"]
purpose = "Typed shapes for the GenAIEH gateway's requests and responses, so the client and adapters agree on field names."
does = "Holds the gateway config dataclass (built from the Config SSM dict), ApiError, model / provider / pricing / control-parameter records with from_dict/to_dict, the list-models request and response, and the ModelMode literal (embedding, chat, completion)."
flow = "Pure data: imported by genaieh_client, genaieh, and the LangChain RequestHandler's genaieh bedrock_chat / openai_chat adapters. No I/O."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.model_providers.types"]
purpose = "The contract every model provider must meet, so callers can switch between direct access and the GenAIEH gateway without knowing which is active."
does = "Declares the abstract ModelProvider with four operations: list chat models, list embeddings models, look up one embeddings model by provider and name, and report a model's modalities."
flow = "Implemented by direct.provider:DirectModelProvider and genaieh.genaieh:GenAIEHModelProvider; model_providers.get_model_provider returns one of them to genai_core.models and genai_core.embeddings."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.models"]
purpose = "The single front door for 'what models exist' questions, so callers never pick a provider themselves."
does = "Returns the full model list from the active provider; returns a model's output modalities; finds one model by its 'provider.name' string."
flow = "Called by the GraphQLApiHandler listModels route, by genai_core.applications (validate_request and the OutputModalities stored in the ApplicationsTable), and by registry.index:_get_provider_name in the LangChain RequestHandler when GenAIEH is on → model_providers.get_model_provider → DirectModelProvider or GenAIEHModelProvider. Read-only."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.opensearch"]
purpose = "Groups the OpenSearch Serverless vector engine for workspaces whose engine is 'opensearch'."
does = "Re-exports the client factory, index creation and query so callers can write genai_core.opensearch.query_workspace_open_search; chunks and delete are imported by their full module path."
flow = "Imported by genai_core.semantic_search, genai_core.chunks and the OpenSearch create / delete Step Functions Lambdas."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.opensearch.chunks"]
purpose = "Writes a document's chunk vectors into the workspace's OpenSearch index — the OpenSearch half of 'add chunks'."
does = "Indexes one record per chunk (ids, document metadata, path, title, content, complement, embedding) into the index named after the workspace id without dashes; with replace, first deletes the document's existing records; returns removed/added counts."
flow = "genai_core.chunks:add_chunks (FileImportJob Batch job, WebCrawlerJob Batch job, and the GraphQLApiHandler for text / Q&A documents) → add_chunks_open_search → OpenSearchCollection. The added count goes back to documents.set_document_vectors in the Documents table."
note = "clean_chunks_open_search searches without a size, so OpenSearch returns at most 10 hits and only those are deleted (finding opensearch-replace-removes-ten)."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.opensearch.client"]
purpose = "Builds an authenticated OpenSearch Serverless client so no other module handles SigV4 signing."
does = "Signs requests for the 'aoss' service with the Lambda's own credentials (AWS4Auth), connects over TLS on 443 with a 300 s timeout to the host in OPEN_SEARCH_COLLECTION_ENDPOINT."
flow = "Called fresh on every operation by opensearch.create, chunks, query and delete; reaches the OpenSearchCollection resource."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.opensearch.create"]
purpose = "Creates the per-workspace k-NN index that an OpenSearch workspace stores its vectors in."
does = "Creates an index named after the workspace id (dashes removed) with an HNSW knn_vector field sized to the workspace's embeddings dimensions (l2, nmslib, ef_search 512) plus keyword/text fields for chunk metadata and content."
flow = "GraphQLApiHandler createOpenSearchWorkspace → workspaces.create_workspace_open_search (Workspaces table item, status submitted) → Step Functions CreateOpenSearchWorkspace → Lambda CreateOpenSearchWorkspaceFunction → create_workspace_index → OpenSearchCollection; the workflow then sets the workspace to ready."
note = "The space type is always l2 whatever metric the workspace item records."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.opensearch.delete"]
purpose = "Removes an OpenSearch workspace, or one document from it, everywhere it was stored."
does = "Workspace delete: empties the workspace's prefix in UploadBucket and ProcessingBucket, drops the index, deletes all its Documents rows (paged query, batch deletes) and finally its Workspaces row. Document delete: removes the uploaded file and processing files, deletes the document's index records page by page, deletes its Documents row and subtracts its size, document and vector counts from the Workspaces row."
flow = "Step Functions DeleteWorkspace → Lambda DeleteWorkspaceFunction → delete_workspace; Step Functions DeleteDocument → Lambda DeleteDocumentFunction → delete_open_search_document. Both start from GraphQLApiHandler (workspaces.delete_workspace / document delete route)."
note = "In document delete a DynamoDB error is only logged, after the vectors and files are already gone."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.opensearch.query"]
purpose = "Answers a retrieval query against an OpenSearch workspace and returns ranked passages in the same shape as the other engines."
does = "Embeds the query with the workspace's embeddings model and runs a k-NN search (k 5), plus a match keyword search when hybrid_search is on; merges hits by chunk_id keeping both scores; re-ranks with the workspace's cross-encoder when one is set; trims to the limit, topping up with vector hits scoring above 0.5 when the cross-encoder threshold leaves too few."
flow = "semantic_search:semantic_search (WorkspaceRetriever in the LangChain RequestHandler, and the GraphQLApiHandler semantic search route) → query_workspace_open_search → embeddings.generate_embeddings (Bedrock / OpenAI / SageMaker) → OpenSearchCollection → cross_encoder.rank_passages (SageMaker). Read-only."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.parameters"]
purpose = "One place that reads deployment configuration and secrets, with caching, so every Lambda sees the same settings without its own SSM / Secrets Manager calls."
does = "Returns the system config JSON from the Config SSM parameter (cached 5 min); returns the SageMaker models list from the ModelsParameter (30 s); returns one named third-party API key from ApiKeysSecret and the X-Origin-Verify header value from its secret (60 s each)."
flow = "Called from nearly every genai_core module (clients, providers, embeddings, cross_encoder, kendra, bedrock_kb) and from GraphQLApiHandler routes; the names come from CONFIG_PARAMETER_NAME, MODELS_PARAMETER_NAME, API_KEYS_SECRETS_ARN and X_ORIGIN_VERIFY_SECRET_ARN. Read-only."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.presign"]
purpose = "Lets the browser upload and download files straight to S3 without passing the bytes through a Lambda."
does = "Issues a presigned POST for a workspace upload (checks the workspace exists, key '<workspace_id>/<basename>', 10 MB cap, S3 Transfer Acceleration URL); issues a presigned POST for a user's chat attachment under 'private/<user_id>/'; issues a presigned GET for a user's own attachment after checking it exists. All use SigV4 so KMS-encrypted buckets work."
flow = "GraphQLApiHandler routes.documents:file_upload (workspace → UploadBucket, user → FilesBucket) and routes.sessions (download from FilesBucket). The workspace upload then lands in UploadBucket, which notifies IngestionQueue → UploadHandler Lambda."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.registry"]
purpose = "Holds the one shared AdapterRegistry instance that model adapters register into at import time."
does = "Creates a module-level registry object so every adapter module and the request handler see the same regex → adapter table."
flow = "Adapter packages in the LangChain and Idefics RequestHandler Lambdas call registry.register on import; their index:handle_run calls registry.get_adapter."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.registry.index"]
purpose = "Maps a model id to the adapter class that knows how to talk to it, so the request handler never branches on model names."
does = "Stores compiled regexes in registration order and returns the first adapter whose pattern matches; raises ValueError listing all patterns when none does; when GenAIEH is on, rewrites 'genaieh.x.name' to 'genaieh.x.<providerModelName>' first so the gateway's underlying model picks the adapter."
flow = "LangChain RequestHandler (SQS LangChainIngestionQueue, fed by SNS MessagesTopic) and Idefics RequestHandler → handle_run → registry.get_adapter → _get_provider_name → clients.is_genaieh_configured and models.get_model_by_name (gateway model list)."
note = "Match order is registration (import) order, so a broad regex registered early wins over a narrower one."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.roles"]
purpose = "Supplies the list of roles an application can be restricted to, taken from the Cognito user pool's groups."
does = "Pages through the pool's groups and returns up to 200 as id/name pairs; returns None if Cognito errors."
flow = "GraphQLApiHandler routes.roles (admin UI role picker) and genai_core.applications:validate_request → cognito-idp ListGroups on COGNITO_USER_POOL_ID. Read-only."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.semantic_search"]
purpose = "Routes a retrieval query to the right engine based on the workspace's engine field, so callers query any workspace the same way."
does = "Loads the workspace, refuses unknown or not-ready ones, and dispatches to Aurora pgvector, OpenSearch, Kendra or a Bedrock knowledge base."
flow = "langchain.workspace_retriever:WorkspaceRetriever (RAG in the LangChain RequestHandler) and the GraphQLApiHandler semantic search route → workspaces.get_workspace (Workspaces table) → aurora.query / opensearch.query / kendra.query / bedrock_kb.query. Read-only."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.sessions"]
purpose = "Reads and deletes a user's chat sessions for the API; the sessions themselves are written by the chat history class."
does = "Gets one session by SessionId + UserId; lists all of a user's sessions through the by-user index, following pagination; deletes a session together with the image, document and video attachments its history references under 'private/<user_id>/'; deletes all of a user's sessions one by one."
flow = "GraphQLApiHandler routes.sessions (get_sessions, get_session, delete_session, delete_user_sessions; user id taken from the caller's identity) → SessionsTable (DynamoDB) and FilesBucket (S3 deletes). The items were written by langchain.chat_message_history:DynamoDBChatMessageHistory in the LangChain RequestHandler."
note = "Every key includes the caller's UserId, which is what keeps one user from reading another's sessions."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.types"]
purpose = "Shared vocabulary for the whole chatbot: the enums and small models that Lambdas, adapters and the layer pass between each other."
does = "Defines CommonError (the error type routes turn into user-facing messages); pydantic models for embeddings models, cross-encoders and workspaces; enums for providers, modalities, inference types, model interfaces (langchain / idefics), message direction (IN/OUT, used by the SNS filters), chatbot actions and modes, retrieval tasks, and file storage providers."
flow = "Imported almost everywhere — GraphQLApiHandler routes, the model-interface RequestHandlers and adapters, and most genai_core modules. No I/O."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.user_feedback"]
purpose = "Records a thumbs-up/down on an answer as a file analysts can query later."
does = "Writes one JSON object per feedback (session, user, message key, prompt, completion, model, feedback, timestamp) to S3 under user_feedback/year=YYYY/month=MM/, Infrequent Access storage class; returns the new feedback id."
flow = "GraphQLApiHandler routes.user_feedback → add_user_feedback → UserFeedbackBucket."
note = "It creates a DynamoDB resource but never uses it; feedback goes only to S3."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.utils.comprehend"]
purpose = "Picks the PostgreSQL full-text language for a query so Aurora keyword search stems words correctly."
does = "Detects the query's dominant language with Amazon Comprehend, maps the code to a PostgreSQL text-search configuration name, and keeps it only if the workspace lists that language; otherwise falls back to english. Also returns the raw detected languages with scores."
flow = "aurora.query:query_workspace_aurora (hybrid search in RAG retrieval and the semantic search route) → get_query_language → Comprehend DetectDominantLanguage."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.utils.delete_files_with_object_key"]
purpose = "Deletes one S3 object during document removal."
does = "Deletes a single key from a bucket and logs it."
flow = "aurora.delete, opensearch.delete and kendra.delete in the DeleteDocumentFunction Lambda → UploadBucket (the original upload) or the Kendra data bucket."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.utils.delete_files_with_prefix"]
purpose = "Empties everything under a workspace or document prefix, which S3 cannot do in one call."
does = "Lists objects under a prefix page by page (continuation tokens) and deletes each page with one DeleteObjects call."
flow = "aurora.delete, opensearch.delete and kendra.delete in the DeleteWorkspaceFunction and DeleteDocumentFunction Lambdas → UploadBucket, ProcessingBucket and the Kendra data bucket."
note = "The prefix has no trailing slash; that is safe only because workspace and document ids are fixed-length UUIDs."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.utils.files"]
purpose = "Tells callers whether an S3 object exists without downloading it."
does = "HEADs the object; returns False on 404 and re-raises any other error."
flow = "documents:get_document_content (GraphQLApiHandler, reading a text document's content.txt / content_complement.txt) → ProcessingBucket."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.utils.json"]
purpose = "Lets DynamoDB items be serialised to JSON, which the standard encoder refuses because of Decimal and UUID values."
does = "JSON encoder that writes Decimals as int or float and UUIDs as strings."
flow = "Used with json.dumps in GraphQLApiHandler routes.applications and in the WebCrawlerJob Batch job (lib/shared/web-crawler-batch-job/index.py)."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.utils.websocket"]
purpose = "The one way a model-interface Lambda talks back to the browser: every token, step and final answer goes through it."
does = "Marks the message direction OUT unless set, serialises it (bytes as base64, Decimals as floats, stream objects as strings) and publishes it to the SNS MessagesTopic."
flow = "LangChain, Idefics and Bedrock-agents RequestHandlers → send_to_client → SNS MessagesTopic (MESSAGES_TOPIC_ARN) → filter direction=OUT → SQS OutgoingMessagesQueue → outgoing-message-handler Lambda → AppSync subscription to the user."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.websites"]
purpose = "Groups the website-ingestion helpers: the crawler run by the Batch job and the sitemap reader."
does = "Re-exports the sitemap helpers so documents can call genai_core.websites.extract_urls_from_sitemap; the crawler is imported by its full path."
flow = "Imported by genai_core.documents (GraphQLApiHandler add website, RSS batch crawl) and the WebCrawlerJob Batch job."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.websites.crawler"]
purpose = "Does the actual web crawling for a website document: fetch, extract text, store, chunk and embed, page by page."
does = "Works a priority queue of URLs up to a page limit, following same-host links when follow_links is on; extracts text from HTML (BeautifulSoup) or PDF (pdfplumber, including link annotations) when that content type is allowed; stores each page's path and text in ProcessingBucket and adds its chunks to the workspace; updates the document's sub-document count every 20 pages; returns the remaining queue so the workflow can continue."
flow = "documents:_process_document writes the first iteration file → Step Functions WebsiteCrawling → Batch job WebCrawlerJob (lib/shared/web-crawler-batch-job/index.py:main) → crawl_urls → parse_url (HTTP GET) → _store_content_on_s3 (ProcessingBucket '<workspace>/<document>/<sub_id>/') → chunks.split_content / chunks.add_chunks (Aurora or OpenSearch, Documents table counts)."
note = "Only the start URL was checked for private addresses; followed links and redirects are not (finding crawler-no-private-check)."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.websites.sitemap"]
purpose = "Turns a sitemap URL into the list of page URLs to crawl."
does = "Downloads the sitemap (gunzipping .gz files via a temp file), parses it with defusedxml, recurses into nested sitemaps of a sitemapindex, and collects every url/loc."
flow = "documents:_process_document for a website document of sub-type sitemap (GraphQLApiHandler add website) → extract_urls_from_sitemap → HTTP GET; the URLs seed the WebsiteCrawling workflow's first iteration file."
note = "On any error it prints and returns None rather than []; _process_document catches the resulting TypeError and marks the document as error."

[module_notes."lib.shared.layers.python-sdk.python.genai_core.workspaces"]
purpose = "Owns the Workspaces table record that every RAG feature hangs off, and starts the workflows that build or tear down each engine."
does = "Lists workspaces (by-object-type index, newest first) and gets one; sets status; creates Aurora, OpenSearch and Kendra workspaces as 'submitted' rows after checking the embeddings model actually answers, then starts their creation Step Functions; creates Bedrock KB workspaces directly as 'ready'; starts deletion only for ready or errored workspaces."
flow = "GraphQLApiHandler routes.workspaces → create_workspace_* → Workspaces table (put_item) → Step Functions CreateAuroraWorkspace / CreateOpenSearchWorkspace / CreateKendraWorkspace; delete_workspace → Step Functions DeleteWorkspace. get_workspace is read by semantic_search, documents, presign, applications, the UploadHandler Lambda, the FileImportJob and the create/delete workflow Lambdas."

[module_notes."lib.shared.layers.python-sdk.python.sitecustomize"]
purpose = "Makes every boto3 call from any Lambda using the layer carry the solution's user-agent, without each handler opting in."
does = "Is imported automatically by the Python interpreter at startup and imports genai_core.boto_config, which patches botocore's request path; silently does nothing where genai_core is not installed."
flow = "Python startup in every Lambda and Batch container with the layer on sys.path → genai_core.boto_config → all later AWS API calls."

[module_notes."lib.shared.web-crawler-batch-job.index"]
purpose = "The container job that crawls a website or RSS post set for a workspace, outside Lambda's time limit."
does = "Loads the crawl plan (workspace, document, URL queue, already-seen URLs, follow-links, limit, content types) from a JSON object in S3 and hands it to the crawler."
flow = "routes.documents add_website / add_rss_feed or batch-crawl-rss-posts → genai_core.documents writes the plan to S3 ProcessingBucket → Step Functions WebsiteCrawling → Batch WebCrawlerJob → main → genai_core.websites.crawler.crawl_urls → public websites over HTTP → chunks into the workspace's engine and DynamoDB Documents."
note = "The environment variable INPUT_BUCKET_NAME is read into PROCESSING_BUCKET_NAME — it is the processing bucket that holds the plan, despite the name."

[[layers]]
id = "auth"
name = "Auth trigger"
owns = "The Cognito trigger Lambda that puts a federated (SSO) user into a Cognito user group on sign-in. It never touches chat or RAG data."
modules = ["lib.authentication.*"]

[[layers]]
id = "api"
name = "GraphQL API handlers"
owns = "What AppSync calls. GraphQLApiHandler (api-handler/index.py plus routes/*) checks the caller's Cognito group and calls genai_core for every query and mutation. The send-query resolver publishes each chat message to SNS MessagesTopic."
modules = ["lib.chatbot-api.*"]

[[layers]]
id = "model-interfaces"
name = "Model request handlers"
owns = "Lambdas fed by SQS from MessagesTopic: LangChain (text and RAG chat through one adapter per model family), Idefics (multimodal) and Bedrock Agents. Each runs the model, saves the history and publishes the answer back to MessagesTopic."
modules = ["lib.model-interfaces.*"]

[[layers]]
id = "rag-lambdas"
name = "RAG workflow Lambdas"
owns = "Small Lambdas that Step Functions, S3/SQS and EventBridge start: create an Aurora table or OpenSearch index for a new workspace, delete a workspace or document, turn S3 uploads into documents, and poll RSS feeds. Most are thin wrappers around genai_core."
modules = ["lib.rag-engines.aurora-pgvector.*", "lib.rag-engines.data-import.*", "lib.rag-engines.opensearch-vector.*", "lib.rag-engines.workspaces.*"]

[[layers]]
id = "batch-jobs"
name = "Batch jobs"
owns = "Container entry points that AWS Batch runs under a Step Functions workflow: file import (read the uploaded file, split it, embed it, store the chunks) and the website crawler (crawl one batch of URLs and write the next iteration's state to S3)."
modules = ["lib.shared.file-import-batch-job.*", "lib.shared.web-crawler-batch-job.*"]

[[layers]]
id = "core-records"
name = "genai_core · records"
owns = "The DynamoDB and S3 records behind the API: workspaces, documents, sessions (chat history), applications, user feedback, roles, the caller-permission decorators and presigned upload/download URLs."
modules = ["lib.shared.layers.python-sdk.python.genai_core", "lib.shared.layers.python-sdk.python.genai_core.workspaces", "lib.shared.layers.python-sdk.python.genai_core.documents", "lib.shared.layers.python-sdk.python.genai_core.sessions", "lib.shared.layers.python-sdk.python.genai_core.applications", "lib.shared.layers.python-sdk.python.genai_core.user_feedback", "lib.shared.layers.python-sdk.python.genai_core.roles", "lib.shared.layers.python-sdk.python.genai_core.auth", "lib.shared.layers.python-sdk.python.genai_core.presign", "lib.shared.layers.python-sdk.python.genai_core.langchain", "lib.shared.layers.python-sdk.python.genai_core.langchain.chat_message_history"]

[[layers]]
id = "core-rag"
name = "genai_core · RAG engines"
owns = "Vector and search stores, one package per engine (aurora = pgvector, opensearch = OpenSearch Serverless, kendra, bedrock_kb): create, add chunks, query, delete. Also chunk splitting, semantic search across engines, the LangChain retriever and the website crawler."
modules = ["lib.shared.layers.python-sdk.python.genai_core.aurora.*", "lib.shared.layers.python-sdk.python.genai_core.opensearch.*", "lib.shared.layers.python-sdk.python.genai_core.kendra.*", "lib.shared.layers.python-sdk.python.genai_core.bedrock_kb.*", "lib.shared.layers.python-sdk.python.genai_core.chunks", "lib.shared.layers.python-sdk.python.genai_core.semantic_search", "lib.shared.layers.python-sdk.python.genai_core.langchain.workspace_retriever", "lib.shared.layers.python-sdk.python.genai_core.websites.*"]

[[layers]]
id = "core-models"
name = "genai_core · models & embeddings"
owns = "Which models exist and how to call them: the model list, embeddings, cross-encoder reranking, the adapter registry, model providers (direct Bedrock/SageMaker/OpenAI, or the GenAI-EH gateway), Bedrock agents and the boto3/OpenAI client factory."
modules = ["lib.shared.layers.python-sdk.python.genai_core.models", "lib.shared.layers.python-sdk.python.genai_core.embeddings", "lib.shared.layers.python-sdk.python.genai_core.cross_encoder", "lib.shared.layers.python-sdk.python.genai_core.model_providers.*", "lib.shared.layers.python-sdk.python.genai_core.registry.*", "lib.shared.layers.python-sdk.python.genai_core.agents", "lib.shared.layers.python-sdk.python.genai_core.bedrock_agent.*", "lib.shared.layers.python-sdk.python.genai_core.clients"]

[[layers]]
id = "core-plumbing"
name = "genai_core · plumbing"
owns = "Leaf helpers everything else uses: SSM config and secrets (parameters), the boto3 retry config, shared enums and errors (types), JSON/S3/Comprehend/websocket utilities and the layer's sitecustomize. `lib` is only the empty root package."
modules = ["lib", "lib.shared.layers.python-sdk.python.genai_core.parameters", "lib.shared.layers.python-sdk.python.genai_core.boto_config", "lib.shared.layers.python-sdk.python.genai_core.types", "lib.shared.layers.python-sdk.python.genai_core.utils.*", "lib.shared.layers.python-sdk.python.sitecustomize"]

[[layers]]
id = "sagemaker"
name = "SageMaker model build"
owns = "Code that runs at deploy time or inside a SageMaker container, not on the request path: the CloudFormation custom resource that starts a CodeBuild model build, the build script, sample inference scripts, and the inference script for the RAG embedding/cross-encoder endpoint."
modules = ["lib.sagemaker-model.*", "lib.rag-engines.sagemaker-rag-models.*"]

[[journeys]]
id = "chat-message"
title = "Send a chat message and get the answer back"
actor = "signed-in user · React chat UI"
trigger = "AppSync mutation sendQuery (Cognito user pool auth)"
summary = "The sendQuery resolver Lambda checks the caller's Cognito groups against the chosen application, validates the request and publishes it to the SNS MessagesTopic; SNS fans it out by modelInterface to the LangChain RequestHandler, which picks a model adapter, optionally retrieves workspace passages, calls the model and saves the turn in the DynamoDB SessionsTable. Tokens and the final answer go back out through the same topic (direction OUT) to the Node.js outgoing-message handler, which calls the publishResponse mutation that the browser's receiveMessages subscription is listening to."
  [[journeys.steps]]
  symbol = "lib.chatbot-api.functions.resolvers.send-query-lambda-resolver.index:handler"
  actor = "AppSync ChatbotApi (data source realtimeResolverFunction)"
  action = "Parses the JSON string in arguments.data. With an applicationId it loads the application, refuses the call unless the user's cognito:groups intersect the application's Roles (admin and workspace_manager always pass), and overrides model, workspace, model kwargs, system prompts and allowed file types from the application record. Without an applicationId only admin or workspace_manager may chat (they pick model and workspace freely). Validates the result with the pydantic InputValidation model and publishes it."
  receives = "AppSync event: arguments.data (a JSON string), identity.sub, identity.claims['cognito:groups']"
  returns = "The SNS publish response (MessageId) — the answer itself arrives later on the subscription"
  stores = "Publishes the message (direction IN) to SNS MessagesTopic (env SNS_TOPIC_ARN)"
  payload = '''
{"action": "run", "modelInterface": "langchain", "direction": "IN", "userId": "4f1c2a90-0d3e-4b7a-9a11-5e6f7a8b9c0d",
 "userGroups": ["user"], "data": {"mode": "chain", "text": "What is our refund window?", "provider": "bedrock",
 "modelName": "anthropic.claude-3-haiku-20240307-v1:0", "sessionId": "sess-1042", "workspaceId": "ws-7f3a",
 "modelKwargs": {"streaming": true, "maxTokens": 512, "temperature": 0.6, "topP": 0.9}}}


'''
  note = "SNS subscription filters (lib/aws-genai-llm-chatbot-stack.ts) route on the message body: direction IN + modelInterface 'langchain' → SQS LangChainIngestionQueue; 'idefics' → IdeficsIngestionQueue; 'agent' → the Bedrock Agents IngestionQueue."
  [[journeys.steps]]
  symbol = "lib.chatbot-api.functions.resolvers.send-query-lambda-resolver.applications:get_application"
  action = "Reads the application item that pins model, workspace, prompts and the roles allowed to use it"
  receives = "applicationId"
  returns = "Application item: Model ('provider::model'), Workspace ('name::id'), Roles, Streaming, MaxTokens, Temperature, TopP, SystemPrompt*, Allow*Input"
  stores = "nothing (reads DynamoDB ApplicationsTable, env APPLICATIONS_TABLE_NAME)"
  [[journeys.steps]]
  symbol = "lib.model-interfaces.langchain.functions.request-handler.index:handler"
  actor = "SNS MessagesTopic → SQS LangChainIngestionQueue (maxReceiveCount 3, then DLQ) → Lambda RequestHandler"
  action = "Loads the third-party API keys secret into os.environ, runs every SQS record through the powertools BatchProcessor (record_handler unwraps the SNS envelope and dispatches 'run' to handle_run, 'heartbeat' to handle_heartbeat), then sends a short, sanitised error message to the client for every record that failed"
  receives = "SQS batch; each body is an SNS envelope whose Message is the JSON published above"
  returns = "processor.response() — partial batch failures, so only failed records are retried"
  stores = "On failure: an action 'error' message to SNS MessagesTopic (vague text; the real error only in logs)"
  [[journeys.steps]]
  symbol = "lib.model-interfaces.langchain.functions.request-handler.index:handle_run"
  action = "Picks the adapter class for 'provider.modelName' from the registry, wires its on_llm_new_token callback to stream tokens to this user/session, builds the adapter and calls run(); then publishes the final response"
  receives = "The IN message: userId, userGroups, data.{provider, modelName, mode, text, workspaceId, sessionId, images, documents, videos, modelKwargs}, systemPrompts"
  returns = "nothing (results leave through send_to_client)"
  stores = "SNS MessagesTopic: action 'final_response' with the adapter's response"
  [[journeys.steps]]
  symbol = "lib.shared.layers.python-sdk.python.genai_core.registry.index:AdapterRegistry.get_adapter"
  action = "Resolves the model name (rewritten through the GenAIEH gateway when that is configured) and returns the first registered adapter class whose regex matches, e.g. ^bedrock.anthropic.claude* → BedrockChatAdapter"
  receives = "'bedrock.anthropic.claude-3-haiku-20240307-v1:0'"
  returns = "Adapter class, or ValueError when no regex matches"
  stores = "nothing"
  [[journeys.steps]]
  symbol = "lib.model-interfaces.langchain.functions.request-handler.adapters.bedrock.base:BedrockChatAdapter.get_llm"
  action = "Called from the ModelAdapter constructor (which also opens the session's DynamoDBChatMessageHistory). Builds a LangChain ChatBedrockConverse with temperature/top_p/max_tokens from modelKwargs (only one sampling parameter for models that require it) and the Bedrock guardrail when BEDROCK_GUARDRAILS_ID is set"
  receives = "model_kwargs {streaming, maxTokens, temperature, topP}"
  returns = "ChatBedrockConverse client with the adapter's callback handler attached"
  stores = "nothing"
  [[journeys.steps]]
  symbol = "lib.model-interfaces.langchain.functions.request-handler.adapters.base.base:ModelAdapter.run"
  action = "Applies the input guardrail (ApplyGuardrail API, only for models without Converse guardrail support), then in 'chain' mode runs run_with_chain_v2 for Converse models (run_with_chain otherwise), applies the output guardrail and, if it intervenes, overwrites the last stored answer. Image/video modes go to run_with_media_generation_chain"
  receives = "prompt, workspace_id, user_groups, images/documents/videos, system_prompts"
  returns = "{sessionId, type: 'text', content, metadata} or the guardrail's canned reply"
  stores = "via the chain: DynamoDB SessionsTable"
  [[journeys.steps]]
  symbol = "lib.model-interfaces.langchain.functions.request-handler.adapters.base.base:ModelAdapter.run_with_chain_v2"
  action = "With a workspace: builds a history-aware retriever over WorkspaceRetriever (a non-streaming LLM condenses the question using chat history) feeding a stuff-documents QA chain; without one: prompt | llm. Wraps it in RunnableWithMessageHistory, streams or invokes it, appends the human and AI messages to history in the RAG case, and builds metadata (model, retrieved documents, prompts) that only admin/workspace_manager get back"
  receives = "user_prompt 'What is our refund window?', workspace_id 'ws-7f3a'"
  returns = "Response dict; non-admins see metadata reduced to {sessionId}"
  stores = "DynamoDB SessionsTable (History list on the item keyed SessionId + UserId); for admins also the metadata on the last message"
  payload = '''
{"sessionId": "sess-1042", "type": "text", "content": "Refunds are accepted within 30 days of delivery.",
 "metadata": {"sessionId": "sess-1042"}}


'''
  note = "RAG retrieval itself is the rag-retrieval journey (WorkspaceRetriever → semantic_search)."
  [[journeys.steps]]
  symbol = "lib.shared.layers.python-sdk.python.genai_core.langchain.chat_message_history:DynamoDBChatMessageHistory.add_message"
  action = "Reads the whole session item, appends the new message (flattening streamed AIMessageChunk content to text) and writes the item back with put_item"
  receives = "HumanMessage / AIMessage"
  returns = "nothing (ClientError is logged, not raised)"
  stores = "DynamoDB SessionsTable: SessionId, UserId, StartTime, History[]"
  [[journeys.steps]]
  symbol = "lib.model-interfaces.langchain.functions.request-handler.index:on_llm_new_token"
  action = "While the model streams, each token is published with an increasing sequenceNumber so the outgoing handler can order a batch (skipped when streaming is disabled, e.g. guardrails via ApplyGuardrail)"
  receives = "token (string or list of content parts), run_id"
  returns = "nothing"
  stores = "SNS MessagesTopic: action 'llm_new_token'"
  payload = '''
{"type": "text", "action": "llm_new_token", "userId": "4f1c2a90-…", "data": {"sessionId": "sess-1042",
 "token": {"runId": "b7e1…", "sequenceNumber": 7, "value": " within 30"}}}


'''
  [[journeys.steps]]
  symbol = "lib.shared.layers.python-sdk.python.genai_core.utils.websocket:send_to_client"
  action = "Stamps direction OUT and publishes the JSON (bytes → base64, Decimal → float) to MESSAGES_TOPIC_ARN. From here the reply leaves Python: SNS MessagesTopic (filter direction OUT) → SQS OutgoingMessagesQueue → Node.js Lambda outgoing-message-handler (lib/chatbot-api/functions/outgoing-message-appsync/index.ts), which sorts each batch by token sequenceNumber and calls the AppSync publishResponse(sessionId, userId, data) mutation; the browser's receiveMessages(sessionId) subscription (@aws_subscribe on publishResponse) delivers it"
  receives = "detail dict (llm_new_token / final_response / error / heartbeat)"
  returns = "nothing"
  stores = "SNS MessagesTopic"
  note = "The Node handler also tries to drop metadata for non-admin final responses, but it deletes a property of the still-serialised Message string, so it has no effect; the trimming that actually happens is in run_with_chain_v2 (Python)."

[[journeys]]
id = "upload-document"
title = "Upload a file into a workspace"
actor = "admin or workspace_manager · React workspace UI"
trigger = "AppSync query getUploadFileURL, then a browser POST of the file to S3 UploadBucket"
summary = "The API hands out a presigned S3 POST for '<workspaceId>/<fileName>'; the S3 ObjectCreated event lands on SQS IngestionQueue and the UploadHandler Lambda records the document in DynamoDB and starts the FileImport Step Functions workflow. The workflow runs an AWS Batch job that extracts text, splits it into chunks, embeds them and writes them to the workspace's Aurora table or OpenSearch index, then marks the document processed."
  [[journeys.steps]]
  symbol = "lib.chatbot-api.functions.api-handler.routes.documents:file_upload"
  actor = "AppSync ChatbotApi → Lambda GraphQLApiHandler (proxyResolverFunction)"
  action = "Validates fileName (safe characters, ≤500), requires admin or workspace_manager when a workspaceId is given and checks the extension against allowed_workspace_extensions; without a workspaceId it issues a per-user upload URL for chat attachments instead"
  receives = "input {workspaceId, fileName}"
  returns = "Presigned POST {url, fields}"
  stores = "nothing"
  payload = '''
{"workspaceId": "ws-7f3a", "fileName": "refund-policy.pdf"}


'''
  [[journeys.steps]]
  symbol = "lib.shared.layers.python-sdk.python.genai_core.presign:generate_workspace_presigned_post"
  action = "Checks the workspace exists, strips any directory from the file name, and signs a POST (SigV4, 1 hour, content-length 0–10 MB) for key '<workspaceId>/<basename>' in UPLOAD_BUCKET_NAME using the S3 Transfer Acceleration host"
  receives = "workspace_id, file_name"
  returns = "{url: 'https://<bucket>.s3-accelerate.amazonaws.com', fields: {...}}"
  stores = "nothing — the browser then uploads straight to S3 UploadBucket"
  [[journeys.steps]]
  symbol = "lib.rag-engines.data-import.functions.upload-handler.index:lambda_handler"
  actor = "S3 UploadBucket event notification → SQS IngestionQueue (maxReceiveCount 3, then IngestionDeadLetterQueue) → Lambda UploadHandler"
  action = "For each SQS record, unpacks the S3 event records and processes each one"
  receives = "SQS event whose body is an S3 event notification"
  returns = "nothing; an exception fails the whole batch back to SQS"
  stores = "nothing itself"
  [[journeys.steps]]
  symbol = "lib.rag-engines.data-import.functions.upload-handler.index:get_records_from_sqs_record"
  action = "Keeps only ObjectCreated* records (deletes and other events are skipped)"
  receives = "SQS record body {Records: [...]}"
  returns = "List of S3 records"
  stores = "nothing"
  payload = '''
{"eventName": "ObjectCreated:Post", "s3": {"bucket": {"name": "upload-bucket"},
 "object": {"key": "ws-7f3a/refund-policy.pdf", "size": 48213}}}


'''
  [[journeys.steps]]
  symbol = "lib.rag-engines.data-import.functions.upload-handler.index:process_record"
  action = "Takes the workspace id from the first key segment, creates (or resets) the document, then branches on engine: Kendra → copies the file and a .metadata.json into the Kendra data bucket and marks it processed; Aurora/OpenSearch → starts the FileImport state machine"
  receives = "One S3 record"
  returns = "nothing"
  stores = "Step Functions FileImportStateMachine execution (env FILE_IMPORT_WORKFLOW_ARN) with input below"
  payload = '''
{"workspace_id": "ws-7f3a", "document_id": "d-91c2", "input_bucket_name": "upload-bucket",
 "input_object_key": "ws-7f3a/refund-policy.pdf", "processing_bucket_name": "processing-bucket",
 "processing_object_key": "ws-7f3a/d-91c2/content.txt"}


'''
  [[journeys.steps]]
  symbol = "lib.shared.layers.python-sdk.python.genai_core.documents:create_document"
  action = "Files are unique by path: if 'file/<path>' already exists in the workspace the document is reset (status submitted, vectors 0) and keeps its id; otherwise a new document_id is created. The workspace counters (size_in_bytes, documents, vectors) are adjusted atomically with ADD. For type 'file' the content-upload and _process_document helpers do nothing — the upload handler drives processing"
  receives = "workspace_id, document_type 'file', path/title = file name, size_in_bytes"
  returns = "{workspace_id, document_id}"
  stores = "DynamoDB Documents (new or reset item) and Workspaces (counters)"
  [[journeys.steps]]
  symbol = "lib.shared.file-import-batch-job.main:main"
  actor = "Step Functions FileImportStateMachine: SetProcessing (DynamoDB status 'processing') → Batch job FileImportJob (python main.py with WORKSPACE_ID, DOCUMENT_ID, INPUT_*/PROCESSING_* env)"
  action = "Re-reads workspace and document, extracts text (.txt read directly; everything else through LangChain S3FileLoader / unstructured), copies the text to the processing bucket and adds chunks. Any exception sets the document status to 'error' and re-raises so the job fails; on success the state machine's SetProcessed step sets 'processed'"
  receives = "Environment variables from the state machine input"
  returns = "exit status"
  stores = "S3 ProcessingBucket '<ws>/<doc>/content.txt'; status in DynamoDB Documents"
  [[journeys.steps]]
  symbol = "lib.shared.layers.python-sdk.python.genai_core.chunks:split_content"
  action = "Splits the text with RecursiveCharacterTextSplitter using the workspace's chunk_size and chunk_overlap (only the 'recursive' strategy exists) and replaces NUL characters"
  receives = "workspace, content text"
  returns = "List of chunk strings"
  stores = "nothing"
  payload = '''
["Refunds are accepted within 30 days of delivery…", "…of delivery. Items must be unused and in original packaging…"]


'''
  [[journeys.steps]]
  symbol = "lib.shared.layers.python-sdk.python.genai_core.chunks:add_chunks"
  action = "Embeds all chunks with the workspace's embeddings model (Task store), gives each a uuid, writes each chunk to S3, then hands them to the engine-specific writer and updates the document's vector count"
  receives = "workspace, document, chunks, replace=True"
  returns = "nothing"
  stores = "S3 ProcessingBucket '<ws>/<doc>/chunks/<chunk_id>.txt'; DynamoDB Documents.vectors (set_document_vectors)"
  [[journeys.steps]]
  symbol = "lib.shared.layers.python-sdk.python.genai_core.embeddings:generate_embeddings"
  action = "Cuts any input longer than the model's character limit (≤10,000 chars) into pieces, calls the provider in batches of 50 (OpenAI, Bedrock Titan/Cohere, or the SageMaker RAG endpoint) and averages the vectors of pieces that came from one input"
  receives = "EmbeddingsModel, list of texts, task 'store'"
  returns = "One vector per input text"
  stores = "nothing; wraps any failure in CommonError"
  [[journeys.steps]]
  symbol = "lib.shared.layers.python-sdk.python.genai_core.aurora.chunks:add_chunks_aurora"
  action = "In one transaction, deletes the document's previous rows (replace) and inserts one row per chunk with its embedding into the workspace's own pgvector table (named after the workspace id without dashes). OpenSearch workspaces go to opensearch.chunks:add_chunks_open_search instead"
  receives = "chunk_ids, chunks, chunk_embeddings, document fields"
  returns = "{removed_vectors, added_vectors}"
  stores = "Aurora PostgreSQL table <workspace_id without dashes> (chunk_id, content, content_embeddings, …)"

[[journeys]]
id = "rag-retrieval"
title = "Retrieve workspace passages for a question"
actor = "LangChain RequestHandler (inside a chat turn) or the semantic-search page"
trigger = "WorkspaceRetriever._get_relevant_documents, called by the history-aware retriever in run_with_chain_v2"
summary = "The retriever asks semantic_search for the top 3 passages; it loads the workspace from DynamoDB and dispatches to the engine. For Aurora and OpenSearch the question is embedded, a vector search (and, with hybrid search on, a keyword search) returns up to 25 candidates each, duplicates are merged and an optional SageMaker cross-encoder re-ranks them; Kendra and Bedrock Knowledge Bases call their managed retrieve APIs. The passages become LangChain Documents stuffed into the QA prompt."
  [[journeys.steps]]
  symbol = "lib.shared.layers.python-sdk.python.genai_core.langchain.workspace_retriever:WorkspaceRetriever._get_relevant_documents"
  actor = "ModelAdapter.run_with_chain_v2 (history-aware retriever)"
  action = "Sends the (condensed) question to semantic_search with limit 3, converts each item to a Document (content_complement preferred over content, e.g. a Q&A answer) and remembers them for the response metadata"
  receives = "query: the stand-alone question"
  returns = "List[Document] with metadata chunk_id, document_id, path, title, score"
  stores = "self.documents_found (read later by get_last_search_documents)"
  payload = '''
{"page_content": "Refunds are accepted within 30 days of delivery…",
 "metadata": {"chunk_id": "c-55a1", "workspace_id": "ws-7f3a", "document_id": "d-91c2",
  "path": "refund-policy.pdf", "title": "refund-policy.pdf", "score": 0.82}}


'''
  [[journeys.steps]]
  symbol = "lib.shared.layers.python-sdk.python.genai_core.semantic_search:semantic_search"
  action = "Loads the workspace, refuses one that is missing or not 'ready', and dispatches on workspace.engine to aurora / opensearch / kendra / bedrock_kb"
  receives = "workspace_id, query, limit, full_response=False"
  returns = "{engine, items[...]} (full_response adds the separate vector and keyword lists, used by the semantic-search page)"
  stores = "nothing"
  [[journeys.steps]]
  symbol = "lib.shared.layers.python-sdk.python.genai_core.workspaces:get_workspace"
  action = "Reads the workspace item: engine, embeddings model, metric, hybrid_search, languages, cross-encoder, chunking settings"
  receives = "workspace_id"
  returns = "Workspace dict or None"
  stores = "nothing (DynamoDB Workspaces)"
  [[journeys.steps]]
  symbol = "lib.shared.layers.python-sdk.python.genai_core.aurora.query:query_workspace_aurora"
  action = "Embeds the question (Task retrieve), detects its language with Comprehend, runs a pgvector nearest-neighbour query (operator chosen by the workspace metric: cosine <=>, l2 <->, inner <#>) and, with hybrid search, a Postgres full-text query in that language; merges hits by chunk_id, re-ranks with the cross-encoder when one is configured and keeps those scoring above the threshold, then tops the list up from the vector scores"
  receives = "workspace, query, limit 3"
  returns = "{engine: 'aurora', query_language, items[...]}"
  stores = "nothing (reads the workspace's Aurora table)"
  payload = '''
{"engine": "aurora", "query_language": "english", "items": [{"chunk_id": "c-55a1", "document_id": "d-91c2",
 "content": "Refunds are accepted within 30 days…", "sources": ["keyword_search", "vector_search"],
 "vector_search_score": 0.18, "keyword_search_score": 0.4, "score": 0.82}]}


'''
  [[journeys.steps]]
  symbol = "lib.shared.layers.python-sdk.python.genai_core.embeddings:generate_embeddings"
  action = "Embeds the single question with the same model the workspace was indexed with (Cohere models get the search_query input type for retrieval)"
  receives = "[query], task 'retrieve'"
  returns = "[[float, …]]"
  stores = "nothing"
  [[journeys.steps]]
  symbol = "lib.shared.layers.python-sdk.python.genai_core.utils.comprehend:get_query_language"
  action = "Picks the Postgres text-search language for the keyword query from the workspace's languages and Comprehend's detection"
  receives = "query, workspace languages"
  returns = "(language_name, detected_languages)"
  stores = "nothing"
  [[journeys.steps]]
  symbol = "lib.shared.layers.python-sdk.python.genai_core.cross_encoder:rank_passages"
  action = "Truncates the query and each passage to 10,000 characters (at most 1,000 passages) and scores every passage against the query on the SageMaker RAG models endpoint"
  receives = "cross-encoder model, query, passages[]"
  returns = "One relevance score per passage"
  stores = "nothing"
  [[journeys.steps]]
  symbol = "lib.shared.layers.python-sdk.python.genai_core.opensearch.query:query_workspace_open_search"
  action = "Same shape as the Aurora path against the workspace's OpenSearch Serverless index: vector_query (k-NN, l2) plus keyword_query when hybrid search is on, merge by chunk_id, optional cross-encoder re-rank, top-up without repeating chunks already chosen"
  receives = "workspace, query, limit"
  returns = "{engine: 'opensearch', items[...]}"
  stores = "nothing"
  [[journeys.steps]]
  symbol = "lib.shared.layers.python-sdk.python.genai_core.kendra.query:query_workspace_kendra"
  action = "Calls Kendra Retrieve (page size 1–100); unless the index is external or 'use all data' is set, filters to documents whose workspace_id attribute matches"
  receives = "workspace (kendra_index_id), query, limit"
  returns = "{engine: 'kendra', items[...]}"
  stores = "nothing"
  [[journeys.steps]]
  symbol = "lib.shared.layers.python-sdk.python.genai_core.bedrock_kb.query:query_workspace_bedrock_kb"
  action = "Calls the Bedrock Knowledge Base Retrieve API with HYBRID or SEMANTIC search depending on the workspace's hybrid_search flag"
  receives = "workspace (knowledge_base_id), query, limit"
  returns = "{engine: 'bedrock_kb', items[...]}"
  stores = "nothing"

[[journeys]]
id = "create-workspace"
title = "Create a RAG workspace (Aurora or OpenSearch)"
actor = "workspace manager · React UI"
trigger = "AppSync mutation createAuroraWorkspace / createOpenSearchWorkspace"
summary = "The API Lambda validates the form, checks the embeddings model really answers, writes a workspace row with status submitted to DynamoDB Workspaces and starts a Step Functions workflow. The workflow sets the row to creating, a create Lambda builds the per-workspace pgvector table or OpenSearch index, and the workflow sets the row to ready (or error)."
  [[journeys.steps]]
  symbol = "lib.chatbot-api.functions.api-handler.index:handler"
  actor = "AppSync ChatbotApi (data source proxyResolverFunction)"
  action = "Receives the AppSync resolver event and dispatches it by fieldName to the router that registered the resolver; turns a pydantic ValidationError into 'Invalid request', passes CommonError through, and hides any other exception behind 'Something went wrong'"
  receives = "AppSync event: info.fieldName, arguments.input, identity (Cognito claims)"
  returns = "whatever the resolver returns, serialised by AppSync"
  stores = "nothing"
  payload = '''
{"info": {"fieldName": "createAuroraWorkspace"}, "arguments": {"input": {"kind": "aurora", "name": "product-docs", "embeddingsModelProvider": "bedrock", "embeddingsModelName": "amazon.titan-embed-text-v2:0", "languages": ["english"], "metric": "cosine", "index": true, "hybridSearch": true, "chunkingStrategy": "recursive", "chunkSize": 1000, "chunkOverlap": 200}}}


'''
  [[journeys.steps]]
  symbol = "lib.shared.layers.python-sdk.python.genai_core.auth:UserPermissions.approved_roles"
  action = "Decorator on the resolver: reads the caller's Cognito groups and lets the call through only for admin or workspace_manager"
  receives = "the router's current event (identity groups)"
  returns = "the resolver's result, or {\"error\": \"Unauthorized\"} for any other role"
  stores = "nothing"
  note = "An unauthorised caller gets a normal-looking result object, not a GraphQL error."
  [[journeys.steps]]
  symbol = "lib.chatbot-api.functions.api-handler.routes.workspaces:create_aurora_workspace"
  action = "Parses input into CreateWorkspaceAuroraRequest (name pattern, chunkSize > 100 …) and loads the deployment config from the SSM Config parameter"
  receives = "input dict from the GraphQL arguments"
  returns = "the converted workspace (id, name, engine, status submitted …)"
  stores = "nothing itself"
  note = "createOpenSearchWorkspace (create_open_search_workspace) is the same path with CreateWorkspaceOpenSearchRequest and no metric/index choice."
  [[journeys.steps]]
  symbol = "lib.chatbot-api.functions.api-handler.routes.workspaces:_create_workspace_aurora"
  action = "Looks the chosen embeddings and cross-encoder models up in config rag.embeddingsModels / rag.crossEncoderModels, takes the vector dimensions from the config entry, and rejects bad languages (1–3), metric (inner/cosine/l2), chunking strategy, chunk size (100–10000) or overlap"
  receives = "CreateWorkspaceAuroraRequest + config dict"
  returns = "_convert_workspace(item) for the GraphQL response"
  stores = "nothing itself"
  payload = '''
{"embeddings_model_dimensions": 1024, "metric": "cosine", "chunk_size": 1000, "chunk_overlap": 200}


'''
  [[journeys.steps]]
  symbol = "lib.shared.layers.python-sdk.python.genai_core.workspaces:create_workspace_aurora"
  action = "Generates a uuid4 workspace_id, embeds the word 'test' once to prove the model works, puts the workspace item, then calls sfn start_execution on CREATE_AURORA_WORKSPACE_WORKFLOW_ARN"
  receives = "workspace settings as keyword arguments"
  returns = "the DynamoDB item it wrote"
  stores = "DynamoDB Workspaces: one item (workspace_id, object_type='workspace') with status submitted and documents/vectors/size_in_bytes = 0; starts Step Functions CreateAuroraWorkspace"
  payload = '''
{"workspace_id": "3f2a9c1e-7b44-4d1a-9e0c-5a1b2c3d4e5f", "object_type": "workspace", "name": "product-docs", "engine": "aurora", "status": "submitted", "embeddings_model_dimensions": 1024, "documents": 0, "vectors": 0}


'''
  note = "The test embedding call means a misconfigured or unreachable model fails the mutation before anything is written."
  [[journeys.steps]]
  symbol = "lib.rag-engines.aurora-pgvector.functions.create-workflow.create.index:lambda_handler"
  actor = "Step Functions CreateAuroraWorkspace (SetCreating → task Create)"
  action = "The state machine first sets status creating (DynamoUpdateItem), then invokes this Lambda, which re-reads the workspace row and hands it to the Aurora engine"
  receives = "{\"workspace_id\": ...} from the execution input"
  returns = "{\"ok\": true}; any exception is caught by the workflow's HandleError state"
