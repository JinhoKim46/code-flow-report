[[findings]]
id = "aurora-fallback-distance-sort"
severity = "medium"
category = "risk"
title = "Aurora fallback adds the least similar chunks for cosine and l2 workspaces"
detail = "True now: for metrics cosine and l2 the SQL returns a distance (<=> and <->, smaller is closer), but when fewer than `limit` items survive the cross-encoder threshold (or there is no cross-encoder) the fallback sorts by vector_search_score descending and keeps only scores > 0.5 - i.e. the farthest chunks. Trigger: any Aurora RAG query on a cosine or l2 workspace where the ranked list is short. Reach: the context passed to the model for those workspaces; OpenSearch (similarity scores) and inner-product workspaces are not affected."
symbols = ["lib.shared.layers.python-sdk.python.genai_core.aurora.query:query_workspace_aurora"]
evidence = "Read query_workspace_aurora: metric cosine uses 'content_embeddings <=> %s AS vector_search_score ... ORDER BY vector_search_score' (ascending distance), and the non-inner fallback uses sorted(..., reverse=True) with filter (val['vector_search_score'] or -1) > 0.5. convert_types in aurora.utils only converts UUIDs, so scores are raw distances."
check = {kind = "text_in", pattern = "\\(val\\[\"vector_search_score\"\\] or -1\\) > 0\\.5"}

