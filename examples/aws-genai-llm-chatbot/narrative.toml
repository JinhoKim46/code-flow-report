[[roles]]
id = "aws-boto3"
name = "DynamoDB tables (sessions, applications, workspaces, documents)"
kind = "external"
symbols = ["lib.shared.layers.python-sdk.python.genai_core.langchain.chat_message_history:DynamoDBChatMessageHistory.add_message", "lib.shared.layers.python-sdk.python.genai_core.sessions:delete_session", "lib.shared.layers.python-sdk.python.genai_core.workspaces:get_workspace", "lib.shared.layers.python-sdk.python.genai_core.documents:create_document", "lib.shared.layers.python-sdk.python.genai_core.aurora.delete:delete_workspace", "lib.shared.layers.python-sdk.python.genai_core.kendra.delete:delete_workspace", "lib.shared.layers.python-sdk.python.genai_core.opensearch.delete:delete_workspace"]
purpose = "All the app's own state lives in DynamoDB: one SessionsTable item per chat (the whole message history in a History list), ApplicationsTable rows that pin a model and workspace to a named app, and the Workspaces and Documents tables that track every RAG workspace and every imported file, website, RSS feed and post with its status."
input = "Plain boto3 resource/client calls built from Python dicts: the session key (SessionId, UserId), workspace_id + object_type, or workspace_id + document_id."
message = ["get_item / put_item on SessionsTable: read the History list, append one message, write the whole item back", "put_item / update_item / query on Workspaces and Documents (status changes, vector counts, index queries by status or compound key)", "delete_item when a session, workspace or document is removed"]
config = "Table names from env vars SESSIONS_TABLE_NAME, APPLICATIONS_TABLE_NAME, WORKSPACES_TABLE_NAME, DOCUMENTS_TABLE_NAME; index names from SESSIONS_BY_USER_ID_INDEX_NAME, WORKSPACES_BY_OBJECT_TYPE_INDEX_NAME, DOCUMENTS_BY_COMPOUND_KEY_INDEX_NAME, DOCUMENTS_BY_STATUS_INDEX. Tables are created by the CDK constructs under lib/chatbot-api/chatbot-dynamodb-tables, lib/chatbot-api/application-dynamodb-tables and lib/rag-engines/rag-dynamodb-tables."
output = "The item (or nothing). Success is simply 'no ClientError'."
validation = "No conditional writes on the chat history: add_message reads the item, appends, and puts it back, so two concurrent writers can overwrite each other. A ClientError on put_item is caught and only logged, so a history that grows past DynamoDB's item size limit stops being saved without the user seeing an error. Document rows for RSS posts use ConditionExpression attribute_not_exists(document_id) to skip posts already seen. boto3 default retries only."
logging = "Powertools Logger in each Lambda; failures inside DynamoDBChatMessageHistory are logged with logger.exception and swallowed."
cost = "not measured (on-demand table billing is set in CDK)"
result_use = "History becomes the LangChain chat_history for the next answer; workspace/document status drives the UI and the Step Functions workflows."

