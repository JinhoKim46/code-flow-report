detail = "True now: genai_core.embeddings:generate_embeddings is what workspaces, chunks and every query module call; generate_embeddings_test.py imports and patches model_providers.direct.embeddings instead. The two bodies are currently identical. Trigger: a change to the chunk-averaging or batching in genai_core.embeddings. Reach: the tests keep passing on the copy while the live function changes."
symbols = ["lib.shared.layers.python-sdk.python.genai_core.model_providers.direct.embeddings:generate_embeddings"]
evidence = "diff of genai_core/embeddings.py and model_providers/direct/embeddings.py shows only import and model-lookup differences; grep found the only importer of direct.embeddings is tests/shared/layers/python-sdk/genai_core/generate_embeddings_test.py."
check = "symbol_exists"

[[findings]]
id = "opensearch-replace-removes-ten"
severity = "medium"
category = "risk"
title = "Replacing a document's chunks in OpenSearch deletes at most 10 old chunks"
detail = "True now: clean_chunks_open_search calls client.search with no size, so OpenSearch returns its default 10 hits and only those records are deleted. Trigger: a file re-uploaded under the same path (create_document reuses the document id and the FileImportJob calls add_chunks with replace=True) or an edited text document, when the old version had more than 10 chunks. Reach: OpenSearch workspaces only; the leftover old chunks stay in the index and keep being returned to RAG answers, while set_document_vectors overwrites the vector count so the Documents table does not show them."
symbols = ["lib.shared.layers.python-sdk.python.genai_core.opensearch.chunks:clean_chunks_open_search"]
evidence = "Read opensearch.chunks:clean_chunks_open_search (search(index=index_name, body=query), no size), chunks:add_chunks (passes replace through), file-import-batch-job main:add_chunks and documents:_process_document (replace=True), documents:create_document (reuses document_id for an existing path) and documents:set_document_vectors (SET vectors when replace)."
check = {kind = "text_in", pattern = "client\\.search\\(index=index_name, body=query\\)"}

[[findings]]
id = "genaieh-modalities-mismatch"
severity = "low"
category = "risk"
title = "With GenAIEH enabled, applications are saved with empty output modalities"
detail = "True now: applications create/update store models.get_model_modalities(model) as OutputModalities, where model is 'provider::name' (validate_request requires the '::'). DirectModelProvider splits on '::' and returns outputModalities; GenAIEHModelProvider compares the whole id with each model's bare name and, if it ever matched, would return inputModalities. Trigger: genaieh.enabled in the Config SSM parameter and an admin saves an application. Reach: every application saved in that deployment carries OutputModalities = [], which the API returns as outputModalities to the UI."
symbols = ["lib.shared.layers.python-sdk.python.genai_core.model_providers.genaieh.genaieh:GenAIEHModelProvider.get_model_modalities"]
evidence = "Read genaieh:GenAIEHModelProvider.get_model_modalities, direct.provider:DirectModelProvider.get_model_modalities, applications:create_application / update_application and validate_request (model.split('::')), and routes.applications (returns app OutputModalities)."
check = {kind = "text_in", pattern = "model\\[\"name\"\\] == model_name"}

[[findings]]
id = "llama3-instruct-unused"
severity = "low"
category = "dead code"
title = "The Llama 3 prompt templates have no adapter using them"
detail = "Now: adapters/shared/meta/llama3_instruct.py defines Llama3 prompt templates and Llama3ConversationBufferMemory, re-exported by adapters.shared.meta, but no adapter imports them; Bedrock Llama 3 goes through BedrockChatAdapter and SageMaker has only a Llama 2 adapter. Trigger: someone edits these templates expecting Llama 3 answers to change. Reach: none at runtime — the file is only loaded."
symbols = ["lib.model-interfaces.langchain.functions.request-handler.adapters.shared.meta.llama3_instruct:Llama3ConversationBufferMemory"]
evidence = "grep for Llama3 / llama3_instruct across lib and tests finds only the definition and the re-export in shared/meta/__init__.py; codeflow module shows no callers."
check = "no_callers"

[[findings]]
id = "update-application-drops-condense-prompt"
severity = "medium"
category = "risk"
title = "Editing an application silently drops its condense prompt"
detail = "update_application stores the prompt under the key ConsiseSystemPrompt, while create_application and the sendQuery resolver use CondenseSystemPrompt; because the update is a whole-item put_item, the old CondenseSystemPrompt attribute is replaced. Trigger: an admin edits any application. Reach: every later chat through that application sends an empty condense system prompt (the resolver reads CondenseSystemPrompt with a default of \"\"), so follow-up questions are condensed with the default behaviour instead of the configured prompt."
symbols = ["lib.shared.layers.python-sdk.python.genai_core.applications:update_application", "lib.shared.layers.python-sdk.python.genai_core.applications:create_application"]
evidence = "Read genai_core.applications (create_application writes CondenseSystemPrompt, update_application writes ConsiseSystemPrompt, both via table.put_item) and the send-query-lambda-resolver handler (application_item.get(\"CondenseSystemPrompt\", \"\"))."
check = {kind = "text_in", pattern = "ConsiseSystemPrompt"}

[[findings]]
id = "bedrock-kb-document-delete-unsupported"
severity = "low"
category = "risk"
title = "Deleting a document in a Bedrock knowledge-base workspace always fails"
detail = "The delete-document Lambda handles opensearch, aurora and kendra workspaces and raises \"Workspace engine not supported\" for anything else, but workspaces can be created with engine bedrock_kb (create_workspace_bedrock_kb). Trigger: deleting a document from a Bedrock KB workspace. Reach: that Step Functions execution fails; the document stays listed."
symbols = ["lib.rag-engines.workspaces.functions.delete-document-workflow.delete.index:lambda_handler", "lib.shared.layers.python-sdk.python.genai_core.workspaces:create_workspace_bedrock_kb"]
evidence = "Read the engine branches in the delete-document Lambda and create_workspace_bedrock_kb in genai_core.workspaces."
check = {kind = "text_in", pattern = "Workspace engine not supported"}

[[layer_rules]]
