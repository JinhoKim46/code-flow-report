name = "Aurora PostgreSQL + pgvector (aurora engine)"
kind = "external"
symbols = ["lib.shared.layers.python-sdk.python.genai_core.aurora.query:query_workspace_aurora", "lib.shared.layers.python-sdk.python.genai_core.aurora.chunks:add_chunks_aurora", "lib.shared.layers.python-sdk.python.genai_core.aurora.chunks:clean_chunks_aurora", "lib.shared.layers.python-sdk.python.genai_core.aurora.create:create_workspace_table", "lib.shared.layers.python-sdk.python.genai_core.aurora.connection:AuroraConnection.__enter__", "lib.rag-engines.aurora-pgvector.functions.pg-setup.index:lambda_handler"]
purpose = "Vector store for workspaces created with engine 'aurora': one table per workspace (named after the workspace id without dashes) holding chunk text, metadata and the pgvector embedding, queried by vector distance and, when hybrid search is on, by full-text rank."
input = "SQL built with psycopg2.sql.SQL / sql.Identifier (table and language are identifiers, never string-formatted values); the query embedding is passed as a numpy array parameter."
message = ["connect: IAM auth token from rds.generate_db_auth_token, user taken from AURORA_DB_USER (read-only, write or admin per Lambda)", "vector search: ORDER BY content_embeddings <=> / <-> / <#> the query vector (cosine / l2 / inner, per workspace metric) LIMIT 25", "keyword search (hybrid only): ts_rank_cd(to_tsvector(language, content), plainto_tsquery(language, query)) LIMIT 25", "writes: INSERT chunks with embeddings; CREATE TABLE / index at workspace creation; DROP TABLE at workspace deletion"]
config = "Env vars AURORA_DB_HOST, AURORA_DB_PORT, AURORA_DB_USER (set per Lambda in CDK from AURORA_DB_USERS: READ_ONLY for the LangChain RequestHandler, WRITE for GraphQLApiHandler, ADMIN for the create/delete workflow Lambdas). The cluster is created only when config rag.engines.aurora.enabled; the DB users and the vector extension are set up by the DatabaseSetupFunction custom resource from the cluster secret (resource property AURORA_DB_SECRET_ID)."
output = "Rows converted to dicts with vector_search_score / keyword_search_score and a sources list."
validation = "connect_timeout=10 on every connection; the IAM token is cached on the class for 10 minutes. No retry around queries: an error propagates to the caller (the API resolver turns it into a generic error; the RAG chat fails the SQS record). Results from both searches are merged by chunk_id and re-ranked by the cross-encoder when the workspace has one."
logging = "logger.debug of the final result in query_workspace_aurora; otherwise errors surface in the calling Lambda's log."
cost = "not measured"
result_use = "Becomes the item list returned to semantic search and to WorkspaceRetriever, i.e. the context documents the chat model answers from."

