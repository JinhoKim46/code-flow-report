purpose = "The default model provider: chat (Converse API through LangChain's ChatBedrockConverse), embeddings (invoke_model for Titan and Cohere), image/video generation and Guardrails all go through one bedrock-runtime client factory, which swaps in the GenAIEH gateway endpoint when that is configured."
input = "A boto3 bedrock-runtime client; the request body is built by the caller (Converse messages, embeddings JSON, ApplyGuardrail content)."
