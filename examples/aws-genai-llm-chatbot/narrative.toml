[[findings]]
id = "aurora-drop-table-never-committed"
severity = "medium"
category = "risk"
title = "Deleting an Aurora workspace never commits its DROP TABLE, so the vector table stays"
detail = "Now: genai_core.aurora.delete:delete_workspace opens AuroraConnection(autocommit=False), executes DROP TABLE IF EXISTS and leaves the with-block; AuroraConnection.__exit__ only closes the cursor and connection, and closing a psycopg2 connection with an open transaction rolls it back (PostgreSQL DDL is transactional). create_workspace_table, by contrast, calls cursor.connection.commit(). Trigger: every deleteWorkspace on an aurora workspace. Reach: the workspace's whole pgvector table (all chunk texts and embeddings) stays in Aurora while S3 objects and every DynamoDB row are removed, so the data the user deleted is retained and storage grows with each deleted workspace; nothing in the app can reach that table any more."
symbols = ["lib.shared.layers.python-sdk.python.genai_core.aurora.delete:delete_workspace"]
evidence = "Read genai_core.aurora.delete:delete_workspace (no commit), genai_core.aurora.connection:AuroraConnection.__exit__ (close only, set_session(autocommit=False) in __enter__) and genai_core.aurora.create:create_workspace_table (explicit commit). Not run against a live database."
check = {kind = "text_in", pattern = "^(?![\\s\\S]*\\.commit\\()"}

[[findings]]
id = "aurora-document-delete-swallows-error"
severity = "medium"
category = "risk"
title = "A failed chunk delete in Aurora still removes the document record"
detail = "Now: deleteAuroraDocument catches psycopg2.Error, logs it and returns normally; delete_aurora_document then deletes the Documents item and subtracts the vectors from the workspace. Trigger: any Postgres error during the DELETE (connection timeout, IAM token expiry, lock). Reach: that document's chunks stay in the workspace table and keep being returned by query_workspace_aurora to chat and semantic search, while the document no longer appears in the list and cannot be deleted again from the UI. The Step Functions DeleteDocument workflow sees success, so nothing retries."
symbols = ["lib.shared.layers.python-sdk.python.genai_core.aurora.delete:deleteAuroraDocument", "lib.shared.layers.python-sdk.python.genai_core.aurora.delete:delete_aurora_document"]
evidence = "Read aurora/delete.py: deleteAuroraDocument wraps the DELETE in try/except psycopg2.Error with logger.error only; delete_aurora_document calls it and continues to documents_table.delete_item and the workspace counter update."
check = {kind = "text_in", pattern = "except psycopg2\\.Error"}

[[findings]]
id = "guardrail-replace-is-noop"
severity = "medium"
category = "doc vs code"
title = "A guardrail-blocked answer is not replaced in the stored chat history"
detail = "Now: when Bedrock Guardrails block the model's output, ModelAdapter.run calls chat_history.replace_last_message(blocked text) and returns the guardrail message to the user. replace_last_message reads the history and put_items it back unchanged — the content argument is only logged. Trigger: any output blocked by a configured guardrail (docs/documentation/security.md recommends enabling them). Reach: the blocked answer stays in SessionsTable, is shown again when the user reopens the session (getSession returns History) and is fed back to the model as chat_history on the next turn."
symbols = ["lib.shared.layers.python-sdk.python.genai_core.langchain.chat_message_history:DynamoDBChatMessageHistory.replace_last_message", "lib.model-interfaces.langchain.functions.request-handler.adapters.base.base:ModelAdapter.run"]
evidence = "Read chat_message_history.py:DynamoDBChatMessageHistory.replace_last_message (messages never modified; content used only in logger.info) and adapters/base/base.py:ModelAdapter.run (calls replace_last_message after apply_bedrock_guardrails returns a response). History is written by RunnableWithMessageHistory → add_message in run_with_chain_v2."
check = {kind = "text_in", pattern = "(?s)\\A(?!.*messages\\[-1\\]).*"}

[[findings]]
id = "session-history-single-item"
severity = "low"
category = "risk"
title = "A whole conversation lives in one DynamoDB item and a failed save is silent"
detail = "Now: add_message re-reads the History list, appends one message and put_items the entire item; a ClientError is logged and swallowed. Trigger: a long session whose History (with metadata such as retrieved documents) passes DynamoDB's 400 KB item limit. Reach: from then on no new message of that session is stored, while the user still sees answers stream in; reloading the session shows the history cut at the limit. Every turn also costs one full read and one full write of the growing item."
