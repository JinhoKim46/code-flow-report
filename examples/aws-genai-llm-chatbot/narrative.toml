from_layers = ["core-records", "core-rag", "core-models", "core-plumbing"]
forbid = ["lib.chatbot-api.", "lib.rag-engines.", "lib.authentication.", "lib.sagemaker-model.", "lib.shared.file-import-batch-job.", "lib.shared.web-crawler-batch-job.", "lib.model-interfaces.idefics.", "lib.model-interfaces.bedrock-agents.", "lib.model-interfaces.langchain.functions.request-handler.index"]

[[layer_rules]]
text = "Handlers never import each other: the API, the model handlers, the RAG Lambdas and the batch jobs talk only through AWS (SNS, SQS, Step Functions, S3), never by import."
from_layers = ["api", "model-interfaces", "rag-lambdas", "batch-jobs", "auth"]
forbid = ["lib.chatbot-api.functions.api-handler.index", "lib.chatbot-api.functions.resolvers.send-query-lambda-resolver.index", "lib.model-interfaces.langchain.functions.request-handler.index", "lib.model-interfaces.idefics.functions.request-handler.index", "lib.model-interfaces.bedrock-agents.functions.request-handler.index", "lib.rag-engines.", "lib.shared.file-import-batch-job.", "lib.shared.web-crawler-batch-job."]

[[layer_rules]]
text = "The model handlers only read knowledge through the retriever; they never import the workspace, document or engine write modules."
from_layers = ["model-interfaces"]
forbid = ["lib.shared.layers.python-sdk.python.genai_core.workspaces", "lib.shared.layers.python-sdk.python.genai_core.documents", "lib.shared.layers.python-sdk.python.genai_core.chunks", "lib.shared.layers.python-sdk.python.genai_core.aurora.", "lib.shared.layers.python-sdk.python.genai_core.opensearch.", "lib.shared.layers.python-sdk.python.genai_core.kendra.", "lib.shared.layers.python-sdk.python.genai_core.bedrock_kb."]

[[layer_rules]]
