[[findings]]
id = "delete-workflow-timeout-shorter-than-lambda"
severity = "low"
category = "risk"
title = "Delete workflows time out after 5 minutes while their Lambda may run 15"
detail = "True now: DeleteWorkspace and DeleteDocument state machines have timeout 5 minutes, their Lambdas 15 minutes. Trigger: a deletion (large Kendra or OpenSearch workspace) that takes longer than 5 minutes and then fails. Reach: the execution ends TIMED_OUT, which the States.ALL catch on the task does not handle, so HandleError never sets status 'error' and the item stays 'deleting'; a deletion that eventually succeeds is not affected."
