[[entities]]
id = "workspace"
name = "Workspace"
summary = "One item in DynamoDB Workspaces (key workspace_id + object_type 'workspace') = one knowledge base: which engine, embedding model, chunking settings, and running counters (documents, vectors, size_in_bytes). Aurora and OpenSearch workspaces also own a table/index named after the id without dashes."
  [[entities.events]]
  stage = "born"
  symbol = "lib.shared.layers.python-sdk.python.genai_core.workspaces:create_workspace_aurora"
  by = "admin or workspace manager · GraphQL createAuroraWorkspace"
  text = "Checks the embedding model works by embedding 'test', puts the item with status 'submitted', then starts Step Functions CreateAuroraWorkspace. create_workspace_open_search and create_workspace_kendra do the same; create_workspace_bedrock_kb is born 'ready' with no workflow."
  [[entities.events]]
  stage = "store"
  symbol = "lib.shared.layers.python-sdk.python.genai_core.aurora.create:create_workspace_table"
  by = "Lambda CreateAuroraWorkspaceFunction (Step Functions)"
  text = "Creates the pgvector table (one row per chunk) and its indexes, then commits. opensearch.create:create_workspace_index creates the OpenSearch index instead. The workflow then sets status 'ready'."
  [[entities.events]]
  stage = "update"
  symbol = "lib.shared.layers.python-sdk.python.genai_core.documents:create_document"
  by = "any document import"
  text = "ADDs to the counters documents, size_in_bytes and vectors on every new or re-imported document; set_document_vectors adds the vector count once chunks are stored."
  [[entities.events]]
  stage = "read"
  symbol = "lib.shared.layers.python-sdk.python.genai_core.workspaces:get_workspace"
  by = "API, retriever, batch jobs, delete Lambdas"
  text = "get_item by workspace_id; every RAG path starts here to learn the engine and embedding model."
  [[entities.events]]
  stage = "delete"
  symbol = "lib.shared.layers.python-sdk.python.genai_core.workspaces:delete_workspace"
  by = "admin or workspace manager · GraphQL deleteWorkspace"
  text = "Refuses unless status is 'ready' or 'error', then starts Step Functions DeleteWorkspace."
  [[entities.events]]
  stage = "delete"
  symbol = "lib.shared.layers.python-sdk.python.genai_core.aurora.delete:delete_workspace"
  by = "Lambda DeleteWorkspaceFunction"
  text = "Deletes the workspace prefix in UploadBucket and ProcessingBucket, issues DROP TABLE for the pgvector table (never committed, see findings), deletes every Documents item in batches of 25, then the Workspaces item. opensearch.delete:delete_workspace deletes the index instead."

[[entities]]
id = "document"
name = "Document"
summary = "One item in DynamoDB Documents (key workspace_id + document_id) = one source added to a workspace: a file, text, Q&A pair, website, RSS feed or RSS post. Holds the status (submitted → processing → processed / error; rss feeds 'enabled'/'disabled'), size and vector count. File, website and rss documents are unique per path through compound_sort_key."
  [[entities.events]]
  stage = "born"
  symbol = "lib.shared.layers.python-sdk.python.genai_core.documents:create_document"
  by = "GraphQL addTextDocument / addQnADocument / addWebsite / addRssFeed, or Lambda UploadHandler for S3 uploads"
  text = "Looks up an existing item by compound_sort_key; if found it is reset to 'submitted' with vectors 0, otherwise a new item is put. Then writes the text to ProcessingBucket and starts the right import (FileImportStateMachine, WebsiteCrawling, or chunks inline for Q&A)."
  [[entities.events]]
  stage = "transform"
  symbol = "lib.shared.file-import-batch-job.main:main"
  by = "AWS Batch FileImportJob (FileImportStateMachine)"
  text = "Reads the upload from S3 (plain text or via S3FileLoader), copies the text to ProcessingBucket, splits and embeds it through genai_core.chunks.add_chunks. On any error sets status 'error'. The state machine sets 'processing' before and 'processed' after with DynamoDB tasks."
  [[entities.events]]
  stage = "update"
  symbol = "lib.shared.layers.python-sdk.python.genai_core.documents:set_status"
  by = "import paths, RSS toggles"
  text = "SET status and updated_at."
  [[entities.events]]
  stage = "read"
  symbol = "lib.shared.layers.python-sdk.python.genai_core.documents:list_documents"
  by = "GraphQL listDocuments"
  text = "Pages through a workspace's documents by type."
  [[entities.events]]
  stage = "delete"
  symbol = "lib.shared.layers.python-sdk.python.genai_core.documents:delete_document"
  by = "admin or workspace manager · GraphQL deleteDocument"
  text = "Refuses unless status is processed, error or enabled, then starts Step Functions DeleteDocument."
  [[entities.events]]
  stage = "delete"
  symbol = "lib.shared.layers.python-sdk.python.genai_core.aurora.delete:delete_aurora_document"
  by = "Lambda DeleteDocumentFunction"
  text = "Deletes the upload object and the processing prefix in S3, deletes the document's chunks from the pgvector table, deletes the Documents item and subtracts its size, count and vectors from the workspace. opensearch.delete:delete_open_search_document and kendra.delete:delete_kendra_document do the same for their engines."

[[entities]]
id = "chunk"
name = "Chunk (vector)"
summary = "One piece of a document's text with its embedding: a row in the workspace's Aurora pgvector table, or a document in its OpenSearch index, plus a plain-text copy in ProcessingBucket under workspace_id/document_id/chunks/. This is what retrieval returns."
  [[entities.events]]
  stage = "transform"
  symbol = "lib.shared.layers.python-sdk.python.genai_core.chunks:split_content"
  by = "file import job, crawler, text documents"
  text = "Splits the text with the workspace's chunking_strategy, chunk_size and chunk_overlap."
  [[entities.events]]
  stage = "born"
  symbol = "lib.shared.layers.python-sdk.python.genai_core.chunks:add_chunks"
  by = "file import job, web crawler job, Q&A documents"
  text = "Embeds all chunks with the workspace's embedding model, stores the text on S3 (store_chunks_on_s3), then hands them to the engine and records the vector count on the document."
  [[entities.events]]
  stage = "store"
  symbol = "lib.shared.layers.python-sdk.python.genai_core.aurora.chunks:add_chunks_aurora"
  by = "genai_core.chunks.add_chunks"
  text = "In one transaction: when replace=True, deletes the document's old rows, then inserts one row per chunk (content, complement, embedding) and commits. add_chunks_open_search is the OpenSearch counterpart."
  [[entities.events]]
  stage = "read"
  symbol = "lib.shared.layers.python-sdk.python.genai_core.aurora.query:query_workspace_aurora"
  by = "chat retriever and the semantic-search page"
  text = "Embeds the question, runs a vector query (and a full-text query when hybrid_search is on), optionally reranks with the cross-encoder and returns the top chunks. query_workspace_open_search is the OpenSearch counterpart."
  [[entities.events]]
  stage = "delete"
  symbol = "lib.shared.layers.python-sdk.python.genai_core.aurora.delete:deleteAuroraDocument"
  by = "delete_aurora_document"
  text = "DELETE FROM the workspace table WHERE document_id matches, then commit. A SQL error is logged and swallowed (see findings)."

