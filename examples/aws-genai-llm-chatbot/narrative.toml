[[findings]]
id = "sqs-partial-failure-not-wired"
severity = "low"
category = "risk"
title = "The LangChain and Idefics handlers return per-record failures that SQS never reads"
detail = "Now: the LangChain handler (and the Idefics one) process the SQS batch with BatchProcessor and return processor.response() (batchItemFailures), but their SqsEventSource is created without reportBatchItemFailures, so Lambda ignores that list and deletes the whole batch; a failed record is answered with an error message to the user and dropped. The DLQ (maxReceiveCount 3) only receives messages when the whole invocation times out or crashes — and then the batch's successful records are re-run too, calling the model again and appending to their history a second time. Bedrock Agents sets reportBatchItemFailures: true. Trigger: a Lambda timeout (15 min) or crash with more than one message in the batch. Reach: duplicate answers and duplicate history entries for the other sessions in that batch."
symbols = ["lib.model-interfaces.langchain.functions.request-handler.index:handler", "lib.model-interfaces.idefics.functions.request-handler.index:handler"]
evidence = "Read langchain/functions/request-handler/index.py:handler (BatchProcessor, returns processor.response()) and lib/model-interfaces/langchain/index.ts and idefics/index.ts (new SqsEventSource(queue) with no options) versus bedrock-agents/index.ts (reportBatchItemFailures: true); LangChainIngestionQueue has a DLQ with maxReceiveCount 3."

