.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }

tr.pick:hover td { background: var(--surface-2); }

.finding.sev-high { border-left-color: var(--bad); } .finding.sev-medium { border-left-color: var(--amber); } .finding.sev-low { border-left-color: var(--l0); } .finding.sev-info { border-left-color: var(--muted); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* fade: when something is selected, everything not connected to it steps back */
.fadeable { transition: opacity 0.18s ease; }
.focus .fadeable.dim { opacity: var(--fade, 0.22); }
.focus .medge.dim, .focus .e.dim { stroke-opacity: 0.05; }
.medge.bg { stroke: var(--muted); stroke-opacity: 0.10; stroke-width: 1; }
.focus .medge.bg { stroke-opacity: 0.03; }
.medge.hl, .e.hl { stroke-opacity: 1 !important; stroke-width: 2.4 !important; }
.fadebar { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.fadebar input[type=range] { width: 120px; accent-color: var(--accent); }
.todo { color: var(--amber); font-style: italic; }

ora.utils only converts UUIDs, so scores are raw distances.","id":"aurora-fallback-distance-sort","severity":"medium","symbols":["lib.shared.layers.python-sdk.python.genai_core.aurora.query:query_workspace_aurora"],"title":"Aurora fallback adds the least similar chunks for cosine and l2 workspaces"},{"_locs":[{"doc":"","file":"lib/model-interfaces/idefics/functions/request-handler/adapters/idefics.py","line":61,"params":["self","prompt","model_kwargs"],"symbol":"lib.model-interfaces.idefics.functions.request-handler.adapters.idefics:Idefics.handle_run"},{"doc":"","file":"lib/model-interfaces/idefics/functions/request-handler/index.py","line":51,"params":["record"],"symbol":"lib.model-interfaces.idefics.functions.request-handler.index:handle_run"}],"category":"risk","check":{"kind":"text_in","pattern":"def handle_run\\(self, prompt: str, model_kwargs: dict\\)"},"detail":"True now: the multimodal request handler calls model.handle_run(input=..., model_kwargs=..., files=...), but Idefics.handle_run is defined as (self, prompt, model_kwargs). Trigger: any request to a SageMaker IDEFICS model (registered as sagemaker.*idefics*). Reach: every IDEFICS request fails with a TypeError and the user gets 'Something went wrong'; Claude 3 requests on the same interface are unaffected.","evidence":"Read lib/model-interfaces/idefics/functions/request-handler/index.py handle_run (model.handle_run(input=run_input, model_kwargs=model_kwargs, files=files)) and adapters/idefics.py (def handle_run(self, prompt: str, model_kwargs: dict)); Claude3.handle_run in adapters/claude.py takes (input, model_kwargs, files).","id":"idefics-handle-run-signature","severity":"medium","symbols":["lib.model-interfaces.idefics.functions.request-handler.adapters.idefics:Idefics.handle_run","lib.model-interfaces.idefics.functions.request-handler.index:handle_run"],"title":"IDEFICS adapter cannot be called: handle_run signature does not match the caller"},{"_locs":[{"doc":"","file":"lib/rag-engines/workspaces/functions/delete-workspace-workflow/delete/index.py","line":14,"params":["event","context"],"symbol":"lib.rag-engines.workspaces.functions.delete-workspace-workflow.delete.index:lambda_handler"},{"doc":"","file":"lib/rag-engines/workspaces/functions/delete-document-workflow/delete/index.py","line":14,"params":["event","context"],"symbol":"lib.rag-engines.workspaces.functions.delete-document-workflow.delete.index:lambda_handler"}],"category":"risk","detail":"True now: DeleteWorkspace and DeleteDocument state machines have timeout 5 minutes, their Lambdas 15 minutes. Trigger: a deletion (large Kendra or OpenSearch workspace) that takes longer than 5 minutes and then fails. Reach: the execution ends TIMED_OUT, which the States.ALL catch on the task does not handle, so HandleError never sets status 'error' and the item stays 'deleting'; a deletion that eventually succeeds is not affected.","evidence":"Read lib/rag-engines/workspaces/delete-workspace.ts and delete-document.ts: lambda.Function timeout cdk.Duration.minutes(15), sfn.StateMachine timeout cdk.Duration.minutes(5), LambdaInvoke(...).addCatch(handleError, {errors: ['States.ALL']}). Not re-checkable from Python (the cause is in CDK).","id":"delete-workflow-timeout-shorter-than-lambda","severity":"low","symbols":["lib.rag-engines.workspaces.functions.delete-workspace-workflow.delete.index:lambda_handler","lib.rag-engines.workspaces.functions.delete-document-workflow.delete.index:lambda_handler"],"title":"Delete workflows time out after 5 minutes while their Lambda may run 15"},{"_locs":[{"doc":"","file":"lib/sagemaker-model/hf-custom-script-model/build-function/index.py","line":11,"params":["event","context"],"symbol":"lib.sagemaker-model.hf-custom-script-model.build-function.index:on_event"}],"category":"risk","check":{"kind":"text_in","pattern":"Invalid request type"},"detail":"True now: on_event handles only Create and Delete and raises 'Invalid request type' for Update. Trigger: a redeploy that changes the Build resource's properties (its ProjectName, e.g. when the CodeBuild project is replaced). Reach: the stack update fails for deployments that include a Hugging Face custom-script SageMaker model.","evidence":"Read build-function/index.py on_event: branches for RequestType 'Create' and 'Delete', then raise Exception('Invalid request type'); lib/sagemaker-model/hf-custom-script-model/index.ts passes properties {ProjectName: codeBuildProject.projectName}.","id":"hf-build-update-request-fails","severity":"low","symbols":["lib.sagemaker-model.hf-custom-script-model.build-function.index:on_event"],"title":"HF custom-script build custom resource fails on any Update"},{"_locs":[{"doc":"","file":"lib/shared/layers/python-sdk/python/genai_core/cross_encoder.py","line":12,"params":["model","input","passages"],"symbol":"lib.shared.layers.python-sdk.python.genai_core.cross_encoder:rank_passages"}],"category":"risk","check":{"kind":"text_in","pattern":"typesCommonError"},"detail":"True now: the fallback line is 'raise genai_core.typesCommonError(...)' (missing dot). Trigger: a crossEncoderModels config entry whose provider is not 'sagemaker'. Reach: the search fails with an AttributeError (shown as 'Something went wrong') instead of the intended 'Unknown provider' message.","evidence":"Read genai_core/cross_encoder.py rank_passages.","id":"cross-encoder-typo-exception","severity":"low","symbols":["lib.shared.layers.python-sdk.python.genai_core.cross_encoder:rank_passages"],"title":"rank_passages raises AttributeError instead of CommonError for a non-SageMaker provider"},{"_locs":[{"doc":"","file":"lib/shared/layers/python-sdk/python/genai_core/aurora/delete.py","line":24,"params":["workspace"],"symbol":"lib.shared.layers.python-sdk.python.genai_core.aurora.delete:delete_workspace"}],"category":"risk","check":{"kind":"text_in","pattern":"^(?![\\s\\S]*\\.commit\\()"},"detail":"Now: genai_core.aurora.delete:delete_workspace opens AuroraConnection(autocommit=False), executes DROP TABLE IF EXISTS and leaves the with-block; AuroraConnection.__exit__ only closes the cursor and connection, and closing a psycopg2 connection with an open transaction rolls it back (PostgreSQL DDL is transactional). create_workspace_table, by contrast, calls cursor.connection.commit(). Trigger: every deleteWorkspace on an aurora workspace. Reach: the workspace's whole pgvector table (all chunk texts and embeddings) stays in Aurora while S3 objects and every DynamoDB row are removed, so the data the user deleted is retained and storage grows with each deleted workspace; nothing in the app can reach that table any more.","evidence":"Read genai_core.aurora.delete:delete_workspace (no commit), genai_core.aurora.connection:AuroraConnection.__exit__ (close only, set_session(autocommit=False) in __enter__) and genai_core.aurora.create:create_workspace_table (explicit commit). Not run against a live database.","id":"aurora-drop-table-never-committed","severity":"medium","symbols":["lib.shared.layers.python-sdk.python.genai_core.aurora.delete:delete_workspace"],"title":"Deleting an Aurora workspace never commits its DROP TABLE, so the vector table stays"},{"_locs":[{"doc":"","file":"lib/shared/layers/python-sdk/python/genai_core/aurora/delete.py","line":133,"params":["document_id","table_name"],"symbol":"lib.shared.layers.python-sdk.python.genai_core.aurora.delete:deleteAuroraDocument"},{"doc":"","file":"lib/shared/layers/python-sdk/python/genai_core/aurora/delete.py","line":80,"params":["workspace_id","document"],"symbol":"lib.shared.layers.python-sdk.python.genai_core.aurora.delete:delete_aurora_document"}],"category":"risk","check":{"kind":"text_in","pattern":"except psycopg2\\.Error"},"detail":"Now: deleteAuroraDocument catches psycopg2.Error, logs it and returns normally; delete_aurora_document then deletes the Documents item and subtracts the vectors from the workspace. Trigger: any Postgres error during the DELETE (connection timeout, IAM token expiry, lock). Reach: that document's chunks stay in the workspace table and keep being returned by query_workspace_aurora to chat and semantic search, while the document no longer appears in the list and cannot be deleted again from the UI. The Step Functions DeleteDocument workflow sees success, so nothing retries.","evidence":"Read aurora/delete.py: deleteAuroraDocument wraps the DELETE in try/except psycopg2.Error with logger.error only; delete_aurora_document calls it and continues to documents_table.delete_item and the workspace counter update.","id":"aurora-document-delete-swallows-error","severity":"medium","symbols":["lib.shared.layers.python-sdk.python.genai_core.aurora.delete:deleteAuroraDocument","lib.shared.layers.python-sdk.python.genai_core.aurora.delete:delete_aurora_document"],"title":"A failed chunk delete in Aurora still removes the document record"},{"_locs":[{"doc":"Replace the last message. For example when it is blocked by guardrails","file":"lib/shared/layers/python-sdk/python/genai_core/langchain/chat_message_history.py","line":120,"params":["self","content"],"symbol":"lib.shared.layers.python-sdk.python.genai_core.langchain.chat_message_history:DynamoDBChatMessageHistory.replace_last_message"},{"doc":"","file":"lib/model-interfaces/langchain/functions/request-handler/adapters/base/base.py","line":537,"params":["self","prompt","workspace_id","images","documents","videos","user_groups","system_prompts","*args","**kwargs"],"symbol":"lib.model-interfaces.langchain.functions.request-handler.adapters.base.base:ModelAdapter.run"}],"category":"doc vs code","check":{"kind":"text_in","pattern":"(?s)\\A(?!.*messages\\[-1\\]).*"},"detail":"Now: when Bedrock Guardrails block the model's output, ModelAdapter.run calls chat_history.replace_last_message(blocked text) and returns the guardrail message to the user. replace_last_message reads the history and put_items it back unchanged — the content argument is only logged. Trigger: any output blocked by a configured guardrail (docs/documentation/security.md recommends enabling them). Reach: the blocked answer stays in SessionsTable, is shown again when the user reopens the session (getSession returns History) and is fed back to the model as chat_history on the next turn.","evidence":"Read chat_message_history.py:DynamoDBChatMessageHistory.replace_last_message (messages never modified; content used only in logger.info) and adapters/base/base.py:ModelAdapter.run (calls replace_last_message after apply_bedrock_guardrails returns a response). History is written by RunnableWithMessageHistory → add_message in run_with_chain_v2.","id":"guardrail-replace-is-noop","severity":"medium","symbols":["lib.shared.layers.python-sdk.python.genai_core.langchain.chat_message_history:DynamoDBChatMessageHistory.replace_last_message","lib.model-interfaces.langchain.functions.request-handler.adapters.base.base:ModelAdapter.run"],"title":"A guardrail-blocked answer is not replaced in the stored chat history"},{"_locs":[{"doc":"Append the message to the record in DynamoDB","file":"lib/shared/layers/python-sdk/python/genai_core/langchain/chat_message_history.py","line":63,"params":["self","message"],"symbol":"lib.shared.layers.python-sdk.python.genai_core.langchain.chat_message_history:DynamoDBChatMessageHistory.add_message"}],"category":"risk","check":{"kind":"text_in","pattern":"\"History\": messages"},"detail":"Now: add_message re-reads the History list, appends one message and put_items the entire item; a ClientError is logged and swallowed. Trigger: a long session whose History (with metadata such as retrieved documents) passes DynamoDB's 400 KB item limit. Reach: from then on no new message of that session is stored, while the user still sees answers stream in; reloading the session shows the history cut at the limit. Every turn also costs one full read and one full write of the growing item.","evidence":"Read chat_message_history.py:add_message (get_messages_from_storage → messages.append → table.put_item with 'History': messages; except ClientError: logger.exception).","id":"session-history-single-item","severity":"low","symbols":["lib.shared.layers.python-sdk.python.genai_core.langchain.chat_message_history:DynamoDBChatMessageHistory.add_message"],"title":"A whole conversation lives in one DynamoDB item and a failed save is silent"},{"_locs":[{"doc":"","file":"lib/shared/layers/python-sdk/python/genai_core/sessions.py","line":64,"params":["session_id","user_id"],"symbol":"lib.shared.layers.python-sdk.python.genai_core.sessions:delete_session"}],"category":"risk","check":{"kind":"text_in","pattern":"for item in session\\.get\\(\"History\"\\):"},"detail":"Now: sessions.delete_session iterates session.get('History'); when the item is missing, get_item returns {} and the loop gets None. Only ClientError is caught, so the TypeError reaches the API handler. Trigger: deleting the same session twice (two tabs) or a stale id. Reach: that one GraphQL call returns an error instead of deleted=false; nothing is corrupted.","evidence":"Read sessions.py:delete_session (for item in session.get(\"History\") with session defaulting to {}; except ClientError only).","id":"delete-missing-session-typeerror","severity":"low","symbols":["lib.shared.layers.python-sdk.python.genai_core.sessions:delete_session"],"title":"Deleting a session that does not exist raises a TypeError"},{"_locs":[{"doc":"","file":"lib/model-interfaces/langchain/functions/request-handler/index.py","line":209,"params":["event","context"],"symbol":"lib.model-interfaces.langchain.functions.request-handler.index:handler"}],"category":"risk","detail":"Now: lib/model-interfaces/langchain/index.ts adds a policy with actions bedrock:* on resources * to the RequestHandler role, on top of the narrower InvokeModel/ApplyGuardrail statement. This is the Lambda that processes users' prompts and model output. Trigger: a bug or a compromised dependency in that Lambda (it loads LangChain, OpenAI and provider SDKs). Reach: every Bedrock resource in the account and region — it could delete knowledge bases, agents or guardrails, or create provisioned throughput billed to the account. The code only needs invoke, retrieve, agent-invoke and guardrail calls.","evidence":"Read lib/model-interfaces/langchain/index.ts: requestHandler.addToRolePolicy(new iam.PolicyStatement({ actions: [\"bedrock:*\", \"bedrock:InvokeModelWithResponseStream\"], resources: [\"*\"] })). The Python handlers under adapters/ call invoke/converse, retrieve, invoke_agent and apply_guardrail only.","id":"langchain-handler-bedrock-star","severity":"medium","symbols":["lib.model-interfaces.langchain.functions.request-handler.index:handler"],"title":"The LangChain request handler may call every Bedrock API on every resource"},{"_locs":[{"doc":"","file":"lib/model-interfaces/langchain/functions/request-handler/index.py","line":209,"params":["event","context"],"symbol":"lib.model-interfaces.langchain.functions.request-handler.index:handler"},{"doc":"","file":"lib/model-interfaces/idefics/functions/request-handler/index.py","line":206,"params":["event","context"],"symbol":"lib.model-interfaces.idefics.functions.request-handler.index:handler"}],"category":"risk","detail":"Now: the LangChain handler (and the Idefics one) process the SQS batch with BatchProcessor and return processor.response() (batchItemFailures), but their SqsEventSource is created without reportBatchItemFailures, so Lambda ignores that list and deletes the whole batch; a failed record is answered with an error message to the user and dropped. The DLQ (maxReceiveCount 3) only receives messages when the whole invocation times out or crashes — and then the batch's successful records are re-run too, calling the model again and appending to their history a second time. Bedrock Agents sets reportBatchItemFailures: true. Trigger: a Lambda timeout (15 min) or crash with more than one message in the batch. Reach: duplicate answers and duplicate history entries for the other sessions in that batch.","evidence":"Read langchain/functions/request-handler/index.py:handler (BatchProcessor, returns processor.response()) and lib/model-interfaces/langchain/index.ts and idefics/index.ts (new SqsEventSource(queue) with no options) versus bedrock-agents/index.ts (reportBatchItemFailures: true); LangChainIngestionQueue has a DLQ with maxReceiveCount 3.","id":"sqs-partial-failure-not-wired","severity":"low","symbols":["lib.model-interfaces.langchain.functions.request-handler.index:handler","lib.model-interfaces.idefics.functions.request-handler.index:handler"],"title":"The LangChain and Idefics handlers return per-record failures that SQS never reads"},{"_locs":[{"doc":"","file":"lib/shared/layers/python-sdk/python/genai_core/websites/crawler.py","line":108,"params":["url","content_types_supported"],"symbol":"lib.shared.layers.python-sdk.python.genai_core.websites.crawler:parse_url"}],"category":"risk","check":{"kind":"text_in","pattern":"requests\\.get\\(url, headers=headers, timeout=20\\)"},"detail":"True now: add_website rejects IP literals and hosts resolving to private ranges, but parse_url and extract_urls_from_sitemap fetch every followed link, sitemap entry and HTTP redirect with requests.get and no such check. Trigger: an admin or workspace_manager adds a sitemap that lists internal hosts, or a public page that redirects to one. Reach: the fetched internal content is chunked into the workspace and becomes answerable in chat by anyone using that workspace.","evidence":"Read documents:add_website (_is_ip_address, _is_hostname_internal), crawler:parse_url (requests.get(url, headers=headers, timeout=20), links filtered only by netloc) and websites.sitemap:extract_urls_from_sitemap; grep for is_private in genai_core/websites found nothing.","id":"crawler-no-private-check","severity":"medium","symbols":["lib.shared.layers.python-sdk.python.genai_core.websites.crawler:parse_url"],"title":"Only the start URL of a website crawl is checked for private addresses"},{"_locs":[{"doc":"","file":"lib/chatbot-api/functions/resolvers/send-query-lambda-resolver/index.py","line":73,"params":["event","context"],"symbol":"lib.chatbot-api.functions.resolvers.send-query-lambda-resolver.index:handler"}],"category":"risk","check":{"kind":"text_in","pattern":"InputValidation\\(\\*\\*message\\)\\s+logger\\.info"},"detail":"True now: the resolver calls InputValidation(**message) before the try; a pydantic ValidationError there propagates as-is (with input values) instead of the trimmed 'Invalid request' ValueError built in the except clause. Trigger: any sendQuery with a field outside its pattern, e.g. a sessionId containing '/'. Reach: the caller sees the raw pydantic message about their own input; nothing else is exposed.","evidence":"Read send-query-lambda-resolver/index.py handler: 'InputValidation(**message)' appears before logger.info and again inside try/except ValidationError.","id":"sendquery-raw-validation-error","severity":"low","symbols":["lib.chatbot-api.functions.resolvers.send-query-lambda-resolver.index:handler"],"title":"sendQuery validates once outside its try block, so the sanitised error is never used"},{"_locs":[{"doc":"Append the message to the record in DynamoDB","file":"lib/shared/layers/python-sdk/python/genai_core/langchain/chat_message_history.py","line":63,"params":["self","message"],"symbol":"lib.shared.layers.python-sdk.python.genai_core.langchain.chat_message_history:DynamoDBChatMessageHistory.add_message"}],"category":"risk","check":{"kind":"text_in","pattern":"\"StartTime\": datetime\\.now\\(\\)\\.isoformat\\(\\),"},"detail":"True now: DynamoDBChatMessageHistory.add_message writes StartTime = now on each put_item, while add_metadata keeps the stored value. Trigger: any second message in a session. Reach: StartTime holds the last-message time, so anything that sorts or shows sessions by StartTime shows last activity, not start.","evidence":"Read chat_message_history.py add_message and add_metadata.","id":"session-starttime-overwritten","severity":"low","symbols":["lib.shared.layers.python-sdk.python.genai_core.langchain.chat_message_history:DynamoDBChatMessageHistory.add_message"],"title":"Session StartTime is rewritten on every message"},{"_locs":[{"doc":"","file":"lib/shared/layers/python-sdk/python/genai_core/websites/crawler.py","line":108,"params":["url","content_types_supported"],"symbol":"lib.shared.layers.python-sdk.python.genai_core.websites.crawler:parse_url"},{"doc":"Gets next 10 pending posts and sends them to be website crawled","file":"lib/shared/layers/python-sdk/python/genai_core/documents.py","line":746,"params":[],"symbol":"lib.shared.layers.python-sdk.python.genai_core.documents:batch_crawl_websites"},{"doc":"","file":"lib/chatbot-api/functions/api-handler/routes/documents.py","line":383,"params":["input"],"symbol":"lib.chatbot-api.functions.api-handler.routes.documents:add_rss_feed"}],"category":"risk","check":{"kind":"text_in","pattern":"^(?![\\s\\S]*is_private)"},"detail":"Now: add_website and add_rss_feed reject an address that is an IP or resolves to a private IP (_is_ip_address, _is_hostname_internal). Post links found inside a feed go check_rss_feed_for_posts → batch_crawl_websites → create_document → WebCrawlerJob, and parse_url fetches them with requests.get with no such check. Trigger: an allowed public feed (whose content a third party controls) lists a link to a private or link-local address. Reach: the crawler, running in the VPC, fetches that address and stores the response text as chunks in the workspace, where chat users can retrieve it.","evidence":"Read routes.documents:add_rss_feed / add_website and _is_hostname_internal, genai_core.documents:check_rss_feed_for_posts and batch_crawl_websites, genai_core.websites.crawler:parse_url; grep for is_private / _is_hostname_internal finds them only in routes/documents.py.","id":"rss-post-links-bypass-internal-host-check","severity":"medium","symbols":["lib.shared.layers.python-sdk.python.ge ing (ClientError is logged, not raised)","stores":"DynamoDB SessionsTable: SessionId, UserId, StartTime, History[]","symbol":"lib.shared.layers.python-sdk.python.genai_core.langchain.chat_message_history:DynamoDBChatMessageHistory.add_message"},{"action":"While the model streams, each token is published with an increasing sequenceNumber so the outgoing handler can order a batch (skipped when streaming is disabled, e.g. guardrails via ApplyGuardrail)","doc":"","file":"lib/model-interfaces/langchain/functions/request-handler/index.py","line":27,"params":["user_id","session_id","self","token","run_id","chunk","parent_run_id","*args","**kwargs"],"payload":"{\"type\": \"text\", \"action\": \"llm_new_token\", \"userId\": \"4f1c2a90-…\", \"data\": {\"sessionId\": \"sess-1042\",\n \"token\": {\"runId\": \"b7e1…\", \"sequenceNumber\": 7, \"value\": \" within 30\"}}}\n\n\n","receives":"token (string or list of content parts), run_id","returns":"nothing","stores":"SNS MessagesTopic: action 'llm_new_token'","symbol":"lib.model-interfaces.langchain.functions.request-handler.index:on_llm_new_token"},{"action":"Stamps direction OUT and publishes the JSON (bytes → base64, Decimal → float) to MESSAGES_TOPIC_ARN. From here the reply leaves Python: SNS MessagesTopic (filter direction OUT) → SQS OutgoingMessagesQueue → Node.js Lambda outgoing-message-handler (lib/chatbot-api/functions/outgoing-message-appsync/index.ts), which sorts each batch by token sequenceNumber and calls the AppSync publishResponse(sessionId, userId, data) mutation; the browser's receiveMessages(sessionId) subscription (@aws_subscribe on publishResponse) delivers it","doc":"","file":"lib/shared/layers/python-sdk/python/genai_core/utils/websocket.py","line":25,"note":"The Node handler also tries to drop metadata for non-admin final responses, but it deletes a property of the still-serialised Message string, so it has no effect; the trimming that actually happens is in run_with_chain_v2 (Python).","params":["detail","topic_arn"],"receives":"detail dict (llm_new_token / final_response / error / heartbeat)","returns":"nothing","stores":"SNS MessagesTopic","symbol":"lib.shared.layers.python-sdk.python.genai_core.utils.websocket:send_to_client"}],"summary":"The sendQuery resolver Lambda checks the caller's Cognito groups against the chosen application, validates the request and publishes it to the SNS MessagesTopic; SNS fans it out by modelInterface to the LangChain RequestHandler, which picks a model adapter, optionally retrieves workspace passages, calls the model and saves the turn in the DynamoDB SessionsTable. Tokens and the final answer go back out through the same topic (direction OUT) to the Node.js outgoing-message handler, which calls the publishResponse mutation that the browser's receiveMessages subscription is listening to.","title":"Send a chat message and get the answer back","trigger":"AppSync mutation sendQuery (Cognito user pool auth)"},{"actor":"admin or workspace_manager · React workspace UI","id":"upload-document","steps":[{"action":"Validates fileName (safe characters, ≤500), requires admin or workspace_manager when a workspaceId is given and checks the extension against allowed_workspace_extensions; without a workspaceId it issues a per-user upload URL for chat attachments instead","actor":"AppSync ChatbotApi → Lambda GraphQLApiHandler (proxyResolverFunction)","doc":"","file":"lib/chatbot-api/functions/api-handler/routes/documents.py","line":165,"params":["input"],"payload":"{\"workspaceId\": \"ws-7f3a\", \"fileName\": \"refund-policy.pdf\"}\n\n\n","receives":"input {workspaceId, fileName}","returns":"Presigned POST {url, fields}","stores":"nothing","symbol":"lib.chatbot-api.functions.api-handler.routes.documents:file_upload"},{"action":"Checks the workspace exists, strips any directory from the file name, and signs a POST (SigV4, 1 hour, content-length 0–10 MB) for key '<workspaceId>/<basename>' in UPLOAD_BUCKET_NAME using the S3 Transfer Acceleration host","doc":"","file":"lib/shared/layers/python-sdk/python/genai_core/presign.py","line":23,"params":["workspace_id","file_name","expiration"],"receives":"workspace_id, file_name","returns":"{url: 'https://<bucket>.s3-accelerate.amazonaws.com', fields: {...}}","stores":"nothing — the browser then uploads straight to S3 UploadBucket","symbol":"lib.shared.layers.python-sdk.python.genai_core.presign:generate_workspace_presigned_post"},{"action":"For each SQS record, unpacks the S3 event records and processes each one","actor":"S3 UploadBucket event notification → SQS IngestionQueue (maxReceiveCount 3, then IngestionDeadLetterQueue) → Lambda UploadHandler","doc":"","file":"lib/rag-engines/data-import/functions/upload-handler/index.py","line":27,"params":["event","context"],"receives":"SQS event whose body is an S3 event notification","returns":"nothing; an exception fails the whole batch back to SQS","stores":"nothing itself","symbol":"lib.rag-engines.data-import.functions.upload-handler.index:lambda_handler"},{"action":"Keeps only ObjectCreated* records (deletes and other events are skipped)","doc":"","file":"lib/rag-engines/data-import/functions/upload-handler/index.py","line":115,"params":["record"],"payload":"{\"eventName\": \"ObjectCreated:Post\", \"s3\": {\"bucket\": {\"name\": \"upload-bucket\"},\n \"object\": {\"key\": \"ws-7f3a/refund-policy.pdf\", \"size\": 48213}}}\n\n\n","receives":"SQS record body {Records: [...]}","returns":"List of S3 records","stores":"nothing","symbol":"lib.rag-engines.data-import.functions.upload-handler.index:get_records_from_sqs_record"},{"action":"Takes the workspace id from the first key segment, creates (or resets) the document, then branches on engine: Kendra → copies the file and a .metadata.json into the Kendra data bucket and marks it processed; Aurora/OpenSearch → starts the FileImport state machine","doc":"","file":"lib/rag-engines/data-import/functions/upload-handler/index.py","line":35,"params":["record"],"payload":"{\"workspace_id\": \"ws-7f3a\", \"document_id\": \"d-91c2\", \"input_bucket_name\": \"upload-bucket\",\n \"input_object_key\": \"ws-7f3a/refund-policy.pdf\", \"processing_bucket_name\": \"processing-bucket\",\n \"processing_object_key\": \"ws-7f3a/d-91c2/content.txt\"}\n\n\n","receives":"One S3 record","returns":"nothing","stores":"Step Functions FileImportStateMachine execution (env FILE_IMPORT_WORKFLOW_ARN) with input below","symbol":"lib.rag-engines.data-import.functions.upload-handler.index:process_record"},{"action":"Files are unique by path: if 'file/<path>' already exists in the workspace the document is reset (status submitted, vectors 0) and keeps its id; otherwise a new document_id is created. The workspace counters (size_in_bytes, documents, vectors) are adjusted atomically with ADD. For type 'file' the content-upload and _process_document helpers do nothing — the upload handler drives processing","doc":"","file":"lib/shared/layers/python-sdk/python/genai_core/documents.py","line":259,"params":["workspace_id","document_type","document_sub_type","title","path","size_in_bytes","sub_documents","content","content_complement","**kwargs"],"receives":"workspace_id, document_type 'file', path/title = file name, size_in_bytes","returns":"{workspace_id, document_id}","stores":"DynamoDB Documents (new or reset item) and Workspaces (counters)","symbol":"lib.shared.layers.python-sdk.python.genai_core.documents:create_document"},{"action":"Re-reads workspace and document, extracts text (.txt read directly; everything else through LangChain S3FileLoader / unstructured), copies the text to the processing bucket and adds chunks. Any exception sets the document status to 'error' and re-raises so the job fails; on success the state machine's SetProcessed step sets 'processed'","actor":"Step Functions FileImportStateMachine: SetProcessing (DynamoDB status 'processing') → Batch job FileImportJob (python main.py with WORKSPACE_ID, DOCUMENT_ID, INPUT_*/PROCESSING_* env)","doc":"","file":"lib/shared/file-import-batch-job/main.py","line":20,"params":[],"receives":"Environment variables from the state machine input","returns":"exit status","stores":"S3 ProcessingBucket '<ws>/<doc>/content.txt'; status in DynamoDB Documents","symbol":"lib.shared.file-import-batch-job.main:main"},{"action":"Splits the text with RecursiveCharacterTextSplitter using the workspace's chunk_size and chunk_overlap (only the 'recursive' strategy exists) and replaces NUL characters","doc":"","file":"lib/shared/layers/python-sdk/python/genai_core/chunks.py","line":88,"params":["workspace","content"],"payload":"[\"Refunds are accepted within 30 days of delivery…\", \"…of delivery. Items must be unused and in original packaging…\"]\n\n\n","receives":"workspace, content text","returns":"List of chunk strings","stores":"nothing","symbol":"lib.shared.layers.python-sdk.python.genai_core.chunks:split_content"},{"action":"Embeds all chunks with the workspace's embeddings model (Task store), gives each a uuid, writes each chunk to S3, then hands them to the engine-specific writer and updates the document's vector count","doc":"","file":"lib/shared/layers/python-sdk/python/genai_core/chunks.py","line":16,"params":["replace","workspace","document","document_sub_id","chunks","chunk_complements","path"],"receives":"workspace, document, chunks, replace=True","returns":"nothing","stores":"S3 ProcessingBucket '<ws>/<doc>/chunks/<chunk_id>.txt'; DynamoDB Documents.vectors (set_document_vectors)","symbol":"lib.shared.layers.python-sdk.python.genai_core.chunks:add_chunks"},{"action":"Cuts any input longer than the model's character limit (≤10,000 chars) into pieces, calls the provider in batches of 50 (OpenAI, Bedrock Titan/Cohere, or the SageMaker RAG endpoint) and averages the vectors of pieces that came from one input","doc":"","file":"lib/shared/layers/python-sdk/python/genai_core/embeddings.py","line":38,"params":["model","input","task","batch_size"],"receives":"EmbeddingsModel, list of texts, ter.run_with_chain_v2 (history-aware retriever)","doc":"","file":"lib/shared/layers/python-sdk/python/genai_core/langchain/workspace_retriever.py","line":17,"params":["self","query","run_manager"],"payload":"{\"page_content\": \"Refunds are accepted within 30 days of delivery…\",\n \"metadata\": {\"chunk_id\": \"c-55a1\", \"workspace_id\": \"ws-7f3a\", \"document_id\": \"d-91c2\",\n  \"path\": \"refund-policy.pdf\", \"title\": \"refund-policy.pdf\", \"score\": 0.82}}\n\n\n","receives":"query: the stand-alone question","returns":"List[Document] with metadata chunk_id, document_id, path, title, score","stores":"self.documents_found (read later by get_last_search_documents)","symbol":"lib.shared.layers.python-sdk.python.genai_core.langchain.workspace_retriever:WorkspaceRetriever._get_relevant_documents"},{"action":"Loads the workspace, refuses one that is missing or not 'ready', and dispatches on workspace.engine to aurora / opensearch / kendra / bedrock_kb","doc":"","file":"lib/shared/layers/python-sdk/python/genai_core/semantic_search.py","line":10,"params":["workspace_id","query","limit","full_response"],"receives":"workspace_id, query, limit, full_response=False","returns":"{engine, items[...]} (full_response adds the separate vector and keyword lists, used by the semantic-search page)","stores":"nothing","symbol":"lib.shared.layers.python-sdk.python.genai_core.semantic_search:semantic_search"},{"action":"Reads the workspace item: engine, embeddings model, metric, hybrid_search, languages, cross-encoder, chunking settings","doc":"","file":"lib/shared/layers/python-sdk/python/genai_core/workspaces.py","line":68,"params":["workspace_id"],"receives":"workspace_id","returns":"Workspace dict or None","stores":"nothing (DynamoDB Workspaces)","symbol":"lib.shared.layers.python-sdk.python.genai_core.workspaces:get_workspace"},{"action":"Embeds the question (Task retrieve), detects its language with Comprehend, runs a pgvector nearest-neighbour query (operator chosen by the workspace metric: cosine <=>, l2 <->, inner <#>) and, with hybrid search, a Postgres full-text query in that language; merges hits by chunk_id, re-ranks with the cross-encoder when one is configured and keeps those scoring above the threshold, then tops the list up from the vector scores","doc":"","file":"lib/shared/layers/python-sdk/python/genai_core/aurora/query.py","line":15,"params":["workspace_id","workspace","query","limit","full_response","threshold"],"payload":"{\"engine\": \"aurora\", \"query_language\": \"english\", \"items\": [{\"chunk_id\": \"c-55a1\", \"document_id\": \"d-91c2\",\n \"content\": \"Refunds are accepted within 30 days…\", \"sources\": [\"keyword_search\", \"vector_search\"],\n \"vector_search_score\": 0.18, \"keyword_search_score\": 0.4, \"score\": 0.82}]}\n\n\n","receives":"workspace, query, limit 3","returns":"{engine: 'aurora', query_language, items[...]}","stores":"nothing (reads the workspace's Aurora table)","symbol":"lib.shared.layers.python-sdk.python.genai_core.aurora.query:query_workspace_aurora"},{"action":"Embeds the single question with the same model the workspace was indexed with (Cohere models get the search_query input type for retrieval)","doc":"","file":"lib/shared/layers/python-sdk/python/genai_core/embeddings.py","line":38,"params":["model","input","task","batch_size"],"receives":"[query], task 'retrieve'","returns":"[[float, …]]","stores":"nothing","symbol":"lib.shared.layers.python-sdk.python.genai_core.embeddings:generate_embeddings"},{"action":"Picks the Postgres text-search language for the keyword query from the workspace's languages and Comprehend's detection","doc":"","file":"lib/shared/layers/python-sdk/python/genai_core/utils/comprehend.py","line":43,"params":["query","languages"],"receives":"query, workspace languages","returns":"(language_name, detected_languages)","stores":"nothing","symbol":"lib.shared.layers.python-sdk.python.genai_core.utils.comprehend:get_query_language"},{"action":"Truncates the query and each passage to 10,000 characters (at most 1,000 passages) and scores every passage against the query on the SageMaker RAG models endpoint","doc":"","file":"lib/shared/layers/python-sdk/python/genai_core/cross_encoder.py","line":12,"params":["model","input","passages"],"receives":"cross-encoder model, query, passages[]","returns":"One relevance score per passage","stores":"nothing","symbol":"lib.shared.layers.python-sdk.python.genai_core.cross_encoder:rank_passages"},{"action":"Same shape as the Aurora path against the workspace's OpenSearch Serverless index: vector_query (k-NN, l2) plus keyword_query when hybrid search is on, merge by chunk_id, optional cross-encoder re-rank, top-up without repeating chunks already chosen","doc":"","file":"lib/shared/layers/python-sdk/python/genai_core/opensearch/query.py","line":11,"params":["workspace_id","workspace","query","limit","full_response","threshold"],"receives":"workspace, query, limit","returns":"{engine: 'opensearch', items[...]}","stores":"nothing","symbol":"lib.shared.layers.python-sdk.python.genai_core.opensearch.query:query_workspace_open_search"},{"action":"Calls Kendra Retrieve (page size 1–100); unless the index is external or 'use all data' is set, filters to documents whose workspace_id attribute matches","doc":"","file":"lib/shared/layers/python-sdk/python/genai_core/kendra/query.py","line":10,"params":["workspace_id","workspace","query","limit","full_response"],"receives":"workspace (kendra_index_id), query, limit","returns":"{engine: 'kendra', items[...]}","stores":"nothing","symbol":"lib.shared.layers.python-sdk.python.genai_core.kendra.query:query_workspace_kendra"},{"action":"Calls the Bedrock Knowledge Base Retrieve API with HYBRID or SEMANTIC search depending on the workspace's hybrid_search flag","doc":"","file":"lib/shared/layers/python-sdk/python/genai_core/bedrock_kb/query.py","line":9,"params":["workspace_id","workspace","query","limit","full_response"],"receives":"workspace (knowledge_base_id), query, limit","returns":"{engine: 'bedrock_kb', items[...]}","stores":"nothing","symbol":"lib.shared.layers.python-sdk.python.genai_core.bedrock_kb.query:query_workspace_bedrock_kb"}],"summary":"The retriever asks semantic_search for the top 3 passages; it loads the workspace from DynamoDB and dispatches to the engine. For Aurora and OpenSearch the question is embedded, a vector search (and, with hybrid search on, a keyword search) returns up to 25 candidates each, duplicates are merged and an optional SageMaker cross-encoder re-ranks them; Kendra and Bedrock Knowledge Bases call their managed retrieve APIs. The passages become LangChain Documents stuffed into the QA prompt.","title":"Retrieve workspace passages for a question","trigger":"WorkspaceRetriever._get_relevant_documents, called by the history-aware retriever in run_with_chain_v2"},{"actor":"workspace manager · React UI","id":"create-workspace","steps":[{"action":"Receives the AppSync resolver event and dispatches it by fieldName to the router that registered the resolver; turns a pydantic ValidationError into 'Invalid request', passes CommonError through, and hides any other exception behind 'Something went wrong'","actor":"AppSync ChatbotApi (data source proxyResolverFunction)","doc":"","file":"lib/chatbot-api/functions/api-handler/index.py","line":53,"params":["event","context"],"payload":"{\"info\": {\"fieldName\": \"createAuroraWorkspace\"}, \"arguments\": {\"input\": {\"kind\": \"aurora\", \"name\": \"product-docs\", \"embeddingsModelProvider\": \"bedrock\", \"embeddingsModelName\": \"amazon.titan-embed-text-v2:0\", \"languages\": [\"english\"], \"metric\": \"cosine\", \"index\": true, \"hybridSearch\": true, \"chunkingStrategy\": \"recursive\", \"chunkSize\": 1000, \"chunkOverlap\": 200}}}\n\n\n","receives":"AppSync event: info.fieldName, arguments.input, identity (Cognito claims)","returns":"whatever the resolver returns, serialised by AppSync","stores":"nothing","symbol":"lib.chatbot-api.functions.api-handler.index:handler"},{"action":"Decorator on the resolver: reads the caller's Cognito groups and lets the call through only for admin or workspace_manager","doc":"Validates the user calling the endpoint has a user role set that is approved for the endpoint Args: roles (list): list of roles that are approved for the endpoint Valid Roles: - `ADMIN_ROLE` = `chatbot_admin` - `WORKSPACES_MANAGER_ROLE` = `chatbot_workspace_manager` - `CHATBOT_USER_ROLE` = `chatbot…","file":"lib/shared/layers/python-sdk/python/genai_core/auth.py","line":53,"note":"An unauthorised caller gets a normal-looking result object, not a GraphQL error.","params":["self","roles"],"receives":"the router's current event (identity groups)","returns":"the resolver's result, or {\"error\": \"Unauthorized\"} for any other role","stores":"nothing","symbol":"lib.shared.layers.python-sdk.python.genai_core.auth:UserPermissions.approved_roles"},{"action":"Parses input into CreateWorkspaceAuroraRequest (name pattern, chunkSize > 100 …) and loads the deployment config from the SSM Config parameter","doc":"","file":"lib/chatbot-api/functions/api-handler/routes/workspaces.py","line":123,"note":"createOpenSearchWorkspace (create_open_search_workspace) is the same path with CreateWorkspaceOpenSearchRequest and no metric/index choice.","params":["input"],"receives":"input dict from the GraphQL arguments","returns":"the converted workspace (id, name, engine, status submitted …)","stores":"nothing itself","symbol":"lib.chatbot-api.functions.api-handler.routes.workspaces:create_aurora_workspace"},{"action":"Looks the chosen embeddings and cross-encoder models up in config rag.embeddingsModels / rag.crossEncoderModels, takes the vector dimensions from the config entry, and rejects bad languages (1–3), metric (inner/cosine/l2), chunking strategy, chunk size (100–10000) or overlap","doc":"","file":"lib/chatbot-api/functions/api-handler/routes/workspaces.py","line":170,"params":["request","config"],"payload": , \"Count\": 1}\n\n\n","receives":"nothing","returns":"nothing","stores":"nothing","symbol":"lib.shared.layers.python-sdk.python.genai_core.documents:ingest_rss_feeds"},{"action":"lambda invoke with InvocationType Event (fire-and-forget) on the function named in RSS_FEED_INGESTOR_FUNCTION (Lambda RssIngestor, allowed by grantInvoke); an exception is logged and swallowed so one feed cannot stop the others","doc":"","file":"lib/shared/layers/python-sdk/python/genai_core/documents.py","line":644,"params":["workspace_id","document_id"],"payload":"{\"workspace_id\": \"3f2a9c1e-7b44-4d1a-9e0c-5a1b2c3d4e5f\", \"document_id\": \"9d8c7b6a-1111-2222-3333-444455556666\"}\n\n\n","receives":"workspace_id, document_id","returns":"nothing","stores":"nothing","symbol":"lib.shared.layers.python-sdk.python.genai_core.documents:_trigger_rss_feed_ingestor"},{"action":"Reads workspace_id and document_id from the event and calls check_rss_feed_for_posts","actor":"Lambda RssIngestor (async invoke)","doc":"","file":"lib/rag-engines/data-import/functions/rss-ingestor/index.py","line":11,"params":["event","context"],"receives":"{workspace_id, document_id}","returns":"nothing","stores":"nothing itself","symbol":"lib.rag-engines.data-import.functions.rss-ingestor.index:lambda_handler"},{"action":"Loads the workspace and the rssfeed document, parses the feed URL with feedparser, and puts one rsspost item per entry with document_id = sha256 of the entry link and a conditional put (attribute_not_exists) so posts already seen are skipped; finally stamps rss_last_checked on the feed","doc":"","file":"lib/shared/layers/python-sdk/python/genai_core/documents.py","line":687,"note":"The hash id makes a post idempotent per workspace: the same link is stored once however many times the feed lists it.","params":["workspace_id","document_id"],"payload":"{\"workspace_id\": \"3f2a9c1e-7b44-4d1a-9e0c-5a1b2c3d4e5f\", \"document_id\": \"b94d27b9934d3e08a52e52d7da7dabfac484efe37a5380ee9088f7ace2efcde9\", \"rss_f d.layers.python-sdk.python.genai_core.documents:batch_crawl_websites"},{"action":"For document_type website it looks for an existing row with compound_sort_key website/<url> (by compound-key index): if found it resets it to submitted with 0 vectors, otherwise it puts a new uuid4 document; it then adjusts the workspace counters and, for a non-Kendra engine, calls _process_document","doc":"","file":"lib/shared/layers/python-sdk/python/genai_core/documents.py","line":259,"params":["workspace_id","document_type","document_sub_type","title","path","size_in_bytes","sub_documents","content","content_complement","**kwargs"],"payload":"{\"workspace_id\": \"3f2a9c1e-7b44-4d1a-9e0c-5a1b2c3d4e5f\", \"document_id\": \"c0ffee00-aaaa-bbbb-cccc-0123456789ab\", \"document_type\": \"website\", \"compound_sort_key\": \"website/https://blog.example.com/release-4-2\", \"status\": \"submitted\"}\n\n\n","receives":"workspace_id, 'website', path=<post link>, crawler_properties","returns":"{workspace_id, document_id}","stores":"DynamoDB Documents: website item, status submitted; DynamoDB Workspaces: ADD documents/size_in_bytes/vectors","symbol":"lib.shared.layers.python-sdk.python.genai_core.documents:create_document"},{"action":"For a website: builds a priority queue from the URL (or the sitemap's URLs), writes iteration 1 of the crawl state as JSON to the processing bucket, and starts the WebsiteCrawling state machine with the bucket and key","doc":"","file":"lib/shared/layers/python-sdk/python/genai_core/documents.py","line":482,"note":"Step Functions WebsiteCrawling: SetProcessing (status processing) → batch:submitJob.sync on Batch job WebCrawlerJob with WORKSPACE_ID, DOCUMENT_ID, INPUT_BUCKET_NAME, INPUT_OBJECT_KEY as container environment → SetProcessed, or HandleError (status error) on any failure.","params":["workspace","document","content","content_complement","**kwargs"],"payload":"{\"workspace_id\": \"3f2a9c1e-7b44-4d1a-9e0c-5a1b2c3d4e5f\", \"document_id\": \"c0ffee00-aaaa-bbbb-cccc-0123456789ab\", \"bucket_name\": \"processing-bucket-example\", \"object_key\": \"3f2a9c1e-7b44-4d1a-9e0c-5a1b2c3d4e5f/c0ffee00-aaaa-bbbb-cccc-0123456789ab/crawler/5e6f7a8b-0000-1111-2222-333344445555/1.json\"}\n\n\n","receives":"workspace item, document item, crawler_properties","returns":"nothing","stores":"S3 ProcessingBucket: <workspace_id>/<document_id>/crawler/<crawler_job_id>/1.json; starts Step Functions WebsiteCrawling","symbol":"lib.shared.layers.python-sdk.python.genai_core.documents:_process_document"},{"action":"Reads the crawl-state JSON named by INPUT_BUCKET_NAME / INPUT_OBJECT_KEY and passes workspace, document, queue, limit and content types to crawl_urls","actor":"Batch job WebCrawlerJob (container started by Step Functions WebsiteCrawling)","doc":"","file":"lib/shared/web-crawler-batch-job/index.py","line":14,"params":[],"receives":"environment variables + the S3 JSON object","returns":"crawl_urls' result, which the script discards","stores":"nothing itself","symbol":"lib.shared.web-crawler-batch-job.index:main"},{"action":"Pops the lowest-priority-number URL until the queue is empty or limit URLs are done; for each it parses the page, stores its text, splits it with the workspace's chunking settings and adds the chunks; with follow_links it queues same-host links at priority + 1; every 20 URLs it records sub_documents","doc":"","file":"lib/shared/layers/python-sdk/python/genai_core/websites/crawler.py","line":19,"note":"A URL that fails to fetch or parse is printed and skipped; it still counts toward the limit.","params":["workspace","document","priority_queue","processed_urls","follow_links","limit","content_types"],"receives":"workspace, document, priority_queue, processed_urls, follow_links, limit, content_types","returns":"the remaining crawl state (not persisted)","stores":"DynamoDB Documents: sub_documents count (set_sub_documents)","symbol":"lib.shared.layers.python-sdk.python.genai_core.websites.crawler:crawl_urls"},{"action":"requests.get with a browser User-Agent and a 20 s timeout; extracts text and <a href> links from HTML or text and annotation links from PDF (pdfplumber), only for content types the workspace allowed; splits links into same-host and external","doc":"","file":"lib/shared/layers/python-sdk/python/genai_core/websites/crawler.py","line":108,"params":["url","content_types_supported"],"receives":"url, content_types","returns":"(content, local_links, external_links); raises on an unsupported content type","stores":"nothing","symbol":"lib.shared.layers.python-sdk.python.genai_core.websites.crawler:parse_url"},{"action":"Keeps the URL and the extracted page text next to the document","doc":"","file":"lib/shared/layers/python-sdk/python/genai_core/websites/crawler.py","line":172,"params":["workspace_id","document_id","document_sub_id","path","content"],"receives":"workspace_id, document_id, document_sub_id (one uuid4 per page), path, content","returns":"nothing","stores":"S3 ProcessingBucket: <workspace_id>/<document_id>/<document_sub_id>/path.txt and content.txt","symbol":"lib.shared.layers.python-sdk.python.genai_core.websites.crawler:_store_content_on_s3"},{"action":"Embeds the chunks with the workspace's embeddings model (generate_embeddings, Task.STORE), saves each chunk text to S3, writes the vectors into the engine (add_chunks_aurora or add_chunks_open_search, replace=False) and adds the vector count to the document","doc":"","file":"lib/shared/layers/python-sdk/python/genai_core/chunks.py","line":16,"note":"When the Batch job finishes, Step Functions SetProcessed marks the website document processed.","params":["replace","workspace","document","document_sub_id","chunks","chunk_complements","path"],"payload":"{\"chunks\": [\"Version 4.2 adds offline mode and fixes the sync bug ...\"], \"embedding_dimensions\": 1024, \"chunk_ids\": [\"0b1c2d3e-4f50-6172-8394-a5b6c7d8e9f0\"]}\n\n\n","receives":"workspace, document, document_sub_id, chunks (list of strings), path=<page url>","returns":"nothing","stores":"S3 ProcessingBucket: .../<document_sub_id>/chunks/<chunk_id>.txt; Aurora table <workspace id> or OpenSearch index rows; DynamoDB Documents vectors (set_document_vectors)","symbol":"lib.shared.layers.python-sdk.python.genai_core.chunks:add_chunks"}],"summary":"Every 15 minutes each enabled RSS feed is fetched and every new post link becomes a pending rsspost row. Every 5 minutes up to 10 pending posts are turned into website documents, each crawled by the WebCrawlerJob Batch job, which stores page text in S3, embeds the chunks and writes them into the workspace's Aurora table or OpenSearch index.","title":"Scheduled RSS ingestion: feed → posts → website crawl → vectors","trigger":"EventBridge rules triggerRssIngestorsFunctionSchedule (every 15 min) and CrawlQueuedRssPostsScheduleRule (every 5 min)"},{"actor":"workspace manager · React UI","id":"delete-workspace","steps":[{"action":"Dispatches fieldName deleteWorkspace to the workspaces router","actor":"AppSync ChatbotApi (data source proxyResolverFunction)","doc":"","file":"lib/chatbot-api/functions/api-handler/index.py","line":53,"params":["event","context"],"payload":"{\"info\": {\"fieldName\": \"deleteWorkspace\"}, \"arguments\": {\"workspaceId\": \"3f2a9c1e-7b44-4d1a-9e0c-5a1b2c3d4e5f\"}}\n\n\n","receives":"AppSync event with arguments.workspaceId","returns":"the resolver's result (null on success)","stores":"nothing","symbol":"lib.chatbot-api.functions.api-handler.index:handler"},{"action":"Allowed for admin and workspace_manager only (approved_roles); validates the id with WorkspaceIdValidation and calls the genai_core function","doc":"","file":"lib/chatbot-api/functions/api-handler/routes/workspaces.py","line":113,"note":"deleteDocument is routes.documents:delete_document → genai_core.documents:delete_document, which allows only status processed, error or enabled and starts the DeleteDocument state machine with {workspace_id, document_id}.","params":["workspaceId"],"receives":"workspaceId","returns":"nothing","stores":"nothing","symbol":"lib.chatbot-api.functions.api-handler.routes.workspaces:delete_workspace"},{"action":"Reads the workspace row; refuses unless status is ready or error; starts DELETE_WORKSPACE_WORKFLOW_ARN","doc":"","file":"lib/shared/layers/python-sdk/python/genai_core/workspaces.py","line":314,"note":"The status check stops a delete while the create workflow is still running.","params":["workspace_id"],"receives":"workspace_id","returns":"nothing; CommonError 'Workspace not found' or 'Workspace not ready for deletion'","stores":"starts Step Functions DeleteWorkspace with {\"workspace_id\": ...}","symbol":"lib.shared.layers.python-sdk.python.genai_core.workspaces:delete_workspace"},{"action":"The state machine sets status deleting, then invokes this Lambda, which loads the workspace and branches on engine: aurora, opensearch, kendra or bedrock_kb delete modules","actor":"Step Functions DeleteWorkspace (SetDeleting → task Delete)","doc":"","file":"lib/rag-engines/workspaces/functions/delete-workspace-workflow/delete/index.py","line":14,"note":"The document twin is lib.rag-engines.workspaces.functions.delete-document-workflow.delete.index:lambda_handler → delete_aurora_document / delete_open_search_document / delete_kendra_document (no bedrock_kb branch).","params":["event","context"],"receives":"{\"workspace_id\": ...}","returns":"nothing; an exception sends the workflow to HandleError, which sets status error","stores":"nothing itself","symbol":"lib.rag-engines.workspaces.functions.delete-workspace-workflow.delete.index:lambda_handler"},{"action":"Deletes every S3 object under the workspace id prefix in the upload and processing buckets, issues DROP TABLE IF EXISTS on the workspace table, pages through all document rows of the workspace and batch-deletes them, then deletes the workspace row","doc":"","file":"lib/shared/layers/python-sdk/python/genai_core/aurora/delete.py","line":24,"note":"The OpenSearch twin (genai_core.opense
