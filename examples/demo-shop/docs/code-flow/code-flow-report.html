    --accent: #4fc0b8; --accent-soft: #163634; --amber: #e3a24a; --amber-soft: #3a2a14; --bad: #ef7a72; --bad-soft: #3a1c1a; --good: #6cc070; --good-soft: #1b3320;

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-padding-top: 60px; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; word-break: keep-all; overflow-wrap: anywhere; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 0 64px; }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; }
h1 { font-size: clamp(28px, 5vw, 42px); font-weight: 700; line-height: 1.15; }
h2 { font-size: 24px; font-weight: 600; }
h3 { font-size: 16.5px; font-weight: 600; }
h4 { font-size: 12px; font-family: var(--font-mono); letter-spacing: 0.06em; color: var(--muted); font-weight: 500; }

a { color: var(--accent); }
button, input, select { font: inherit; color: inherit; }

pre { margin: 0; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }

.topnav { position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
.topnav .wrap { display: flex; gap: 14px; align-items: center; padding-block: 9px; overflow-x: auto; scrollbar-width: none; }
.topnav .wrap::-webkit-scrollbar { display: none; }
.topnav a { text-decoration: none; color: var(--muted); font-size: 13px; white-space: nowrap; }
.topnav a:hover { color: var(--ink); }
.brand { font-weight: 700; color: var(--ink) !important; font-size: 14.5px !important; margin-right: 2px; }
.themebtn { margin-left: auto; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 3px 10px; font-size: 12px; cursor: pointer; white-space: nowrap; }

.hero { display: grid; gap: 16px; padding-block: 32px 4px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.06em; color: var(--muted); }
.lede { font-size: 17px; max-width: 70ch; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 12px; }
.stat { border-top: 2px solid var(--ink); padding-top: 8px; }
.stat b { font-size: 24px; display: block; font-variant-numeric: tabular-nums; font-weight: 700; }
.stat span { color: var(--muted); font-size: 13px; }
.searchbar { position: relative; }
.searchbar input { width: 100%; font-size: 15px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.results { position: absolute; z-index: 25; left: 0; right: 0; top: calc(100% + 4px); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; max-height: 60vh; overflow-y: auto; box-shadow: 0 8px 24px rgb(0 0 0 / 0.12); }
.results button { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 8px; width: 100%; text-align: left; border: none; background: none; padding: 7px 10px; cursor: pointer; border-bottom: 1px solid var(--line); font-size: 13px; }
.results button:hover, .results button.on { background: var(--accent-soft); }
.results .k { font-family: var(--font-mono); font-size: 11px; color: var(--muted); padding-top: 1px; }
.results small { display: block; color: var(--muted); font-size: 12px; }

section { padding-block: 34px 8px; border-top: 1px solid var(--line); margin-top: 26px; display: grid; gap: 16px; min-width: 0; }
.section-head { display: grid; gap: 6px; }
.section-head p { color: var(--muted); }
.note { font-size: 13px; color: var(--muted); }
.howto { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.howto div, .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; font-size: 14px; align-content: start; min-width: 0; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); align-items: center; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.legend .ln { display: inline-block; width: 22px; height: 0; border-top: 2px solid; margin-right: 5px; vertical-align: 3px; }

.chip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 2px 9px; font-size: 12px; cursor: pointer; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.chip:hover { border-color: var(--accent); }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.chip.mono { font-family: var(--font-mono); font-size: 11.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.badge { display: inline-block; font-family: var(--font-mono); font-size: 11px; padding: 1px 7px; border-radius: 4px; border: 1px solid var(--line); white-space: nowrap; color: var(--muted); }
.badge.accent { border-color: var(--accent); color: var(--accent); }
.badge.amber { border-color: var(--amber); color: var(--amber); }
.badge.bad { border-color: var(--bad); color: var(--bad); }
.badge.good { border-color: var(--good); color: var(--good); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 13px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.btn:disabled { opacity: 0.45; cursor: default; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
input[type=search], input[type=text] { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 5px 10px; font-size: 13px; min-width: 0; }
.symlink { background: none; border: none; padding: 0; cursor: pointer; color: var(--accent); font-family: var(--font-mono); font-size: 12.5px; text-align: left; overflow-wrap: anywhere; word-break: break-all; }
.symlink:hover { text-decoration: underline; }
.loc { font-family: var(--font-mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; word-break: break-all; }
.loc a { color: var(--muted); }
.frame { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: auto; }
.frame svg { display: block; }
dl.kv { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 6px 10px; margin: 0; font-size: 13.5px; }
dl.kv dt { color: var(--muted); font-size: 12px; padding-top: 2px; }
dl.kv dd { margin: 0; min-width: 0; }
@media (max-width: 520px) { dl.kv { grid-template-columns: minmax(0, 1fr); } dl.kv dt { padding-top: 6px; } }

/* 계층 */
.arch-layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.modbox { cursor: pointer; }
.modbox rect { fill: var(--surface); stroke: var(--line); }
.modbox:hover rect { stroke: var(--accent); }
.modbox.sel rect { stroke: var(--accent); stroke-width: 2.4; fill: var(--accent-soft); }
.modbox.in rect { stroke: var(--amber); stroke-width: 2; fill: var(--amber-soft); }
.modbox.out rect { stroke: var(--accent); stroke-width: 2; }
.modbox text { font-family: var(--font-mono); font-size: 10.5px; fill: var(--ink); pointer-events: none; }
.modbox text.sub { fill: var(--muted); font-size: 9.5px; }
.colhead { font-size: 11.5px; font-weight: 600; }
.medge { fill: none; stroke-width: 1.4; stroke-opacity: 0.8; }
.medge.out { stroke: var(--accent); } .medge.in { stroke: var(--amber); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px 24px; min-width: 0; }
.panel > div { display: grid; gap: 8px; align-content: start; min-width: 0; }
@media (max-width: 860px) { .panel { grid-template-columns: minmax(0, 1fr); } }
.panel ul, .plain { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 3px; max-height: 300px; overflow-y: auto; }
.panel li, .plain li { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; font-size: 13px; }
.rules { display: grid; gap: 6px; }
.rule { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px; font-size: 13.5px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.rule .ok { color: var(--good); font-weight: 700; } .rule .no { color: var(--bad); font-weight: 700; }

/* 여정 */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
.tabs button.on { border-color: var(--accent); background: var(--accent-soft); }
.seq text { font-size: 11px; fill: var(--ink); }
.seq .actor rect { fill: var(--surface-2); stroke: var(--line); }
.seq .actor text { font-family: var(--font-mono); font-size: 10.5px; }
.seq .life { stroke: var(--line); stroke-dasharray: 3 3; }
.seq .msg line { stroke: var(--muted); stroke-width: 1.3; }
.seq .msg polygon { fill: var(--muted); }
.seq .msg text { fill: var(--muted); font-size: 10.5px; }
.seq .msg { cursor: pointer; }
.seq .msg.cur line { stroke: var(--accent); stroke-width: 2.4; }
.seq .msg.cur polygon { fill: var(--accent); }
.seq .msg.cur text { fill: var(--accent); font-weight: 600; }
.seq .msg.store line { stroke-dasharray: 5 3; }
.seq .num { font-family: var(--font-mono); font-size: 9.5px; fill: var(--muted); }
.journey { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 860px) { .journey { grid-template-columns: minmax(0, 1fr); } .steplist { max-height: 230px; } }
.steplist { margin: 0; padding: 6px; list-style: none; display: grid; gap: 2px; max-height: 620px; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.steplist button { width: 100%; text-align: left; background: none; border: none; border-radius: 6px; padding: 5px 8px; cursor: pointer; font-size: 13px; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 6px; }
.steplist button:hover { background: var(--surface-2); }
.steplist button.on { background: var(--accent-soft); }
.steplist .n { font-family: var(--font-mono); font-size: 11px; color: var(--muted); padding-top: 2px; }
.stepcard { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
.stepnav { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.codebox { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; display: grid; gap: 3px; min-width: 0; }
.payload { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; max-height: 360px; overflow: auto; }

/* 카드 */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 520px), 1fr)); gap: 14px; }
.role { border-top: 3px solid var(--accent); }
.role.job { border-top-color: var(--l4); }
.role.rec { border-top-color: var(--l2); }
.role .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.msgstack { margin: 0; padding-left: 18px; display: grid; gap: 2px; font-size: 13px; }
.flow { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 10px; align-items: start; }
@media (max-width: 700px) { .flow { grid-template-columns: minmax(0, 1fr); } }
.guards { display: flex; flex-wrap: wrap; gap: 4px 2px; align-items: stretch; }
.guard { border: 1px solid var(--line); border-left: 3px solid var(--bad); border-radius: 6px; padding: 4px 8px; font-size: 12.5px; background: var(--bg); text-align: left; display: grid; max-width: 280px; cursor: pointer; }
.guard:hover { border-color: var(--accent); }
.guard small, .stage small { font-family: var(--font-mono); font-size: 10px; color: var(--muted); overflow-wrap: anywhere; word-break: break-all; }
.arrow { color: var(--muted); align-self: center; padding: 0 2px; font-size: 12px; }

/* 호출 그래프 */
.explorer { display: grid; gap: 12px; }
.suggest { display: grid; gap: 2px; max-height: 240px; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 4px; }
.suggest button { text-align: left; border: none; background: none; padding: 4px 8px; border-radius: 5px; cursor: pointer; font-family: var(--font-mono); font-size: 12px; }
.suggest button:hover { background: var(--accent-soft); }
.ego .node { cursor: pointer; }
.ego .node rect { fill: var(--surface); stroke: var(--line); }
.ego .node.c rect { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
.ego .node.in rect { stroke: var(--amber); }
.ego .node.out rect { stroke: var(--accent); }
.ego .node:hover rect { stroke-width: 2; }
.ego .node text { font-family: var(--font-mono); font-size: 10.5px; fill: var(--ink); pointer-events: none; }
.ego .node text.sub { fill: var(--muted); font-size: 9px; }
.ego .e { fill: none; stroke-opacity: 0.55; stroke-width: 1.2; }
.ego .e.in { stroke: var(--amber); } .ego .e.out { stroke: var(--accent); }
.ego .e.ref { stroke-dasharray: 4 3; }
.ego .colhead { font-family: var(--font-mono); font-size: 10.5px; fill: var(--muted); }
.sig { font-family: var(--font-mono); font-size: 12.5px; background: var(--surface-2); border-radius: 6px; padding: 6px 8px; overflow-wrap: anywhere; word-break: break-all; }

/* 데이터 */
.lifecycles { display: grid; gap: 10px; }
.lc { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 10px; align-items: start; }
@media (max-width: 700px) { .lc { grid-template-columns: minmax(0, 1fr); } }
.stages { display: flex; flex-wrap: wrap; gap: 4px 2px; align-items: stretch; }
.stage { border: 1px solid var(--line); border-left: 3px solid var(--k-read); border-radius: 6px; padding: 3px 8px; font-size: 12.5px; background: var(--bg); cursor: pointer; text-align: left; display: grid; max-width: 260px; }
.stage:hover { border-color: var(--accent); }
.stage.s-born { border-left-color: var(--k-born); } .stage.s-transform, .stage.s-update { border-left-color: var(--k-transform); }
.stage.s-store, .stage.s-archive, .stage.s-restore { border-left-color: var(--k-store); } .stage.s-read { border-left-color: var(--k-read); } .stage.s-delete { border-left-color: var(--k-delete); }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table.data { border-collapse: collapse; width: 100%; font-size: 13px; }
table.data th, table.data td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.data th { font-family: var(--font-mono); font-size: 11px; font-weight: 500; color: var(--muted); background: var(--bg); position: sticky; top: 0; white-space: nowrap; }
table.data tr:last-child td { border-bottom: none; }
table.data td.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
#table-matrix { min-width: 760px; }
#mod-table { min-width: 860px; }
#decision-table { min-width: 640px; }
tr.pick { cursor: pointer; }
tr.pick:hover td { background: var(--surface-2); }
tr.sel td { background: var(--accent-soft); }

/* 발견 사항 */
.findings { display: grid; gap: 10px; }
.finding { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--muted); border-radius: 8px; padding: 10px 14px; display: grid; gap: 6px; }
.finding.sev-high { border-left-color: var(--bad); } .finding.sev-medium { border-left-color: var(--amber); } .finding.sev-low { border-left-color: var(--l0); } .finding.sev-info { border-left-color: var(--muted); }
.finding .top { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.warnbox { border: 1px solid var(--bad); background: var(--bad-soft); border-radius: 8px; padding: 10px 12px; font-size: 13.5px; }
footer { margin-top: 48px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; display: grid; gap: 8px; }
footer pre { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; color: var(--ink); }
.flash { animation: flash 1.4s ease-out; }
@keyframes flash { from { box-shadow: 0 0 0 3px var(--accent); } to { box-shadow: 0 0 0 0 transparent; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* fade: when something is selected, everything not connected to it steps back */
.fadeable { transition: opacity 0.18s ease; }
.focus .fadeable.dim { opacity: var(--fade, 0.22); }
.focus .medge.dim, .focus .e.dim { stroke-opacity: 0.05; }
.medge.bg { stroke: var(--muted); stroke-opacity: 0.10; stroke-width: 1; }
.focus .medge.bg { stroke-opacity: 0.03; }
.medge.hl, .e.hl { stroke-opacity: 1 !important; stroke-width: 2.4 !important; }
.fadebar { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.fadebar input[type=range] { width: 120px; accent-color: var(--accent); }
.todo { color: var(--amber); font-style: italic; }
.kvgrid { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px 10px; font-size: 12.5px; }
.kvgrid b { font-family: var(--font-mono); font-weight: 500; color: var(--muted); font-size: 11.5px; }
</style>
</head>
