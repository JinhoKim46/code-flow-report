.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }

tr.pick:hover td { background: var(--surface-2); }

.finding.sev-high { border-left-color: var(--bad); } .finding.sev-medium { border-left-color: var(--amber); } .finding.sev-low { border-left-color: var(--l0); } .finding.sev-info { border-left-color: var(--muted); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* fade: when something is selected, everything not connected to it steps back */
.fadeable { transition: opacity 0.18s ease; }
.focus .fadeable.dim { opacity: var(--fade, 0.22); }
.focus .medge.dim, .focus .e.dim { stroke-opacity: 0.05; }
.medge.bg { stroke: var(--muted); stroke-opacity: 0.10; stroke-width: 1; }
.focus .medge.bg { stroke-opacity: 0.03; }
.medge.hl, .e.hl { stroke-opacity: 1 !important; stroke-width: 2.4 !important; }
.fadebar { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.fadebar input[type=range] { width: 120px; accent-color: var(--accent); }
.todo { color: var(--amber); font-style: italic; }

eam → action trigger → SQS aft-account-request.fifo, and an EventBridge rate(5 minutes) rule → processor, which receives MaxNumberOfMessages=1 per run. The ordering comes from this one-at-a-time polling; each message gets its own MessageGroupId.","symbol":"aft_lambda.aft_account_request_framework.aft_account_request_processor:lambda_handler"},{"_loc":{"doc":"","file":"sources/aft-lambda-layer/aft_common/account_request_framework.py","line":424,"params":["self","threshold"],"symbol":"sources.aft-lambda-layer.aft_common.account_request_framework:AccountRequest.provisioning_threshold_reached"},"by":"code","decision":"Whether the processor may start another account operation now","how":"AccountRequest.provisioning_threshold_reached counts Control Tower enabled baselines in UNDER_CHANGE and compares to AFT_PROVISIONING_CONCURRENCY (Terraform var concurrent_account_factory_actions, default 5).","symbol":"sources.aft-lambda-layer.aft_common.account_request_framework:AccountRequest.provisioning_threshold_reached"},{"_loc":{"doc":"","file":"sources/aft-lambda-layer/aft_common/account_request_framework.py","line":144,"params":["session","request"],"symbol":"sources.aft-lambda-layer.aft_common.account_request_framework:new_ct_request_is_valid"},"by":"code","decision":"Whether a queued request is valid","how":"ADD: new_ct_request_is_valid rejects an AccountName or AccountEmail already used in Organizations. UPDATE: modify_ct_request_is_valid allows only ManagedOrganizationalUnit to change. An invalid message is deleted and reported as an error.","symbol":"sources.aft-lambda-layer.aft_common.account_request_framework:new_ct_request_is_valid"},{"_loc":{"doc":"","file":"sources/aft-lambda-layer/aft_common/account_request_framework.py","line":181,"params":["session","ct_management_session","request"],"symbol":"sources.aft-lambda-layer.aft_common.account_request_framework:create_new_account"},"by":"code","decision":"Account creation and OU moves are done by Control Tower, not by AFT da-layer.aft_common.auth:AuthClient.get_target_account_session"},{"_loc":{"doc":"","file":"sources/aft-lambda-layer/aft_common/account_provisioning_framework.py","line":209,"params":["self"],"symbol":"sources.aft-lambda-layer.aft_common.account_provisioning_framework:ProvisionRoles.deploy_aws_aft_roles"},"by":"code","decision":"How a brand-new account gets the AFT roles before AFT can reach it","how":"ProvisionRoles goes in through the CT management account as AWSControlTowerExecution (the only role a new account trusts), creates AWSAFTService and AWSAFTExecution with AdministratorAccess trusted by AWSAFTAdmin, waits until they can be assumed and sleeps 65 s for IAM consistency.","symbol":"sources.aft-lambda-layer.aft_common.account_provisioning_framework:ProvisionRoles.deploy_aws_aft_roles"},{"_loc":{"doc":"","file":"sources/aft-lambda-layer/aft_common/ssm.py","line":53,"params":["session","param","decrypt"],"symbol":"sources.aft-lambda-layer.aft_common.ssm:get_ssm_parameter_value"},"by":"people (config file)","decision":"Resources are found by name in SSM, not wired into each Lambda","how":"modules/aft-ssm-parameters writes /aft/resources/*, /aft/account/* and /aft/config/*; handlers read them with get_ssm_parameter_value (cached per container). Only the processor has an environment variable of its own.","symbol":"sources.aft-lambda-layer.aft_common.ssm:get_ssm_parameter_value"},{"_loc":{"doc":"","file":"src/aft_lambda/aft_builder/codebuild_trigger.py","line":23,"params":["event","context"],"symbol":"aft_lambda.aft_builder.codebuild_trigger:lambda_handler"},"by":"people (config file)","decision":"All Lambdas share one library, published as a Lambda layer built at apply time","how":"Every aws_lambda_function sets layers = [var.aft_common_layer_arn]; modules/aft-lambda-layer builds it with CodeBuild, triggered synchronously by the codebuild_trigger Lambda through a Terraform aws_lambda_invocation data source.","symbol":"aft_lambda.aft_builder.codebuild_trigger:lambd re-options/iam/role-policies/aft_delete_default_vpc_lambda.tpl; feature_options.get_default_vpc/delete_* use whatever client/resource they are given.","id":"delete-default-vpc-wrong-account","severity":"medium","symbols":["aft_lambda.aft_feature_options.aft_delete_default_vpc:lambda_handler"],"title":"Default-VPC deletion runs against the AFT management account, not the vended account"},{"_locs":[{"doc":"","file":"src/aft_lambda/aft_customizations/aft_customizations_identify_targets.py","line":37,"params":["event","context"],"symbol":"aft_lambda.aft_customizations.aft_customizations_identify_targets:lambda_handler"}],"category":"risk","check":{"kind":"text_in","pattern":"target_accounts\\.remove\\(account_id\\)"},"detail":"True now: the loop 'for account_id in target_accounts' calls target_accounts.remove(account_id) when Organizations answers AccountNotFoundException. Removing from the list being iterated skips the following element. Trigger: an AFT account that was closed or suspended but still has a row in aft-request-metadata (cleanup only runs when the request item is deleted) and is selected by include. Reach: the next account gets no payload, so the Map state never re-runs the provisioning framework for it, yet it stays in pending_accounts and its customization pipeline is still started — one account per closed account, silently.","evidence":"Read aft_customizations_identify_targets:lambda_handler (the loop and the returned pending_accounts) and the 'Invoke Provisioning Framework' Map in modules/aft-customizations/states/invoke_customizations.asl.json, which reads only target_accounts_info.","id":"identify-targets-list-mutated-while-iterating","severity":"medium","symbols":["aft_lambda.aft_customizations.aft_customizations_identify_targets:lambda_handler"],"title":"A closed account makes Identify Targets skip the next account's provisioning run"},{"_locs":[{"doc":"","file":"sources/aft-lambda-layer/aft_common/sqs.py","line":30,"params":["session","sqs_queue"],"symbol":"sources.aft-lambda-layer.aft_common.sqs:receive_sqs_message"}],"category":"risk","check":{"kind":"text_in","pattern":"MaxNumberOfMessages=1"},"detail":"True now: receive_sqs_message asks for MaxNumberOfMessages=1 and the processor handles that one message and returns; the rule fires every 5 minutes. Trigger: a batch of new account requests (e.g. 50 committed at once). Reach: about 12 requests per hour at best, whatever AFT_PROVISIONING_CONCURRENCY allows — 50 requests take over four hours just to be submitted. Performance only; nothing is lost.","evidence":"Read sqs:receive_sqs_message, aft_account_request_processor:lambda_handler and the rate(5 minutes) rule in modules/aft-account-request-framework/eventbridge.tf.","id":"processor-one-request-per-run","severity":"low","symbols":["sources.aft-lambda-layer.aft_common.sqs:receive_sqs_message"],"title":"At most one account request is started per 5-minute run"},{"_locs":[{"doc":"","file":"sources/aft-lambda-layer/aft_common/ssm.py","line":53,"params":["session","param","decrypt"],"symbol":"sources.aft-lambda-layer.aft_common.ssm:get_ssm_parameter_value"}],"category":"risk","check":{"kind":"text_in","pattern":"_ssm_cache\\[param\\] = param_value"},"detail":"True now: get_ssm_parameter_value stores every value in the module-level _ssm_cache and never expires it. Trigger: an operator changes an AFT setting through Terraform — a feature flag, maximum_concurrent_customizations, customization-triggers. Reach: every Lambda container already warm keeps using the old value until AWS recycles it, so the change takes effect unevenly for minutes to hours.","evidence":"Read aft_common/ssm.py: _ssm_cache dict, get_ssm_parameter_value returns the cached value before calling GetParameter.","id":"ssm-cache-never-expires","severity":"low","symbols":["sources.aft-lambda-layer.aft_common.ssm:get_ssm_parameter_value"],"title":"SSM parameter values are cached for the life of a warm Lambda"},{"_locs":[{"doc":"Detect OU changes and processor.py","line":37,"params":["event","context"],"symbol":"aft_lambda.aft_account_request_framework.aft_account_request_processor:lambda_handler"}],"category":"risk","detail":"True now: the queue's redrive policy has maxReceiveCount = 1 and the processor deletes the message only after the Service Catalog call succeeds. Any exception before delete_sqs_message (a throttled Organizations or Service Catalog call, a Control Tower error, a Lambda timeout) leaves the message received once, so the next receive moves it to aft-account-request-dlq.fifo. The Lambda timeout (300 s) is also longer than the queue's visibility timeout (240 s). No code or alarm reads the DLQ. Trigger: any transient error while handling a message. Reach: that one account is never created or updated until someone redrives the DLQ or re-touches the request; the only signal is the SNS failure message sent at the time.","evidence":"Read aft_account_request_processor:lambda_handler (delete_sqs_message after create_new_account / update_existing_account), modules/aft-account-request-framework/sqs.tf (visibility_timeout_seconds 240, maxReceiveCount 1) and lambda.tf (timeout 300); grep for dlq / cloudwatch_metric_alarm over modules found nothing else.","id":"processor-no-retry-dlq-after-one-failure","severity":"medium","symbols":["aft_lambda.aft_account_request_framework.aft_account_request_processor:lambda_handler"],"title":"One failed processor run sends the account request to the DLQ, and nothing reads the DLQ"},{"_locs":[{"doc":"","file":"sources/aft-lambda-layer/aft_common/sqs.py","line":63,"params":["session","sqs_url","message"],"symbol":"sources.aft-lambda-layer.aft_common.sqs:send_sqs_message"}],"category":"risk","check":{"kind":"text_in","pattern":"MessageGroupId=unique_id"},"detail":"True now: send_sqs_message sets MessageGroupId and MessageDeduplicationId to a new uuid1 for each message. SQS FIFO only orders within a group, so ADD and a later UPDATE for the same email may be delivered in either order, and a repeated stream delivery creates a second message. Trigger: a customer changes control_tower_parameters (for example the OU) before the processor has taken the ADD. Reach: the UPDATE taken first fails in update_existing_account ('No healthy provisioned product') and, by the finding above, lands in the DLQ.","evidence":"Read sqs:send_sqs_message and account_request_framework:insert_msg_into_acc_req_queue; the processor's one-message-per-run receive is the only serialisation.","id":"fifo-unique-group-id","severity":"low","symbols":["sources.aft-lambda-layer.aft_common.sqs:send_sqs_message"],"title":"Every queue message gets its own MessageGroupId, so the FIFO queue neither orders nor de-duplicates requests"},{"_locs":[{"doc":"","file":"src/aft_lambda/aft_account_request_framework/aft_account_request_action_trigger.py","line":24,"params":["event","context"],"symbol":"aft_lambda.aft_account_request_framework.aft_account_request_action_trigger:lambda_handler"}],"category":"risk","detail":"True now: both event source mappings on the aft-request stream set maximum_retry_attempts = 1 and have no on-failure destination. Trigger: the action trigger fails twice on a record (for example an Organizations throttle while checking shared accounts). Reach: that request change is never queued or audited; the failure SNS message is the only trace, and the customer has to change the request again to retry it.","evidence":"Read modules/aft-account-request-framework/lambda.tf (aws_lambda_event_source_mapping blocks: batch_size 1, starting_position LATEST, maximum_retry_attempts 1, no destination_config) and the handler's except block (SNS publish then re-raise).","id":"stream-record-dropped-after-one-retry","severity":"low","symbols":["aft_lambda.aft_account_request_framework.aft_account_request_action_trigger:lambda_handler"],"title":"A failed aft-request stream record is retried once and then dropped"},{"_locs":[{"doc":"","file":"sources/aft-lambda-layer/aft_common/account_provisioning_framework.py","line":235,"params":["payload","account_info","session"],"symbol":"sources.aft-lambda-layer.aft_common.account_provisioning_framework:persist_metadata"}],"category":"risk","check":{"kind":"calls","target":"sources.aft-lambda-layer.aft_common.ddb:put_ddb_item"},"detail":"True now: persist_metadata does a full put_item of the aft-request-metadata row without enterprise_support_case_created, and it is the first task of every provisioning run (including every customizations re-run). aft_enroll_support then finds no flag and falls back to DescribeCases, which only returns cases from the last 12 months, and creates a case anyway when that call is throttled. Trigger: enterprise support enabled and an account re-customised more than 12 months after its case, or a throttled DescribeCases. Reach: a duplicate 'Add Account <id> to Enterprise Support' case per affected account per run.","evidence":"Read account_provisioning_framework:persist_metadata (item has no support field; ddb.put_ddb_item), premium_support:ensure_enterprise_support_enrollment and set_enrollment_flag_in_metadata, and the ASL (persist_metadata is StartAt; aft_features runs later).","id":"support-flag-overwritten-by-persist-metadata","severity":"low","symbols":["sources.aft-lambda-layer.aft_common.account_provisioning_framework:persist_metadata"],"title":"persist_metadata overwrites the row that holds the Enterprise Support flag, so every run re-checks support cases"},{"_locs":[{"doc":"","file":"sources/aft-lambda-layer/aft_common/metrics.py","line":143,"params":["self","action","status"],"symbol":"sources.aft-lambda-layer.aft_common.metrics:AFTMetrics.post_event"}],"category":"risk","check":{"kind":"text_in","pattern":"requests\\.post\\(self\\.api_endpoint, json=payload\\)"},"detail":"True now: AFTMetrics.post_event calls requests.post without a timeout. In the processor it runs after create_new_account / update_existing_account and before delete_sqs_message; the try/except aro .com\"},\n \"control_tower_parameters\": {\"M\": {\"AccountName\": {\"S\": \"dev-team\"}, \"ManagedOrganizationalUnit\": {\"S\": \"Sandbox\"}}}}}}\n\n\n\n\n\n","receives":"stream event: Records[0] with eventSource aws:dynamodb, eventName INSERT/MODIFY/REMOVE, dynamodb.NewImage/OldImage","returns":"nothing; on error an SNS failure message and a re-raise","stores":"one item in DynamoDB aft-request-audit (via put_audit_record)","symbol":"aft_lambda.aft_account_request_framework.aft_account_request_audit_trigger:lambda_handler"},{"action":"The real consumer of the change. Builds an AuthClient, wraps the stream record in AccountRequestRecordHandler and calls process_request.","actor":"DynamoDB stream of aft-request (batch_size 1, maximum_retry_attempts 1)","doc":"","file":"src/aft_lambda/aft_account_request_framework/aft_account_request_action_trigger.py","line":24,"params":["event","context"],"receives":"the same stream event as the audit trigger","returns":"nothing; on error an SNS failure message ('AFT account request failed') and a re-raise","symbol":"aft_lambda.aft_account_request_framework.aft_account_request_action_trigger:lambda_handler"},{"action":"Constructor: _validate_event rejects anything whose eventSource is not aws:dynamodb, opens the AFT-management and CT-management sessions, keeps OldImage/NewImage and works out whether control_tower_parameters changed (only on MODIFY).","doc":"","file":"sources/aft-lambda-layer/aft_common/account_request_record_handler.py","line":25,"params":[],"receives":"auth, event","returns":"the handler object with is_create_action / is_update_action / control_tower_parameters_updated","symbol":"sources.aft-lambda-layer.aft_common.account_request_record_handler:AccountRequestRecordHandler"},{"action":"The decision tree, in this order: REMOVE → handle_remove (invokes Lambda aft-cleanup-resources, named in SSM); not a CT-parameter change and the account is a shared core account → customization only; INSERT for an account not yet enrolled → ADD; INSERT for an account already enrolled in Control Tower → customization only; MODIFY with CT parameters changed → UPDATE; any other MODIFY → customization only.","doc":"","file":"sources/aft-lambda-layer/aft_common/account_request_record_handler.py","line":114,"params":["self"],"receives":"the parsed record","returns":"nothing; 'Unsupported account request' raises","symbol":"sources.aft-lambda-layer.aft_common.account_request_record_handler:AccountRequestRecordHandler.process_request"},{"action":"Is the request about a shared account (CT management, log archive, audit)? Compares email and name with each shared account in Organizations, and refuses a request that tries to move one out of its OU.","doc":"","file":"sources/aft-lambda-layer/aft_common/shared_account.py","line":23,"params":["event_record","auth"],"receives":"event_record, auth","returns":"True for a shared account","symbol":"sources.aft-lambda-layer.aft_common.shared_account:shared_account_request"},{"action":"For an INSERT: looks the email up in Organizations and then searches Service Catalog for a healthy Account Factory provisioned product with that account as physicalId.","doc":"","file":"sources/aft-lambda-layer/aft_common/service_catalog.py","line":152,"params":["record"],"receives":"the stream record","returns":"the account id if already enrolled, else None (→ a new account)","symbol":"sources.aft-lambda-layer.aft_common.service_catalog:get_account_id_if_enrolled"},{"action":"ADD or UPDATE path: hands the record to insert_msg_into_acc_req_queue with new_account True/False.","doc":"","file":"sources/aft-lambda-layer/aft_common/account_request_record_handler.py","line":72,"params":["self","new_account"],"receives":"new_account flag","returns":"nothing","symbol":"sources.aft-lambda-layer.aft_common.account_request_record_handler:AccountRequestRecordHandler.handle_account_request"},{"action":"Reads the queue name from SSM /aft/resources/sqs/aft-request-queue-name, builds the queue URL from the caller identity, builds the message and sends it.","doc":"","file":"sources/aft-lambda-layer/aft_common/account_request_framework.py","line":51,"params":["event_record","new_account","session"],"receives":"event_record, new_account, session","returns":"nothing","symbol":"sources.aft-lambda-layer.aft_common.account_request_framework:insert_msg_into_acc_req_queue"},{"action":"Shrinks the record to what the processor needs: the operation, the new control_tower_parameters and, on MODIFY, the old ones.","doc":"","file":"sources/aft-lambda-layer/aft_common/account_request_framework.py","line":76,"params":["record","new_account"],"payload":"{\"operation\": \"ADD\",\n \"control_tower_parameters\": {\"AccountEmail\": \"dev-team@example.com\", \"AccountName\": \"dev-team\",\n   \"ManagedOrganizationalUnit\": \"Sandbox\", \"SSOUserEmail\": \"jane.doe@example.com\",\n   \"SSOUserFirstName\": \"Jane\", \"SSOUserLastName\": \"Doe\"}}\n\n\n\n\n\n","receives":"the stream record","returns":"message dict","symbol":"sources.aft-lambda-layer.aft_common.account_request_framework:build_sqs_message"},{"action":"Sends the JSON body to SQS aft-account-request.fifo. Deduplication id and message group id are both a fresh uuid1, so every message is its own group.","doc":"","file":"sources/aft-lambda-layer/aft_common/sqs.py","line":63,"params":["session","sqs_url","message"],"receives":"sqs_url, message","returns":"SQS SendMessage response","stores":"one message on SQS aft-account-request.fifo — picked up by journey 2","symbol":"sources.aft-lambda-layer.aft_common.sqs:send_sqs_message"}],"summary":"The customer's Terraform writes one item per account (key = the account email) to DynamoDB aft-request. Two Lambdas read the table's stream: aft-account-request-audit-trigger copies every image into aft-request-audit, and aft-account-request-action-trigger decides what the change means — a new account goes on the SQS FIFO queue as ADD, a changed Control Tower parameter as UPDATE, a customization-only change goes straight to the provisioning Step Functions, and a deleted item triggers cleanup.","title":"1 · An account request lands in DynamoDB and is queued","trigger":"CodePipeline applies the aft-account-request Terraform → item in DynamoDB aft-request → stream → Lambda aft-account-request-action-trigger"},{"actor":"EventBridge schedule","id":"account-request-processor","steps":[{"action":"Orchestrates one run. The concurrency limit comes from the env var AFT_PROVISIONING_CONCURRENCY; the queue name from SSM.","actor":"EventBridge rule aft-lambda-account-request-processor (rate(5 minutes))","doc":"","file":"src/aft_lambda/aft_account_request_framework/aft_account_request_processor.py","line":37,"params":["event","context"],"receives":"the scheduled EventBridge event (content unused)","returns":"None; on error an SNS failure message and a re-raise","symbol":"aft_lambda.aft_account_request_framework.aft_account_request_processor:lambda_handler"},{"action":"Constructor: assumes into the CT management account as AWSAFTService, reads its account id and finds the Account Factory product id.","doc":"","file":"sources/aft-lambda-layer/aft_common/account_request_framework.py","line":348,"params":[],"receives":"auth","returns":"AccountRequest with ct_management_session and account_factory_product_id","symbol":"sources.aft-lambda-layer.aft_common.account_request_framework:AccountRequest"},{"action":"Associates the AWSAFTService role ARN with the 'AWS Control Tower Account Factory Portfolio' (found by name through account_factory_portfolio_id). A missing portfolio only logs a warning.","doc":"Associates the AWSAFTService role with the Control Tower Account Factory Service Catalog portfolio","file":"sources/aft-lambda-layer/aft_common/account_request_framework.py","line":392,"params":["self"],"receives":"nothing","returns":"nothing","symbol":"sources.aft-lambda-layer.aft_common.account_request_framework:AccountRequest.associate_aft_service_role_with_account_factory"}, "params":["session","ct_management_session","request"],"payload":"{\"ProvisionedProductName\": \"dev-team\",\n \"ProvisioningParameters\": [{\"Key\": \"AccountEmail\", \"Value\": \"dev-team@example.com\"},\n   {\"Key\": \"ManagedOrganizationalUnit\", \"Value\": \"Sandbox\"}]}\n\n\n\n\n\n","receives":"session, ct_management_session, request","returns":"ProvisionProduct response (record id)","stores":"a Control Tower account creation in progress; when it ends, Control Tower emits CreateManagedAccount — journey 3","symbol":"sources.aft-lambda-layer.aft_common.account_request_framework:create_new_account"},{"action":"Deletes the message — also when the request was judged invalid, after which the handler raises 'CT Request is not valid' (SNS failure). If provisioning itself raised, the message is not deleted and goes to the DLQ (maxReceiveCount 1).","doc":"","file":"sources/aft-lambda-layer/aft_common/sqs.py","line":51,"params":["session","message"],"receives":"the message's ReceiptHandle","returns":"nothing","symbol":"sources.aft-lambda-layer.aft_common.sqs:delete_sqs_message"}],"summary":"A scheduled Lambda makes sure the AWSAFTService role can use the Account Factory portfolio, stops if too many Control Tower baselines are already UNDER_CHANGE, then takes at most one message from the FIFO queue. ADD becomes a Service Catalog ProvisionProduct in the CT management account, UPDATE an UpdateProvisionedProduct; the message is deleted once handled.","title":"2 · Every 5 minutes, one queued request goes to Control Tower","trigger":"EventBridge rule aft-lambda-account-request-processor, rate(5 minutes) → Lambda aft-account-request-processor"},{"actor":"Control Tower (CT management account)","id":"controltower-event-starts-provisioning","steps":[{"action":"Writes the whole EventBridge event, as received, to the table named in SSM /aft/resources/ddb/aft-controltower-events-table-name (keys id and time come from the event envelope).","actor":"EventBridge rule aft-controltower-event-logger (pattern: account = CT management account)","doc":"","file":"src/aft_lambda/aft_account_request_framework/aft_controltower_event_logger.py","line":25,"params":["event","context"],"payload":"{\"id\": \"6f1c0e2a-0000-4000-8000-000000000001\", \"time\": \"2026-10-04T09:12:00Z\",\n \"source\": \"aws.controltower\", \"account\": \"111111111111\",\n \"detail\": {\"eventName\": \"CreateManagedAccount\", \"serviceEventDetails\": {\"createManagedAccountStatus\":\n   {\"account\": {\"accountId\": \"222222222222\", \"accountName\": \"dev-team\"}, \"state\": \"SUCCEEDED\"}}}}\n\n\n\n\n\n","receives":"the EventBridge event","returns":"the PutItem response","stores":"one item in DynamoDB aft-controltower-events","symbol":"aft_lambda.aft_account_request_framework.aft_controltower_event_logger:lambda_handler"},{"action":"Accepts two event shapes: a supported Control Tower event, or a bare {account_request: …}. Anything else raises 'Invoked with unrecognized event type'.","actor":"EventBridge rule aft-controltower-event-logger (second target, same event)","doc":"","file":"src/aft_lambda/aft_account_request_framework/aft_invoke_aft_account_provisioning_framework.py","line":119,"params":["event","context"],"receives":"the same EventBridge event","returns":"None; on error an SNS failure message and a re-raise","symbol":"aft_lambda.aft_account_request_framework.aft_invoke_aft_account_provisioning_framework:lambda_handler"},{"action":"True only for source aws.controltower with eventName CreateManagedAccount or UpdateManagedAccount.","doc":"","file":"sources/aft-lambda-layer/aft_common/aft_utils.py","line":174,"params":["event"],"receives":"event","returns":"bool","symbol":"sources.aft-lambda-layer.aft_common.aft_utils:is_aft_supported_controltower_event"},{"action":"The CT event carries the account id but not the email, and the email is the key of aft-request — so it asks Organizations.","doc":"","file":"sources/aft-lambda-layer/aft_common/organizations.py","line":281,"params" account_skip_customization_triggers on the request item, and returns an account_move trigger. Any error is logged and treated as 'no trigger'.","doc":"Detect OU changes and return list of triggered tokens with context.","file":"src/aft_lambda/aft_account_request_framework/aft_invoke_aft_account_provisioning_framework.py","line":43,"params":["aft_management_session","event_name","account_id","account_email","new_parent_id"],"receives":"event_name, account_id, account_email, new_parent_id","returns":"[] or [{type: account_move, old_parent, new_parent}] — added to the payload as customization_triggers","symbol":"aft_lambda.aft_account_request_framework.aft_invoke_aft_account_provisioning_framework:detect_customization_triggers"},{"action":"Starts the state machine named in SSM /aft/account/aft-management/sfn/aft-account-provisioning-framework-sfn-name with the payload as input.","doc":"","file":"sources/aft-lambda-layer/aft_common/aft_utils.py","line":162,"params":["session","sfn_name","input"],"receives":"sfn_name, input JSON","returns":"StartExecution response","stores":"a running execution of Step Functions aft-account-provisioning-framework — journey 4","symbol":"sources.aft-lambda-layer.aft_common.aft_utils:invoke_step_function"}],"summary":"When Control Tower finishes CreateManagedAccount or UpdateManagedAccount, the event is forwarded to AFT's own bus. One target stores the raw event in DynamoDB aft-controltower-events; the other turns it into the customization payload — account info from Organizations, the request from aft-request, optional OU-move triggers — and starts the account provisioning Step Functions.","title":"3 · Control Tower's lifecycle event starts the provisioning framework","trigger":"EventBridge rule aft-capture-ct-events (CT management) → bus aft-events-from-ct-management → rule aft-controltower-event-logger → Lambdas aft-controltower-event-logger and aft-invoke-aft-account-provisioning-framework"},{"actor":"Step Functions aft-account-provisioning-framework","id":"provisioning-framework","steps":[{"action":"Checks action == 'persist_metadata' and calls persist_metadata.","actor":"Step Functions task aft_account_provisioning_framework_persist_metadata (first state)","doc":"","file":"src/aft_lambda/aft_account_provisioning_framework/aft_account_provisioning_framework_persist_metadata.py","line":20,"params":["event","context"],"receives":"{job_name, action: 'persist_metadata', payload: <journey 3 payload>}","returns":"the PutItem response","symbol":"aft_lambda.aft_account_provisioning_framework.aft_account_provisioning_framework_persist_metadata:lambda_handler"},{"action":"Writes the account's metadata row: id, email, name, creation time, status, tags, account_customizations_name and parent_ou (later read by detect_customization_triggers and the enterprise-support feature).","doc":"","file":"sources/aft-lambda-layer/aft_common/account_provisioning_framework.py","line":235,"params":["payload","account_info","session"],"receives":"payload, account_info, session","returns":"PutItem response","stores":"one item in DynamoDB aft-request-metadata, keyed by account id","symbol":"sources.aft-lambda-layer.aft_common.account_provisioning_framework:persist_metadata"},{"action":"Checks action == 'create_role' and runs ProvisionRoles(...).deploy_aws_aft_roles for the target account.","actor":"Step Functions task aft_account_provisioning_framework_create_role (Retry 5×, 60 s, backoff 1.5)","doc":"","file":"src/aft_lambda/aft_account_provisioning_framework/aft_account_provisioning_framework_create_role.py","line":18,"params":["event","context"],"receives":"{action: 'create_role', payload}","returns":"None","symbol":"aft_lambda.aft_account_provisioning_framework.aft_account_provisioning_framework_create_role:lambda_handler"},{"action":"Creates or updates AWSAFTService and AWSAFTExecution in the new account, trusted by AWSAFTAdmin in the AFT management account, waits until both can be assumed, then sleeps 65 s for IAM eventual consistency.","doc":"","file":"sources/aft-lambda-layer/aft_common/account_provisioning_framework.py","line":209,"params":["self"],"receives":"nothing (target account id held by the object)","returns":"nothing","symbol":"sources.aft-lambda-layer.aft_common.account_provisioning_framework:ProvisionRoles.deploy_aws_aft_roles"},{"action":"Reaches the new account through AWSControlTowerExecution, using a session already federated into the CT management account (or uses that session directly when the target is the CT management account), then _put_role and _put_policy_on_role.","doc":"Since we're creating the AFT roles in the account, we must assume AWSControlTowerExecution as the target role. Since this role only trusts federation from the CT Management account, we pass a hub session that has already been federated into the CT Management account","file":"sources/aft-lambda-layer/aft_common/account_provisioning_framework.py","line":73,"params":["self","role_name","trust_policy","policy_arn"],"receives":"role_name, trust_policy, policy_arn","returns":"nothing","stores":"IAM roles in the vended account","symbol":"sources.aft-lambda-layer.aft_common.account_provisioning_framework:ProvisionRoles._deploy_role_in_target_account"},{"action":"Checks action == 'tag_account', opens the CT management session as AWSAFTService and calls tag_account (rollback flag optional).","actor":"Step Functions task aft_account_provisioning_framework_tag_account","doc":"","file":"src/aft_lambda/aft_account_provisioning_framework/aft_account_provisioning_framework_tag_account.py","line":19,"params":["event","context"],"receives":"{action: 'tag_account', payload, account_info}","returns":"None","symbol":"aft_lambda.aft_account_provisioning_framework.aft_account_provisioning_framework_tag_account:lambda_handler"},{"action":"Turns account_tags into a Key/Value list and tags the account resource in Organizations (OrganizationsAgent.tag_org_resource).","doc":"","file":"sources/aft-lambda-layer/aft_common/account_provisioning_framework.py","line":268,"params":["payload","account_info","ct_management_session","rollback"],"receives":"payload, account_info, ct_management_session, rollback","returns":"nothing","stores":"tags on the account in AWS Organizations","symbol":"sources.aft-lambda-layer.aft_common.account_provisioning_framework:tag_account"},{"action":"Publishes custom_fields from the request as SSM parameters under /aft/account-request/custom-fields/ in the new account: assumes AWSAFTService there with a session policy limited to that path, deletes parameters no longer in custom_fields, then puts the rest.","actor":"Step Functions task aft_account_provisioning_framework_account_metadata_ssm","doc":"","file":"src/aft_lambda/aft_account_provisioning_framework/aft_account_provisioning_framework_account_metadata_ssm.py","line":26,"params":["event","context"],"receives":"{payload: {account_request: {custom_fields: '{\"cost_center\": \"42\"}'}}}","returns":"None","symbol":"aft_lambda.aft_account_provisioning_framework.aft_account_provisioning_framework_account_metadata_ssm:lambda_handler"},{"action":"PutParameter (String, Overwrite) for each custom field. After this task the state machine starts Step Functions aft-features (journey 5), then aft-account-provisioning-customizations, then CodeBuild aft-create-pipeline with VENDED_ACCOUNT_ID, then SNS aft-notifications.","doc":"","file":"sources/aft-lambda-layer/aft_common/ssm.py","line":21,"params":["session","parameters"],"receives":"target session, {cost_center: '42'}","returns":"nothing","stores":"SSM parameter /aft/account-request/custom-fields/cost_center in the vended account","symbol":"sources.aft-lambda-layer.aft_common.ssm:put_ssm_parameters"}],"summary":"Four Lambda tasks run in a fixed order — persist_metadata, create_role, tag_account, account_metadata_ssm — each receiving {action, payload = the whole state}. Then the state machine runs the feature-options state machine (journey 5) and the customer's aft-account-provisioning-customizations state machine, starts CodeBuild aft-create-pipeline to create the account's customizations pipeline, optionally starts aft-invoke-customizations for OU-move triggers, and publishes to SNS.","title":"4 · The provisioning framework prepares the new account","trigger":"StartExecution from aft-invoke-aft-account-provisioning-framework, from the action trigger (customization-only requests), or from the aft-invoke-customizations Map state"},{"actor":"Step Functions aft-features","id":"feature-options","steps":[{"action":"Lists regions with the target account's session; if SSM /aft/config/feature/delete-default-vpcs-enabled is 'true', for each region finds the default VPC and deletes its internet gateways, subnets, route tables, ACLs, security groups and the VPC, skipping unreachable regions. Note: the per-region clients are built from the Lambda's own session — see the finding.","actor":"Step Functions task 'Delete Default VPCs'","doc":"","file":"src/aft_lambda/aft_feature_options/aft_delete_default_vpc.py","line":51,"params":["event","context"],"receives":"{customization_request_id, account_info: {account: {id: '222222222222'}}}","returns":"None","symbol":"aft_lambda.aft_feature_options.aft_delete_default_vpc:lambda_handler"},{"action":"DescribeVpcs filtered on isDefault.","doc":"","file":"sources/aft-lambda-layer/aft_common/feature_options.py","line":36,"params":["client"],"receives":"an EC2 client for one region","returns":"VPC id or None","symbol":"sources.aft-lambda-layer.aft_common.feature_options:get_default_vpc"},{"action":"DeleteVpc, after the dependent resources were removed.","doc":"","file":"sources/aft-lambda-layer/aft_common/feature_options.py","line":65,"params":["client","vpc"],"receives":"client, vpc id","returns":"nothing","symbol":"sources.aft-lambda-layer.aft_common.feature_options:delete_vpc"},{"action":"If SSM /aft/config/feature/enterprise-support-enabled is 'true', calls ensure_enterprise_support_enrollment.","actor":"Step Functions task 'Enroll Enterprise Support' (Retry on Lambda service errors, 5×)","doc":"","file":"src/aft_lambda/aft_feature_options/aft_enroll_support.py","line":22,"params":["event","context"],"receives":"the same input","returns":"None","symbol":"aft_lambda.aft_feature_options.aft_enroll_support:lambda_handler"},{"action":"Skips when aft-request-metadata already flags the account; otherwise looks for an existing support case 'Add Account <id> to Enterprise Support' in the CT management account, opens one if none, and sets the flag afterwards so a failure retries.","doc":"","file":"sources/aft-lambda-layer/aft_common/premium_support.py","line":108,"params":["aft_session","ct_management_session","metadata_table_name","account_id"],"receives":"aft_session, ct_management_session, metadata_table_name, account_id","returns":"nothing","stores":"a support case in the CT management account; an enrollment flag on the aft-request-metadata row","symbol":"sources.aft-lambda-layer.aft_common.premium_support:ensure_enterprise_support_enrollment"},{"action":"If SSM /aft/config/feature/cloudtrail-data-events-enabled is 'true', makes sure the organization trail exists in the CT management account with data-event selectors and is logging (bucket and KMS key from SSM /aft/account/log-archive/*); if 'false', deletes that trail.","actor":"Step Functions task 'Enable CloudTrail'","doc":"","file":"src/aft_lambda/aft_feature_options/aft_enable_cloudtrail.py","line":33,"params":["event","context"],"receives":"the same input","returns":"None","symbol":"aft_lambda.aft_feature_options.aft_enable_cloudtrail:lambda_handler"},{"action":"CreateTrail: multi-region organization trail with log-file validation, into the log-archive bucket, KMS-encrypted.","doc":"","file":"sources/aft-lambda-layer/aft_common/feature_options.py","line":224,"params":["session","s3_bucket","kms_key"],"receives":"CT management session, bucket name, KMS key ARN","returns":"nothing","stores":"the AFT organization CloudTrail trail","symbol":"sources.aft-lambda-layer.aft_common.feature_options:create_trail"}],"summary":"Three Lambda tasks run in order, each switched on or off by an SSM flag under /aft/config/feature/. Each reads customization_request_id and account_info.account.id from the input; a failure in any of them goes to SNS aft-failure-notifications and fails the parent execution.","title":"5 · Feature options: default VPCs, Enterprise Support, CloudTrail","trigger":"startExecution.sync from the provisioning framework, input = the whole provisioning state"},{"actor":"operator · Step Functions console/CLI, or the provisioning framework on an OU move","id":"invoke-customizations","steps":[{"action":"Validates the request, resolves the target accounts, and builds one customization payload per account.","actor":"Step Functions task 'Identify Targets' (after a Pass state adds get_execution_id = the execution name)","doc":"","file":"src/aft_lambda/aft_customizations/aft_customizations_identify_targets.py","line":37,"params":["event","context"],"payload":"{\"include\": [{\"type\": \"ous\", \"target_value\": [\"Sandbox\"]}],\n \"exclude\": [{\"type\": \"accounts\", \"target_value\": [\"333333333333\"]}]}\n\n\n\n\n\n","receives":"{get_execution_id: {execution_id}, include: [{type: 'ous', target_value: ['Sandbox']}], exclude?: [...]}","returns":"{number_pending_accounts, pending_accounts, target_accounts_info: {bucket, key}}","symbol":"aft_lambda.aft_customizations.aft_customizations_identify_targets:lambda_handler"},{"action":"jsonschema against schemas/identify_targets_request_schema.json.","doc":"","file":"sources/aft-lambda-layer/aft_common/customizations.py","line":32,"params":["payload"],"receives":"the input","returns":"True, or raises ValidationError","symbol":"sources.aft-lambda-layer.aft_common.customizations:validate_identify_targets_request"},{"action":"Expands each selector — all (every id in aft-request-metadata), core, ous, tags, accounts — removes duplicates and keeps only AFT-managed or core accounts (filter_non_aft_accounts). get_excluded_accounts / get_target_accounts subtract the exclude list.","doc":"","file":"sources/aft-lambda-layer/aft_common/customizations.py","line":156,"params":["aft_management_session","ct_mgmt_session","orgs_agent","included"],"receives":"sessions, orgs_agent, include list","returns":"list of account ids","symbol":"sources.aft-lambda-layer.aft_common.customizations:get_included_accounts"},{"action":"Per account: email from Organizations, request from aft-request (get_account_request_record), then the same payload shape as journey 3, with an empty control_tower_event.","doc":"","file":"sources/aft-lambda-layer/aft_common/account_request_framework.py","line":321,"params":["ct_management_session","account_id","account_request","control_tower_event"],"receives":"ct_management_session, account_id, account_request, {}","returns":"AftInvokeAccountCustomizationPayload","symbol":"sources.aft-lambda-layer.aft_common.account_request_framework:build_account_customization_payload"},{"action":"Writes the list of payloads to S3 so the Map state can read it (Step Functions state size is limited). Unless bypass_steps contains provisioning_bootstrap, a distributed Map then starts the provisioning framework (journey 4) once per account, MaxConcurrency = maximum_concurrent_customizations.","doc":"","file":"sources/aft-lambda-layer/aft_common/customizations.py","line":243,"params":["aft_management_session","target_account_info","execution_id"],"receives":"session, payload list, execution_id","returns":"{bucket, key}","stores":"sfn/<execution id>/target_account_info.json in the bucket named by SSM /aft/config/customizations/aft_codepipeline_customizations_bucket_id","symbol":"sources.aft-lambda-layer.aft_common.customizations:upload_target_account_info"},{"action":"Records who started this execution: trigger_source account_move if customization_triggers is present, manual if bypass_steps is present, else account_request.","actor":"Step Functions task 'Record Audit' (errors are caught and the run continues)","doc":"Write an audit record for each aft-invoke-customizations SFN execution.","file":"src/aft_lambda/aft_customizations/aft_customizations_audit_trigger.py","line":24,"params":["event","context"],"receives":"the state","returns":"{status: 'recorded', execution_id}","stores":"one item in DynamoDB aft-customizations-audit","symbol":"aft_lambda.aft_customizations.aft_customizations_audit_trigger:lambda_handler"},{"action":"Counts customization pipelines whose latest execution is InProgress (list_pipelines + get_running_pipeline_count).","actor":"Step Functions task 'Get Pipeline Executions'","doc":"","file":"src/aft_lambda/aft_customizations/aft_customizations_get_pipeline_executions.py","line":23,"params":["event","context"],"receives":"the state","returns":"{running_pipelines: 2}","symbol":"aft_lambda.aft_customizations.aft_customizations_get_pipeline_executions:lambda_handler"},{"action":"Starts maximum_concurrent_customizations − running pipelines, removing each started account from pending_accounts; plan_only is passed through.","actor":"Step Functions task 'Execute Pipelines' (looped with a Wait state until no account is pending)","doc":"","file":"src/aft_lambda/aft_customizations/aft_customizations_execute_pipeline.py","line":25,"params":["event","context"],"receives":"{running_executions: {running_pipelines}, targets: {pending_accounts}}","returns":"{number_pending_accounts, pending_accounts}","symbol":"aft_lambda.aft_customizations.aft_customizations_execute_pipeline:lambda_handler"},{"action":"Finds the account's pipeline by its tag (get_pipeline_for_account) and StartPipelineExecution unless it is already running (PLAN_ONLY variable when asked).","doc":"","file":"sources/aft-lambda-layer/aft_common/codepipeline.py","line":76,"params":["session","account_id","plan_only"],"receives":"session, account_id, plan_only","returns":"nothing","stores":"a CodePipeline e , log archive, audit)."},{"id":"common-provisioning","name":"aft_common: provisioning and features","owns":"Work done inside or for a vended account: AWSAFTExecution / AWSAFTService role creation, account tags, the aft-request-metadata row, default-VPC and CloudTrail helpers, and Enterprise Support enrolment. ProvisionRoles also holds the AFT role-name constants that much of the library imports."},{"id":"common-customizations","name":"aft_common: customizations","owns":"Resolves an include/exclude target spec (all, core, ous, tags, accounts) into account ids from the metadata table and Organizations, and uploads the per-account payload list to S3 for the Map state."},{"id":"common-aws","name":"aft_common: AWS clients and auth","owns":"Thin wrappers over one AWS service each (SSM, DynamoDB, SQS, S3, SNS, Organizations, Service Catalog, Control Tower, CodePipeline), the cross-account session factory AuthClient, and the opt-in usage-metrics HTTP call."},{"id":"common-utils","name":"aft_common: utilities","owns":"Leaf helpers with no AWS calls of their own beyond what the caller passes in: SSM parameter-name constants, boto retry configs and the throttle-resubmit decorator, Lambda/Step Functions start helpers, log sanitising, the JSON logger, typed payloads and exceptions."},{"id":"build-and-scripts","name":"Layer build and CodeBuild scripts","owns":"Code that runs outside the request flow: the Lambda that builds the aft_common layer during terraform apply (it must not import aft_common), the layer's setup.py, and the Terraform Cloud / Enterprise workspace scripts that CodeBuild runs for account-request and customization pipelines."}],"lazyCycles":[],"meta":{"audience":"learning the code","lede":"AFT is a Terraform module that installs, in an AFT management account, a serverless pipeline that turns an account request committed to a Git repository into a new, tagged and customised AWS account in a Control Tower organization. A CodePipeline run writes each request to Dyna _handler"],"validation":"Best effort: every exception is caught and returned as status 'skipped', so auditing never stops a customization."},{"_locs":[{"doc":"","file":"src/aft_lambda/aft_feature_options/aft_delete_default_vpc.py","line":51,"params":["event","context"],"symbol":"aft_lambda.aft_feature_options.aft_delete_default_vpc:lambda_handler"}],"config":"defined in modules/aft-feature-options/lambda.tf (timeout 300 s); SSM /aft/config/feature/delete-default-vpcs-enabled.","id":"lambda-aft-delete-default-vpc-aft-feature-options-lambd","kind":"infra","logging":"customization_request_logger lines; failures to SNS aft-failure-notifications.","message":["invoked by: Step Functions aft_features ('Delete Default VPCs' task; the ARN is templated with a space in '${ aft_delete_default_vpc_function_arn}', which is why the extractor found no trigger)","aft_features is started synchronously by the provisioning state machine's aft_features state","told: the customization payload (customization_request_id, account_info ...)"],"name":"Lambda aft_delete_default_vpc","output":"Default VPCs deleted (see the finding about which account); unreachable regions skipped with a warning.","purpose":"First task of the aft-features state machine: when the delete-default-VPCs flag is on, removes the default VPC (gateways, subnets, route tables, ACLs, security groups) region by region.","result_use":"may use: ec2 Describe*/Delete* on '*' in the AFT management account (its own role), sts:AssumeRole AWSAFTAdmin (target account, used to list regions), SNS, KMS.","symbols":["aft_lambda.aft_feature_options.aft_delete_default_vpc:lambda_handler"],"validation":"Region endpoint timeouts are skipped; any other error goes to the state machine's Notify Failure."},{"_locs":[{"doc":"","file":"src/aft_lambda/aft_feature_options/aft_enroll_support.py","line":22,"params":["event","context"],"symbol":"aft_lambda.aft_feature_options.aft_enroll_support:lambda_handler"}],"config":"defined in modules/aft-feature-options/lambda.tf (timeout 300 s); SSM /aft/config/feature/enterprise-support-enabled, /aft/resources/ddb/aft-request-metadata-table-name.","id":"lambda-aft-enroll-support-aft-feature-options-lambda","kind":"infra","logging":"customization_request_logger lines; failures to SNS.","message":["invoked by: Step Functions aft_features ('Enroll Enterprise Support' task, with Retry: 30 s interval, max delay 300 s)","told: the customization payload"],"name":"Lambda aft_enroll_support","output":"Possibly a support case in the CT management account; enterprise_support_case_created = 'true' on aft-request-metadata.","purpose":"Second task of the aft-features state machine: when enterprise support is enabled, makes sure one support case asking to add the account to Enterprise Support exists, and records that on the metadata row.","result_use":"may use: DynamoDB aft-request-metadata (GetItem, UpdateItem), Support API in CT management via AWSAFTAdmin → AWSAFTService, SNS, KMS.","symbols":["aft_lambda.aft_feature_options.aft_enroll_support:lambda_handler"],"validation":"Idempotent through the flag and a DescribeCases subject search; see the finding about the flag being overwritten."},{"_locs":[{"doc":"","file":"src/aft_lambda/aft_feature_options/aft_enable_cloudtrail.py","line":33,"params":["event","context"],"symbol":"aft_lambda.aft_feature_options.aft_enable_cloudtrail:lambda_handler"}],"config":"defined in modules/aft-feature-options/lambda.tf (timeout 300 s); SSM /aft/config/feature/cloudtrail-data-events-enabled, /aft/account/log-archive/log_bucket_arn, /aft/account/log-archive/kms_key_arn.","id":"lambda-aft-enable-cloudtrail-aft-feature-options-lambda","kind":"infra","logging":"customization_request_logger lines; failures to SNS.","message":["invoked by: Step Functions aft_features ('Enable CloudTrail' task)","told: the customization payload (only the id and request id are used)"],"name":"Lambda aft_enable_cloudtrail","output":"Trail created / event selectors put / logging started, or the trail deleted.","purpose":"Third task of the aft-features state machine: keeps the organisation trail aws-aft-CustomizationsCloudTrail (S3 and Lambda data events to the log-archive bucket) in the CT management account in line with the flag: create and start it when on, delete it when off.","result_use":"may use: CloudTrail in CT management and S3 listing in log archive, both through AWSAFTAdmin → AWSAFTService; SNS; KMS.","symbols":["aft_lambda.aft_feature_options.aft_enable_cloudtrail:lambda_handler"],"validation":"Each step checks current state first, so reruns are no-ops."},{"_locs":[{"doc":"","file":"src/aft_lambda/aft_builder/codebuild_trigger.py","line":23,"params":["event","context"],"symbol":"aft_lambda.aft_builder.codebuild_trigger:lambda_handler"}],"config":"defined in modules/aft-lambda-layer/lambda.tf (timeout 900 s, function name local.codebuild_trigger_function_name).","id":"lambda-codebuild-trigger-aft-lambda-layer-lambda","kind":"infra","logging":"Its own CloudWatch log group; no SNS (it deliberately does not import aft_common).","message":["invoked by: Terraform data source aws_lambda_invocation.trigger_codebuild_job in modules/aft-lambda-layer/lambda.tf, on every plan/apply","told: {codebuild_project_name}"],"name":"Lambda codebuild_trigger","output":"{Status: 200} on SUCCEEDED; Terraform exposes it as output lambda_layer_build_status.","purpose":"Builds the aft_common Lambda layer during terraform apply: starts the layer CodeBuild project and waits (up to 14 minutes) for it to succeed, so the layer version exists before the other Lambdas are created.","result_use":"may use: codebuild:StartBuild and BatchGetBuilds on the layer project (role codebuild_trigger_role).","symbols":["aft_lambda.aft_builder.codebuild_trigger:lambda_handler"],"validation":"Raises on any non-success terminal status or after 14 minutes, which fails the terraform run."},{"_locs":[{"doc":"Leverages a hub session from AFT Management, and federates to a spoke IAM role within a target account","file":"sources/aft-lambda-layer/aft_common/auth.py","line":130,"params":["self","account_id","hub_session","role_name","region","session_duration","session_policy"],"symbol":"sources.aft-lambda-layer.aft_common.auth:AuthClient.get_target_account_session"},{"doc":"Assumes a hub role, \"AWSAFTAdmin\" in the AFT Management account which is trusted by all \"AWSAFTExecution\" roles in all managed accounts","file":"sources/aft-lambda-layer/aft_common/auth.py","line":106,"params":["self","session_duration"],"symbol":"sources.aft-lambda-layer.aft_common.auth:AuthClient._get_hub_session"},{"doc":"","file":"sources/aft-lambda-layer/aft_common/auth.py","line":176,"params":["self","role_name","region","session_policy","session_duration"],"symbol":"sources.aft-lambda-layer.aft_common.auth:AuthClient.get_ct_management_session"},{"doc":"","file":"sources/aft-lambda-layer/aft_common/auth.py","line":195,"params":["self","role_name","region","session_policy","session_duration"],"symbol":"sources.aft-lambda-layer.aft_common.auth:AuthClient.get_log_archive_session"},{"doc":"","file":"sources/aft-lambda-layer/aft_common/auth.py","line":72,"params":["session","role_arn","assume_role_session_name","assume_role_session_duration","region","session_policy","external_id"],"symbol":"sources.aft-lambda-layer.aft_common.auth:AuthClient._get_session"},{"doc":"","file":"sources/aft-lambda-layer/aft_common/auth.py","line":53,"params":["session"],"symbol":"sources.aft-lambda-layer.aft_common.auth:AuthClient._is_aft_management_session"}],"config":"SSM /aft/account/aft-management/account-id (the constructor refuses to run unless the caller's account equals it), /aft/resources/iam/aft-session-name, /aft/resources/iam/aft-administrator-role-name, /aft/resources/iam/aft-execution-role-name. The names themselves come from locals.tf (aft_execution_role_name, aft_administrator_role_name, aft_session_name).","cost":"not measured; each get_*_session call is two AssumeRole calls (hub + spoke) and no session is cached across calls.","id":"aws-cross-account-auth","input":"Role ARNs are built from the partition, the account id (target, or read from SSM /aft/account/ct-management/account-id, /aft/account/log-archive/account-id) and the role name (argument, or SSM /aft/resources/iam/aft-execution-role-name and /aft/resources/iam/aft-administrator-role-name).","kind":"external","logging":"Logs the hub caller ARN and the spoke role ARN to the Lambda's CloudWatch log group.","message":["sts:AssumeRole on arn:<partition>:iam::<aft-mgmt>:role/AWSAFTAdmin (hub)","sts:AssumeRole from the hub on arn:<partition>:iam::<target>:role/<spoke role> with RoleSessionName from SSM /aft/resources/iam/aft-session-name, DurationSeconds 900 by default, optional session Policy and ExternalId"],"name":"Cross-account sessions (STS hub and spoke)","output":"A boto3 Session holding the temporary credentials, in the requested region (default: the caller's region). Success is simply that AssumeRole returned credentials.","purpose":"Every call AFT makes outside its own account goes through AuthClient: it assumes the hub role AWSAFTAdmin in the AFT management account, then from that hub assumes a spoke role (AWSAFTExecution by default, or AWSAFTService) in the Control Tower management, log-archive or target account.","result_use":"Callers build service clients from the returned session: Organizations / Service Catalog / Control Tower in the CT management account, IAM and SSM in the target account, CloudTrail in CT management, S3 in log archive.","symbols":["sources.aft-lambda-layer.aft_common.auth:AuthClient.get_target_account_session","sources.aft-lambda-layer.aft_common.auth:AuthClient._get_hub_session","sources.aft-lambda-layer.aft_common.auth:AuthClient.get_ct_management_session","sources.aft-lambda-layer.aft_common.auth:AuthClient.get_log_archive_session","sources.aft-lambda-layer.aft_common.auth:AuthClient._get_session","sources.aft-lambda-layer.aft_common.auth:AuthClient._is_aft_management_session"],"validation":"No retry wrapper: a ClientError from AssumeRole propagates to the handler, which publishes to the failure topic and re-raises. ProvisionRoles._ensure_role_can_be_assumed is the one place that polls (every 5 s for up to 1 minute) until a freshly created role can be assumed."},{"_locs":[{"doc":"","file":"sources/aft-lambda-layer/aft_common/account_request_framework.py","line":181,"params":["session","ct_management_session","request"],"symbol":"sources.aft-lambda-layer.aft_common.account_request_framework:create_new_account"},{"doc":"","file":"sources/aft-lambda-layer/aft_common/account_request_framework.py","line":223,"params":["session","ct_management_session","request"],"symbol":"sources.aft-lambda-layer.aft_common.account_request_framework:update_existing_account"},{"doc":"","file":"sources/aft-lambda-layer/aft_common/service_catalog.py","line":41,"params":["session","ct_management_session"],"symbol":"sources.aft-lambda-layer.aft_common.service_catalog:get_ct_product_id"},{"doc":"","file":"sources/aft-lambda-layer/aft_common/service_catalog.py","line":77,"params":["session","ct_management_session"],"symbol":"sources.aft-lambda-layer.aft_common.service_catalog:get_ct_provisioning_artifact_id"},{"doc":"","file":"sources/aft-lambda-layer/aft_common/service_catalog.py","line":152,"params":["record"],"symbol":"sources.aft-lambda-layer.aft_common.service_catalog:get_account_id_if_enrolled"},{"doc":"Associates the AWSAFTService role with the Control Tower Account Factory Service Catalog portfolio","file":"sources/aft-lambda-layer/aft_common/account_request_framework.py","line":392,"params":["self"],"symbol":"sources.aft-lambda-layer.aft_common.account_request_framework:AccountRequest.associate_aft_service_role_with_account_factory"},{"doc":"Returns the count of enabled CT baselines currently in UNDER_CHANGE status. This is used to determine if the concurrent account provisioning threshold has been reached.","file":"sources/aft-lambda-layer/aft_common/control_tower.py","line":84,"params":["self"],"symbol":"sources.aft-lambda-layer.aft_common.control_tower:ControlTowerFacade.get_enabled_baselines_under_change_count"}],"config":"SSM /aft/resources/sc/account-factory-product-name, /aft/config/aft/version; env AFT_PROVISIONING_CONCURRENCY (from Terraform var concurrent_account_factory_actions) for the threshold.","cost":"not measured; Control Tower limits concurrent account operations, which is why the threshold check exists.","id":"aws-service-catalog-ct","input":"The control_tower_parameters map of the request (AccountEmail, AccountName, ManagedOrganizationalUnit, SSOUserEmail, SSOUserFirstName, SSOUserLastName), the product name from SSM /aft/resources/sc/account-factory-product-name, and the AFT version from SSM /aft/config/aft/version for the User-Agent header.","kind":"external","logging":"Sanitised parameters and responses in the processor's CloudWatch log; failures go to SNS aft-failure-notifications.","message":["servicecatalog:DescribeProductAsAdmin (product id + an active provisioning artifact)","servicecatalog:ProvisionProduct with ProvisionedProductName = AccountName with spaces turned into hyphens, ProvisioningParameters = control_tower_parameters, ProvisionToken = uuid1 (ADD)","servicecatalog:SearchProvisionedProducts physicalId:<account id> then UpdateProvisionedProduct (UPDATE)","servicecatalog:ListPortfolios + AssociatePrincipalWithPortfolio for AWSAFTService (every processor run)","controltower:ListBaselines + ListEnabledBaselines status UNDER_CHANGE (threshold check)","User-Agent: account-factory-terraform-<version> added before signing"],"name":"Control Tower Account Factory (Service Catalog + Control Tower API)","output":"ProvisionProduct returns a record detail; AFT only logs it. Account creation finishes asynchronously and is reported back as a Control Tower CreateManagedAccount / UpdateManagedAccount event.","purpose":"The only way AFT creates or changes an account: it provisions or updates the Control Tower Account Factory product in Service Catalog (in the CT management account, as AWSAFTService), and asks the Control Tower API how many account baselines are still UNDER_CHANGE to throttle itself.","result_use":"Nothing reads the ProvisionProduct response; the follow-up is driven by the Control Tower lifecycle event on EventBridge.","symbols":["sources.aft-lambda-layer.aft_common.account_request_framework:create_new_account","sources.aft-lambda-layer.aft_common.account_request_framework:update_existing_account","sources.aft-lambda-layer.aft_common.service_catalog:get_ct_product_id","sources.aft-lambda-layer.aft_common.service_catalog:get_ct_provisioning_artifact_id","sources.aft-lambda-layer.aft_common.service_catalog:get_account_id_if_enrolled","sources.aft-lambda-layer.aft_common.account_request_framework:AccountRequest.associate_aft_service_role_with_account_factory","sources.aft-lambda-layer.aft_common.control_tower:ControlTowerFacade.get_enabled_baselines_under_change_count"],"validation":"Fresh ProvisionToken / UpdateToken on every call, so a retried message is a new provisioning attempt, not an idempotent replay. update_existing_account raises when no AVAILABLE/TAINTED product with a successful provisioning record exists. Read-side Service Catalog clients use the 16-attempt adaptive retry config; ProvisionProduct uses the default client."},{"_locs":[{"doc":"","file":"sources/aft-lambda-layer/aft_common/organizations.py","line":287,"params":["self","email","ou_name"],"symbol":"sources.aft-lambda-layer.aft_common.organizations:OrganizationsAgent.get_account_id_from_email"},{"doc":"","file":"sources/aft-lambda-layer/aft_common/organizations.py","line":306,"params":["self","account_id"],"symbol":"sources.aft-lambda-layer.aft_common.organizations:OrganizationsAgent.get_aft_account_info"},{"doc":"","file":"sources/aft-lambda-layer/aft_common/organizations.py","line":260,"params":["self","resource","tags","rollback"],"symbol":"sources.aft-lambda-layer.aft_common.organizations:OrganizationsAgent.tag_org_resource"},{"doc":"Find an account by email using Organizations ListAccounts. Returns the account if found, None otherwise.","file":"sources/aft-lambda-layer/aft_common/organizations.py","line":115,"params":["self","email"],"symbol":"sources.aft-lambda-layer.aft_common.organizations:OrganizationsAgent.get_account_by_email"},{"doc":"","file":"sources/aft-lambda-layer/aft_common/account_request_framework.py","line":121,"params":["ct_management_session","account_name","account_email"],"symbol":"sources.aft-lambda-layer.aft_common.account_request_framework:account_name_or_email_in_use"},{"doc":"","file":"sources/aft-lambda-layer/aft_common/shared_account.py","line":23,"params":["event_record","auth"],"symbol":"sources.aft-lambda-layer.aft_common.shared_account:shared_account_request"}],"config":"Reached only through AuthClient.get_ct_management_session (AWSAFTExecution or AWSAFTService in the CT management account). Clients use the 16-attempt adaptive retry config.","cost":"not measured; ListAccounts walks the whole organisation on every new OrganizationsAgent.","id":"aws-organizations","input":"Account email (the aft-request id), account id, OU names in plain or nested 'Name (ou-xxxx)' format, the account_tags map from the request.","kind":"external","logging":"Account details and lookups in the caller's CloudWatch log.","message":["organizations:ListAccounts (paginated, memoised per OrganizationsAgent instance)","organizations:DescribeAccount, ListParents, ListOrganizationalUnitsForParent, ListAccountsForParent","organizations:TagResource on the account id"],"name":"AWS Organizations (CT management account)","output":"Account ids, emails, an AftAccountInfo dict (id, email, name, joined_method, joined_date, status, parent_id, parent_type), or an exception when the email is not in the organisation.","purpose":"The source of truth for which accounts exist: maps the request key (account email)
