purpose = "The only place that talks to the Account Factory: every 5 minutes it checks the Control Tower concurrency threshold, takes at most one message from the FIFO queue, validates it and provisions or updates the account through Service Catalog."
message = ["invoked by: EventBridge rule aft-lambda-account-request-processor (rate(5 minutes))", "told: nothing useful (the scheduled event is ignored); work comes from the queue"]
config = "defined in modules/aft-account-request-framework/lambda.tf (timeout 300 s); env AFT_PROVISIONING_CONCURRENCY = var.concurrent_account_factory_actions; SSM /aft/resources/sqs/aft-request-queue-name, /aft/resources/sc/account-factory-product-name, /aft/config/aft/version."
output = "A ProvisionProduct or UpdateProvisionedProduct call in the CT management account; the SQS message deleted; a metrics event when enabled."
