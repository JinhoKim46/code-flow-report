logging = "CloudWatch /aws/lambda/aft-account-request-processor; failures to SNS aft-failure-notifications."
result_use = "may use: SQS aft-account-request.fifo (ReceiveMessage, DeleteMessage), sts:AssumeRole AWSAFTAdmin (then AWSAFTService in CT management for Service Catalog, Organizations, Control Tower), ssm:GetParameter /aft/*, SNS topics, KMS key aft."

