config = "SSM /aft/config/terraform/oidc-integration, /aft/config/terraform/oidc-aws-audience (via the buildspecs)."
output = "Credentials dict from STS; workspace vars written."
validation = "No retry; a failure fails the CodeBuild job."
logging = "print() lines in the CodeBuild log naming the vars added or removed."
cost = "not measured."
result_use = "The Terraform run in the workspace uses those credentials for the target account."

[[roles]]
id = "aws-s3"
