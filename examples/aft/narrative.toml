[[input_flows]]
id = "account-request-record"
source = "Account request item written to DynamoDB aft-request by the customer's Terraform (arrives as a stream record)"
sink = "SQS aft-account-request.fifo, then a Service Catalog ProvisionProduct / UpdateProvisionedProduct in the CT management account"
  [[input_flows.steps]]
  symbol = "sources.aft-lambda-layer.aft_common.account_request_record_handler:AccountRequestRecordHandler"
  guard = "_validate_event checks only that Records[0].eventSource is aws:dynamodb. The item's shape is trusted: a missing control_tower_parameters raises KeyError (→ SNS failure, one stream retry, then the record is dropped)."
  [[input_flows.steps]]
  symbol = "sources.aft-lambda-layer.aft_common.shared_account:shared_account_request"
  guard = "A request naming a shared core account is never sent to Account Factory; asking to move one to another OU raises."
  [[input_flows.steps]]
  symbol = "sources.aft-lambda-layer.aft_common.account_request_framework:new_ct_request_is_valid"
  guard = "ADD: rejected if AccountName or AccountEmail is already in use in Organizations (emails compared case-insensitively by emails_are_equal). No format check of the values here."
  [[input_flows.steps]]
  symbol = "sources.aft-lambda-layer.aft_common.account_request_framework:modify_ct_request_is_valid"
  guard = "UPDATE: every old control_tower_parameters key except ManagedOrganizationalUnit must be unchanged."
  [[input_flows.steps]]
  symbol = "sources.aft-lambda-layer.aft_common.account_request_framework:create_new_account"
  guard = "Every key of control_tower_parameters is forwarded as a provisioning parameter without an allow-list; Service Catalog's product definition is what rejects unknown or malformed parameters."

[[input_flows]]
id = "controltower-event"
source = "Event on EventBridge bus aft-events-from-ct-management (sent by the CT management account)"
sink = "DynamoDB aft-controltower-events and a StartExecution of the provisioning framework"
  [[input_flows.steps]]
  symbol = "aft_lambda.aft_account_request_framework.aft_controltower_event_logger:lambda_handler"
  guard = "None in code: the rule matches any event whose account is the CT management account, and the whole event is stored as-is. The bus policy lets only that account put events; its forwarding rule only sends CreateManagedAccount / UpdateManagedAccount."
  [[input_flows.steps]]
  symbol = "sources.aft-lambda-layer.aft_common.aft_utils:is_aft_supported_controltower_event"
  guard = "Only source aws.controltower with one of the two event names is treated as a CT event; other events either carry account_request or raise 'unrecognized event type' (SNS failure)."
  [[input_flows.steps]]
  symbol = "sources.aft-lambda-layer.aft_common.account_request_framework:get_account_request_record"
  guard = "The account must have a record in aft-request (looked up by the email Organizations reports); an account Control Tower created outside AFT raises here and never reaches the state machine."

[[input_flows]]
id = "customization-request"
source = "Input of a StartExecution on Step Functions aft-invoke-customizations (operator, or the provisioning framework on an OU move)"
sink = "S3 target-account list, provisioning-framework executions and per-account customization CodePipelines"
  [[input_flows.steps]]
  symbol = "sources.aft-lambda-layer.aft_common.customizations:validate_identify_targets_request"
  guard = "jsonschema requires get_execution_id.execution_id (set by the state machine from the execution name, not by the caller) and include with 1–4 unique items that each have a type. type is not restricted to the known values, so a misspelled selector silently selects no accounts."
  [[input_flows.steps]]
  symbol = "sources.aft-lambda-layer.aft_common.customizations:filter_non_aft_accounts"
  guard = "Included account ids that are neither in aft-request-metadata nor core accounts are dropped, so a caller cannot point customizations at an arbitrary account in the organization."
  [[input_flows.steps]]
  symbol = "aft_lambda.aft_customizations.aft_customizations_execute_pipeline:lambda_handler"
  guard = "Concurrency capped by SSM maximum_concurrent_customizations minus pipelines already InProgress; a pipeline already running is not started twice."

[[findings]]
id = "delete-default-vpc-wrong-account"
severity = "medium"
category = "risk"
title = "Default-VPC deletion runs against the AFT management account, not the vended account"
detail = "True now: lambda_handler gets a target_account_session but uses it only to list regions; inside the region loop it builds boto3.session.Session(region_name=region) and boto3.resource('ec2', region_name=region) — the Lambda's own credentials in the AFT management account (its log line even says 'for AFT management account'). Its IAM policy grants ec2:Delete* on '*' in that account. Trigger: aft_feature_delete_default_vpcs_enabled = true. Reach: the first provisioning run deletes the AFT management account's default VPC (and subnets, gateways, route tables, ACLs, security groups) in every region the vended account has enabled, and fails if one is in use; the vended accounts keep theirs. The flag's description says only 'deletion of default VPCs'; that the Lambda runs once per vended account, with that account's id, suggests the vended accounts were the target."
symbols = ["aft_lambda.aft_feature_options.aft_delete_default_vpc:lambda_handler"]
evidence = "Read aft_delete_default_vpc:lambda_handler and modules/aft-feature-options/iam/role-policies/aft_delete_default_vpc_lambda.tpl; feature_options.get_default_vpc/delete_* use whatever client/resource they are given."
check = {kind = "text_in", pattern = "boto3\\.session\\.Session\\(region_name=region\\)"}

[[findings]]
id = "identify-targets-list-mutated-while-iterating"
severity = "medium"
category = "risk"
title = "A closed account makes Identify Targets skip the next account's provisioning run"
detail = "True now: the loop 'for account_id in target_accounts' calls target_accounts.remove(account_id) when Organizations answers AccountNotFoundException. Removing from the list being iterated skips the following element. Trigger: an AFT account that was closed or suspended but still has a row in aft-request-metadata (cleanup only runs when the request item is deleted) and is selected by include. Reach: the next account gets no payload, so the Map state never re-runs the provisioning framework for it, yet it stays in pending_accounts and its customization pipeline is still started — one account per closed account, silently."
symbols = ["aft_lambda.aft_customizations.aft_customizations_identify_targets:lambda_handler"]
evidence = "Read aft_customizations_identify_targets:lambda_handler (the loop and the returned pending_accounts) and the 'Invoke Provisioning Framework' Map in modules/aft-customizations/states/invoke_customizations.asl.json, which reads only target_accounts_info."
check = {kind = "text_in", pattern = "target_accounts\\.remove\\(account_id\\)"}

[[findings]]
id = "processor-one-request-per-run"
severity = "low"
category = "risk"
title = "At most one account request is started per 5-minute run"
detail = "True now: receive_sqs_message asks for MaxNumberOfMessages=1 and the processor handles that one message and returns; the rule fires every 5 minutes. Trigger: a batch of new account requests (e.g. 50 committed at once). Reach: about 12 requests per hour at best, whatever AFT_PROVISIONING_CONCURRENCY allows — 50 requests take over four hours just to be submitted. Performance only; nothing is lost."
symbols = ["sources.aft-lambda-layer.aft_common.sqs:receive_sqs_message"]
evidence = "Read sqs:receive_sqs_message, aft_account_request_processor:lambda_handler and the rate(5 minutes) rule in modules/aft-account-request-framework/eventbridge.tf."
check = {kind = "text_in", pattern = "MaxNumberOfMessages=1"}

[[findings]]
id = "ssm-cache-never-expires"
severity = "low"
category = "risk"
title = "SSM parameter values are cached for the life of a warm Lambda"
detail = "True now: get_ssm_parameter_value stores every value in the module-level _ssm_cache and never expires it. Trigger: an operator changes an AFT setting through Terraform — a feature flag, maximum_concurrent_customizations, customization-triggers. Reach: every Lambda container already warm keeps using the old value until AWS recycles it, so the change takes effect unevenly for minutes to hours."
symbols = ["sources.aft-lambda-layer.aft_common.ssm:get_ssm_parameter_value"]
evidence = "Read aft_common/ssm.py: _ssm_cache dict, get_ssm_parameter_value returns the cached value before calling GetParameter."
check = {kind = "text_in", pattern = "_ssm_cache\\[param\\] = param_value"}

[[findings]]
id = "skip-triggers-attribute-not-in-module"
severity = "low"
category = "doc vs code"
title = "The documented per-account opt-out cannot be set through the shipped account-request module"
detail = "variables.tf (aft_customization_triggers) says 'Per-account opt-out via account_skip_customization_triggers attribute in aft-request', and detect_customization_triggers does read that attribute. But the aft-account-request Terraform module that writes aft-request items (modules/aft-account-request/ddb.tf) has a fixed item with no such attribute and no variable for it. Trigger: a customer enables account_move and tries to opt one account out. Reach: the opt-out is unreachable unless they edit the module or write items by hand."
symbols = ["aft_lambda.aft_account_request_framework.aft_invoke_aft_account_provisioning_framework:detect_customization_triggers"]
evidence = "grep for account_skip_customization_triggers: only variables.tf/README.md and detect_customization_triggers; read sources/aft-customizations-repos/aft-account-request/terraform/modules/aft-account-request/ddb.tf."
check = {kind = "text_in", pattern = "account_skip_customization_triggers"}

[[findings]]
id = "metadata-ssm-session-policy-dollar"
severity = "info"
category = "risk"
title = "A stray '$' makes one session-policy statement match nothing"
detail = "True now: the session policy in account_metadata_ssm's handler builds the sts:AssumeRole resource as f\"...:role/${ProvisionRoles.EXECUTION_ROLE_NAME}\", which renders as role/$AWSAFTExecution. Trigger: none today — the handler never assumes a role with that session. Reach: harmless, but someone who later relies on the statement will find it never grants anything."
symbols = ["aft_lambda.aft_account_provisioning_framework.aft_account_provisioning_framework_account_metadata_ssm:lambda_handler"]
evidence = "Read the aft_ssm_session_policy literal in the handler; the session is used only for get_ssm_parameters_names_by_path, delete_ssm_parameters and put_ssm_parameters."
check = {kind = "text_in", pattern = "role/\\$\\{ProvisionRoles"}

[[findings]]
id = "cleanup-error-path-unbound"
severity = "low"
category = "risk"
title = "Cleanup Lambda can lose its own error report"
detail = "True now: aft_cleanup_resources builds AuthClient and aft_management_session inside the try, while the except block passes aft_management_session to send_lambda_failure_sns_message. Trigger: AuthClient() or get_aft_management_session fails (e.g. STS or SSM unavailable). Reach: the except raises UnboundLocalError instead, no SNS failure message is sent, and the log shows the wrong error for that deletion."
symbols = ["aft_lambda.aft_account_request_framework.aft_cleanup_resources:lambda_handler"]
evidence = "Read aft_cleanup_resources:lambda_handler; compare aft_invoke_aft_account_provisioning_framework:lambda_handler, which also assigns aft_management_session inside try but builds AuthClient outside it."
check = {kind = "text_in", pattern = "try:\\s+auth = AuthClient\\(\\)"}

[[findings]]
id = "processor-no-retry-dlq-after-one-failure"
severity = "medium"
category = "risk"
title = "One failed processor run sends the account request to the DLQ, and nothing reads the DLQ"
detail = "True now: the queue's redrive policy has maxReceiveCount = 1 and the processor deletes the message only after the Service Catalog call succeeds. Any exception before delete_sqs_message (a throttled Organizations or Service Catalog call, a Control Tower error, a Lambda timeout) leaves the message received once, so the next receive moves it to aft-account-request-dlq.fifo. The Lambda timeout (300 s) is also longer than the queue's visibility timeout (240 s). No code or alarm reads the DLQ. Trigger: any transient error while handling a message. Reach: that one account is never created or updated until someone redrives the DLQ or re-touches the request; the only signal is the SNS failure message sent at the time."
symbols = ["aft_lambda.aft_account_request_framework.aft_account_request_processor:lambda_handler"]
evidence = "Read aft_account_request_processor:lambda_handler (delete_sqs_message after create_new_account / update_existing_account), modules/aft-account-request-framework/sqs.tf (visibility_timeout_seconds 240, maxReceiveCount 1) and lambda.tf (timeout 300); grep for dlq / cloudwatch_metric_alarm over modules found nothing else."

[[findings]]
id = "fifo-unique-group-id"
severity = "low"
category = "risk"
title = "Every queue message gets its own MessageGroupId, so the FIFO queue neither orders nor de-duplicates requests"
detail = "True now: send_sqs_message sets MessageGroupId and MessageDeduplicationId to a new uuid1 for each message. SQS FIFO only orders within a group, so ADD and a later UPDATE for the same email may be delivered in either order, and a repeated stream delivery creates a second message. Trigger: a customer changes control_tower_parameters (for example the OU) before the processor has taken the ADD. Reach: the UPDATE taken first fails in update_existing_account ('No healthy provisioned product') and, by the finding above, lands in the DLQ."
symbols = ["sources.aft-lambda-layer.aft_common.sqs:send_sqs_message"]
evidence = "Read sqs:send_sqs_message and account_request_framework:insert_msg_into_acc_req_queue; the processor's one-message-per-run receive is the only serialisation."
check = {kind = "text_in", pattern = "MessageGroupId=unique_id"}

[[findings]]
id = "stream-record-dropped-after-one-retry"
severity = "low"
category = "risk"
title = "A failed aft-request stream record is retried once and then dropped"
detail = "True now: both event source mappings on the aft-request stream set maximum_retry_attempts = 1 and have no on-failure destination. Trigger: the action trigger fails twice on a record (for example an Organizations throttle while checking shared accounts). Reach: that request change is never queued or audited; the failure SNS message is the only trace, and the customer has to change the request again to retry it."
symbols = ["aft_lambda.aft_account_request_framework.aft_account_request_action_trigger:lambda_handler"]
evidence = "Read modules/aft-account-request-framework/lambda.tf (aws_lambda_event_source_mapping blocks: batch_size 1, starting_position LATEST, maximum_retry_attempts 1, no destination_config) and the handler's except block (SNS publish then re-raise)."

[[findings]]
id = "support-flag-overwritten-by-persist-metadata"
severity = "low"
category = "risk"
title = "persist_metadata overwrites the row that holds the Enterprise Support flag, so every run re-checks support cases"
detail = "True now: persist_metadata does a full put_item of the aft-request-metadata row without enterprise_support_case_created, and it is the first task of every provisioning run (including every customizations re-run). aft_enroll_support then finds no flag and falls back to DescribeCases, which only returns cases from the last 12 months, and creates a case anyway when that call is throttled. Trigger: enterprise support enabled and an account re-customised more than 12 months after its case, or a throttled DescribeCases. Reach: a duplicate 'Add Account <id> to Enterprise Support' case per affected account per run."
symbols = ["sources.aft-lambda-layer.aft_common.account_provisioning_framework:persist_metadata"]
evidence = "Read account_provisioning_framework:persist_metadata (item has no support field; ddb.put_ddb_item), premium_support:ensure_enterprise_support_enrollment and set_enrollment_flag_in_metadata, and the ASL (persist_metadata is StartAt; aft_features runs later)."
check = {kind = "calls", target = "sources.aft-lambda-layer.aft_common.ddb:put_ddb_item"}

[[findings]]
id = "metrics-post-without-timeout"
severity = "low"
category = "risk"
title = "The usage-metrics POST has no timeout and sits between provisioning and deleting the queue message"
detail = "True now: AFTMetrics.post_event calls requests.post without a timeout. In the processor it runs after create_new_account / update_existing_account and before delete_sqs_message; the try/except around it only catches errors, not a hang. Trigger: metrics reporting enabled and the endpoint unreachable through a proxy or NAT that never answers. Reach: the processor hits its 300 s timeout after the account operation has already started; the message is not deleted and goes to the DLQ."
symbols = ["sources.aft-lambda-layer.aft_common.metrics:AFTMetrics.post_event"]
evidence = "Read metrics:AFTMetrics.post_event (requests.post(self.api_endpoint, json=payload)) and the processor's call order."
check = {kind = "text_in", pattern = "requests\\.post\\(self\\.api_endpoint, json=payload\\)"}

[[findings]]
id = "tag-rollback-dead-and-broken"
severity = "low"
category = "dead code"
title = "The tag rollback path is never used and would fail if it were"
detail = "True now: tag_org_resource(rollback=True) re-tags with the whole list_tags_for_resource response dict instead of its 'Tags' list, and no state machine or code sets 'rollback' in the tag_account input. Trigger: someone wires rollback in. Reach: that call would raise a parameter-validation error; today nothing is affected."
symbols = ["sources.aft-lambda-layer.aft_common.organizations:OrganizationsAgent.tag_org_resource"]
evidence = "Read OrganizationsAgent.tag_org_resource and the tag_account handler; grep for '\"rollback\"' over modules/ and sources/ found no producer."
check = {kind = "text_in", pattern = "Tags=cast\\(Sequence\\[TagTypeDef\\], current_tags\\)"}

[[findings]]
id = "terraform-client-delete-precedence"
severity = "low"
category = "risk"
title = "terraform_client.__delete reports almost any non-JSON response as success"
detail = "True now: the fallback is 'response.status_code >= 200 & response.status_code <= 299'; & binds tighter than the comparisons, so it evaluates as a chained comparison against (200 & status) and is true for typical error codes such as 404 or 500. Trigger: a DELETE to the Terraform API that fails with a non-JSON body. Reach: workspace or variable deletion in the CodeBuild scripts is treated as done when it was not."
symbols = ["sources.scripts.terraform_client:__delete"]
evidence = "Read terraform_client:__delete; worked through 404 (200 & 404 = 128, so 404 >= 128 <= 299 is True)."
check = {kind = "text_in", pattern = "status_code >= 200 &"}

[[findings]]
id = "map-itemreader-hardcoded-partition"
severity = "low"
category = "doc vs code"
title = "The customizations Map reads its target list with a hard-coded 'arn:aws' resource"
detail = "True now: invoke_customizations.asl.json uses Resource 'arn:aws:states:::s3:getObject' for the Map ItemReader, while every other ARN in the state machines is built from ${current_partition} and the Python derives the partition at run time (get_aws_partition). Trigger: deploying AFT in a non-commercial partition (aws-us-gov, aws-cn). Reach: the 'Invoke Provisioning Framework' Map cannot read the object that upload_target_account_info writes, so customizations runs that do not bypass provisioning fail."
symbols = ["sources.aft-lambda-layer.aft_common.customizations:upload_target_account_info"]
evidence = "grep 'arn:aws:' over modules/ JSON and templates returned only this line in modules/aft-customizations/states/invoke_customizations.asl.json."

[[findings]]
id = "stale-invoke-lambda-wiring"
severity = "info"
category = "dead code"
title = "The action trigger starts the state machine directly; the Lambda-invoke wiring for it is left over"
detail = "True now: handle_customization_request calls invoke_step_function. Still present: the action trigger's IAM grant of lambda:InvokeFunction on aft-invoke-aft-account-provisioning-framework, the SSM parameter /aft/resources/lambda/aft-invoke-aft-account-provisioning-framework and its constant SSM_PARAM_AFT_ACCOUNT_PROVISIONING_FRAMEWORK_LAMBDA, and constants for notify-error / notify-success Lambdas that no longer exist. No live problem; the hazard is a reader concluding from the grant that the Lambda is invoked from here."
symbols = ["sources.aft-lambda-layer.aft_common.account_request_record_handler:AccountRequestRecordHandler.handle_customization_request"]
evidence = "grep for SSM_PARAM_AFT_ACCOUNT_PROVISIONING_FRAMEWORK_LAMBDA, NOTIFY_ERROR, NOTIFY_SUCCESS over src/ and sources/ found only their definitions in constants.py; read lambda-account-request-action-trigger.tpl."

[[findings]]
id = "role-names-in-three-places"
severity = "info"
category = "duplicated logic"
title = "AFT role and session names live in locals.tf, in SSM, and hard-coded in Python"
detail = "True now: AuthClient reads the hub/spoke role names and session name from SSM (set from locals.tf), while ProvisionRoles hard-codes AWSAFTService / AWSAFTExecution and generate_aft_trust_policy hard-codes AWSAFTAdmin and the AWSAFT-Session assumed-role ARN (AFT_EXEC_ROLE repeats it again). No live problem: the locals are not user variables. The hazard is changing one place: the trust policy written into every new account would then no longer match the session AFT uses."
symbols = ["sources.aft-lambda-layer.aft_common.account_provisioning_framework:ProvisionRoles.generate_aft_trust_policy"]
evidence = "Read ProvisionRoles, AuthClient, locals.tf (aft_execution_role_name, aft_administrator_role_name, aft_session_name) and main.tf (passed to aft-ssm-parameters)."
check = {kind = "text_in", pattern = "assumed-role/AWSAFTAdmin/AWSAFT-Session"}

[[findings]]
id = "processor-portfolio-calls-every-run"
severity = "info"
category = "risk"
title = "The processor re-associates the service role with the portfolio on every 5-minute run, even with an empty queue"
detail = "True now: each run builds AccountRequest (two role assumptions, DescribeProductAsAdmin), lists all Service Catalog portfolios and calls AssociatePrincipalWithPortfolio before looking at the queue: 288 times a day. Trigger: none needed. Reach: steady background API traffic and CloudTrail entries in the CT management account; harmless functionally because the association is idempotent."
symbols = ["aft_lambda.aft_account_request_framework.aft_account_request_processor:lambda_handler"]
evidence = "Read the processor handler and AccountRequest.__init__ / associate_aft_service_role_with_account_factory / account_factory_portfolio_id."
check = {kind = "calls", target = "sources.aft-lambda-layer.aft_common.account_request_framework:AccountRequest.associate_aft_service_role_with_account_factory"}

[[findings]]
id = "pipeline-count-pages-full-history"
severity = "info"
category = "risk"
title = "Counting running pipelines reads every execution of every account pipeline, every 30 seconds"
detail = "True now: get_running_pipeline_count paginates the full ListPipelineExecutions history of each customization pipeline to find the newest one, and the state machine calls it after every 30 s wait while accounts are pending; execute_pipeline also lists all pipelines once per account. Trigger: many AFT accounts with long pipeline histories during a large customizations run. Reach: CodePipeline API throttling and longer loop iterations; correctness is unaffected (the high-retry config absorbs throttling)."
symbols = ["sources.aft-lambda-layer.aft_common.codepipeline:get_running_pipeline_count"]
evidence = "Read codepipeline:get_running_pipeline_count, pipeline_is_running, get_pipeline_for_account and the 'Wait on Pipeline Executions' state (Seconds 30)."
check = {kind = "text_in", pattern = "paginator\\.paginate\\(pipelineName=name\\)"}

[[layer_rules]]
text = "The shared library never imports a Lambda handler: handlers depend on aft_common, never the other way round."
from_layers = ["common-requests", "common-provisioning", "common-customizations", "common-aws", "common-utils"]
forbid = ["aft_lambda."]

[[layer_rules]]
text = "The layer-builder Lambda never imports aft_common (it builds that layer, so the layer may not exist yet when it runs)."
from = ["aft_lambda.aft_builder.codebuild_trigger"]
forbid = ["sources.aft-lambda-layer.aft_common", "sources.aft-lambda-layer.aft_common.", "aft_common"]

[[layer_rules]]
text = "Handlers of one state machine or pipeline never import handlers of another; they share code only through aft_common."
from_layers = ["handlers-request", "handlers-provisioning", "handlers-feature-options", "handlers-customizations"]
forbid = ["aft_lambda."]

[[layer_rules]]
text = "Utilities are leaves: they import nothing else from aft_common."
from_layers = ["common-utils"]
forbid = ["sources.aft-lambda-layer.aft_common.auth", "sources.aft-lambda-layer.aft_common.ssm", "sources.aft-lambda-layer.aft_common.ddb", "sources.aft-lambda-layer.aft_common.sqs", "sources.aft-lambda-layer.aft_common.organizations", "sources.aft-lambda-layer.aft_common.service_catalog", "sources.aft-lambda-layer.aft_common.account_request_framework", "sources.aft-lambda-layer.aft_common.account_provisioning_framework", "sources.aft-lambda-layer.aft_common.customizations"]

[[layer_rules]]
text = "The AWS wrappers never import the request-record or customization logic (the one upward edge that does exist is service_catalog importing ProvisionRoles for a role-name constant)."
from_layers = ["common-aws"]
forbid = ["sources.aft-lambda-layer.aft_common.account_request_framework", "sources.aft-lambda-layer.aft_common.account_request_record_handler", "sources.aft-lambda-layer.aft_common.shared_account", "sources.aft-lambda-layer.aft_common.customizations"]

[[layer_rules]]
text = "The CodeBuild scripts are standalone: they never import aft_common or the Lambda handlers."
from = ["sources.scripts.workspace_manager", "sources.scripts.terraform_client"]
forbid = ["sources.aft-lambda-layer.aft_common.", "aft_lambda."]

[[decisions]]
decision = "What an aft-request change means (create, CT-parameter update, customization only, shared-account customization, removal)"
by = "code"
how = "AccountRequestRecordHandler.process_request branches on eventName, whether old/new images exist, whether control_tower_parameters changed, whether the email/name belong to a shared CT account, and whether the email already has a healthy Account Factory product."
symbol = "sources.aft-lambda-layer.aft_common.account_request_record_handler:AccountRequestRecordHandler.process_request"

[[decisions]]
decision = "Which accounts AFT wants (and their OU, tags, customizations name, custom fields)"
by = "people"
how = "Customers commit aft-account-request Terraform modules; the account-request CodePipeline applies them and Terraform writes one aft-request item per account, keyed by AccountEmail. Python only reacts to the stream."
symbol = "sources.aft-lambda-layer.aft_common.account_request_record_handler:AccountRequestRecordHandler.process_request"

[[decisions]]
decision = "Serialise account operations: requests go through a FIFO queue and are taken one per scheduled run"
by = "people (config file)"
how = "Terraform wires aft-request stream → action trigger → SQS aft-account-request.fifo, and an EventBridge rate(5 minutes) rule → processor, which receives MaxNumberOfMessages=1 per run. The ordering comes from this one-at-a-time polling; each message gets its own MessageGroupId."
symbol = "aft_lambda.aft_account_request_framework.aft_account_request_processor:lambda_handler"

[[decisions]]
decision = "Whether the processor may start another account operation now"
by = "code"
how = "AccountRequest.provisioning_threshold_reached counts Control Tower enabled baselines in UNDER_CHANGE and compares to AFT_PROVISIONING_CONCURRENCY (Terraform var concurrent_account_factory_actions, default 5)."
symbol = "sources.aft-lambda-layer.aft_common.account_request_framework:AccountRequest.provisioning_threshold_reached"

[[decisions]]
decision = "Whether a queued request is valid"
by = "code"
how = "ADD: new_ct_request_is_valid rejects an AccountName or AccountEmail already used in Organizations. UPDATE: modify_ct_request_is_valid allows only ManagedOrganizationalUnit to change. An invalid message is deleted and reported as an error."
symbol = "sources.aft-lambda-layer.aft_common.account_request_framework:new_ct_request_is_valid"

[[decisions]]
decision = "Account creation and OU moves are done by Control Tower, not by AFT"
by = "code"
how = "create_new_account / update_existing_account call Service Catalog ProvisionProduct / UpdateProvisionedProduct on the Account Factory product in the CT management account; AFT continues only when Control Tower's lifecycle event comes back through EventBridge."
symbol = "sources.aft-lambda-layer.aft_common.account_request_framework:create_new_account"

[[decisions]]
decision = "Provisioning steps and their order run in Step Functions, one small Lambda per step"
by = "people (config file)"
how = "aft_account_provisioning_framework.asl.json: persist_metadata → create_role (with retry) → tag_account → account_metadata_ssm → aft_features (sync) → account provisioning customizations (sync, customer state machine) → create pipeline (CodeBuild aft-create-pipeline, if run_create_pipeline) → invoke customizations → notify. Every task Catch goes to notify_error."
symbol = "aft_lambda.aft_account_request_framework.aft_invoke_aft_account_provisioning_framework:lambda_handler"

[[decisions]]
decision = "How AFT reaches other accounts: hub-and-spoke role assumption"
by = "code"
how = "AuthClient assumes AWSAFTAdmin in the AFT management account and from there AWSAFTExecution / AWSAFTService in the target, CT management or log-archive account. The constructor refuses to run unless the caller is the AFT management account named in SSM."
symbol = "sources.aft-lambda-layer.aft_common.auth:AuthClient.get_target_account_session"

[[decisions]]
decision = "How a brand-new account gets the AFT roles before AFT can reach it"
by = "code"
how = "ProvisionRoles goes in through the CT management account as AWSControlTowerExecution (the only role a new account trusts), creates AWSAFTService and AWSAFTExecution with AdministratorAccess trusted by AWSAFTAdmin, waits until they can be assumed and sleeps 65 s for IAM consistency."
symbol = "sources.aft-lambda-layer.aft_common.account_provisioning_framework:ProvisionRoles.deploy_aws_aft_roles"

[[decisions]]
decision = "Resources are found by name in SSM, not wired into each Lambda"
by = "people (config file)"
how = "modules/aft-ssm-parameters writes /aft/resources/*, /aft/account/* and /aft/config/*; handlers read them with get_ssm_parameter_value (cached per container). Only the processor has an environment variable of its own."
symbol = "sources.aft-lambda-layer.aft_common.ssm:get_ssm_parameter_value"

[[decisions]]
decision = "All Lambdas share one library, published as a Lambda layer built at apply time"
by = "people (config file)"
how = "Every aws_lambda_function sets layers = [var.aft_common_layer_arn]; modules/aft-lambda-layer builds it with CodeBuild, triggered synchronously by the codebuild_trigger Lambda through a Terraform aws_lambda_invocation data source."
symbol = "aft_lambda.aft_builder.codebuild_trigger:lambda_handler"

[[decisions]]
decision = "Whether default VPCs are deleted, Enterprise Support requested, CloudTrail data events enabled"
by = "people (config file)"
how = "Root variables aft_feature_delete_default_vpcs_enabled, aft_feature_enterprise_support, aft_feature_cloudtrail_data_events → SSM /aft/config/feature/*; each feature Lambda compares the value to 'true'."
symbol = "aft_lambda.aft_feature_options.aft_enable_cloudtrail:lambda_handler"

[[decisions]]
decision = "Which accounts a customizations run targets"
by = "people"
how = "Whoever starts aft-invoke-customizations passes include/exclude specs (all, core, ous, tags, accounts); identify-targets resolves them and keeps only accounts in aft-request-metadata (plus core accounts for include)."
symbol = "sources.aft-lambda-layer.aft_common.customizations:get_included_accounts"

[[decisions]]
decision = "How many account pipelines run at once"
by = "people (config file)"
how = "Terraform var maximum_concurrent_customizations is rendered into the state machine (Map MaxConcurrency and the NumericLessThan check) and stored in SSM, where execute-pipeline reads it to size each batch."
symbol = "aft_lambda.aft_customizations.aft_customizations_execute_pipeline:lambda_handler"

[[decisions]]
decision = "Whether an OU move re-runs customizations"
by = "people (config file)"
how = "Terraform var aft_customization_triggers (only 'account_move') → SSM /aft/config/customization-triggers; detect_customization_triggers adds the trigger on UpdateManagedAccount when the parent OU differs from the metadata row, unless the aft-request item has account_skip_customization_triggers = true."
symbol = "aft_lambda.aft_account_request_framework.aft_invoke_aft_account_provisioning_framework:detect_customization_triggers"

[[decisions]]
decision = "Whether a support case is opened for an account"
by = "code"
how = "ensure_enterprise_support_enrollment skips when the metadata flag is set, otherwise searches DescribeCases for the exact subject and creates a case only if none is found, then sets the flag."
symbol = "sources.aft-lambda-layer.aft_common.premium_support:ensure_enterprise_support_enrollment"

[[entities]]
id = "account-request"
name = "Account request (aft-request item)"
summary = "One item in DynamoDB aft-request = one account AFT should manage, keyed by id = AccountEmail. It holds control_tower_parameters (AccountEmail, AccountName, ManagedOrganizationalUnit, SSO user fields), change_management_parameters, account_tags and custom_fields as JSON strings, and account_customizations_name. Terraform writes it; the stream (NEW_AND_OLD_IMAGES) carries every change to Python."
  [[entities.events]]
  stage = "born"
  symbol = "sources.aft-lambda-layer.aft_common.account_request_record_handler:AccountRequestRecordHandler.process_request"
  by = "customer's account-request pipeline (Terraform aws_dynamodb_table_item)"
  text = "Terraform writes the item; Python first sees it as an INSERT stream record in the action trigger, which queues an ADD or, for an existing or shared account, starts customization."
  [[entities.events]]
  stage = "store"
  symbol = "sources.aft-lambda-layer.aft_common.account_request_framework:put_audit_record"
  by = "aft-account-request-audit-trigger"
  text = "Every INSERT / MODIFY / REMOVE image is copied into aft-request-audit with a timestamp."
  [[entities.events]]
  stage = "transform"
  symbol = "sources.aft-lambda-layer.aft_common.account_request_framework:build_sqs_message"
  by = "aft-account-request-action-trigger"
  text = "Reduced to {operation ADD | UPDATE, control_tower_parameters, old_control_tower_parameters} and sent to the FIFO queue."
  [[entities.events]]
  stage = "update"
  symbol = "sources.aft-lambda-layer.aft_common.account_request_record_handler:AccountRequestRecordHandler.process_request"
  by = "customer edits the request"
  text = "MODIFY: a changed control_tower_parameters map queues an UPDATE (only the OU may differ); anything else starts the provisioning state machine as a customization."
  [[entities.events]]
  stage = "read"
  symbol = "sources.aft-lambda-layer.aft_common.account_request_framework:get_account_request_record"
  by = "aft-invoke-aft-account-provisioning-framework, aft-customizations-identify-targets"
  text = "Fetched by email after a Control Tower event or for a customizations run."
  [[entities.events]]
  stage = "transform"
  symbol = "sources.aft-lambda-layer.aft_common.account_request_framework:build_account_customization_payload"
  by = "invoke-provisioning-framework, action trigger, identify-targets"
  text = "account_tags is JSON-decoded and the record becomes account_request inside the customization payload."
  [[entities.events]]
  stage = "delete"
  symbol = "sources.aft-lambda-layer.aft_common.account_request_record_handler:AccountRequestRecordHandler.handle_remove"
  by = "customer removes the request"
  text = "REMOVE: the OldImage is sent to aft-cleanup-resources, which deletes the account's pipeline and metadata row; the AWS account stays."

[[entities]]
id = "account-request-message"
name = "Account request queue message"
summary = "A JSON message on SQS aft-account-request.fifo: operation (ADD or UPDATE), control_tower_parameters and, for UPDATE, old_control_tower_parameters."
  [[entities.events]]
  stage = "born"
  symbol = "sources.aft-lambda-layer.aft_common.account_request_framework:build_sqs_message"
  by = "aft-account-request-action-trigger"
  text = "Built from the stream images."
  [[entities.events]]
  stage = "store"
  symbol = "sources.aft-lambda-layer.aft_common.sqs:send_sqs_message"
  by = "aft-account-request-action-trigger"
  text = "Sent with a fresh MessageGroupId and MessageDeduplicationId."
  [[entities.events]]
  stage = "read"
  symbol = "sources.aft-lambda-layer.aft_common.sqs:receive_sqs_message"
  by = "aft-account-request-processor (every 5 minutes)"
  text = "At most one message per run, only when the CT concurrency threshold is not reached."
  [[entities.events]]
  stage = "delete"
  symbol = "sources.aft-lambda-layer.aft_common.sqs:delete_sqs_message"
  by = "aft-account-request-processor"
  text = "Deleted after the Service Catalog call or after an invalid request is detected; otherwise it moves to aft-account-request-dlq.fifo on the next receive."

[[entities]]
id = "control-tower-event"
name = "Control Tower lifecycle event"
summary = "An aws.controltower 'AWS Service Event via CloudTrail' event (CreateManagedAccount or UpdateManagedAccount) captured in the CT management account and forwarded to the AFT bus aft-events-from-ct-management; serviceEventDetails.<operation>Status.account.accountId names the account."
  [[entities.events]]
  stage = "born"
  symbol = "aft_lambda.aft_account_request_framework.aft_controltower_event_logger:lambda_handler"
  by = "Control Tower (via EventBridge rules aft-capture-ct-events → aft-controltower-event-logger)"
  text = "Arrives at two Lambda targets of the same rule at once."
  [[entities.events]]
  stage = "store"
  symbol = "aft_lambda.aft_account_request_framework.aft_controltower_event_logger:lambda_handler"
  by = "aft-controltower-event-logger"
  text = "Stored whole in aft-controltower-events (hash key id, range key time)."
  [[entities.events]]
  stage = "read"
