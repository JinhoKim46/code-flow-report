id = "lambda-aft-invoke-aft-account-provisioning-framework-af"
kind = "infra"
name = "Lambda aft-invoke-aft-account-provisioning-framework"
symbols = ["aft_lambda.aft_account_request_framework.aft_invoke_aft_account_provisioning_framework:lambda_handler", "aft_lambda.aft_account_request_framework.aft_invoke_aft_account_provisioning_framework:detect_customization_triggers"]
purpose = "Turns a finished Control Tower account operation into a provisioning run: looks up the account's request by email, builds the customization payload (adding an account_move trigger when the OU changed and triggers are enabled) and starts the aft-account-provisioning-framework state machine."
message = ["invoked by: EventBridge rule aft-controltower-event-logger on bus aft-events-from-ct-management (same rule as the logger)", "told: a CT event (detail.eventName CreateManagedAccount / UpdateManagedAccount with serviceEventDetails.*Status.account.accountId), or an {account_request} customization event", "the IAM grant lets aft-account-request-action-trigger invoke it, but no code does"]
config = "defined in modules/aft-account-request-framework/lambda.tf (timeout 300 s); SSM /aft/account/aft-management/sfn/aft-account-provisioning-framework-sfn-name, /aft/config/customization-triggers, /aft/resources/ddb/aft-request-table-name, /aft/resources/ddb/aft-request-metadata-table-name."
output = "One Step Functions execution with the AftInvokeAccountCustomizationPayload as input."
validation = "Raises on an unrecognised event or a missing aft-request row; trigger detection swallows its own errors and continues without triggers."
logging = "CloudWatch /aws/lambda/aft-invoke-aft-account-provisioning-framework; failures to SNS aft-failure-notifications."
result_use = "may use: DynamoDB aft-request and aft-request-metadata (GetItem), states:StartExecution on the provisioning state machine, sts:AssumeRole AWSAFTAdmin (Organizations in CT management), SNS topics, KMS key aft."

[[roles]]
id = "lambda-aft-cleanup-resources-aft-account-request-framew"
kind = "infra"
name = "Lambda aft-cleanup-resources"
symbols = ["aft_lambda.aft_account_request_framework.aft_cleanup_resources:lambda_handler"]
purpose = "Undoes AFT's bookkeeping when a request is removed from aft-request: deletes the account's customization pipeline (unless it is running) and its aft-request-metadata row. The AWS account itself is left alone."
message = ["invoked by: aft-account-request-action-trigger via lambda:Invoke InvocationType=Event (AccountRequestRecordHandler.handle_remove)", "told: {account_request: <unmarshalled OldImage>}, whose id is the account email"]
config = "defined in modules/aft-account-request-framework/lambda.tf (timeout 300 s); SSM /aft/resources/ddb/aft-request-metadata-table-name."
output = "Pipeline deleted, metadata row deleted."
validation = "A running pipeline is skipped with a warning (and is then never deleted). Async invoke: Lambda's default async retries apply."
logging = "CloudWatch /aws/lambda/aft-cleanup-resources; failures to SNS aft-failure-notifications."
result_use = "may use: DynamoDB aft-request-metadata (GetItem, DeleteItem), CodePipeline in the AFT management account, Organizations in CT management through AWSAFTAdmin, SNS topics, KMS key aft."

[[roles]]
id = "lambda-aft-customizations-identify-targets-aft-customiz"
kind = "infra"
name = "Lambda aft-customizations-identify-targets"
symbols = ["aft_lambda.aft_customizations.aft_customizations_identify_targets:lambda_handler"]
purpose = "First task of aft-invoke-customizations: resolves the include/exclude spec into AFT-managed account ids, builds one customization payload per account and uploads the list to S3."
message = ["invoked by: Step Functions aft-invoke-customizations ('Identify Targets' task), which an operator starts or the provisioning state machine starts for one account", "told: {include: [...], exclude?: [...], get_execution_id: {execution_id}, ...}"]
config = "defined in modules/aft-customizations/lambda.tf (timeout 300 s); SSM /aft/resources/ddb/aft-request-metadata-table-name, /aft/resources/ddb/aft-request-table-name, /aft/config/customizations/aft_codepipeline_customizations_bucket_id."
output = "{number_pending_accounts, pending_accounts, target_accounts_info: {bucket, key}}."
validation = "Rejects an invalid request; accounts no longer in Organizations are skipped (see the finding on list mutation); a missing aft-request row raises."
logging = "CloudWatch; failures to SNS with subject 'Failed to identify targets for AFT account customizations'."
result_use = "may use: DynamoDB GetItem/Scan, S3 aft_codepipeline_customizations_bucket (Put*), Organizations via AWSAFTAdmin, SNS, KMS."

[[roles]]
id = "lambda-aft-customizations-execute-pipeline-aft-customiz"
kind = "infra"
name = "Lambda aft-customizations-execute-pipeline"
symbols = ["aft_lambda.aft_customizations.aft_customizations_execute_pipeline:lambda_handler"]
purpose = "Starts as many pending account pipelines as the cap allows (maximum minus running) and returns the rest for the next loop."
message = ["invoked by: Step Functions aft-invoke-customizations ('Execute Pipelines' when running < maximum)", "told: running_executions.running_pipelines, targets.pending_accounts, plan_only"]
config = "defined in modules/aft-customizations/lambda.tf (timeout 300 s); SSM /aft/config/customizations/maximum_concurrent_customizations."
output = "{number_pending_accounts, pending_accounts}."
validation = "A pipeline already InProgress is not restarted (but still counted as dispatched)."
logging = "Accounts remaining in CloudWatch; failures to SNS."
result_use = "may use: codepipeline:ListPipelines, ListTagsForResource, ListPipelineExecutions, StartPipelineExecution; SNS; KMS."

[[roles]]
id = "lambda-aft-customizations-get-pipeline-executions-aft-c"
kind = "infra"
name = "Lambda aft-customizations-get-pipeline-executions"
symbols = ["aft_lambda.aft_customizations.aft_customizations_get_pipeline_executions:lambda_handler"]
purpose = "Counts AFT customization pipelines whose newest execution is InProgress, for the state machine's concurrency check."
message = ["invoked by: Step Functions aft-invoke-customizations ('Get Pipeline Executions', re-entered after every 30 s wait)", "told: nothing it reads"]
config = "defined in modules/aft-customizations/lambda.tf (timeout 300 s)."
output = "{running_pipelines: <int>}."
validation = "Errors go to SNS and Notify Failure."
logging = "Per-pipeline latest execution in CloudWatch."
result_use = "may use: codepipeline:ListPipelines, ListPipelineExecutions; SNS; KMS."

[[roles]]
id = "lambda-aft-customizations-audit-trigger-aft-customizati"
kind = "infra"
name = "Lambda aft-customizations-audit-trigger"
symbols = ["aft_lambda.aft_customizations.aft_customizations_audit_trigger:lambda_handler"]
purpose = "Writes one aft-customizations-audit row per customizations execution (targets, bypass steps, triggers, source = account_move / manual / account_request) and links it to the provisioning request id in the log."
message = ["invoked by: Step Functions aft-invoke-customizations ('Record Audit' task, Catch continues to Get Pipeline Executions)", "told: the state input (get_execution_id, targets, bypass_steps, customization_triggers, customization_request_id)"]
config = "defined in modules/aft-customizations/lambda.tf (timeout 120 s); SSM /aft/resources/ddb/aft-customizations-audit-table-name."
output = "{status: recorded | skipped, execution_id}."
validation = "Best effort: every exception is caught and returned as status 'skipped', so auditing never stops a customization."
logging = "A warning line on failure; no SNS."
result_use = "may use: DynamoDB aft-customizations-audit (PutItem), ssm:GetParameter, KMS."

[[roles]]
id = "lambda-aft-delete-default-vpc-aft-feature-options-lambd"
kind = "infra"
name = "Lambda aft_delete_default_vpc"
symbols = ["aft_lambda.aft_feature_options.aft_delete_default_vpc:lambda_handler"]
purpose = "First task of the aft-features state machine: when the delete-default-VPCs flag is on, removes the default VPC (gateways, subnets, route tables, ACLs, security groups) region by region."
message = ["invoked by: Step Functions aft_features ('Delete Default VPCs' task; the ARN is templated with a space in '${ aft_delete_default_vpc_function_arn}', which is why the extractor found no trigger)", "aft_features is started synchronously by the provisioning state machine's aft_features state", "told: the customization payload (customization_request_id, account_info ...)"]
config = "defined in modules/aft-feature-options/lambda.tf (timeout 300 s); SSM /aft/config/feature/delete-default-vpcs-enabled."
output = "Default VPCs deleted (see the finding about which account); unreachable regions skipped with a warning."
validation = "Region endpoint timeouts are skipped; any other error goes to the state machine's Notify Failure."
logging = "customization_request_logger lines; failures to SNS aft-failure-notifications."
result_use = "may use: ec2 Describe*/Delete* on '*' in the AFT management account (its own role), sts:AssumeRole AWSAFTAdmin (target account, used to list regions), SNS, KMS."

[[roles]]
id = "lambda-aft-enroll-support-aft-feature-options-lambda"
kind = "infra"
name = "Lambda aft_enroll_support"
symbols = ["aft_lambda.aft_feature_options.aft_enroll_support:lambda_handler"]
purpose = "Second task of the aft-features state machine: when enterprise support is enabled, makes sure one support case asking to add the account to Enterprise Support exists, and records that on the metadata row."
message = ["invoked by: Step Functions aft_features ('Enroll Enterprise Support' task, with Retry: 30 s interval, max delay 300 s)", "told: the customization payload"]
config = "defined in modules/aft-feature-options/lambda.tf (timeout 300 s); SSM /aft/config/feature/enterprise-support-enabled, /aft/resources/ddb/aft-request-metadata-table-name."
output = "Possibly a support case in the CT management account; enterprise_support_case_created = 'true' on aft-request-metadata."
validation = "Idempotent through the flag and a DescribeCases subject search; see the finding about the flag being overwritten."
logging = "customization_request_logger lines; failures to SNS."
result_use = "may use: DynamoDB aft-request-metadata (GetItem, UpdateItem), Support API in CT management via AWSAFTAdmin → AWSAFTService, SNS, KMS."

[[roles]]
id = "lambda-aft-enable-cloudtrail-aft-feature-options-lambda"
kind = "infra"
name = "Lambda aft_enable_cloudtrail"
symbols = ["aft_lambda.aft_feature_options.aft_enable_cloudtrail:lambda_handler"]
purpose = "Third task of the aft-features state machine: keeps the organisation trail aws-aft-CustomizationsCloudTrail (S3 and Lambda data events to the log-archive bucket) in the CT management account in line with the flag: create and start it when on, delete it when off."
message = ["invoked by: Step Functions aft_features ('Enable CloudTrail' task)", "told: the customization payload (only the id and request id are used)"]
config = "defined in modules/aft-feature-options/lambda.tf (timeout 300 s); SSM /aft/config/feature/cloudtrail-data-events-enabled, /aft/account/log-archive/log_bucket_arn, /aft/account/log-archive/kms_key_arn."
output = "Trail created / event selectors put / logging started, or the trail deleted."
validation = "Each step checks current state first, so reruns are no-ops."
logging = "customization_request_logger lines; failures to SNS."
result_use = "may use: CloudTrail in CT management and S3 listing in log archive, both through AWSAFTAdmin → AWSAFTService; SNS; KMS."

[[roles]]
id = "lambda-codebuild-trigger-aft-lambda-layer-lambda"
kind = "infra"
name = "Lambda codebuild_trigger"
symbols = ["aft_lambda.aft_builder.codebuild_trigger:lambda_handler"]
purpose = "Builds the aft_common Lambda layer during terraform apply: starts the layer CodeBuild project and waits (up to 14 minutes) for it to succeed, so the layer version exists before the other Lambdas are created."
message = ["invoked by: Terraform data source aws_lambda_invocation.trigger_codebuild_job in modules/aft-lambda-layer/lambda.tf, on every plan/apply", "told: {codebuild_project_name}"]
config = "defined in modules/aft-lambda-layer/lambda.tf (timeout 900 s, function name local.codebuild_trigger_function_name)."
output = "{Status: 200} on SUCCEEDED; Terraform exposes it as output lambda_layer_build_status."
validation = "Raises on any non-success terminal status or after 14 minutes, which fails the terraform run."
logging = "Its own CloudWatch log group; no SNS (it deliberately does not import aft_common)."
result_use = "may use: codebuild:StartBuild and BatchGetBuilds on the layer project (role codebuild_trigger_role)."

[[roles]]
id = "aws-cross-account-auth"
name = "Cross-account sessions (STS hub and spoke)"
kind = "external"
symbols = ["sources.aft-lambda-layer.aft_common.auth:AuthClient.get_target_account_session", "sources.aft-lambda-layer.aft_common.auth:AuthClient._get_hub_session", "sources.aft-lambda-layer.aft_common.auth:AuthClient.get_ct_management_session", "sources.aft-lambda-layer.aft_common.auth:AuthClient.get_log_archive_session", "sources.aft-lambda-layer.aft_common.auth:AuthClient._get_session", "sources.aft-lambda-layer.aft_common.auth:AuthClient._is_aft_management_session"]
purpose = "Every call AFT makes outside its own account goes through AuthClient: it assumes the hub role AWSAFTAdmin in the AFT management account, then from that hub assumes a spoke role (AWSAFTExecution by default, or AWSAFTService) in the Control Tower management, log-archive or target account."
input = "Role ARNs are built from the partition, the account id (target, or read from SSM /aft/account/ct-management/account-id, /aft/account/log-archive/account-id) and the role name (argument, or SSM /aft/resources/iam/aft-execution-role-name and /aft/resources/iam/aft-administrator-role-name)."
message = ["sts:AssumeRole on arn:<partition>:iam::<aft-mgmt>:role/AWSAFTAdmin (hub)", "sts:AssumeRole from the hub on arn:<partition>:iam::<target>:role/<spoke role> with RoleSessionName from SSM /aft/resources/iam/aft-session-name, DurationSeconds 900 by default, optional session Policy and ExternalId"]
config = "SSM /aft/account/aft-management/account-id (the constructor refuses to run unless the caller's account equals it), /aft/resources/iam/aft-session-name, /aft/resources/iam/aft-administrator-role-name, /aft/resources/iam/aft-execution-role-name. The names themselves come from locals.tf (aft_execution_role_name, aft_administrator_role_name, aft_session_name)."
output = "A boto3 Session holding the temporary credentials, in the requested region (default: the caller's region). Success is simply that AssumeRole returned credentials."
validation = "No retry wrapper: a ClientError from AssumeRole propagates to the handler, which publishes to the failure topic and re-raises. ProvisionRoles._ensure_role_can_be_assumed is the one place that polls (every 5 s for up to 1 minute) until a freshly created role can be assumed."
logging = "Logs the hub caller ARN and the spoke role ARN to the Lambda's CloudWatch log group."
cost = "not measured; each get_*_session call is two AssumeRole calls (hub + spoke) and no session is cached across calls."
result_use = "Callers build service clients from the returned session: Organizations / Service Catalog / Control Tower in the CT management account, IAM and SSM in the target account, CloudTrail in CT management, S3 in log archive."

[[roles]]
id = "aws-service-catalog-ct"
name = "Control Tower Account Factory (Service Catalog + Control Tower API)"
kind = "external"
symbols = ["sources.aft-lambda-layer.aft_common.account_request_framework:create_new_account", "sources.aft-lambda-layer.aft_common.account_request_framework:update_existing_account", "sources.aft-lambda-layer.aft_common.service_catalog:get_ct_product_id", "sources.aft-lambda-layer.aft_common.service_catalog:get_ct_provisioning_artifact_id", "sources.aft-lambda-layer.aft_common.service_catalog:get_account_id_if_enrolled", "sources.aft-lambda-layer.aft_common.account_request_framework:AccountRequest.associate_aft_service_role_with_account_factory", "sources.aft-lambda-layer.aft_common.control_tower:ControlTowerFacade.get_enabled_baselines_under_change_count"]
purpose = "The only way AFT creates or changes an account: it provisions or updates the Control Tower Account Factory product in Service Catalog (in the CT management account, as AWSAFTService), and asks the Control Tower API how many account baselines are still UNDER_CHANGE to throttle itself."
input = "The control_tower_parameters map of the request (AccountEmail, AccountName, ManagedOrganizationalUnit, SSOUserEmail, SSOUserFirstName, SSOUserLastName), the product name from SSM /aft/resources/sc/account-factory-product-name, and the AFT version from SSM /aft/config/aft/version for the User-Agent header."
message = ["servicecatalog:DescribeProductAsAdmin (product id + an active provisioning artifact)", "servicecatalog:ProvisionProduct with ProvisionedProductName = AccountName with spaces turned into hyphens, ProvisioningParameters = control_tower_parameters, ProvisionToken = uuid1 (ADD)", "servicecatalog:SearchProvisionedProducts physicalId:<account id> then UpdateProvisionedProduct (UPDATE)", "servicecatalog:ListPortfolios + AssociatePrincipalWithPortfolio for AWSAFTService (every processor run)", "controltower:ListBaselines + ListEnabledBaselines status UNDER_CHANGE (threshold check)", "User-Agent: account-factory-terraform-<version> added before signing"]
config = "SSM /aft/resources/sc/account-factory-product-name, /aft/config/aft/version; env AFT_PROVISIONING_CONCURRENCY (from Terraform var concurrent_account_factory_actions) for the threshold."
output = "ProvisionProduct returns a record detail; AFT only logs it. Account creation finishes asynchronously and is reported back as a Control Tower CreateManagedAccount / UpdateManagedAccount event."
validation = "Fresh ProvisionToken / UpdateToken on every call, so a retried message is a new provisioning attempt, not an idempotent replay. update_existing_account raises when no AVAILABLE/TAINTED product with a successful provisioning record exists. Read-side Service Catalog clients use the 16-attempt adaptive retry config; ProvisionProduct uses the default client."
logging = "Sanitised parameters and responses in the processor's CloudWatch log; failures go to SNS aft-failure-notifications."
cost = "not measured; Control Tower limits concurrent account operations, which is why the threshold check exists."
result_use = "Nothing reads the ProvisionProduct response; the follow-up is driven by the Control Tower lifecycle event on EventBridge."

[[roles]]
id = "aws-organizations"
name = "AWS Organizations (CT management account)"
kind = "external"
symbols = ["sources.aft-lambda-layer.aft_common.organizations:OrganizationsAgent.get_account_id_from_email", "sources.aft-lambda-layer.aft_common.organizations:OrganizationsAgent.get_aft_account_info", "sources.aft-lambda-layer.aft_common.organizations:OrganizationsAgent.tag_org_resource", "sources.aft-lambda-layer.aft_common.organizations:OrganizationsAgent.get_account_by_email", "sources.aft-lambda-layer.aft_common.account_request_framework:account_name_or_email_in_use", "sources.aft-lambda-layer.aft_common.shared_account:shared_account_request"]
purpose = "The source of truth for which accounts exist: maps the request key (account email) to an account id and back, describes an account and its parent OU for the customization payload, resolves OU names, checks that a new name/email is unused, and writes account tags."
input = "Account email (the aft-request id), account id, OU names in plain or nested 'Name (ou-xxxx)' format, the account_tags map from the request."
message = ["organizations:ListAccounts (paginated, memoised per OrganizationsAgent instance)", "organizations:DescribeAccount, ListParents, ListOrganizationalUnitsForParent, ListAccountsForParent", "organizations:TagResource on the account id"]
config = "Reached only through AuthClient.get_ct_management_session (AWSAFTExecution or AWSAFTService in the CT management account). Clients use the 16-attempt adaptive retry config."
output = "Account ids, emails, an AftAccountInfo dict (id, email, name, joined_method, joined_date, status, parent_id, parent_type), or an exception when the email is not in the organisation."
validation = "Emails are compared case-insensitively (emails_are_equal). get_account_id_from_email raises when nothing matches. tag_org_resource is wrapped in resubmit_request_on_boto_throttle (up to 3 fresh requests)."
logging = "Account details and lookups in the caller's CloudWatch log."
cost = "not measured; ListAccounts walks the whole organisation on every new OrganizationsAgent."
result_use = "Ids feed the provisioning payload and pipeline lookups; account_info becomes account_info.account in every Step Functions payload; the name/email check decides whether an ADD request is rejected."

[[roles]]
id = "aws-ssm"
name = "SSM Parameter Store (service registry and custom fields)"
kind = "external"
symbols = ["sources.aft-lambda-layer.aft_common.ssm:get_ssm_parameter_value", "sources.aft-lambda-layer.aft_common.ssm:put_ssm_parameters", "sources.aft-lambda-layer.aft_common.ssm:get_ssm_parameters_names_by_path", "sources.aft-lambda-layer.aft_common.ssm:delete_ssm_parameters"]
purpose = "In the AFT management account, /aft/* parameters (written by modules/aft-ssm-parameters) name every table, queue, topic, state machine, role and feature flag, so the Lambdas need almost no environment variables. In each vended account, /aft/account-request/custom-fields/* holds the request's custom_fields."
input = "A parameter name from aft_common.constants (or a literal path such as /aft/account/log-archive/log_bucket_arn); for custom fields, the custom_fields JSON of the request."
message = ["ssm:GetParameter Name=<param> (WithDecryption only if asked)", "ssm:GetParametersByPath /aft/account-request/custom-fields/ (target account)", "ssm:PutParameter Type=String Overwrite=True; ssm:DeleteParameters in batches of 10 (target account)"]
config = "Parameter names are constants in aft_common.constants; the values are set by modules/aft-ssm-parameters/ssm.tf from root Terraform variables."
output = "The parameter value as a string; reads raise ParameterNotFound when missing (AuthClient treats that as 'not the AFT management account')."
validation = "get_ssm_parameter_value caches every value in a module-level dict for the life of the Lambda container (keyed by name only). The write/list/delete helpers are wrapped in resubmit_request_on_boto_throttle with the high-retry config; the read is not."
logging = "Each uncached read logs 'Getting SSM Parameter <name>'."
cost = "not measured; the cache keeps warm invocations from re-reading."
result_use = "Table names, queue name, topic ARNs, state machine name and flags are used directly to build clients and ARNs."

[[roles]]
id = "aws-dynamodb"
name = "DynamoDB tables (aft-request, audit, metadata, events, customizations audit)"
kind = "external"
symbols = ["sources.aft-lambda-layer.aft_common.ddb:get_ddb_item", "sources.aft-lambda-layer.aft_common.ddb:put_ddb_item", "sources.aft-lambda-layer.aft_common.ddb:delete_ddb_item", "sources.aft-lambda-layer.aft_common.account_request_framework:put_audit_record", "sources.aft-lambda-layer.aft_common.customizations:get_all_aft_account_ids", "sources.aft-lambda-layer.aft_common.premium_support:set_enrollment_flag_in_metadata"]
purpose = "State lives in five tables in the AFT management account: aft-request (the desired accounts, written by Terraform, streamed), aft-request-audit (one row per stream change), aft-request-metadata (one row per provisioned account), aft-controltower-events (raw CT events) and aft-customizations-audit (one row per customizations run)."
input = "Plain dicts (resource API) or low-level attribute maps (put_audit_record re-uses the stream image as is). Table names come from SSM /aft/resources/ddb/*."
message = ["GetItem / PutItem / DeleteItem by id", "PutItem on aft-request-audit with id + timestamp (range key) + ddb_event_name", "Scan of aft-request-metadata (projection id) for 'all' targets", "UpdateItem SET enterprise_support_case_created with ConditionExpression attribute_exists(id)"]
config = "SSM /aft/resources/ddb/aft-request-table-name, aft-request-audit-table-name, aft-request-metadata-table-name, aft-controltower-events-table-name, aft-customizations-audit-table-name. Tables are PAY_PER_REQUEST, KMS-encrypted with the aft key, point-in-time recovery on (modules/aft-account-request-framework/ddb.tf)."
output = "The item dict or None; put/delete responses are logged and returned."
validation = "No conditional writes except the support flag; put_ddb_item overwrites the whole item. No retry wrapper beyond boto defaults."
logging = "Every put logs the full item and the sanitised response."
cost = "not measured (on-demand billing)."
result_use = "The request row drives all decisions; the metadata row is the list of AFT-managed accounts for customizations and holds the previous parent OU for move detection."

[[roles]]
id = "aws-sqs"
name = "SQS FIFO queue aft-account-request.fifo"
kind = "external"
symbols = ["sources.aft-lambda-layer.aft_common.sqs:send_sqs_message", "sources.aft-lambda-layer.aft_common.sqs:receive_sqs_message", "sources.aft-lambda-layer.aft_common.sqs:delete_sqs_message", "sources.aft-lambda-layer.aft_common.account_request_framework:insert_msg_into_acc_req_queue"]
purpose = "Holds create (ADD) and Control Tower parameter-change (UPDATE) requests between the stream-triggered action Lambda and the schedule-driven processor, so Control Tower is fed at most one request per processor run."
input = "{operation, control_tower_parameters, old_control_tower_parameters?} built by build_sqs_message from the stream images."
message = ["SendMessage MessageBody=<json>, MessageGroupId=uuid1, MessageDeduplicationId=uuid1 (a new value per message)", "ReceiveMessage MaxNumberOfMessages=1, ReceiveRequestAttemptId=uuid1", "DeleteMessage with the receipt handle"]
config = "Queue name from SSM /aft/resources/sqs/aft-request-queue-name; URL built from the session's region and account. Queue settings in modules/aft-account-request-framework/sqs.tf: visibility 240 s, KMS aft key, redrive to aft-account-request-dlq.fifo after maxReceiveCount 1."
output = "One message or None."
validation = "The processor deletes the message only after the Service Catalog call (or after deciding the request is invalid). Any exception before that leaves it in flight; with maxReceiveCount 1 the next receive moves it to the DLQ. Nothing in the code reads the DLQ."
logging = "Queue URL, message and send response in CloudWatch."
cost = "not measured."
result_use = "The processor parses Body as JSON and branches on operation."

[[roles]]
id = "aws-sns"
name = "SNS notification topics"
kind = "external"
symbols = ["sources.aft-lambda-layer.aft_common.notifications:send_lambda_failure_sns_message", "sources.aft-lambda-layer.aft_common.notifications:send_sns_message"]
purpose = "How a human learns something failed: every handler's except block publishes to aft-failure-notifications, and the state machines publish success/failure to aft-notifications / aft-failure-notifications from their own Notify states."
input = "The exception text, a subject chosen by the handler, and the Lambda context (function name, request id, log group)."
message = ["sns:Publish TopicArn=<failure topic> Subject=<handler subject> Message='An error occurred in the <function> Lambda function ... search AWS Request ID <id> in CloudWatch log group <group> ... Error Message: <text>'"]
config = "SSM /aft/account/aft-management/sns/failure-topic-arn and /aft/account/aft-management/sns/topic-arn; topics in modules/aft-account-request-framework/sns.tf. Subscriptions are left to the operator."
output = "The publish response, only logged."
validation = "No retry; if publishing itself fails, that exception replaces the original one in the handler."
logging = "The sanitised publish response in CloudWatch."
cost = "not measured."
result_use = "None in code; the handler re-raises after publishing."

[[roles]]
id = "aws-codepipeline"
name = "CodePipeline (per-account customization pipelines)"
kind = "external"
symbols = ["sources.aft-lambda-layer.aft_common.codepipeline:execute_pipeline", "sources.aft-lambda-layer.aft_common.codepipeline:get_running_pipeline_count", "sources.aft-lambda-layer.aft_common.codepipeline:list_pipelines", "sources.aft-lambda-layer.aft_common.codepipeline:get_pipeline_for_account", "sources.aft-lambda-layer.aft_common.codepipeline:delete_customization_pipeline"]
purpose = "Each AFT account gets a pipeline named <account id>-customizations-pipeline (created by the aft-create-pipeline CodeBuild step of the provisioning state machine); these helpers find, count, start and delete those pipelines."
input = "Account ids; the PLAN_ONLY flag from the customizations input."
