[[entities]]
id = "account-metadata"
name = "Account metadata (aft-request-metadata item)"
summary = "One item per AFT-provisioned account, keyed by account id: email, name, creation time, status, account_level_tags, account_customizations_name, parent_ou, plus enterprise_support_case_created once a support case exists. It is the list of AFT-managed accounts that customizations use."
  [[entities.events]]
  stage = "store"
  symbol = "sources.aft-lambda-layer.aft_common.account_provisioning_framework:persist_metadata"
  by = "persist_metadata task (first step of every provisioning run)"
  text = "Overwritten in full from Organizations account info and the request."
  [[entities.events]]
  stage = "update"
  symbol = "sources.aft-lambda-layer.aft_common.premium_support:set_enrollment_flag_in_metadata"
  by = "aft_enroll_support"
  text = "Sets enterprise_support_case_created = 'true' (only if the row exists)."
  [[entities.events]]
  stage = "read"
  symbol = "aft_lambda.aft_account_request_framework.aft_invoke_aft_account_provisioning_framework:detect_customization_triggers"
  by = "invoke-provisioning-framework"
  text = "parent_ou is compared with the new parent to detect an OU move (read before persist_metadata overwrites it)."
  [[entities.events]]
  stage = "read"
  symbol = "sources.aft-lambda-layer.aft_common.customizations:get_all_aft_account_ids"
  by = "identify-targets"
  text = "Scanned for the ids of all AFT accounts."
  [[entities.events]]
  stage = "delete"
  symbol = "aft_lambda.aft_account_request_framework.aft_cleanup_resources:lambda_handler"
  by = "aft-cleanup-resources"
  text = "Deleted when the account request is removed."

[[entities]]
id = "request-audit"
name = "Request audit record (aft-request-audit item)"
summary = "A copy of one aft-request image at one stream event, keyed by id (email) and timestamp, with ddb_event_name INSERT, MODIFY or REMOVE. Nothing in the Python reads it back."
  [[entities.events]]
  stage = "born"
  symbol = "sources.aft-lambda-layer.aft_common.account_request_framework:put_audit_record"
  by = "aft-account-request-audit-trigger"
