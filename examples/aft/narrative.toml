[[entities]]
id = "customization-payload"
name = "Customization payload (Step Functions input)"
summary = "AftInvokeAccountCustomizationPayload: account_info.account (from Organizations), account_request, control_tower_event (kept for backwards compatibility), account_provisioning.run_create_pipeline, a fresh customization_request_id, and optional customization_triggers. It is the input of the provisioning state machine and of every task Lambda in it."
