# Narrative for the code-flow report — the only hand-written input.
#
# Structure (modules, functions, call edges, routes, SQL access, boundaries) comes from code_map.json.
# This file adds the explanation around it. Every `symbol` / `module` / `table` named here is checked
# against the code on every build; a name that no longer exists fails the build and the staleness test.
# Never write line numbers — the builder adds file:line from the code map.
#
# Proposed by `codeflow.py draft`. Replace every "TODO: …" (the report shows how many are left).
# Severities: high | medium | low | info.  Stages: born | transform | update | store | archive | restore | read | delete.
# A finding with a `check` retires itself: once the code no longer shows it, it moves to the page's Fixed list.
# Layer `modules` may use "pkg.*" patterns. With [[layers]] present, every module must match one.
# [module_notes."pkg.mod"]: purpose / does / flow (+ optional note) per module — written from the code, never a copied docstring.


[meta]
title = "aft"
lede = "AFT is a Terraform module that installs, in an AFT management account, a serverless pipeline that turns an account request committed to a Git repository into a new, tagged and customised AWS account in a Control Tower organization. A CodePipeline run writes each request to DynamoDB aft-request, whose stream feeds trigger Lambdas that queue it on an SQS FIFO queue; a 5-minute processor hands one request at a time to Control Tower through Service Catalog, and Control Tower's lifecycle event then starts the provisioning, feature-options and customizations Step Functions, every Lambda importing the shared aft_common layer that the same Terraform builds and deploys."
audience = "learning the code"

[module_notes.__init__]
purpose = "Marks src/ as a package so the Lambda handler paths resolve."
does = "Nothing at run time; holds only the licence header."
flow = "Imported implicitly when a handler under src/aft_lambda is loaded; no code."

[module_notes.aft_lambda]
purpose = "Package root for every Lambda handler AFT ships."
does = "Groups the handler packages: request framework, provisioning framework, feature options, customizations and the layer builder."
flow = "Each Lambda resource in the Terraform modules points its handler at a module below this package; the package itself has no code."

[module_notes."aft_lambda.aft_account_provisioning_framework"]
purpose = "Package for the four Lambda tasks of the aft-account-provisioning-framework state machine."
does = "Groups persist_metadata, create_role, tag_account and account_metadata_ssm; no code of its own."
flow = "Step Functions aft_account_provisioning_framework_sfn invokes the four handlers below, in the order persist_metadata → create_role → tag_account → account_metadata_ssm (journey 4)."

[module_notes."aft_lambda.aft_account_provisioning_framework.aft_account_provisioning_framework_account_metadata_ssm"]
purpose = "Gives Terraform in the new account a way to read the request's custom_fields, by mirroring them into that account's SSM Parameter Store."
does = "Decodes custom_fields from the account request; opens an AWSAFTService session in the vended account narrowed by a session policy to the custom-fields path; deletes parameters whose key is no longer in custom_fields and puts the rest."
flow = "Last task of Step Functions aft_account_provisioning_framework_sfn (Lambda account_metadata_ssm) → AuthClient.get_target_account_session → ssm.get_ssm_parameters_names_by_path, delete_ssm_parameters, put_ssm_parameters under /aft/account-request/custom-fields/ in the vended account; on error, notifications.send_lambda_failure_sns_message. After it the state machine moves on to aft-features and customizations."
note = "The session policy's second statement is covered by finding metadata-ssm-session-policy-dollar."

[module_notes."aft_lambda.aft_account_provisioning_framework.aft_account_provisioning_framework_create_role"]
purpose = "Puts the AWSAFTExecution and AWSAFTService roles into a newly vended account so every later AFT step can reach it."
does = "Checks that the Step Functions action is create_role; runs ProvisionRoles.deploy_aws_aft_roles for the target account; reports failures to the failure SNS topic and re-raises so the state machine fails."
flow = "Second task of aft_account_provisioning_framework_sfn (Lambda create_role) → account_provisioning_framework.ProvisionRoles (through AWSControlTowerExecution, via the CT management account) → IAM in the vended account."

[module_notes."aft_lambda.aft_account_provisioning_framework.aft_account_provisioning_framework_persist_metadata"]
purpose = "Records each AFT-managed account in DynamoDB aft-request-metadata, the table later steps use to know which accounts AFT owns and where they sit."
does = "Checks that the action is persist_metadata; writes the account's metadata row and returns the PutItem response to the state machine."
flow = "First task of aft_account_provisioning_framework_sfn (Lambda persist_metadata) → account_provisioning_framework.persist_metadata → DynamoDB aft-request-metadata (table name from SSM). The row is read later by detect_customization_triggers, customizations.get_all_aft_account_ids and premium_support."
note = "The row is replaced as a whole on every run; see finding support-flag-overwritten-by-persist-metadata."

[module_notes."aft_lambda.aft_account_provisioning_framework.aft_account_provisioning_framework_tag_account"]
purpose = "Applies the request's account_tags to the account in AWS Organizations."
does = "Checks that the action is tag_account; opens the CT management session as AWSAFTService; calls tag_account, passing an optional rollback flag from the event."
flow = "Third task of aft_account_provisioning_framework_sfn (Lambda tag_account) → account_provisioning_framework.tag_account → OrganizationsAgent.tag_org_resource in the CT management account."
note = "The rollback flag is described in finding tag-rollback-dead-and-broken."

[module_notes."aft_lambda.aft_account_request_framework"]
purpose = "Package for the request-pipeline Lambdas: stream triggers, queue processor, Control Tower event handlers and cleanup."
does = "Groups six handlers; no code of its own."
flow = "Its handlers are wired to DynamoDB aft-request's stream, the 5-minute EventBridge schedule and the Control Tower EventBridge rule (journeys 1–3)."

[module_notes."aft_lambda.aft_account_request_framework.aft_account_request_action_trigger"]
purpose = "The consumer of aft-request changes that decides what each change means for the account."
does = "Wraps the stream record in AccountRequestRecordHandler and lets process_request route it to queueing, customization-only, or cleanup; sends any error to the failure SNS topic and re-raises."
flow = "DynamoDB aft-request stream → Lambda aft-account-request-action-trigger → account_request_record_handler.AccountRequestRecordHandler.process_request → SQS aft-account-request.fifo (create/update), Step Functions aft-account-provisioning-framework (customization only) or Lambda aft-cleanup-resources (REMOVE)."
note = "See finding stream-record-dropped-after-one-retry for what happens when it raises."

[module_notes."aft_lambda.aft_account_request_framework.aft_account_request_audit_trigger"]
purpose = "Keeps a history of every change to an account request, independent of whether acting on it succeeds."
does = "Accepts only DynamoDB stream events; picks NewImage, or OldImage for REMOVE; writes it with a timestamp and the event name to the audit table; reports errors to SNS."
flow = "DynamoDB aft-request stream (beside the action trigger) → Lambda aft-account-request-audit-trigger → account_request_framework.put_audit_record → DynamoDB aft-request-audit (name from SSM)."

[module_notes."aft_lambda.aft_account_request_framework.aft_account_request_processor"]
purpose = "The throttle between the request queue and Control Tower: it starts account creations and updates at a pace Control Tower accepts."
does = "Re-associates AWSAFTService with the Account Factory portfolio; stops early when the number of Control Tower baselines UNDER_CHANGE reaches AFT_PROVISIONING_CONCURRENCY; takes one message from the FIFO queue, validates it, and calls create_new_account (ADD) or update_existing_account (UPDATE); posts a usage metric and deletes the message."
flow = "EventBridge rule aft-lambda-account-request-processor, rate(5 minutes) → Lambda aft-account-request-processor → account_request_framework.AccountRequest, sqs.receive_sqs_message → new_ct_request_is_valid / modify_ct_request_is_valid → Service Catalog provision_product or update_provisioned_product in the CT management account → sqs.delete_sqs_message; failures go to the failure SNS topic (journey 2)."
note = "Throughput and failure behaviour are covered by findings processor-one-request-per-run, processor-no-retry-dlq-after-one-failure, processor-portfolio-calls-every-run and metrics-post-without-timeout."

[module_notes."aft_lambda.aft_account_request_framework.aft_cleanup_resources"]
purpose = "Removes what AFT built for an account once its request is deleted from aft-request."
does = "Looks up the account id from the request email in Organizations; deletes the account's customization pipeline unless it is running; deletes its row from aft-request-metadata."
flow = "REMOVE on the aft-request stream → AccountRequestRecordHandler.handle_remove invokes Lambda aft-cleanup-resources asynchronously → OrganizationsAgent.get_account_id_from_email → codepipeline.delete_customization_pipeline → ddb.delete_ddb_item on DynamoDB aft-request-metadata."
note = "It does not close or remove the AWS account itself. Its error path is covered by finding cleanup-error-path-unbound."

[module_notes."aft_lambda.aft_account_request_framework.aft_controltower_event_logger"]
purpose = "Keeps a raw record of every Control Tower lifecycle event AFT receives, for troubleshooting."
does = "Writes the EventBridge event unchanged to the events table; reports errors to SNS."
flow = "Control Tower lifecycle event, forwarded from the CT management account → EventBridge rule aft-controltower-event-logger → Lambda aft-controltower-event-logger → ddb.put_ddb_item on DynamoDB aft-controltower-events (name from SSM)."

[module_notes."aft_lambda.aft_account_request_framework.aft_invoke_aft_account_provisioning_framework"]
purpose = "Connects Control Tower's 'account ready' signal to AFT's own provisioning state machine."
does = "Accepts a supported Control Tower event (CreateManagedAccount, UpdateManagedAccount) or a bare account_request; finds the account id and its aft-request record; builds the customization payload; adds an account_move trigger when an UpdateManagedAccount moved the account to another OU and SSM enables that trigger; starts the state machine."
flow = "EventBridge rule aft-controltower-event-logger → Lambda aft-invoke-aft-account-provisioning-framework → OrganizationsAgent.get_account_email_from_id → account_request_framework.get_account_request_record (DynamoDB aft-request) → build_account_customization_payload → detect_customization_triggers (DynamoDB aft-request-metadata) → aft_utils.invoke_step_function → Step Functions aft-account-provisioning-framework (journey 3)."
note = "The opt-out it honours is covered by finding skip-triggers-attribute-not-in-module."

[module_notes."aft_lambda.aft_builder.codebuild_trigger"]
purpose = "Builds the aft_common Lambda layer during terraform apply, so the layer version exists before any other Lambda is created."
does = "Starts the layer CodeBuild project named in the event; polls it every 10 seconds for up to 14 minutes; returns Status 200 on success and raises on failure or timeout."
flow = "Terraform data source aws_lambda_invocation.trigger_codebuild_job → Lambda codebuild_trigger → CodeBuild start_build / batch_get_builds; the build writes layer.zip to S3 and aws_lambda_layer_version depends on this invocation."
note = "It must not import aft_common: it runs before the layer it builds exists."

[module_notes."aft_lambda.aft_customizations"]
purpose = "Package for the Lambda tasks of the aft-invoke-customizations state machine."
does = "Groups identify_targets, audit_trigger, get_pipeline_executions and execute_pipeline; no code of its own."
flow = "Step Functions aft-invoke-customizations invokes the handlers below (journey 6)."

[module_notes."aft_lambda.aft_customizations.aft_customizations_audit_trigger"]
purpose = "Records who or what started each aft-invoke-customizations run, so a pipeline run can be traced back to its request."
does = "Classifies the run as account_move, manual or account_request from the event; writes one row per execution with targets, bypass_steps and customization_request_id; logs a line linking the execution id to the request id."
flow = "Step Functions aft-invoke-customizations → Lambda aft-customizations-audit-trigger → ddb.put_ddb_item on DynamoDB aft-customizations-audit (name from SSM) → logger.customization_request_logger."
note = "Unlike the other handlers it never raises: any error is returned as status 'skipped', so a failed audit write does not stop customizations."

[module_notes."aft_lambda.aft_customizations.aft_customizations_execute_pipeline"]
purpose = "Starts account customization pipelines without exceeding the configured concurrency."
does = "Reads maximum_concurrent_customizations from SSM; starts that many minus the running count from pending_accounts, passing plan_only through; returns the accounts still pending so the state machine can loop."
flow = "Step Functions aft-invoke-customizations (after get_pipeline_executions) → Lambda aft-customizations-execute-pipeline → codepipeline.execute_pipeline → CodePipeline start_pipeline_execution on the account's <account-id>-customizations pipeline."

[module_notes."aft_lambda.aft_customizations.aft_customizations_get_pipeline_executions"]
purpose = "Tells the customizations loop how many account pipelines are already running."
does = "Lists AFT customization pipelines by name pattern and counts those whose latest execution is InProgress."
flow = "Step Functions aft-invoke-customizations loop → Lambda aft-customizations-get-pipeline-executions → codepipeline.list_pipelines, get_running_pipeline_count → returns running_pipelines to execute_pipeline."
note = "Cost of the count is covered by finding pipeline-count-pages-full-history."

[module_notes."aft_lambda.aft_customizations.aft_customizations_identify_targets"]
purpose = "Turns an include/exclude target selection into the concrete list of accounts to customise."
does = "Validates the request against its JSON schema; resolves include and exclude selectors to account ids; skips closed or suspended accounts; builds one customization payload per account and stores the list in S3 for the Map state."
flow = "Start of Step Functions aft-invoke-customizations → Lambda aft-customizations-identify-targets → customizations.validate_identify_targets_request, get_included_accounts / get_excluded_accounts → account_request_framework.get_account_request_record, build_account_customization_payload → customizations.upload_target_account_info (S3 customizations bucket)."
note = "See finding identify-targets-list-mutated-while-iterating."

[module_notes."aft_lambda.aft_feature_options"]
purpose = "Package for the three Lambda tasks of the aft-features state machine."
does = "Groups delete_default_vpc, enroll_support and enable_cloudtrail; no code of its own."
flow = "Step Functions aft_features, started by the provisioning framework, invokes the handlers below (journey 5)."

[module_notes."aft_lambda.aft_feature_options.aft_delete_default_vpc"]
purpose = "Implements the delete-default-VPCs feature option for vended accounts."
does = "Reads the SSM flag /aft/config/feature/delete-default-vpcs-enabled; per region, finds the default VPC and removes its internet gateways, subnets, route tables, ACLs and security groups before the VPC; skips regions it cannot reach."
flow = "Step Functions aft_features → Lambda aft_delete_default_vpc → feature_options.get_aws_regions, get_default_vpc, delete_internet_gateways … delete_vpc → EC2."
note = "Which account the per-region clients reach is covered by finding delete-default-vpc-wrong-account."

[module_notes."aft_lambda.aft_feature_options.aft_enable_cloudtrail"]
purpose = "Implements the CloudTrail data-events feature option at organization level."
does = "When the SSM flag is 'true', ensures the AFT organization trail exists in the CT management account, has data-event selectors for the log-archive buckets and is logging; when 'false', deletes that trail."
flow = "Step Functions aft_features → Lambda aft_enable_cloudtrail → SSM /aft/account/log-archive/log_bucket_arn and kms_key_arn → feature_options.get_log_bucket_arns (log-archive account), trail_exists, create_trail, put_event_selectors, start_logging / delete_trail → CloudTrail in the CT management account."
note = "The trail is organization-wide, so this runs the same check for every vended account."

[module_notes."aft_lambda.aft_feature_options.aft_enroll_support"]
purpose = "Implements the Enterprise Support feature option for vended accounts."
does = "Validates the target account id; when the SSM flag is 'true', asks premium_support to make sure an enrolment case exists for the account."
flow = "Step Functions aft_features → Lambda aft_enroll_support → premium_support.ensure_enterprise_support_enrollment → DynamoDB aft-request-metadata flag and the AWS Support API in the CT management account."

[module_notes."sources.aft-lambda-layer.aft_common"]
purpose = "Package root of the shared library that is published as the aft_common Lambda layer."
does = "Holds no code; its submodules are imported by every handler as aft_common.*."
flow = "Built by Lambda codebuild_trigger's CodeBuild project into layer.zip and attached to every AFT Lambda."

[module_notes."sources.aft-lambda-layer.aft_common.account_provisioning_framework"]
purpose = "Holds the work done inside or for a freshly vended account by the provisioning state machine."
does = "Creates or updates AWSAFTService and AWSAFTExecution in the target account with a trust policy to AWSAFTAdmin, then waits until both can be assumed; writes the account's aft-request-metadata row; turns account_tags into Organizations tags. Also defines the AFT role-name constants the rest of the library imports."
flow = "Called by the create_role, persist_metadata and tag_account handlers (journey 4); its ProvisionRoles constants are imported across the layer → IAM in the vended account (via AWSControlTowerExecution), DynamoDB aft-request-metadata, Organizations."
note = "deploy_aws_aft_roles sleeps 65 s for IAM propagation after the roles become assumable. See finding role-names-in-three-places."

[module_notes."sources.aft-lambda-layer.aft_common.account_request_framework"]
purpose = "The request rules: what goes on the queue, whether a request is valid, and how it becomes a Service Catalog call."
does = "Builds and sends the SQS message for a stream record; validates new requests (name and email unused in Organizations) and updates (only the OU may change); provisions or updates the Account Factory product in the CT management account; reads aft-request records and builds the customization payload every later step uses; manages the AWSAFTService association with the Account Factory portfolio and the concurrency threshold."
flow = "Used by the action trigger (via AccountRequestRecordHandler), the audit trigger, the processor, the invoke-provisioning-framework Lambda and identify_targets → SQS aft-account-request.fifo, DynamoDB aft-request and aft-request-audit, Service Catalog and Control Tower in the CT management account."

[module_notes."sources.aft-lambda-layer.aft_common.account_request_record_handler"]
purpose = "Turns one aft-request stream record into exactly one action."
does = "Validates that the event comes from DynamoDB and opens the needed sessions; decides between remove, customization-only, create and update; for customization-only, builds the payload and starts the provisioning state machine directly."
flow = "Lambda aft-account-request-action-trigger → AccountRequestRecordHandler.process_request → handle_remove (Lambda aft-cleanup-resources), handle_account_request (account_request_framework.insert_msg_into_acc_req_queue → SQS) or handle_customization_request (Step Functions aft-account-provisioning-framework)."
note = "See finding stale-invoke-lambda-wiring."

[module_notes."sources.aft-lambda-layer.aft_common.aft_types"]
purpose = "Names the shape of the payload that flows through every provisioning and customization step."
does = "Defines AftAccountInfo (account details from Organizations) and AftInvokeAccountCustomizationPayload (account_info, account_request, control_tower_event, customization_request_id and optional plan_only and customization_triggers)."
flow = "Type hints only: organizations.get_aft_account_info returns AftAccountInfo; account_request_framework.build_account_customization_payload and s3.put_target_account_info use the payload type."

[module_notes."sources.aft-lambda-layer.aft_common.aft_utils"]
purpose = "Common plumbing every AWS-calling module in the layer leans on."
does = "Retries throttled boto3 calls with backoff (resubmit_request_on_boto_throttle) and provides high-retry and region-probe boto configs; starts Lambdas asynchronously and Step Functions executions by name; recognises the Control Tower events AFT handles; pages nextToken APIs and splits lists into batches; escapes newlines and tabs in values before they are logged."
flow = "Imported throughout aft_common and by several handlers; invoke_lambda and invoke_step_function are how the record handler and the invoke-provisioning-framework Lambda reach Lambda aft-cleanup-resources and Step Functions aft-account-provisioning-framework."
note = "The throttle decorator re-sends the whole call, so it is meant only for reads or idempotent writes."

[module_notes."sources.aft-lambda-layer.aft_common.auth"]
purpose = "The one place AFT gets credentials for any account it touches."
does = "Refuses to start unless running in the AFT management account (checked against SSM); assumes the hub role AWSAFTAdmin and from it a spoke role (AWSAFTExecution by default) in a target account; shortcuts for the CT management and log-archive accounts; accepts an optional session policy to narrow a spoke session."
flow = "AuthClient is built by almost every handler → SSM role and session names, STS AssumeRole (hub then spoke) → returns boto3 Sessions used for Organizations, Service Catalog, IAM, SSM, CloudTrail and Support calls."

[module_notes."sources.aft-lambda-layer.aft_common.codepipeline"]
purpose = "Finds and drives the per-account customization pipelines in the AFT management account."
does = "Finds an account's pipeline by name prefix and the managed_by=AFT tag; tells whether its latest execution is in progress; starts it (optionally with PLAN_ONLY) unless already running; counts running pipelines; deletes a pipeline that is not running."
flow = "Used by execute_pipeline and get_pipeline_executions (aft-invoke-customizations) and by aft_cleanup_resources → CodePipeline list_pipelines, list_pipeline_executions, start_pipeline_execution, delete_pipeline."
note = "See finding pipeline-count-pages-full-history."

[module_notes."sources.aft-lambda-layer.aft_common.constants"]
purpose = "One list of the SSM parameter names through which AFT finds its own resources and settings at run time."
does = "Names the SSM paths for tables, queue, state machines, Lambdas, SNS topics, buckets, shared account ids, feature flags and versions; the custom-fields path; the account_move trigger token."
flow = "Imported by most aft_common modules and handlers and passed to ssm.get_ssm_parameter_value; the parameters themselves are created by the Terraform module aft-ssm-parameters."

[module_notes."sources.aft-lambda-layer.aft_common.control_tower"]
purpose = "Lets the processor see how busy Control Tower is before it asks for another account."
does = "Finds the AWSControlTowerBaseline ARN (memoised per instance); lists enabled baselines with filters; counts those UNDER_CHANGE."
flow = "AccountRequest.provisioning_threshold_reached (Lambda aft-account-request-processor) → ControlTowerFacade.get_enabled_baselines_under_change_count → Control Tower list_baselines / list_enabled_baselines in the CT management account."

[module_notes."sources.aft-lambda-layer.aft_common.customizations"]
purpose = "Resolves who should be customised when someone re-runs customizations."
does = "Validates the request against schemas/identify_targets_request_schema.json; expands selectors all, core, ous, tags and accounts into account ids and keeps only AFT-managed or core ones; subtracts the exclude list; uploads the per-account payloads to S3."
flow = "Lambda aft-customizations-identify-targets → DynamoDB aft-request-metadata (all AFT accounts), SSM core-account ids, OrganizationsAgent (OUs, tags) → s3.put_target_account_info to the customizations bucket under sfn/<execution-id>/target_account_info.json."
note = "See finding map-itemreader-hardcoded-partition."

[module_notes."sources.aft-lambda-layer.aft_common.ddb"]
purpose = "Minimal DynamoDB access shared by the handlers."
does = "Gets, puts and deletes one item by key through the resource API; converts stream images from DynamoDB's typed format to plain Python."
flow = "Used by the event logger, record handler, persist_metadata, cleanup, customizations audit, premium_support and account_request_framework → DynamoDB aft-request, aft-request-metadata, aft-controltower-events, aft-customizations-audit."

[module_notes."sources.aft-lambda-layer.aft_common.exceptions"]
purpose = "Named errors for the Account Factory portfolio association."
does = "Defines ServiceRoleNotAssociated and NoAccountFactoryPortfolioFound."
flow = "Raised in account_request_framework.AccountRequest; the processor catches NoAccountFactoryPortfolioFound and only logs a warning."

[module_notes."sources.aft-lambda-layer.aft_common.feature_options"]
purpose = "The EC2 and CloudTrail operations behind the feature-option Lambdas."
does = "Lists regions and finds, empties and deletes a default VPC (gateways, subnets, route tables, ACLs, security groups); checks, creates, configures, starts and deletes the AFT organization trail; lists log-archive bucket ARNs; extracts and validates the target account id from a Step Functions event."
flow = "Called by aft_delete_default_vpc, aft_enable_cloudtrail and aft_enroll_support (Step Functions aft_features) with sessions those handlers open → EC2 in each region, CloudTrail in the CT management account, S3 list_buckets in the log-archive account."

[module_notes."sources.aft-lambda-layer.aft_common.logger"]
purpose = "Makes every AFT log line one JSON object, so CloudWatch Logs Insights can query them."
does = "Sets a JSON log format and the level from the log_level env var; encodes dicts, datetimes and streaming bodies; offers a logger adapter that adds account_id and customization_request_id to every line."
flow = "configure_aft_logger runs at import in every handler; customization_request_logger is used by the provisioning, feature-option and customizations audit handlers to tie log lines to one request."
note = "It replaces the process-wide log record factory, so any library logging in the same Lambda is JSON-encoded too."

[module_notes."sources.aft-lambda-layer.aft_common.metrics"]
purpose = "Optional usage reporting to the AWS Solutions metrics endpoint."
does = "Checks the SSM opt-in flag; builds a payload with version, deployment UUID, account id and feature-flag settings; POSTs it; also runs as a script from CodeBuild."
flow = "Lambda aft-account-request-processor posts after each provisioning or update call; the customization buildspecs run metrics.py --codebuild-name … at the end of a build → SSM reads → HTTPS POST."
note = "See finding metrics-post-without-timeout."

[module_notes."sources.aft-lambda-layer.aft_common.notifications"]
purpose = "How a failing Lambda tells operators, since most AFT work runs unattended."
does = "Publishes to an SNS topic; formats a failure message with the function name, request id and log group and sends it to the failure topic named in SSM."
flow = "Called from the except block of nearly every handler → SSM /aft/account/aft-management/sns/failure-topic-arn → SNS aft-failure-notifications."

[module_notes."sources.aft-lambda-layer.aft_common.organizations"]
purpose = "Answers AFT's questions about the organization: which account has this email, which OU is it in, what is it tagged with."
does = "Looks accounts up by email or id and builds AftAccountInfo; walks OUs, including the nested 'Name (ou-id)' format, and lists accounts per OU; checks OU membership; tags and reads tags on accounts. Results of the account and OU listings are memoised per instance."
flow = "OrganizationsAgent is built with a CT management session by the record handler, processor, invoke-provisioning-framework, cleanup, identify_targets, customizations, service_catalog and tag_account → Organizations API in the CT management account."
note = "See finding tag-rollback-dead-and-broken."

[module_notes."sources.aft-lambda-layer.aft_common.premium_support"]
purpose = "Enrols a vended account in Enterprise Support without opening duplicate cases."
does = "Reads and sets an enrolment flag on the account's aft-request-metadata row; searches existing support cases for one about the account; opens a case if none exists."
flow = "Lambda aft_enroll_support → is_enrollment_flagged_in_metadata (DynamoDB aft-request-metadata) → account_enrollment_requested / generate_case (Support API in the CT management account) → set_enrollment_flag_in_metadata."
note = "See finding support-flag-overwritten-by-persist-metadata."

[module_notes."sources.aft-lambda-layer.aft_common.s3"]
purpose = "Stores the customization target list where the Step Functions Map state can read it."
does = "Serialises the payload list to JSON and puts it as one S3 object."
flow = "customizations.upload_target_account_info → put_target_account_info → S3 customizations bucket."

[module_notes."sources.aft-lambda-layer.aft_common.service_catalog"]
purpose = "Talks to the Control Tower Account Factory product in Service Catalog."
does = "Finds the product id and an active provisioning artifact by the product name in SSM; decides whether an account is already enrolled by finding a healthy (AVAILABLE or TAINTED, once provisioned) provisioned product for it; pages healthy products and matches emails."
flow = "Used by account_request_framework.create_new_account / update_existing_account and by AccountRequestRecordHandler (get_account_id_if_enrolled) → Service Catalog in the CT management account, assumed as AWSAFTService."

[module_notes."sources.aft-lambda-layer.aft_common.shared_account"]
purpose = "Stops AFT from treating the Control Tower shared accounts like vended ones."
does = "Reads the CT management, log-archive and audit account ids from SSM; reports whether a request names one of them; rejects a request whose email and name only half-match a shared account or that would move one out of its OU."
flow = "AccountRequestRecordHandler.process_request → shared_account_request → Organizations describe_account in the CT management account; True sends the request down the customization-only path."

[module_notes."sources.aft-lambda-layer.aft_common.sqs"]
purpose = "The SQS calls behind the account-request queue."
does = "Builds the queue URL from the session's region and account; sends a JSON message; receives one message; deletes a message by receipt handle."
flow = "account_request_framework.insert_msg_into_acc_req_queue sends; Lambda aft-account-request-processor receives and deletes → SQS aft-account-request.fifo."
note = "See findings fifo-unique-group-id and processor-one-request-per-run."

[module_notes."sources.aft-lambda-layer.aft_common.ssm"]
purpose = "Reads and writes SSM parameters, the registry through which AFT code finds its own resources."
does = "Reads one parameter with an in-process cache; lists parameter names under a path; puts and deletes parameters under the custom-fields path, retrying on throttling."
flow = "get_ssm_parameter_value is called from nearly every module with names from constants; the put/list/delete functions are used by Lambda account_metadata_ssm in the vended account."
note = "See finding ssm-cache-never-expires."

[module_notes."sources.aft-lambda-layer.setup"]
purpose = "Packages aft_common for the layer build."
does = "Declares the packages and includes the JSON schemas as package data."
flow = "Run by the layer CodeBuild project that Lambda codebuild_trigger starts; output goes into layer.zip."

[module_notes."sources.scripts.terraform_client"]
purpose = "A small client for the Terraform Cloud / Enterprise API, used when AFT runs Terraform remotely instead of in CodeBuild."
does = "Creates and finds workspaces and projects; uploads configuration versions; sets, updates and deletes workspace variables; starts plan, apply and destroy runs and waits for them to settle; fetches plan JSON."
flow = "Imported only by workspace_manager inside CodeBuild → HTTPS to the endpoint passed to init."
note = "See finding terraform-client-delete-precedence."

[module_notes."sources.scripts.workspace_manager"]
purpose = "The command-line entry point CodeBuild runs to apply, plan or destroy a Terraform Cloud / Enterprise workspace for an AFT pipeline."
does = "Creates or reuses the workspace and gives it AWS access, either through HCP OIDC variables or role credentials it obtains by assuming a role; uploads the configuration and starts a run, plan-only or apply; exports a plan's JSON to the plan-output S3 bucket; destroys and deletes a workspace."
flow = "Buildspecs for the account-request, provisioning-customizations, global- and account-customizations pipelines run it with --operation deploy|plan|delete → terraform_client (HTTPS), STS AssumeRole, S3 put_object."

[[layers]]
id = "handlers-request"
name = "Account request handlers"
owns = "The Lambdas of the request pipeline: audit and act on aft-request stream records, pull one request off the FIFO queue every 5 minutes and hand it to Control Tower, record Control Tower events and start the provisioning state machine, clean up after a removed request. Each file is one Lambda; each catches every error, publishes it to the failure SNS topic and re-raises."
modules = ["aft_lambda.aft_account_request_framework", "aft_lambda.aft_account_request_framework.*", "aft_lambda", "__init__"]

[[layers]]
id = "handlers-provisioning"
name = "Provisioning framework handlers"
owns = "The four Lambda tasks of the aft-account-provisioning-framework state machine: persist account metadata, create the AFT roles in the new account, tag the account in Organizations, mirror custom fields into SSM in the new account. Each reads its input from the Step Functions payload (action + payload) and checks the action name."
modules = ["aft_lambda.aft_account_provisioning_framework", "aft_lambda.aft_account_provisioning_framework.*"]

[[layers]]
id = "handlers-feature-options"
name = "Feature option handlers"
owns = "The three Lambda tasks of the aft-features state machine: delete default VPCs, open an Enterprise Support enrolment case, manage the AFT CloudTrail data-events trail. Each one is a no-op unless its SSM feature flag says \"true\"."
modules = ["aft_lambda.aft_feature_options", "aft_lambda.aft_feature_options.*"]

[[layers]]
id = "handlers-customizations"
name = "Customization handlers"
owns = "The Lambda tasks of the aft-invoke-customizations state machine: work out which accounts to customise, write an audit row, count running pipelines and start more account pipelines up to the configured maximum."
modules = ["aft_lambda.aft_customizations", "aft_lambda.aft_customizations.*"]

[[layers]]
id = "common-requests"
name = "aft_common: request records"
owns = "Turns an aft-request stream record into a decision (create, update, customise, remove), builds the SQS message and the customization payload, validates requests against Organizations, and calls Service Catalog to provision or update the account. Also recognises the shared Control Tower accounts (management, log archive, audit)."
modules = ["sources.aft-lambda-layer.aft_common.account_request_record_handler", "sources.aft-lambda-layer.aft_common.account_request_framework", "sources.aft-lambda-layer.aft_common.shared_account"]

[[layers]]
id = "common-provisioning"
name = "aft_common: provisioning and features"
owns = "Work done inside or for a vended account: AWSAFTExecution / AWSAFTService role creation, account tags, the aft-request-metadata row, default-VPC and CloudTrail helpers, and Enterprise Support enrolment. ProvisionRoles also holds the AFT role-name constants that much of the library imports."
modules = ["sources.aft-lambda-layer.aft_common.account_provisioning_framework", "sources.aft-lambda-layer.aft_common.feature_options", "sources.aft-lambda-layer.aft_common.premium_support"]

[[layers]]
id = "common-customizations"
name = "aft_common: customizations"
owns = "Resolves an include/exclude target spec (all, core, ous, tags, accounts) into account ids from the metadata table and Organizations, and uploads the per-account payload list to S3 for the Map state."
modules = ["sources.aft-lambda-layer.aft_common.customizations"]

[[layers]]
id = "common-aws"
name = "aft_common: AWS clients and auth"
owns = "Thin wrappers over one AWS service each (SSM, DynamoDB, SQS, S3, SNS, Organizations, Service Catalog, Control Tower, CodePipeline), the cross-account session factory AuthClient, and the opt-in usage-metrics HTTP call."
modules = ["sources.aft-lambda-layer.aft_common.auth", "sources.aft-lambda-layer.aft_common.ssm", "sources.aft-lambda-layer.aft_common.ddb", "sources.aft-lambda-layer.aft_common.sqs", "sources.aft-lambda-layer.aft_common.s3", "sources.aft-lambda-layer.aft_common.notifications", "sources.aft-lambda-layer.aft_common.organizations", "sources.aft-lambda-layer.aft_common.service_catalog", "sources.aft-lambda-layer.aft_common.control_tower", "sources.aft-lambda-layer.aft_common.codepipeline", "sources.aft-lambda-layer.aft_common.metrics"]

[[layers]]
id = "common-utils"
name = "aft_common: utilities"
owns = "Leaf helpers with no AWS calls of their own beyond what the caller passes in: SSM parameter-name constants, boto retry configs and the throttle-resubmit decorator, Lambda/Step Functions start helpers, log sanitising, the JSON logger, typed payloads and exceptions."
modules = ["sources.aft-lambda-layer.aft_common", "sources.aft-lambda-layer.aft_common.aft_utils", "sources.aft-lambda-layer.aft_common.constants", "sources.aft-lambda-layer.aft_common.logger", "sources.aft-lambda-layer.aft_common.aft_types", "sources.aft-lambda-layer.aft_common.exceptions"]

[[layers]]
id = "build-and-scripts"
name = "Layer build and CodeBuild scripts"
owns = "Code that runs outside the request flow: the Lambda that builds the aft_common layer during terraform apply (it must not import aft_common), the layer's setup.py, and the Terraform Cloud / Enterprise workspace scripts that CodeBuild runs for account-request and customization pipelines."
modules = ["aft_lambda.aft_builder.*", "sources.aft-lambda-layer.setup", "sources.scripts.*"]

[[journeys]]
id = "account-request-intake"
title = "1 · An account request lands in DynamoDB and is queued"
actor = "customer · account-request repository"
trigger = "CodePipeline applies the aft-account-request Terraform → item in DynamoDB aft-request → stream → Lambda aft-account-request-action-trigger"
summary = "The customer's Terraform writes one item per account (key = the account email) to DynamoDB aft-request. Two Lambdas read the table's stream: aft-account-request-audit-trigger copies every image into aft-request-audit, and aft-account-request-action-trigger decides what the change means — a new account goes on the SQS FIFO queue as ADD, a changed Control Tower parameter as UPDATE, a customization-only change goes straight to the provisioning Step Functions, and a deleted item triggers cleanup."
  [[journeys.steps]]
  symbol = "aft_lambda.aft_account_request_framework.aft_account_request_audit_trigger:lambda_handler"
  actor = "DynamoDB stream of aft-request (batch_size 1)"
  action = "Audit copy, running beside the action trigger on the same stream: looks up the audit table name in SSM, picks NewImage (or OldImage for REMOVE) and writes it with a timestamp and the event name."
  receives = "stream event: Records[0] with eventSource aws:dynamodb, eventName INSERT/MODIFY/REMOVE, dynamodb.NewImage/OldImage"
  returns = "nothing; on error an SNS failure message and a re-raise"
  stores = "one item in DynamoDB aft-request-audit (via put_audit_record)"
  payload = '''
{"eventName": "INSERT", "dynamodb": {"NewImage": {"id": {"S": "dev-team@example.com"},
 "control_tower_parameters": {"M": {"AccountName": {"S": "dev-team"}, "ManagedOrganizationalUnit": {"S": "Sandbox"}}}}}}





'''
  [[journeys.steps]]
  symbol = "aft_lambda.aft_account_request_framework.aft_account_request_action_trigger:lambda_handler"
  actor = "DynamoDB stream of aft-request (batch_size 1, maximum_retry_attempts 1)"
  action = "The real consumer of the change. Builds an AuthClient, wraps the stream record in AccountRequestRecordHandler and calls process_request."
  receives = "the same stream event as the audit trigger"
  returns = "nothing; on error an SNS failure message ('AFT account request failed') and a re-raise"
  [[journeys.steps]]
  symbol = "sources.aft-lambda-layer.aft_common.account_request_record_handler:AccountRequestRecordHandler"
  action = "Constructor: _validate_event rejects anything whose eventSource is not aws:dynamodb, opens the AFT-management and CT-management sessions, keeps OldImage/NewImage and works out whether control_tower_parameters changed (only on MODIFY)."
  receives = "auth, event"
  returns = "the handler object with is_create_action / is_update_action / control_tower_parameters_updated"
  [[journeys.steps]]
  symbol = "sources.aft-lambda-layer.aft_common.account_request_record_handler:AccountRequestRecordHandler.process_request"
  action = "The decision tree, in this order: REMOVE → handle_remove (invokes Lambda aft-cleanup-resources, named in SSM); not a CT-parameter change and the account is a shared core account → customization only; INSERT for an account not yet enrolled → ADD; INSERT for an account already enrolled in Control Tower → customization only; MODIFY with CT parameters changed → UPDATE; any other MODIFY → customization only."
  receives = "the parsed record"
  returns = "nothing; 'Unsupported account request' raises"
  [[journeys.steps]]
  symbol = "sources.aft-lambda-layer.aft_common.shared_account:shared_account_request"
  action = "Is the request about a shared account (CT management, log archive, audit)? Compares email and name with each shared account in Organizations, and refuses a request that tries to move one out of its OU."
  receives = "event_record, auth"
  returns = "True for a shared account"
  [[journeys.steps]]
  symbol = "sources.aft-lambda-layer.aft_common.service_catalog:get_account_id_if_enrolled"
  action = "For an INSERT: looks the email up in Organizations and then searches Service Catalog for a healthy Account Factory provisioned product with that account as physicalId."
  receives = "the stream record"
  returns = "the account id if already enrolled, else None (→ a new account)"
  [[journeys.steps]]
  symbol = "sources.aft-lambda-layer.aft_common.account_request_record_handler:AccountRequestRecordHandler.handle_account_request"
  action = "ADD or UPDATE path: hands the record to insert_msg_into_acc_req_queue with new_account True/False."
  receives = "new_account flag"
  returns = "nothing"
  [[journeys.steps]]
  symbol = "sources.aft-lambda-layer.aft_common.account_request_framework:insert_msg_into_acc_req_queue"
  action = "Reads the queue name from SSM /aft/resources/sqs/aft-request-queue-name, builds the queue URL from the caller identity, builds the message and sends it."
  receives = "event_record, new_account, session"
  returns = "nothing"
  [[journeys.steps]]
  symbol = "sources.aft-lambda-layer.aft_common.account_request_framework:build_sqs_message"
  action = "Shrinks the record to what the processor needs: the operation, the new control_tower_parameters and, on MODIFY, the old ones."
  receives = "the stream record"
  returns = "message dict"
  payload = '''
{"operation": "ADD",
 "control_tower_parameters": {"AccountEmail": "dev-team@example.com", "AccountName": "dev-team",
   "ManagedOrganizationalUnit": "Sandbox", "SSOUserEmail": "jane.doe@example.com",
   "SSOUserFirstName": "Jane", "SSOUserLastName": "Doe"}}





'''
  [[journeys.steps]]
  symbol = "sources.aft-lambda-layer.aft_common.sqs:send_sqs_message"
  action = "Sends the JSON body to SQS aft-account-request.fifo. Deduplication id and message group id are both a fresh uuid1, so every message is its own group."
  receives = "sqs_url, message"
  returns = "SQS SendMessage response"
  stores = "one message on SQS aft-account-request.fifo — picked up by journey 2"

[[journeys]]
id = "account-request-processor"
title = "2 · Every 5 minutes, one queued request goes to Control Tower"
actor = "EventBridge schedule"
trigger = "EventBridge rule aft-lambda-account-request-processor, rate(5 minutes) → Lambda aft-account-request-processor"
summary = "A scheduled Lambda makes sure the AWSAFTService role can use the Account Factory portfolio, stops if too many Control Tower baselines are already UNDER_CHANGE, then takes at most one message from the FIFO queue. ADD becomes a Service Catalog ProvisionProduct in the CT management account, UPDATE an UpdateProvisionedProduct; the message is deleted once handled."
  [[journeys.steps]]
  symbol = "aft_lambda.aft_account_request_framework.aft_account_request_processor:lambda_handler"
  actor = "EventBridge rule aft-lambda-account-request-processor (rate(5 minutes))"
  action = "Orchestrates one run. The concurrency limit comes from the env var AFT_PROVISIONING_CONCURRENCY; the queue name from SSM."
  receives = "the scheduled EventBridge event (content unused)"
  returns = "None; on error an SNS failure message and a re-raise"
  [[journeys.steps]]
  symbol = "sources.aft-lambda-layer.aft_common.account_request_framework:AccountRequest"
  action = "Constructor: assumes into the CT management account as AWSAFTService, reads its account id and finds the Account Factory product id."
  receives = "auth"
  returns = "AccountRequest with ct_management_session and account_factory_product_id"
  [[journeys.steps]]
  symbol = "sources.aft-lambda-layer.aft_common.account_request_framework:AccountRequest.associate_aft_service_role_with_account_factory"
  action = "Associates the AWSAFTService role ARN with the 'AWS Control Tower Account Factory Portfolio' (found by name through account_factory_portfolio_id). A missing portfolio only logs a warning."
  receives = "nothing"
  returns = "nothing"
  [[journeys.steps]]
  symbol = "sources.aft-lambda-layer.aft_common.account_request_framework:AccountRequest.provisioning_threshold_reached"
  action = "Counts Control Tower enabled baselines in status UNDER_CHANGE (ControlTowerFacade.get_enabled_baselines_under_change_count); at or above the threshold the run ends without touching the queue."
  receives = "threshold"
  returns = "bool"
  [[journeys.steps]]
  symbol = "sources.aft-lambda-layer.aft_common.sqs:receive_sqs_message"
  action = "ReceiveMessage with MaxNumberOfMessages=1 on aft-account-request.fifo."
  receives = "queue name"
  returns = "one message (Body = the JSON from journey 1) or None"
  [[journeys.steps]]
  symbol = "sources.aft-lambda-layer.aft_common.account_request_framework:new_ct_request_is_valid"
  action = "ADD only: the request is valid when neither the AccountName nor the AccountEmail is already used in Organizations (account_name_or_email_in_use pages through every account). UPDATE uses modify_ct_request_is_valid instead: only ManagedOrganizationalUnit may differ from the old parameters."
  receives = "ct_management_session, request body"
  returns = "bool"
  [[journeys.steps]]
  symbol = "sources.aft-lambda-layer.aft_common.account_request_framework:create_new_account"
  action = "Calls Service Catalog provision_product in the CT management account: product and provisioning artifact from service_catalog helpers, ProvisionedProductName = AccountName with spaces turned into hyphens, every control_tower_parameters key passed as a provisioning parameter, a User-Agent header carrying the AFT version from SSM. UPDATE goes to update_existing_account, which finds the healthy provisioned product for the account and calls update_provisioned_product."
  receives = "session, ct_management_session, request"
  returns = "ProvisionProduct response (record id)"
  stores = "a Control Tower account creation in progress; when it ends, Control Tower emits CreateManagedAccount — journey 3"
  payload = '''
{"ProvisionedProductName": "dev-team",
 "ProvisioningParameters": [{"Key": "AccountEmail", "Value": "dev-team@example.com"},
   {"Key": "ManagedOrganizationalUnit", "Value": "Sandbox"}]}





'''
  [[journeys.steps]]
  symbol = "sources.aft-lambda-layer.aft_common.sqs:delete_sqs_message"
  action = "Deletes the message — also when the request was judged invalid, after which the handler raises 'CT Request is not valid' (SNS failure). If provisioning itself raised, the message is not deleted and goes to the DLQ (maxReceiveCount 1)."
  receives = "the message's ReceiptHandle"
  returns = "nothing"

[[journeys]]
id = "controltower-event-starts-provisioning"
title = "3 · Control Tower's lifecycle event starts the provisioning framework"
actor = "Control Tower (CT management account)"
trigger = "EventBridge rule aft-capture-ct-events (CT management) → bus aft-events-from-ct-management → rule aft-controltower-event-logger → Lambdas aft-controltower-event-logger and aft-invoke-aft-account-provisioning-framework"
summary = "When Control Tower finishes CreateManagedAccount or UpdateManagedAccount, the event is forwarded to AFT's own bus. One target stores the raw event in DynamoDB aft-controltower-events; the other turns it into the customization payload — account info from Organizations, the request from aft-request, optional OU-move triggers — and starts the account provisioning Step Functions."
  [[journeys.steps]]
  symbol = "aft_lambda.aft_account_request_framework.aft_controltower_event_logger:lambda_handler"
  actor = "EventBridge rule aft-controltower-event-logger (pattern: account = CT management account)"
  action = "Writes the whole EventBridge event, as received, to the table named in SSM /aft/resources/ddb/aft-controltower-events-table-name (keys id and time come from the event envelope)."
  receives = "the EventBridge event"
  returns = "the PutItem response"
  stores = "one item in DynamoDB aft-controltower-events"
  payload = '''
{"id": "6f1c0e2a-0000-4000-8000-000000000001", "time": "2026-10-04T09:12:00Z",
 "source": "aws.controltower", "account": "111111111111",
 "detail": {"eventName": "CreateManagedAccount", "serviceEventDetails": {"createManagedAccountStatus":
   {"account": {"accountId": "222222222222", "accountName": "dev-team"}, "state": "SUCCEEDED"}}}}





'''
  [[journeys.steps]]
  symbol = "aft_lambda.aft_account_request_framework.aft_invoke_aft_account_provisioning_framework:lambda_handler"
  actor = "EventBridge rule aft-controltower-event-logger (second target, same event)"
  action = "Accepts two event shapes: a supported Control Tower event, or a bare {account_request: …}. Anything else raises 'Invoked with unrecognized event type'."
  receives = "the same EventBridge event"
  returns = "None; on error an SNS failure message and a re-raise"
  [[journeys.steps]]
  symbol = "sources.aft-lambda-layer.aft_common.aft_utils:is_aft_supported_controltower_event"
  action = "True only for source aws.controltower with eventName CreateManagedAccount or UpdateManagedAccount."
  receives = "event"
  returns = "bool"
  [[journeys.steps]]
  symbol = "sources.aft-lambda-layer.aft_common.organizations:OrganizationsAgent.get_account_email_from_id"
  action = "The CT event carries the account id but not the email, and the email is the key of aft-request — so it asks Organizations."
  receives = "account_id 222222222222"
  returns = "dev-team@example.com"
  [[journeys.steps]]
  symbol = "sources.aft-lambda-layer.aft_common.account_request_framework:get_account_request_record"
  action = "GetItem on the table named in SSM /aft/resources/ddb/aft-request-table-name; a missing record raises."
  receives = "request_table_id = the email"
  returns = "the account request item"
  [[journeys.steps]]
  symbol = "sources.aft-lambda-layer.aft_common.account_request_framework:build_account_customization_payload"
  action = "Decodes account_tags from its JSON string, fetches account info (OrganizationsAgent.get_aft_account_info) and builds the payload every later Lambda reads, with a new customization_request_id and run_create_pipeline 'true'."
  receives = "ct_management_session, account_id, account_request, control_tower_event"
  returns = "AftInvokeAccountCustomizationPayload"
  payload = '''
{"account_info": {"account": {"id": "222222222222", "email": "dev-team@example.com", "name": "dev-team",
   "parent_id": "ou-ab12-cdef3456", "status": "ACTIVE"}},
 "account_request": {"id": "dev-team@example.com", "account_tags": {"team": "dev"}, "custom_fields": "{\"cost_center\": \"42\"}"},
 "account_provisioning": {"run_create_pipeline": "true"},
 "customization_request_id": "0b7d5c1e-1111-4222-8333-444455556666"}





'''
  [[journeys.steps]]
  symbol = "aft_lambda.aft_account_request_framework.aft_invoke_aft_account_provisioning_framework:detect_customization_triggers"
  action = "Only for UpdateManagedAccount and only when SSM /aft/config/customization-triggers lists account_move: compares the new parent OU with parent_ou in aft-request-metadata, honours account_skip_customization_triggers on the request item, and returns an account_move trigger. Any error is logged and treated as 'no trigger'."
  receives = "event_name, account_id, account_email, new_parent_id"
  returns = "[] or [{type: account_move, old_parent, new_parent}] — added to the payload as customization_triggers"
  [[journeys.steps]]
  symbol = "sources.aft-lambda-layer.aft_common.aft_utils:invoke_step_function"
  action = "Starts the state machine named in SSM /aft/account/aft-management/sfn/aft-account-provisioning-framework-sfn-name with the payload as input."
  receives = "sfn_name, input JSON"
  returns = "StartExecution response"
  stores = "a running execution of Step Functions aft-account-provisioning-framework — journey 4"

[[journeys]]
id = "provisioning-framework"
title = "4 · The provisioning framework prepares the new account"
actor = "Step Functions aft-account-provisioning-framework"
trigger = "StartExecution from aft-invoke-aft-account-provisioning-framework, from the action trigger (customization-only requests), or from the aft-invoke-customizations Map state"
summary = "Four Lambda tasks run in a fixed order — persist_metadata, create_role, tag_account, account_metadata_ssm — each receiving {action, payload = the whole state}. Then the state machine runs the feature-options state machine (journey 5) and the customer's aft-account-provisioning-customizations state machine, starts CodeBuild aft-create-pipeline to create the account's customizations pipeline, optionally starts aft-invoke-customizations for OU-move triggers, and publishes to SNS."
  [[journeys.steps]]
  symbol = "aft_lambda.aft_account_provisioning_framework.aft_account_provisioning_framework_persist_metadata:lambda_handler"
  actor = "Step Functions task aft_account_provisioning_framework_persist_metadata (first state)"
  action = "Checks action == 'persist_metadata' and calls persist_metadata."
  receives = "{job_name, action: 'persist_metadata', payload: <journey 3 payload>}"
  returns = "the PutItem response"
  [[journeys.steps]]
  symbol = "sources.aft-lambda-layer.aft_common.account_provisioning_framework:persist_metadata"
  action = "Writes the account's metadata row: id, email, name, creation time, status, tags, account_customizations_name and parent_ou (later read by detect_customization_triggers and the enterprise-support feature)."
  receives = "payload, account_info, session"
  returns = "PutItem response"
  stores = "one item in DynamoDB aft-request-metadata, keyed by account id"
  [[journeys.steps]]
  symbol = "aft_lambda.aft_account_provisioning_framework.aft_account_provisioning_framework_create_role:lambda_handler"
  actor = "Step Functions task aft_account_provisioning_framework_create_role (Retry 5×, 60 s, backoff 1.5)"
  action = "Checks action == 'create_role' and runs ProvisionRoles(...).deploy_aws_aft_roles for the target account."
  receives = "{action: 'create_role', payload}"
  returns = "None"
  [[journeys.steps]]
  symbol = "sources.aft-lambda-layer.aft_common.account_provisioning_framework:ProvisionRoles.deploy_aws_aft_roles"
  action = "Creates or updates AWSAFTService and AWSAFTExecution in the new account, trusted by AWSAFTAdmin in the AFT management account, waits until both can be assumed, then sleeps 65 s for IAM eventual consistency."
  receives = "nothing (target account id held by the object)"
  returns = "nothing"
  [[journeys.steps]]
  symbol = "sources.aft-lambda-layer.aft_common.account_provisioning_framework:ProvisionRoles._deploy_role_in_target_account"
  action = "Reaches the new account through AWSControlTowerExecution, using a session already federated into the CT management account (or uses that session directly when the target is the CT management account), then _put_role and _put_policy_on_role."
  receives = "role_name, trust_policy, policy_arn"
  returns = "nothing"
  stores = "IAM roles in the vended account"
  [[journeys.steps]]
  symbol = "aft_lambda.aft_account_provisioning_framework.aft_account_provisioning_framework_tag_account:lambda_handler"
  actor = "Step Functions task aft_account_provisioning_framework_tag_account"
  action = "Checks action == 'tag_account', opens the CT management session as AWSAFTService and calls tag_account (rollback flag optional)."
  receives = "{action: 'tag_account', payload, account_info}"
  returns = "None"
  [[journeys.steps]]
  symbol = "sources.aft-lambda-layer.aft_common.account_provisioning_framework:tag_account"
  action = "Turns account_tags into a Key/Value list and tags the account resource in Organizations (OrganizationsAgent.tag_org_resource)."
  receives = "payload, account_info, ct_management_session, rollback"
  returns = "nothing"
  stores = "tags on the account in AWS Organizations"
  [[journeys.steps]]
  symbol = "aft_lambda.aft_account_provisioning_framework.aft_account_provisioning_framework_account_metadata_ssm:lambda_handler"
  actor = "Step Functions task aft_account_provisioning_framework_account_metadata_ssm"
  action = "Publishes custom_fields from the request as SSM parameters under /aft/account-request/custom-fields/ in the new account: assumes AWSAFTService there with a session policy limited to that path, deletes parameters no longer in custom_fields, then puts the rest."
  receives = "{payload: {account_request: {custom_fields: '{\"cost_center\": \"42\"}'}}}"
  returns = "None"
  [[journeys.steps]]
  symbol = "sources.aft-lambda-layer.aft_common.ssm:put_ssm_parameters"
  action = "PutParameter (String, Overwrite) for each custom field. After this task the state machine starts Step Functions aft-features (journey 5), then aft-account-provisioning-customizations, then CodeBuild aft-create-pipeline with VENDED_ACCOUNT_ID, then SNS aft-notifications."
  receives = "target session, {cost_center: '42'}"
  returns = "nothing"
  stores = "SSM parameter /aft/account-request/custom-fields/cost_center in the vended account"

[[journeys]]
id = "feature-options"
title = "5 · Feature options: default VPCs, Enterprise Support, CloudTrail"
actor = "Step Functions aft-features"
trigger = "startExecution.sync from the provisioning framework, input = the whole provisioning state"
summary = "Three Lambda tasks run in order, each switched on or off by an SSM flag under /aft/config/feature/. Each reads customization_request_id and account_info.account.id from the input; a failure in any of them goes to SNS aft-failure-notifications and fails the parent execution."
  [[journeys.steps]]
  symbol = "aft_lambda.aft_feature_options.aft_delete_default_vpc:lambda_handler"
  actor = "Step Functions task 'Delete Default VPCs'"
  action = "Lists regions with the target account's session; if SSM /aft/config/feature/delete-default-vpcs-enabled is 'true', for each region finds the default VPC and deletes its internet gateways, subnets, route tables, ACLs, security groups and the VPC, skipping unreachable regions. Note: the per-region clients are built from the Lambda's own session — see the finding."
  receives = "{customization_request_id, account_info: {account: {id: '222222222222'}}}"
  returns = "None"
  [[journeys.steps]]
  symbol = "sources.aft-lambda-layer.aft_common.feature_options:get_default_vpc"
  action = "DescribeVpcs filtered on isDefault."
  receives = "an EC2 client for one region"
  returns = "VPC id or None"
  [[journeys.steps]]
  symbol = "sources.aft-lambda-layer.aft_common.feature_options:delete_vpc"
  action = "DeleteVpc, after the dependent resources were removed."
  receives = "client, vpc id"
  returns = "nothing"
  [[journeys.steps]]
  symbol = "aft_lambda.aft_feature_options.aft_enroll_support:lambda_handler"
  actor = "Step Functions task 'Enroll Enterprise Support' (Retry on Lambda service errors, 5×)"
  action = "If SSM /aft/config/feature/enterprise-support-enabled is 'true', calls ensure_enterprise_support_enrollment."
  receives = "the same input"
  returns = "None"
  [[journeys.steps]]
  symbol = "sources.aft-lambda-layer.aft_common.premium_support:ensure_enterprise_support_enrollment"
  action = "Skips when aft-request-metadata already flags the account; otherwise looks for an existing support case 'Add Account <id> to Enterprise Support' in the CT management account, opens one if none, and sets the flag afterwards so a failure retries."
  receives = "aft_session, ct_management_session, metadata_table_name, account_id"
  returns = "nothing"
  stores = "a support case in the CT management account; an enrollment flag on the aft-request-metadata row"
  [[journeys.steps]]
  symbol = "aft_lambda.aft_feature_options.aft_enable_cloudtrail:lambda_handler"
  actor = "Step Functions task 'Enable CloudTrail'"
  action = "If SSM /aft/config/feature/cloudtrail-data-events-enabled is 'true', makes sure the organization trail exists in the CT management account with data-event selectors and is logging (bucket and KMS key from SSM /aft/account/log-archive/*); if 'false', deletes that trail."
  receives = "the same input"
  returns = "None"
  [[journeys.steps]]
  symbol = "sources.aft-lambda-layer.aft_common.feature_options:create_trail"
  action = "CreateTrail: multi-region organization trail with log-file validation, into the log-archive bucket, KMS-encrypted."
  receives = "CT management session, bucket name, KMS key ARN"
  returns = "nothing"
  stores = "the AFT organization CloudTrail trail"

[[journeys]]
id = "invoke-customizations"
title = "6 · Re-running customizations for chosen accounts"
actor = "operator · Step Functions console/CLI, or the provisioning framework on an OU move"
trigger = "StartExecution of Step Functions aft-invoke-customizations with {include: [...], exclude?: [...], bypass_steps?: [...]}"
summary = "The state machine resolves the include/exclude selectors to AFT-managed accounts, writes one customization payload per account to S3, re-runs the provisioning framework for each (unless provisioning_bootstrap is bypassed), records an audit item, then starts each account's '<account id>-customizations-pipeline' CodePipeline, never more at a time than SSM /aft/config/customizations/maximum_concurrent_customizations."
  [[journeys.steps]]
  symbol = "aft_lambda.aft_customizations.aft_customizations_identify_targets:lambda_handler"
  actor = "Step Functions task 'Identify Targets' (after a Pass state adds get_execution_id = the execution name)"
  action = "Validates the request, resolves the target accounts, and builds one customization payload per account."
  receives = "{get_execution_id: {execution_id}, include: [{type: 'ous', target_value: ['Sandbox']}], exclude?: [...]}"
  returns = "{number_pending_accounts, pending_accounts, target_accounts_info: {bucket, key}}"
  payload = '''
{"include": [{"type": "ous", "target_value": ["Sandbox"]}],
 "exclude": [{"type": "accounts", "target_value": ["333333333333"]}]}





'''
  [[journeys.steps]]
  symbol = "sources.aft-lambda-layer.aft_common.customizations:validate_identify_targets_request"
  action = "jsonschema against schemas/identify_targets_request_schema.json."
  receives = "the input"
  returns = "True, or raises ValidationError"
  [[journeys.steps]]
  symbol = "sources.aft-lambda-layer.aft_common.customizations:get_included_accounts"
  action = "Expands each selector — all (every id in aft-request-metadata), core, ous, tags, accounts — removes duplicates and keeps only AFT-managed or core accounts (filter_non_aft_accounts). get_excluded_accounts / get_target_accounts subtract the exclude list."
  receives = "sessions, orgs_agent, include list"
  returns = "list of account ids"
  [[journeys.steps]]
  symbol = "sources.aft-lambda-layer.aft_common.account_request_framework:build_account_customization_payload"
  action = "Per account: email from Organizations, request from aft-request (get_account_request_record), then the same payload shape as journey 3, with an empty control_tower_event."
  receives = "ct_management_session, account_id, account_request, {}"
  returns = "AftInvokeAccountCustomizationPayload"
  [[journeys.steps]]
  symbol = "sources.aft-lambda-layer.aft_common.customizations:upload_target_account_info"
  action = "Writes the list of payloads to S3 so the Map state can read it (Step Functions state size is limited). Unless bypass_steps contains provisioning_bootstrap, a distributed Map then starts the provisioning framework (journey 4) once per account, MaxConcurrency = maximum_concurrent_customizations."
  receives = "session, payload list, execution_id"
  returns = "{bucket, key}"
  stores = "sfn/<execution id>/target_account_info.json in the bucket named by SSM /aft/config/customizations/aft_codepipeline_customizations_bucket_id"
  [[journeys.steps]]
  symbol = "aft_lambda.aft_customizations.aft_customizations_audit_trigger:lambda_handler"
  actor = "Step Functions task 'Record Audit' (errors are caught and the run continues)"
  action = "Records who started this execution: trigger_source account_move if customization_triggers is present, manual if bypass_steps is present, else account_request."
  receives = "the state"
  returns = "{status: 'recorded', execution_id}"
  stores = "one item in DynamoDB aft-customizations-audit"
  [[journeys.steps]]
  symbol = "aft_lambda.aft_customizations.aft_customizations_get_pipeline_executions:lambda_handler"
  actor = "Step Functions task 'Get Pipeline Executions'"
  action = "Counts customization pipelines whose latest execution is InProgress (list_pipelines + get_running_pipeline_count)."
  receives = "the state"
  returns = "{running_pipelines: 2}"
  [[journeys.steps]]
  symbol = "aft_lambda.aft_customizations.aft_customizations_execute_pipeline:lambda_handler"
  actor = "Step Functions task 'Execute Pipelines' (looped with a Wait state until no account is pending)"
  action = "Starts maximum_concurrent_customizations − running pipelines, removing each started account from pending_accounts; plan_only is passed through."
  receives = "{running_executions: {running_pipelines}, targets: {pending_accounts}}"
  returns = "{number_pending_accounts, pending_accounts}"
  [[journeys.steps]]
  symbol = "sources.aft-lambda-layer.aft_common.codepipeline:execute_pipeline"
  action = "Finds the account's pipeline by its tag (get_pipeline_for_account) and StartPipelineExecution unless it is already running (PLAN_ONLY variable when asked)."
  receives = "session, account_id, plan_only"
  returns = "nothing"
  stores = "a CodePipeline execution that runs the global and account customizations Terraform against the account"

[[roles]]
id = "http-requests"
name = "Terraform Cloud / Enterprise API (CodeBuild scripts)"
kind = "external"
symbols = ["sources.scripts.terraform_client:check_workspace_exists", "sources.scripts.terraform_client:create_run", "sources.scripts.terraform_client:wait_to_stabilize", "sources.scripts.terraform_client:__delete", "sources.scripts.terraform_client:__get", "sources.scripts.terraform_client:__patch"]
purpose = "When AFT is configured for Terraform Cloud or Enterprise instead of open-source Terraform, the CodeBuild buildspecs call workspace_manager.py, which uses this client to create the workspace, upload the configuration, set credentials/variables, run plan/apply and wait for the result."
input = "Organization, workspace and project names, the API endpoint, the API token and the configuration tarball, all passed as command-line arguments by the buildspec."
message = ["Authorization: Bearer <token>, Content-type: application/vnd.api+json", "JSON:API bodies for workspaces, configuration-versions, vars and runs; status polls every 10 s"]
config = "SSM /aft/config/terraform/api-endpoint, /aft/config/terraform/org-name, /aft/config/terraform/project-name, /aft/config/terraform/distribution (read by the buildspecs) and env TF_DISTRIBUTION read by the client."
output = "Parsed JSON; an 'errors' array becomes ClientError(status, title)."
validation = "No retries and no request timeout; wait_to_stabilize polls without a deadline, so the CodeBuild project timeout is the limit."
logging = "print() to the CodeBuild log, with sanitised status values."
cost = "not measured."
result_use = "Run and workspace ids drive the next call; the build fails on a non-success run state."

[[roles]]
id = "aws-sts"
name = "STS for Terraform workspace credentials (CodeBuild script)"
kind = "external"
symbols = ["sources.scripts.workspace_manager:__assume_role", "sources.scripts.workspace_manager:set_aws_credentials", "sources.scripts.workspace_manager:set_oidc_configuration"]
purpose = "Gives a Terraform Cloud workspace AWS access for one run: either it assumes the target role with the CodeBuild role and writes the temporary keys into the workspace's environment variables, or (OIDC mode) it writes the role ARN and audience so Terraform Cloud federates by itself."
