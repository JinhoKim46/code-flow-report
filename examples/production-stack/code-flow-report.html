.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }

tr.pick:hover td { background: var(--surface-2); }

.finding.sev-high { border-left-color: var(--bad); } .finding.sev-medium { border-left-color: var(--amber); } .finding.sev-low { border-left-color: var(--l0); } .finding.sev-info { border-left-color: var(--muted); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* fade: when something is selected, everything not connected to it steps back */
.fadeable { transition: opacity 0.18s ease; }
.focus .fadeable.dim { opacity: var(--fade, 0.22); }
.focus .medge.dim, .focus .e.dim { stroke-opacity: 0.05; }
.medge.bg { stroke: var(--muted); stroke-opacity: 0.10; stroke-width: 1; }
.focus .medge.bg { stroke-opacity: 0.03; }
.medge.hl, .e.hl { stroke-opacity: 1 !important; stroke-width: 2.4 !important; }
.fadebar { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.fadebar input[type=range] { width: 120px; accent-color: var(--accent); }
.todo { color: var(--amber); font-style: italic; }

imulate processing delay"},"detail":"True now: process_batches marks the batch running, sleeps 1 s and saves a text file 'Processed batch <id> at <time>' as the output, then marks it completed (a code comment says to replace it with actual processing logic). Trigger: any POST /v1/batches. Reach: clients using the OpenAI-style batch flow get status completed and an output file that contains no model results.","evidence":"Read LocalBatchProcessor.process_batches; it calls only storage.save_file and SQLite, no HTTP client.","id":"batch-processor-placeholder","severity":"medium","symbols":["vllm_router.services.batch_service.local_processor:LocalBatchProcessor.process_batches"],"title":"The batch API accepts jobs but never runs them against an engine"},{"_locs":[{"doc":"Save file content to disk","file":"src/vllm_router/services/files_service/file_storage.py","line":48,"params":["self","file_id","user_id","file_name","content","purpose"],"symbol":"vllm_router.services.files_service.file_storage:FileStorage.save_file"},{"doc":"","file":"src/vllm_router/services/batch_service/local_processor.py","line":68,"params":["self","input_file_id","endpoint","completion_window","metadata"],"symbol":"vllm_router.services.batch_service.local_processor:LocalBatchProcessor.create_batch"}],"category":"risk","check":{"kind":"text_in","pattern":"hex\\[:6\\]"},"detail":"True now: FileStorage.save_file names a new file `file-` + uuid4().hex[:6] (16.7 million values) and opens the path with mode 'wb'; batch ids are `batch_` + 6 hex characters. Trigger: two uploads drawing the same id — by the birthday bound about a 3% chance once ~1,000 files exist and ~50% near 4,800. Reach: the earlier file's content is replaced without error (one user's batch input or output becomes another's); a colliding batch id fails the INSERT on the primary key and the POST returns 500.","evidence":"Read FileStorage.save_file and LocalBatchProcessor.create_batch (both use uuid4().hex[:6]); no existence check before writing.","id":"short-file-ids-overwrite","severity":"medium","symbols":["vllm_router.services.files_service.file_storage:FileStorage.save_file","vllm_router.services.batch_service.local_processor:LocalBatchProcessor.create_batch"],"title":"File and batch ids use 6 hex characters, so uploads can silently overwrite each other"},{"_locs":[{"doc":"Reconfigures the router with the given config.","file":"src/vllm_router/dynamic_config.py","line":218,"params":["self","config"],"symbol":"vllm_router.dynamic_config:DynamicConfigWatcher.reconfigure_routing_logic"}],"category":"risk","detail":"True now: DynamicConfigWatcher.reconfigure_routing_logic passes only session_key and the priority_* fields to reconfigure_routing_logic. Trigger: any change to the watched file (reconfigure_all always rebuilds routing). Reach: max_instance_failover_reroute_attempts silently drops to 0 (failover off); switching to kvaware/loadaware passes lmcache_controller_port=None to the LMCache controller; disaggregated modes get no prefill/decode labels; prefixaware loses --prefix-min-match-length; the prefix trie, round-robin counters and LMCache instance map are discarded.","evidence":"Read dynamic_config.py reconfigure_routing_logic and routing_logic.py initialize_routing_logic (kwargs.get defaults) and cleanup_routing_logic; compared with app.py initialize_all, which passes 17 keyword arguments.","id":"dynamic-config-routing-drops-args","severity":"medium","symbols":["vllm_router.dynamic_config:DynamicConfigWatcher.reconfigure_routing_logic"],"title":"A dynamic config reload rebuilds the routing logic with most of its settings missing"},{"_locs":[{"doc":"Reconfigures the router with the given config.","file":"src/vllm_router/dynamic_config.py","line":170,"params":["self","config"],"symbol":"vllm_router.dynamic_config:DynamicConfigWatcher.reconfigure_service_discovery"}],"category":"risk","detail":"True now: DynamicConfigWatcher.reconfigure_service_discovery for k8s passes namespace, port, label selector and labels, but not k8s_service_discovery_type, watcher_timeout_seconds or health_check_timeout_seconds; _create_service_discovery defaults the type to pod-ip. reconfigure_all calls it even when only callbacks or session_key changed. Trigger: any edit of the watched file. Reach: a router started with --k8s-service-discovery-type service-name starts watching pods instead; on every reload the new discovery starts empty and fills from its watch, so requests in that window can get 404/503.","evidence":"Read dynamic_config.py reconfigure_service_discovery / reconfigure_all and service_discovery.py _create_service_discovery / reconfigure_service_discovery.","id":"dynamic-config-sd-drops-type","severity":"medium","symbols":["vllm_router.dynamic_config:DynamicConfigWatcher.reconfigure_service_discovery"],"title":"A dynamic config reload switches service-name discovery back to pod-ip and restarts discovery on every change"},{"_locs":[{"doc":"Route the request to the appropriate engine URL by where the KV cache of the longest prefix match is found. If there is no session id in the request header, it will pick a server with round robin.","file":"src/vllm_router/routers/routing_logic.py","line":370,"params":["self","endpoints","engine_stats","request_stats","request","request_json"],"symbol":"vllm_router.routers.routing_logic:KvawareRouter.route_request"}],"category":"risk","check":{"kind":"text_in","pattern":"body = requests\\.post\\("},"detail":"True now: KvawareRouter.route_request (async) falls back to a synchronous requests.post to the engine's /tokenize with timeout=10 when the local tokenizer cannot load, on the event loop thread. LoadAwareRouter.tokenize_prompt fixed the same call by running it in an executor. Trigger: routing-logic kvaware and AutoTokenizer.from_pretrained failing (no transformers, no HF access, gated model). Reach: every in-flight request and stream on that router replica stalls while each tokenize call runs.","evidence":"Read KvawareRouter.route_request and LoadAwareRouter.tokenize_prompt side by side.","id":"kvaware-blocking-tokenize","severity":"medium","symbols":["vllm_router.routers.routing_logic:KvawareRouter.route_request"],"title":"kvaware routing can block the whole event loop for up to 10 seconds"},{"_locs":[{"doc":"Route the request to the appropriate engine URL by where the KV cache of the longest prefix match is found. If there is no session id in the request header, it will pick a server with round robin.","file":"src/vllm_router/routers/routing_logic.py","line":370,"params":["self","endpoints","engine_stats","request_stats","request","request_json"],"symbol":"vllm_router.routers.routing_logic:KvawareRouter.route_request"},{"doc":"Local-first tokenization with the remote `/tokenize` fallback.","file":"src/vllm_router/routers/routing_logic.py","line":665,"params":["self","endpoints","request_json"],"symbol":"vllm_router.routers.routing_logic:LoadAwareRouter.tokenize_prompt"}],"category":"risk","check":{"kind":"text_in","pattern":"request_json\\.get\\(\"prompt\", \"\"\\)"},"detail":"True now: KvawareRouter.route_request and LoadAwareRouter.tokenize_prompt encode request_json.get('prompt', ''); a /v1/chat/completions body has `messages` instead (a code comment marks chat completions as still to do). Trigger: routing-logic kvaware or loadaware with chat traffic. Reach: the token list is empty, the lookup finds nothing, and every chat request falls back to session hash or lowest QPS — the KV-aware behaviour applies only to /v1/completions.","evidence":"Read both functions; compare PrefixAwareRouter.route_request, which does concatenate messages[].content.","id":"kvaware-ignores-chat-messages","severity":"medium","symbols":["vllm_router.routers.routing_logic:KvawareRouter.route_request","vllm_router.routers.routing_logic:LoadAwareRouter.tokenize_prompt"],"title":"KV-cache-aware routing tokenizes only `prompt`, so chat completions never use the cache lookup"},{"_locs":[{"doc":"Route the request to the appropriate engine URL by where the longest prefix match is found.","file":"src/vllm_router/routers/routing_logic.py","line":759,"params":[],"symbol":"vllm_router.routers.routing_logic:PrefixAwareRouter"},{"doc":"Insert the request and endpoint into the trie. Args: request (str): The request to insert. endpoint (str): The endpoint to insert.","file":"src/vllm_router/prefix/hashtrie.py","line":59,"params":["self","request","endpoint"],"symbol":"vllm_router.prefix.hashtrie:HashTrie.insert"}],"category":"risk","check":{"kind":"text_in","pattern":"assume that there is no eviction"},"detail":"Now: HashTrie.insert adds one TrieNode (with its own asyncio.Lock) per 128-character chunk of every distinct prompt, and nothing ever removes nodes or URLs of engines that are gone; the class says it assumes no eviction. Trigger: a long-running router with --routing-logic prefixaware and varied prompts. Reach: router memory grows with total distinct prompt text served; stale engine URLs stay in node sets but are filtered by the available-endpoints intersection, so routing stays correct.","evidence":"Read PrefixAwareRouter (docstring: 'we assume that there is no eviction of prefix cache') and HashTrie.insert / longest_prefix_match; grep found no delete or eviction method in vllm_router/prefix/hashtrie.py.","id":"prefix-trie-unbounded","severity":"low","symbols":["vllm_router.routers.routing_logic:PrefixAwareRouter","vllm_router.prefix.hashtrie:HashTrie.insert"],"title":"The prefix-aware HashTrie only grows"},{"_locs":[{"doc":"Route the request to appropriate endpoints for prefill and decode operations. First request goes to prefill endpoint, then second request goes to decode endpoint.","file":"src/vllm_router/routers/routing_logic.py","line":978,"params":["self","endpoints","engine_stats","request_stats","request","request_json"],"symbol":"vllm_router.routers.routing_logic:DisaggregatedPrefillRouter.route_request"},{"doc":"","file":"src/vllm_router/services/request_service/request.py","line":957,"params":["request","endpoint","background_tasks"],"symbol":"vllm_router.services.request_service.request:route_disaggregated_prefill_request"},{"doc":"Initialize aiohttp ClientSession objects for prefill and decode endpoints. This must be called from an async context during app startup.","file":"src/vllm_router/service_discovery.py","line":863,"params":["self"],"symbol":"vllm_router.service_discovery:K8sPodIPServiceDiscovery.initialize_client_sessions"}],"category":"risk","check":"no_callers","detail":"True now: route_disaggregated_prefill_request sends to app.state.prefill_client and app.state.decode_client; initialize_client_sessions overwrites each with a session bound to the last endpoint seen for that label. DisaggregatedPrefillRouter.route_request has no callers. Trigger: routing-logic disaggregated_prefill with more than one prefill or decode pod. Reach: the extra pods receive no traffic; when that one pod is replaced the client is only re-bound when the watcher sees the new pod.","evidence":"`codeflow.py query DisaggregatedPrefillRouter.route_request` → callers (0); read route_disaggregated_prefill_request and initialize_client_sessions.","id":"disagg-prefill-single-client","severity":"medium","symbols":["vllm_router.routers.routing_logic:DisaggregatedPrefillRouter.route_request","vllm_router.services.request_service.request:route_disaggregated_prefill_request","vllm_router.service_discovery:K8sPodIPServiceDiscovery.initialize_client_sessions"],"title":"disaggregated_prefill uses one prefill and one decode engine, whatever the routing logic would choose"},{"_locs":[{"doc":"Send a request to a prefiller service.","file":"src/vllm_router/services/request_service/request.py","line":713,"params":["client","endpoint","req_data","request_id"],"symbol":"vllm_router.services.request_service.request:send_request_to_prefiller"},{"doc":"Orchestrated disaggregated inference following NxDI's toy_proxy_server pattern.","file":"src/vllm_router/services/request_service/request.py","line":752,"params":["request","endpoint","background_tasks"],"symbol":"vllm_router.services.request_service.request:route_orchestrated_disaggregated_request"}],"category":"risk","check":{"kind":"text_in","pattern":"OPENAI_API_KEY"},"detail":"True now: the chart gives engines and router VLLM_API_KEY from release-secrets. The general proxy forwards the client's own Authorization header; discovery probes use VLLM_API_KEY; send_request_to_prefiller/send_request_to_decode send `Bearer` + env OPENAI_API_KEY (literally 'Bearer None' when unset); route_orchestrated_disaggregated_request sends no Authorization at all. Trigger: disaggregated_prefill or disaggregated_prefill_orchestrated with servingEngineSpec.vllmApiKey set. Reach: every prefill call gets 401 from the engine and the client gets a prefiller error.","evidence":"grep for API_KEY/Authorization in src/vllm_router; read the four functions and helm/templates/deployment-router.yaml / deployment-vllm-multi.yaml env blocks.","id":"engine-auth-inconsistent","severity":"medium","symbols":["vllm_router.services.request_service.request:send_request_to_prefiller","vllm_router.services.request_service.request:route_orchestrated_disaggregated_request"],"title":"Disaggregated paths do not send the engine API key the chart configures"},{"_locs":[{"doc":"","file":"src/vllm_router/utils.py","line":239,"params":["url","model","model_type","timeout"],"symbol":"vllm_router.utils:is_model_healthy"}],"category":"risk","detail":"True now: utils.is_model_healthy posts a test request with only Content-Type, while the K8s discovery probes add Authorization from VLLM_API_KEY. Trigger: --service-discovery static with --static-backend-health-checks against vLLM started with --api-key. Reach: every check gets 401, all backends are listed as unhealthy and dropped from get_endpoint_info, so every request answers 503 ('temporarily unavailable').","evidence":"Read utils.is_model_healthy and StaticServiceDiscovery.get est appends every chunk to full_response; the comment says this is for non-streaming requests, but full_response is never None, so streams are buffered too (used for the semantic cache and post_request callback). Trigger: many concurrent long streams. Reach: router memory per request grows to the full response size for the life of the stream.","evidence":"Read process_request: full_response = bytearray() then `if full_response is not None: full_response.extend(chunk)`.","id":"streaming-response-buffered","severity":"low","symbols":["vllm_router.services.request_service.request:process_request"],"title":"Streaming responses are also kept in full in router memory"},{"_locs":[{"doc":"Check request for PII and take appropriate action.","file":"src/vllm_router/experimental/pii/middleware.py","line":101,"params":["request","analyzer","config"],"symbol":"vllm_router.experimental.pii.middleware:check_pii"}],"category":"doc vs code","check":"no_callers","detail":"True now: experimental/README.md says 'detects and blocks PII in LLM requests' and to start with --feature-gates=PII=true --pii-analyzer=…; pii.middleware.check_pii has no callers, the parser has no --pii-analyzer option, and the gate name in feature_gates.py is PIIDetection. Trigger: an operator following the README. Reach: the router refuses the unknown --pii-analyzer flag, and with the gate alone no request is ever checked — prompts with PII go to engines unfiltered while the operator believes they are blocked.","evidence":"`codeflow.py query check_pii` → callers (0); grep -i pii in parsers/parser.py → no match; read experimental/README.md and feature_gates.py.","id":"pii-feature-not-wired","severity":"medium","symbols":["vllm_router.experimental.pii.middleware:check_pii"],"title":"The experimental README promises PII detection and blocking, but nothing calls it"},{"_locs":[{"doc":"Experimental semantic cache for the vLLM router.","file":"src/vllm_router/experimental/semantic_cache/__init__.py","line":1,"symbol":"vllm_router.experimental.semantic_cache"}],"category":"dead code","detail":"True now: src/vllm_router/experimental/ has both a semantic_cache/ package and a semantic_cache.py file; Python resolves `vllm_router.experimental.semantic_cache` to the package, so the .py file is never loaded, and it imports vllm_router.experimental.semantic_cache_db, which does not exist. Trigger: someone editing the .py file expecting a change. Reach: confusion only; no runtime effect.","evidence":"ls src/vllm_router/experimental; diffed the two files; grep semantic_cache_db → only the import line in semantic_cache.py.","id":"shadowed-semantic-cache-module","severity":"low","symbols":["vllm_router.experimental.semantic_cache"],"title":"experimental/semantic_cache.py is unreachable and would not import"},{"_locs":[{"doc":"","file":"src/vllm_router/parsers/parser.py","line":125,"params":[],"symbol":"vllm_router.parsers.parser:parse_args"}],"category":"doc vs code","detail":"True now: --routing-logic accepts roundrobin, session, kvaware, loadaware, prefixaware, disaggregated_prefill, disaggregated_prefill_orchestrated and priority; helm/values.schema.json (and the @schema comment in values.yaml) enumerate only six, without loadaware and priority. Trigger: routerSpec.routingLogic: loadaware or priority. Reach: helm install/upgrade fails schema validation; users must pass the flag through routerSpec.extraArgs.","evidence":"Read parse_args --routing-logic choices and helm/values.schema.json routerSpec.routingLogic.enum.","id":"chart-schema-routing-enum","severity":"low","symbols":["vllm_router.parsers.parser:parse_args"],"title":"The Helm chart rejects two routing logics the router supports"},{"_locs":[{"doc":"","file":"src/vllm_router/parsers/parser.py","line":125,"params":[],"symbol":"vllm_router.parsers.parser:parse_args"}],"category":"doc vs code","detail":"True now: src/vllm_router/README.md says --routing-logic options are 'roundrobin or session', --service-discovery 'static or k8s', prefix-aware routing is '(WIP)', and the dynamic config routing_logic is 'roundrobin or session'. The parser offers eight routing logics and external-only discovery. Trigger: a newcomer configuring from the README. Reach: features stay unknown; no runtime effect.","evidence":"Read README.md option list and parse_args choices for --routing-logic and --service-discovery.","id":"router-readme-stale-options","severity":"low","symbols":["vllm_router.parsers.parser:parse_args"],"title":"The router README lists fewer routing and discovery options than the code has"},{"_locs":[{"doc":"Start the kv manager","file":"src/vllm_router/routers/routing_logic.py","line":338,"params":["self"],"symbol":"vllm_router.routers.routing_logic:KvawareRouter.start_kv_manager"},{"doc":"Route the request to the appropriate engine URL by where the longest prefix match is found.","file":"src/vllm_router/routers/routing_logic.py","line":779,"params":["self","endpoints","engine_stats","request_stats","request","request_json"],"symbol":"vllm_router.routers.routing_logic:PrefixAwareRouter.route_request"}],"category":"risk","detail":"True now: the prefix trie, round-robin counters, request stats and the LMCache controller all live inside one router process. The chart can run several (routerSpec.replicaCount, or hpa-router.yaml when routerSpec.autoscaling.enabled, maxReplicas default 3), while engines reach the LMCache controller through LMCACHE_CONTROLLER_PULL_URL = release-router-service:<port>, which the Service load-balances to one replica. Trigger: more than one router replica with kvaware/loadaware/prefixaware. Reach: replicas that did not receive a worker's registration have no cache layout and fall back to session/QPS routing; prefix affinity and load counts are per replica only.","evidence":"Read KvawareRouter.__init__/start_kv_manager (controller bound to 0.0.0.0 in-process), helm/templates/service-router.yaml (port 9000), deployment-vllm-multi.yaml (LMCACHE_CONTROLLER_PULL_URL), hpa-router.yaml and values.yaml routerSpec.autoscaling.","id":"multi-replica-router-state","severity":"medium","symbols":["vllm_router.routers.routing_logic:KvawareRouter.start_kv_manager","vllm_router.routers.routing_logic:PrefixAwareRouter.route_request"],"title":"Running more than one router replica splits routing state, and kvaware loses cache information"},{"_locs":[{"doc":"Scrape metrics from all serving engines.","file":"src/vllm_router/stats/engine_stats.py","line":135,"params":["self"],"symbol":"vllm_router.stats.engine_stats:EngineStatsScraper._scrape_metrics"}],"category":"risk","detail":"True now: route_general_request passes engine_stats to every router, but no class in routing_logic.py reads it (LoadAwareRouter documents it as unused because it is scrape-lagged). The scraper fetches engines one after another with timeout = --engine-stats-interval. Trigger: reading the code or docs as if routing were driven by engine queue length. Reach: understanding only; with many slow engines a scrape round can take several intervals, which only delays the exported gauges.","evidence":"grep 'engine_stats[' / get_engine_stats() in src/vllm_router: only metrics_router, log_stats and request.py read it; read every route_request in routing_logic.py.","id":"engine-stats-unused-by-routing","severity":"info","symbols":["vllm_router.stats.engine_stats:EngineStatsScraper._scrape_metrics"],"title":"Scraped engine metrics are not used by any routing logic"},{"_locs":[{"doc":"Initialize all the components of the router with the given arguments.","file":"src/vllm_router/app.py","line":161,"params":["app","args"],"symbol":"vllm_router.app:initialize_all"}],"category":"risk","check":{"kind":"calls","target":"vllm_router.services.request_service.rewriter:get_request_rewriter"},"detail":"True now: initialize_all calls get_request_rewriter(), which creates a NoopRequestRewriter, so is_request_rewriter_initialized() is always True; route_general_request then 'rewrites' each body, logs 'Request for e as JSON and be an object (else 400); 'model' must be present (else 400); the model must be served by an awake engine (404 / 503). X-Request-Id is accepted from the client unchanged and becomes the stats key. No body-size limit and no check of the other fields — the engine validates the rest.","symbol":"vllm_router.services.request_service.request:route_general_request"},{"_loc":{"doc":"Route the request to the appropriate engine URL by where the longest prefix match is found.","file":"src/vllm_router/routers/routing_logic.py","line":779,"params":["self","endpoints","engine_stats","request_stats","request","request_json"],"symbol":"vllm_router.routers.routing_logic:PrefixAwareRouter.route_request"},"guard":"Reads 'messages' (text parts only) or else request_json['prompt'] directly; a body with neither (e.g. embeddings 'input') raises KeyError and the client gets a 500. The prompt text is inserted into the in-memory HashTrie.","symbol":"vllm_router.routers.routing_logic:PrefixAwareRouter.route_request"},{"_loc":{"doc":"Process a request by sending it to the chosen backend.","file":"src/vllm_router/services/request_service/request.py","line":231,"params":["request","body","backend_url","request_id","endpoint","background_tasks","debug_request","parent_span_context"],"symbol":"vllm_router.services.request_service.request:process_request"},"guard":"Parses the body again for 'stream' and 'model' (400 if not JSON). Hop-by-hop headers are dropped and X-Request-Id is replaced; Authorization and all other client headers pass through to the engine, which applies its own VLLM_API_KEY check. The body is sent unchanged.","symbol":"vllm_router.services.request_service.request:process_request"}]}],"gateways":{},"journeys":[{"actor":"API client · OpenAI SDK or curl","id":"chat-completion","steps":[{"action":"FastAPI handler. If the semantic-cache module imported, it first asks check_semantic_cache for a stored answer (a no-op unless the SemanticCache feature gate is on); otherwise it hands the request to route_general_request with the endpoint path. /v1/completions, /v1/embeddings, /tokenize, /v1/rerank, /v1/score and the other OpenAI routes use the same function without the cache check.","actor":"client → Ingress release-ingress-router → K8s Service release-router-service → Deployment release-deployment-router","doc":"","file":"src/vllm_router/routers/main_router.py","guards":[],"line":52,"params":["request","background_tasks"],"payload":"POST /v1/chat/completions\nAuthorization: Bearer sk-demo-0000\n{\"model\": \"meta-llama/Llama-3.1-8B-Instruct\", \"stream\": true,\n \"messages\": [{\"role\": \"user\", \"content\": \"Summarise order 1042 in one line\"}]}\n\n\n\n\n","receives":"The raw HTTP request and FastAPI BackgroundTasks","returns":"Whatever route_general_request returns: a StreamingResponse, or a JSON error","stores":"nothing","symbol":"vllm_router.routers.main_router:route_chat_completion","urls":[["POST","/v1/chat/completions"]]},{"action":"Validates and resolves the target model. It takes the request id from X-Request-Id (or makes a UUID), parses the body and rejects anything that is not a JSON object or has no 'model'. It lets an optional callback short-circuit the request, applies the request rewriter and a static alias, and sends models that belong to an external provider to process_external_provider_request. Otherwise it filters the service-discovery list down to awake engines that list the model.","doc":"Route the incoming request to the backend server and stream the response back to the client.","file":"src/vllm_router/services/request_service/request.py","line":396,"note":"The '?id=<engine Id>' query parameter pins the request to one engine and skips both the routing logic and the stats snapshot.","params":["request","endpoint","background_tasks"],"receives":"request, endpoint '/v1/chat/completions', background_tasks","returns":"400 (not JSON / no model), 404 (model never seen), 503 (model seen before but no engine now), or continues with the filtered endpoint list","stores":"nothing yet; counts the request in the num_incoming_requests_total Prometheus counter","symbol":"vllm_router.services.request_service.request:route_general_request"},{"action":"Returns a copy of the engines the background pod watcher currently knows (under a thread lock). The Helm chart starts the router with --service-discovery k8s and --k8s-service-discovery-type pod-ip, so this is the pod-IP implementation by default; the static and service-name variants return the same EndpointInfo shape.","doc":"Get the URLs of the serving engines that are available for querying.","file":"src/vllm_router/service_discovery.py","line":835,"params":["self"],"payload":"[EndpointInfo(url=\"http://10.4.2.17:8000\", model_names=[\"meta-llama/Llama-3.1-8B-Instruct\"], sleep=False, pod_name=\"vllm-llama-7c9f-abcde\"),\n EndpointInfo(url=\"http://10.4.3.22:8000\", model_names=[\"meta-llama/Llama-3.1-8B-Instruct\"], sleep=False, pod_name=\"vllm-llama-7c9f-fghij\")]\n\n\n\n\n","receives":"nothing","returns":"List[EndpointInfo]: url, model_names, Id, model_label, sleep, pod_name","stores":"nothing","symbol":"vllm_router.service_discovery:K8sPodIPServiceDiscovery.get_endpoint_info"},{"action":"Takes a snapshot of the router's own per-engine numbers (QPS over the sliding window, requests in prefill / decoding, TTFT). route_general_request also fetches the scraped engine stats here, but no routing class reads them (see the 'Stats feed the routing choice' journey).","doc":"Get the request statistics for each serving engine","file":"src/vllm_router/stats/request_stats.py","line":251,"params":["self","current_time"],"receives":"the current time","returns":"Dict[url, RequestStats]","stores":"nothing (old samples fall out of the sliding window)","symbol":"vllm_router.stats.request_stats:RequestStatsMonitor.get_request_stats"},{"action":"The routing decision. app.state.router is whichever class --routing-logic chose at start-up; route_general_request awaits route_request for the session, kvaware/loadaware, prefixaware and priority routers (they also get the parsed body) and calls it synchronously for the others. Round-robin, shown here, sorts the engine URLs, keeps one counter per distinct engine set and returns the next URL in turn.","doc":"Route the request to the appropriate engine URL using a simple round-robin algorithm","file":"src/vllm_router/routers/routing_logic.py","line":200,"note":"SessionRouter hashes the session key onto a HashRing; PrefixAwareRouter looks up the longest prompt prefix in a HashTrie; LoadAwareRouter asks the LMCache controller which engine holds the prompt's KV cache and subtracts a load penalty.","params":["self","endpoints","engine_stats","request_stats","request"],"payload":"\"http://10.4.3.22:8000\"\n\n\n\n\n","receives":"the filtered endpoints, engine_stats, request_stats, request","returns":"One engine base URL","stores":"the next index for this endpoint set (in memory, capped at 1024 sets)","symbol":"vllm_router.routers.routing_logic:RoundRobinRouter.route_request"},{"action":"Sends the request to the chosen engine and streams the answer. It registers the request with RequestStatsMonitor, copies the client headers minus hop-by-hop ones (Authorization is kept, so the engine checks its own VLLM_API_KEY), sets X-Request-Id, and POSTs the body to <engine url>/v1/chat/completions through the shared aiohttp session — straight to the engine pod's IP with the default pod-ip discovery, or through K8s Service release-<name>-engine-service with service-name discovery. It yields the engine's headers and status first, then every chunk as it arrives.","doc":"Process a request by sending it to the chosen backend.","file":"src/vllm_router/services/request_service/request.py","line":231,"note":"The engine side is the third-party vllm/vllm-openai image; its code is not in this repository.","params":["request","body","backend_url","request_id","endpoint","background_tasks","debug_request","parent_span_context"],"payload":"data: {\"id\":\"chatcmpl-7f3a\",\"choices\":[{\"delta\":{\"content\":\"Order 1042\"},\"index\":0}]}\ndata: [DONE]\n\n\n\n\n","receives":"request, body bytes, backend_url, request_id, endpoint","returns":"An async generator: (headers, status) first, then raw response chunks (SSE 'data: …' lines when stream=true)","stores":"request stats (start, first token, completion); Prometheus latency, error and token counters; for non-streaming chat completions, the answer in the semantic cache when that is enabled; queues the post_request callback","symbol":"vllm_router.services.request_service.request:process_request"},{"action":"route_general_request has already pulled the first item (headers and status) out of process_request. If that raised a connection-level exception it marks the URL as failed and asks the routing logic again on the remaining engines, up to max_instance_failover_reroute_attempts times. On success it strips content-length/encoding headers, adds X-Request-Id and returns a StreamingResponse whose body is this wrapper, which forwards the remaining chunks and closes the OpenTelemetry span at the end.","doc":"","file":"src/vllm_router/services/request_service/request.py","line":696,"params":[],"receives":"the open process_request generator","returns":"StreamingResponse with the engine's status code and media type","stores":"nothing","symbol":"vllm_router.services.request_service.request:route_general_request.traced_stream"}],"summary":"The router reads the request body to find the model, keeps only the engines that serve that model, and asks the configured routing logic to pick one. It then sends the body unchanged to that engine over HTTP and streams the engine's bytes back to the client while it updates its own per-engine request statistics.","title":"Route a chat completion to a vLLM engine","trigger":"POST /v1/chat/completions"},{"actor":"Kubernetes · container start","id":"router-startup","steps":[{"action":"Parses arguments, sets log level and format, calls initialize_all, optionally starts the log_stats thread, raises the open-file limit (set_ulimit) and runs uvicorn on --host/--port with --root-path.","actor":"container entrypoint","doc":"","file":"src/vllm_router/app.py","line":383,"params":[],"payload":"vllm-router --host 0.0.0.0 --port 8000 --service-discovery k8s --k8s-service-discovery-type pod-ip\n            --k8s-port 8000 --k8s-label-selector environment=test,release=test --routing-logic roundrobin\n            --engine-stats-interval 15 --request-stats-window 60\n\n\n\n\n","receives":"command-line arguments from the Helm template (--service-discovery, --k8s-label-selector, --routing-logic, --engine-stats-interval …)","returns":"never returns while serving","stores":"nothing","symbol":"vllm_router.app:main"},{"action":"Defines every flag, optionally re-parses with defaults loaded from --dynamic-config-yaml/--dynamic-config-json, then validate_args checks the combinations: routing logic required, static needs backends and models, k8s needs a port, session needs a session key, intervals must be positive.","doc":"","file":"src/vllm_router/parsers/parser.py","line":125,"params":[],"receives":"sys.argv","returns":"argparse.Namespace","stores":"nothing; exits or raises ValueError on a bad combination","symbol":"vllm_router.parsers.parser:parse_args"},{"action":"Builds the components in dependency order: optional Sentry and OpenTelemetry, then service discovery, the engine-stats scraper, the request-stats monitor, the batch API when --enable-batch-api is set, the dynamic-config watcher, custom callbacks, the routing logic, feature gates and semantic cache, and the external-provider registry. Finally it copies the singletons onto app.state so request handlers read them from there.","doc":"Initialize all the components of the router with the given arguments.","file":"src/vllm_router/app.py","line":161,"params":["app","args"],"receives":"app, args","returns":"nothing","stores":"app.state.engine_stats_scraper, request_stats_monitor, router, request_rewriter, external_provider_registry","symbol":"vllm_router.app:initialize_all"},{"action":"Refuses a second initialisation and creates the module-level discovery object through _create_service_discovery: StaticServiceDiscovery, K8sPodIPServiceDiscovery (default for 'k8s'), K8sServiceNameServiceDiscovery, or ExternalOnlyServiceDiscovery.","doc":"Initialize the service discovery module with the given type and arguments.","file":"src/vllm_router/service_discovery.py","line":1363,"params":["service_discovery_type","*args","**kwargs"],"receives":"ServiceDiscoveryType plus namespace, port, label_selector, timeouts","returns":"the ServiceDiscovery instance","stores":"the _global_service_discovery module variable","symbol":"vllm_router.service_discovery:initialize_service_discovery"},{"action":"Loads in-cluster Kubernetes credentials (falls back to kubeconfig), creates a CoreV1Api client and starts the daemon thread that runs _watch_engines. From this moment engines can appear in available_engines.","doc":"Initialize the Kubernetes service discovery module. This module assumes all serving engine pods are in the same namespace, listening on the same port, and have the same label selector.","file":"src/vllm_router/service_discovery.py","line":412,"params":["self","app","namespace","port","label_selector","prefill_model_labels","decode_model_labels","watcher_timeout_seconds","health_check_timeout_seconds"],"receives":"namespace, port, label_selector","returns":"nothing","stores":"available_engines (empty at first), known_models","symbol":"vllm_router.service_discovery:K8sPodIPServiceDiscovery.__init__"},{"action":"Creates the EngineStatsScraper singleton, which starts a daemon thread that scrapes every engine's /metrics every --engine-stats-interval seconds.","doc":"","file":"src/vllm_router/stats/engine_stats.py","line":212,"params":["scrape_interval"],"receives":"scrape_interval","returns":"EngineStatsScraper","stores":"the singleton instance","symbol":"vllm_router.stats.engine_stats:initialize_engine_stats_scraper"},{"action":"Creates the RequestStatsMonitor singleton with the --request-stats-window sliding window. It has no thread; process_request feeds it events.","doc":"","file":"src/vllm_router/stats/request_stats.py","line":322,"params":["sliding_window_size"],"receives":"sliding_window_size","returns":"RequestStatsMonitor","stores":"the singleton instance","symbol":"vllm_router.stats.request_stats:initialize_request_stats_monitor"},{"action":"Only when a dynamic config file is given: starts a thread that re-reads the YAML/JSON file every 10 seconds and, when it differs from the current config, rebuilds service discovery, routing logic and callbacks.","doc":"Initializes the DynamicConfigWatcher with the given config path, file type and watch interval.","file":"src/vllm_router/dynamic_config.py","line":311,"params":["config_path","config_file_type","watch_interval","init_config","app"],"receives":"config path, file type, interval 10, the config built from args, app","returns":"DynamicConfigWatcher","stores":"the watcher singleton; later replaces app.state.router","symbol":"vllm_router.dynamic_config:initialize_dynamic_config_watcher"},{"action":"Instantiates the routing class named by --routing-logic (round-robin, session, kvaware, loadaware, prefixaware, disaggregated prefill, orchestrated disaggregated prefill or priority) as a singleton. KV-aware and load-aware also start the LMCache controller manager. It sets max_instance_failover_reroute_attempts on the router.","doc":"","file":"src/vllm_router/routers/routing_logic.py","line":1119,"params":["routing_logic","*args","**kwargs"],"receives":"RoutingLogic plus session_key, lmcache ports, prefix_min_match_length, priority settings, failover attempts","returns":"the RoutingInterface instance","stores":"the router in SingletonABCMeta._instances; initialize_all then reads it back with get_routing_logic into app.state.router","symbol":"vllm_router.routers.routing_logic:initialize_routing_logic"},{"action":"Runs when uvicorn starts the app: opens the shared aiohttp session (no connection limit), initialises the batch processor if present, hands the running event loop to service discovery so its thread can schedule coroutines, opens prefill/decode client sessions for disaggregated setups, and validates external-provider models. On shutdown it stops the threads and closes the routers in reverse.","doc":"","file":"src/vllm_router/app.py","line":107,"params":["app"],"receives":"app","returns":"control to uvicorn, which starts accepting requests","stores":"app.state.event_loop; the aiohttp ClientSession","symbol":"vllm_router.app:lifespan"}],"summary":"main parses the command line, then initialize_all builds every long-lived singleton in order: service discovery (which starts its watcher thread), the engine-stats scraper thread, the request-stats monitor, the optional dynamic-config watcher, callbacks and the routing logic. The objects are attached to app.state, and FastAPI's lifespan opens the shared HTTP client before uvicorn starts serving.","title":"Router start-up","trigger":"vllm-router console script (Deployment release-deployment-router runs vllm_router.app:main)"},{"actor":"Kubernetes API · pod watch event","id":"engine-discovered","steps":[{"action":"Streams list_namespaced_pod watch events for the namespace and label selector. For each event it works out readiness (all containers ready and no deletion timestamp); for a ready pod it fetches the model names and the 'model' label. DELETED events remove the engine directly. Any exception is logged and the watch restarts after 0.5 s.","actor":"watcher thread (started in __init__)","doc":"","file":"src/vllm_router/service_discovery.py","line":671,"params":["self"],"payload":"{\"type\": \"MODIFIED\", \"object\": {\"metadata\": {\"name\": \"vllm-llama-7c9f-abcde\", \"labels\": {\"model\": \"llama3\"}},\n \"status\": {\"podIP\": \"10.4.2.17\", \"containerStatuses\": [{\"name\": \"vllm\", \"ready\": true}]}}}\n\n\n\n\n","receives":"watch events: type ADDED / MODIFIED / DELETED and the V1Pod","returns":"nothing (loops while running)","stores":"nothing itself","symbol":"vllm_router.service_discovery:K8sPodIPServiceDiscovery._watch_engines"},{"action":"True only when every container status reports ready.","doc":"Check if all containers in the pod are ready by reading the k8s container statuses.","file":"src/vllm_router/service_discovery.py","line":486,"params":["container_statuses"],"receives":"pod.status.container_statuses","returns":"bool","stores":"nothing","symbol":"vllm_router.service_discovery:K8sPodIPServiceDiscovery._check_pod_ready"},{"action":"Synchronous HTTP GET http://<podIP>:<k8s-port>/v1/models with the VLLM_API_KEY from the environment (the chart injects it from Secret release-secrets) and a health-check timeout. Collects every model id, including LoRA adapters.","doc":"Get the model names of the serving engine pod by querying the pod's '/v1/models' endpoint.","file":"src/vllm_router/service_discovery.py","line":590,"params":["self","pod_ip"],"payload":"{\"data\": [{\"id\": \"meta-llama/Llama-3.1-8B-Instruct\", \"object\": \"model\"},\n          {\"id\": \"sql-lora\", \"parent\": \"meta-llama/Llama-3.1-8B-Instruct\"}]}\n\n\n\n\n","receives":"pod IP","returns":"list of model ids, or [] on any error","stores":"nothing","symbol":"vllm_router.service_discovery:K8sPodIPServiceDiscovery._get_model_names"},{"action":"Decides what the event means. ADDED or MODIFIED with an IP, ready and at least one model → add (or re-add) the engine. MODIFIED that is not ready, has no models, or lost its IP (an evicted pod) → delete it if known.","doc":"","file":"src/vllm_router/service_discovery.py","line":780,"params":["self","engine_name","engine_ip","event","is_pod_ready","model_names","model_label"],"receives":"pod name, IP, event type, readiness, model names, model label","returns":"nothing","stores":"via _add_engine / _delete_engine","symbol":"vllm_router.service_discovery:K8sPodIPServiceDiscovery._on_engine_update"},{"action":"Fetches the detailed model info (a second /v1/models call), checks through the Kubernetes API whether the vllm container runs with --enable-sleep-mode and if so asks /is_sleeping. It then writes the EndpointInfo under the lock, re-opens prefill/decode client sessions on the event loop when labels require it, and adds the models to known_models.","doc":"","file":"src/vllm_router/service_discovery.py","line":724,"note":"known_models is never shrunk, which is how route_general_request answers 503 'temporarily unavailable' rather than 404 for a model that is scaled to zero.","params":["self","engine_name","engine_ip","model_names","model_label"],"receives":"pod name, IP, model names, model label","returns":"nothing","stores":"available_engines[pod_name] = EndpointInfo(url='http://<podIP>:<port>', Id=uuid5(pod name), …); known_models","symbol":"vllm_router.service_discovery:K8sPodIPServiceDiscovery._add_engine"},{"action":"Readers on the request path and the scraper thread take a copy of available_engines under the same lock, so the new engine is routable on the next request.","actor":"route_general_request, EngineStatsScraper._scrape_metrics, /v1/models, /metrics","doc":"Get the URLs of the serving engines that are available for querying.","file":"src/vllm_router/service_discovery.py","line":835,"params":["self"],"receives":"nothing","returns":"List[EndpointInfo]","stores":"nothing","symbol":"vllm_router.service_discovery:K8sPodIPServiceDiscovery.get_endpoint_info"}],"summary":"A daemon thread keeps a Kubernetes watch open on pods with the engine labels. When a pod is Ready and not terminating it asks the pod's /v1/models which models it serves, records an EndpointInfo keyed by pod name, and from then on route_general_request sees that engine in get_endpoint_info.","title":"Service discovery notices a new engine pod","trigger":"A vLLM engine pod matching --k8s-label-selector becomes Ready (Deployment release-<name>-deployment-vllm scales up)"},{"actor":"router · every proxied request","id":"stats-feed-routing","steps":[{"action":"Calls on_new_request before sending, on_request_response when the first chunk arrives, and on_request_complete in a finally block so a backend error or client disconnect also frees the in-flight slot.","actor":"route_general_request","doc":"Process a request by sending it to the chosen backend.","file":"src/vllm_router/services/request_service/request.py","line":231,"params":["request","body","backend_url","request_id","endpoint","background_tasks","debug_request","parent_span_context"],"receives":"backend_url and request_id (the client's X-Request-Id or a fresh UUID)","returns":"the streamed response (see the main journey)","stores":"events in RequestStatsMonitor","symbol":"vllm_router.services.request_service.request:process_request"},{"action":"Records the start time under (engine url, request id), increments in_prefill_requests for that engine and adds a sample to its QPS window.","doc":"Tell the monitor that a new request has been created.","file":"src/vllm_router/stats/request_stats.py","line":144,"params":["self","engine_url","request_id","timestamp"],"payload":"request_start_time[(\"http://10.4.2.17:8000\", \"req-5b1e\")] = 1759500000.12\nin_prefill_requests[\"http://10.4.2.17:8000\"] = 3\n\n\n\n\n","receives":"engine_url, request_id, timestamp","returns":"nothing","stores":"request_start_time, in_prefill_requests, qps_monitors (in memory)","symbol":"vllm_router.stats.request_stats:RequestStatsMonitor.on_new_request"},{"action":"On the first chunk: moves the request from prefill to decoding and records time-to-first-token in the TTFT window.","doc":"Tell the monitor that a response token has been received for a request.","file":"src/vllm_router/stats/request_stats.py","line":173,"params":["self","engine_url","request_id","timestamp"],"receives":"engine_url, request_id, timestamp","returns":"nothing","stores":"first_token_time, in_prefill/in_decoding counters, ttft_monitors","symbol":"vllm_router.stats.request_stats:RequestStatsMonitor.on_request_response"},{"action":"Decrements the decoding counter (or the prefill counter if no token ever arrived), counts the request as finished and records its total latency. A second call for the same key returns early, so it is safe from the finally block.","doc":"Tell the monitor that a request has been completed.","file":"src/vllm_router/stats/request_stats.py","line":202,"params":["self","engine_url","request_id","timestamp"],"receives":"engine_url, request_id, timestamp","returns":"nothing","stores":"finished_requests, latency_monitors; removes the start and first-token entries","symbol":"vllm_router.stats.request_stats:RequestStatsMonitor.on_request_complete"},{"action":"Builds one RequestStats per engine URL it has seen: QPS = arrivals in the window / window length, average TTFT and latency, and the live in_prefill / in_decoding counts.","actor":"route_general_request (next request)","doc":"Get the request statistics for each serving engine","file":"src/vllm_router/stats/request_stats.py","line":251,"params":["self","current_time"],"payload":"{\"http://10.4.2.17:8000\": {\"qps\": 0.85, \"ttft\": 0.21, \"in_prefill_requests\": 1, \"in_decoding_requests\": 4},\n \"http://10.4.3.22:8000\": {\"qps\": 0.40, \"ttft\": 0.18, \"in_prefill_requests\": 0, \"in_decoding_requests\": 1}}\n\n\n\n\n","receives":"current time","returns":"Dict[url, RequestStats]","stores":"drops samples older than the window","symbol":"vllm_router.stats.request_stats:RequestStatsMonitor.get_request_stats"},{"action":"One of the routers that reads these numbers. It tokenizes the prompt, asks the LMCache controller which engine instances hold matching KV-cache chunks, and if nothing is cached anywhere falls back to session hashing or lowest QPS. Otherwise it scores the engines with select_url. Its docstring says engine_stats is unused because it is scrape-lagged.","doc":"Route the request to the engine with the best `cache_hit_benefit - beta * relative_load`.","file":"src/vllm_router/routers/routing_logic.py","line":708,"params":["self","endpoints","engine_stats","request_stats","request","request_json"],"receives":"endpoints, engine_stats (ignored), request_stats, request, request_json","returns":"one engine URL","stores":"the instance-id → URL map refreshed from the controller","symbol":"vllm_router.routers.routing_logic:LoadAwareRouter.route_request"},{"action":"For each engine: cache benefit (matched tokens / prompt tokens) minus beta × relative load, where relative load is (in-flight − fleet mean) / max(1, mean) from relative_loads. Ties break by URL. beta comes from --loadaware-beta or the LOADAWARE_BETA env var (default 1.0).","doc":"The placement decision. Pure: no I/O, no awaits.","file":"src/vllm_router/routers/routing_logic.py","line":589,"params":["self","endpoints","request_stats","layout_info","prompt_tokens"],"payload":"10.4.2.17: benefit 0.90 − 1.0 × (+0.67) = 0.23\n10.4.3.22: benefit 0.00 − 1.0 × (−0.67) = 0.67   ← chosen\n\n\n\n\n","receives":"endpoints, request_stats, layout_info from the controller, prompt token count","returns":"the best-scoring URL","stores":"nothing","symbol":"vllm_router.routers.routing_logic:LoadAwareRouter.select_url"},{"action":"The shared fallback used by session (no session id), prefix-aware (match below the minimum) and load-aware (no cache info): returns the first engine that has no stats yet, else the one with the lowest QPS.","doc":"Route the request to the appropriate engine URL based on the QPS of each engine","file":"src/vllm_router/routers/routing_logic.py","line":94,"params":["self","endpoints","request_stats"],"receives":"endpoints, request_stats","returns":"engine URL","stores":"nothing","symbol":"vllm_router.routers.routing_logic:RoutingInterface._qps_routing"}],"summary":"The router learns load from its own traffic, not from the engines: process_request reports start, first chunk and completion to RequestStatsMonitor, and the next request's snapshot of those counters is what the QPS, load-aware and priority routers compare. The scraped engine /metrics are passed along but deliberately not used for placement.","title":"Request statistics feed the routing choice","trigger":"Each request that process_request sends to an engine"},{"actor":"router · scraper thread","id":"engine-stats-scrape","steps":[{"action":"Loops: scrape all engines, then sleep the interval in one-second steps so close() can stop it quickly.","actor":"daemon thread started in EngineStatsScraper.__init__","doc":"Periodically scrape metrics from all serving engines in the background.","file":"src/vllm_router/stats/engine_stats.py","line":171,"params":["self"],"receives":"nothing","returns":"nothing","stores":"nothing itself","symbol":"vllm_router.stats.engine_stats:EngineStatsScraper._scrape_worker"},{"action":"Gets the current engine list from service discovery and scrapes each one in turn. It then replaces the stored map under the lock, dropping engines that disappeared or failed to answer.","doc":"Scrape metrics from all serving engines.","file":"src/vllm_router/stats/engine_stats.py","line":135,"params":["self"],"receives":"get_service_discovery().get_endpoint_info()","returns":"nothing","stores":"self.engine_stats: Dict[url, EngineStats]","symbol":"vllm_router.stats.engine_stats:EngineStatsScraper._scrape_metrics"},{"action":"Synchronous GET <engine url>/metrics with timeout = the scrape interval, then parses the text.","doc":"Scrape metrics from a single serving engine.","file":"src/vllm_router/stats/engine_stats.py","line":119,"params":["self","url"],"receives":"engine base URL","returns":"EngineStats, or None on any error (logged)","stores":"nothing","symbol":"vllm_router.stats.engine_stats:EngineStatsScraper._scrape_one_endpoint"},{"action":"Walks the Prometheus text exposition and keeps vllm:num_requests_runni         h("button", { type: "button", class: "stage s-" + ev.stage, onclick: () => openInGraph(ev.symbol), title: ev.symbol }, h("span", {}, h("b", {}, L.stages[ev.stage] || ev.stage), " · ", txt(ev.text)), h("small", {}, (ev.by ? ev.by + " · " : "") + ev.symbol))])),
      e.auto ? h("p", { class: "note" }, L.from_sql(e.auto)) : null))));
  const input = document.getElementById("tbl-search");
  const draw = () => {
    const q = input.value.trim().toLowerCase();
    const names = Object.keys(D.tables).filter((t) => !q || t.toLowerCase().includes(q));
    fill(document.getElementById("table-matrix"),
      h("thead", {}, h("tr", {}, L.tbl_cols.map((c) => h("th", {}, c)))),
      h("tbody", {}, names.map((t) => {
        const o = D.tables[t], mods = {};
        for (const op of ["insert", "update", "delete", "read", "uses"]) for (const k of o[op] || []) { const m = k.split(":")[0]; mods[m] = (mods[m] || 0) + 1; }
        const top = Object.entries(mods).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([m, c]) => `${shortMod(m)} ${c}`).join(", ");
        const n = (op) => h("td", { class: "num" }, (o[op] || []).length || "·");
        return h("tr", { class: "pick", "data-t": t, onclick: () => showTable(t) }, h("td", { class: "mono" }, t), n("insert"), n("update"), n("delete"), n("read"), n("uses"), h("td", { class: "note" }, top || L.not_found));
      })));
  };
  input.addEventListener("input", draw);
  draw();
})();

// ---------------------------------------------------------------- decisions
(function decisions() {
  if (!D.decisions.length) { document.getElementById("decisions").hidden = true; return; }
  const whos = [...new Set(D.decisions.map((d) => d.by))];
  const state = { who: null };
  const draw = () => {
    fill(document.getElementById("dec-filter"), h("button", { type: "button", class: "chip" + (state.who ? "" : " on"), onclick: () => { state.who = null; draw(); } }, `${L.all} ${D.decisions.length}`),
      whos.map((w) => h("button", { type: "button", class: "chip" + (state.who === w ? " on" : ""), onclick: () => { state.who = w; draw(); } }, `${w} ${D.decisions.filter((d) => d.by === w).length}`)));
    const rows = D.decisions.filter((d) => !state.who || d.by === state.who);
    fill(document.getElementById("decision-table"), h("thead", {}, h("tr", {}, L.dec_cols.map((c) => h("th", {}, c)))),
      h("tbody", {}, rows.map((d) => h("tr", {}, h("td", {}, txt(d.decision)), h("td", {}, h("span", { class: "badge " + (/code|코드/.test(d.by) ? "accent" : "amber") }, d.by)), h("td", {}, txt(d.how) || ""),
        h("td", {}, d.symbol ? [symLink(d.symbol, shortMod(d.symbol)), h("br"), d._loc ? locLink(d._loc.file, d._loc.line) : null] : "")))));
  };
  draw();
})();

// ---------------------------------------------------------------- findings
(function findings() {
  const SEV = ["high", "medium", "low", "info"];
  const open = D.findings.filter((f) => f.status !== "fixed"), fixed = D.findings.filter((f) => f.status === "fixed");
  const cats = [...new Set(open.map((f) => f.category))];
  const state = { sev: new Set(SEV), cat: null };
  const draw = () => {
    fill(document.getElementById("find-filter"),
      SEV.map((sv) => h("button", { type: "button", class: "chip" + (state.sev.has(sv) ? " on" : ""), onclick: () => { state.sev.has(sv) ? state.sev.delete(sv) : state.sev.add(sv); draw(); } }, `${L.sev[sv]} ${open.filter((f) => f.severity === sv).length}`)),
      h("span", { class: "note" }, "·"),
      h("button", { type: "button", class: "chip" + (state.cat ? "" : " on"), onclick: () => { state.cat = null; draw(); } }, L.all_kinds),
      cats.map((c) => h("button", { type: "button", class: "chip" + (state.cat === c ? " on" : ""), onclick: () => { state.cat = c; draw(); } }, c)));
    const rows = open.filter((f) => state.sev.has(f.severity) && (!state.cat || f.category === state.cat)).sort((a, b) => SEV.indexOf(a.severity) - SEV.indexOf(b.severity));
    fill(document.getElementById("finding-list"), rows.length ? rows.map((f) => h("article", { class: "finding sev-" + f.severity, id: "finding-" + f.id },
      h("div", { class: "top" }, h("span", { class: "badge " + ({ high: "bad", medium: "amber", low: "accent" }[f.severity] || "") }, L.sev[f.severity] || f.severity), h("span", { class: "badge" }, f.category), f.generated ? h("span", { class: "badge" }, L.generated) : null, h("h3", {}, f.title)),
      h("p", {}, txt(f.detail)),
      (f._locs || []).length ? h("div", { class: "chips" }, f._locs.map((l) => h("span", {}, symLink(l.symbol, shortMod(l.symbol)), " ", locLink(l.file, l.line)))) : null,
      f.evidence ? h("p", { class: "note" }, L.verified + f.evidence) : null)) : h("p", { class: "note" }, L.none_match),
      fixed.length ? h("details", { class: "fixed-list" }, h("summary", {}, L.fixed_title(fixed.length)),
        h("ul", {}, fixed.map((f) => h("li", { id: "finding-" + f.id }, h("strong", {}, f.title), " — ", h("span", { class: "note" }, f.fixed_reason))))) : null);
  };
  draw();
})();

// ---------------------------------------------------------------- module index
(function modules() {
  const input = document.getElementById("mod-search");
  const draw = () => {
    const q = input.value.trim().toLowerCase();
    const mods = Object.keys(D.modules).filter((m) => !q || m.toLowerCase().includes(q) || (noteText(m) + " " + (D.modules[m].doc || "")).toLowerCase().includes(q) || D.modules[m].funcs.some((f) => f.toLowerCase().includes(q)));
    fill(document.getElementById("mod-count"), L.mod_count(mods.length, Object.keys(D.modules).length));
    fill(document.getElementById("mod-table"), h("thead", {}, h("tr", {}, L.mod_cols.map((c) => h("th", {}, c)))),
      h("tbody", {}, mods.map((m) => { const i = D.modules[m], Ly = LAYER.get(i.layer);
        return h("tr", { class: "pick", onclick: () => selectModule(m, true) }, h("td", { class: "mono" }, m, h("br"), locLink(i.file, 0)), h("td", {}, h("span", { style: `color:${layerColor(i.layer)}` }, Ly ? Ly.name : i.layer)),
          h("td", {}, txt(truncate(modDesc(m), 160)), i.note && typeof i.note === "object" && i.note.does && !isTodo(i.note.does) ? h("div", { class: "note" }, truncate(i.note.does, 180)) : null), h("td", { class: "num" }, i.lines.toLocaleString()), h("td", { class: "num" }, i.funcs.length),
          h("td", { class: "num" }, i.call_sites ? Math.round(100 - (i.unresolved / i.call_sites) * 100) + "%" : "–"), h("td", { class: "note" }, [...i.imports, ...i.lazy_imports.map((x) => x + "*")].map(shortMod).join(", "))); })));
  };
  input.addEventListener("input", draw);
  draw();
})();

// ---------------------------------------------------------------- global search
(function globalSearch() {
  const input = document.getElementById("gsearch"), box = document.getElementById("gresults"), K = L.kind_labels;
  const items = [];
  for (const k of D.keys) { const sy = SYM(k); items.push({ kind: "fn", label: k, sub: (sy.r ? sy.r.map((u) => u.join(" ")).join(" · ") + " — " : "") + (sy.d || ""), hay: (k + " " + (sy.r ? sy.r.map((u) => u[1]).join(" ") : "") + " " + sy.d).toLowerCase(), go: () => openInGraph(k) }); }
  for (const m of Object.keys(D.modules)) items.push({ kind: "module", label: m, sub: modDesc(m), hay: (m + " " + noteText(m) + " " + (D.modules[m].doc || "")).toLowerCase(), go: () => selectModule(m, true) });
  for (const t of Object.keys(D.tables)) items.push({ kind: "table", label: t, sub: "", hay: t.toLowerCase(), go: () => openTable(t) });
  for (const j of D.journeys) items.push({ kind: "journey", label: j.title, sub: j.summary, hay: (j.title + " " + (j.summary || "") + " " + j.steps.map((x) => x.symbol + " " + (x.action || "")).join(" ")).toLowerCase(), go: () => openJourney(j.id) });
  for (const r of D.roles) items.push({ kind: "role", label: r.name, sub: r.purpose, hay: (r.name + " " + (r.purpose || "") + " " + (r.symbols || []).join(" ")).toLowerCase(), go: () => goto("role-" + r.id) });
  for (const f of D.flows) items.push({ kind: "flow", label: f.source, sub: f.sink, hay: (f.source + " " + (f.sink || "")).toLowerCase(), go: () => goto("flow-" + f.id) });
  for (const e of D.entities) items.push({ kind: "entity", label: e.name, sub: e.summary, hay: (e.name + " " + (e.table || "") + " " + (e.summary || "")).toLowerCase(), go: () => goto("ent-" + e.id) });
  for (const f of D.findings) items.push({ kind: "finding", label: f.title, sub: f.category, hay: (f.title + " " + (f.detail || "") + " " + (f.symbols || []).join(" ")).toLowerCase(), go: () => goto("finding-" + f.id) });
  for (const d of D.decisions) items.push({ kind: "decision", label: d.decision, sub: d.by + " · " + (d.how || ""), hay: (d.decision + " " + (d.how || "")).toLowerCase(), go: () => goto("decisions") });
  const RANK = { journey: 0, role: 1, entity: 2, finding: 3, table: 4, module: 5, flow: 6, decision: 7, fn: 8 };
  let hits = [], cur = 0;
  const pick = (i) => { const it = hits[i]; if (!it) return; box.hidden = true; it.go(); };
  const draw = () => fill(box, hits.map((it, i) => h("button", { type: "button", class: i === cur ? "on" : "", onclick: () => pick(i) }, h("span", { class: "k" }, K[it.kind]), h("span", {}, it.label, it.sub ? h("small", {}, truncate(it.sub, 110)) : null))));
  input.addEventListener("input", () => {
    const q = input.value.trim().toLowerCase();
    if (q.length < 2) { box.hidden = true; return; }
    const terms = q.split(/\s+/);
    hits = items.filter((it) => terms.every((t) => it.hay.includes(t) || it.label.toLowerCase().includes(t))).sort((a, b) => (RANK[a.kind] - RANK[b.kind]) || (a.label.length - b.label.length)).slice(0, 30);
    cur = 0; draw(); box.hidden = !hits.length;
  });
  input.addEventListener("keydown", (ev) => {
    if (box.hidden) return;
    if (ev.key === "ArrowDown") { cur = Math.min(hits.length - 1, cur + 1); draw(); ev.preventDefault(); }
    if (ev.key === "ArrowUp") { cur = Math.max(0, cur - 1); draw(); ev.preventDefault(); }
    if (ev.key === "Enter") { pick(cur); ev.preventDefault(); }
    if (ev.key === "Escape") box.hidden = true;
  });
  document.addEventListener("click", (ev) => { if (!ev.target.closest(".searchbar")) box.hidden = true; });
})();

(function footer() {
  fill(document.getElementById("regen"), h("h3", {}, L.regen_h), h("pre", {}, D.regenCommand), h("p", {}, L.regen_cov(D.summary)), h("p", {}, L.regen_blind), h("p", {}, L.regen_gen));
})();
