[[findings]]
id = "sentry-default-pii"
severity = "low"
category = "risk"
title = "Enabling Sentry also turns on sending default PII"
detail = "True now: initialize_all calls sentry_sdk.init(..., send_default_pii=True) whenever --sentry-dsn is set; there is no flag to turn it off. Trigger: an operator setting --sentry-dsn for error reports. Reach: Sentry events from this router carry the data the SDK classifies as PII (such as client IP and request headers), sent to a third party."
symbols = ["vllm_router.app:initialize_all"]
evidence = "Read app.py initialize_all and parser options for sentry."
