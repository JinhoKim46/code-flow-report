  payload = '''
vllm:num_requests_running{model_name="meta-llama/Llama-3.1-8B-Instruct"} 4.0
vllm:num_requests_waiting{model_name="meta-llama/Llama-3.1-8B-Instruct"} 1.0
vllm:gpu_cache_usage_perc{model_name="meta-llama/Llama-3.1-8B-Instruct"} 0.37




'''
  [[journeys.steps]]
  symbol = "vllm_router.routers.metrics_router:metrics"
  actor = "Prometheus scraping GET /metrics on release-router-service"
  action = "Clears per-server gauges, samples router CPU/memory/disk with psutil, then sets gauges from get_request_stats and from get_engine_stats (prefix-cache hit rate, hits, queries) and a healthy flag per discovered endpoint, and returns the Prometheus text."
  receives = "nothing"
  returns = "text/plain Prometheus exposition"
