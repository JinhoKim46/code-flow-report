[[findings]]
id = "batch-processor-placeholder"
severity = "medium"
category = "risk"
title = "The batch API accepts jobs but never runs them against an engine"
detail = "True now: process_batches marks the batch running, sleeps 1 s and saves a text file 'Processed batch <id> at <time>' as the output, then marks it completed (a code comment says to replace it with actual processing logic). Trigger: any POST /v1/batches. Reach: clients using the OpenAI-style batch flow get status completed and an output file that contains no model results."
symbols = ["vllm_router.services.batch_service.local_processor:LocalBatchProcessor.process_batches"]
evidence = "Read LocalBatchProcessor.process_batches; it calls only storage.save_file and SQLite, no HTTP client."
check = {kind = "text_in", pattern = "Simulate processing delay"}

[[findings]]
id = "short-file-ids-overwrite"
severity = "medium"
category = "risk"
title = "File and batch ids use 6 hex characters, so uploads can silently overwrite each other"
detail = "True now: FileStorage.save_file names a new file `file-` + uuid4().hex[:6] (16.7 million values) and opens the path with mode 'wb'; batch ids are `batch_` + 6 hex characters. Trigger: two uploads drawing the same id — by the birthday bound about a 3% chance once ~1,000 files exist and ~50% near 4,800. Reach: the earlier file's content is replaced without error (one user's batch input or output becomes another's); a colliding batch id fails the INSERT on the primary key and the POST returns 500."
symbols = ["vllm_router.services.files_service.file_storage:FileStorage.save_file", "vllm_router.services.batch_service.local_processor:LocalBatchProcessor.create_batch"]
evidence = "Read FileStorage.save_file and LocalBatchProcessor.create_batch (both use uuid4().hex[:6]); no existence check before writing."
check = {kind = "text_in", pattern = "hex\\[:6\\]"}

[[findings]]
id = "dynamic-config-routing-drops-args"
severity = "medium"
category = "risk"
title = "A dynamic config reload rebuilds the routing logic with most of its settings missing"
detail = "True now: DynamicConfigWatcher.reconfigure_routing_logic passes only session_key and the priority_* fields to reconfigure_routing_logic. Trigger: any change to the watched file (reconfigure_all always rebuilds routing). Reach: max_instance_failover_reroute_attempts silently drops to 0 (failover off); switching to kvaware/loadaware passes lmcache_controller_port=None to the LMCache controller; disaggregated modes get no prefill/decode labels; prefixaware loses --prefix-min-match-length; the prefix trie, round-robin counters and LMCache instance map are discarded."
symbols = ["vllm_router.dynamic_config:DynamicConfigWatcher.reconfigure_routing_logic"]
evidence = "Read dynamic_config.py reconfigure_routing_logic and routing_logic.py initialize_routing_logic (kwargs.get defaults) and cleanup_routing_logic; compared with app.py initialize_all, which passes 17 keyword arguments."

[[findings]]
id = "dynamic-config-sd-drops-type"
severity = "medium"
category = "risk"
title = "A dynamic config reload switches service-name discovery back to pod-ip and restarts discovery on every change"
detail = "True now: DynamicConfigWatcher.reconfigure_service_discovery for k8s passes namespace, port, label selector and labels, but not k8s_service_discovery_type, watcher_timeout_seconds or health_check_timeout_seconds; _create_service_discovery defaults the type to pod-ip. reconfigure_all calls it even when only callbacks or session_key changed. Trigger: any edit of the watched file. Reach: a router started with --k8s-service-discovery-type service-name starts watching pods instead; on every reload the new discovery starts empty and fills from its watch, so requests in that window can get 404/503."
symbols = ["vllm_router.dynamic_config:DynamicConfigWatcher.reconfigure_service_discovery"]
evidence = "Read dynamic_config.py reconfigure_service_discovery / reconfigure_all and service_discovery.py _create_service_discovery / reconfigure_service_discovery."

[[findings]]
id = "kvaware-blocking-tokenize"
severity = "medium"
category = "risk"
title = "kvaware routing can block the whole event loop for up to 10 seconds"
detail = "True now: KvawareRouter.route_request (async) falls back to a synchronous requests.post to the engine's /tokenize with timeout=10 when the local tokenizer cannot load, on the event loop thread. LoadAwareRouter.tokenize_prompt fixed the same call by running it in an executor. Trigger: routing-logic kvaware and AutoTokenizer.from_pretrained failing (no transformers, no HF access, gated model). Reach: every in-flight request and stream on that router replica stalls while each tokenize call runs."
symbols = ["vllm_router.routers.routing_logic:KvawareRouter.route_request"]
evidence = "Read KvawareRouter.route_request and LoadAwareRouter.tokenize_prompt side by side."
check = {kind = "text_in", pattern = "body = requests\\.post\\("}

[[findings]]
id = "kvaware-ignores-chat-messages"
severity = "medium"
category = "risk"
title = "KV-cache-aware routing tokenizes only `prompt`, so chat completions never use the cache lookup"
detail = "True now: KvawareRouter.route_request and LoadAwareRouter.tokenize_prompt encode request_json.get('prompt', ''); a /v1/chat/completions body has `messages` instead (a code comment marks chat completions as still to do). Trigger: routing-logic kvaware or loadaware with chat traffic. Reach: the token list is empty, the lookup finds nothing, and every chat request falls back to session hash or lowest QPS — the KV-aware behaviour applies only to /v1/completions."
symbols = ["vllm_router.routers.routing_logic:KvawareRouter.route_request", "vllm_router.routers.routing_logic:LoadAwareRouter.tokenize_prompt"]
evidence = "Read both functions; compare PrefixAwareRouter.route_request, which does concatenate messages[].content."
check = {kind = "text_in", pattern = "request_json\\.get\\(\"prompt\", \"\"\\)"}

[[findings]]
id = "prefix-trie-unbounded"
severity = "low"
category = "risk"
title = "The prefix-aware HashTrie only grows"
detail = "Now: HashTrie.insert adds one TrieNode (with its own asyncio.Lock) per 128-character chunk of every distinct prompt, and nothing ever removes nodes or URLs of engines that are gone; the class says it assumes no eviction. Trigger: a long-running router with --routing-logic prefixaware and varied prompts. Reach: router memory grows with total distinct prompt text served; stale engine URLs stay in node sets but are filtered by the available-endpoints intersection, so routing stays correct."
symbols = ["vllm_router.routers.routing_logic:PrefixAwareRouter", "vllm_router.prefix.hashtrie:HashTrie.insert"]
evidence = "Read PrefixAwareRouter (docstring: 'we assume that there is no eviction of prefix cache') and HashTrie.insert / longest_prefix_match; grep found no delete or eviction method in vllm_router/prefix/hashtrie.py."
check = {kind = "text_in", pattern = "assume that there is no eviction"}

[[findings]]
id = "disagg-prefill-single-client"
severity = "medium"
category = "risk"
title = "disaggregated_prefill uses one prefill and one decode engine, whatever the routing logic would choose"
detail = "True now: route_disaggregated_prefill_request sends to app.state.prefill_client and app.state.decode_client; initialize_client_sessions overwrites each with a session bound to the last endpoint seen for that label. DisaggregatedPrefillRouter.route_request has no callers. Trigger: routing-logic disaggregated_prefill with more than one prefill or decode pod. Reach: the extra pods receive no traffic; when that one pod is replaced the client is only re-bound when the watcher sees the new pod."
symbols = ["vllm_router.routers.routing_logic:DisaggregatedPrefillRouter.route_request", "vllm_router.services.request_service.request:route_disaggregated_prefill_request", "vllm_router.service_discovery:K8sPodIPServiceDiscovery.initialize_client_sessions"]
evidence = "`codeflow.py query DisaggregatedPrefillRouter.route_request` → callers (0); read route_disaggregated_prefill_request and initialize_client_sessions."
check = "no_callers"

[[findings]]
id = "engine-auth-inconsistent"
severity = "medium"
category = "risk"
title = "Disaggregated paths do not send the engine API key the chart configures"
detail = "True now: the chart gives engines and router VLLM_API_KEY from release-secrets. The general proxy forwards the client's own Authorization header; discovery probes use VLLM_API_KEY; send_request_to_prefiller/send_request_to_decode send `Bearer` + env OPENAI_API_KEY (literally 'Bearer None' when unset); route_orchestrated_disaggregated_request sends no Authorization at all. Trigger: disaggregated_prefill or disaggregated_prefill_orchestrated with servingEngineSpec.vllmApiKey set. Reach: every prefill call gets 401 from the engine and the client gets a prefiller error."
symbols = ["vllm_router.services.request_service.request:send_request_to_prefiller", "vllm_router.services.request_service.request:route_orchestrated_disaggregated_request"]
evidence = "grep for API_KEY/Authorization in src/vllm_router; read the four functions and helm/templates/deployment-router.yaml / deployment-vllm-multi.yaml env blocks."
check = {kind = "text_in", pattern = "OPENAI_API_KEY"}

[[findings]]
id = "static-health-check-no-auth"
severity = "medium"
category = "risk"
title = "Static backend health checks fail against engines that require an API key, removing every backend"
detail = "True now: utils.is_model_healthy posts a test request with only Content-Type, while the K8s discovery probes add Authorization from VLLM_API_KEY. Trigger: --service-discovery static with --static-backend-health-checks against vLLM started with --api-key. Reach: every check gets 401, all backends are listed as unhealthy and dropped from get_endpoint_info, so every request answers 503 ('temporarily unavailable')."
symbols = ["vllm_router.utils:is_model_healthy"]
evidence = "Read utils.is_model_healthy and StaticServiceDiscovery.get_unhealthy_endpoint_hashes / get_endpoint_info; compared with K8sPodIPServiceDiscovery._get_model_names."

[[findings]]
id = "proxy-no-timeout"
severity = "low"
category = "risk"
title = "The general proxy has no timeout, and failover only covers errors before headers"
detail = "True now: process_request calls the engine with aiohttp ClientTimeout(total=None) and no sock_read limit. Trigger: an engine that accepts the connection and then hangs (GPU hang, stuck worker). Reach: the client waits until it gives up; the router keeps the request counted as in flight until the connection closes, so load-aware routers see that engine as busy, and failover does not apply because headers were already received or never error."
symbols = ["vllm_router.services.request_service.request:process_request"]
evidence = "Read process_request and the retry loop in route_general_request (except clause around anext(stream_generator))."
check = {kind = "text_in", pattern = "ClientTimeout\\(total=None\\)"}

[[findings]]
id = "streaming-response-buffered"
severity = "low"
category = "risk"
title = "Streaming responses are also kept in full in router memory"
detail = "True now: process_request appends every chunk to full_response; the comment says this is for non-streaming requests, but full_response is never None, so streams are buffered too (used for the semantic cache and post_request callback). Trigger: many concurrent long streams. Reach: router memory per request grows to the full response size for the life of the stream."
symbols = ["vllm_router.services.request_service.request:process_request"]
evidence = "Read process_request: full_response = bytearray() then `if full_response is not None: full_response.extend(chunk)`."
check = {kind = "text_in", pattern = "if full_response is not None"}

[[findings]]
id = "pii-feature-not-wired"
severity = "medium"
category = "doc vs code"
title = "The experimental README promises PII detection and blocking, but nothing calls it"
detail = "True now: experimental/README.md says 'detects and blocks PII in LLM requests' and to start with --feature-gates=PII=true --pii-analyzer=…; pii.middleware.check_pii has no callers, the parser has no --pii-analyzer option, and the gate name in feature_gates.py is PIIDetection. Trigger: an operator following the README. Reach: the router refuses the unknown --pii-analyzer flag, and with the gate alone no request is ever checked — prompts with PII go to engines unfiltered while the operator believes they are blocked."
symbols = ["vllm_router.experimental.pii.middleware:check_pii"]
evidence = "`codeflow.py query check_pii` → callers (0); grep -i pii in parsers/parser.py → no match; read experimental/README.md and feature_gates.py."
check = "no_callers"

[[findings]]
id = "shadowed-semantic-cache-module"
severity = "low"
category = "dead code"
title = "experimental/semantic_cache.py is unreachable and would not import"
detail = "True now: src/vllm_router/experimental/ has both a semantic_cache/ package and a semantic_cache.py file; Python resolves `vllm_router.experimental.semantic_cache` to the package, so the .py file is never loaded, and it imports vllm_router.experimental.semantic_cache_db, which does not exist. Trigger: someone editing the .py file expecting a change. Reach: confusion only; no runtime effect."
symbols = ["vllm_router.experimental.semantic_cache"]
evidence = "ls src/vllm_router/experimental; diffed the two files; grep semantic_cache_db → only the import line in semantic_cache.py."

[[findings]]
id = "chart-schema-routing-enum"
severity = "low"
category = "doc vs code"
title = "The Helm chart rejects two routing logics the router supports"
detail = "True now: --routing-logic accepts roundrobin, session, kvaware, loadaware, prefixaware, disaggregated_prefill, disaggregated_prefill_orchestrated and priority; helm/values.schema.json (and the @schema comment in values.yaml) enumerate only six, without loadaware and priority. Trigger: routerSpec.routingLogic: loadaware or priority. Reach: helm install/upgrade fails schema validation; users must pass the flag through routerSpec.extraArgs."
symbols = ["vllm_router.parsers.parser:parse_args"]
evidence = "Read parse_args --routing-logic choices and helm/values.schema.json routerSpec.routingLogic.enum."

[[findings]]
id = "router-readme-stale-options"
severity = "low"
category = "doc vs code"
title = "The router README lists fewer routing and discovery options than the code has"
detail = "True now: src/vllm_router/README.md says --routing-logic options are 'roundrobin or session', --service-discovery 'static or k8s', prefix-aware routing is '(WIP)', and the dynamic config routing_logic is 'roundrobin or session'. The parser offers eight routing logics and external-only discovery. Trigger: a newcomer configuring from the README. Reach: features stay unknown; no runtime effect."
symbols = ["vllm_router.parsers.parser:parse_args"]
evidence = "Read README.md option list and parse_args choices for --routing-logic and --service-discovery."

[[findings]]
id = "multi-replica-router-state"
severity = "medium"
category = "risk"
title = "Running more than one router replica splits routing state, and kvaware loses cache information"
detail = "True now: the prefix trie, round-robin counters, request stats and the LMCache controller all live inside one router process. The chart can run several (routerSpec.replicaCount, or hpa-router.yaml when routerSpec.autoscaling.enabled, maxReplicas default 3), while engines reach the LMCache controller through LMCACHE_CONTROLLER_PULL_URL = release-router-service:<port>, which the Service load-balances to one replica. Trigger: more than one router replica with kvaware/loadaware/prefixaware. Reach: replicas that did not receive a worker's registration have no cache layout and fall back to session/QPS routing; prefix affinity and load counts are per replica only."
symbols = ["vllm_router.routers.routing_logic:KvawareRouter.start_kv_manager", "vllm_router.routers.routing_logic:PrefixAwareRouter.route_request"]
evidence = "Read KvawareRouter.__init__/start_kv_manager (controller bound to 0.0.0.0 in-process), helm/templates/service-router.yaml (port 9000), deployment-vllm-multi.yaml (LMCACHE_CONTROLLER_PULL_URL), hpa-router.yaml and values.yaml routerSpec.autoscaling."

[[findings]]
id = "engine-stats-unused-by-routing"
severity = "info"
category = "risk"
title = "Scraped engine metrics are not used by any routing logic"
detail = "True now: route_general_request passes engine_stats to every router, but no class in routing_logic.py reads it (LoadAwareRouter documents it as unused because it is scrape-lagged). The scraper fetches engines one after another with timeout = --engine-stats-interval. Trigger: reading the code or docs as if routing were driven by engine queue length. Reach: understanding only; with many slow engines a scrape round can take several intervals, which only delays the exported gauges."
symbols = ["vllm_router.stats.engine_stats:EngineStatsScraper._scrape_metrics"]
evidence = "grep 'engine_stats[' / get_engine_stats() in src/vllm_router: only metrics_router, log_stats and request.py read it; read every route_request in routing_logic.py."

[[findings]]
id = "noop-rewriter-always-active"
severity = "low"
category = "risk"
title = "Every request logs 'was rewritten' although no rewriter is configured"
detail = "True now: initialize_all calls get_request_rewriter(), which creates a NoopRequestRewriter, so is_request_rewriter_initialized() is always True; route_general_request then 'rewrites' each body, logs 'Request for model … was rewritten' at INFO and re-parses the JSON. initialize_request_rewriter has no callers and --request-rewriter only accepts noop. Trigger: every API request. Reach: misleading INFO line per request and one extra JSON parse."
symbols = ["vllm_router.app:initialize_all"]
evidence = "Read rewriter.py (get_request_rewriter, is_request_rewriter_initialized) and route_general_request; `codeflow.py query initialize_request_rewriter` → callers (0)."
check = {kind = "calls", target = "vllm_router.services.request_service.rewriter:get_request_rewriter"}

[[findings]]
id = "metrics-blocks-event-loop"
severity = "low"
category = "risk"
title = "Each /metrics scrape pauses the router for 100 ms"
detail = "True now: the async metrics handler calls psutil.cpu_percent(interval=0.1), which sleeps synchronously on the event loop. Trigger: every Prometheus scrape of the router (ServiceMonitor). Reach: all requests on that replica stall 0.1 s per scrape; small at a 15–30 s scrape interval."
symbols = ["vllm_router.routers.metrics_router:metrics"]
evidence = "Read metrics_router.metrics."
check = {kind = "text_in", pattern = "cpu_percent\\(interval=0\\.1\\)"}

[[findings]]
id = "request-stats-dead-fields"
severity = "low"
category = "risk"
title = "Exported ITL, decoding length and swapped counts are constants"
detail = "True now: get_request_stats sets avg_itl to -1 always, decoding_length_monitors is never written, and on_request_swapped has no callers. Trigger: dashboards built on avg_itl, avg_decoding_length or num_requests_swapped from the router's /metrics. Reach: those panels show -1 or 0 forever."
symbols = ["vllm_router.stats.request_stats:RequestStatsMonitor.get_request_stats", "vllm_router.stats.request_stats:RequestStatsMonitor.on_request_swapped"]
