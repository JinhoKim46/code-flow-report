[[findings]]
id = "failover-ignores-5xx"
severity = "medium"
category = "doc vs code"
title = "Instance failover only reacts to connection errors, not to an engine's 4xx/5xx"
detail = "Now: process_request's docstring says it raises HTTPError when the backend returns a 4xx or 5xx status, but it never calls raise_for_status — it yields the engine's status and streams the body. route_general_request's failover loop (max_instance_failover_reroute_attempts) therefore retries only when aiohttp raises before the headers, for example connection refused. Trigger: an engine that is up but answers 500/503 (overloaded, draining, out of memory). Reach: every routed request on that engine; the error goes straight to the client even with failover configured, and the request is not tried on another engine."
symbols = ["vllm_router.services.request_service.request:process_request", "vllm_router.services.request_service.request:route_general_request"]
evidence = "Read process_request (no raise_for_status; yields backend_response.headers, backend_response.status before streaming) and the attempt loop in route_general_request (except Exception around anext(stream_generator) only). src/tests/test_instance_failover.py simulates failure only by making process_request raise."
check = {kind = "text_in", pattern = "HTTPError: If the backend returns a 4xx or 5xx status code"}

[[findings]]
id = "request-id-collision-leaks-load"
severity = "medium"
category = "risk"
title = "Two in-flight requests with the same X-Request-Id leave an engine's in-flight counter permanently high"
detail = "Now: RequestStatsMonitor keys each request by (engine url, request id), and the id is the client's X-Request-Id when present. on_new_request increments in_prefill_requests every time but overwrites the start-time entry; the first on_request_complete pops that entry, so the second completion returns early and never decrements. Trigger: a client that reuses or hard-codes X-Request-Id while an earlier request with that id is still running on the same engine. Reach: one stuck unit per collision on that engine, never recovered until restart; load-aware and priority routing (which use in_prefill + in_decoding) steer traffic away from it, and the router's /metrics shows phantom running requests."
symbols = ["vllm_router.stats.request_stats:RequestStatsMonitor.on_new_request", "vllm_router.stats.request_stats:RequestStatsMonitor.on_request_complete", "vllm_router.services.request_service.request:route_general_request"]
evidence = "Read route_general_request (request_id = request.headers.get('X-Request-Id') or uuid4), on_new_request (unconditional += 1 and dict overwrite) and on_request_complete (returns when the key is missing). Traced two overlapping calls by hand."
check = {kind = "text_in", pattern = "self\\.request_start_time\\[\\(engine_url, request_id\\)\\] = timestamp"}

[[findings]]
id = "prefixaware-keyerror-non-prompt"
severity = "medium"
category = "risk"
title = "Prefix-aware routing returns 500 for embeddings, rerank, score and responses requests"
detail = "Now: PrefixAwareRouter.route_request reads 'messages', and otherwise request_json['prompt'] with no fallback. Embeddings and responses bodies use 'input', rerank and score use 'query'/'text_1', so those requests raise KeyError, which nothing catches. A list-valued completions prompt also fails when the trie slices and hashes it. Trigger: --routing-logic prefixaware and any request to those routes. Reach: every such request on that deployment returns 500 instead of being routed."
symbols = ["vllm_router.routers.routing_logic:PrefixAwareRouter.route_request"]
evidence = "Read PrefixAwareRouter.route_request (prompt = request_json['prompt']), main_router (embeddings/rerank/score/responses all go through route_general_request) and route_general_request (awaits route_request for PrefixAwareRouter without a try)."
check = {kind = "text_in", pattern = "prompt = request_json\\[\"prompt\"\\]"}

[[findings]]
id = "batch-api-cannot-start"
severity = "medium"
category = "risk"
title = "--enable-batch-api stops the router at start-up: local_processor imports a module that does not exist"
detail = "Now: local_processor imports BatchInfo and BatchStatus from vllm_router.batch.batch at module level and again inside retrieve_batch, but the package is vllm_router.services.batch_service.batch; there is no vllm_router/batch. initialize_batch_processor imports local_processor ('local' is the only choice), so initialize_all raises ModuleNotFoundError. Without the flag, /v1/files answers 500 because app.state.batch_storage is never set. Even past the import, process_batches only sleeps one second and writes a placeholder text file; it never sends the batch lines to an engine. Trigger: enabling the batch API. Reach: the whole Files and Batches API is unusable today."
symbols = ["vllm_router.services.batch_service.local_processor:LocalBatchProcessor.retrieve_batch", "vllm_router.services.batch_service:initialize_batch_processor", "vllm_router.services.batch_service.local_processor:LocalBatchProcessor.process_batches"]
evidence = "find . -name batch.py → only src/vllm_router/services/batch_service/batch.py; grep 'vllm_router.batch' → the two imports in local_processor.py. Read initialize_batch_processor, initialize_all (batch processor created inside initialize_all), files_router:route_files (reads app.state.batch_storage inside try) and process_batches (its own comment says to replace the simulated processing with real logic)."
check = {kind = "text_in", pattern = "from vllm_router\\.batch\\.batch import"}

[[findings]]
id = "semantic-cache-blocks-loop"
severity = "medium"
category = "risk"
title = "Semantic cache embeds and rewrites its whole index on the event loop"
detail = "Now: check_semantic_cache and store_in_semantic_cache are async but call SemanticCache.search/store synchronously; each runs SentenceTransformer.encode, and FAISSAdapter.store then rewrites the full FAISS index file and pickles the full metadata list on every stored answer. Trigger: SemanticCache gate on; cost grows with traffic and cache size. Reach: while one request embeds or saves, the single uvicorn event loop serves no other request, so latency rises for every route, not just chat."
symbols = ["vllm_router.experimental.semantic_cache.db_adapters.faiss_adapter:FAISSAdapter.store", "vllm_router.experimental.semantic_cache_integration:check_semantic_cache", "vllm_router.experimental.semantic_cache.semantic_cache:SemanticCache.get_embedding"]
evidence = "Read check_semantic_cache (semantic_cache.search(...) without await or executor), SemanticCache.get_embedding (embedding_model.encode), FAISSAdapter.store (index.add then save_index → faiss.write_index + pickle.dump of all metadata)."
check = {kind = "calls", target = "vllm_router.experimental.semantic_cache.db_adapters.faiss_adapter:FAISSAdapter.save_index"}

[[findings]]
id = "semantic-cache-top1-model-filter"
severity = "low"
category = "risk"
title = "Semantic cache misses when the nearest entry belongs to another model"
detail = "Now: FAISSAdapter.search asks FAISS for the single nearest vector across all models and only then checks that its model matches. Trigger: the same or similar question cached for two models. Reach: lookups for one model miss even though a close-enough entry for that model exists; lower hit rate, never a wrong answer."
symbols = ["vllm_router.experimental.semantic_cache.db_adapters.faiss_adapter:FAISSAdapter.search"]
evidence = "Read FAISSAdapter.search: self.index.search(embedding, 1), then 'if metadata[\"model\"] == model'."
check = {kind = "text_in", pattern = "self\\.index\\.search\\(embedding, 1\\)"}
