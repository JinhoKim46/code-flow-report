[[journeys]]
id = "semantic-cache"
title = "Answer a chat completion from the semantic cache"
actor = "API client"
trigger = "POST /v1/chat/completions with --feature-gates SemanticCache=true and --semantic-cache-model set"
summary = "With the experimental SemanticCache gate on, the router embeds the chat messages with a sentence-transformers model and looks up the nearest earlier request in a FAISS index; above the similarity threshold it answers from the cache without contacting an engine. On a miss the request is routed normally, and a non-streaming answer is embedded and appended to the index afterwards."
  [[journeys.steps]]
  symbol = "vllm_router.routers.main_router:route_chat_completion"
  actor = "client"
  action = "Calls check_semantic_cache first; a non-None answer is returned as is, otherwise the request continues to route_general_request."
  receives = "the chat completion request"
  returns = "the cached JSONResponse, or the engine's streamed response"
  stores = "nothing"
  payload = '''
{"model": "meta-llama/Llama-3.1-8B-Instruct",
 "messages": [{"role": "user", "content": "What is the capital of France?"}]}




'''
  [[journeys.steps]]
  symbol = "vllm_router.experimental.semantic_cache_integration:check_semantic_cache"
  action = "Returns None at once unless the feature gate is on. Otherwise it reads the JSON body, honours skip_cache, takes an optional per-request cache_similarity_threshold, and searches. On a hit it builds an OpenAI-shaped chat.completion with 'cached': true and the similarity score."
  receives = "request"
  returns = "JSONResponse on a hit, None on a miss"
  stores = "hit/miss/ratio/latency Prometheus gauges"
  payload = '''
{"id": "chatcmpl-1d2e…", "object": "chat.completion", "model": "meta-llama/Llama-3.1-8B-Instruct",
 "choices": [{"index": 0, "message": {"role": "assistant", "content": "Paris."}, "finish_reason": "stop"}],
 "cached": true, "similarity_score": 0.97}




'''
  [[journeys.steps]]
  symbol = "vllm_router.experimental.semantic_cache.semantic_cache:SemanticCache.search"
  action = "Uses the default threshold (--semantic-cache-threshold) unless the request gave one, embeds the messages and asks the database adapter."
  receives = "messages, model, similarity_threshold"
  returns = "response_messages, usage, similarity_score — or None"
  stores = "nothing"
  [[journeys.steps]]
  symbol = "vllm_router.experimental.semantic_cache.semantic_cache:SemanticCache.get_embedding"
  action = "Joins the messages as 'role: content' text and encodes it with the SentenceTransformer model, in the request's own coroutine."
  receives = "messages"
  returns = "float32 vector"
  stores = "nothing"
  [[journeys.steps]]
  symbol = "vllm_router.experimental.semantic_cache.db_adapters.faiss_adapter:FAISSAdapter.search"
  action = "Inner-product search for the single nearest vector; it is a hit only if the score clears the threshold and the stored entry was for the same model."
  receives = "embedding, model, threshold"
  returns = "the stored entry's response_messages and usage, or None"
  stores = "nothing"
  [[journeys.steps]]
  symbol = "vllm_router.services.request_service.request:route_general_request"
  action = "On a miss the request takes the normal path: model check, engine filter, routing logic, process_request to the chosen engine."
  receives = "request, '/v1/chat/completions'"
  returns = "StreamingResponse"
  stores = "see the main journey"
  [[journeys.steps]]
  symbol = "vllm_router.experimental.semantic_cache_integration:store_in_semantic_cache"
  actor = "process_request, after the last chunk"
  action = "Only for POST /v1/chat/completions, without skip_cache, and only when stream is false. It parses the full engine answer, pulls the assistant messages and usage, and stores them."
  receives = "endpoint, method, request body, full response body"
  returns = "nothing (errors are logged)"
  stores = "via SemanticCache.store; updates the semantic_cache_size gauge"
  [[journeys.steps]]
  symbol = "vllm_router.experimental.semantic_cache.db_adapters.faiss_adapter:FAISSAdapter.store"
  action = "Appends the vector to the FAISS IndexFlatIP and the request/response/model/usage to a metadata list, then writes both to disk."
  receives = "embedding, request_messages, response_messages, model, usage"
  returns = "nothing"
  stores = "faiss index file and faiss_metadata.pkl in --semantic-cache-dir (./semantic_cache by default)"

[[roles]]
id = "http-aiohttp"
kind = "external"
name = "HTTP proxy to vLLM engines"
symbols = ["vllm_router.services.request_service.request:process_request", "vllm_router.services.request_service.request:route_orchestrated_disaggregated_request", "vllm_router.services.request_service.request:route_disaggregated_prefill_request", "vllm_router.services.request_service.request:route_sleep_wakeup_request", "vllm_router.aiohttp_client:AiohttpClientWrapper.start"]
purpose = "Forwards each client request to the chosen vLLM engine (third-party image vllm/vllm-openai or lmcache/vllm-openai, K8s Service release-<name>-engine-service or pod IP) and streams the engine's answer back unchanged."
input = "The original request body (after alias replacement or priority injection) and the client's headers minus hop-by-hop headers; X-Request-Id is replaced by the router's id."
message = ["method + path: the same as the client used (e.g. POST /v1/chat/completions) on the engine base URL", "headers: client headers (including the client's Authorization) except hop-by-hop, plus X-Request-Id", "body: raw bytes of the client's JSON request"]
config = "One shared aiohttp ClientSession with an unlimited TCPConnector (AiohttpClientWrapper.start). Engine URLs come from service discovery. Disaggregated modes use --prefill-model-labels / --decode-model-labels; /sleep and /wake_up add Authorization from env VLLM_API_KEY; the two-request disaggregated mode uses env OPENAI_API_KEY."
output = "Engine status code and headers are yielded first, then raw chunks as they arrive (SSE for stream=true, one JSON body otherwise). A 4xx/5xx from the engine is passed through to the client as-is."
validation = "No total timeout on the general path (ClientTimeout total=None). If connecting or receiving headers raises, route_general_request retries on another endpoint up to --max-instance-failover-reroute-attempts times; nothing is retried once headers have been sent. Orchestrated disaggregation uses 300 s (prefill) and 600 s (decode) timeouts."
logging = "INFO line per routed request with request id, session id, engine URL and router overhead; request_errors_total and request_latency_seconds Prometheus metrics labelled by engine URL."
cost = "not measured"
result_use = "Chunks are streamed to the client through a StreamingResponse; for non-streaming responses the usage block feeds input_tokens_total / output_tokens_total; the full response is handed to the optional semantic cache and post_request callback."

[[roles]]
id = "http-requests"
kind = "external"
name = "Engine probes during discovery"
symbols = ["vllm_router.service_discovery:K8sPodIPServiceDiscovery._get_model_names", "vllm_router.service_discovery:K8sPodIPServiceDiscovery._get_model_info", "vllm_router.service_discovery:K8sPodIPServiceDiscovery._get_engine_sleep_status", "vllm_router.utils:is_model_healthy"]
purpose = "Asks each newly ready engine which models and LoRA adapters it serves and whether it is sleeping, so the router knows what an endpoint can answer; for static backends, optionally sends a tiny real request to check the model works."
input = "Pod IP (or Service name) and --k8s-port; for static health checks, the backend URL, model and --static-model-types."
message = ["GET http://<pod-ip>:<port>/v1/models", "GET http://<pod-ip>:<port>/is_sleeping (only if the pod's vllm container runs with --enable-sleep-mode)", "static: POST <url>/v1/chat/completions (or the endpoint for the model type) with a one-token test payload"]
config = "Header Authorization: Bearer from env VLLM_API_KEY on the K8s probes (not on the static health check). Timeouts: --backend-health-check-timeout-seconds (K8s), --static-backend-health-check-timeout-seconds and --static-backend-health-check-interval (static, enabled by --static-backend-health-checks)."
output = "/v1/models `data[].id` list (parent set for adapters) and `is_sleeping` boolean; static check passes on 2xx with a JSON body."
validation = "Any failure is logged and turned into an empty model list (the pod is then not registered) or sleep=False; synchronous `requests` calls on the watcher thread, never on the event loop. Static checks run in their own thread and event loop."
logging = "INFO 'Found models on pod …', ERROR 'Failed to get model names …', WARNING '<model> at <url> not healthy!'"
cost = "Two or three HTTP calls per pod ADDED/MODIFIED event; one test inference per static backend per interval."
result_use = "Builds the EndpointInfo (model_names, model_info, sleep) that routing filters on; unhealthy static backends are left out of get_endpoint_info."

[[roles]]
id = "k8s-deployment-release-deployment-router-templates-deployment-r"
kind = "infra"
name = "K8s Deployment release-deployment-router"
symbols = ["vllm_router.app:main"]
purpose = "Runs the router process (`vllm-router` → main) that every client request passes through before it reaches a vLLM engine pod."
message = ["invoked by: K8s Ingress release-ingress-router (when routerSpec.ingress.enabled) or HTTPRoute release-router-<name> → K8s Service release-router-service, port 80 → container router-port", "invoked by: vLLM engine pods' LMCache workers on Service port 9000 → container lmcache-port (the LMCache controller inside the router, kvaware/loadaware only)", "invoked by: kubelet probes GET /health (liveness, startup, readiness) and the router ServiceMonitor scraping GET /metrics"]
config = "defined in helm/templates/deployment-router.yaml · environment: VLLM_API_KEY → K8s Secret release-secrets key vllmApiKey (or the Secret named in routerSpec.vllmApiKey / servingEngineSpec.vllmApiKey), HF_TOKEN from routerSpec.hf_token, PYTHONHASHSEED, LMCACHE_LOG_LEVEL, anything in routerSpec.env (e.g. LOADAWARE_BETA, OPENAI_API_KEY) · arguments from routerSpec.serviceDiscovery, routingLogic, sessionKey, prefixMinMatchLength, engineScrapeInterval, requestStatsWindow, lmcacheController*Port, otel.*, extraArgs · replicas from routerSpec.replicaCount or hpa-router.yaml when routerSpec.autoscaling.enabled"
output = "OpenAI-compatible HTTP responses streamed back from the chosen engine; JSON for /v1/models, /engines, /health; Prometheus text for /metrics."
validation = "Kubernetes restarts the container when GET /health returns 503, which happens when the service-discovery watcher thread or the engine-stats scraper thread has died (main_router:health). Engines being down does not fail /health; requests for a model with no live engine get 404 (never seen) or 503 (seen before)."
logging = "stdout (text or JSON via --log-format); optional Sentry (--sentry-dsn) and OpenTelemetry (--otel-endpoint); request counters and latencies on /metrics."
result_use = "Runs as ServiceAccount release-router-service-account bound to Role release-reader: get/watch/list/patch on pods (plus services and endpoints in service-name mode) in its namespace — used to watch engine pods and to add/remove the `sleeping` label. Calls engine pods directly by pod IP (or engine Service name) over HTTP."

[[roles]]
id = "k8s-api"
kind = "external"
name = "Kubernetes API (service discovery)"
symbols = ["vllm_router.service_discovery:K8sPodIPServiceDiscovery._watch_engines", "vllm_router.service_discovery:K8sServiceNameServiceDiscovery._watch_engines", "vllm_router.service_discovery:K8sPodIPServiceDiscovery.add_sleep_label", "vllm_router.service_discovery:K8sPodIPServiceDiscovery.remove_sleep_label"]
purpose = "Keeps the engine list current by watching engine pods (pod-ip mode) or Services (service-name mode) in the router's namespace, and marks pods put to sleep with a `sleeping=true` label."
input = "Namespace and label selector from --k8s-namespace and --k8s-label-selector (Helm passes the release namespace and servingEngineSpec.labels)."
message = ["watch list_namespaced_pod(namespace, label_selector, timeout_seconds) → ADDED / MODIFIED / DELETED events", "read_namespaced_pod to check for --enable-sleep-mode and current labels", "patch_namespaced_pod to add or remove the sleeping label"]
config = "In-cluster ServiceAccount credentials (load_incluster_config), falling back to ~/.kube/config; --k8s-service-discovery-type pod-ip|service-name; --k8s-watcher-timeout-seconds. RBAC: Role release-reader (helm/templates/role.yaml)."
output = "Pod objects: name, IP, readiness of every container, deletion timestamp, `model` label."
validation = "Watch errors are logged and the watch restarts after 0.5 s; a pod counts only when all containers are ready, it is not terminating and /v1/models returns at least one model; a MODIFIED pod that lost its IP (evicted) is removed. /health reports 503 if the watcher thread dies."
logging = "ERROR 'K8s watcher error', INFO 'Discovered new serving engine …' / 'Serving engine … is deleted'."
cost = "One long-lived watch stream per router replica."
result_use = "Maintains available_engines (EndpointInfo per pod) and known_models; every request reads a snapshot through get_endpoint_info."

[[roles]]
id = "engine-metrics-scrape"
kind = "background"
name = "Engine /metrics scraper"
symbols = ["vllm_router.stats.engine_stats:EngineStatsScraper._scrape_worker", "vllm_router.stats.engine_stats:EngineStatsScraper._scrape_one_endpoint", "vllm_router.stats.engine_stats:EngineStats.from_vllm_scrape"]
purpose = "Periodically reads each engine's Prometheus /metrics so the router can re-export running/queued requests and prefix-cache hit rates per engine."
input = "The current endpoint list from service discovery."
message = ["GET <engine-url>/metrics (no Authorization header), one engine after another"]
config = "--engine-stats-interval (Helm routerSpec.engineScrapeInterval); the same value is the per-request timeout."
output = "Prometheus text; parsed for vllm:num_requests_running, vllm:num_requests_waiting, vllm:gpu_prefix_cache_hit_rate / hits_total / queries_total, vllm:gpu_cache_usage_perc."
validation = "A failed scrape is logged and that engine is dropped from the stats map for this round; engines no longer discovered are removed. /health reports 503 if the thread dies."
logging = "INFO 'Scraping metrics from N serving engine(s)', ERROR 'Failed to scrape metrics from …'."
cost = "One HTTP request per engine per interval, made serially on one daemon thread."
result_use = "Read by metrics_router:metrics (gpu_prefix_cache_* gauges) and log_stats; passed to every routing logic, but no routing logic in routing_logic.py reads it."

[[roles]]
id = "lmcache-controller"
kind = "external"
name = "LMCache controller (in-process)"
symbols = ["vllm_router.routers.routing_logic:KvawareRouter.start_kv_manager", "vllm_router.routers.routing_logic:KvawareRouter.query_manager", "vllm_router.routers.routing_logic:LoadAwareRouter.refresh_instance_map"]
purpose = "For kvaware and loadaware routing, the router itself hosts LMCache's controller (third-party library lmcache, not in this repo) so engines' LMCache workers report which KV-cache chunks they hold, and the router can ask who holds the longest prefix of a prompt."
input = "Token ids of the prompt (local Hugging Face tokenizer, or the engine's /tokenize as fallback) and engine IPs."
message = ["inbound: engines' LMCache workers connect to <router-service>:<controllerPort> (env LMCACHE_CONTROLLER_PULL_URL / LMCACHE_CONTROLLER_REPLY_URL set in deployment-vllm-multi.yaml)", "LookupMsg(tokens, event_id) → layout_info {instance_id: (location, matched_tokens)}", "QueryInstMsg(ip, event_id) → instance_id for an engine IP"]
config = "--lmcache-controller-port (Helm routerSpec.lmcacheControllerPort; Service and container expose 9000), --lmcache-controller-reply-port, --lmcache-controller-heartbeat-port, --lmcache-health-check-interval, --lmcache-worker-timeout, --kv-aware-threshold, --loadaware-beta or env LOADAWARE_BETA."
output = "The instance holding the most matched tokens, translated to an engine URL through instance_id_to_ip."
validation = "Runs on its own event loop in a daemon thread. With no holder, too few matched tokens (prompt length minus kv_aware_threshold) or an unknown instance, routing falls back to the session hash or lowest QPS."
logging = "INFO 'Instance id to ip mapping …', 'Routing request to … found by kvaware router'."
cost = "One controller round-trip per request, plus one per endpoint when the instance map is stale."
result_use = "Chooses the engine URL; loadaware additionally subtracts beta × relative in-flight load."

[[roles]]
id = "external-providers"
kind = "external"
name = "External OpenAI-compatible providers"
symbols = ["vllm_router.services.request_service.request:process_external_provider_request", "vllm_router.external_providers.openai_provider:OpenAIProvider.send_request", "vllm_router.external_providers.registry:ExternalProviderManager.validate_models"]
purpose = "Lets a model name in the request be served by a hosted API instead of a local engine, so one endpoint can mix local vLLM models with external ones."
input = "The client's parsed JSON body; the model alias is replaced by the provider's canonical id."
message = ["POST <api_base><endpoint> with Content-Type: application/json, Authorization: Bearer <provider key>, custom_headers from config", "start-up: GET <api_base>/v1/models to validate configured models"]
config = "--external-providers-config YAML: external_providers[].name, type, api_base, models[].id/aliases, api_key_env_var (default env OPENAI_API_KEY), timeout, max_retries, custom_headers."
output = "Provider status, headers and either a JSON body or a byte stream, returned to the client unchanged."
validation = "connect and sock_read timeouts (no total timeout, so long streams survive); up to max_retries retries on aiohttp.ClientError; final failure becomes 502 to the client."
logging = "INFO 'Routing request … to external provider …', request_errors_total labelled by provider."
cost = "Billed by the provider per token; not measured by the router."
result_use = "Streamed or returned as JSON to the client; /v1/models lists the external ids alongside local ones."

[[roles]]
id = "dynamic-config-watcher"
kind = "background"
name = "Dynamic config watcher"
symbols = ["vllm_router.dynamic_config:DynamicConfigWatcher._watch_worker", "vllm_router.dynamic_config:DynamicConfigWatcher.reconfigure_all"]
purpose = "Lets operators change service discovery, routing logic and callbacks without restarting the router, by editing a mounted YAML or JSON file."
input = "The file at --dynamic-config-yaml or --dynamic-config-json, re-read every 10 seconds."
message = ["DynamicRouterConfig fields: service_discovery, routing_logic, static_*, k8s_*, session_key, priority_*, callbacks"]
config = "--dynamic-config-yaml / --dynamic-config-json (mutually exclusive)."
output = "A new global service discovery, a new routing logic on app.state.router and new callbacks; the current config is shown on GET /health."
validation = "Any parse or reconfigure error is logged as a warning and the old config stays current, so the same change is retried on the next tick."
logging = "INFO 'DynamicConfigWatcher: Config changed, reconfiguring...' / WARNING 'Error loading config file'."
cost = "One file read per 10 s."
result_use = "Requests after the swap use the new router and engine list."

[[roles]]
id = "batch-processor"
kind = "background"
name = "Local batch processor"
symbols = ["vllm_router.services.batch_service.local_processor:LocalBatchProcessor.process_batches", "vllm_router.services.batch_service.local_processor:LocalBatchProcessor.create_batch"]
purpose = "Drains the batch queue created by POST /v1/batches when --enable-batch-api is set."
input = "Rows with status pending in SQLite table batch_queue (<file-storage-path>/batch_queue.db)."
message = ["SELECT the oldest pending batch, mark it running, write a result file through FileStorage, mark it completed or failed"]
config = "--enable-batch-api, --batch-processor local, --file-storage-class local_file, --file-storage-path (default /tmp/vllm_files)."
output = "An output file id stored on the batch row."
validation = "Exceptions mark the batch failed; the loop polls every second when idle."
logging = "INFO 'Processing batch …', ERROR 'Failed processing batch …'."
cost = "not measured"
result_use = "The current loop does not send the batch's requests to any engine; it writes a placeholder text file (see findings)."

[[roles]]
id = "custom-callbacks"
kind = "external"
name = "Custom request callbacks"
symbols = ["vllm_router.services.callbacks_service.callbacks:configure_custom_callbacks", "vllm_router.services.callbacks_service.custom_callbacks:CustomCallbackHandler.pre_request", "vllm_router.services.callbacks_service.custom_callbacks:CustomCallbackHandler.post_request"]
purpose = "An operator-supplied Python object that can answer or reject a request before routing (pre_request) and see the full response afterwards (post_request)."
input = "pre_request gets the Request, raw body and parsed JSON; post_request gets the Request and the collected response bytes."
message = ["pre_request(request, body, json) → Response or None", "post_request(request, response_bytes) as a FastAPI background task"]
config = "--callbacks <module.instance> (importlib), also settable through the dynamic config `callbacks` field."
output = "A non-None Response from pre_request is returned to the client directly, with X-Request-Id added."
validation = "No isolation: an exception in pre_request fails the request."
logging = "Whatever the callback logs."
cost = "not measured"
result_use = "Short-circuits routing or observes completed requests."

[[input_flows]]
id = "in-route-batches"
source = "JSON body of POST /v1/batches (input_file_id, endpoint, completion_window, metadata)"
sink = "A row in the SQLite table batch_queue (batch_queue.db under --file-storage-path)"
  [[input_flows.steps]]
  symbol = "vllm_router.routers.batches_router:route_batches"
  guard = "Requires input_file_id and endpoint (400), and checks the input file exists (404). endpoint, completion_window and metadata are not validated; any other error becomes a 500 with the exception text."
  [[input_flows.steps]]
  symbol = "vllm_router.services.files_service.file_storage:FileStorage.get_file"
  guard = "Joins the id onto the storage directory and checks it exists; the route's path parameter cannot contain '/', so the id stays inside that directory."
  [[input_flows.steps]]
  symbol = "vllm_router.services.batch_service.local_processor:LocalBatchProcessor.create_batch"
  guard = "Inserts with a parameterised SQL statement (no string building); metadata is stored as JSON text."

[[input_flows]]
id = "in-route-files"
source = "Multipart upload to POST /v1/files (form fields 'file' and 'purpose')"
sink = "A file under --file-storage-path (default /tmp/vllm_files/uid_default/<file id>) in the router pod"
  [[input_flows.steps]]
  symbol = "vllm_router.routers.files_router:route_files"
  guard = "Rejects a form without 'file' (400). 'purpose' is free text, not validated. The whole file is read into memory with no size limit. Needs app.state.batch_storage, which only exists when the batch API was initialised; otherwise the attribute error is caught and the client gets 500 'Failed to save file'."
  [[input_flows.steps]]
  symbol = "vllm_router.services.files_service.file_storage:FileStorage.save_file"
  guard = "The client's filename is never used as a path: the stored name is a server-generated 'file-' + 6 hex characters, written with aiofiles. The filename is only echoed back in the metadata."

[[input_flows]]
id = "in-completion-body"
source = "OpenAI-style request body and headers from any client that reaches release-router-service (chat/completions, completions, embeddings, rerank, score, tokenize …)"
sink = "The chosen vLLM engine pod (body forwarded byte for byte); router memory (request stats keyed by X-Request-Id, prefix trie, semantic cache)"
  [[input_flows.steps]]
  symbol = "vllm_router.experimental.semantic_cache_integration:check_semantic_cache"
  guard = "Chat completions only, and only when the SemanticCache gate is on: request.json() is parsed before any validation, so a malformed body there raises instead of getting the 400 below. Client fields skip_cache and cache_similarity_threshold are taken as given."
  [[input_flows.steps]]
  symbol = "vllm_router.services.request_service.request:route_general_request"
  guard = "Body must parse as JSON and be an object (else 400); 'model' must be present (else 400); the model must be served by an awake engine (404 / 503). X-Request-Id is accepted from the client unchanged and becomes the stats key. No body-size limit and no check of the other fields — the engine validates the rest."
  [[input_flows.steps]]
  symbol = "vllm_router.routers.routing_logic:PrefixAwareRouter.route_request"
  guard = "Reads 'messages' (text parts only) or else request_json['prompt'] directly; a body with neither (e.g. embeddings 'input') raises KeyError and the client gets a 500. The prompt text is inserted into the in-memory HashTrie."
  [[input_flows.steps]]
  symbol = "vllm_router.services.request_service.request:process_request"
  guard = "Parses the body again for 'stream' and 'model' (400 if not JSON). Hop-by-hop headers are dropped and X-Request-Id is replaced; Authorization and all other client headers pass through to the engine, which applies its own VLLM_API_KEY check. The body is sent unchanged."

[[layer_rules]]
text = "Routing logic only chooses a URL: it never imports the HTTP routes, the request proxy or the app."
from_layers = ["routing"]
forbid = ["vllm_router.app", "vllm_router.routers.main_router", "vllm_router.routers.files_router", "vllm_router.routers.batches_router", "vllm_router.services.request_service."]

[[layer_rules]]
text = "Service discovery and statistics never import routing logic, the proxy or the app."
from_layers = ["discovery-stats"]
forbid = ["vllm_router.app", "vllm_router.routers.", "vllm_router.services.request_service."]

[[layer_rules]]
text = "Routing, discovery and statistics never depend on experimental features."
from_layers = ["routing", "discovery-stats"]
forbid = ["vllm_router.experimental."]

[[layer_rules]]
text = "No router module imports the example, tutorial or script programs."
from_layers = ["startup", "http", "routing", "proxy", "files-batch", "discovery-stats", "experimental", "shared"]
forbid = ["examples.", "tutorials.", "scripts."]

[[layer_rules]]
text = "Files and batch storage do not reach into the request proxy."
from_layers = ["files-batch"]
forbid = ["vllm_router.services.request_service.", "vllm_router.routers.routing_logic"]

[[decisions]]
decision = "Which engine serves a request"
by = "people (config file)"
how = "--routing-logic (Helm routerSpec.routingLogic) picks one RoutingInterface subclass at start-up: roundrobin, session, prefixaware, kvaware, loadaware, priority, disaggregated_prefill or disaggregated_prefill_orchestrated. The chosen class then decides per request in code."
symbol = "vllm_router.routers.routing_logic:initialize_routing_logic"

[[decisions]]
decision = "Where the engine list comes from"
by = "people (config file)"
how = "--service-discovery static (fixed --static-backends/--static-models), k8s (watch pods by label, or Services with --k8s-service-discovery-type service-name) or external-only (no local engines)."
symbol = "vllm_router.service_discovery:_create_service_discovery"

[[decisions]]
decision = "Whether a discovered pod may receive traffic"
by = "code"
how = "All containers ready, no deletion timestamp, a pod IP, and /v1/models returns at least one model; requests further skip endpoints whose sleep flag is set."
symbol = "vllm_router.service_discovery:K8sPodIPServiceDiscovery._on_engine_update"

[[decisions]]
decision = "Unknown model: 404 or 503"
by = "code"
how = "If no live endpoint serves the model, 404 when discovery has never seen the model, 503 'temporarily unavailable' when it has (scaled to zero or sleeping)."
symbol = "vllm_router.services.request_service.request:route_general_request"

[[decisions]]
decision = "Which load signal routing uses"
by = "code"
how = "Session, kvaware, priority and loadaware use the router's own event-driven request stats (QPS in a sliding window, in-flight prefill + decode counts), not the scrape-lagged engine /metrics."
symbol = "vllm_router.routers.routing_logic:LoadAwareRouter.load_penalty"

[[decisions]]
decision = "Session affinity"
by = "code"
how = "Session id read from the --session-key header, else the same key in the JSON body; a consistent hash ring (uhashring) over engine URLs maps it to an engine, so adding an engine moves few sessions. No session id → lowest QPS."
symbol = "vllm_router.routers.routing_logic:SessionRouter.route_request"

[[decisions]]
decision = "When KV-cache location wins over load balancing"
by = "code"
how = "kvaware routes to the cache holder only if it matched at least prompt_tokens − --kv-aware-threshold tokens; loadaware scores matched/prompt − beta × relative load and takes the best."
symbol = "vllm_router.routers.routing_logic:LoadAwareRouter.select_url"

[[decisions]]
decision = "Request priority"
by = "code"
how = "Priority from the x-request-priority header, else the body field, else --priority-default; below --priority-threshold goes to the least-loaded engine, others round-robin; the resolved value is written back into the body for vLLM's own scheduler."
symbol = "vllm_router.routers.routing_logic:PriorityRouter.route_request"

[[decisions]]
decision = "Whether a failed engine call is retried elsewhere"
by = "people (config file)"
how = "--max-instance-failover-reroute-attempts; only errors raised before the engine's headers arrive are retried, on a re-routed endpoint not yet tried."
symbol = "vllm_router.services.request_service.request:route_general_request"

[[decisions]]
decision = "Whether a model goes to an external provider"
by = "people (config file)"
how = "Model ids and aliases listed in --external-providers-config are looked up before local endpoints; a hit bypasses routing logic entirely."
symbol = "vllm_router.external_providers.registry:ExternalProviderManager.is_external_model"

[[decisions]]
decision = "Changing router behaviour without a restart"
by = "people (config file)"
how = "A watched YAML/JSON file is diffed every 10 s; any change rebuilds service discovery, routing logic and callbacks."
symbol = "vllm_router.dynamic_config:DynamicConfigWatcher._watch_worker"

[[decisions]]
decision = "Answering from the semantic cache"
by = "people (config file)"
how = "--feature-gates SemanticCache=true plus --semantic-cache-model; chat completions whose embedding is within --semantic-cache-threshold of a cached one are answered without an engine."
symbol = "vllm_router.experimental.semantic_cache_integration:check_semantic_cache"

[[decisions]]
decision = "One engine Deployment per model"
by = "people (config file)"
how = "The Helm chart renders a Deployment release-<name>-deployment-vllm and Service release-<name>-engine-service for each entry of servingEngineSpec.modelSpec; the router finds them by servingEngineSpec.labels and reads the served models from each pod."
symbol = "vllm_router.service_discovery:K8sPodIPServiceDiscovery._add_engine"

[[entities]]
id = "endpoint-info"
name = "Engine endpoint (EndpointInfo)"
summary = "One record per engine the router can send to: URL, served model names and adapters, stable Id, model label, sleep flag. Lives only in router memory."
  [[entities.events]]
  stage = "born"
  symbol = "vllm_router.service_discovery:K8sPodIPServiceDiscovery._add_engine"
  by = "K8s watcher thread"
  text = "Created when a pod becomes ready and its /v1/models answers; Id is uuid5 of the pod name, URL is http://<pod-ip>:<port>."
  [[entities.events]]
  stage = "born"
  symbol = "vllm_router.service_discovery:StaticServiceDiscovery.get_endpoint_info"
  by = "static discovery"
  text = "Rebuilt on every call from --static-backends / --static-models, skipping backends the health check marked unhealthy."
  [[entities.events]]
  stage = "update"
  symbol = "vllm_router.service_discovery:K8sPodIPServiceDiscovery._on_engine_update"
  by = "K8s watcher thread"
  text = "A MODIFIED event on a ready pod re-creates the record (re-reading models and sleep state, e.g. after /sleep adds the sleeping label)."
  [[entities.events]]
  stage = "read"
  symbol = "vllm_router.services.request_service.request:route_general_request"
  by = "every API request"
  text = "Filtered to endpoints that serve the requested model and are not sleeping, then handed to the routing logic."
  [[entities.events]]
  stage = "read"
  symbol = "vllm_router.stats.engine_stats:EngineStatsScraper._scrape_metrics"
  by = "stats thread"
  text = "Each endpoint URL is scraped for /metrics."
  [[entities.events]]
  stage = "delete"
  symbol = "vllm_router.service_discovery:K8sPodIPServiceDiscovery._delete_engine"
  by = "K8s watcher thread"
  text = "Removed on DELETED, on loss of readiness or models, or when an evicted pod loses its IP."

[[entities]]
id = "request-stats"
name = "Per-engine request statistics (RequestStats)"
summary = "Router-local counters per engine URL: QPS over --request-stats-window, TTFT, in-flight prefill/decode counts, finished count, latency. The live load signal for routing."
  [[entities.events]]
  stage = "born"
  symbol = "vllm_router.stats.request_stats:RequestStatsMonitor.on_new_request"
  by = "process_request"
  text = "Start time stored under (engine URL, request id); in-prefill count +1; QPS window updated."
  [[entities.events]]
  stage = "update"
  symbol = "vllm_router.stats.request_stats:RequestStatsMonitor.on_request_response"
  by = "process_request (first chunk)"
  text = "Moves the request from prefill to decoding and records TTFT."
  [[entities.events]]
  stage = "update"
  symbol = "vllm_router.stats.request_stats:RequestStatsMonitor.on_request_complete"
  by = "process_request (finally block)"
  text = "Decrements the in-flight count, records latency, forgets the start time; idempotent, also on errors and client disconnects."
  [[entities.events]]
  stage = "read"
  symbol = "vllm_router.stats.request_stats:RequestStatsMonitor.get_request_stats"
  by = "routing logic, /metrics, log_stats"
  text = "Snapshot of RequestStats per engine URL; avg_itl is always -1 and avg_decoding_length stays -1 (never fed)."

[[entities]]
id = "engine-stats"
name = "Per-engine scraped statistics (EngineStats)"
