# Narrative for the code-flow report — the only hand-written input.
#
# Structure (modules, functions, call edges, routes, SQL access, boundaries) comes from code_map.json.
# This file adds the explanation around it. Every `symbol` / `module` / `table` named here is checked
# against the code on every build; a name that no longer exists fails the build and the staleness test.
# Never write line numbers — the builder adds file:line from the code map.
#
# Proposed by `codeflow.py draft`. Replace every "TODO: …" (the report shows how many are left).
# Severities: high | medium | low | info.  Stages: born | transform | update | store | archive | restore | read | delete.
# A finding with a `check` retires itself: once the code no longer shows it, it moves to the page's Fixed list.
# Layer `modules` may use "pkg.*" patterns. With [[layers]] present, every module must match one.
# [module_notes."pkg.mod"]: purpose / does / flow (+ optional note) per module — written from the code, never a copied docstring.


[meta]
title = "open-notebook"
lede = "open-notebook is a self-hosted research notebook: you add sources (files, links, text), it extracts and embeds their text, and you search, ask questions, chat with an LLM over them, write notes and generate podcast episodes. A Next.js frontend calls the FastAPI app in `api/`, whose routers hand work to domain models and LangGraph graphs in `open_notebook/` (all stored in SurrealDB) or queue slow jobs as surreal-commands that a separate worker runs from `commands/`."
audience = "learning the code"

[module_notes.api]
purpose = "Marks `api/` as a package so `api.main:app` and the routers can be imported."
does = "Nothing at runtime; the file is empty."
flow = "Imported by uvicorn (via run_api or a container command) on the way to api.main."

[module_notes."api.auth"]
purpose = "The API's only access control: one shared password for the whole instance."
does = "Reads OPEN_NOTEBOOK_PASSWORD (or its _FILE Docker secret); when it is set, requires `Authorization: Bearer <password>` on every request and compares it in constant time; lets CORS preflight and the excluded paths through."
flow = "api.main adds PasswordAuthMiddleware with its own exclusion list (`/`, `/health`, docs, `/api/auth/status`, `/api/config`) → every other request is checked here before any router runs; a miss returns 401 with `WWW-Authenticate: Bearer`."
note = "With no password configured, authentication is off entirely and every route — including credential management and the generic command endpoint — is open to anyone who can reach the port. There are no users or roles: whoever has the password can do everything."

[module_notes."api.command_service"]
purpose = "A thin wrapper over surreal-commands so routers can queue a background job and read its status without importing the library directly."
does = "Submits a named command with its arguments and returns the job id as a string; reads a job's status, result, error and timestamps; offers list and cancel calls that are still stubs."
flow = "api.routers.sources (process_source, on create and retry), api.routers.embedding (embed_source / embed_note), api.routers.embedding_rebuild (rebuild_embeddings) and api.routers.commands → submit_command_job → surreal_commands.submit_command writes a `command` row in SurrealDB → the worker process picks it up and runs the matching function in commands.*."
note = "list_command_jobs always returns an empty list and cancel_command_job only logs and returns True — nothing is cancelled. submit_command_job imports commands.podcast_commands before every submit because surreal-commands validates the name against the local registry."

[module_notes."api.credentials_service"]
purpose = "Holds the provider-credential logic the credentials router needs, so the router stays a thin HTTP layer over it."
does = "Refuses to store keys until OPEN_NOTEBOOK_ENCRYPTION_KEY is set; reports per-provider status from the database and from environment variables; tests a credential and discovers a provider's models with the credential's own key and URL (HTTP calls via httpx, static lists for Voyage, ElevenLabs and Deepgram); registers chosen models as `model` rows linked to the credential; migrates keys from env vars or the old ProviderConfig record, and re-encrypts stored keys into the versioned PBKDF2 format."
flow = "Configure-models journey: api.routers.credentials (create, test, discover, register-models, migrate-*) and api.routers.providers → this module → open_notebook.domain.credential.Credential (encrypts api_key on save) and open_notebook.ai.connection_tester / model_discovery → writes `credential` and `model` tables."
note = "register_models treats a model as already present when any credential of the same provider has a model with that name and type, so the new credential is not linked to it (see finding register-models-not-linked)."

[module_notes."api.main"]
purpose = "Builds the single FastAPI app object: every HTTP request to the backend passes through the middleware stack and error mapping defined here."
does = "On startup, waits for SurrealDB with a bounded backoff and runs pending schema migrations, refusing to start if they fail; wraps the app in CORS, max-body-size and password middleware; maps the domain exceptions (NotFoundError, InvalidInputError, RateLimitError, ConfigurationError, …) to 404/400/429/422/502/415/500 JSON with CORS headers; mounts all 22 routers under `/api` and serves `/` and `/health`."
flow = "uvicorn → lifespan → _run_database_migrations (open_notebook.database.async_migrate.AsyncMigrationManager: ping, needs_migration, run_migration_up) → requests go CORSMiddleware → MaxBodySizeMiddleware → PasswordAuthMiddleware → a router in api.routers.* → an exception raised anywhere below lands in the handlers here."
note = "Middleware order is deliberate: CORS is added last so it runs first and can add headers to a 413; credentials are only allowed when CORS_ORIGINS names real origins, never with `*`. CORS_ORIGINS and OPEN_NOTEBOOK_MAX_UPLOAD_SIZE_MB are read once at import, so changing them needs a restart."

[module_notes."api.middleware"]
purpose = "Stops an oversized upload before FastAPI buffers it, since the shipped docker-compose exposes the API without a proxy that would enforce a limit."
does = "Reads the limit from OPEN_NOTEBOOK_MAX_UPLOAD_SIZE_MB (default 100 MB, falling back on bad values); rejects early on Content-Length; also counts bytes as the body streams in, for chunked or lying clients; answers 413 as JSON."
flow = "api.main → MaxBodySizeMiddleware wraps PasswordAuthMiddleware, so a too-large request (typically POST /api/sources with a file) is refused before credentials are checked or the form is parsed."

[module_notes."api.models"]
purpose = "One place for the request and response shapes of most routers, so the frontend contract is visible in a single file."
does = "Pydantic models for notebooks, search/ask, models, transformations, notes, embedding and rebuild, settings, sources, insights, credentials, providers and capabilities; a few carry rules: NotebookScopeMixin merges `notebook_id` and `notebook_ids` into one scope list, SourceCreate turns a legacy single `notebook_id` into `notebooks` and refuses both at once, SetApiKeyRequest rejects empty keys."
flow = "Imported by api.routers.* (sources, notebooks, credentials, models, transformations, notes, search, …) as FastAPI body and response_model types; nothing here touches the database."
note = "Not every shape lives here: chat, source_chat, commands, podcasts, episode/speaker profiles and languages define their own request/response classes inside the router."

[module_notes."api.podcast_service"]
purpose = "Separates podcast job submission and episode lookup from the HTTP layer of the podcasts router."
does = "Checks the episode profile by name and resolves the speaker profile name to its record id; turns a notebook into one text with Notebook.get_context when no content is given; queues `generate_podcast` with surreal-commands and returns the job id; reads job status and lists or fetches `episode` rows."
flow = "Generate-podcast journey: api.routers.podcasts:generate_podcast (and retry_podcast_episode) → PodcastService.submit_generation_job → EpisodeProfile.get_by_name, SpeakerProfile.resolve, Notebook.get_context → submit_command(\"open_notebook\", \"generate_podcast\") → commands.podcast_commands writes the `episode` row later."
note = "Every failure inside submit_generation_job, including an unknown profile, becomes a 500. If loading the notebook fails, the job is still queued with the text `Notebook ID: <id>` as its content. DefaultProfiles has no caller; the default profiles come from migrations."

[module_notes."api.routers"]
purpose = "Marks `api/routers/` as a package; api.main imports each router module from it."
does = "Nothing at runtime; the file is empty."
flow = "api.main → `from api.routers import auth, chat, sources, …` → app.include_router for each."

[module_notes."api.routers._chat_shared"]
purpose = "Keeps notebook chat and source chat from each carrying their own copy of the same lookups and message conversion."
does = "Adds the table prefix to bare ids (`abc` → `chat_session:abc`); fetches a source or session and 404s if it is missing; checks that a session `refers_to` the given source; converts LangGraph/LangChain messages into ChatMessage response objects."
flow = "Chat-session journey: api.routers.chat (execute_chat, get_session, …) and api.routers.source_chat (send_message_to_source_chat, …) → get_session_or_404 / get_verified_source_session → ChatSession.get, Source.get and a `refers_to` query; after a turn, extract_chat_messages shapes the checkpoint's messages for the response."

[module_notes."api.routers.auth"]
purpose = "Tells the frontend, before it has a password, whether it needs to show a login screen."
does = "Returns whether OPEN_NOTEBOOK_PASSWORD (or its _FILE secret) is set."
flow = "Frontend on load → GET /api/auth/status (excluded from PasswordAuthMiddleware) → reads the env var; no database."

[module_notes."api.routers.capabilities"]
purpose = "Lets the frontend hide extraction engines (Docling, Crawl4AI) and the OCR toggle when their optional runtimes are not installed in this container."
does = "Reports whether Docling is importable, whether Crawl4AI is ready locally, and whether a remote Crawl4AI is configured."
flow = "Settings and add-source screens → GET /api/capabilities → open_notebook.utils.runtime_capabilities probes (the same probes the source graph uses before choosing an engine); no database."

[module_notes."api.routers.chat"]
purpose = "The HTTP side of notebook chat: sessions, context preview and sending a message."
does = "Creates, lists, renames and deletes `chat_session` records linked to a notebook; builds the context the user selected (sources at insight or full-text level, notes) and reports its token count; runs one chat turn with the client-supplied context and returns the whole message history."
flow = "Chat-session journey: POST /api/chat/sessions → ChatSession.save + relate_to_notebook (`refers_to`); POST /api/chat/context → open_notebook.utils.context_builder.build_notebook_context; POST /api/chat/execute → _chat_shared.get_session_or_404 → chat_graph.get_state → open_notebook.utils.graph_utils.invoke_chat_turn (graphs.chat, run in a thread) → the turn is stored in the LangGraph SQLite checkpoint, not in SurrealDB → session.save to bump its timestamp."
note = "The context comes from the request body as-is; execute_chat does not rebuild or check it against the notebook. A per-request model_override wins over the session's."

[module_notes."api.routers.commands"]
purpose = "A generic window onto the background job queue, used to poll job status from the frontend."
does = "Submits any registered command by app and name with arbitrary input; returns a job's status, result and error; lists and cancels jobs (both stubs in CommandService); dumps the command registry for debugging."
flow = "Frontend polling → GET /api/commands/jobs/{id} → CommandService.get_command_status → surreal_commands; POST /api/commands/jobs → CommandService.submit_command_job → a `command` row the worker in commands.* runs."
note = "POST /api/commands/jobs skips all the checks the purpose-built routers do (notebook exists, URL is safe, file is in the uploads folder); it is protected only by the shared password, and by nothing when no password is set."

[module_notes."api.routers.config"]
purpose = "Gives the frontend what it needs at startup: the running version, whether a newer one exists, and whether the database is up."
does = "Reads the version from pyproject.toml; checks GitHub for the latest version and caches the answer (failures too) for a TTL; probes SurrealDB with `RETURN 1` under a 2-second timeout."
flow = "Frontend on load → GET /api/config (excluded from PasswordAuthMiddleware) → open_notebook.utils.version_utils (GitHub over HTTP) and repo_query → JSON with version, latestVersion, hasUpdate, dbStatus."

[module_notes."api.routers.credentials"]
purpose = "The admin screen's API for provider credentials: where API keys enter the system and how models get attached to them."
does = "Creates, reads, updates, tests and deletes credentials, validating every URL field against SSRF and never returning the key; discovers a provider's models with the credential's key and registers the chosen ones; deletes with either migration of linked models to another credential or cascade delete, and still deletes a credential it cannot decrypt; runs the env-var, ProviderConfig and encryption-format migrations."
flow = "Configure-models journey: POST /api/credentials → api.credentials_service.require_encryption_key → open_notebook.utils.url_validation.validate_url → Credential.save (`credential`, api_key encrypted); POST …/discover → credentials_service.discover_with_config; POST …/register-models → credentials_service.register_models (`model` rows with `credential` set)."
note = "Deleting a credential without migrate_to also deletes every `model` linked to it, and default model slots that pointed at those models are left dangling (finding model-delete-dangling-defaults)."

[module_notes."api.routers.embedding"]
purpose = "Lets the user (re)embed one source or note on demand, so it shows up in vector search."
does = "Refuses when no default embedding model is set; accepts only `source` or `note`; either queues embed_source / embed_note directly, or goes through the domain model (Source.vectorize, or Note.save which queues the note's embedding itself)."
flow = "Source or note screen → POST /api/embed → model_manager.get_embedding_model → CommandService.submit_command_job or Source.vectorize / Note.save → commands.embedding_commands writes `source_embedding` chunks or the note's `embedding` field later."
note = "Both branches only queue work; the response's command_id is the job to poll, not a finished embedding."

[module_notes."api.routers.embedding_rebuild"]
purpose = "Re-embeds the whole knowledge base after the embedding model changes, since vectors from two models cannot be compared."
does = "Counts how many sources, notes and insights a rebuild will touch (only already-embedded items, or everything with text); queues one `rebuild_embeddings` job; reports its status, progress and per-type counts from the job's result."
flow = "Settings → POST /api/embeddings/rebuild → repo_query counts on `source`, `source_embedding`, `note`, `source_insight` → CommandService.submit_command_job(\"rebuild_embeddings\") → commands.embedding_commands fans out per-item embed jobs; GET …/{command_id}/status → surreal_commands.get_command_status."
note = "Progress is `jobs_submitted / total_items`: 100% means every per-item job was queued, not that the embeddings exist."

[module_notes."api.routers.episode_profiles"]
purpose = "Manages episode profiles — the reusable recipe for a podcast (outline and transcript models, segment count, briefing, which speaker profile)."
does = "Lists, fetches by name, creates, updates, deletes and duplicates `episode_profile` rows; accepts the speaker profile as a record id or, for old clients, a name, and stores the id; shows the speaker name in responses."
flow = "Podcast settings screen → /api/episode-profiles → open_notebook.podcasts.models.EpisodeProfile / SpeakerProfile → `episode_profile` table; generate-podcast later reads the profile by name in api.podcast_service."

[module_notes."api.routers.insights"]
purpose = "Acts on one `source_insight` (an LLM summary of a source made by a transformation) after it exists."
does = "Returns an insight; deletes it; copies it into a new note, optionally added to a notebook."
flow = "Source panel → /api/insights/{id} → SourceInsight.get / delete / save_as_note (open_notebook.domain.notebook) → writes `note` and its `artifact` link to the notebook; new insights themselves are created by api.routers.sources:create_source_insight."

[module_notes."api.routers.languages"]
purpose = "Gives the podcast and settings screens a language picker without a hard-coded list in the frontend."
does = "Builds a list of BCP 47 locale codes with display names from pycountry and Babel's CLDR data, plus extra regional variants where accent or spelling matters (pt-PT, en-GB, zh-TW, …)."
flow = "Frontend → GET /api/languages → computed in memory; no database."

[module_notes."api.routers.models"]
purpose = "Manages the `model` registry and the default model slots that every graph falls back to when the user does not pick a model."
does = "Lists, creates, deletes and test-calls models; reads and sets the defaults (chat, transformation, embedding, TTS, STT, …) and auto-assigns empty chat and embedding slots by provider priority; reports which providers are usable; discovers or syncs a provider's models after loading DB-stored keys; counts and lists models per provider."
flow = "Configure-models journey: POST /api/models/sync/{provider} → open_notebook.ai.key_provider.provision_provider_keys → open_notebook.ai.model_discovery.sync_provider_models (`model` rows); PUT /api/models/defaults → DefaultModels.update; later open_notebook.ai.provision.provision_langchain_model reads these rows and defaults."
note = "provision_provider_keys copies DB-stored keys into process environment variables before discovery. POST /api/models/sync (all providers) does not do that step (finding sync-all-skips-db-credentials)."

[module_notes."api.routers.notebooks"]
purpose = "The notebook list and notebook page: create, open, rename, archive, link sources and delete."
does = "Lists notebooks with source and note counts, filtered and ordered; stamps `last_viewed_at` when one is opened and serves a recently-viewed list of notebooks and sources; links or unlinks an existing source (`reference` edge); previews and performs a delete that removes notes and chat sessions and, optionally, sources no other notebook uses."
flow = "Frontend → /api/notebooks… → Notebook.save / Notebook.get / repo_query (`notebook`, `reference`, `source`) → DELETE goes to open_notebook.domain.notebook:Notebook.delete, which deletes notes, `artifact` edges and optionally exclusive sources one query at a time."
note = "The delete is hard and not transactional (finding notebook-delete-not-atomic), and add_source_to_notebook's duplicate check is reversed so repeated calls add more edges (finding link-source-idempotency-reversed)."

[module_notes."api.routers.notes"]
purpose = "CRUD for notes — the user's own writing and saved AI answers, which are searchable like sources."
does = "Lists notes (optionally per notebook); creates a note, asking the prompt graph for a title when an AI note arrives without one; updates and deletes notes; validates note_type as `human` or `ai`."
flow = "Notebook page → /api/notes → Note.save (writes `note` and queues an embed_note job, whose id comes back as command_id) → Note.add_to_notebook (`artifact` edge)."
note = "create_note saves the note before checking that the notebook exists, so a bad notebook_id returns 404 but leaves an unlinked note behind (finding note-saved-before-notebook-check)."

[module_notes."api.routers.podcasts"]
purpose = "The HTTP side of podcast episodes: start generation, poll it, play, retry and delete."
does = "Queues generation through PodcastService and returns a job id; reports job status; lists episodes with the model names from each episode's profile snapshot resolved in one batch; streams the MP3 only when its path resolves inside the podcasts folder; retries a failed episode by deleting it and queueing a new job; deletes an episode and its audio file."
flow = "Generate-podcast journey: POST /api/podcasts/generate → api.podcast_service.PodcastService.submit_generation_job → `generate_podcast` command → commands.podcast_commands fills an `episode` row; GET …/audio → open_notebook.podcasts.audio_paths.resolve_contained_audio_path → FileResponse."
note = "Retry deletes the failed episode before it knows the new job can be queued (finding retry-episode-deletes-first)."

[module_notes."api.routers.providers"]
purpose = "Gives clients the list of supported AI providers from one registry instead of each keeping its own copy."
does = "Returns every provider in open_notebook.ai.provider_registry.PROVIDERS with display name, modalities, docs link and whether its env vars are set."
flow = "Credentials screen → GET /api/providers → PROVIDERS + api.credentials_service.check_env_configured; no database."

[module_notes."api.routers.search"]
purpose = "The search box and the \"ask\" feature: find matching material, or get an answer written from it."
does = "Runs a full-text (BM25) or vector search, optionally limited to chosen notebooks; for ask, checks the three chosen models and the embedding model, then streams the ask graph's stages (strategy, per-search answers, final answer) as Server-Sent Events, or returns only the final answer from /ask/simple."
flow = "Search journey: POST /api/search → resolve_notebook_scope → text_search or vector_search (one SurrealQL function over `source_embedding`, `source_insight`, `note`). Ask journey: POST /api/search/ask → stream_ask_response → open_notebook.graphs.ask (models from ModelManager, vector_search per sub-query) → nothing is saved."

[module_notes."api.routers.settings"]
purpose = "Reads and changes the instance-wide content-processing settings."
does = "Returns and partially updates the ContentSettings singleton: document and URL extraction engines, when to embed new sources (ask / always / never), whether to delete uploaded files after processing, Docling OCR/formula/vision flags, and preferred YouTube transcript languages."
flow = "Settings screen → GET/PUT /api/settings → open_notebook.domain.content_settings.ContentSettings.get_instance / update → its singleton record; the source graph reads the same record when processing a source."

[module_notes."api.routers.source_chat"]
purpose = "Chat about a single source, where the server, not the client, decides what context the model sees."
does = "Creates, lists, renames and deletes chat sessions linked to a source, each with an optional model override; sends a message and streams back the user message, the AI reply, the context indicators (which insights and content were used) and a completion event as SSE."
flow = "Chat-session journey (source variant): POST /api/sources/{id}/chat/sessions/{sid}/messages → _chat_shared.get_verified_source_session → stream_source_chat_response → graph_utils.invoke_chat_turn on open_notebook.graphs.source_chat (builds context with build_source_context, run in a thread) → history saved in the LangGraph SQLite checkpoint."
note = "The \"stream\" is event-level, not token-level: the reply arrives as one ai_message event after the whole LLM call finishes. Errors after streaming starts are sent as an `error` event with a 200 status."

[module_notes."api.routers.sources"]
purpose = "Where content enters the system: uploading files, adding links and text, and managing each source afterwards."
does = "Saves an upload under a unique name, guards links against SSRF and file paths against escaping the uploads folder, and rejects file types content-core cannot extract; creates the `source` placeholder linked to its notebooks and queues `process_source` (or runs it inline with a 5-minute timeout when async_processing is false); pages and sorts the source list, reports processing status, serves the original file; retries a failed source, deletes a source with its file, and queues `run_transformation` to add an insight."
flow = "Add-source journey: POST /api/sources → parse_source_form_data → save_uploaded_file → _build_content_state → _create_source_async_path (Source.save, Source.add_to_notebook → `source`, `reference`) → CommandService.submit_command_job(\"process_source\") → commands.source_commands → open_notebook.graphs.source writes full_text, `source_embedding` and `source_insight`."
note = "Every failure path removes the uploaded file and, on the async path, the placeholder source. In retry_source_processing the \"already processing\" 400 is raised inside a try that catches Exception, so it is logged and the retry goes ahead anyway (finding source-retry-guard-swallowed)."

[module_notes."api.routers.speaker_profiles"]
purpose = "Manages speaker profiles — the voices and personalities a podcast is read with."
does = "Lists, fetches by name, creates, updates, deletes and duplicates `speaker_profile` rows (TTS model plus one to four speakers with voice id, backstory and personality)."
flow = "Podcast settings screen → /api/speaker-profiles → open_notebook.podcasts.models.SpeakerProfile → `speaker_profile` table; episode profiles point at these by record id, and generation resolves them in api.podcast_service."
note = "Delete does not check whether an episode profile still points at the speaker profile."

[module_notes."api.routers.transformations"]
purpose = "Manages transformations — saved prompts that turn a source's text into an insight — and lets the user try one on any text."
does = "Lists, creates, updates and deletes `transformation` rows; runs a transformation on posted text through the transformation graph, with an optional model override checked to exist; reads and saves the instance-wide default transformation instructions."
flow = "Transformations screen → /api/transformations → Transformation.save / get (`transformation`); POST /api/transformations/execute → open_notebook.graphs.transformation (model from ModelManager) → output returned, nothing saved; insights from transformations are written later by the source graph or create_source_insight."
note = "The default instructions saved through PUT /api/transformations/default-prompt are never applied by the graph (finding default-transformation-prompt-ignored)."

[module_notes.commands]
purpose = "The import target of the background worker: `surreal-commands-worker --import-modules commands` loads this package, and importing it is what registers every command name the API submits."
does = "Puts the internal SurrealDB hosts into no_proxy before anything connects; imports the three command modules so their @command decorators register embed_note, embed_insight, embed_source, create_insight, rebuild_embeddings, process_source, run_transformation and generate_podcast with the app name open_notebook."
flow = "supervisord / `make worker` starts the worker (OPEN_NOTEBOOK_WORKER_MAX_TASKS concurrent tasks, default 5) → imports commands → open_notebook.utils.proxy:ensure_internal_no_proxy → commands.embedding_commands, commands.podcast_commands, commands.source_commands register with surreal_commands; the worker then polls SurrealDB for jobs submitted by api.command_service, api.podcast_service and the domain models."
note = "run_transformation_command and create_insight_command are not in __all__, but they still register because their modules are imported here; a command that lives in a module not imported by this package would be submitted by the API and never picked up."

[module_notes."commands.embedding_commands"]
purpose = "Holds every write of a vector: all embedding happens here in the worker, so saving a note, adding a source or rebuilding the index never waits on the embedding provider."
does = "Embeds one note or one insight as a single vector (long text chunked and mean-pooled) and writes it onto the record; replaces a source's chunk vectors in source_embedding (delete, chunk by content type, embed in batches, bulk insert, clean up on a partial insert); creates a source_insight and queues its embedding; rebuild_embeddings collects ids by mode ('existing' or 'all') and submits one embed_* job per item."
flow = "Note.save → submit_command('embed_note'); Source.vectorize (add-source journey, after save_source) → 'embed_source'; Source.add_insight / transformation graph → 'create_insight' → 'embed_insight'; POST /api/embeddings/rebuild → 'rebuild_embeddings'. Each goes through open_notebook.utils.chunking and open_notebook.utils.embedding (→ ModelManager.get_embedding_model) and writes with repo_query/repo_insert to note.embedding, source_insight.embedding or source_embedding (source, order, content, embedding)."
note = "The shared retry config lists ValueError in stop_on, but _embed_record and create_insight_command catch ValueError and return success=False, so a missing record, empty text or no configured embedding model ends as a `completed` job. Retries stack: generate_embeddings tries each batch 3 times, and the command layer retries the whole job up to 5 times."

[module_notes."commands.podcast_commands"]
purpose = "Runs podcast generation in the worker: an episode takes minutes of LLM and TTS calls through the podcast_creator library, far too long for an HTTP request."
does = "Resolves the episode profile and speaker profile and checks they name an outline model, transcript model and voice model; turns every stored profile into the dict shape podcast_creator validates, injecting provider/model/config resolved from the model registry and dropping profiles that no longer resolve; creates the episode record, calls create_podcast into a UUID-named directory under PODCASTS_FOLDER, then stores the relative audio path, transcript and outline."
flow = "Journey generate-podcast: api.routers.podcasts:generate_podcast → PodcastService.submit_generation_job → submit_command('generate_podcast') → worker → generate_podcast_command → EpisodeProfile.get_by_name, SpeakerProfile.resolve, _resolve_model_config (reads episode_profile, speaker_profile, model, credential) → PodcastEpisode.save (insert episode, linked to the command) → podcast_creator.configure + create_podcast (files under data/podcasts/episodes/<uuid>) → to_relative_audio_path → episode.save (audio_file, transcript, outline)."
note = "retry max_attempts is 1: a failure is never retried automatically. If podcast_creator reports an audio-combination error in-band (a path string starting with 'ERROR:'), the transcript and outline are saved first and the job then fails with that error."

[module_notes."commands.source_commands"]
purpose = "Moves source extraction and transformations off the HTTP request, so adding a URL or a large file returns at once and the worker does the slow content-core and LLM work with retries."
does = "process_source: loads the requested Transformation records, stamps the source with its command id, and runs open_notebook.graphs.source:source_graph (extract → save → transform → optionally vectorize). run_transformation: runs open_notebook.graphs.transformation on one existing source for a single UI-triggered insight. Both split errors into permanent (ValueError, ConfigurationError, ContextLengthExceededError, IncompleteGenerationError — no retry) and transient (anything else — exponential-jitter retry)."
flow = "Journey add-source: api.routers.sources:create_source → CommandService.submit_command_job('process_source') (or execute_command_sync for the synchronous path, 5-minute timeout) → worker → process_source_command → Transformation.get / Source.get, source.save (writes source.command) → source_graph.ainvoke (writes source, source_insight via create_insight, source_embedding via embed_source). POST /api/sources/{id}/insights → submit_command('run_transformation') → run_transformation_command → transformation graph → create_insight."
note = "process_source allows 15 attempts with waits up to 120 s, a workaround for SurrealDB v2 transaction conflicts on deep queues. The two commands treat a ValueError differently: process_source re-raises it so the job ends `failed` and the UI can offer a retry, while run_transformation returns success=False, which surreal-commands records as `completed`."

[module_notes.open_notebook]
purpose = "The package root for the domain, AI, graph, database and utility code shared by the API process and the worker; the empty __init__ only marks the package."
does = "Nothing at import time; every subpackage is imported directly (open_notebook.domain, open_notebook.graphs, open_notebook.database, open_notebook.utils, …)."
flow = "Imported by api.* and commands.*; nothing runs from here."

[module_notes."open_notebook.ai"]
purpose = "Package marker for the AI plumbing; importing it runs nothing."
does = "Groups the modules that turn a stored model choice into a callable model: the model records and manager, credential-to-environment provisioning, provider discovery and connection tests, and the provider registry."
flow = "Never imported as a package on its own; callers import open_notebook.ai.models, .provision, .key_provider, .model_discovery, .connection_tester or .provider_registry directly."

[module_notes."open_notebook.ai.connection_tester"]
purpose = "Answers \"does this credential / this model actually work?\" with a real call, and turns provider errors into messages a user can act on."
does = "Tests URL-based endpoints directly with httpx: Ollama, Azure, OpenAI-compatible and Anthropic-compatible servers, each through the SSRF-pinned target from url_validation. Runs one real request per registered model type (a chat \"Hi!\", a one-line embedding, a short TTS clip, or transcribing a bundled or generated WAV). Classifies errors: 401/403/network are failures; a rate limit or a missing test model still proves the credentials work at provider level. Hides Vertex service-account file errors behind one generic message so the test cannot probe the server's filesystem."
flow = "Called by api.credentials_service (POST /api/credentials/{id}/test, using TEST_MODELS from the registry and classify_provider_test_error) and api.routers.models (POST /api/models/{id}/test → test_individual_model → ai.models.ModelManager.get_model). Also supplies normalize_anthropic_compatible_base_url to ai.models, model_discovery and credentials_service. Writes nothing."
note = "For a single model a 'model not found' is a failure, but for the provider test it counts as success; the two classifiers differ on purpose."

[module_notes."open_notebook.ai.key_provider"]
purpose = "Keeps models that have no linked credential working by copying a provider's stored credential into the environment variables esperanto reads."
does = "Looks up the oldest `credential` row for a provider and writes its API key and base URL into os.environ (OPENAI_API_KEY, OLLAMA_API_BASE and so on). Handles the multi-field providers separately: Vertex (project, location, service-account path), Azure (endpoints per modality, API version), and the OpenAI- and Anthropic-compatible base URL + key pairs. Returns a single key by database-first, then environment lookup (get_api_key)."
flow = "Called by ai.models.ModelManager.get_model for credential-less models, podcasts.models._resolve_model_config, and api.routers.models before a single-provider sync → Credential.get_by_provider (reads `credential`, decrypts the key) → sets os.environ in the current process. No database writes."
note = "Values are written into the process environment and never removed, so a deleted credential keeps working in that process until restart. PROVIDER_CONFIG here is a second hand-kept provider → env-var table beside provider_registry, which says it is the single source of truth. get_api_key and provision_all_keys have no callers outside this module."

[module_notes."open_notebook.ai.model_discovery"]
purpose = "Lets the UI offer a provider's model list instead of making users type model names."
does = "Asks each provider which models it has: one table-driven function for OpenAI-style GET /models endpoints, bespoke ones for Anthropic, Google, Ollama, oMLX, OpenRouter and the compatible endpoints, and static lists for Voyage, ElevenLabs, Deepgram and Cohere. Classifies each model id into language / embedding / speech_to_text / text_to_speech by name patterns per provider. Registers the ones not yet in `model` (sync_provider_models) and counts registered models per type."
flow = "Called by api.routers.models (POST /api/models/sync/{provider}, POST /api/models/sync, GET /api/models/count/{provider}) and api.credentials_service (credential discovery reuses classify_model_type and the fetchers) → reads the API key from os.environ (after key_provider has filled it) → httpx GET to the provider → inserts `model` rows via Model.save. Azure and Vertex return nothing here; they are discovered through POST /api/credentials/{id}/discover."
note = "Models registered by sync_provider_models have no credential link, so at call time they fall back to environment variables. sync_all_providers never provisions DB credentials first (finding sync-all-skips-db-credentials). Discovery errors are logged as warnings and return an empty list, which the UI cannot tell apart from \"no models\"."

[module_notes."open_notebook.ai.models"]
purpose = "Every LLM, embedding, speech-to-text and text-to-speech call starts here: it turns a `model` row id (or a default slot) into a live esperanto model object configured with the right credential."
does = "Maps the `model` table (Model) and the `open_notebook:default_models` record (DefaultModels, re-read from the database on every call). Picks the default model for a slot (chat, transformation, tools, large_context, embedding, speech) with chat as the fallback for transformation, tools and large_context. Builds the esperanto config from the linked Credential, or falls back to environment variables via key_provider. Re-validates every URL in that config right before the call (DNS-rebinding guard) and normalises anthropic_compatible endpoints."
flow = "Called by open_notebook.ai.provision (every graph), open_notebook.utils.embedding (search and indexing), open_notebook.graphs.source (speech-to-text choice), connection_tester and api.routers.models / search / podcasts → ModelManager.get_model reads `model`, then `credential` via Model.get_credential_obj → Credential.to_esperanto_config or key_provider.provision_provider_keys → esperanto AIFactory.create_language / create_embedding / create_speech_to_text / create_text_to_speech. Writes nothing; DefaultModels is updated by api.routers.models through RecordModel.update."
note = "get_default_model catches a missing or broken model and returns None, so provision_langchain_model then reports \"No model configured\" even when a model is configured but was deleted (see finding model-delete-dangling-defaults). A model with no credential uses process-wide environment variables, not a per-call key."

[module_notes."open_notebook.ai.provider_registry"]
purpose = "One frozen table of provider facts so adding a provider means editing one list rather than six."
does = "Declares each provider's name, display name, default modalities, required environment variables, cheapest test model, docs link and OpenAI-style discovery URL (ProviderSpec). Fails at import time on a duplicate provider name. Fixes the display order the frontend shows."
flow = "Read at import by api.credentials_service (PROVIDER_ENV_CONFIG, PROVIDER_MODALITIES), connection_tester (TEST_MODELS), model_discovery (OPENAI_COMPAT_PROVIDERS) and api.routers.providers (GET /api/providers). Pure data: imports nothing from the project and touches no table."
note = "Two lists still sit outside it: the SupportedProvider Literal in api.models (guarded by tests/test_credential_provider_validation.py) and key_provider.PROVIDER_CONFIG (not guarded)."

[module_notes."open_notebook.ai.provision"]
purpose = "The one place the LangGraph graphs get a LangChain chat model, so model selection rules live in a single function."
does = "Counts the prompt's tokens and switches to the large_context default above 105,000 tokens, even if a model was chosen explicitly. Otherwise uses the explicit model id, or the default for the requested slot. Refuses with ConfigurationError when nothing is configured or the model is not a language model, then wraps the esperanto model with to_langchain()."
flow = "Called from every LLM node: graphs.chat and graphs.source_chat (slot chat), graphs.ask three times (slot tools, with strategy_model / answer_model / final_answer_model), graphs.transformation and graphs.prompt (slot transformation) → open_notebook.utils.token_count → ai.models.model_manager.get_default_model or get_model → returns a BaseChatModel to the node, which invokes it."
note = "The large-context switch runs before the explicit-model check, so a user's chosen model is silently replaced on long prompts (finding large-context-overrides-chosen-model). Podcasts and embeddings do not come through here."

[module_notes."open_notebook.config"]
purpose = "Fixes the on-disk layout under ./data in one place, so the API (uploads), the chat graphs (checkpoints) and the podcast command (episodes) agree on paths."
does = "Defines DATA_FOLDER, UPLOADS_FOLDER, PODCASTS_FOLDER, LANGGRAPH_CHECKPOINT_FILE and TIKTOKEN_CACHE_DIR (overridable with the TIKTOKEN_CACHE_DIR env var), and creates those folders as a side effect of import."
flow = "Imported by api.routers.sources (UPLOADS_FOLDER for uploads and path checks), open_notebook.graphs.chat and open_notebook.graphs.source_chat (SQLite checkpointer file), commands.podcast_commands and open_notebook.podcasts.audio_paths (PODCASTS_FOLDER), open_notebook.utils.token_utils (tiktoken cache)."
note = "Paths are relative to the process working directory: start the API or worker from another directory and they write to a different ./data."

[module_notes."open_notebook.database.async_migrate"]
purpose = "Brings a fresh or older SurrealDB schema up to the version the code expects, every time the API starts."
does = "Loads the numbered .surrealql files (1–25 up, with matching _down files) from open_notebook/database/migrations; reads the current version as the highest row in _sbl_migrations (0 when the table is missing); runs each pending file in order and records the new version; can step one up or one down; offers a ping that checks the database answers before migrating."
flow = "api.main lifespan → _wait_for_database (AsyncMigrationManager.ping, retried until SurrealDB is reachable) → _run_database_migrations → run_migration_up → AsyncMigrationRunner.run_all → AsyncMigration.run (one connection.query per file) → bump_version (CREATE _sbl_migrations:<n>)."
note = "Migration files are opened by relative path, so the process must start from the repository root. from_file drops every line beginning with '--' and joins the rest with spaces before sending it."

[module_notes."open_notebook.database.migrate"]
purpose = "A synchronous wrapper over AsyncMigrationManager kept for older callers that cannot await."
does = "Exposes get_current_version, needs_migration and run_migration_up, each run through asyncio.run."
flow = "No caller in api/, open_notebook/ or commands/ — startup uses open_notebook.database.async_migrate directly from api.main."
note = "asyncio.run fails inside a running event loop, so this cannot be used from FastAPI handlers or worker commands."

[module_notes."open_notebook.database.repository"]
purpose = "The single gateway to SurrealDB: every table read and write in the domain models, routers and commands passes through these helpers."
does = "Opens a connection per call from SURREAL_URL (or legacy SURREAL_ADDRESS/SURREAL_PORT), SURREAL_USER, SURREAL_PASSWORD, SURREAL_NAMESPACE and SURREAL_DATABASE; runs raw SurrealQL (repo_query) and create / upsert / update / delete / relate / batched insert helpers that stamp created/updated; converts RecordID values to strings on the way out and back with ensure_record_id; refuses table and relation names that are not plain identifiers, since those are interpolated into the query text."
flow = "Called by open_notebook.domain.base:ObjectModel (save, get, delete), open_notebook.domain.notebook (relations, vector_search/text_search, context queries), api.routers.* for list queries, commands.embedding_commands (source_embedding, note/insight embedding updates) and open_notebook.database.async_migrate; writes to whatever table the caller names (notebook, source, note, source_insight, source_embedding, episode, credential, model, …)."
note = "There is no pool and no transaction spanning calls: each helper signs in on a fresh websocket and closes it. repo_query re-raises RuntimeError (SurrealDB's transaction-conflict signal) quietly so the worker's retry layer can absorb it. Importing this module also runs ensure_internal_no_proxy."

[module_notes."open_notebook.domain"]
purpose = "Package marker for the domain models; it exports nothing (`__all__` is empty)."
does = "Groups the Pydantic records stored in SurrealDB: the generic base classes, notebooks/sources/notes/chat sessions, credentials, transformations, content settings and the legacy provider config."
flow = "Callers import the submodules directly (open_notebook.domain.notebook, .base, .credential, …); nothing imports the package itself."

[module_notes."open_notebook.domain.base"]
purpose = "Gives every stored record the same load / save / delete / relate behaviour over the repository, so domain classes only declare fields."
does = "ObjectModel: get / get_all / save / delete / relate for table-backed records, with `created` and `updated` stamped on save, None fields dropped unless listed in nullable_fields, and get() resolving the right subclass from the id's table prefix. Guards ORDER BY input against SurrealQL injection with an allowlist. RecordModel: a per-process singleton for one fixed record id (settings-style records) with lazy load and upsert."
flow = "Subclassed by domain.notebook, domain.credential, domain.transformation, domain.content_settings, domain.provider_config, ai.models and podcasts.models; used directly by most api.routers → open_notebook.database.repository repo_create / repo_update / repo_query / repo_delete / repo_relate / repo_upsert → whichever SurrealDB table the subclass names in table_name or record_id."
note = "RecordModel loads its row once per process and constructing it with keyword arguments overwrites the cached instance; that is how run_transformation wipes the default prompt (finding default-transformation-prompt-ignored). A record changed by the API process is not re-read by the worker process. get() turns every failure, including a bad id, into NotFoundError."

[module_notes."open_notebook.domain.content_settings"]
purpose = "Persists the content-extraction preferences users set on the settings page so source processing honours them."
does = "Stores the document and URL extraction engines, the default embedding option, auto-delete of uploaded files, Docling OCR / formula / vision switches and preferred YouTube transcript languages in the `open_notebook:content_settings` record."
flow = "Read and written by api.routers.settings (GET/PUT settings); read by graphs.source:content_process during the add-source journey to build content-core's ContentCoreConfig."
note = "It is a RecordModel, loaded once per process: the worker that runs process_source keeps the settings it first loaded until it restarts."

[module_notes."open_notebook.domain.credential"]
purpose = "Stores each provider account (key, endpoints, Vertex/Azure fields) as its own `credential` row with the API key encrypted at rest."
does = "Encrypts api_key on save and decrypts it on every load path (get, get_all, get_by_provider), keeping it a SecretStr in memory. Lists that cannot be decrypted still return the row with a decryption_error instead of failing the page. Builds the esperanto config dict, mapping Vertex project/location to vertex_* keys and Azure base_url to endpoint. Keeps provider extras such as num_ctx inside the flexible `config` object."
flow = "Created and edited by api.routers.credentials / api.credentials_service (configure-models journey) → ObjectModel.save → `credential` table, key via open_notebook.utils.encryption. Read by ai.models (Model.get_credential_obj → to_esperanto_config), ai.key_provider (get_by_provider, oldest first) and model_discovery; get_linked_models reads `model` WHERE credential."
note = "When several credentials exist for one provider, the environment fallback always uses the oldest one."

[module_notes."open_notebook.domain.notebook"]
purpose = "The core knowledge model: notebooks, the sources and notes linked to them, insights, embeddings and chat sessions, plus the two search entry points."
does = "Notebook: lists its sources and notes (without large bodies unless asked), builds the long text context used for podcasts, previews and performs a cascade delete. Source: tracks its processing command, queues embed_source and create_insight jobs, and on delete removes the uploaded file and its source_embedding / source_insight rows. Note: saves and then queues embed_note (best effort); links to a notebook via `artifact`. ChatSession: links to a notebook or source via `refers_to`. Search: validates a notebook scope, then calls SurrealDB fn::text_search or fn::vector_search (after embedding the query) and re-sorts vector hits by similarity."
flow = "Called from almost every journey: add-source (api.routers.sources creates Source and `reference` edges; graphs.source fills full_text; Source.vectorize → commands.embedding_commands), search and ask-notebook (resolve_notebook_scope → text_search / vector_search), chat-session (ChatSession.relate_to_notebook, context via utils.context_builder) and generate-podcast (Notebook.get_context) → domain.base / database.repository → tables notebook, source, note, source_insight, source_embedding, chat_session and edges reference, artifact, refers_to; jobs go to the surreal-commands queue via submit_command."
note = "Insight and embedding writes are queued, not done inline: Source.add_insight returns a command id before the insight exists. Notebook.delete runs several statements with no transaction (finding notebook-delete-not-atomic). ChatSession.relate_to_source has no caller; source chat relates through ObjectModel.relate directly."

[module_notes."open_notebook.domain.provider_config"]
purpose = "Legacy store for provider keys (one `open_notebook:provider_configs` record holding several credentials per provider), kept only so old installs can be migrated."
does = "Loads and saves the singleton record with per-entry encryption of api_key. Picks the default entry per provider and adds, deletes or re-defaults entries in memory."
flow = "Used only by api.credentials_service: POST /api/credentials/migrate-from-provider-config copies each entry into a new `credential` row and links that provider's unassigned `model` rows to it; POST /api/credentials/migrate-encryption re-encrypts the entries inside the singleton. No model call path reads it any more."

[module_notes."open_notebook.domain.transformation"]
purpose = "Holds the user-defined prompts that turn a source's text into an insight, plus the global instructions meant to precede them."
does = "Transformation maps the `transformation` table (name, title, prompt, apply_default, optional model_id stored as a record link). DefaultPrompts is the `open_notebook:default_prompts` singleton with transformation_instructions."
flow = "Created and edited by api.routers.transformations; chosen when a source is added (api.routers.sources passes them into graphs.source) or run alone (POST /api/transformations/execute, commands.source_commands run_transformation) → graphs.transformation renders transformation.prompt into the fixed transformation/execute template → the result becomes a `source_insight` through Source.add_insight."
note = "DefaultPrompts is saved and shown by the API but never applied when a transformation runs (finding default-transformation-prompt-ignored)."

[module_notes."open_notebook.exceptions"]
purpose = "One exception vocabulary for domain, graphs, API and commands, so routers can map failures to HTTP codes and commands can decide what to retry by type."
does = "OpenNotebookError base with subclasses for not found, invalid input, database, configuration, authentication, rate limit, network, file and unsupported type; ExternalServiceError with IncompleteGenerationError and ContextLengthExceededError, the two model failures a retry cannot fix."
flow = "Raised in open_notebook.domain.* and open_notebook.graphs.*, produced from raw provider errors by open_notebook.utils.error_classifier, turned into HTTP responses by the exception handlers in api.main (NotFoundError → 404, InvalidInputError → 400, AuthenticationError → 401, RateLimitError → 429, …) or caught directly in api.routers.* and listed in the stop_on retry lists of commands.source_commands and commands.embedding_commands."

[module_notes."open_notebook.graphs.ask"]
purpose = "The three-stage Ask pipeline that answers a question from the whole knowledge base (or a notebook scope) with cited sources."
does = "Strategy: a model returns JSON parsed into Strategy {reasoning, searches[term, instructions]}, blank terms dropped, an error if none remain. Fan-out: one provide_answer branch per search, each running vector_search (10 hits, scoped to notebook_ids) and asking a model for a partial answer citing document ids. Synthesis: a final model merges the partial answers and must return non-empty text. All three stages use the tools slot with 8192 output tokens."
flow = "ask-notebook journey: api.routers.search POST /api/search/ask (streamed) and /api/search/ask/simple → graph.astream with strategy_model, answer_model, final_answer_model in config → call_model_with_messages → trigger_queries (LangGraph Send) → provide_answer (domain.notebook.vector_search → utils.embedding + fn::vector_search) → write_final_answer. Each stage gets its model via ai.provision. Nothing is stored."
note = "\"Up to five searches\" is only asked for in the prompt; the code does not cap the list, so a model that returns more triggers more searches and LLM calls."

[module_notes."open_notebook.graphs.chat"]
purpose = "The notebook chat agent, whose conversation history persists between requests in a LangGraph checkpoint."
does = "Renders the chat/system prompt from the notebook and the context the frontend chose, appends the stored message history and calls the session's model (request model, then session model_override, then the chat default). Refuses to store an empty reply, so a blank AI message is never replayed. Saves the thread state to the SQLite checkpointer keyed by session id."
flow = "chat-session journey: api.routers.chat POST /api/chat/execute → utils.graph_utils.invoke_chat_turn (in a worker thread) → graph.invoke → call_model_with_messages → ai.provision (run on a fresh event loop because the node is synchronous) → model.invoke → messages written to the SQLite file at LANGGRAPH_CHECKPOINT_FILE. The chat_session row itself lives in SurrealDB."
note = "Messages live only in the SQLite checkpoint, not in SurrealDB, so deleting a session leaves them there (finding chat-delete-leaves-checkpoint)."

[module_notes."open_notebook.graphs.prompt"]
purpose = "A one-node graph that runs an arbitrary instruction over a text; today it only titles AI-generated notes."
does = "Renders the caller's instruction as data into the fixed pattern/generic template (optionally with an output parser), sends it with the text to the transformation-slot model capped at 5000 tokens, and returns the answer with thinking tags removed."
flow = "api.routers.notes POST /api/notes, when an AI note has no title → prompt_graph.ainvoke({input_text, prompt}) → call_model → ai.provision.provision_langchain_model(slot transformation) → returns output, which becomes the note title. Writes nothing itself."

[module_notes."open_notebook.graphs.source"]
purpose = "The ingestion pipeline a worker runs for each new source: extract text, store it, index it, apply transformations."
does = "Extracts text from a URL, file or pasted text with content-core, using the saved engine choices (falling back to auto when an engine's runtime is missing) and the default speech-to-text model for audio and video. Turns content-core's soft failures and empty results into errors so the job fails and can be retried. Deletes the uploaded file when asked. Saves full_text and title onto the existing placeholder Source and queues embedding. Fans out one transform_content branch per selected transformation (LangGraph Send), each producing an insight."
flow = "add-source journey: commands.source_commands:process_source_command invokes source_graph → content_process (domain.content_settings, ai.models defaults, content_core.extract_content) → save_source (Source.get, Source.save on `source`, Source.vectorize → embed_source job) → transform_content (graphs.transformation graph, then Source.add_insight → create_insight job → `source_insight`)."
note = "transform_content passes only input_text to the transformation graph, so the graph itself does not save the insight; this node does. A retried job repeats every transformation (finding source-retry-duplicates-insights)."

[module_notes."open_notebook.graphs.source_chat"]
purpose = "Chat about a single source, grounded in that source's text and insights, with history kept in the same checkpoint store as notebook chat."
does = "Builds the source context on every turn (utils.context_builder.build_source_context, about 50,000 tokens) and records which source and insights were included as context_indicators for the UI. Renders source_chat/system and calls the requested or session model in the chat slot. Rejects empty replies and stores the turn in the SQLite checkpoint."
flow = "api.routers.source_chat POST /api/sources/{source_id}/chat/sessions/{session_id}/messages → source_chat_graph.invoke → call_model_with_source_context → build_source_context (reads `source`, `source_insight`) → ai.provision → model.invoke → state saved under the session's thread id in LANGGRAPH_CHECKPOINT_FILE. The session is a chat_session row linked to the source by a `refers_to` edge."
note = "Async work inside this synchronous node runs on new event loops in a thread pool; each turn makes database round trips for context before the model call."

[module_notes."open_notebook.graphs.tools"]
purpose = "Holds a LangChain tool meant to give agents the current time."
does = "Defines get_current_timestamp, which returns the time as YYYYMMDDHHmmss."
flow = "Nothing imports it: no graph binds tools (the bind_tools line in graphs.ask is commented out)."
note = "Dead code today; its own comment says the timestamp should become a system-prompt variable instead."

[module_notes."open_notebook.graphs.transformation"]
purpose = "Runs one transformation prompt over a text with an LLM and checks the answer is complete before anyone saves it."
does = "Renders the user's prompt as plain data into the fixed transformation/execute template, never as template source (GHSA-f35w-wx37-26q7). Calls the model chosen for the transformation or the transformation default with 8192 output tokens. Rejects empty input, answers cut off by the token limit and answers that are empty after removing thinking tags. Saves the result as an insight when a Source object is in the state."
flow = "Invoked by graphs.source:transform_content (add-source; text only), commands.source_commands run_transformation (passes the Source, so the insight is saved here) and api.routers.transformations POST /api/transformations/execute (text only, result returned) → ai.provision.provision_langchain_model(slot transformation) → model → Source.add_insight → create_insight job."
note = "It builds DefaultPrompts(transformation_instructions=None) instead of loading it, so global instructions are never prepended (finding default-transformation-prompt-ignored)."

[module_notes."open_notebook.podcasts"]
purpose = "Package marker for the podcast models and audio-path helpers; importing it runs nothing."
does = "Groups episode and speaker profiles, the episode record, and the helpers that keep audio paths inside the podcasts folder."
flow = "Callers import open_notebook.podcasts.models or .audio_paths directly."

[module_notes."open_notebook.podcasts.audio_paths"]
purpose = "Makes sure an episode's audio_file can never point outside the podcasts folder, on both the write and the read side."
does = "On write, converts podcast-creator's absolute or file:// path into a path relative to PODCASTS_FOLDER, refusing anything outside it (ValueError fails the job permanently). On read, joins the stored value with the folder, resolves symlinks and `..`, and returns None for absolute, URI or escaping values."
flow = "Write: commands.podcast_commands.generate_podcast_command → to_relative_audio_path → stored in `episode.audio_file`. Read: api.routers.podcasts (audio stream, list/get, delete, retry) → resolve_contained_audio_path → file opened or removed only when contained."
note = "Older rows with absolute paths that migration 21 could not convert are treated as missing audio (403/404), not followed."

[module_notes."open_notebook.podcasts.models"]
purpose = "Describes what a podcast episode is generated from (episode and speaker profiles) and records each generated episode with its job."
does = "EpisodeProfile (`episode_profile`): briefing, 3–20 segments, outline and transcript model links, language, max_tokens. SpeakerProfile (`speaker_profile`): 1–4 speakers each with name, voice_id, backstory and personality, a TTS model link and per-speaker overrides; resolved by record id or by name. Resolves a model link to (provider, model name, config) from its credential or the environment, for podcast-creator. PodcastEpisode (`episode`): snapshots of both profiles, briefing, content, transcript, outline, relative audio path and the command link, with job status fetched singly or in one batch query on the `command` table."
flow = "generate-podcast journey: api.podcast_service.submit_generation_job (EpisodeProfile.get_by_name, SpeakerProfile.resolve) → commands.podcast_commands.generate_podcast_command (resolve_outline_config / resolve_transcript_config / resolve_tts_config → _resolve_model_config reads `model`, `credential`) → PodcastEpisode.save → `episode`. Profiles are edited through api.routers.episode_profiles and speaker_profiles; episodes are listed and deleted through api.routers.podcasts."
note = "_resolve_model_config builds config without the per-call URL re-validation ai.models does (finding podcast-skips-url-revalidation). Episodes store profile copies, so later profile edits do not change old episodes."

[module_notes."open_notebook.utils"]
purpose = "A convenience re-export of the most used helpers so callers can write `from open_notebook.utils import token_count`."
does = "Re-exports chunking, embedding, encryption, text, token, version and model-dump helpers; context_builder, graph_utils, proxy, url_validation and the rest are imported from their own modules."
flow = "Importing the package imports chunking, embedding, encryption, model_utils, text_utils, token_utils and version_utils as a side effect; most project code imports the submodules directly instead."
note = "The package docstring warns about circular imports: context_builder imports open_notebook.domain, which is why it is not re-exported here."

[module_notes."open_notebook.utils.chunking"]
purpose = "Splits long text into token-bounded pieces before embedding, so sources become searchable chunks and long notes stay within the embedding model's input limit."
does = "Detects HTML, Markdown or plain text from the file extension, with content heuristics that can override a plain-text extension at high confidence; splits by headers (h1–h3, #–###) and then by size, or recursively for plain text, measuring length in tokens; drops empty and tiny fragments; reads OPEN_NOTEBOOK_CHUNK_SIZE (default 400 tokens), OPEN_NOTEBOOK_CHUNK_OVERLAP (default 15%) and OPEN_NOTEBOOK_MIN_CHUNK_SIZE once at import."
flow = "commands.embedding_commands:embed_source_command (detect_content_type + chunk_text → rows in source_embedding, add-source journey) and open_notebook.utils.embedding:generate_embedding (long notes, insights and search queries) → token_utils.token_count for every length check."
note = "Text at or under CHUNK_SIZE tokens is returned as a single chunk without any splitting."

[module_notes."open_notebook.utils.context_builder"]
purpose = "Builds the text a chat model sees — which sources, insights and notes, at what length — in one place for the notebook chat and the single-source chat."
does = "build_notebook_context reads a per-item status string from the frontend ('not in context', 'insights', 'full content') and collects short or long context for each source and note, or short context for everything when no config is sent; build_source_context returns one source's full text plus its insights and, under a token budget, reserves 20% for insights and truncates the text with a visible notice; one broken item is logged and skipped rather than failing the request."
flow = "Chat-session journey: api.routers.chat:build_context → build_notebook_context → Source.get / Note.get / Notebook.get_sources / SourceInsight.get_for_sources (reads source, note, source_insight) → context dict and total text returned to the UI, which sends it back with execute_chat. open_notebook.graphs.source_chat → build_source_context(max_tokens) → token_utils.token_count."
note = "With a config, source and note ids are loaded as given; build_notebook_context does not check that they belong to the notebook passed in. The status strings are a protocol shared with the frontend."

[module_notes."open_notebook.utils.embedding"]
purpose = "The one place vectors are produced, so commands and search all embed with the same configured model, batching and retry behaviour."
does = "generate_embeddings sends texts in batches (OPEN_NOTEBOOK_EMBEDDING_BATCH_SIZE, default 50) and retries each batch 3 times, 2 s apart; generate_embedding returns one vector for any length, chunking long text and mean-pooling the chunk vectors (then re-normalising); raises ValueError when no embedding model is configured."
flow = "commands.embedding_commands (embed_note, embed_insight, embed_source) and, in the search and ask journeys, open_notebook.domain.notebook:vector_search for the query vector → ModelManager.get_embedding_model (open_notebook.ai.models, default embedding model from the database) → the provider's aembed call. Writes nothing itself; callers store the vectors."

[module_notes."open_notebook.utils.encryption"]
purpose = "Keeps provider API keys encrypted at rest in SurrealDB, and lets passwords and keys come from Docker secret files as well as plain env vars."
does = "get_secret_from_env reads NAME_FILE first, then NAME; encrypt_value derives a Fernet key from OPEN_NOTEBOOK_ENCRYPTION_KEY with PBKDF2-HMAC-SHA256 and prefixes the result with pbkdf2v1:; decrypt_value decrypts marked values strictly, and for unmarked values tries the older SHA-256 derivation, then returns the value as plaintext unless it looks like a Fernet token encrypted under a different key."
flow = "Configure-models journey: open_notebook.domain.credential:Credential.save and open_notebook.domain.provider_config encrypt api_key before writing the credential table and decrypt it on read; api.credentials_service checks that a key is configured; api.auth and api.routers.auth read OPEN_NOTEBOOK_PASSWORD through get_secret_from_env; api.main warns at startup when OPEN_NOTEBOOK_ENCRYPTION_KEY is missing."
note = "Changing OPEN_NOTEBOOK_ENCRYPTION_KEY makes every stored credential undecryptable (decrypt_value raises). The salt is a fixed application constant, the same for every deployment."

[module_notes."open_notebook.utils.error_classifier"]
purpose = "Turns raw provider, Esperanto and LangChain exceptions into the project's typed exceptions with a message a user can act on."
does = "Matches lower-cased keywords in the exception type and text against ordered rules — authentication, rate limit, model not found, missing configuration, network, context length, payload too large, provider unavailable — and returns the exception class plus a fixed or truncated (200 characters) message; anything unmatched becomes ExternalServiceError and is logged."
flow = "Called in the except blocks of open_notebook.graphs.ask, chat, source_chat and transformation and of api.routers.search and api.routers.source_chat; the returned class is raised in place of the original error, so it decides the HTTP status and, inside commands, whether stop_on prevents a retry."
note = "Matching is plain substring search with numeric keywords such as '401', '429' and '500', so any digits in the message can select a rule (see the finding on misclassified errors)."

[module_notes."open_notebook.utils.graph_utils"]
purpose = "Keeps a LangGraph chat thread clean when a model call fails, so retrying a question does not leave it twice in the saved history."
does = "invoke_chat_turn runs one graph turn and, if it raises, removes the unanswered user message from the SQLite checkpoint before re-raising; discard_unanswered_message does that removal on its own; get_session_message_count reads the message count of a thread for session listings."
flow = "Chat-session journey: api.routers.chat:execute_chat and api.routers.source_chat → asyncio.to_thread(invoke_chat_turn) → open_notebook.graphs.chat / source_chat graph (checkpoints in LANGGRAPH_CHECKPOINT_FILE) → on failure discard_unanswered_message (RemoveMessage via graph.update_state)."
note = "Synchronous on purpose: the checkpointer is a SqliteSaver, and running invoke and rollback in the same worker thread means the rollback still happens if the HTTP client disconnects."

[module_notes."open_notebook.utils.model_utils"]
purpose = "Converts Pydantic objects nested inside dicts and lists to plain data before they are stored in SurrealDB."
does = "full_model_dump walks dicts and lists recursively and calls model_dump on every Pydantic model it finds."
flow = "commands.podcast_commands:generate_podcast_command → full_model_dump on the episode/speaker profile snapshots and on podcast_creator's transcript and outline → stored on the episode record."

[module_notes."open_notebook.utils.proxy"]
purpose = "Stops a configured HTTP proxy from swallowing the internal SurrealDB websocket, which made the API and worker die at startup with a 403 (issue #1160)."
does = "Merges host.docker.internal, surrealdb, localhost, 127.0.0.1 and the host parsed from SURREAL_URL / SURREAL_ADDRESS into both no_proxy and NO_PROXY, keeping the user's entries and order; leaves a '*' wildcard untouched; safe to call repeatedly."
flow = "Called at import time by open_notebook.database.repository, by the commands package (worker) and by api.main, i.e. before any db_connection opens; it only edits the process environment that websockets reads."

[module_notes."open_notebook.utils.runtime_capabilities"]
purpose = "Tells whether the opt-in extraction engines (Docling, Crawl4AI) are actually usable in this container, since they are installed at startup and can be missing after a redeploy."
does = "Probes Docling through content-core's own flag; treats Crawl4AI as available when a remote server is configured (CRAWL4AI_API_URL) or the package and a Playwright Chromium build are both present; maps an engine name to the env var that would enable it (OPEN_NOTEBOOK_ENABLE_DOCLING / OPEN_NOTEBOOK_ENABLE_CRAWL4AI)."
flow = "api.routers.capabilities reports the probes to the frontend; in the add-source journey open_notebook.graphs.source calls engine_runtime_missing before handing content-core the engine choice stored in the database, so a missing runtime is reported instead of failing extraction blindly."

[module_notes."open_notebook.utils.ssl_config"]
purpose = "Makes the project's own httpx calls follow the same TLS settings as the Esperanto providers, so 'Test connection' and model discovery work against corporate or self-signed endpoints that chat already reaches."
does = "httpx_verify_setting returns the CA bundle path from ESPERANTO_SSL_CA_BUNDLE, False when ESPERANTO_SSL_VERIFY is false/0/no, otherwise True; a configured bundle path that does not exist raises instead of silently disabling verification."
flow = "Configure-models journey: api.credentials_service (discover and test) and open_notebook.ai.connection_tester → httpx.AsyncClient(verify=httpx_verify_setting())."

[module_notes."open_notebook.utils.text_utils"]
purpose = "Cleans model output before it is shown or stored, mainly the <think> reasoning blocks some models emit and the list-of-parts content format some providers return."
does = "Splits <think>…</think> reasoning from the answer, including output with a missing opening tag and output truncated mid-reasoning (returns an empty answer); extract_text_content flattens list-shaped message content into a string."
flow = "Used on model responses in open_notebook.graphs.ask, chat, source_chat, prompt and transformation before the answer is streamed, returned or saved as an insight or note."
note = "remove_non_ascii and remove_non_printable have no callers in api/, open_notebook/ or commands/."

[module_notes."open_notebook.utils.token_utils"]
purpose = "Gives every size decision in the project — chunk length, context budgets, large-context model switching — one token count."
does = "token_count encodes with tiktoken's o200k_base, treating special-token strings as text, and falls back to words × 1.3 when tiktoken or its encoding file is unavailable (offline); points TIKTOKEN_CACHE_DIR at the configured cache folder before tiktoken loads; token_cost multiplies by a per-million price."
flow = "open_notebook.utils.chunking (every split), open_notebook.utils.embedding (size logging), open_notebook.utils.context_builder (source budget), open_notebook.ai.provision (choose the large-context model) and api.routers.chat (context token count returned to the UI)."
note = "token_cost has no callers in api/, open_notebook/ or commands/."

[module_notes."open_notebook.utils.url_validation"]
purpose = "Blocks provider URLs and source URLs that point at cloud metadata endpoints, while still allowing localhost and private IPs because self-hosted models (Ollama, LM Studio) live there."
does = "validate_url accepts only http/https, rejects link-local addresses (169.254.x.x, fe80::, IPv4-mapped forms) and AWS's IMDSv6 address, including hostnames that resolve to them, and lets unresolvable hostnames through; prepare_pinned_http_target resolves once, rejects the same addresses and returns a URL pinned to the vetted IP with Host and SNI kept on the original name, so httpx cannot re-resolve elsewhere."
flow = "Configure-models journey: api.routers.credentials and api.credentials_service validate base URLs on save; open_notebook.ai.models, open_notebook.ai.model_discovery and open_notebook.ai.connection_tester re-validate (or pin) right before use. Add-source journey: api.routers.sources calls validate_url on a submitted source URL before content-core fetches it."
note = "Only prepare_pinned_http_target closes the DNS-rebinding window; validate_url alone leaves it open, because the real request resolves the name again."

[module_notes."open_notebook.utils.version_utils"]
purpose = "Lets the settings page say whether a newer Open Notebook release exists."
does = "Reads the version from pyproject.toml on a GitHub branch (async with httpx, or sync with requests, 10 s timeout); compares two versions; reads an installed package's version."
flow = "api.routers.config → get_version_from_github_async('https://github.com/lfnovo/open-notebook', 'main') → raw.githubusercontent.com → compare_versions against the local version; the router caches the result."
note = "The sync get_version_from_github and get_installed_version have no callers in api/, open_notebook/ or commands/."

[module_notes.run_api]
purpose = "Lets a developer start the API with `python run_api.py` instead of typing a uvicorn command."
does = "Reads host, port and reload mode from API_HOST, API_PORT and API_RELOAD; puts the repo root on sys.path; starts uvicorn on `api.main:app`."
flow = "Developer shell → run_api → uvicorn → api.main:app (whose lifespan then waits for SurrealDB and runs migrations)."
note = "Reload defaults to on, so this script is meant for development; container images start uvicorn themselves."

[module_notes."scripts.check_md_links"]
purpose = "Catches broken relative links in the repository's Markdown before they reach readers."
does = "Lists tracked *.md files with git, strips fenced and inline code, resolves every relative link target (root-relative or file-relative, anchors and queries removed) and exits 1 listing each missing target; external URLs, mailto and pure anchors are skipped."
flow = "Run by the docs-links GitHub workflow and by hand (`python3 scripts/check_md_links.py`); reads files only, writes nothing."

[module_notes."scripts.export_docs"]
purpose = "Produces one Markdown file per docs/ section, for sharing or feeding the documentation elsewhere as a single document."
does = "For each subfolder of docs/, concatenates its .md files (except index.md) in name order under a generated table of contents."
flow = "`make export-docs` (uv run python scripts/export_docs.py) → reads docs/<section>/*.md → writes doc_exports/<section>.md; paths are relative to the working directory."

[[layers]]
id = "api-app"
name = "API app"
owns = "Starting the server and building the FastAPI app: uvicorn launch, password middleware, upload-size limit, router registration, and running database migrations at startup."
modules = ["run_api", "api", "api.main", "api.auth", "api.middleware"]

[[layers]]
id = "api-routers"
name = "API routers"
owns = "One FastAPI router per resource (notebooks, sources, notes, chat, models, credentials, podcasts…): parse the request, load domain objects, call a graph or queue a command, and shape the JSON response."
modules = ["api.routers.*"]

[[layers]]
id = "api-services"
name = "API services & schemas"
owns = "Logic shared by several routers that does not belong to one resource: Pydantic request/response schemas (api.models), queueing background jobs, credential setup and migration, podcast job submission."
modules = ["api.models", "api.command_service", "api.credentials_service", "api.podcast_service"]

[[layers]]
id = "background"
name = "Background commands"
owns = "surreal-commands jobs that run outside the HTTP request: processing a new source, running a transformation, creating insights, writing embeddings, rebuilding all embeddings, generating a podcast. Each has its own retry policy."
modules = ["commands.*"]

[[layers]]
id = "graphs"
name = "LangGraph workflows"
owns = "The AI workflows as LangGraph state graphs: source ingestion, transformations, notebook chat and source chat (checkpointed to SQLite), ask/search, and one-shot prompts. They read domain objects and ask the AI layer for a model; they never query the database themselves."
modules = ["open_notebook.graphs.*"]

[[layers]]
id = "ai"
name = "AI provisioning"
owns = "Which model to use and how to reach it: the model registry and default models, building Esperanto/LangChain clients from credentials or env vars, provider discovery and connection tests."
modules = ["open_notebook.ai.*"]

[[layers]]
id = "domain"
name = "Domain models"
owns = "Pydantic records that map one-to-one to SurrealDB tables (notebook, source, note, chat_session, credential, transformation, podcast profiles and episodes) with their save/delete/relate rules and cascade behaviour."
modules = ["open_notebook.domain.*", "open_notebook.podcasts.*"]

[[layers]]
id = "database"
name = "Database"
owns = "The SurrealDB connection and the repo_* helpers every write goes through, plus the numbered .surrealql migrations and the runner that applies them."
modules = ["open_notebook.database.*"]

[[layers]]
id = "shared"
name = "Config, errors & utils"
owns = "Paths and folders (config), the exception hierarchy every layer raises, and helpers: chunking, token counting, embedding generation, context building, encryption, URL/SSL checks, error classification. Two helpers reach upward (context_builder reads domain objects, embedding asks the AI layer for a model)."
modules = ["open_notebook", "open_notebook.config", "open_notebook.exceptions", "open_notebook.utils.*"]

[[layers]]
id = "repo-scripts"
name = "Repo scripts"
owns = "Maintenance scripts for the repository's docs (link checking, doc export); not part of the running app."
modules = ["scripts.*"]

[[journeys]]
id = "add-source"
title = "Add a source to a notebook"
actor = "user · Next.js frontend"
trigger = "POST /api/sources (multipart form; POST /api/sources/json is a thin wrapper)"
summary = "The API checks the input, saves an uploaded file, creates a placeholder `source` record linked to its notebooks and queues a `process_source` job. A surreal-commands worker then extracts the text with content-core, saves it on the source, and queues more jobs that write `source_embedding` chunks and `source_insight` rows from transformations."
  [[journeys.steps]]
  symbol = "api.routers.sources:create_source"
  actor = "frontend"
  action = "Gets the form already parsed into a SourceCreate by parse_source_form_data, checks that every notebook exists, saves the file if there is one, builds the content_state, checks that every transformation exists, then takes the async or the sync branch"
  receives = "(SourceCreate, UploadFile | None) built from form fields type, notebooks (JSON string), url / content / file, transformations (JSON string), embed, delete_source, async_processing"
  returns = "SourceResponse; 404 when a notebook or transformation is missing, 400/415 for bad input, 500 otherwise. Whenever it fails, it deletes the file this request uploaded"
  stores = "nothing itself"
  tables = ["notebook", "transformation"]
  payload = '''
type=upload  notebooks=["notebook:k3x9"]  transformations=["transformation:summary"]
embed=true  async_processing=true  file=quarterly-review.pdf (2.1 MB)

'''
  note = "The legacy single `notebook_id` field becomes `notebooks=[id]` in SourceCreate.validate_notebook_fields, so the rest of the code only sees the list."
  [[journeys.steps]]
  symbol = "api.routers.sources:save_uploaded_file"
  action = "Reads the whole upload into memory and writes it to UPLOADS_FOLDER in a worker thread"
  receives = "UploadFile"
  returns = "the absolute path of the saved file"
  stores = "a file under UPLOADS_FOLDER; a name clash becomes 'name (1).pdf'"
  note = "generate_unique_filename keeps only the basename, refuses any path that resolves outside the uploads folder, and claims the name with an atomic touch(exist_ok=False), so two uploads with the same name cannot overwrite each other. MaxBodySizeMiddleware has already rejected bodies over OPEN_NOTEBOOK_MAX_UPLOAD_SIZE_MB."
  [[journeys.steps]]
  symbol = "api.routers.sources:_build_content_state"
  action = "Validates the input for its type and turns it into the dict that the extractor will use"
  receives = "SourceCreate, the saved file path"
  returns = "content_state: {url} | {file_path, delete_source} | {content}; HTTP 400 for a missing field, a blocked URL or a path outside uploads; 415 (UnsupportedTypeException) when content-core says it cannot read the file"
  payload = '''
{"file_path": "/app/data/uploads/quarterly-review.pdf", "delete_source": false}

'''
  note = "For links it calls validate_url (link-local and cloud-metadata addresses are refused). For uploads, check_file_support runs before any job is queued, so an unsupported file is rejected right away instead of failing in the worker after every retry has run."
  [[journeys.steps]]
  symbol = "api.routers.sources:_create_source_async_path"
  action = "Saves a placeholder Source (title 'Processing...', asset = url or file path), links it to each notebook, queues process_source, and stores the job id on the source"
  receives = "SourceCreate, content_state, transformation ids, file path"
  returns = "SourceResponse with status 'new', command_id and processing_info {async: true, queued: true}; the text and embeddings are not there yet"
  stores = "a `source` row; a `reference` edge source→notebook for each notebook (Source.add_to_notebook); source.command = the job id"
  tables = ["source", "reference"]
  payload = '''
{"id": "source:p7q2", "title": "Processing...", "status": "new",
 "command_id": "command:8f1c", "processing_info": {"async": true, "queued": true}}

'''
  note = "The asset is saved before the job is queued so the retry endpoint can process the source again if the job fails. If the job cannot be queued, the source record is deleted again. With async_processing=false, _create_source_sync_path runs the same command with execute_command_sync (5-minute timeout) and replies only when it finishes."
  [[journeys.steps]]
  symbol = "api.command_service:CommandService.submit_command_job"
  action = "Hands the job to surreal-commands: submit_command('open_notebook', 'process_source', args) writes a job record in SurrealDB, where a worker process will pick it up"
  receives = "app name, command name, SourceProcessingInput.model_dump()"
  returns = "the job id as a string ('command:…')"
  stores = "a surreal-commands job record (queue state lives in SurrealDB, not in Open Notebook's own tables)"
  payload = '''
{"source_id": "source:p7q2", "content_state": {"file_path": "/app/data/uploads/quarterly-review.pdf", "delete_source": false},
 "notebook_ids": ["notebook:k3x9"], "transformations": ["transformation:summary"], "embed": true}

'''
  [[journeys.steps]]
  symbol = "commands.source_commands:process_source_command"
  actor = "surreal-commands worker (supervisord: surreal-commands-worker --import-modules commands)"
  action = "Loads the Transformation objects, records the job id on the source, and runs source_graph"
  receives = "SourceProcessingInput"
  returns = "SourceProcessingOutput {success, source_id, insights_created, processing_time}; embedded_chunks is always 0 because embedding runs as its own job"
  stores = "source.command"
  tables = ["transformation", "source"]
  note = "Retry policy: up to 15 attempts with exponential-jitter backoff (1–120 s), a workaround for SurrealDB v2 transaction conflicts. ValueError, ConfigurationError, ContextLengthExceededError and IncompleteGenerationError stop retries at once, so a bad file fails quickly and the UI can offer a retry."
  [[journeys.steps]]
  symbol = "open_notebook.graphs.source:content_process"
  action = "First graph node. Reads ContentSettings (URL/document engine, Docling options, YouTube languages) and the default speech-to-text model, then calls content_core.extract_content"
  receives = "state.content_state"
  returns = "{'extraction': ExtractionOutput(title, content)}"
  stores = "nothing; it deletes the uploaded file when delete_source is set"
  payload = '''
ExtractionOutput(title="Quarterly Review Q3", content="Revenue grew 12% over ...")

'''
  note = "content-core reports a failed fetch as title='Error' with the content 'Failed to extract content:'. This node turns that, and empty text, into ValueError, so the job is marked failed and is not saved as a 'completed' source whose text is the error message. _usable_engine falls back to 'auto' when the configured crawl4ai/docling runtime is not installed."
  [[journeys.steps]]
  symbol = "open_notebook.graphs.source:save_source"
  action = "Loads the source again, writes asset and full_text, replaces the placeholder title with the extracted one (keeps a title the user typed), and queues embedding when embed=true"
  receives = "state.source_id, content_state, extraction"
  returns = "{'source': Source}"
  stores = "source.asset, source.full_text, source.title"
  tables = ["source"]
  note = "It does not create notebook edges: the API already created them so the source shows in the UI at once."
  [[journeys.steps]]
  symbol = "open_notebook.domain.notebook:Source.vectorize"
  action = "Submits an embed_source job and returns without waiting"
  receives = "the saved Source"
  returns = "the embed_source job id"
  stores = "a surreal-commands job"
  [[journeys.steps]]
  symbol = "commands.embedding_commands:embed_source_command"
  actor = "surreal-commands worker"
  action = "Deletes this source's old chunks, picks a splitter from the file type, splits the text, embeds all chunks in batches (generate_embeddings via the default embedding model) and bulk-inserts them"
  receives = "EmbedSourceInput {source_id}"
  returns = "EmbedSourceOutput {chunks_created}"
  stores = "`source_embedding` rows {source, order, content, embedding}"
  tables = ["source_embedding"]
  payload = '''
{"source": "source:p7q2", "order": 0, "content": "Revenue grew 12% ...", "embedding": [0.013, -0.072, ...]}

'''
  note = "Deleting first makes the job safe to run twice. If one insert batch fails, the rows already inserted are deleted, so search never sees half a source."
  [[journeys.steps]]
  symbol = "open_notebook.graphs.source:transform_content"
  action = "trigger_transformations sends one Send per requested transformation, and they run in parallel. Each one runs the transformation graph (prompt template transformation/execute + the user's instructions, model from provision_langchain_model) on full_text, then calls Source.add_insight"
  receives = "{source, transformation}"
  returns = "{'transformation': [{output, transformation_name}]}"
  stores = "nothing directly: add_insight submits a create_insight job"
  note = "The user's prompt is passed as a render variable into a fixed template, never compiled as Jinja source (see the comment in graphs.transformation:run_transformation). An answer cut off by the token limit raises IncompleteGenerationError instead of being saved."
  [[journeys.steps]]
  symbol = "commands.embedding_commands:create_insight_command"
  actor = "surreal-commands worker"
  action = "Runs CREATE source_insight, then submits embed_insight so the insight can be found by search too"
  receives = "CreateInsightInput {source_id, insight_type, content}"
  returns = "CreateInsightOutput with the new insight id"
  stores = "a `source_insight` row (and later its embedding)"
  tables = ["source_insight"]
  payload = '''
{"source_id": "source:p7q2", "insight_type": "Summary", "content": "The quarter closed with 12% growth ..."}

'''
  note = "The insert is a job of its own so that parallel transformations that hit a SurrealDB transaction conflict are retried there (EMBED_RETRY_CONFIG, 5 attempts)."

[[journeys]]
id = "ask-notebook"
title = "Ask a question across the knowledge base"
actor = "user · Ask page"
trigger = "POST /api/search/ask (SSE stream; /api/search/ask/simple returns only the final answer)"
summary = "A strategy model splits the question into up to five searches. Each search runs a vector search over chunks, insights and notes and gets its own partial answer that cites document ids, and a third model merges those into the final answer. Every stage is sent to the browser as a Server-Sent Event; nothing is saved."
  [[journeys.steps]]
  symbol = "api.routers.search:ask_knowledge_base"
  actor = "frontend"
  action = "Checks the notebook scope first, then that the three chosen models exist, then that a default embedding model is configured, and returns a StreamingResponse"
  receives = "AskRequest {question, strategy_model, answer_model, final_answer_model, scope_notebook_ids}"
  returns = "text/event-stream; 400 for an unknown model or no embedding model, 400/404 for a bad scope"
  tables = ["model"]
  payload = '''
{"question": "What drove revenue growth in Q3?", "strategy_model": "model:gpt5mini",
 "answer_model": "model:gpt5mini", "final_answer_model": "model:claude", "scope_notebook_ids": ["notebook:k3x9"]}

'''
  [[journeys.steps]]
  symbol = "open_notebook.domain.notebook:resolve_notebook_scope"
  action = "Requires every id to be a well-formed notebook:<key> and checks in one query that they all exist"
  receives = "list of notebook ids (empty = whole knowledge base)"
  returns = "the same list; InvalidInputError for a malformed id, NotFoundError for an unknown one"
  tables = ["notebook"]
  note = "Without this check a typo in the scope would give an empty result that looks the same as 'no matches'."
  [[journeys.steps]]
  symbol = "api.routers.search:stream_ask_response"
  action = "Runs ask_graph.astream with the three model ids in config.configurable and turns each node update into an SSE event: strategy, answer (one per search), final_answer, then complete"
  receives = "question, three Model objects, notebook ids"
  returns = "SSE lines; an exception becomes one {type: 'error', message} event, because the HTTP status has already been sent"
  payload = '''
data: {"type": "strategy", "reasoning": "Need revenue figures and causes", "searches": [{"term": "Q3 revenue growth", "instructions": "Extract growth drivers"}]}

'''
  [[journeys.steps]]
  symbol = "open_notebook.graphs.ask:call_model_with_messages"
  action = "Renders prompts/ask/entry with a PydanticOutputParser for Strategy, calls the strategy model in JSON mode, strips <think> content and parses it into a Strategy"
  receives = "ThreadState {question, notebook_ids}"
  returns = "{'strategy': Strategy(reasoning, searches[≤5])}"
  note = "Searches with a blank term are dropped. If none are left, it raises ExternalServiceError instead of running empty searches and answering 'no documents found'."
  [[journeys.steps]]
  symbol = "open_notebook.ai.provision:provision_langchain_model"
  action = "Picks the model for this call: the large_context default when the prompt is over 105,000 tokens, otherwise the explicit model id, otherwise the default for the given type ('tools' for Ask)"
  receives = "prompt text, model_id, default_type, max_tokens=8192 (ASK_MAX_TOKENS), structured={'type': 'json'} for the strategy call"
  returns = "a LangChain BaseChatModel (Esperanto LanguageModel.to_langchain()); ConfigurationError if no model is found or it is not a language model"
  [[journeys.steps]]
  symbol = "open_notebook.ai.models:ModelManager.get_model"
  action = "Loads the Model record, builds the Esperanto config from its linked credential (or provisions env vars via key_provider when there is none), checks the provider URLs again, and asks Esperanto's factory for the model"
  receives = "model id, call kwargs"
  returns = "an Esperanto model instance (cached by Esperanto)"
  tables = ["model", "credential"]
  [[journeys.steps]]
  symbol = "open_notebook.graphs.ask:trigger_queries"
  action = "Fan-out: one Send('provide_answer', …) per search term, each carrying the question, the term, its instructions and the notebook scope"
  receives = "ThreadState with strategy"
  returns = "list of Send"
  [[journeys.steps]]
  symbol = "open_notebook.graphs.ask:provide_answer"
  action = "Runs a vector search for the term (10 results). If nothing matches it adds no answer; otherwise it renders prompts/ask/query_process with the results and their ids and calls the answer model"
  receives = "SubGraphState {question, term, instructions, notebook_ids}"
  returns = "{'answers': [text]} (the list reducer collects every branch's answer)"
  payload = '''
"Growth came mainly from the new enterprise tier [source_embedding:a1b2] and lower churn [source_insight:c3d4]."

'''
  note = "Citations are a prompt rule, not checked by code: the template asks the model to cite only the ids in {{ids}}, in square brackets."
  [[journeys.steps]]
  symbol = "open_notebook.domain.notebook:vector_search"
  action = "Embeds the term with the default embedding model (generate_embedding; mean-pools a long query) and calls the SurrealDB function fn::vector_search with minimum_score 0.2 and the notebook scope"
  receives = "keyword, results=10, source=True, note=True, notebook_ids"
  returns = "rows sorted by similarity, highest first (re-sorted in Python because the SELECT wrapper can return them out of order)"
  tables = ["source_embedding", "source_insight", "note"]
  [[journeys.steps]]
  symbol = "open_notebook.graphs.ask:write_final_answer"
  action = "Renders prompts/ask/final_answer with the question, the strategy and every partial answer, and calls the final-answer model"
  receives = "ThreadState {question, strategy, answers[]}"
  returns = "{'final_answer': text}; IncompleteGenerationError when nothing is left after stripping thinking content"
  stores = "nothing; the answer exists only in the SSE stream"

[[journeys]]
id = "chat-session"
title = "Chat with a notebook"
actor = "user · notebook chat panel"
trigger = "POST /api/chat/sessions → POST /api/chat/context → POST /api/chat/execute"
summary = "A chat session is a `chat_session` record linked to its notebook. The frontend builds the context it wants to send (sources at insight or full-text level, notes), then sends each message with that context. The message history is a LangGraph thread in a SQLite checkpoint file, not in SurrealDB. Source chat (POST /api/sources/{id}/chat/sessions/{sid}/messages, graphs.source_chat) follows the same pattern, but the server builds the context itself with build_source_context and streams the reply as SSE."
  [[journeys.steps]]
  symbol = "api.routers.chat:create_session"
  actor = "frontend"
  action = "Checks that the notebook exists, saves a ChatSession (title, optional model_override) and links it to the notebook"
  receives = "CreateSessionRequest {notebook_id, title?, model_override?}"
  returns = "ChatSessionResponse with message_count 0; 404 if the notebook is missing"
  stores = "a `chat_session` row"
  tables = ["notebook", "chat_session"]
  payload = '''
{"notebook_id": "notebook:k3x9", "title": "Q3 questions", "model_override": null}

'''
  [[journeys.steps]]
  symbol = "open_notebook.domain.notebook:ChatSession.relate_to_notebook"
  action = "Creates the session→notebook edge; execute_chat later reads it to find the notebook"
  receives = "notebook id"
  returns = "the relation"
  stores = "a `refers_to` edge"
  tables = ["refers_to"]
  [[journeys.steps]]
  symbol = "api.routers.chat:build_context"
  action = "Turns the frontend's per-item choices into context data and estimates its size, so the panel can show the token count before anything is sent"
  receives = "BuildContextRequest {notebook_id, context_config: {sources: {id: status}, notes: {id: status}}}"
  returns = "BuildContextResponse {context: {sources: [...], notes: [...]}, token_count, char_count}"
  payload = '''
{"notebook_id": "notebook:k3x9",
 "context_config": {"sources": {"source:p7q2": "full content", "source:r8s1": "insights"}, "notes": {"note:m4": "not in"}}}

'''
  [[journeys.steps]]
  symbol = "open_notebook.utils.context_builder:build_notebook_context"
  action = "For each entry: 'not in' skips it, 'insights' adds Source.get_context('short'), 'full content' adds the long context. Without a config it adds every source and note in the notebook at short level"
  receives = "Notebook, context_config"
  returns = "({sources, notes}, the concatenated text used for counting)"
  tables = ["source", "source_insight", "note"]
  note = "If one item fails it is logged and skipped; one broken record never fails the whole request."
  [[journeys.steps]]
  symbol = "api.routers.chat:execute_chat"
  action = "Loads the session and its notebook, reads the thread's current checkpoint, adds the context, notebook, model override and a new HumanMessage (with an explicit uuid) to the state, and runs the graph in a worker thread"
  receives = "ExecuteChatRequest {session_id, message, context, model_override?}"
  returns = "ExecuteChatResponse {session_id, messages[]}: the whole thread, not only the new reply"
  stores = "chat_session.updated (session.save())"
  tables = ["refers_to", "notebook", "chat_session"]
  payload = '''
{"session_id": "chat_session:t5", "message": "Which product line grew fastest?",
 "context": {"sources": [{"id": "source:p7q2", "title": "Quarterly Review Q3", "full_text": "..."}], "notes": []},
 "model_override": null}

'''
  note = "A model_override in the request beats the session's own. The context is whatever the client sends; the server does not rebuild it."
  [[journeys.steps]]
  symbol = "api.routers._chat_shared:get_session_or_404"
  action = "Adds the chat_session: prefix if it is missing and fetches the record"
  receives = "session id with or without prefix"
  returns = "(full id, ChatSession); HTTP 404 if missing"
  tables = ["chat_session"]
  [[journeys.steps]]
  symbol = "open_notebook.utils.graph_utils:invoke_chat_turn"
  action = "Runs chat_graph.invoke with thread_id = session id. If it raises, it removes the unanswered question from the checkpoint before re-raising"
  receives = "graph, state, RunnableConfig {thread_id, model_id}, the user message"
  returns = "the final graph state (all messages)"
  stores = "LangGraph checkpoint rows in LANGGRAPH_CHECKPOINT_FILE (SQLite): the question and the reply"
  note = "Synchronous on purpose, and called through asyncio.to_thread, so the invoke and the rollback stay together even if the client disconnects."
  [[journeys.steps]]
  symbol = "open_notebook.graphs.chat:call_model_with_messages"
  action = "Renders prompts/chat/system (notebook name and description, the context, the citation rules), puts it in front of the history, gets the model (running the async provisioning in a fresh event loop because the node is synchronous), calls model.invoke and strips <think> content"
  receives = "ThreadState {messages, notebook, context, model_override}"
  returns = "{'messages': AIMessage}, which the add_messages reducer appends to the thread"
  payload = '''
AIMessage(content="The enterprise tier grew fastest, up 31% [source:p7q2].")

'''
  note = "An empty answer raises IncompleteGenerationError inside the node, so LangGraph never saves a blank AI message that would be sent back as history later. Provider errors go through classify_error to a typed OpenNotebookError."
  [[journeys.steps]]
  symbol = "open_notebook.ai.provision:provision_langchain_model"
  action = "Chooses the chat model: large_context when the whole payload is over 105,000 tokens, otherwise the override, otherwise the default 'chat' model; max_tokens 8192"
  receives = "str(payload), model_id, 'chat'"
  returns = "a LangChain chat model"
  tables = ["model"]
  [[journeys.steps]]
  symbol = "open_notebook.utils.graph_utils:discard_unanswered_message"
  action = "Failure branch only: LangGraph saves the input before the node runs, so after a failed turn this reads the thread and, if the question is still there, writes RemoveMessage(id) so a retry does not add it twice"
  receives = "graph, thread id, the HumanMessage"
  returns = "nothing; never raises"
  stores = "a new checkpoint without the question"
  [[journeys.steps]]
  symbol = "api.routers._chat_shared:extract_chat_messages"
  action = "Turns LangChain messages into ChatMessage {id, type ('human'/'ai'), content, timestamp=None} for the response"
  receives = "result['messages']"
  returns = "list[ChatMessage]"

[[journeys]]
id = "generate-podcast"
title = "Generate a podcast episode from a notebook"
actor = "user · web UI"
trigger = "POST /api/podcasts/generate"
summary = "The API checks the episode and speaker profiles, turns the notebook into one long text, and queues a `generate_podcast` command, so the request returns a job id right away. A worker then looks up the outline, transcript and voice models with their credentials, gives everything to the podcast-creator library, and saves the transcript, outline and the audio file path on an `episode` row."
  [[journeys.steps]]
  symbol = "api.routers.podcasts:generate_podcast"
  actor = "web UI"
  action = "Takes the request body and passes it on to the podcast service. It returns at once with the job id and does not wait for any audio."
  receives = "PodcastGenerationRequest: episode_profile (name), speaker_profile (name), episode_name, notebook_id or content, optional briefing_suffix"
  returns = "PodcastGenerationResponse {job_id, status: \"submitted\", message, episode_profile, episode_name}"
  stores = "nothing itself"
  payload = '''
{"episode_profile": "tech_discussion", "speaker_profile": "tech_experts", "episode_name": "Solar panels explained", "notebook_id": "notebook:k3x9", "briefing_suffix": "Keep it under ten minutes"}

'''
  [[journeys.steps]]
  symbol = "api.podcast_service:PodcastService.submit_generation_job"
  action = "Checks the request before any work is queued. It loads the episode profile by name and resolves the speaker profile name to a record ID. If no text was sent, it builds the content from the notebook. Then it submits the `generate_podcast` command to surreal-commands."
  receives = "episode_profile_name, speaker_profile_name, episode_name, notebook_id, content, briefing_suffix"
  returns = "the command id as a string (e.g. \"command:7fq2\"). Any failure, including an unknown profile, becomes HTTP 500"
  stores = "a queued command record (written by the surreal_commands library)"
  tables = ["episode_profile", "speaker_profile"]
  payload = '''
{"episode_profile": "tech_discussion", "speaker_profile": "speaker_profile:m81c", "episode_name": "Solar panels explained", "content": "# Source: Home solar guide\n...", "briefing_suffix": "Keep it under ten minutes"}

'''
  note = "The speaker name becomes a record ID here, at the API boundary (#630), so everything after this step works with IDs. The command module is imported just before submitting because submit_command checks the command against the local registry."
  [[journeys.steps]]
  symbol = "open_notebook.podcasts.models:EpisodeProfile.get_by_name"
  action = "Looks up the episode profile by its unique name. The profile names the outline model, the transcript model, the default briefing and the number of segments."
  receives = "name"
  returns = "EpisodeProfile or None"
  stores = "nothing (SELECT only)"
  tables = ["episode_profile"]
  [[journeys.steps]]
  symbol = "open_notebook.podcasts.models:SpeakerProfile.resolve"
  action = "Accepts a record ID (`speaker_profile:...`) or a plain name and returns the matching profile: 1 to 4 speakers, each with a voice_id, backstory and personality, plus the TTS voice model."
  receives = "ref: record ID or name"
  returns = "SpeakerProfile or None"
  stores = "nothing"
  tables = ["speaker_profile"]
  [[journeys.steps]]
  symbol = "open_notebook.domain.notebook:Notebook.get_context"
  action = "Builds one long text from the notebook: each source's full text and insights, then each note's content. Plain list calls leave these large fields out, so this method asks for them explicitly."
  receives = "the Notebook (loaded by id)"
  returns = "a single formatted string"
  stores = "nothing"
  note = "If loading the notebook fails, the service only logs a warning and uses the text \"Notebook ID: <id>\" as the content. The podcast would then be about an id string."
  [[journeys.steps]]
  symbol = "commands.podcast_commands:generate_podcast_command"
  actor = "surreal-commands worker"
  action = "The worker picks up the job and loads both profiles again. It refuses to start if the outline, transcript or voice model is not set. It then loads every episode and speaker profile, because podcast-creator validates the whole set. Profiles whose speaker or model cannot be resolved are dropped."
  receives = "PodcastGenerationInput {episode_profile, speaker_profile (record ID), episode_name, content, briefing_suffix, execution_context.command_id}"
  returns = "PodcastGenerationOutput {success, episode_id, audio_file_path, transcript, outline, processing_time}"
  stores = "the episode row (next steps)"
  tables = ["episode_profile", "speaker_profile"]
  note = "retry max_attempts is 1. A ValueError (bad config) is re-raised as-is. Any other error becomes a RuntimeError, with an extra hint when the model returned JSON it could not parse."
  [[journeys.steps]]
  symbol = "open_notebook.podcasts.models:_resolve_model_config"
  action = "For each model record ID (outline, transcript, voice, and any per-speaker voice), loads the `model` row. If a credential is linked, it builds the provider config from it. If not, it copies the provider's DB credential into environment variables."
  receives = "model_id, optional max_tokens"
  returns = "(provider, model_name, config_dict)"
  stores = "may set os.environ keys through provision_provider_keys"
  tables = ["model", "credential"]
  payload = '''
("openai", "gpt-4o-mini", {"api_key": "sk-invented", "max_tokens": 4000})

'''
  [[journeys.steps]]
  symbol = "open_notebook.domain.base:ObjectModel.save"
  action = "Creates the `episode` record before any audio exists. It holds the name, frozen copies of both profiles, the full briefing (default briefing plus suffix), the content, and a link to the running command."
  receives = "PodcastEpisode with audio_file, transcript and outline set to None"
  returns = "the saved episode with an id"
  stores = "a new episode row"
  tables = ["episode"]
  payload = '''
{"name": "Solar panels explained", "episode_profile": {"name": "tech_discussion", "num_segments": 5}, "speaker_profile": {"name": "tech_experts"}, "briefing": "Create an engaging discussion...\n\nAdditional instructions: Keep it under ten minutes", "command": "command:7fq2", "audio_file": null}

'''
  note = "Because the episode is saved first, the episode list can show it while the job runs, through its command link."
  [[journeys.steps]]
  symbol = "commands.podcast_commands:build_episode_output_dir"
  action = "Picks a new output folder named with a UUID under PODCASTS_FOLDER/episodes. Whatever the user typed as the episode name never becomes part of a path. podcast-creator's `create_podcast` then writes the outline, the transcript and the audio clips into this folder, using the LLM and TTS models from the resolved configs."
  receives = "PODCASTS_FOLDER"
  returns = "(episode_dir_name, output_dir Path)"
  stores = "creates the directory on disk"
  [[journeys.steps]]
  symbol = "open_notebook.podcasts.audio_paths:to_relative_audio_path"
  action = "Turns the final audio path from podcast-creator into a path relative to PODCASTS_FOLDER. It refuses a path that would escape that folder. The episode is then saved again with audio_file, transcript and outline."
  receives = "final_output_file_path from create_podcast"
  returns = "a POSIX relative path, e.g. \"episodes/0b6f.../0b6f....mp3\""
  stores = "the updated episode row (audio_file, transcript, outline)"
  tables = ["episode"]
  note = "podcast-creator reports a failure to combine the audio inside its result, as an \"ERROR: ...\" string. The command checks for it first, saves the transcript and outline anyway, and then fails the job with the real error, so an episode with no audio is never reported as a success."

[[journeys]]
id = "search"
title = "Search sources and notes"
actor = "user · web UI"
trigger = "POST /api/search"
summary = "A query runs either as SurrealDB full-text search (BM25 with highlights) or as a vector search. The vector search first turns the query into an embedding with the default embedding model. Both call one SurrealQL function, can be limited to chosen notebooks, and return one ranked list of matches from sources, source insights and notes."
  [[journeys.steps]]
  symbol = "api.routers.search:search_knowledge_base"
  actor = "web UI"
  action = "Checks the notebook scope and then picks the path from `type`. A vector search is refused with 400 if no default embedding model is set."
  receives = "SearchRequest {query, type: text|vector, limit 1–1000 (default 100), search_sources, search_notes, minimum_score 0–1 (default 0.2), scope_notebook_ids}"
  returns = "SearchResponse {results[], total_count, search_type}. InvalidInputError → 400, NotFoundError → 404, DatabaseOperationError → 500"
  stores = "nothing"
  payload = '''
{"query": "inverter warranty", "type": "vector", "limit": 20, "search_sources": true, "search_notes": true, "minimum_score": 0.3, "scope_notebook_ids": ["notebook:k3x9"]}

'''
  [[journeys.steps]]
  symbol = "open_notebook.domain.notebook:resolve_notebook_scope"
  action = "Accepts only ids of the form `notebook:<key>` and checks with one query that every one of them exists. An empty scope means search everywhere."
  receives = "scope_notebook_ids (list of strings, may be empty)"
  returns = "the same list, or [] for a global search. Raises InvalidInputError (bad id) or NotFoundError (missing notebook)"
  stores = "nothing"
  tables = ["notebook"]
  note = "This check runs before the search so that a source or note id fails here with a clear error, instead of failing inside SurrealDB's typed record<notebook> parameter."
  [[journeys.steps]]
  symbol = "open_notebook.ai.models:ModelManager.get_embedding_model"
  action = "Reads the default embedding model from the default-models record and builds it through ModelManager.get_model (credential config → esperanto AIFactory.create_embedding)."
  receives = "–"
  returns = "an esperanto EmbeddingModel, or None if no default is set"
  stores = "nothing"
  tables = ["model"]
  [[journeys.steps]]
  symbol = "open_notebook.domain.notebook:vector_search"
  action = "Embeds the query and calls `fn::vector_search`. That function scores `source_embedding` chunks, `source_insight` rows and `note` rows by cosine similarity, filters them by minimum_score and the notebook scope, and groups the hits by record. The rows are sorted again by similarity in Python."
  receives = "keyword, results, source, note, minimum_score, notebook_ids"
  returns = "list of {id, parent_id, title, similarity, matches[]}, best first"
  stores = "nothing"
  tables = ["source_embedding", "source_insight", "note", "reference", "artifact"]
  payload = '''
[{"id": "source_embedding:a1", "parent_id": "source:s7", "title": "Home solar guide", "similarity": 0.81, "matches": ["The inverter carries a 10-year warranty..."]}]

'''
  note = "The sort is repeated in Python because the `SELECT * FROM fn::...` wrapper can return rows out of rank order, even though the function itself orders by similarity."
  [[journeys.steps]]
  symbol = "open_notebook.utils.embedding:generate_embedding"
  action = "Embeds a short query in one call. A query longer than CHUNK_SIZE tokens is split into chunks, each chunk is embedded, and the vectors are averaged (mean pooling)."
  receives = "text"
  returns = "one vector (list of floats)"
  stores = "nothing"
  [[journeys.steps]]
  symbol = "open_notebook.utils.embedding:generate_embeddings"
  action = "Sends the text to the provider through `embedding_model.aembed`, in batches of EMBEDDING_BATCH_SIZE. Each batch is retried up to EMBEDDING_MAX_RETRIES times."
  receives = "texts[]"
  returns = "list of vectors, one per text. Raises ValueError if no model is configured, RuntimeError once the retries run out"
  stores = "nothing"
  [[journeys.steps]]
  symbol = "open_notebook.domain.notebook:text_search"
  action = "The text path. It calls `fn::text_search`, which runs BM25 matches (`@1@`) over source titles, source full text, embedded chunks, insights, note titles and note content. Each hit gets a highlighted snippet, and the results are merged into one list by relevance."
  receives = "keyword, results, source, note, notebook_ids"
  returns = "list of {id, parent_id, title, relevance}"
  stores = "nothing"
  tables = ["source", "source_embedding", "source_insight", "note", "reference", "artifact"]
  payload = '''
[{"id": "source:s7", "parent_id": "source:s7", "title": "Home solar guide", "relevance": 4.2}]

'''
  note = "SurrealDB's search::highlight can fail with \"position overflow\" on large or multi-byte chunks. In that case the function falls back to vector_search (issue #648), and it raises only if that fallback fails too, so a total outage does not look like zero results."

[[journeys]]
id = "configure-models"
title = "Add a provider credential and register its models"
actor = "admin · web UI (Settings → Models)"
trigger = "POST /api/credentials → POST /api/credentials/{id}/discover → POST /api/credentials/{id}/register-models (or POST /api/models/sync/{provider})"
summary = "An admin saves a provider credential, with the API key encrypted at rest, asks the provider which models it offers, and registers the chosen ones as `model` rows linked to that credential. Later, any graph that needs an LLM calls provision_langchain_model, which picks a `model` row, builds the client through esperanto's AIFactory with the credential's config, and hands back a LangChain chat model."
  [[journeys.steps]]
  symbol = "api.routers.credentials:create_credential"
  actor = "web UI"
  action = "Refuses the request if OPEN_NOTEBOOK_ENCRYPTION_KEY is not set (require_encryption_key). It checks every URL field with validate_url, then builds and saves a Credential."
  receives = "CreateCredentialRequest {name, provider, modalities[], api_key, base_url, endpoint*, api_version, project, location, credentials_path, num_ctx}"
  returns = "201 CredentialResponse (never includes api_key) with linked model count 0"
  stores = "a credential row (next step)"
  tables = ["credential"]
  payload = '''
{"name": "Team OpenAI", "provider": "openai", "modalities": ["language", "embedding"], "api_key": "sk-invented-123"}

'''
  [[journeys.steps]]
  symbol = "open_notebook.domain.credential:Credential.save"
  action = "Saves the credential. Its _prepare_save_data encrypts the API key with Fernet (encrypt_value) and moves extra fields such as num_ctx into the `config` object. After the save, the in-memory key is put back as a SecretStr."
  receives = "Credential with api_key as SecretStr"
  returns = "the saved Credential with an id"
  stores = "credential row: provider, modalities, encrypted api_key, URLs, config"
  tables = ["credential"]
  payload = '''
{"name": "Team OpenAI", "provider": "openai", "api_key": "gAAAAAB...invented-ciphertext", "config": null}

'''
  [[journeys.steps]]
  symbol = "api.routers.credentials:discover_models_for_credential"
  action = "Loads the credential, turns it into an esperanto config with to_esperanto_config, and asks the provider for its models."
  receives = "credential_id"
  returns = "DiscoverModelsResponse {credential_id, provider, discovered[{name, provider, description}]}"
  stores = "nothing"
  tables = ["credential"]
  [[journeys.steps]]
  symbol = "api.credentials_service:discover_with_config"
  action = "Lists the provider's models with this credential's key. A provider without a listing API uses a fixed list (voyage, elevenlabs, deepgram). The others call the provider's /models endpoint or esperanto. Only model names come back; the admin picks each model's type when registering."
  receives = "provider, config {api_key, base_url, ...}"
  returns = "list of {name, provider, description?}"
  stores = "nothing"
  payload = '''
[{"name": "gpt-4o-mini", "provider": "openai"}, {"name": "text-embedding-3-small", "provider": "openai"}]

'''
  [[journeys.steps]]
  symbol = "api.routers.credentials:register_models_for_credential"
  actor = "web UI"
  action = "Takes the models the admin ticked, each with a chosen type, and passes them to the service."
  receives = "credential_id, RegisterModelsRequest {models[{name, provider, model_type}]}"
  returns = "RegisterModelsResponse {created, existing}"
  stores = "model rows (next step)"
  payload = '''
{"models": [{"name": "gpt-4o-mini", "provider": "openai", "model_type": "language"}, {"name": "text-embedding-3-small", "provider": "openai", "model_type": "embedding"}]}

'''
  [[journeys.steps]]
  symbol = "api.credentials_service:register_models"
  action = "Fetches the provider's existing (name, type) pairs in one query, skips pairs that already exist, and saves a new `model` row for each remaining pair, linked to this credential."
  receives = "credential_id, models_data"
  returns = "{created, existing}"
  stores = "new model rows with credential = this credential"
  tables = ["credential", "model"]
  note = "A model that already exists counts as `existing` and is not re-linked. If it was first registered without a credential, or with another one, it keeps that link."
  [[journeys.steps]]
  symbol = "api.routers.models:sync_models"
  actor = "web UI"
  action = "The other way in, without choosing a credential. It first copies the provider's first DB credential into environment variables, then runs the env-based discovery and registers everything it finds."
  receives = "provider (path)"
  returns = "ProviderSyncResponse {provider, discovered, new, existing}"
  stores = "model rows (via sync_provider_models)"
  tables = ["model"]
  [[journeys.steps]]
  symbol = "open_notebook.ai.key_provider:provision_provider_keys"
  action = "Takes the oldest credential for the provider and writes its fields into os.environ: the key for simple providers, and the extra settings for vertex, azure and the *-compatible providers. Environment variables already set are left alone when the DB has no credential."
  receives = "provider"
  returns = "True if any variable was set from the DB"
  stores = "process environment variables (not the DB)"
  tables = ["credential"]
  note = "This changes the process environment, so the most recent provisioning wins for the whole process (open_notebook/AGENTS.md says the same)."
  [[journeys.steps]]
  symbol = "open_notebook.ai.model_discovery:sync_provider_models"
  action = "Runs the provider's discovery function, which reads the key from the environment and gives each model a type by name. It then saves a `model` row for every (name, type) pair not already stored."
  receives = "provider, auto_register=True"
  returns = "(discovered_count, new_count, existing_count)"
  stores = "new model rows with no credential link"
  tables = ["model"]
  [[journeys.steps]]
  symbol = "open_notebook.ai.provision:provision_langchain_model"
  actor = "a LangGraph node (ask, chat, source_chat, transformation, prompt)"
  action = "Later, at call time, it chooses which model to use. If the content is over 105,000 tokens, it uses the large_context default. Otherwise it uses the explicit model_id, or else the default for the requested type. It checks that the result is a LanguageModel and converts it with to_langchain()."
  receives = "content, model_id or None, default_type (e.g. \"chat\", \"transformation\"), **kwargs such as max_tokens"
  returns = "a LangChain BaseChatModel. Raises ConfigurationError if nothing is configured or the model is not a language model"
  stores = "nothing"
  tables = ["model"]
  note = "Content over the size limit overrides the model_id the user picked. The docstring states this on purpose."
  [[journeys.steps]]
  symbol = "open_notebook.ai.models:ModelManager.get_model"
  action = "Loads the `model` row and checks its type. If a credential is linked, it uses that credential's to_esperanto_config, after checking its URLs again. Otherwise it calls provision_provider_keys. Then it builds the client with AIFactory.create_language / create_embedding / create_speech_to_text / create_text_to_speech."
  receives = "model_id, **kwargs"
  returns = "an esperanto model instance (esperanto caches it)"
  stores = "nothing (may set os.environ via the fallback)"
  tables = ["model", "credential"]
  payload = '''
AIFactory.create_language(model_name="gpt-4o-mini", provider="openai", config={"api_key": "sk-invented-123", "max_tokens": 2000})

'''
  note = "The DB stores provider names with underscores (openai_compatible), but esperanto expects hyphens, so the name is rewritten here. anthropic_compatible takes its own route through resolve_anthropic_compatible_config."

