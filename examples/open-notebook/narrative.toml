[[findings]]
id = "link-source-idempotency-reversed"
severity = "medium"
category = "risk"
title = "Linking an existing source to a notebook checks for a duplicate with in/out swapped, so every call adds another edge"
detail = "True now: add_source_to_notebook looks for an existing edge with `out = $source_id AND in = $notebook_id`, but reference edges are created source->reference->notebook (in = source, out = notebook), as Source.add_to_notebook, Notebook.get_sources and remove_source_from_notebook all assume. The check never matches. Trigger: POST /notebooks/{nb}/sources/{src} for a source that is already in that notebook (a double click, a retried request, or the frontend's add-to-notebook call on an already-linked source). Reach: a second `reference` row for the pair, so Notebook.get_sources returns the source twice in that notebook's list and context; no unique index on reference stops it. Removing the source deletes all copies, so nothing is lost."
symbols = ["api.routers.notebooks:add_source_to_notebook", "api.routers.notebooks:remove_source_from_notebook", "open_notebook.domain.notebook:Notebook.get_sources"]
evidence = "Read add_source_to_notebook (SELECT … WHERE out = $source_id AND in = $notebook_id, then RELATE $source_id->reference->$notebook_id), remove_source_from_notebook (WHERE out = $notebook_id AND in = $source_id) and Notebook.get_sources (select in as source from reference where out=$id). grep for UNIQUE in migrations finds only the episode/speaker profile name indexes. frontend/src/lib/api/notebooks.ts calls this POST route."
check = {kind = "text_in", pattern = "out = \\$source_id AND in = \\$notebook_id"}

[[findings]]
id = "doc-reference-direction"
severity = "low"
category = "doc vs code"
title = "Architecture doc says reference/artifact have out = source/note and in = notebook; the code uses the opposite"
detail = "docs/7-DEVELOPMENT/architecture.md lists `reference | out (source), in (notebook)` and `artifact | out (note), in (notebook)`. The code relates source->reference->notebook and note->artifact->notebook, so in = source/note and out = notebook, and every working query (get_sources, get_notes, Notebook.delete) filters on `out = notebook`. Trigger: a contributor writes a new query from the doc. Reach: that query silently returns nothing — exactly the bug in add_source_to_notebook's duplicate check. The same doc's sample query (`count(<-reference.in)… WHERE notebook = $notebook_id`) uses fields the source table does not have."
symbols = ["open_notebook.domain.notebook:Notebook.get_sources", "open_notebook.domain.notebook:Source.add_to_notebook"]
evidence = "architecture.md 'Core Tables' table and 'Query Example'; migration 1 defines `reference TYPE RELATION FROM source TO notebook` and `artifact … FROM note TO notebook`; Source.add_to_notebook calls self.relate('reference', notebook_id); Notebook.get_sources uses `where out=$id`."

[[findings]]
id = "doc-connection-pooling"
severity = "low"
category = "doc vs code"
title = "Docs promise async connection pooling and transactions; every repo_* call opens, signs in and closes its own connection"
detail = "architecture.md says 'Async connection pooling (configurable size)' and 'Transaction support for multi-record operations'. db_connection creates a new AsyncSurreal, signs in and selects the namespace on every call, and repo_query/repo_create/repo_update/repo_delete each use their own; there is no pool and no pool-size setting. Trigger: any multi-step operation — Notebook.delete issues one connection per note, per source and per chat session. Reach: extra latency on every request (not measured), and multi-record operations are not atomic (see the notebook-delete finding)."
symbols = ["open_notebook.database.repository:db_connection", "open_notebook.database.repository:repo_query"]
evidence = "Read db_connection (AsyncSurreal(get_database_url()), signin, use, close in finally) and repo_query/repo_create/repo_delete (each `async with db_connection()`); repo_insert is the only helper that reuses one connection across batches. No BEGIN/COMMIT in the repository module."
check = {kind = "text_in", pattern = "AsyncSurreal\\("}

[[findings]]
id = "notebook-delete-not-atomic"
severity = "medium"
category = "risk"
title = "Deleting a notebook is a hard, multi-step delete with no transaction; docs describe soft delete"
detail = "True now: Notebook.delete deletes notes one by one, then artifact edges, optionally exclusive sources (each Source.delete also unlinks the uploaded file), then reference edges, chat sessions and finally the notebook, each step a separate connection. architecture.md says 'Soft deletes via archived field (data not removed, just marked inactive)' — archiving is a separate flag on update_notebook; DELETE /notebooks/{id} removes data. Trigger: a database error or timeout part-way through (exclusive-source failures are only logged and skipped). Reach: one notebook left half-deleted — notes already gone, the notebook row still there — and the caller gets a 500 with no record of what was removed."
symbols = ["open_notebook.domain.notebook:Notebook.delete", "api.routers.notebooks:delete_notebook"]
evidence = "Read Notebook.delete end to end (note.delete loop, DELETE artifact, Source.delete loop with logger.warning on failure, DELETE reference, chat_session.delete loop, super().delete()) and ObjectModel.delete → repo_delete. architecture.md 'Important Quirks & Gotchas' → Database Operations."
check = {kind = "text_in", pattern = "super\\(\\)\\.delete\\(\\)"}

[[findings]]
id = "chat-delete-leaves-checkpoint"
severity = "low"
category = "risk"
title = "Deleting a chat session leaves its messages in the LangGraph SQLite checkpoint"
detail = "True now: chat messages are not stored in chat_session; the chat and source-chat graphs checkpoint them to LANGGRAPH_CHECKPOINT_FILE (data/sqlite-db/checkpoints.sqlite) under thread_id = session id. delete_session, delete_source_chat_session and Notebook.delete only delete the SurrealDB row. Source.delete does not touch the source's chat sessions at all, so those rows remain too, reachable from no list. Trigger: a user deletes a conversation or its notebook/source expecting it to be gone. Reach: the full conversation text stays on disk and checkpoints.sqlite only grows. architecture.md also describes chat_session as holding 'messages (JSON)' and a notebook_id field, which it does not."
symbols = ["api.routers.chat:delete_session", "api.routers.source_chat:delete_source_chat_session", "open_notebook.domain.notebook:Source.delete"]
evidence = "Read open_notebook/graphs/chat.py and source_chat.py (SqliteSaver(sqlite3.connect(LANGGRAPH_CHECKPOINT_FILE)), compile(checkpointer=memory)), api.routers.chat:get_session (messages from chat_graph.get_state with thread_id), delete_session (session.delete() only). grep for delete_thread in api/ and open_notebook/ finds nothing."
check = {kind = "text_in", pattern = "\\A(?![\\s\\S]*delete_thread)"}

[[findings]]
id = "retry-episode-deletes-first"
severity = "medium"
category = "risk"
title = "Retrying a failed podcast deletes the episode before checking the new job can be queued"
detail = "True now: retry_podcast_episode deletes the audio file and the episode row, then calls submit_generation_job with the episode and speaker profile names stored in the row. submit_generation_job looks the profiles up by name and raises ValueError if either is missing. Trigger: retrying after a profile was renamed or deleted (or any queueing error). Reach: the failed episode — including its briefing, input content and any transcript/outline that was saved before the audio step failed — is gone, and no new job exists."
symbols = ["api.routers.podcasts:retry_podcast_episode", "api.podcast_service:PodcastService.submit_generation_job"]
evidence = "Read retry_podcast_episode (_delete_episode_audio, await episode.delete(), then PodcastService.submit_generation_job(...)) and submit_generation_job (EpisodeProfile.get_by_name / SpeakerProfile.get_by_name → raise ValueError(... not found)). generate_podcast_command saves transcript/outline before raising on an audio error."
check = {kind = "text_in", pattern = "(?s)await episode\\.delete\\(\\).*submit_generation_job"}

[[findings]]
id = "create-insight-retry-duplicates"
severity = "low"
category = "risk"
title = "create_insight can write the same insight twice when queueing its embedding fails"
detail = "True now: create_insight_command CREATEs the source_insight row and then calls submit_command('embed_insight') inside the same try; any non-ValueError exception is re-raised so surreal-commands retries the whole command (up to 5 attempts), which runs CREATE again. Trigger: the CREATE commits but submitting embed_insight fails transiently (the transaction conflicts this command exists to absorb). Reach: duplicate insight rows for one source, each shown in the source's insights list; only one may get an embedding."
symbols = ["commands.embedding_commands:create_insight_command"]
evidence = "Read create_insight_command (repo_query CREATE source_insight …; submit_command('open_notebook','embed_insight',…); except Exception: raise) and EMBED_RETRY_CONFIG (max_attempts 5, stop_on ValueError/ConfigurationError/ContextLengthExceededError)."
check = {kind = "text_in", pattern = "(?s)CREATE source_insight.*submit_command\\("}

[[findings]]
id = "embed-failures-report-completed"
severity = "low"
category = "risk"
title = "embed_note / embed_insight / embed_source report a permanent failure as a completed job"
detail = "True now: _embed_record catches ValueError (record not found, no content) and returns an error_message instead of raising, so the job ends `completed` with success=false in its payload. process_source_command was changed to re-raise for exactly this reason (its comment: is_success() checks job status, not the payload). The embedding module's own NOTE admits stop_on can never trigger. Trigger: a note, insight or source with empty content, or deleted before its embed job runs. Reach: the record silently has no embedding and never appears in vector search; nothing in command status shows the failure."
symbols = ["commands.embedding_commands:_embed_record", "commands.source_commands:process_source_command"]
evidence = "Read _embed_record (except ValueError → return None, processing_time, str(e)), embed_note_command (success=error_message is None) and the comment block in process_source_command's except ValueError branch; NOTE above EMBED_RETRY_CONFIG."
check = {kind = "text_in", pattern = "return None, processing_time, str\\(e\\)"}

