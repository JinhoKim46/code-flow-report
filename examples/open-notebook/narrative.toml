purpose = "The single database for notebooks, sources, notes, insights, embeddings, models, credentials, chat sessions and the background-command queue. Every read and write goes through a handful of repo_* functions in open_notebook.database.repository, so the domain classes never talk to the SurrealDB SDK directly."
input = "SurrealQL strings with bound variables ($source, $target, $data …). Table and edge names cannot be bound, so repo_relate / repo_upsert / repo_update check them against an identifier allowlist (_ensure_safe_identifier) before interpolating. Vector and full-text search run as stored functions (fn::vector_search, fn::text_search) defined in the migrations."
message = ["connect: AsyncSurreal(url) over WebSocket, a new connection per call (db_connection opens, signs in, selects namespace + database, closes)", "signin: username + password", "use: namespace, database", "query / insert / delete: one statement per repo_* call; repo_insert sends rows in batches of 50 on one connection"]
config = "SURREAL_URL (or the older SURREAL_ADDRESS + SURREAL_PORT), SURREAL_USER, SURREAL_PASSWORD (or SURREAL_PASS), SURREAL_NAMESPACE, SURREAL_DATABASE. ensure_internal_no_proxy() runs at import so the DB websocket bypasses any HTTP proxy."
output = "Rows as dicts; parse_record_ids turns every RecordID into a 'table:id' string. A string result is treated as an error message and raised as RuntimeError (repo_query, repo_create, repo_insert)."
validation = "No retry in the repository itself. Transaction conflicts surface as RuntimeError and are retried one level up by the surreal-commands retry policy of the background command that caused them. Schema changes: 25 numbered .surrealql files (plus _down files) listed in AsyncMigrationManager; the API lifespan waits for the DB to answer (_wait_for_database, exponential back-off) and then runs every pending migration, recording each in the _sbl_migrations table."
logging = "loguru: conflicts at debug, other failures with logger.exception. Migrations log the version before and after."
cost = "not measured. No connection pool: each repo_* call pays a full connect + signin round trip (the code says so in Model.get_display_info_for_ids, which batches lookups for that reason)."
result_use = "Domain classes (ObjectModel / RecordModel in open_notebook.domain.base) wrap the rows into Pydantic objects; routers return them as JSON."

