input = "Episode profile (briefing, segments, outline_llm, transcript_llm) and speaker profile (speakers, voices, voice_model) from SurrealDB; the content and an optional briefing_suffix from the request. Prompt templates: prompts/podcast/outline.jinja and transcript.jinja (the code comment states podcast-creator uses these file-based templates; configure('templates', …) is deliberately never called)."
message = ["configure('speakers_config' / 'episode_config', all profiles with resolved provider, model and config)", "create_podcast(content, briefing, episode_name, output_dir, speaker_config, episode_profile)"]
config = "EpisodeProfile.outline_llm / transcript_llm and SpeakerProfile.voice_model (Model ids, optionally per speaker); keys via the model's Credential or the provider env var (_resolve_model_config)."
output = "final_output_file_path, transcript and outline."
validation = "Missing profile or model → ValueError (no retry; the command allows 1 attempt). An 'ERROR:' string in final_output_file_path is detected; transcript and outline are saved first, then the job fails with the audio error. Invalid-JSON errors get a hint about reasoning models."
logging = "loguru info for resolved models, output dir and timing."
cost = "not measured"
result_use = "PodcastEpisode record gets audio_file (relative to PODCASTS_FOLDER), transcript and outline."

[[roles]]
id = "credentials-store"
name = "Provider credentials (encrypted API keys)"
kind = "record"
symbols = ["open_notebook.domain.credential:Credential._prepare_save_data", "open_notebook.domain.credential:Credential.get", "open_notebook.utils.encryption:encrypt_value", "open_notebook.utils.encryption:decrypt_value", "open_notebook.ai.key_provider:provision_provider_keys"]
purpose = "Stores one record per provider account in the credential table so users can add API keys in the UI instead of env vars; api_key is encrypted at rest."
input = "Credential fields: name, provider, modalities, api_key (SecretStr), base_url, endpoint, api_version, endpoint_llm / _embedding / _stt / _tts, project, location, credentials_path, config (num_ctx)."
message = ["save: api_key → encrypt_value → 'pbkdf2v1:' + Fernet token", "load: Credential.get / get_all → decrypt_value → SecretStr"]
config = "OPEN_NOTEBOOK_ENCRYPTION_KEY or OPEN_NOTEBOOK_ENCRYPTION_KEY_FILE (any passphrase; a Fernet key is derived with PBKDF2-HMAC-SHA256, 600,000 iterations, fixed app salt). Fallback when a model has no credential: provider env vars listed in key_provider.PROVIDER_CONFIG."
output = "to_esperanto_config() → dict with api_key, base_url, endpoints … handed to AIFactory."
validation = "Missing encryption key → ValueError on first encrypt/decrypt (the API only warns at startup). Values written before the PBKDF2 scheme still decrypt via a legacy path; unmarked text that does not look like a Fernet token is treated as legacy plaintext. get_all marks undecryptable rows with decryption_error instead of failing the list. URLs are validated on save and again before each use."
logging = "Errors only; the key value is never logged (SecretStr)."
cost = "PBKDF2 derivation once per process (Fernet instance cached)."
result_use = "ModelManager.get_model builds provider config from it. For models without a linked credential, provision_provider_keys copies the provider's first credential into process environment variables (os.environ) before calling esperanto."

[[roles]]
id = "api-password"
name = "API password gate"
kind = "external"
symbols = ["api.auth:PasswordAuthMiddleware.dispatch"]
purpose = "The only authentication: a single shared password checked on every API request. There are no user accounts or roles."
input = "Authorization: Bearer <password> header."
message = ["header: Authorization: Bearer <password>"]
config = "OPEN_NOTEBOOK_PASSWORD or OPEN_NOTEBOOK_PASSWORD_FILE. Unset → auth fully disabled. Excluded paths set in api.main: /, /health, /docs, /openapi.json, /redoc, /api/auth/status, /api/config; OPTIONS requests always pass."
output = "The request continues, or 401 (missing header, wrong scheme, wrong password)."
validation = "Constant-time comparison (secrets.compare_digest). No lockout or rate limit."
logging = "none"
cost = "none"
result_use = "Gatekeeper only; nothing downstream knows who the caller is."

[[input_flows]]
id = "in-execute-chat"
source = "Chat message plus the client-built context (POST /api/chat/execute)"
sink = "the LangGraph SQLite checkpoint (question and reply) and the chat model prompt"
  [[input_flows.steps]]
  symbol = "api.routers._chat_shared:get_session_or_404"
  guard = "The session id is normalised and must exist (404)"
  [[input_flows.steps]]
  symbol = "api.routers.chat:execute_chat"
  guard = "No check on the message (an empty string is accepted) or on the context dict, which goes into the system prompt as sent; the question gets an explicit uuid so it can be rolled back"
  [[input_flows.steps]]
  symbol = "open_notebook.graphs.chat:call_model_with_messages"
  guard = "Context is placed in the prompts/chat/system template as a variable; <think> content is stripped and an empty reply is refused so it is never saved"
  [[input_flows.steps]]
  symbol = "open_notebook.utils.graph_utils:invoke_chat_turn"
  guard = "On failure the unanswered question is removed from the checkpoint (discard_unanswered_message)"

[[input_flows]]
id = "in-upload-file"
source = "Uploaded file (multipart `file` on POST /api/sources, type=upload)"
sink = "a file in UPLOADS_FOLDER, then source.full_text, `source_embedding` chunks and `source_insight` rows"
  [[input_flows.steps]]
  symbol = "api.middleware:MaxBodySizeMiddleware"
  guard = "Rejects a request body over OPEN_NOTEBOOK_MAX_UPLOAD_SIZE_MB (default 100) before auth or routing"
  [[input_flows.steps]]
  symbol = "api.routers.sources:parse_source_form_data"
  guard = "The notebooks and transformations JSON strings must parse (422 otherwise); SourceCreate caps both lists at 50 and refuses notebook_id and notebooks together"
  [[input_flows.steps]]
  symbol = "api.routers.sources:generate_unique_filename"
  guard = "Keeps only the basename, refuses a resolved path outside the uploads folder, and claims the name atomically so a concurrent upload with the same name gets 'name (1).ext'"
  [[input_flows.steps]]
  symbol = "api.routers.sources:_build_content_state"
  guard = "The final path must resolve inside UPLOADS_FOLDER (stops a caller-supplied file_path from reading other files); content-core's header check must call the file supported (415 otherwise)"
  [[input_flows.steps]]
  symbol = "open_notebook.graphs.source:content_process"
  guard = "Content-core's soft-failure result and empty text become ValueError, so the job fails and can be retried instead of saving the error text as content; with delete_source set, the uploaded file is deleted"
  [[input_flows.steps]]
  symbol = "commands.embedding_commands:embed_source_command"
  guard = "Refuses empty text; deletes old chunks first and cleans up a partial insert, so the chunk set is all or nothing"

[[input_flows]]
id = "in-source-url"
source = "URL typed by the user (POST /api/sources, type=link)"
sink = "an outbound fetch by content-core in the worker, then source.asset.url and source.full_text"
  [[input_flows.steps]]
  symbol = "api.routers.sources:_build_content_state"
  guard = "A URL is required for type=link; it goes to validate_url before any fetch"
  [[input_flows.steps]]
  symbol = "open_notebook.utils.url_validation:validate_url"
  guard = "Only http/https; refuses link-local (169.254.x.x) and the AWS IPv6 metadata address, also when a hostname resolves to them. Private ranges and localhost are allowed on purpose (self-hosted services); a name that does not resolve is let through"
  [[input_flows.steps]]
  symbol = "open_notebook.graphs.source:content_process"
  guard = "The engine comes from ContentSettings, falling back to 'auto' when the opt-in runtime is missing. An unreachable page or an empty transcript raises ValueError (a YouTube video without a transcript gets a hint to set up speech-to-text)"
  [[input_flows.steps]]
  symbol = "open_notebook.graphs.source:save_source"
  guard = "Keeps a title the user typed; replaces only the 'Processing...' placeholder or an empty title"

[[input_flows]]
id = "in-ask-question"
source = "Question typed on the Ask page (POST /api/search/ask)"
sink = "three model prompts and an embedding call; the answer goes back as SSE and is not stored"
  [[input_flows.steps]]
  symbol = "open_notebook.domain.notebook:resolve_notebook_scope"
  guard = "The scope must contain only existing notebook:<key> ids, so a typo cannot make the search silently empty"
  [[input_flows.steps]]
  symbol = "api.routers.search:ask_knowledge_base"
  guard = "All three model ids must exist and an embedding model must be configured (400 otherwise); the question text itself has no length check here"
  [[input_flows.steps]]
  symbol = "open_notebook.graphs.ask:call_model_with_messages"
  guard = "The model's strategy must parse as Strategy JSON; blank search terms are dropped, and a strategy with none left is an error"
  [[input_flows.steps]]
  symbol = "open_notebook.domain.notebook:vector_search"
  guard = "An empty keyword is InvalidInputError; matches below similarity 0.2 are dropped; the query is parameterised ($embed, $notebook_ids), never string-built"
  [[input_flows.steps]]
  symbol = "open_notebook.ai.provision:provision_langchain_model"
  guard = "Over 105,000 tokens the large_context model replaces the chosen one; a missing or non-language model is ConfigurationError"

[[input_flows]]
id = "in-model-output"
source = "Text returned by language models (transformations, chat replies, Ask answers)"
sink = "`source_insight` rows, the chat checkpoint, or the browser (SSE / JSON)"
  [[input_flows.steps]]
  symbol = "open_notebook.graphs.transformation:run_transformation"
  guard = "Refuses an answer stopped at the token limit (finish_reason length / max_tokens) and an answer that is empty after removing <think> content, so a truncated insight is never saved"
  [[input_flows.steps]]
  symbol = "open_notebook.domain.notebook:Source.add_insight"
  guard = "insight_type and content must be non-empty; a failure to queue the job is raised as an error, not swallowed"
  [[input_flows.steps]]
  symbol = "commands.embedding_commands:create_insight_command"
  guard = "Parameterised CREATE source_insight; transaction conflicts are retried (5 attempts)"
  [[input_flows.steps]]
  symbol = "open_notebook.graphs.chat:call_model_with_messages"
  guard = "Thinking content is stripped before the AIMessage is saved; citation ids in the reply are not checked against real records"
  [[input_flows.steps]]
  symbol = "api.routers.search:stream_ask_response"
  guard = "Each answer is sent with json.dumps inside an SSE data line; errors go out as a typed message, with raw provider errors classified first"

[[entities]]
id = "source"
name = "Source"
table = "source"
summary = "One row = one piece of input content (uploaded file, URL or pasted text): its asset (url or file_path), extracted full_text, title, topics, and `command` pointing at the surreal-commands job that processed it."
  [[entities.events]]
  stage = "born"
  symbol = "api.routers.sources:_create_source_async_path"
  by = "user · POST /sources (async_processing=true)"
  text = "Saved with title 'Processing...' and the asset, linked to its notebooks at once, then a process_source job is queued and its id stored in `command`. If queueing fails the row is deleted again."
  [[entities.events]]
  stage = "born"
  symbol = "api.routers.sources:_create_source_sync_path"
  by = "user · POST /sources (async_processing=false, the default)"
  text = "Same placeholder row, but process_source runs in a thread with a 300 s timeout; on failure the row is deleted and a 500 returned."
  [[entities.events]]
  stage = "transform"
  symbol = "open_notebook.graphs.source:save_source"
  by = "process_source job"
  text = "Writes the extracted text and asset, replaces a placeholder title with the extracted one, and submits embed_source when embedding was requested."
  [[entities.events]]
  stage = "update"
  symbol = "api.routers.sources:update_source"
  by = "user · PUT /sources/{id}"
  text = "Title and topics changed and saved."
  [[entities.events]]
  stage = "read"
  symbol = "api.routers._chat_shared:get_source_or_404"
  by = "source chat routes"
  text = "Normalises the id and loads the source, 404 when missing."
  [[entities.events]]
  stage = "delete"
  symbol = "open_notebook.domain.notebook:Source.delete"
  by = "user · DELETE /sources/{id}, or Notebook.delete for exclusive sources"
  text = "Unlinks the uploaded file, deletes its source_embedding and source_insight rows, then the row. The `source_delete` event from migration 1 deletes the same child rows again on the database side."

[[entities]]
id = "model"
name = "Model"
