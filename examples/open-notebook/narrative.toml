[[findings]]
id = "default-transformation-prompt-ignored"
severity = "medium"
category = "risk"
title = "The saved default transformation instructions are never applied"
detail = "True now: the UI and API let users store default instructions to prepend to every transformation (PUT /transformations/default-prompt → DefaultPrompts record, seeded by migration 5), but run_transformation builds DefaultPrompts(transformation_instructions=None) instead of loading it, so the value is always None and nothing is prepended. Because DefaultPrompts is a process-wide singleton, that constructor call also overwrites the cached instance, so a later GET of the default prompt in the same process can return empty until restart. Trigger: any transformation run. Reach: every insight and every /transformations/execute call; no data is lost."
symbols = ["open_notebook.graphs.transformation:run_transformation"]
evidence = "Read open_notebook.graphs.transformation:run_transformation (DefaultPrompts(transformation_instructions=None), no get_instance call), open_notebook.domain.base:RecordModel.__new__ (kwargs are set on the cached instance) and api.routers.transformations (GET/PUT default-prompt use DefaultPrompts.get_instance and update)."
check = {kind = "text_in", pattern = "DefaultPrompts\\(\\s*transformation_instructions=None"}

[[findings]]
id = "cancel-job-noop"
severity = "low"
category = "risk"
title = "DELETE /commands/jobs/{id} reports cancelled without cancelling"
detail = "True now: CommandService.cancel_command_job only logs and returns True, so the endpoint answers {cancelled: true} while the job keeps running. list_command_jobs likewise always returns []. Trigger: a client relying on the cancel response. Reach: that endpoint only; the job finishes normally."
symbols = ["api.command_service:CommandService.cancel_command_job"]
evidence = "Read api.command_service:CommandService.cancel_command_job and api.routers.commands:cancel_command_job."
check = {kind = "text_in", pattern = "return True"}

[[findings]]
id = "podcast-skips-url-revalidation"
severity = "low"
category = "risk"
title = "Podcast model config skips the per-call URL re-check the other model paths do"
detail = "True now: ModelManager.get_model calls _revalidate_config_urls on a credential's base_url/endpoints right before use, to narrow a DNS-rebinding window after the credential was saved. The podcast path builds provider config in _resolve_model_config without that call (except for anthropic_compatible, which re-checks inside resolve_anthropic_compatible_config). Trigger: a saved credential host that later resolves to an internal address. Reach: podcast outline, transcript and TTS calls only; URLs are still validated when the credential is saved."
symbols = ["open_notebook.podcasts.models:_resolve_model_config"]
evidence = "Read open_notebook.ai.models:ModelManager.get_model, open_notebook.ai.models:_revalidate_config_urls (docstring explains the TOCTOU reason) and open_notebook.podcasts.models:_resolve_model_config."
check = {kind = "not_calls", target = "open_notebook.ai.models:_revalidate_config_urls"}

[[findings]]
id = "migration-result-unchecked"
severity = "low"
category = "risk"
title = "A migration's query result is not inspected before the version is bumped"
detail = "True now: AsyncMigration.run awaits connection.query(self.sql) and discards the result, then calls bump_version. Elsewhere (repo_query, repo_create, repo_insert) the same SDK is treated as able to return an error string instead of raising. Trigger: a migration statement that SurrealDB reports as failed via the result rather than an exception. Reach: schema state — the version would advance past a migration that did not apply, and it would not be re-run."
symbols = ["open_notebook.database.async_migrate:AsyncMigration.run"]
evidence = "Read open_notebook.database.async_migrate:AsyncMigration.run and bump_version, compared with open_notebook.database.repository:repo_query (isinstance(result, str) → RuntimeError). Not reproduced against a live SurrealDB."
check = {kind = "text_in", pattern = "^\\s*await connection\\.query\\(self\\.sql\\)"}

[[findings]]
id = "migration-newlines-collapsed"
severity = "info"
category = "risk"
title = "Migration files are flattened to one line, which also flattens multi-line strings"
detail = "True now: AsyncMigration.from_file strips every line, drops lines starting with '--' and joins the rest with spaces. Multi-line string literals in a migration (the seeded transformation prompts and default instructions in 5.surrealql) lose their line breaks, and a '//' or '#' comment line outside a string would comment out the rest of the file. No migration has such a comment line today. Reach: seeded prompt formatting; future migrations."
symbols = ["open_notebook.database.async_migrate:AsyncMigration.from_file"]
evidence = "Read AsyncMigration.from_file; grep of migrations/*.surrealql for lines starting with // or # found only lines inside the 5.surrealql prompt strings."
check = {kind = "text_in", pattern = "\" \"\\.join\\(lines\\)"}

[[findings]]
id = "sync-github-version-unused"
severity = "info"
category = "dead code"
title = "get_version_from_github (requests, sync) has no production caller"
detail = "True now: /api/config uses get_version_from_github_async (httpx); the sync requests-based twin is only exported from open_notebook.utils and used by tests. Reach: none at runtime; it keeps requests as a code path to maintain."
