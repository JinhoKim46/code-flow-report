[[findings]]
id = "doc-model-fallback"
severity = "info"
category = "doc vs code"
title = "Docs describe automatic fallback to other or cheaper models; there is none"
detail = "architecture.md says 'Model fallback automatic if primary provider unavailable' and 'Fallback logic tries cheaper models if primary fails'. provision_langchain_model picks exactly one model: the large_context default when the content is over 105,000 tokens (even if a model_id was requested), else the requested model_id, else the default for the type; get_default_model falls back from a missing transformation/tools/large_context default to the chat default. A failing provider raises; nothing retries with another model. Trigger: a reader relying on the doc for resilience. Reach: expectations only."
symbols = ["open_notebook.ai.provision:provision_langchain_model", "open_notebook.ai.models:ModelManager.get_default_model"]
evidence = "Read provision_langchain_model and ModelManager.get_default_model; architecture.md 'LangGraph Workflows' and 'AI Provider Integration' bullets."

[[findings]]
id = "source-retry-duplicates-insights"
severity = "medium"
category = "risk"
title = "A retried process_source job creates the insights from successful transformations again"
detail = "True now: transform_content calls Source.add_insight as soon as its own transformation finishes, and add_insight queues a create_insight job that is not undone. process_source_command retries the whole source_graph (up to 15 attempts) on any error not in stop_on, and RateLimitError, NetworkError and ExternalServiceError from a model call are not in stop_on. Trigger: a source added with two or more transformations where one hits a rate limit or network error while another has already finished. Reach: that source gets duplicate source_insight rows (each embedded again) and every transformation is paid for again on each retry. Embeddings are not affected, because embed_source deletes old chunks first."
symbols = ["open_notebook.graphs.source:transform_content", "commands.source_commands:process_source_command", "open_notebook.domain.notebook:Source.add_insight"]
evidence = "Read graphs.source:transform_content (calls source.add_insight after transform_graph.ainvoke), commands.source_commands process_source @command retry config (max_attempts 15; stop_on ValueError, ConfigurationError, ContextLengthExceededError, IncompleteGenerationError), utils.error_classifier rules (RateLimitError, NetworkError, ExternalServiceError) and Source.add_insight (submit_command('create_insight'), no dedupe)."
check = {kind = "calls", target = "open_notebook.domain.notebook:Source.add_insight"}

[[findings]]
id = "source-url-allows-private-hosts"
severity = "medium"
category = "risk"
title = "A source URL may point at localhost or a private address, which the server will fetch and save as text"
detail = "True now: _build_content_state's comment says it blocks 'SSRF to internal/metadata addresses', but validate_url refuses only non-http(s) schemes, link-local and the AWS IPv6 metadata address. It allows 10.x, 172.16–31.x, 192.168.x and localhost on purpose (for self-hosted model servers), and lets through names that do not resolve. Trigger: anyone who can call POST /api/sources adds a link such as http://127.0.0.1:<port>/ or an internal service address. Reach: whatever answers is saved as source.full_text and can be read back, so any HTTP service the API container can reach on a private network can be read through the app. The cloud metadata endpoint stays blocked."
symbols = ["open_notebook.utils.url_validation:validate_url", "api.routers.sources:_build_content_state"]
evidence = "Read url_validation:validate_url (its docstring lists Private IPs and Localhost as allowed; socket.gaierror is passed) and the comment above the validate_url call in sources:_build_content_state."
check = {kind = "text_in", pattern = "Localhost for local services"}

[[findings]]
id = "large-context-overrides-chosen-model"
severity = "low"
category = "risk"
title = "Over 105,000 tokens, the model the user picked is replaced by the large_context default"
detail = "True now: provision_langchain_model checks token count before model_id, so the explicit Ask, chat or transformation model is ignored for a large prompt. Trigger: a chat whose context includes a long source at 'full content', or a long transformation input. Reach: that call runs on another model without telling the user. If no large_context default is set, it fails with 'No model configured for large_context', even though the user chose a model."
symbols = ["open_notebook.ai.provision:provision_langchain_model"]
evidence = "Read ai.provision:provision_langchain_model: the `tokens > 105_000` branch comes before `elif model_id`."
check = {kind = "text_in", pattern = "tokens > 105_000"}

[[findings]]
id = "notebook-chat-accepts-empty-message"
severity = "low"
category = "risk"
title = "Notebook chat sends an empty message to the model; source chat refuses it"
detail = "True now: ExecuteChatRequest.message has no min_length and execute_chat does not check it, while send_message_to_source_chat returns 400 for an empty message. Trigger: a client posts message=''. Reach: one wasted model call. Providers that reject empty content blocks cause a 500, and invoke_chat_turn then rolls back the question. No data is harmed."
symbols = ["api.routers.chat:ExecuteChatRequest", "api.routers.chat:execute_chat", "api.routers.source_chat:send_message_to_source_chat"]
evidence = "Read api.routers.chat ExecuteChatRequest and execute_chat (no check on request.message) and source_chat:send_message_to_source_chat (`if not request.message: raise HTTPException(400)`)."
check = {kind = "text_in", pattern = "message: str = Field\\(\\.\\.\\., description=\"User message content\"\\)"}

[[findings]]
id = "sync-all-skips-db-credentials"
severity = "medium"
category = "risk"
title = "\"Sync all providers\" never loads DB-stored API keys, unlike the single-provider sync"
detail = "True now: POST /api/models/sync/{provider} calls provision_provider_keys before discovery, but POST /api/models/sync goes straight to sync_all_providers, and the discovery functions read keys only from os.environ (e.g. discover_openai_compatible_provider, discover_anthropic_models). Trigger: a provider whose key exists only as a credential in the DB (the normal setup since credentials moved to the DB), in a process that has not already provisioned that provider for another call. Reach: the frontend's sync-all action (frontend/src/lib/api/models.ts) reports 0 discovered for that provider, and no model rows are created. The per-provider sync and the credential discover/register flow are not affected."
symbols = ["api.routers.models:sync_all_models"]
evidence = "Read api.routers.models:sync_models (calls provision_provider_keys) and api.routers.models:sync_all_models (does not). Read open_notebook.ai.model_discovery:sync_all_providers and the discover_* functions (os.environ.get). grep for provision_all_keys / provision_provider_keys in api/, commands/ and open_notebook/ found no startup call."
check = {kind = "not_calls", target = "open_notebook.ai.key_provider:provision_provider_keys"}

[[findings]]
id = "podcast-missing-profile-500"
severity = "low"
category = "risk"
title = "An unknown episode or speaker profile in podcast generation returns 500, not 404/400"
detail = "True now: submit_generation_job raises ValueError for a missing profile or missing content, but its own `except Exception` turns every error into HTTPException 500 \"Failed to submit podcast generation job\". Trigger: a client sends a misspelled profile name, or neither content nor notebook_id. Reach: only the POST /api/podcasts/generate response. The caller cannot tell bad input from a server fault, and the real reason appears only in the server log."
symbols = ["api.podcast_service:PodcastService.submit_generation_job"]
evidence = "Read api.podcast_service:PodcastService.submit_generation_job: ValueError raised inside the try block is caught by `except Exception` and re-raised as HTTPException(status_code=500). Read api.routers.podcasts:generate_podcast, which passes the HTTPException on unchanged."
check = {kind = "text_in", pattern = "raise ValueError\\(f\"Episode profile '\\{episode_profile_name\\}' not found\"\\)"}

[[findings]]
id = "source-retry-guard-swallowed"
severity = "medium"
category = "risk"
title = "Retrying a source that is still processing is not refused"
detail = "True now: retry_source_processing raises HTTPException(400, 'Source is already processing') inside a try whose `except Exception` only logs a warning, so the guard never reaches the client and a second `process_source` job is queued. Trigger: the user presses Retry (or the frontend re-sends it) while the first job is queued or running. Reach: one source — two jobs extract and transform it at the same time, which can write its insights twice and replace `source.command`, so the status shown follows only the newer job."
symbols = ["api.routers.sources:retry_source_processing"]
evidence = "Read api.routers.sources:retry_source_processing: the status check and its `raise HTTPException(status_code=400, ...)` sit inside `try: ... except Exception as e: logger.warning(...)`; HTTPException subclasses Exception, and execution continues to CommandService.submit_command_job."
check = {kind = "text_in", pattern = "except Exception as e:\\s*\\n\\s*logger\\.warning\\(\\s*\\n?\\s*f\"Failed to check current status"}

[[findings]]
id = "podcast-placeholder-content"
severity = "low"
category = "risk"
title = "A podcast is generated from the text 'Notebook ID: …' when the notebook cannot be loaded"
detail = "True now: when no content is posted and Notebook.get or get_context raises, submit_generation_job logs a warning and sets content to `Notebook ID: <id>`, then queues the job. Trigger: a deleted or mistyped notebook_id, or a database error while building the context. Reach: one episode — the TTS and LLM calls run (and cost money) on a one-line placeholder and the user gets a meaningless episode instead of an error."
symbols = ["api.podcast_service:PodcastService.submit_generation_job"]
evidence = "Read api.podcast_service:PodcastService.submit_generation_job: `except Exception as e: logger.warning(...); content = f\"Notebook ID: {notebook_id}\"`, followed by the non-empty content check and submit_command."
check = {kind = "text_in", pattern = "content = f\"Notebook ID: \\{notebook_id\\}\""}

[[findings]]
id = "note-saved-before-notebook-check"
severity = "low"
category = "risk"
title = "Creating a note with a wrong notebook_id leaves an orphan note"
detail = "True now: create_note calls new_note.save() (which also queues its embedding) before Notebook.get(notebook_id); a missing notebook raises NotFoundError, which the route turns into 404, but the saved note is not removed. Trigger: a stale or wrong notebook_id from a client. Reach: one stray `note` row per such call, not shown in any notebook but still returned by search."
symbols = ["api.routers.notes:create_note"]
evidence = "Read api.routers.notes:create_note: `command_id = await new_note.save()` precedes `await Notebook.get(note_data.notebook_id)`; the NotFoundError handler raises 404 without deleting new_note."
check = {kind = "text_in", pattern = "await new_note\\.save\\(\\)[\\s\\S]*await Notebook\\.get\\(note_data\\.notebook_id\\)"}

[[findings]]
id = "register-models-not-linked"
severity = "low"
category = "risk"
title = "Registering a model that another credential of the same provider already has does not link it to the new credential"
detail = "True now: register_models skips any (name, type) that already exists for the provider, regardless of which credential owns it, and counts it as `existing`. Trigger: a second credential for the same provider (say a work and a personal OpenAI key) registering the same models. Reach: the new credential ends up with no linked models, so its models keep using the first credential's key; deleting the first credential then cascade-deletes those models."
symbols = ["api.credentials_service:register_models"]
evidence = "Read api.credentials_service:register_models: existing_keys is built from `SELECT ... FROM model WHERE string::lowercase(provider) = $provider` with no credential filter, and matching entries `continue` without updating `credential`."
check = {kind = "text_in", pattern = "WHERE string::lowercase\\(provider\\) = \\$provider\""}

[[findings]]
id = "error-classifier-digit-substrings"
severity = "low"
category = "risk"
title = "Error classification matches status codes as bare substrings, so numbers in a message can pick the wrong rule"
detail = "Now: classify_error lower-cases the exception text and checks rules in order with `keyword in combined`; the authentication rule includes '401', the rate-limit rule '429' and the provider-unavailable rule '500'/'502'/'503', all before or regardless of word boundaries. Trigger: a provider message that contains those digits inside another number — e.g. a context-length error reporting 'your messages resulted in 140125 tokens' contains '401' and is checked against the authentication rule before the context-length rule. Reach: the user sees 'Authentication failed. Please check your API key' instead of the size message, and the raised class changes — AuthenticationError is not in the commands' stop_on lists while ContextLengthExceededError is, so a background transformation would be retried with the same oversized payload. Affects every caller of classify_error (ask, chat, source chat, transformation graphs, search and source-chat routers)."
symbols = ["open_notebook.utils.error_classifier:classify_error"]
evidence = "Read open_notebook/utils/error_classifier.py: _CLASSIFICATION_RULES order (authentication first, with '401'; context length sixth) and the substring loop in classify_error; read the retry stop_on lists in commands/source_commands.py and commands/embedding_commands.py."
check = {kind = "text_in", pattern = "keyword in combined"}

[[layer_rules]]
text = "Domain models never import the API, background commands or LangGraph workflows."
from_layers = ["domain"]
forbid = ["api.", "commands.", "open_notebook.graphs."]

[[layer_rules]]
text = "The database layer imports nothing above it: no domain, AI, graphs, API or commands."
from_layers = ["database"]
forbid = ["open_notebook.domain.", "open_notebook.ai.", "open_notebook.graphs.", "open_notebook.podcasts.", "api.", "commands."]

[[layer_rules]]
text = "LangGraph workflows never touch the database directly (no repository, no surrealdb driver) and never import the API or commands."
from_layers = ["graphs"]
forbid = ["open_notebook.database.", "surrealdb", "api.", "commands."]

[[layer_rules]]
text = "API routers never import the surrealdb driver or langgraph; they go through domain models, repo_* helpers and the graphs modules."
from_layers = ["api-routers"]
forbid = ["surrealdb", "langgraph"]

[[layer_rules]]
text = "Background commands never import the API."
from_layers = ["background"]
forbid = ["api."]

[[layer_rules]]
text = "AI provisioning never imports the API, commands or workflows."
from_layers = ["ai"]
forbid = ["api.", "commands.", "open_notebook.graphs."]

[[layer_rules]]
text = "Config, errors and utils never import the API, commands, workflows or the database layer."
from_layers = ["shared"]
forbid = ["api.", "commands.", "open_notebook.graphs.", "open_notebook.database."]

[[layer_rules]]
text = "Only the database, domain and AI-model code use the surrealdb driver: the API, commands, workflows and utils never import it."
from_layers = ["api-app", "api-routers", "api-services", "background", "graphs", "shared"]
forbid = ["surrealdb"]
