        h("button", { type: "button", class: "stage s-" + ev.stage, onclick: () => openInGraph(ev.symbol), title: ev.symbol }, h("span", {}, h("b", {}, L.stages[ev.stage] || ev.stage), " · ", txt(ev.text)), h("small", {}, (ev.by ? ev.by + " · " : "") + ev.symbol))])),
      e.auto ? h("p", { class: "note" }, L.from_sql(e.auto)) : null))));
  const input = document.getElementById("tbl-search");
  const draw = () => {
    const q = input.value.trim().toLowerCase();
    const names = Object.keys(D.tables).filter((t) => !q || t.toLowerCase().includes(q));
    fill(document.getElementById("table-matrix"),
      h("thead", {}, h("tr", {}, L.tbl_cols.map((c) => h("th", {}, c)))),
      h("tbody", {}, names.map((t) => {
        const o = D.tables[t], mods = {};
        for (const op of ["insert", "update", "delete", "read", "uses"]) for (const k of o[op] || []) { const m = k.split(":")[0]; mods[m] = (mods[m] || 0) + 1; }
        const top = Object.entries(mods).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([m, c]) => `${shortMod(m)} ${c}`).join(", ");
        const n = (op) => h("td", { class: "num" }, (o[op] || []).length || "·");
        return h("tr", { class: "pick", "data-t": t, onclick: () => showTable(t) }, h("td", { class: "mono" }, t), n("insert"), n("update"), n("delete"), n("read"), n("uses"), h("td", { class: "note" }, top || L.not_found));
      })));
  };
  input.addEventListener("input", draw);
  draw();
})();

// ---------------------------------------------------------------- decisions
(function decisions() {
  if (!D.decisions.length) { document.getElementById("decisions").hidden = true; return; }
  const whos = [...new Set(D.decisions.map((d) => d.by))];
  const state = { who: null };
  const draw = () => {
    fill(document.getElementById("dec-filter"), h("button", { type: "button", class: "chip" + (state.who ? "" : " on"), onclick: () => { state.who = null; draw(); } }, `${L.all} ${D.decisions.length}`),
      whos.map((w) => h("button", { type: "button", class: "chip" + (state.who === w ? " on" : ""), onclick: () => { state.who = w; draw(); } }, `${w} ${D.decisions.filter((d) => d.by === w).length}`)));
    const rows = D.decisions.filter((d) => !state.who || d.by === state.who);
    fill(document.getElementById("decision-table"), h("thead", {}, h("tr", {}, L.dec_cols.map((c) => h("th", {}, c)))),
      h("tbody", {}, rows.map((d) => h("tr", {}, h("td", {}, txt(d.decision)), h("td", {}, h("span", { class: "badge " + (/code|코드/.test(d.by) ? "accent" : "amber") }, d.by)), h("td", {}, txt(d.how) || ""),
        h("td", {}, d.symbol ? [symLink(d.symbol, shortMod(d.symbol)), h("br"), d._loc ? locLink(d._loc.file, d._loc.line) : null] : "")))));
  };
  draw();
})();

// ---------------------------------------------------------------- findings
(function findings() {
  const SEV = ["high", "medium", "low", "info"];
  const open = D.findings.filter((f) => f.status !== "fixed"), fixed = D.findings.filter((f) => f.status === "fixed");
  const cats = [...new Set(open.map((f) => f.category))];
  const state = { sev: new Set(SEV), cat: null };
  const draw = () => {
    fill(document.getElementById("find-filter"),
      SEV.map((sv) => h("button", { type: "button", class: "chip" + (state.sev.has(sv) ? " on" : ""), onclick: () => { state.sev.has(sv) ? state.sev.delete(sv) : state.sev.add(sv); draw(); } }, `${L.sev[sv]} ${open.filter((f) => f.severity === sv).length}`)),
      h("span", { class: "note" }, "·"),
      h("button", { type: "button", class: "chip" + (state.cat ? "" : " on"), onclick: () => { state.cat = null; draw(); } }, L.all_kinds),
      cats.map((c) => h("button", { type: "button", class: "chip" + (state.cat === c ? " on" : ""), onclick: () => { state.cat = c; draw(); } }, c)));
    const rows = open.filter((f) => state.sev.has(f.severity) && (!state.cat || f.category === state.cat)).sort((a, b) => SEV.indexOf(a.severity) - SEV.indexOf(b.severity));
    fill(document.getElementById("finding-list"), rows.length ? rows.map((f) => h("article", { class: "finding sev-" + f.severity, id: "finding-" + f.id },
      h("div", { class: "top" }, h("span", { class: "badge " + ({ high: "bad", medium: "amber", low: "accent" }[f.severity] || "") }, L.sev[f.severity] || f.severity), h("span", { class: "badge" }, f.category), f.generated ? h("span", { class: "badge" }, L.generated) : null, h("h3", {}, f.title)),
      h("p", {}, txt(f.detail)),
      (f._locs || []).length ? h("div", { class: "chips" }, f._locs.map((l) => h("span", {}, symLink(l.symbol, shortMod(l.symbol)), " ", locLink(l.file, l.line)))) : null,
      f.evidence ? h("p", { class: "note" }, L.verified + f.evidence) : null)) : h("p", { class: "note" }, L.none_match),
      fixed.length ? h("details", { class: "fixed-list" }, h("summary", {}, L.fixed_title(fixed.length)),
        h("ul", {}, fixed.map((f) => h("li", { id: "finding-" + f.id }, h("strong", {}, f.title), " — ", h("span", { class: "note" }, f.fixed_reason))))) : null);
  };
  draw();
})();

// ---------------------------------------------------------------- module index
(function modules() {
  const input = document.getElementById("mod-search");
  const draw = () => {
    const q = input.value.trim().toLowerCase();
    const mods = Object.keys(D.modules).filter((m) => !q || m.toLowerCase().includes(q) || (noteText(m) + " " + (D.modules[m].doc || "")).toLowerCase().includes(q) || D.modules[m].funcs.some((f) => f.toLowerCase().includes(q)));
    fill(document.getElementById("mod-count"), L.mod_count(mods.length, Object.keys(D.modules).length));
    fill(document.getElementById("mod-table"), h("thead", {}, h("tr", {}, L.mod_cols.map((c) => h("th", {}, c)))),
      h("tbody", {}, mods.map((m) => { const i = D.modules[m], Ly = LAYER.get(i.layer);
        return h("tr", { class: "pick", onclick: () => selectModule(m, true) }, h("td", { class: "mono" }, m, h("br"), locLink(i.file, 0)), h("td", {}, h("span", { style: `color:${layerColor(i.layer)}` }, Ly ? Ly.name : i.layer)),
          h("td", {}, txt(truncate(modDesc(m), 160)), i.note && typeof i.note === "object" && i.note.does && !isTodo(i.note.does) ? h("div", { class: "note" }, truncate(i.note.does, 180)) : null), h("td", { class: "num" }, i.lines.toLocaleString()), h("td", { class: "num" }, i.funcs.length),
          h("td", { class: "num" }, i.call_sites ? Math.round(100 - (i.unresolved / i.call_sites) * 100) + "%" : "–"), h("td", { class: "note" }, [...i.imports, ...i.lazy_imports.map((x) => x + "*")].map(shortMod).join(", "))); })));
  };
  input.addEventListener("input", draw);
  draw();
})();

// ---------------------------------------------------------------- global search
(function globalSearch() {
  const input = document.getElementById("gsearch"), box = document.getElementById("gresults"), K = L.kind_labels;
  const items = [];
  for (const k of D.keys) { const sy = SYM(k); items.push({ kind: "fn", label: k, sub: (sy.r ? sy.r.map((u) => u.join(" ")).join(" · ") + " — " : "") + (sy.d || ""), hay: (k + " " + (sy.r ? sy.r.map((u) => u[1]).join(" ") : "") + " " + sy.d).toLowerCase(), go: () => openInGraph(k) }); }
  for (const m of Object.keys(D.modules)) items.push({ kind: "module", label: m, sub: modDesc(m), hay: (m + " " + noteText(m) + " " + (D.modules[m].doc || "")).toLowerCase(), go: () => selectModule(m, true) });
  for (const t of Object.keys(D.tables)) items.push({ kind: "table", label: t, sub: "", hay: t.toLowerCase(), go: () => openTable(t) });
  for (const j of D.journeys) items.push({ kind: "journey", label: j.title, sub: j.summary, hay: (j.title + " " + (j.summary || "") + " " + j.steps.map((x) => x.symbol + " " + (x.action || "")).join(" ")).toLowerCase(), go: () => openJourney(j.id) });
  for (const r of D.roles) items.push({ kind: "role", label: r.name, sub: r.purpose, hay: (r.name + " " + (r.purpose || "") + " " + (r.symbols || []).join(" ")).toLowerCase(), go: () => goto("role-" + r.id) });
  for (const f of D.flows) items.push({ kind: "flow", label: f.source, sub: f.sink, hay: (f.source + " " + (f.sink || "")).toLowerCase(), go: () => goto("flow-" + f.id) });
  for (const e of D.entities) items.push({ kind: "entity", label: e.name, sub: e.summary, hay: (e.name + " " + (e.table || "") + " " + (e.summary || "")).toLowerCase(), go: () => goto("ent-" + e.id) });
  for (const f of D.findings) items.push({ kind: "finding", label: f.title, sub: f.category, hay: (f.title + " " + (f.detail || "") + " " + (f.symbols || []).join(" ")).toLowerCase(), go: () => goto("finding-" + f.id) });
  for (const d of D.decisions) items.push({ kind: "decision", label: d.decision, sub: d.by + " · " + (d.how || ""), hay: (d.decision + " " + (d.how || "")).toLowerCase(), go: () => goto("decisions") });
  const RANK = { journey: 0, role: 1, entity: 2, finding: 3, table: 4, module: 5, flow: 6, decision: 7, fn: 8 };
  let hits = [], cur = 0;
  const pick = (i) => { const it = hits[i]; if (!it) return; box.hidden = true; it.go(); };
  const draw = () => fill(box, hits.map((it, i) => h("button", { type: "button", class: i === cur ? "on" : "", onclick: () => pick(i) }, h("span", { class: "k" }, K[it.kind]), h("span", {}, it.label, it.sub ? h("small", {}, truncate(it.sub, 110)) : null))));
  input.addEventListener("input", () => {
    const q = input.value.trim().toLowerCase();
    if (q.length < 2) { box.hidden = true; return; }
    const terms = q.split(/\s+/);
    hits = items.filter((it) => terms.every((t) => it.hay.includes(t) || it.label.toLowerCase().includes(t))).sort((a, b) => (RANK[a.kind] - RANK[b.kind]) || (a.label.length - b.label.length)).slice(0, 30);
    cur = 0; draw(); box.hidden = !hits.length;
  });
  input.addEventListener("keydown", (ev) => {
    if (box.hidden) return;
    if (ev.key === "ArrowDown") { cur = Math.min(hits.length - 1, cur + 1); draw(); ev.preventDefault(); }
    if (ev.key === "ArrowUp") { cur = Math.max(0, cur - 1); draw(); ev.preventDefault(); }
    if (ev.key === "Enter") { pick(cur); ev.preventDefault(); }
    if (ev.key === "Escape") box.hidden = true;
  });
  document.addEventListener("click", (ev) => { if (!ev.target.closest(".searchbar")) box.hidden = true; });
})();

(function footer() {
  fill(document.getElementById("regen"), h("h3", {}, L.regen_h), h("pre", {}, D.regenCommand), h("p", {}, L.regen_cov(D.summary)), h("p", {}, L.regen_blind), h("p", {}, L.regen_gen));
})();
