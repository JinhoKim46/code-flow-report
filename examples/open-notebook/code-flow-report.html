.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }

tr.pick:hover td { background: var(--surface-2); }

.finding.sev-high { border-left-color: var(--bad); } .finding.sev-medium { border-left-color: var(--amber); } .finding.sev-low { border-left-color: var(--l0); } .finding.sev-info { border-left-color: var(--muted); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* fade: when something is selected, everything not connected to it steps back */
.fadeable { transition: opacity 0.18s ease; }
.focus .fadeable.dim { opacity: var(--fade, 0.22); }
.focus .medge.dim, .focus .e.dim { stroke-opacity: 0.05; }
.medge.bg { stroke: var(--muted); stroke-opacity: 0.10; stroke-width: 1; }
.focus .medge.bg { stroke-opacity: 0.03; }
.medge.hl, .e.hl { stroke-opacity: 1 !important; stroke-width: 2.4 !important; }
.fadebar { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.fadebar input[type=range] { width: 120px; accent-color: var(--accent); }
.todo { color: var(--amber); font-style: italic; }

he same process can return empty until restart. Trigger: any transformation run. Reach: every insight and every /transformations/execute call; no data is lost.","evidence":"Read open_notebook.graphs.transformation:run_transformation (DefaultPrompts(transformation_instructions=None), no get_instance call), open_notebook.domain.base:RecordModel.__new__ (kwargs are set on the cached instance) and api.routers.transformations (GET/PUT default-prompt use DefaultPrompts.get_instance and update).","id":"default-transformation-prompt-ignored","severity":"medium","symbols":["open_notebook.graphs.transformation:run_transformation"],"title":"The saved default transformation instructions are never applied"},{"_locs":[{"doc":"Cancel a running command job","file":"api/command_service.py","line":83,"params":["job_id"],"symbol":"api.command_service:CommandService.cancel_command_job"}],"category":"risk","check":{"kind":"text_in","pattern":"return True"},"detail":"True now: CommandService.cancel_command_job only logs and returns True, so the endpoint answers {cancelled: true} while the job keeps running. list_command_jobs likewise always returns []. Trigger: a client relying on the cancel response. Reach: that endpoint only; the job finishes normally.","evidence":"Read api.command_service:CommandService.cancel_command_job and api.routers.commands:cancel_command_job.","id":"cancel-job-noop","severity":"low","symbols":["api.command_service:CommandService.cancel_command_job"],"title":"DELETE /commands/jobs/{id} reports cancelled without cancelling"},{"_locs":[{"doc":"Load Model record, resolve credential -> (provider, model_name, config_dict).","file":"open_notebook/podcasts/models.py","line":11,"params":["model_id","max_tokens"],"symbol":"open_notebook.podcasts.models:_resolve_model_config"}],"category":"risk","check":{"kind":"not_calls","target":"open_notebook.ai.models:_revalidate_config_urls"},"detail":"True now: ModelManager.get_model calls _revalidate_config_urls on a credential's base_url/endpoints right before use, to narrow a DNS-rebinding window after the credential was saved. The podcast path builds provider config in _resolve_model_config without that call (except for anthropic_compatible, which re-checks inside resolve_anthropic_compatible_config). Trigger: a saved credential host that later resolves to an internal address. Reach: podcast outline, transcript and TTS calls only; URLs are still validated when the credential is saved.","evidence":"Read open_notebook.ai.models:ModelManager.get_model, open_notebook.ai.models:_revalidate_config_urls (docstring explains the TOCTOU reason) and open_notebook.podcasts.models:_resolve_model_config.","id":"podcast-skips-url-revalidation","severity":"low","symbols":["open_notebook.podcasts.models:_resolve_model_config"],"title":"Podcast model config skips the per-call URL re-check the other model paths do"},{"_locs":[{"doc":"Run the migration.","file":"open_notebook/database/async_migrate.py","line":36,"params":["self","bump"],"symbol":"open_notebook.database.async_migrate:AsyncMigration.run"}],"category":"risk","check":{"kind":"text_in","pattern":"^\\s*await connection\\.query\\(self\\.sql\\)"},"detail":"True now: AsyncMigration.run awaits connection.query(self.sql) and discards the result, then calls bump_version. Elsewhere (repo_query, repo_create, repo_insert) the same SDK is treated as able to return an error string instead of raising. Trigger: a migration statement that SurrealDB reports as failed via the result rather than an exception. Reach: schema state — the version would advance past a migration that did not apply, and it would not be re-run.","evidence":"Read open_notebook.database.async_migrate:AsyncMigration.run and bump_version, compared with open_notebook.database.repository:repo_query (isinstance(result, str) → RuntimeError). Not reproduced against a live SurrealDB.","id":"migration-result-unchecked","severity":"low","symbols":["open_notebook.database.async_migrate:AsyncMigration.run"],"title":"A migration's query result is not inspected before the version is bumped"},{"_locs":[{"doc":"Create migration from SQL file.","file":"open_notebook/database/async_migrate.py","line":23,"params":["cls","file_path"],"symbol":"open_notebook.database.async_migrate:AsyncMigration.from_file"}],"category":"risk","check":{"kind":"text_in","pattern":"\" \"\\.join\\(lines\\)"},"detail":"True now: AsyncMigration.from_file strips every line, drops lines starting with '--' and joins the rest with spaces. Multi-line string literals in a migration (the seeded transformation prompts and default instructions in 5.surrealql) lose their line breaks, and a '//' or '#' comment line outside a string would comment out the rest of the file. No migration has such a comment line today. Reach: seeded prompt formatting; future migrations.","evidence":"Read AsyncMigration.from_file; grep of migrations/*.surrealql for lines starting with // or # found only lines inside the 5.surrealql prompt strings.","id":"migration-newlines-collapsed","severity":"info","symbols":["open_notebook.database.async_migrate:AsyncMigration.from_file"],"title":"Migration files are flattened to one line, which also flattens multi-line strings"},{"_locs":[{"doc":"Fetch and parse the version from pyproject.toml in a public GitHub repository.","file":"open_notebook/utils/version_utils.py","line":59,"params":["repo_url","branch"],"symbol":"open_notebook.utils.version_utils:get_version_from_github"}],"category":"dead code","check":"no_callers","detail":"True now: /api/config uses get_version_from_github_async (httpx); the sync requests-based twin is only exported from open_notebook.utils and used by tests. Reach: none at runtime; it keeps requests as a code path to maintain.","evidence":"codeflow.py query showed 0 callers; grep found only open_notebook/utils/__init__.py exports and tests/test_utils.py.","id":"sync-github-version-unused","severity":"info","symbols":["open_notebook.utils.version_utils:get_version_from_github"],"title":"get_version_from_github (requests, sync) has no production caller"},{"_locs":[{"doc":"Add an existing source to a notebook (create the reference).","file":"api/routers/notebooks.py","guards":[],"line":345,"params":["notebook_id","source_id"],"symbol":"api.routers.notebooks:add_source_to_notebook","urls":[["POST","/api/notebooks/{notebook_id}/sources/{source_id}"]]},{"doc":"Remove a source from a notebook (delete the reference).","file":"api/routers/notebooks.py","guards":[],"line":388,"params":["notebook_id","source_id"],"symbol":"api.routers.notebooks:remove_source_from_notebook","urls":[["DELETE","/api/notebooks/{notebook_id}/sources/{source_id}"]]},{"doc":"","file":"open_notebook/domain/notebook.py","line":34,"params":["self","include_full_text"],"symbol":"open_notebook.domain.notebook:Notebook.get_sources"}],"category":"risk","check":{"kind":"text_in","pattern":"out = \\$source_id AND in = \\$notebook_id"},"detail":"True now: add_source_to_notebook looks for an existing edge with `out = $source_id AND in = $notebook_id`, but reference edges are created source->reference->notebook (in = source, out = notebook), as Source.add_to_notebook, Notebook.get_sources and remove_source_from_notebook all assume. The check never matches. Trigger: POST /notebooks/{nb}/sources/{src} for a source that is already in that notebook (a double click, a retried request, or the frontend's add-to-notebook call on an already-linked source). Reach: a second `reference` row for the pair, so Notebook.get_sources returns the source twice in that notebook's list and context; no unique index on reference stops it. Removing the source deletes all copies, so nothing is lost.","evidence":"Read add_source_to_notebook (SELECT … WHERE out = $source_id AND in = $notebook_id, then RELATE $source_id->reference->$notebook_id), remove_source_from_notebook (WHERE out = $notebook_id AND in = $source_id) and Notebook.get_sources (select in as source from reference where out=$id). grep for UNIQUE in migrations finds only the episode/speaker profile name indexes. frontend/src/lib/api/notebooks.ts calls this POST route.","id":"link-source-idempotency-reversed","severity":"medium","symbols":["api.routers.notebooks:add_source_to_notebook","api.routers.notebooks:remove_source_from_notebook","open_notebook.domain.notebook:Notebook.get_sources"],"title":"Linking an existing source to a notebook checks for a duplicate with in/out swapped, so every call adds another edge"},{"_locs":[{"doc":"","file":"open_notebook/domain/notebook.py","line":34,"params":["self","include_full_text"],"symbol":"open_notebook.domain.notebook:Notebook.get_sources"},{"doc":"","file":"open_notebook/domain/notebook.py","line":530,"params":["self","notebook_id"],"symbol":"open_notebook.domain.notebook:Source.add_to_notebook"}],"category":"doc vs code","detail":"docs/7-DEVELOPMENT/architecture.md lists `reference | out (source), in (notebook)` and `artifact | out (note), in (notebook)`. The code relates source->reference->notebook and note->artifact->notebook, so in = source/note and out = notebook, and every working query (get_sources, get_notes, Notebook.delete) filters on `out = notebook`. Trigger: a contributor writes a new query from the doc. Reach: that query silently returns nothing — exactly the bug in add_source_to_notebook's duplicate check. The same doc's sample query (`count(<-reference.in)… WHERE notebook = $notebook_id`) uses fields the source table does not have.","evidence":"architecture.md 'Core Tables' table and 'Query Example'; migration 1 defines `reference TYPE RELATION FROM source TO notebook` and `artifact … FROM note TO notebook`; Source.add_to_notebook calls self.relate('reference', notebook_id); Notebook.get_sources uses `where out=$id`.","id":"doc-reference-direction","severity":"low","symbols":["open_notebook.domain.notebook:Notebook.get_sources","open_notebook.domain.notebook:Source.add_to_notebook"],"title":"Architecture doc says reference/artifact have out = source/note and in = notebook; the code uses the opposite"},{"_locs":[{"doc":"","file":"open_notebook/database/repository.py","line":86,"params":[],"symbol":"open_notebook.database.repository:db_connection"},{"doc":"Execute a SurrealQL query and return the results","file":"open_notebook/database/repository.py","line":101,"params":["query_str","vars"],"symbol":"open_notebook.database.repository:repo_query"}],"category":"doc vs code","check":{"kind":"text_in","pattern":"AsyncSurreal\\("},"detail":"architecture.md says 'Async connection pooling (configurable size)' and 'Transaction support for multi-record operations'. db_connection creates a new AsyncSurreal, signs in and selects the namespace on every call, and repo_query/repo_create/repo_update/repo_delete each use their own; there is no pool and no pool-size setting. Trigger: any multi-step operation — Notebook.delete issues one connection per note, per source and per chat session. Reach: extra latency on every request (not measured), and multi-record operations are not atomic (see the notebook-delete finding).","evidence":"Read db_connection (AsyncSurreal(get_database_url()), signin, use, close in finally) and repo_query/repo_create/repo_delete (each `async with db_connection()`); repo_insert is the only helper that reuses one connection across batches. No BEGIN/COMMIT in the repository module.","id":"doc-connection-pooling","severity":"low","symbols":["open_notebook.database.repository:db_connection","open_notebook.database.repository:repo_query"],"title":"Docs promise async connection pooling and transactions; every repo_* call opens, signs in and closes its own connection"},{"_locs":[{"doc":"Delete notebook with cascade deletion of notes and optional source deletion.","file":"open_notebook/domain/notebook.py","line":215,"params":["self","delete_exclusive_sources"],"symbol":"open_notebook.domain.notebook:Notebook.delete"},{"doc":"Delete a notebook with cascade deletion.","file":"api/routers/notebooks.py","guards":[],"line":420,"params":["notebook_id","delete_exclusive_sources"],"symbol":"api.routers.notebooks:delete_notebook","urls":[["DELETE","/api/notebooks/{notebook_id}"]]}],"category":"risk","check":{"kind":"text_in","pattern":"super\\(\\)\\.delete\\(\\)"},"detail":"True now: Notebook.delete deletes notes one by one, then artifact edges, optionally exclusive sources (each Source.delete also unlinks the uploaded file), then reference edges, chat sessions and finally the notebook, each step a separate connection. architecture.md says 'Soft deletes via archived field (data not removed, just marked inactive)' — archiving is a separate flag on update_notebook; DELETE /notebooks/{id} removes data. Trigger: a database error or timeout part-way through (exclusive-source failures are only logged and skipped). Reach: one notebook left half-deleted — notes already gone, the notebook row still there — and the caller gets a 500 with no record of what was removed.","evidence":"Read Notebook.delete end to end (note.delete loop, DELETE artifact, Source.delete loop with logger.warning on failure, DELETE reference, chat_session.delete loop, super().delete()) and ObjectModel.delete → repo_delete. architecture.md 'Important Quirks & Gotchas' → Database Operations.","id":"notebook-delete-not-atomic","severity":"medium","symbols":["open_notebook.domain.notebook:Notebook.delete","api.routers.notebooks:delete_notebook"],"title":"Deleting a notebook is a hard, multi-step delete with no transaction; docs describe soft delete"},{"_locs":[{"doc":"Delete a chat session.","file":"api/routers/chat.py","guards":[],"line":288,"params":["session_id"],"symbol":"api.routers.chat:delete_session","urls":[["DELETE","/api/chat/sessions/{session_id}"]]},{"doc":"Delete a source chat session.","file":"api/routers/source_chat.py","guards":[],"line":307,"params":["source_id","session_id"],"symbol":"api.routers.source_chat:delete_source_chat_session","urls":[["DELETE","/api/sources/{source_id}/chat/sessions/{session_id}"]]},{"doc":"Delete source and clean up associated file, embeddings, and insights.","file":"open_notebook/domain/notebook.py","line":646,"params":["self"],"symbol":"open_notebook.domain.notebook:Source.delete"}],"category":"risk","check":{"kind":"text_in","pattern":"\\A(?![\\s\\S]*delete_thread)"},"detail":"True now: chat messages are not stored in chat_session; the chat and source-chat graphs checkpoint them to LANGGRAPH_CHECKPOINT_FILE (data/sqlite-db/checkpoints.sqlite) under thread_id = session id. delete_session, delete_source_chat_session and Notebook.delete only delete the SurrealDB row. Source.delete does not touch the source's chat sessions at all, so those rows remain too, reachable from no list. Trigger: a user deletes a conversation or its notebook/source expecting it to be gone. Reach: the full conversation text stays on disk and checkpoints.sqlite only grows. architecture.md also describes chat_session as holding 'messages (JSON)' and a notebook_id field, which it does not.","evidence":"Read open_notebook/graphs/chat.py and source_chat.py (SqliteSaver(sqlite3.connect(LANGGRAPH_CHECKPOINT_FILE)), compile(checkpointer=memory)), api.routers.chat:get_session (messages from chat_graph.get_state with thread_id), delete_session (session.delete() only). grep for delete_thread in api/ and open_notebook/ finds nothing.","id":"chat-delete-leaves-checkpoint","severity":"low","symbols":["api.routers.chat:delete_session","api.routers.source_chat:delete_source_chat_session","open_notebook.domain.notebook:Source.delete"],"title":"Deleting a chat session leaves its messages in the LangGraph SQLite checkpoint"},{"_locs":[{"doc":"Retry a failed podcast episode by deleting it and submitting a new job","file":"api/routers/podcasts.py","guards":[],"line":356,"params":["episode_id"],"symbol":"api.routers.podcasts:retry_podcast_episode","urls":[["POST","/api/podcasts/episodes/{episode_id}/retry"]]},{"doc":"Submit a podcast generation job for background processing","file":"api/podcast_service.py","line":37,"params":["episode_profile_name","speaker_profile_name","episode_name","notebook_id","content","briefing_suffix"],"symbol":"api.podcast_service:PodcastService.submit_generation_job"}],"category":"risk","check":{"kind":"text_in","pattern":"(?s)await episode\\.delete\\(\\).*submit_generation_job"},"detail":"True now: retry_podcast_episode deletes the audio file and the episode row, then calls submit_generation_job with the episode and speaker profile names stored in the row. submit_generation_job looks the profiles up by name and raises ValueError if either is missing. Trigger: retrying after a profile was renamed or deleted (or any queueing error). Reach: the failed episode — including its briefing, input content and any transcript/outline that was saved before the audio step failed — is gone, and no new job exists.","evidence":"Read retry_podcast_episode (_delete_episode_audio, await episode.delete(), then PodcastService.submit_generation_job(...)) and submit_generation_job (EpisodeProfile.get_by_name / SpeakerProfile.get_by_name → raise ValueError(... not found)). generate_podcast_command saves transcript/outline before raising on an audio error.","id":"retry-episode-deletes-first","severity":"medium","symbols":["api.routers.podcasts:retry_podcast_episode","api.podcast_service:PodcastService.submit_generation_job"],"title":"Retrying a failed podcast deletes the episode before checking the new job can be queued"},{"_locs":[{"doc":"Create a source insight with automatic retry on transaction conflicts.","file":"commands/embedding_commands.py","line":425,"params":["input_data"],"symbol":"commands.embedding_commands:create_insight_command"}],"category":"risk","check":{"kind":"text_in","pattern":"(?s)CREATE source_insight.*submit_command\\("},"detail":"True now: create_insight_command CREATEs the source_insight row and then calls submit_command('embed_insight') inside the same try; any non-ValueError exception is re-raised so surreal-commands retries the whole command (up to 5 attempts), which runs CREATE again. Trigger: the CREATE commits but submitting embed_insight fails transiently (the transaction conflicts this command exists to absorb). Reach: duplicate insight rows for one source, each shown in the source's insights list; only one may get an embedding.","evidence":"Read create_insight_command (repo_query CREATE source_insight …; submit_command('open_notebook','embed_insight',…); except Exception: raise) and EMBED_RETRY_CONFIG (max_attempts 5, stop_on ValueError/ConfigurationError/ContextLengthExceededError).","id":"create-insight-retry-duplicates","severity":"low","symbols":["commands.embedding_commands:create_insight_command"],"title":"create_insight can write the same insight twice when queueing its embedding fails"},{"_locs":[{"doc":"Shared core for the embed_* commands: run the embedding work with the common logging and error-handling epilogue.","file":"commands/embedding_commands.py","line":48,"params":["input_data","kind","record_id","embed"],"symbol":"commands.embedding_commands:_embed_record"},{"doc":"Process source content using the source_graph workflow","file":"commands/source_commands.py","line":60,"params":["input_data"],"symbol":"commands.source_commands:process_source_command"}],"category":"risk","check":{"kind":"text_in","pattern":"return None, processing_time, str\\(e\\)"},"detail":"True now: _embed_record catches ValueError (record not found, no content) and returns an error_message instead of raising, so the job ends `completed` with success=false in its payload. process_source_command was changed to re-raise for exactly this reason (its comment: is_success() checks job status, not the payload). The embedding module's own NOTE admits stop_on can never trigger. Trigger: a note, insight or source with empty content, or deleted before its embed job runs. Reach: the record silently has no embedding and never appears in vector search; nothing in command status sho one Send per requested transformation, and they run in parallel. Each one runs the transformation graph (prompt template transformation/execute + the user's instructions, model from provision_langchain_model) on full_text, then calls Source.add_insight","doc":"","file":"open_notebook/graphs/source.py","line":257,"note":"The user's prompt is passed as a render variable into a fixed template, never compiled as Jinja source (see the comment in graphs.transformation:run_transformation). An answer cut off by the token limit raises IncompleteGenerationError instead of being saved.","params":["state"],"receives":"{source, transformation}","returns":"{'transformation': [{output, transformation_name}]}","stores":"nothing directly: add_insight submits a create_insight job","symbol":"open_notebook.graphs.source:transform_content"},{"action":"Runs CREATE source_insight, then submits embed_insight so the insight can be found by search too","actor":"surreal-commands worker","doc":"Create a source insight with automatic retry on transaction conflicts.","file":"commands/embedding_commands.py","line":425,"note":"The insert is a job of its own so that parallel transformations that hit a SurrealDB transaction conflict are retried there (EMBED_RETRY_CONFIG, 5 attempts).","params":["input_data"],"payload":"{\"source_id\": \"source:p7q2\", \"insight_type\": \"Summary\", \"content\": \"The quarter closed with 12% growth ...\"}\n\n\n","receives":"CreateInsightInput {source_id, insight_type, content}","returns":"CreateInsightOutput with the new insight id","stores":"a `source_insight` row (and later its embedding)","symbol":"commands.embedding_commands:create_insight_command","tables":["source_insight"]}],"summary":"The API checks the input, saves an uploaded file, creates a placeholder `source` record linked to its notebooks and queues a `process_source` job. A surreal-commands worker then extracts the text with content-core, saves it on the source, and queues more jobs that write `source_embedding` chunks and `source_insight` rows from transformations.","title":"Add a source to a notebook","trigger":"POST /api/sources (multipart form; POST /api/sources/json is a thin wrapper)"},{"actor":"user · Ask page","id":"ask-notebook","steps":[{"action":"Checks the notebook scope first, then that the three chosen models exist, then that a default embedding model is configured, and returns a StreamingResponse","actor":"frontend","doc":"Ask the knowledge base a question using AI models.","file":"api/routers/search.py","guards":[],"line":141,"params":["ask_request"],"payload":"{\"question\": \"What drove revenue growth in Q3?\", \"strategy_model\": \"model:gpt5mini\",\n \"answer_model\": \"model:gpt5mini\", \"final_answer_model\": \"model:claude\", \"scope_notebook_ids\": [\"notebook:k3x9\"]}\n\n\n","receives":"AskRequest {question, strategy_model, answer_model, final_answer_model, scope_notebook_ids}","returns":"text/event-stream; 400 for an unknown model or no embedding model, 400/404 for a bad scope","symbol":"api.routers.search:ask_knowledge_base","tables":["model"],"urls":[["POST","/api/search/ask"]]},{"action":"Requires every id to be a well-formed notebook:<key> and checks in one query that they all exist","doc":"Validate a notebook scope before it reaches text_search / vector_search.","file":"open_notebook/domain/notebook.py","line":771,"note":"Without this check a typo in the scope would give an empty result that looks the same as 'no matches'.","params":["notebook_ids"],"receives":"list of notebook ids (empty = whole knowledge base)","returns":"the same list; InvalidInputError for a malformed id, NotFoundError for an unknown one","symbol":"open_notebook.domain.notebook:resolve_notebook_scope","tables":["notebook"]},{"action":"Runs ask_graph.astream with the three model ids in config.configurable and turns each node update into an SSE event: strategy, answer (one per search), final_answer, then complete","doc":"Stream the ask response as Server-Sent Events.","file":"api/routers/search.py","line":77,"params":["question","strategy_model","answer_model","final_answer_model","notebook_ids"],"payload":"data: {\"type\": \"strategy\", \"reasoning\": \"Need revenue figures and causes\", \"searches\": [{\"term\": \"Q3 revenue growth\", \"instructions\": \"Extract growth drivers\"}]}\n\n\n","receives":"question, three Model objects, notebook ids","returns":"SSE lines; an exception becomes one {type: 'error', message} event, because the HTTP status has already been sent","symbol":"api.routers.search:stream_ask_response"},{"action":"Renders prompts/ask/entry with a PydanticOutputParser for Strategy, calls the strategy model in JSON mode, strips <think> content and parses it into a Strategy","doc":"","file":"open_notebook/graphs/ask.py","line":65,"note":"Searches with a blank term are dropped. If none are left, it raises ExternalServiceError instead of running empty searches and answering 'no documents found'.","params":["state","config"],"receives":"ThreadState {question, notebook_ids}","returns":"{'strategy': Strategy(reasoning, searches[≤5])}","symbol":"open_notebook.graphs.ask:call_model_with_messages"},{"action":"Picks the model for this call: the large_context default when the prompt is over 105,000 tokens, otherwise the explicit model id, otherwise the default for the given type ('tools' for Ask)","doc":"Returns the best model to use based on the context size and on whether there is a specific model being requested in Config. If context > 105_000, returns the large_context_model If model_id is specified in Config, returns that model Otherwise, returns the default model for the given type","file":"open_notebook/ai/provision.py","line":10,"params":["content","model_id","default_type","**kwargs"],"receives":"prompt text, model_id, default_type, max_tokens=8192 (ASK_MAX_TOKENS), structured={'type': 'json'} for the strategy call","returns":"a LangChain BaseChatModel (Esperanto LanguageModel.to_langchain()); ConfigurationError if no model is found or it is not a language model","symbol":"open_notebook.ai.provision:provision_langchain_model"},{"action":"Loads the Model record, builds the Esperanto config from its linked credential (or provisions env vars via key_provider when there is none), checks the provider URLs again, and asks Esperanto's factory for the model","doc":"Get a model by ID. Esperanto will cache the actual model instance.","file":"open_notebook/ai/models.py","line":203,"params":["self","model_id","**kwargs"],"receives":"model id, call kwargs","returns":"an Esperanto model instance (cached by Esperanto)","symbol":"open_notebook.ai.models:ModelManager.get_model","tables":["model","credential"]},{"action":"Fan-out: one Send('provide_answer', …) per search term, each carrying the question, the term, its instructions and the notebook scope","doc":"","file":"open_notebook/graphs/ask.py","line":112,"params":["state","config"],"receives":"ThreadState with strategy","returns":"list of Send","symbol":"open_notebook.graphs.ask:trigger_queries"},{"action":"Runs a vector search for the term (10 results). If nothing matches it adds no answer; otherwise it renders prompts/ask/query_process with the results and their ids and calls the answer model","doc":"","file":"open_notebook/graphs/ask.py","line":128,"note":"Citations are a prompt rule, not checked by code: the template asks the model to cite only the ids in {{ids}}, in square brackets.","params":["state","config"],"payload":"\"Growth came mainly from the new enterprise tier [source_embedding:a1b2] and lower churn [source_insight:c3d4].\"\n\n\n","receives":"SubGraphState {question, term, instructions, notebook_ids}","returns":"{'answers': [text]} (the list reducer collects every branch's answer)","symbol":"open_notebook.graphs.ask:provide_answer"},{"action":"Embeds the term with the default embedding model (generate_embedding; mean-pools a long query) and calls the SurrealDB function fn::vector_search with minimum_score 0.2 and the notebook scope","doc":"","file":"open_notebook/domain/notebook.py","line":884,"params":["keyword","results","source","note","minimum_score","notebook_ids"],"receives":"keyword, results=10, source=True, note=True, notebook_ids","returns":"rows sorted by similarity, highest first (re-sorted in Python because the SELECT wrapper can return them out of order)","symbol":"open_notebook.domain.notebook:vector_search","tables":["source_embedding","source_insight","note"]},{"action":"Renders prompts/ask/final_answer with the question, the strategy and every partial answer, and calls the final-answer model","doc":"","file":"open_notebook/graphs/ask.py","line":167,"params":["state","config"],"receives":"ThreadState {question, strategy, answers[]}","returns":"{'final_answer': text}; IncompleteGenerationError when nothing is left after stripping thinking content","stores":"nothing; the answer exists only in the SSE stream","symbol":"open_notebook.graphs.ask:write_final_answer"}],"summary":"A strategy model splits the question into up to five searches. Each search runs a vector search over chunks, insights and notes and gets its own partial answer that cites document ids, and a third model merges those into the final answer. Every stage is sent to the browser as a Server-Sent Event; nothing is saved.","title":"Ask a question across the knowledge base","trigger":"POST /api/search/ask (SSE stream; /api/search/ask/simple returns only the final answer)"},{"actor":"user · notebook chat panel","id":"chat-session","steps":[{"action":"Checks that the notebook exists, saves a ChatSession (title, optional model_override) and links it to the notebook","actor":"frontend","doc":"Create a new chat session.","file":"api/routers/chat.py","guards":[],"line":143,"params":["request"],"payload":"{\"notebook_id\": \"notebook:k3x9\", \"title\": \"Q3 questions\", \"model_override\": null}\n\n\n","receives":"CreateSessionRequest {notebook_id, title?, model_override?}","returns":"ChatSessionResponse with message_count 0; 404 if the notebook is missing","stores":"a `chat_session` row","symbol":"api.routers.chat:create_session","tables":["notebook","chat_session"],"urls":[["POST","/api/chat/sessions"]]},{"action":"Creates the session→notebook edge; execute_chat later reads it to find the notebook","doc":"","file":"open_notebook/domain/notebook.py","line":760,"params":["self","notebook_id"],"receives":"notebook id","returns":"the relation","stores":"a `refers_to` edge","symbol":"open_notebook.domain.notebook:ChatSession.relate_to_notebook","tables":["refers_to"]},{"action":"Turns the frontend's per-item choices into context data and estimates its size, so the panel can show the token count before anything is sent","doc":"Build context for a notebook based on context configuration.","file":"api/routers/chat.py","guards":[],"line":396,"params":["request"],"payload":"{\"notebook_id\": \"notebook:k3x9\",\n \"context_config\": {\"sources\": {\"source:p7q2\": \"full content\", \"source:r8s1\": \"insights\"}, \"notes\": {\"note:m4\": \"not in\"}}}\n\n\n","receives":"BuildContextRequest {notebook_id, context_config: {sources: {id: status}, notes: {id: status}}}","returns":"BuildContextResponse {context: {sources: [...], notes: [...]}, token_count, char_count}","symbol":"api.routers.chat:build_context","urls":[["POST","/api/chat/context"]]},{"action":"For each entry: 'not in' skips it, 'insights' adds Source.get_context('short'), 'full content' adds the long context. Without a config it adds every source and note in the notebook at short level","doc":"Assemble source/note context for a notebook.","file":"open_notebook/utils/context_builder.py","line":264,"note":"If one item fails it is logged and skipped; one broken record never fails the whole request.","params":["notebook","context_config"],"receives":"Notebook, context_config","returns":"({sources, notes}, the concatenated text used for counting)","symbol":"open_notebook.utils.context_builder:build_notebook_context","tables":["source","source_insight","note"]},{"action":"Loads the session and its notebook, reads the thread's current checkpoint, adds the context, notebook, model override and a new HumanMessage (with an explicit uuid) to the state, and runs the graph in a worker thread","doc":"Execute a chat request and get AI response.","file":"api/routers/chat.py","guards":[],"line":309,"note":"A model_override in the request beats the session's own. The context is whatever the client sends; the server does not rebuild it.","params":["request"],"payload":"{\"session_id\": \"chat_session:t5\", \"message\": \"Which product line grew fastest?\",\n \"context\": {\"sources\": [{\"id\": \"source:p7q2\", \"title\": \"Quarterly Review Q3\", \"full_text\": \"...\"}], \"notes\": []},\n \"model_override\": null}\n\n\n","receives":"ExecuteChatRequest {session_id, message, context, model_override?}","returns":"ExecuteChatResponse {session_id, messages[]}: the whole thread, not only the new reply","stores":"chat_session.updated (session.save())","symbol":"api.routers.chat:execute_chat","tables":["refers_to","notebook","chat_session"],"urls":[["POST","/api/chat/execute"]]},{"action":"Adds the chat_session: prefix if it is missing and fetches the record","doc":"Normalize a session ID and fetch the chat session, 404 if missing.","file":"api/routers/_chat_shared.py","line":52,"params":["session_id"],"receives":"session id with or without prefix","returns":"(full id, ChatSession); HTTP 404 if missing","symbol":"api.routers._chat_shared:get_session_or_404","tables":["chat_session"]},{"action":"Runs chat_graph.invoke with thread_id = session id. If it raises, it removes the unanswered question from the checkpoint before re-raising","doc":"Run one chat turn; if it fails, drop the unanswered question.","file":"open_notebook/utils/graph_utils.py","line":48,"note":"Synchronous on purpose, and called through asyncio.to_thread, so the invoke and the rollback stay together even if the client disconnects.","params":["graph","state","config","user_message"],"receives":"graph, state, RunnableConfig {thread_id, model_id}, the user message","returns":"the final graph state (all messages)","stores":"LangGraph checkpoint rows in LANGGRAPH_CHECKPOINT_FILE (SQLite): the question and the reply","symbol":"open_notebook.utils.graph_utils:invoke_chat_turn"},{"action":"Renders prompts/chat/system (notebook name and description, the context, the citation rules), puts it in front of the history, gets the model (running the async provisioning in a fresh event loop because the node is synchronous), calls model.invoke and strips <think> content","doc":"","file":"open_notebook/graphs/chat.py","line":30,"note":"An empty answer raises IncompleteGenerationError inside the node, so LangGraph never saves a blank AI message that would be sent back as history later. Provider errors go through classify_error to a typed OpenNotebookError.","params":["state","config"],"payload":"AIMessage(content=\"The enterprise tier grew fastest, up 31% [source:p7q2].\")\n\n\n","receives":"ThreadState {messages, notebook, context, model_override}","returns":"{'messages': AIMessage}, which the add_messages reducer appends to the thread","symbol":"open_notebook.graphs.chat:call_model_with_messages"},{"action":"Chooses the chat model: large_context when the whole payload is over 105,000 tokens, otherwise the override, otherwise the default 'chat' model; max_tokens 8192","doc":"Returns the best model to use based on the context size and on whether there is a specific model being requested in Config. If context > 105_000, returns the large_context_model If model_id is specified in Config, returns that model Otherwise, returns the default model for the given type","file":"open_notebook/ai/provision.py","line":10,"params":["content","model_id","default_type","**kwargs"],"receives":"str(payload), model_id, 'chat'","returns":"a LangChain chat model","symbol":"open_notebook.ai.provision:provision_langchain_model","tables":["model"]},{"action":"Failure branch only: LangGraph saves the input before the node runs, so after a failed turn this reads the thread and, if the question is still there, writes RemoveMessage(id) so a retry does not add it twice","doc":"Remove a user message whose turn failed from the thread's checkpoint.","file":"open_notebook/utils/graph_utils.py","line":28,"params":["graph","thread_id","message"],"receives":"graph, thread id, the HumanMessage","returns":"nothing; never raises","stores":"a new checkpoint without the question","symbol":"open_notebook.utils.graph_utils:discard_unanswered_message"},{"action":"Turns LangChain messages into ChatMessage {id, type ('human'/'ai'), content, timestamp=None} for the response","doc":"Convert LangGraph/LangChain state messages into `ChatMessage` models.","file":"api/routers/_chat_shared.py","line":82,"params":["raw_messages"],"receives":"result['messages']","returns":"list[ChatMessage]","symbol":"api.routers._chat_shared:extract_chat_messages"}],"summary":"A chat session is a `chat_session` record linked to its notebook. The frontend builds the context it wants to send (sources at insight or full-text level, notes), then sends each message with that context. The message history is a LangGraph thread in a SQLite checkpoint file, not in SurrealDB. Source chat (POST /api/sources/{id}/chat/sessions/{sid}/messages, graphs.source_chat) follows the same pattern, but the server builds the context itself with build_source_context and streams the reply as SSE.","title":"Chat with a notebook","trigger":"POST /api/chat/sessions → POST /api/chat/context → POST /api/chat/execute"},{"actor":"user · web UI","id":"generate-podcast","steps":[{"action":"Takes the request body and passes it on to the podcast service. It returns at once with the job id and does not wait for any audio.","actor":"web UI","doc":"Generate a podcast episode using Episode Profiles. Returns immediately with job ID for status tracking.","file":"api/routers/podcasts.py","guards":[],"line":125,"params":["request"],"payload":"{\"episode_profile\": \"tech_discussion\", \"speaker_profile\": \"tech_experts\", \"episode_name\": \"Solar panels explained\", \"notebook_id\": \"notebook:k3x9\", \"briefing_suffix\": \"Keep it under ten minutes\"}\n\n\n","receives":"PodcastGenerationRequest: episode_profile (name), speaker_profile (name), episode_name, notebook_id or content, optional briefing_suffix","returns":"PodcastGenerationResponse {job_id, status: \"submitted\", message, episode_profile, episode_name}","stores":"nothing itself","symbol":"api.routers.podcasts:generate_podcast","urls":[["POST","/api/podcasts/generate"]]},{"action":"Checks the request before any work is queued. It loads the episode profile by name and resolves the speaker profile name to a record ID. If no text was sent, it builds the content from the notebook. Then it submits the `generate_podcast` command to surreal-commands.","doc":"Submit a podcast generation job for background processing","file":"api/podcast_service.py","line":37,"note":"The speaker name becomes a record ID here, at the API boundary (#630), so everything after this step works with IDs. The command module is imported just before submitting because submit_command checks the command against the local registry.","params":["episode_profile_name","speaker_profile_name","episode_name","notebook_id","content","briefing_suffix"],"payload":"{\"episode_profile\": \"tech_discussion\", \"speaker_profile\": \"speaker_profile:m81c\", \"episode_name\": \"Solar panels explained\", \"content\": \"# Source: Home solar guide\\n...\", \"briefing_suffix\": \"Keep it under ten minutes\"}\n\n\n","receives":"episode_profile_name, speaker_profile_name, episode_name, notebook_id, content, briefing_suffix","returns":"the command id as a string (e.g. \"command:7fq2\"). Any failure, including an unknown profile, becomes HTTP 500","stores":"a queued command record (written by the surreal_commands library)","symbol":"api.podcast_service:PodcastService.submit_generation_job","tables":["episode_profile","speaker_profile"]},{"action":"Looks up the episode profile by its unique name. The profile names the outline model, the transcript model, the default briefing and the number of segments.","doc":"Get episode profile by name","file":"open_notebook/podcasts/models.py","line":122,"params":["cls","name"],"receives":"name","returns":"EpisodeProfile or None","stores":"nothing (SELECT only)","symbol":"open_notebook.podcasts.models:EpisodeProfile.get_by_name","tables":["episode_profile"]},{"action":"Accepts a record ID (`speaker_profile:...`) or a plain name and returns the matching profile: 1 to 4 speakers, each with a voice_id, backstory and personality, plus the TTS voice model.","doc":"Resolve a speaker profile by record ID or by unique name.","file":"open_notebook/podcasts/models.py","line":200,"params":["cls","ref"],"receives":"ref: record ID or name","returns":"SpeakerProfile or None","stores":"nothing","symbol":"open_notebook.podcasts.models:SpeakerProfile.resolve","tables":["speaker_profile"]},{"action":"Builds one long text from the notebook: each source's full text and insights, then each note's content. Plain list calls leave these large fields out, so this method asks for them explicitly.","doc":"Build long-form notebook context for podcast and LLM workflows.","file":"open_notebook/domain/notebook.py","line":74,"note":"If loading the notebook fails, the service only logs a warning and uses the text \"Notebook ID: <id>\" as the content. The podcast would then be about an id string.","params":["self"],"receives":"the Notebook (loaded by id)","returns":"a single formatted string","stores":"nothing","symbol":"open_notebook.domain.notebook:Notebook.get_context"},{"action":"The worker picks up the job and loads both profiles again. It refuses to start if the outline, transcript or voice model is not set. It then loads every episode and speaker profile, because podcast-creator validates the whole set. Profiles whose speaker or model cannot be resolved are dropped.","actor":"surreal-commands worker","doc":"Real podcast generation using podcast-creator library with Episode Profiles","file":"commands/podcast_commands.py","line":66,"note":"retry max_attempts is 1. A ValueError (bad config) is re-raised as-is. Any other error becomes a RuntimeError, with an extra hint when the model returned JSON it could not parse.","params":["input_data"],"receives":"PodcastGenerationInput {episode_profile, speaker_profile (record ID), episode_name, content, briefing_suffix, execution_context.command_id}","returns":"PodcastGenerationOutput {success, episode_id, audio_file_path, transcript, outline, processing_time}","stores":"the episode row (next steps)","symbol":"commands.podcast_commands:generate_podcast_command","tables":["episode_profile","speaker_profile"]},{"action":"For each model record ID (outline, transcript, voice, and any per-speaker voice), loads the `model` row. If a credential is linked, it builds the provider config from it. If not, it copies the provider's DB credential into environment variables.","doc":"Load Model record, resolve credential -> (provider, model_name, config_dict).","file":"open_notebook/podcasts/models.py","line":11,"params":["model_id","max_tokens"],"payload":"(\"openai\", \"gpt-4o-mini\", {\"api_key\": \"sk-invented\", \"max_tokens\": 4000})\n\n\n","receives":"model_id, optional max_tokens","returns":"(provider, model_name, config_dict)","stores":"may set os.environ keys through provision_provider_keys","symbol":"open_notebook.podcasts.models:_resolve_model_config","tables":["model","credential"]},{"action":"Creates the `episode` record before any audio exists. It holds the name, frozen copies of both profiles, the full briefing (default briefing plus suffix), the content, and a link to the running command.","doc":"Save the model to the database.","file":"open_notebook/domain/base.py","line":148,"note":"Because the episode is saved first, the episode list can show it while the job runs, through its command link.","params":["self"],"payload":"{\"name\": \"Solar panels explained\", \"episode_profile\": {\"name\": \"tech_discussion\", \"num_segments\": 5}, \"speaker_profile\": {\"name\": \"tech_experts\"}, \"briefing\": \"Create an engaging discussion...\\n\\nAdditional instructions: Keep it under ten minutes\", \"command\": \"command:7fq2\", \"audio_file\": null}\n\n\n","receives":"PodcastEpisode with audio_file, transcript and outline set to None","returns":"the saved episode with an id","stores":"a new episode row","symbol":"open_notebook.domain.base:ObjectModel.save","tables":["episode"]},{"action":"Picks a new output folder named with a UUID under PODCASTS_FOLDER/episodes. Whatever the user typed as the episode name never becomes part of a path. podcast-creator's `create_podcast` then writes the outline, the transcript and the audio clips into this folder, using the LLM and TTS models from the resolved configs.","doc":"Build a filesystem-safe output directory path for a podcast episode.","file":"commands/podcast_commands.py","line":27,"params":["podcasts_folder"],"receives":"PODCASTS_FOLDER","returns":"(episode_dir_name, output_dir Path)","stores":"creates the directory on disk","symbol":"commands.podcast_commands:build_episode_output_dir"},{"action":"Turns the final audio path from podcast-creator into a path relative to PODCASTS_FOLDER. It refuses a path that would escape that folder. The episode is then saved again with audio_file, transcript and outline.","doc":"Convert a generated audio file path to the DB storage form.","file":"open_notebook/podcasts/audio_paths.py","line":39,"note":"podcast-creator reports a failure to combine the audio inside its result, as an \"ERROR: ...\" string. The command checks for it first, saves the transcript and outline anyway, and then fails the job with the real error, so an episode with no audio is never reported as a success.","params":["audio_path"],"receives":"final_output_file_path from create_podcast","returns":"a POSIX relative path, e.g. \"episodes/0b6f.../0b6f....mp3\"","stores":"the updated episode row (audio_file, transcript, outline)","symbol":"open_notebook.podcasts.audio_paths:to_relative_audio_path","tables":["episode"]}],"summary":"The API checks the episode and speaker profiles, turns the notebook into one long text, and queues a `generate_podcast` command, so the request returns a job id right away. A worker then looks up the outline, transcript and voice models with their credentials, gives everything to the podcast-creator library, and saves the transcript, outline and the audio file path on an `episode` row.","title":"Generate a podcast episode from a notebook","trigger":"POST /api/podcasts/generate"},{"actor":"user · web UI","id":"search","steps":[{"action":"Checks the notebook scope and then picks the path from `type`. A vector search is refused with 400 if no default embedding model is set.","actor":"web UI","doc":"Search the knowledge base using text or vector search.","file":"api/routers/search.py","guards":[],"line":26,"params":["search_request"],"payload":"{\"query\": \"inverter warranty\", \"type\": \"vector\", \"limit\": 20, \"search_sources\": true, \"search_notes\": true, \"minimum_score\": 0.3, \"scope_notebook_ids\": [\"notebook:k3x9\"]}\n\n\n","receives":"SearchRequest {query, type: text|vector, limit 1–1000 (default 100), search_sources, search_notes, minimum_score 0–1 (default 0.2), scope_notebook_ids}","returns":"SearchResponse {results[], total_count, search_type}. InvalidInputError → 400, NotFoundError → 404, DatabaseOperationError → 500","stores":"nothing","symbol":"api.routers.search:search_knowledge_base","urls":[["POST","/api/search"]]},{"action":"Accepts only ids of the form `notebook:<key>` and checks with one query that every one of them exists. An empty scope means search everywhere.","doc":"Validate a notebook scope before it reaches text_search / vector_search.","file":"open_notebook/domain/notebook.py","line":771,"note":"This check runs before the search so that a source or note id fails here with a clear error, instead of failing inside SurrealDB's typed record<notebook> parameter.","params":["notebook_ids"],"receives":"scope_notebook_ids (list of strings, may be empty)","returns":"the same list, or [] for a global search. Raises InvalidInputError (bad id) or NotFoundError (missing notebook)","stores":"nothing","symbol":"open_notebook.domain.notebook:resolve_notebook_scope","tables":["notebook"]},{"action":"Reads the default embedding model from the default-models record and builds it through ModelManager.get_model (credential config → esperanto AIFactory.create_embedding).","doc":"Get the default embedding model","file":"open_notebook/ai/models.py","line":315,"params":["self","**kwargs"],"receives":"–","returns":"an esperanto EmbeddingModel, or None if no default is set","stores":"nothing","symbol":"open_notebook.ai.models:ModelManager.get_embedding_model","tables":["model"]},{"action":"Embeds the query and calls `fn::vector_search`. That function scores `source_embedding` chunks, `source_insight` rows and `note` rows by cosine similarity, filters them by minimum_score and the notebook scope, and groups the hits by record. The rows are sorted again by similarity in Python.","doc":"","file":"open_notebook/domain/notebook.py","line":884,"note":"The sort is repeated in Python because the `SELECT * FROM fn::...` wrapper can return rows out of rank order, even though the function itself orders by similarity.","params":["keyword","results","source","note","minimum_score","notebook_ids"],"payload":"[{\"id\": \"source_embedding:a1\", \"parent_id\": \"source:s7\", \"title\": \"Home solar guide\", \"similarity\": 0.81, \"matches\": [\"The inverter carries a 10-year warranty...\"]}]\n\n\n","receives":"keyword, results, source, note, minimum_score, notebook_ids","returns":"list of {id, parent_id, title, similarity, matches[]}, best first","stores":"nothing","symbol":"open_notebook.domain.notebook:vector_search","tables":["source_embedding","source_insight","note","reference","artifact"]},{"action":"Embeds a short query in one call. A query longer than CHUNK_SIZE tokens is split into chunks, each chunk is embedded, and the vectors are averaged (mean pooling).","doc":"Generate a single embedding for text, handling large content via chunking and mean pooling.","file":"open_notebook/utils/embedding.py","line":204,"params":["text","content_type","file_path","command_id"],"receives":"text","returns":"one vector (list of floats)","stores":"nothing","symbol":"open_notebook.utils.embedding:generate_embedding"},{"action":"Sends the text to the provider through `embedding_model.aembed`, in batches of EMBEDDING_BATCH_SIZE. Each batch is retried up to EMBEDDING_MAX_RETRIES times.","doc":"Generate embeddings for multiple texts with automatic batching and retry.","file":"open_notebook/utils/embedding.py","line":106,"params":["texts","command_id"],"receives":"texts[]","returns":"list of vectors, one per text. Raises ValueError if no model is configured, RuntimeError once the retries run out","stores":"nothing","symbol":"open_notebook.utils.embedding:generate_embeddings"},{"action":"The text path. It calls `fn::text_search`, which runs BM25 matches (`@1@`) over source titles, source full text, embedded chunks, insights, note titles and note content. Each hit gets a highlighted snippet, and the results are merged into one list by relevance.","doc":"","file":"open_notebook/domain/notebook.py","line":830,"note":"SurrealDB's search::highlight can fail with \"position overflow\" on large or multi-byte chunks. In that case the function falls back to vector_search (issue #648), and it raises only if that fallback fails too, so a total outage does not look like zero results.","params":["keyword","results","source","note","notebook_ids"],"payload":"[{\"id\": \"source:s7\", \"parent_id\": \"source:s7\", \"title\": \"Home solar guide\", \"relevance\": 4.2}]\n\n\n","receives":"keyword, results, source, note, notebook_ids","returns":"list of {id, parent_id, title, relevance}","stores":"nothing","symbol":"open_notebook.domain.notebook:text_search","tables":["source","source_embedding","source_insight","note","reference","artifact"]}],"summary":"A query runs either as SurrealDB full-text search (BM25 with highlights) or as a vector search. The vector search first turns the query into an embedding with the default embedding model. Both call one SurrealQL function, can be limited to chosen notebooks, and return one ranked list of matches from sources, source insights and notes.","title":"Search sources and notes","trigger":"POST /api/search"},{"actor":"admin · web UI (Settings → Models)","id":"configure-models","steps":[{"action":"Refuses the request if OPEN_NOTEBOOK_ENCRYPTION_KEY is not set (require_encryption_key). It checks every URL field with validate_url, then builds and saves a Credential.","actor":"web UI","doc":"Create a new credential.","file":"api/routers/credentials.py","guards":[],"line":169,"params":["request"],"payload":"{\"name\": \"Team OpenAI\", \"provider\": \"openai\", \"modalities\": [\"language\", \"embedding\"], \"api_key\": \"sk-invented-123\"}\n\n\n","receives":"CreateCredentialRequest {name, provider, modalities[], api_key, base_url, endpoint*, api_version, project, location, credentials_path, num_ctx}","returns":"201 CredentialResponse (never includes api_key) with linked model count 0","stores":"a credential row (next step)","symbol":"api.routers.credentials:create_credential","tables":["credential"],"urls":[["POST","/api/credentials/"]]},{"action":"Saves the credential. Its _prepare_save_data encrypts the API key with Fernet (encrypt_value) and moves extra fields such as num_ctx into the `config` object. After the save, the in-memory key is put back as a SecretStr.","doc":"Save credential, handling api_key re-hydration after DB round-trip.","file":"open_notebook/domain/credential.py","line":266,"params":["self"],"payload":"{\"name\": \"Team OpenAI\", \"provider\": \"openai\", \"api_key\": \"gAAAAAB...invented-ciphertext\", \"config\": null}\n\n\n","receives":"Credential with api_key as SecretStr","returns":"the saved Credential with an id","stores":"credential row: provider, modalities, encrypted api_key, URLs, config","symbol":"open_notebook.domain.credential:Credential.save","tables":["credential"]},{"action":"Loads the credential, turns it into an esperanto config with to_esperanto_config, and asks the provider for its models.","doc":"Discover available models using this credential's API key.","file":"api/routers/credentials.py","guards":[],"line":433,"params":["credential_id"],"receives":"credential_id","returns":"DiscoverModelsResponse {credential_id, provider, discovered[{name, provider, description}]}","stores":"nothing","symbol":"api.routers.credentials:discover_models_for_credential","tables":["credential"],"urls":[["POST","/api/credentials/{credential_id}/discover"]]},{"action":"Lists the provider's models with this credential's key. A provider without a listing API uses a fixed list (voyage, elevenlabs, deepgram). The others call the provider's /models endpoint or esperanto. Only model names come back; the admin picks each model's type when registering.","doc":"Discover models using explicit config instead of env vars.","file":"api/credentials_service.py","line":400,"params":["provider","config"],"payload":"[{\"name\": \"gpt-4o-mini\", \"provider\": \"openai\"}, {\"name\": \"text-embedding-3-small\", \"provider\": \"openai\"}]\n\n\n","receives":"provider, config {api_key, base_url, ...}","returns":"list of {name, provider, description?}","stores":"nothing","symbol":"api.credentials_service:discover_with_config"},{"action":"Takes the models the admin ticked, each with a chosen type, and passes them to the service.","actor":"web UI","doc":"Register discovered models and link them to this credential.","file":"api/routers/credentials.py","guards":[],"line":465,"params":["credential_id","request"],"payload":"{\"models\": [{\"name\": \"gpt-4o-mini\", \"provider\": \"openai\", \"model_type\": \"language\"}, {\"name\": \"text-embedding-3-small\", \"provider\": \"openai\", \"model_type\": \"embedding\"}]}\n\n\n","receives":"credential_id, RegisterModelsRequest {models[{name, provider, model_type}]}","returns":"RegisterModelsResponse {created, existing}","stores":"model rows (next step)","symbol":"api.routers.credentials:register_models_for_credential","urls":[["POST","/api/credentials/{credential_id}/register-models"]]},{"action":"Fetches the provider's existing (name, type) pairs in one query, skips pairs that already exist, and saves a new `model` row for each remaining pair, linked to this credential.","doc":"Register discovered models and link them to a credential.","file":"api/credentials_service.py","line":740,"note":"A model that already exists counts as `existing` and is not re-linked. If it was first registered without a credential, or with another one, it keeps that link.","params":["credential_id","models_data"],"receives":"credential_id, models_data","returns":"{created, existing}","stores":"new model rows with credential = this credential","symbol":"api.credentials_service:register_models","tables":["credential","model"]},{"action":"The other way in, without choosing a credential. It first copies the provider's first DB credential into environment variables, then runs the env-based discovery and registers everything it finds.","actor":"web UI","doc":"Sync models for a specific provider.","file":"api/routers/models.py","guards":[],"line":570,"params":["provider"],"receives":"provider (path)","returns":"ProviderSyncResponse {provider, discovered, new, existing}","stores":"model rows (via sync_provider_models)","symbol":"api.routers.models:sync_models","tables":["model"],"urls":[["POST","/api/models/sync/{provider}"]]},{"action":"Takes the oldest credential for the provider and writes its fields into os.environ: the key for simple providers, and the extra settings for vertex, azure and the *-compatible providers. Environment variables already set are left alone when the DB has no credential.","doc":"Provision environment variables from database for a specific provider.","file":"open_notebook/ai/key_provider.py","line":273,"note":"This changes the process environment, so the most recent provisioning wins for the whole process (open_notebook/AGENTS.md says the same).","params":["provider"],"receives":"provider","returns":"True if any variable was set from the DB","stores":"process environment variables (not the DB)","symbol":"open_notebook.ai.key_provider:provision_provider_keys","tables":["credential"]},{"action":"Runs the provider's discovery function, which reads the key from the environment and gives each model a type by name. It then saves a `model` row for every (name, type) pair not already stored.","doc":"Sync models for a provider: discover and optionally register in database.","file":"open_notebook/ai/model_discovery.py","line":908,"params":["provider","auto_register"],"receives":"provider, auto_register=True","returns":"(discovered_count, new_count, existing_count)","stores":"new model rows with no credential link","symbol":"open_notebook.ai.model_discovery:sync_provider_models","tables":["model"]},{"action":"Later, at call time, it chooses which model to use. If the content is over 105,000 tokens, it uses the large_context default. Otherwise it uses the explicit model_id, or else the default for the requested type. It checks that the result is a LanguageModel and converts it with to_langchain().","actor":"a LangGraph node (ask, chat, source_chat, transformation, prompt)","doc":"Returns the best model to use based on the context size and on whether there is a specific model being requested in Config. If context > 105_000, returns the large_context_model If model_id is specified in Config, returns that model Otherwise, returns the default model for the given type","file":"open_notebook/ai/provision.py","line":10,"note":"Content over the size limit overrides the model_id the user picked. The docstring states this on purpose.","params":["content","model_id","default_type","**kwargs"],"receives":"content, model_id or None, default_type (e.g. \"chat\", \"transformation\"), **kwargs such as max_tokens","returns":"a LangChain BaseChatModel. Raises ConfigurationError if nothing is configured or the model is not a language model","stores":"nothing","symbol":"open_notebook.ai.provision:provision_langchain_model","tables":["model"]},{"action":"Loads the `model` row and checks its type. If a credential is linked, it uses that credential's to_esperanto_config, after checking its URLs again. Otherwise it calls provision_provider_keys. Then it builds the client with AIFactory.create_language / create_embedding / create_speech_to_text / create_text_to_speech.","doc":"Get a model by ID. Esperanto will cache the actual model instance.","file":"open_notebook/ai/models.py","line":203,"note":"The DB stores provider names with underscores (openai_compatible), but esperanto expects hyphens, so the name is rewritten here. anthropic_compatible takes its own route through resolve_anthropic_compatible_config.","params":["self","model_id","**kwargs"],"payload":"AIFactory.create_language(model_name=\"gpt-4o-mini\", provider=\"openai\", config={\"api_key\": \"sk-invented-123\", \"max_tokens\": 2000})\n\n\n","receives":"model_id, **kwargs","returns":"an esperanto model instance (esperanto caches it)","stores":"nothing (may set os.environ via the fallback)","symbol":"open_notebook.ai.models:ModelManager.get_model","tables":["model","credential"]}],"summary":"An admin saves a provider credential, with the API key encrypted at rest, asks the provider which models it offers, and registers the chosen ones as `model` rows linked to that credential. Later, any graph that needs an LLM calls provision_langchain_model, which picks a `model` row, builds the client through esperanto's AIFactory with the credential's config, and hands back a LangChain chat model.","title":"Add a provider credential and register its models","trigger":"POST /api/credentials → POST /api/credentials/{id}/discover → POST /api/credentials/{id}/register-models (or POST /api/models/sync/{provider})"}],"keys":["api.auth:PasswordAuthMiddleware","api.auth:PasswordAuthMiddleware.__init__","api.auth:PasswordAuthMiddleware.dispatch","api.command_service:CommandService","api.command_service:CommandService.cancel_command_job","api.command_service:CommandService.get_command_status","api.command_service:CommandService.list_command_jobs","api.command_service:CommandService.submit_command_job","api.credentials_service:_migrate_provider_config_entries","api.credentials_service:_record_settled_outcome","api.credentials_service:_reencrypt_stored_value","api.credentials_service:check_env_configured","api.credentials_service:create_credential_from_env","api.credentials_service:credential_to_response","api.credentials_service:discover_with_config","api.credentials_service:discover_with_config.models_endpoint","api.credentials_service:ensure_provider_required_fields","api.credentials_service:get_default_modalities","api.credentials_service:get_env_status","api.credentials_service:get_provider_status","api.credentials_service:migrate_encryption_scheme","api.credentials_service:migrate_from_env","api.credentials_service:migrate_from_provider_config","api.credentials_service:register_models","api.credentials_service:require_encryption_key","api.credentials_service:test_credential","api.main:<module>","api.main:_cors_headers","api.main:_parse_cors_origins","api.main:_run_database_migrations","api.main:_wait_for_database","api.main:authentication_error_handler","api.main:configuration_error_handler","api.main:custom_http_exception_handler","api.main:external_service_error_handler","api.main:health","api.main:invalid_input_error_handler","api.main:lif king one real, tiny call of the right kind.","result_use":"Shown on the Models page.","symbols":["open_notebook.ai.connection_tester:test_individual_model","api.routers.models:test_model"],"validation":"Exceptions mapped to readable messages by _normalize_error_message (rate limit counts as reachable)."},{"_locs":[{"doc":"Get a model by ID. Esperanto will cache the actual model instance.","file":"open_notebook/ai/models.py","line":203,"params":["self","model_id","**kwargs"],"symbol":"open_notebook.ai.models:ModelManager.get_model"},{"doc":"Get the default model for a specific type.","file":"open_notebook/ai/models.py","line":327,"params":["self","model_type","**kwargs"],"symbol":"open_notebook.ai.models:ModelManager.get_default_model"},{"doc":"Get the default embedding model","file":"open_notebook/ai/models.py","line":315,"params":["self","**kwargs"],"symbol":"open_notebook.ai.models:ModelManager.get_embedding_model"},{"doc":"Returns the best model to use based on the context size and on whether there is a specific model being requested in Config. If context > 105_000, returns the large_context_model If model_id is specified in Config, returns that model Otherwise, returns the default model for the given type","file":"open_notebook/ai/provision.py","line":10,"params":["content","model_id","default_type","**kwargs"],"symbol":"open_notebook.ai.provision:provision_langchain_model"},{"doc":"Test connection using a credential's configuration.","file":"api/credentials_service.py","line":250,"params":["credential_id"],"symbol":"api.credentials_service:test_credential"}],"config":"Model table (name, provider, type, credential); DefaultModels record open_notebook:default_models (default_chat_model, default_transformation_model, default_tools_model, large_context_model, default_embedding_model, default_speech_to_text_model, default_text_to_speech_model). Keys: the linked Credential, else the provider's env var (OPENAI_API_KEY, ANTHROPIC_API_KEY, … from key_provider.PROVIDER_CONFIG).","cost":"not measured — no token or price accounting anywhere in the code.","id":"model-gateway","input":"A model id chosen by the user, or a role name ('chat', 'transformation', 'tools', 'embedding', 'large_context', …) looked up in the DefaultModels record.","kind":"model","logging":"loguru debug names the chosen model and the reason (large_context / explicit id / default).","message":["(no prompt of its own — each role card below lists its messages)"],"name":"Model gateway (ModelManager + esperanto)","output":"An esperanto LanguageModel / EmbeddingModel / SpeechToTextModel / TextToSpeechModel, or a LangChain BaseChatModel.","purpose":"Every LLM, embedding, speech-to-text and text-to-speech call starts here: a Model record (name, provider, type, optional credential) is turned into an esperanto object by AIFactory; language models are then converted to a LangChain chat model by provision_langchain_model for the LangGraph graphs.","result_use":"The caller invokes the model; the graphs strip <think> content (clean_thinking_content) from every answer.","symbols":["open_notebook.ai.models:ModelManager.get_model","open_notebook.ai.models:ModelManager.get_default_model","open_notebook.ai.models:ModelManager.get_embedding_model","open_notebook.ai.provision:provision_langchain_model","api.credentials_service:test_credential"],"validation":"provision_langchain_model: content over 105,000 tokens switches to the large_context model; a missing model or a non-language model raises ConfigurationError pointing to Manage → Models. Credential URLs are re-validated right before use (_revalidate_config_urls) to narrow a DNS-rebinding window. 'transformation' and 'tools' fall back to the chat default; 'large_context' too."},{"_locs":[{"doc":"","file":"open_notebook/database/repository.py","line":86,"params":[],"symbol":"open_notebook.database.repository:db_connection"},{"doc":"Execute a SurrealQL query and return the results","file":"open_notebook/database/repository.py","line":101,"params":["query_str","vars"],"symbol":"open_notebook.database.repository:repo_query"},{"doc":"Create a new record in the specified table","file":"open_notebook/database/repository.py","line":121,"params":["table","data"],"symbol":"open_notebook.database.repository:repo_create"},{"doc":"Insert records in bounded batches using a single database connection.","file":"open_notebook/database/repository.py","line":219,"params":["table","data","ignore_duplicates","batch_size"],"symbol":"open_notebook.database.repository:repo_insert"},{"doc":"Update an existing record by table and id","file":"open_notebook/database/repository.py","line":181,"params":["table","id","data"],"symbol":"open_notebook.database.repository:repo_update"},{"doc":"Create or update a record in the specified table","file":"open_notebook/database/repository.py","line":168,"params":["table","id","data","add_timestamp"],"symbol":"open_notebook.database.repository:repo_upsert"},{"doc":"Create a relationship between two records with optional data","file":"open_notebook/database/repository.py","line":142,"params":["source","relationship","target","data"],"symbol":"open_notebook.database.repository:repo_relate"},{"doc":"Delete a record by record id","file":"open_notebook/database/repository.py","line":208,"params":["record_id"],"symbol":"open_notebook.database.repository:repo_delete"},{"doc":"Run all pending migrations.","file":"open_notebook/database/async_migrate.py","line":255,"params":["self"],"symbol":"open_notebook.database.async_migrate:AsyncMigrationManager.run_migration_up"}],"config":"SURREAL_URL (or the older SURREAL_ADDRESS + SURREAL_PORT), SURREAL_USER, SURREAL_PASSWORD (or SURREAL_PASS), SURREAL_NAMESPACE, SURREAL_DATABASE. ensure_internal_no_proxy() runs at import so the DB websocket bypasses any HTTP proxy.","cost":"not measured. No connection pool: each repo_* call pays a full connect + signin round trip (the code says so in Model.get_display_info_for_ids, which batches lookups for that reason).","id":"surrealdb","input":"SurrealQL strings with bound variables ($source, $target, $data …). Table and edge names cannot be bound, so repo_relate / repo_upsert / repo_update check them against an identifier allowlist (_ensure_safe_identifier) before interpolating. Vector and full-text search run as stored functions (fn::vector_search, fn::text_search) defined in the migrations.","kind":"record","logging":"loguru: conflicts at debug, other failures with logger.exception. Migrations log the version before and after.","message":["connect: AsyncSurreal(url) over WebSocket, a new connection per call (db_connection opens, signs in, selects namespace + database, closes)","signin: username + password","use: namespace, database","query / insert / delete: one statement per repo_* call; repo_insert sends rows in batches of 50 on one connection"],"name":"SurrealDB (all application data)","output":"Rows as dicts; parse_record_ids turns every RecordID into a 'table:id' string. A string result is treated as an error message and raised as RuntimeError (repo_query, repo_create, repo_insert).","purpose":"The single database for notebooks, sources, notes, insights, embeddings, models, credentials, chat sessions and the background-command queue. Every read and write goes through a handful of repo_* functions in open_notebook.database.repository, so the domain classes never talk to the SurrealDB SDK directly.","result_use":"Domain classes (ObjectModel / RecordModel in open_notebook.domain.base) wrap the rows into Pydantic objects; routers return them as JSON.","symbols":["open_notebook.database.repository:db_connection","open_notebook.database.repository:repo_query","open_notebook.database.repository:repo_create","open_notebook.database.repository:repo_insert","open_notebook.database.repository:repo_update","open_notebook.database.repository:repo_upsert","open_notebook.database.repository:repo_relate","open_notebook.database.repository:repo_delete","open_notebook.database.async_migrate:AsyncMigrationManager.run_migration_up"],"validation":"No retry in the repository itself. Transaction conflicts surface as RuntimeError and are retried one level up by the surreal-commands retry policy of the background command that caused them. Schema changes: 25 numbered .surrealql files (plus _down files) listed in AsyncMigrationManager; the API lifespan waits for the DB to answer (_wait_for_database, exponential back-off) and then runs every pending migration, recording each in the _sbl_migrations table."},{"_locs":[{"doc":"","file":"open_notebook/graphs/chat.py","line":30,"params":["state","config"],"symbol":"open_notebook.graphs.chat:call_model_with_messages"},{"doc":"Main function that builds source context and calls the model.","file":"open_notebook/graphs/source_chat.py","line":48,"params":["state","config"],"symbol":"open_notebook.graphs.source_chat:call_model_with_source_context"}],"config":"LANGGRAPH_CHECKPOINT_FILE in open_notebook.config (a fixed path under ./data/sqlite-db), not an env var.","cost":"not measured","id":"chat-checkpoints","input":"The graph state after each turn: messages (with the new AI message), plus context fields for source chat.","kind":"record","logging":"None of its own.","message":["write: checkpoint per graph step, keyed by thread_id","read: graph.get_state(thread_id) when a session is opened or a message is appended"],"name":"Chat history (LangGraph SQLite checkpoints)","output":"The saved state, from which the routers read messages and context_indicators.","purpose":"Chat and source-chat message histories are not stored in SurrealDB: both compiled graphs use a LangGraph SqliteSaver, keyed by thread_id = the chat session id. SurrealDB only holds the chat_session record (title, model_override, link to the notebook or source).","result_use":"api.routers.chat and api.routers.source_chat read the checkpoint to list messages and count them per session.","symbols":["open_notebook.graphs.chat:call_model_with_messages","open_notebook.graphs.source_chat:call_model_with_source_context"],"validation":"Both chat nodes raise IncompleteGenerationError on an empty reply before returning, so a blank AI message is never checkpointed and replayed later (comment in the code)."},{"_locs":[{"doc":"Submit a generic command job for background processing","file":"api/command_service.py","line":11,"params":["module_name","command_name","command_args","context"],"symbol":"api.command_service:CommandService.submit_command_job"},{"doc":"Get status of any command job","file":"api/command_service.py","line":47,"params":["job_id"],"symbol":"api.command_service:CommandService.get_command_status"},{"doc":"Process source content using the source_graph workflow","file":"commands/source_commands.py","line":60,"params":["input_data"],"symbol":"commands.source_commands:process_source_command"},{"doc":"Run a transformation on an existing source to generate an insight.","file":"commands/source_commands.py","line":200,"params":["input_data"],"symbol":"commands.source_commands:run_transformation_command"},{"doc":"Generate and store embeddings for a source document.","file":"commands/embedding_commands.py","line":305,"params":["input_data"],"symbol":"commands.embedding_commands:embed_source_command"},{"doc":"Generate and store embedding for a single note.","file":"commands/embedding_commands.py","line":221,"params":["input_data"],"symbol":"commands.embedding_commands:embed_note_command"},{"doc":"Generate and store embedding for a single source insight.","file":"commands/embedding_commands.py","line":263,"params":["input_data"],"symbol":"commands.embedding_commands:embed_insight_command"},{"doc":"Create a source insight with automatic retry on transaction conflicts.","file":"commands/embedding_commands.py","line":425,"params":["input_data"],"symbol":"commands.embedding_commands:create_insight_command"},{"doc":"Rebuild embeddings for sources, notes, and/or insights.","file":"commands/embedding_commands.py","line":624,"pa
